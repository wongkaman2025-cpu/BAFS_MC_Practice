<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body><div id="out">Testing half2...</div><script>var o=document.getElementById("out");try{var Q=[{q:1,year:2019,y:2019,top:"營商環境 —— 企業擁有權類型（獨資與普通合夥之對比）",topEn:"Business Environment —— Forms of Business Ownership (Sole Proprietorship vs. General Partnership)",cn:"1. 下列哪項是獨資與普通合夥的分別？\n\n| | | 獨資 | 普通合夥 |\n| :--- | :--- | :--- | :--- |\n| (1) | 決策過程 | 較短 | 較長 |\n| (2) | 利得稅率 | 較低 | 較高 |\n| (3) | 債務責任 | 無限 | 有限 |\n\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"1. Which of the following is/are difference(s) between a sole proprietorship and a general partnership?\n\n| | | Sole proprietorship | General partnership |\n| :--- | :--- | :--- | :--- |\n| (1) | Decision-making process | shorter | longer |\n| (2) | Profits tax rate | lower | higher |\n| (3) | Liability borne | unlimited | limited |\n\nA. (1) only\nB. (1) and (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"76%",exCn:"(1) 正確：獨資企業只有一位東主，決策無須協商，決策過程較短；普通合夥有多位合夥人共同經營，決策需要共同磋商，決策過程較長。\n(2) 錯誤：在香港，獨資與合夥企業（非法團）適用相同的標準利得稅率（標準稅率為15%），並無高低之分。\n(3) 錯誤：獨資東主與普通合夥人皆須承擔無限債務責任。\n因此僅有 (1) 正確，選 A。",exEn:"(1) Correct: A sole proprietorship has only one owner, so the decision-making process is shorter; a general partnership has multiple partners, requiring joint consultation, so the decision-making process is longer.\n(2) Incorrect: In Hong Kong, sole proprietorships and partnerships (unincorporated businesses) are subject to the same standard profits tax rate (standard rate of 15%), so there is no difference.\n(3) Incorrect: Both sole proprietors and general partners bear unlimited liability.\nTherefore, only (1) is correct, making A the correct answer."},
{q:2,year:2019,y:2019,top:"基礎會計 —— 會計假設、原則及慣例",topEn:"Introductory Accounting —— Accounting Assumptions, Principles and Conventions",outc:true,reason:"自 2025 年起，會計假設、原則及慣例的具體分錄及應用，已全數歸入選修部分（會計單元）Paper 2A。",reasonEn:"Starting from 2025, the application of accounting principles and assumptions is tested in Elective Module Paper 2A.",cn:"2. 根據會計假設、原則及慣例，下列哪項會計處理是正確的？\n\nA. 某獨資東主將其個人的租金費用記錄在商號的帳冊內。\nB. 陳先生擁有三家商號，他為每家商號保存個別的會計記錄。\nC. 如果預期企業將於下月停止營運，所有資產均按現時市場價格計值。\nD. 除非新方法可以帶來更高利潤，否則已採用的會計方法就不應改變。",en:"2. According to accounting assumptions, principles and conventions, which of the following accounting treatments is correct?\n\nA. A sole proprietor records his own rental expenses in the books of the firm.\nB. Mr Chan owns three businesses and maintains separate accounting records for each of them.\nC. If a business is expected to close down next month, all assets are valued at their current market price.\nD. Once adopted, an accounting method should not be changed unless the new method can bring more profit.",ans:"B",rate:"73%",exCn:"A 錯誤：根據企業個體觀念（Business Entity Concept），東主私人費用不得記入企業帳冊，應列作提用。\nB 正確：企業個體觀念指出，每個企業在會計上均為獨立的個體。即使屬同一東主，不同商號亦必須分開開設個別的會計記錄。\nC 錯誤：若企業預期停止營運，違背了繼續經營假設，此時資產應以可變現淨值（Net Realizable Value / Liquidation Value）而非簡單的「市場價格」計值。\nD 錯誤：會計方法一經採用不應隨意更改，但若改變能「更真確及公允反映財務狀況」則允許更改，而非為了「帶來更高利潤」。",exEn:"A Incorrect: According to the business entity concept, the owner's personal expenses should not be recorded in the firm's books and should be treated as drawings.\nB Correct: The business entity concept states that a business is a separate entity from its owner and other businesses. Even if they have the same owner, separate accounting records must be maintained for each business.\nC Incorrect: If a business is expected to close down, the going concern assumption is violated, and assets should be valued at their net realisable value / liquidation value instead of the current market price.\nD Incorrect: Under the consistency principle, once adopted, an accounting method should not be changed unless the change can provide a true and fair view of the financial positions, not just to bring more profit."},
{q:3,year:2019,y:2019,top:"基礎管理 —— 管理功能（目標管理）",topEn:"Basics of Management —— Management Functions (Management by Objectives)",outc:true,reason:"根據 2025 最新考綱要求，目標管理（MBO）的特點及應用已被完全移出文憑試必修考核範圍。",reasonEn:"Starting from 2025, the characteristics and application of Management by Objectives (MBO) are completely removed from the Compulsory Part (Paper 1) syllabus.",cn:"3. 下列哪項有關「目標管理」的陳述是正確的？\n\n(1) 它可提升員工士氣。\n(2) 它可促進上司與下屬的溝通。\n(3) 它讓上司專注較重要的工作。\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"3. Which of the following statements about 'management by objectives' is/are correct?\n\n(1) It can enhance employees' morale.\n(2) It can facilitate communication between superior and subordinates.\n(3) It allows superiors to focus on more important work.\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"68%",exCn:"(1) 正確：目標管理（MBO）鼓勵員工共同參與目標設定，能激勵下屬，提升其工作滿足感和士氣。\n(2) 正確：上司與下屬需共同商討與定時檢視進度，顯著促進了上下級之間的溝通。\n(3) 錯誤：目標管理在實際執行時，需耗費大量時間與人力進行會議、文書溝通和進度控管，會增加上級與下屬的工作負擔，並非直接「讓上司專注較重要工作」。",exEn:"(1) Correct: Management by objectives (MBO) encourages employee participation in goal setting, which motivates subordinates and enhances their morale and job satisfaction.\n(2) Correct: Superiors and subordinates jointly discuss and regularly review progress, which significantly improves communication.\n(3) Incorrect: MBO requires substantial time and effort for meetings, documentation, and progress monitoring, which increases the workload of both managers and subordinates rather than allowing managers to easily 'focus on more important work'."},
{q:4,year:2019,y:2019,top:"原始分錄帳簿及分類帳 —— 分類帳帳戶之過帳",topEn:"Books of Original Entry & Ledgers —— Posting to Ledger Accounts",outc:true,reason:"自 2025 年起，「複式記帳在分類帳上的記錄與結平（Double-entry Bookkeeping）」已全數移至選修部分（會計單元）第三章（Paper 2A）。",reasonEn:"Starting from 2025, ledger account postings, balancing off accounts, and double-entry bookkeeping are tested in Elective Module Paper 2A.",cn:"4. 以下帳戶摘錄自李氏商號的帳冊：\n\n區先生\n\n| 2018年 | 詳情 | $ | 2018年 | 詳情 | $ |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 10月14日 | 現金 | 22 000 | 10月1日 | 承上結餘 | 10 000 |\n| 10月31日 | 結餘轉下 | 44 000 | 10月5日 | 購貨 | 56 000 |\n| | | 66 000 | | | 66 000 |\n\n根據以上帳戶的資料，下列哪項陳述是不正確的？\n\nA. 2018年10月1日李氏商號欠區先生$10000。\nB. 2018年10月5日區先生向李氏商號賒銷貨品$56000。\nC. 2018年10月14日李氏商號從區先生收到現金$22000。\nD. 2018年10月31日這帳戶有貸方結餘。",en:"4. The following account is extracted from the books of Lee's firm:\n\nMr Au\n\n| 2018 | Particulars | $ | 2018 | Particulars | $ |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| Oct 14 | Cash | 22 000 | Oct 1 | Balance b/d | 10 000 |\n| Oct 31 | Balance c/d | 44 000 | Oct 5 | Purchases | 56 000 |\n| | | 66 000 | | | 66 000 |\n\nWhich of the following statements is/are incorrect?\n\nA. Lee's firm owed Mr Au $10 000 on 1 October 2018.\nB. Mr Au sold goods for $56 000 on credit to Lee's firm on 5 October 2018.\nC. Lee's firm received $22 000 in cash from Mr Au on 14 October 2018.\nD. This account has a credit balance on 31 October 2018.",ans:"C",rate:"52%",exCn:"A 正確：區先生在李氏商號帳冊內屬於「應付貨款」（債權人，負債類科目），期初有貸方餘額 $10,000，表示李氏商號期初欠其 $10,000。\nB 正確：10月5日貸記購貨 $56,000，代表李氏商號向其賒購了貨品。\nC 錯誤：10月14日「區先生」帳戶記入借方 $22,000，對應分錄為「借記：區先生（應付帳款減少）；貸記：現金（資產減少）」，這表示李氏商號以現金支付了 $22,000 予區先生（清還欠款），而非「收到現金」。故 C 陳述錯誤。\nD 正確：10月31日「結餘轉下」在借方，代表期末結餘承上在下一期初會回到貸方，屬於貸方結餘。",exEn:"A Correct: Mr Au is a trade payable (liability) in the books of Lee's firm. The opening balance of $10,000 on the credit side indicates that Lee's firm owed Mr Au $10,000.\nB Correct: On Oct 5, the account was credited with Purchases $56,000, meaning Lee's firm purchased goods on credit from Mr Au.\nC Incorrect: On Oct 14, the account was debited with Cash $22,000. This debit entry represents a decrease in the liability owed to Mr Au. The journal entry is 'Dr. Mr Au; Cr. Cash', which means Lee's firm paid $22,000 in cash to Mr Au, not received cash.\nD Correct: The balance c/d is on the debit side, meaning the balance b/d on the next period will start on the credit side, representing a credit balance."},
{q:5,year:2019,y:2019,top:"營商環境 —— 香港的經濟特徵",topEn:"Business Environment —— Economic Characteristics of Hong Kong",cn:"5. 下列哪項有關香港經濟的描述是正確的？\n\n(1) 對貨品零售徵收銷售稅。\n(2) 大多數勞動人口都是從事第三級產業。\n(3) 貨品出口的主要目的地是內地。\n\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"5. Which of the following descriptions about the Hong Kong economy is/are correct?\n\n(1) A sales tax is imposed on the retailing of goods.\n(2) Most of the working population are in the tertiary sector.\n(3) The main destination of exported goods is the Mainland.\n\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"D",rate:"67%",exCn:"(1) 錯誤：香港實行簡單稅制，目前沒有徵收任何商品零售增值稅或銷售稅（GST/VAT）。\n(2) 正確：香港是典型的服務型經濟體，超過 90% 的本地生產總值（GDP）和勞動人口均集中在第三級產業（服務業）。\n(3) 正確：中國內地是香港商品出口（特別是轉口貿易）的最主要來源地和第一大目的地。\n因此只有 (2) 和 (3) 正確，選 D。",exEn:"(1) Incorrect: Hong Kong is known for its simple and low tax system and does not impose any sales tax or value-added tax (GST/VAT) on retail goods.\n(2) Correct: Hong Kong is a service-oriented economy, with over 90% of its GDP and employment concentrated in the tertiary sector (service industry).\n(3) Correct: Mainland China is the largest trading partner and primary destination for Hong Kong's exported and re-exported goods.\nTherefore, (2) and (3) are correct, making D the correct answer."},
{q:6,year:2019,y:2019,top:"基礎會計 —— 商業交易對會計等式的影響",topEn:"Introductory Accounting —— Effects of Business Transactions on Accounting Equation",outc:true,reason:"自 2025 年起，會計等式的運算及交易事項對等式的影響，已全數移至選修部分（會計單元）第二章（Paper 2A）。",reasonEn:"Starting from 2025, the accounting equation and transaction effects are tested in the Accounting Elective Module Paper 2A.",cn:"6. 某商號購置一套定價$200000的設備。東主以私人支票支付了$50000，餘額將於稍後清還。下列哪項是這交易對會計等式的影響？\n\n| | 資產 | 資本 | 負債 |\n| :--- | :--- | :--- | :--- |\n| A. | 增加 | 增加 | 減少 |\n| B. | 增加 | 增加 | 增加 |\n| C. | 增加 | 減少 | 增加 |\n| D. | 減少 | 不變 | 增加 |",en:"6. A firm acquired a set of equipment with a list price of $200 000. The owner paid $50 000 by personal cheque and the remaining amount was to be settled later on. Which of the following are the effects of this transaction on the accounting equation?\n\n| | Assets | Capital | Liabilities |\n| :--- | :--- | :--- | :--- |\n| A. | Increase | Increase | Decrease |\n| B. | Increase | Increase | Increase |\n| C. | Increase | Decrease | Increase |\n| D. | Decrease | Unchanged | Increase |",ans:"B",rate:"64%",exCn:"我們套用會計等式：資產 = 資本 + 負債。\n1. 購置設備：設備（資產）增加 $200,000。\n2. 東主以「私人支票」支付 $50,000：這屬於東主對企業的額外注資，因此企業的資本（Capital）增加 $50,000。\n3. 餘額 $150,000 稍後清還：這屬於企業產生的「應付帳款 / 其他應付款」，因此負債（Liabilities）增加 $150,000。\n4. 最終淨影響：資產增加、資本增加、負債增加。會計等式兩邊完全平衡：+$200,000 資產 = +$50,000 資本 + +$150,000 負債。選 B。",exEn:"We apply the fundamental accounting equation: Assets = Capital + Liabilities.\n1. Acquisition of Equipment: Equipment (Asset) increases by $200,000.\n2. Paid $50,000 by owner's personal cheque: This represents a capital injection by the owner, increasing Capital by $50,000.\n3. The remaining balance of $150,000 is to be settled later: This creates a liability (Other Payables / Accounts Payable), increasing Liabilities by $150,000.\n4. Net Effect: Assets increase, Capital increases, and Liabilities increase. The accounting equation remains in perfect balance: +$200,000 (Assets) = +$50,000 (Capital) + +$150,000 (Liabilities). Thus, B is correct."},
{q:7,year:2019,y:2019,top:"基礎管理 —— 主要商業功能（財務管理之角色）",topEn:"Basics of Management —— Major Business Functions (Role of Finance Department)",cn:"7. 一家公司將在市場推出新產品，公司的財務經理負責：\n\n(1) 為新產品制定售價\n(2) 為推出新產品尋求資金\n(3) 為新產品編製預算\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"7. A company will launch a new product in the market. The finance manager of the company is responsible for:\n\n(1) formulating the price of the new product\n(2) raising funds for launching the new product\n(3) preparing budgets for the new product\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"67%",exCn:"(1) 錯誤：制定與微調新產品的市場零售價格（Price），屬於市場營銷（Marketing）部門的核心職掌，非財務經理之職責。\n(2) 正確：尋求與融資新產品開發及推廣所需的資金管道（籌資），屬於財務管理的核心工作。\n(3) 正確：編製資金收支預算、進行投資預算評估，是財務經理控制與規劃資金運用的重要職掌。\n因此 (2) 和 (3) 正確，選 C。",exEn:"(1) Incorrect: Formulating the price of a new product belongs to the marketing department (Price of the 4Ps), not the finance manager's responsibility.\n(2) Correct: Sourcing and acquiring the capital needed (financing/fundraising) to launch and develop a new product is a core function of the finance department.\n(3) Correct: Preparing budgets (budgetary control and planning) to coordinate cash flows is a key responsibility of financial managers.\nTherefore, (2) and (3) are correct, making C the correct answer."},
{q:8,year:2019,y:2019,top:"基礎個人理財 —— 消費者信貸（借貸利率的名義與實際利率對比）",topEn:"Basics of Personal Financial Management —— Consumer Credit (Nominal vs. Effective Interest Rates of Loans)",cn:"8. 保羅借入一筆$100000為期三年的私人貸款，年利率為12%，每月複息計算。下列哪項陳述是正確的？\n\n(1) 這貸款的名義年利率為12%。\n(2) 這貸款的實際年利率高於12%。\n(3) 一般來說，私人貸款的利率較信用卡的利率為低。\n\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"8. Paul borrowed a 3-year personal loan of $100 000 at an annual interest rate of 12% compounded monthly. Which of the following statements are correct?\n\n(1) The nominal interest rate of this loan is 12% per annum.\n(2) The effective interest rate of this loan is higher than 12% per annum.\n(3) Generally, the interest rate of personal loans is lower than that of credit cards.\n\nA. (1) only\nB. (1) and (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"38%",exCn:"(1) 正確：保羅所借私人貸款的合同名義利率（Nominal rate）為每年 12%。\n(2) 正確：由於計息頻率為「每月複息（Compounded monthly）」，利息會在一年內滾存計息，其折算後的實際年利率（Effective rate）為 EAR = (1 + 12%/12)^12 - 1 = (1.01)^12 - 1 約等於 12.68%，高於名義利率 12%。\n(3) 正確：信用卡的未償還欠款利率在實務中極高（年息通常高達 30% 以上），而私人貸款（Personal loan）利率則通常遠低於此。\n因此 (1)、(2) 和 (3) 正確，選 D。",exEn:"(1) Correct: The stated contract rate of 12% per annum is the nominal interest rate.\n(2) Correct: Since interest is compounded monthly, compounding occurs 12 times a year, yielding an Effective Annual Rate (EAR) of EAR = (1 + 12%/12)^12 - 1 = (1.01)^12 - 1 approximately equals 12.68%, which is higher than the nominal rate of 12%.\n(3) Correct: In personal finance, the interest rate of credit cards is very high (often exceeding 30% p.a.), while personal installment loans generally offer much lower rates.\nTherefore, (1), (2), and (3) are correct, making D the correct answer."},
{q:9,year:2019,y:2019,top:"營商環境 —— 商業道德與社會責任",topEn:"Business Environment —— Business Ethics and Social Responsibility",cn:"9. 下列哪項有關商業道德的陳述是正確的？\n\n(1) 法律上可接受的商業行為可能是不道德的。\n(2) 「專業操守」是政府為企業編製的。\n(3) 商業道德是企業應遵循的一套有明確定義的道德原則和標準。\n\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"9. Which of the following statements about business ethics are correct?\n\n(1) Business actions that are legally acceptable may be unethical.\n(2) A 'professional code of conduct' is compiled by the government for businesses.\n(3) Business ethics are a set of clearly-defined moral principles and standards that a business should follow.\n\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"A",rate:"48%",exCn:"(1) 正確：法律僅是最低的道德防綫。許多在法律上不違法的事項（如在缺乏法規規管下，利用合約灰色地帶或在合法範圍內欺瞞消費者），在道德上仍是不道德的。\n(2) 錯誤：專業操守或道德守則（Professional code of conduct）一般是由專業團體（如會計師公會、律師公會）或企業自身內部編製，而非由政府統一代為編製。\n(3) 錯誤：商業道德（Business ethics）是一套引導商業行為是否正確與公平的價值觀和理念，但在許多灰色地帶和文化脈絡下其定義相當含糊，並非一套對「所有企業」都具備「有明確定義（clearly-defined）」的絕對化硬性原則。\n因此僅有 (1) 正確，選 A。",exEn:"(1) Correct: Law defines the minimum acceptable standard. Many actions that are technically legal (such as exploiting tax loopholes or misleading consumers within legal boundaries) are considered highly unethical.\n(2) Incorrect: A professional code of conduct is typically compiled and issued by professional bodies (e.g., HKICPA) or by the company itself, rather than by the government.\n(3) Incorrect: Business ethics provide moral guidelines to judge right and wrong, but they are often subject to different cultural contexts and are not always a set of 'clearly-defined' or rigid principles applicable universally to all situations.\nTherefore, only (1) is correct, making A the correct answer."},
{q:10,year:2019,y:2019,top:"財務報表分析 —— 速動比率之推導計算",topEn:"Financial Ratio Analysis —— Calculating Trade Receivables via Quick Ratio",outc:true,reason:"自 2025 年起，會計比率的公式核算與財務分析（Financial Ratio Analysis），已全數移至選修部分（會計單元）第二十一章（Paper 2A）。",reasonEn:"Starting from 2025, accounting ratio formulas, computation, and liquidity analysis are tested in Elective Module Paper 2A.",cn:"10. 2018年12月31日某商號的速動比率為 0.8:1。同日，商號有帳戶結餘如下：\n\n| 項目 | $ |\n| :--- | :--- |\n| 存貨 | 6 000 |\n| 銀行貸款（2019年4月到期） | 10 000 |\n| 現金 | 30 000 |\n| 應付貨款 | 50 000 |\n\n根據以上資料，計算2018年12月31日應收貨款的數額。\n\nA. $4 000\nB. $10 000\nC. $12 000\nD. $18 000",en:"10. On 31 December 2018, the quick ratio of a firm was 0.8:1. On that date, the account balances of the firm were as follows:\n\n| Item | $ |\n| :--- | :--- |\n| Inventory | 6 000 |\n| Bank loan (repayable in April 2019) | 10 000 |\n| Cash | 30 000 |\n| Trade payables | 50 000 |\n\nBased on the above information, calculate the amount of trade receivables as at 31 December 2018.\n\nA. $4 000\nB. $10 000\nC. $12 000\nD. $18 000",ans:"D",rate:"55%",exCn:"1. 計算流動負債（Current Liabilities）：包含「應付貨款」$50,000 及「將於 2019年4月（12個月內）到期的短期銀行貸款」$10,000。流動負債總額 = $50,000 + $10,000 = $60,000。\n2. 套用速動比率公式：速動比率 = 速動資產 / 流動負債 = 0.8\n   速動資產 = 0.8 x $60,000 = $48,000。\n3. 計算應收貨款：速動資產不包含存貨。故速動資產 = 現金 + 應收貨款。\n   $48,000 = $30,000 + 應收貨款，應收貨款 = $18,000（選 D）。",exEn:"1. Calculate Current Liabilities: Includes Trade Payables ($50,000) and the Bank Loan maturing in April 2019 (within 1 year, so it is a current liability, $10,000). Total Current Liabilities = $50,000 + $10,000 = $60,000.\n2. Apply Quick (Acid Test) Ratio Formula: Quick Ratio = Quick Assets / Current Liabilities = 0.8\n   Quick Assets = 0.8 x $60,000 = $48,000.\n3. Calculate Trade Receivables: Quick assets exclude inventory. Thus, Quick Assets = Cash + Trade Receivables.\n   $48,000 = $30,000 + Trade Receivables, Trade Receivables = $18,000. Thus, D is correct."},
{q:11,year:2019,y:2019,top:"營商環境 —— 企業擁有權類型（合營企業）",topEn:"Business Environment —— Forms of Business Ownership (Joint Ventures)",outc:true,reason:"自 2025 年起，合營企業（Joint Ventures）的會計與管理特徵已全數歸入選修部分（會計單元）Paper 2A 的合夥會計與有限公司範疇。",reasonEn:"Starting from 2025, the characteristics and bookkeeping of Joint Ventures are tested in Elective Module Paper 2A (Partnership/Company Accounting).",cn:"11. 下列哪項有關合營企業的陳述是正確的？\n\n(1) 企業風險由合營企業合夥人共同承擔。\n(2) 在合作項目完成後，合營企業通常便解散。\n(3) 合營企業是由最少兩家企業組成的新企業個體。\n\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"11. Which of the following statements about joint ventures are correct?\n\n(1) Business risks are shared among joint venture partners.\n(2) A joint venture is usually dissolved upon the completion of the project.\n(3) A joint venture is a new business entity formed by at least two businesses.\n\nA. (1) only\nB. (1) and (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"75%",exCn:"(1) 正確：合營企業（Joint Venture）是由兩家或以上的公司共同投資創立的，因此商業上的營運風險及債務由所有合夥企業共同分擔。\n(2) 正確：合營企業通常具有很強的「項目導向」或時效性，當特定的合作工程或項目完成後，合營企業通常便會進行結算與解散。\n(3) 正確：合營企業在法律上通常是由最少兩家獨立法人或企業組成的新獨立企業個體。\n因此 (1)、(2) 和 (3) 正確，選 D。",exEn:"(1) Correct: A joint venture is formed by two or more existing businesses, meaning the operating risks and liabilities are shared among the venture partners.\n(2) Correct: Joint ventures are highly project-based and are usually dissolved once the specific project or contract is completed.\n(3) Correct: By definition, a joint venture is a new, separate business entity formed by at least two distinct businesses.\nTherefore, (1), (2), and (3) are correct, making D the correct answer."},
{q:12,year:2019,y:2019,top:"基礎會計 —— 流動負債之分類及等式變動",topEn:"Introductory Accounting —— Classification of Current Liabilities and Accounting Equation",outc:true,reason:"自 2025 年起，流動負債之劃分、商業交易對負債等式及會計科目的變動影響，已全數歸入選修部分（會計單元）第三章（Paper 2A）。",reasonEn:"Starting from 2025, the classification of liabilities and the effects of transactions on the accounting equation are tested in Elective Module Paper 2A.",cn:"12. 下列哪項會減少企業的流動負債總額？\n\n(1) 將一些尚未付款的貨品退回供應商\n(2) 使用銀行透支服務以償還應付貨款\n(3) 借入一筆為期三年的銀行貸款，以償還一筆為期六個月的貸款\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"12. Which of the following will decrease the total amount of current liabilities of a business?\n\n(1) some unpaid goods are returned to the supplier\n(2) trade payables are repaid using a bank overdraft facility\n(3) a 6-month loan is repaid by taking out a 3-year bank loan\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"72%",exCn:"(1) 正確：退回賒購的貨品，會直接減少應付帳款（應付貨款），從而減少流動負債總額。\n(2) 錯誤：以銀行透支（流動負債）來償付應付貨款（流動負債），只是一項流動負債轉化為另一項流動負債，流動負債總額不變。\n(3) 正確：以 3年期長期銀行貸款（非流動負債）償還 6個月期的短期借款（流動負債），使流動負債變為非流動負債，會減少流動負債總額。\n因此只有 (1) 和 (3) 正確，選 B。",exEn:"(1) Correct: Returning goods purchased on credit directly reduces Trade Payables (Current Liability), thereby reducing total current liabilities.\n(2) Incorrect: Settling trade payables (Current Liability) with a bank overdraft (Current Liability) merely replaces one current liability with another, leaving the total current liabilities unchanged.\n(3) Correct: Using a 3-year long-term bank loan (Non-current Liability) to pay off a 6-month short-term loan (Current Liability) shifts a current liability to a non-current liability, thereby reducing total current liabilities.\nTherefore, (1) and (3) are correct, making B the correct answer."},
{q:13,year:2019,y:2019,top:"中小型企業 —— 香港中小型企業的特徵",topEn:"Small and Medium Enterprises —— Characteristics of SMEs in Hong Kong",cn:"13. 下列哪項有關香港中小型企業（中小企）的陳述是正確的？\n\n(1) 它的僱員人數約佔香港總就業人數（不計公務員）的 80%。\n(2) 它可以有限公司營運。\n(3) 每家中小企的全年銷售收益不可多於五百萬元。\n\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"13. Which of the following statements about small and medium enterprises (SMEs) in Hong Kong is/are correct?\n\n(1) The number of employees accounts for around 80% of total employment (excluding civil service) in Hong Kong.\n(2) It can operate as a limited company.\n(3) The annual sales revenue of an SME must not exceed $5 million.\n\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"B",rate:"74%",exCn:"(1) 錯誤：香港中小型企業（SMEs）聘用了全港大約 45% - 50% 左右的私營機構僱員（不計公務員），而非 80%（80% 為誇大數據，雖然 SMEs 的數量佔全港企業總數達 98% 以上）。\n(2) 正確：中小型企業可以用任何企業擁有權類型營運，不限於獨資或合夥，完全可以用「私人有限公司」的形式運作。\n(3) 錯誤：香港政府對中小型企業（SMEs）的官方定義完全不設有任何銷售收益/營業額（Sales revenue）的上限限制，而是純粹根據「僱員人數」來界定（製造業少於100人；非製造業少於50人）。\n因此僅有 (2) 正確，選 B。",exEn:"(1) Incorrect: In Hong Kong, SMEs collectively employ around 45% to 50% of the private sector workforce (excluding civil service), not 80% (although SMEs constitute over 98% of total local business establishments).\n(2) Correct: SMEs can operate under any form of business ownership, including sole proprietorships, partnerships, or private limited companies.\n(3) Incorrect: The HKSAR Government's official definition of an SME is strictly based on the number of employees (fewer than 100 for manufacturing and fewer than 50 for non-manufacturing), and contains no restrictions on annual sales revenue.\nTherefore, only (2) is correct, making B the correct answer."},
{q:14,year:2019,y:2019,top:"不同企業擁有權類型的財務報告編製 —— 財務狀況表（資產類別確認）",topEn:"Financial Reporting —— Statement of Financial Position (Classification of Assets)",outc:true,reason:"自 2025 年起，財務狀況表（Statement of Financial Position）與資產負債科目的確認分類，已全數移至選修部分（會計單元）第七章（Paper 2A）。",reasonEn:"Starting from 2025, the preparation and account classification of the Statement of Financial Position are tested in Elective Module Paper 2A.",cn:"14. 對一家銷售辦公室設備的獨資商號來說，下列哪項有關它的財務狀況表的陳述是正確的？\n\nA. 待售的辦公室設備應分類為流動資產。\nB. 這報表顯示本年度交易的詳細資料。\nC. 這報表顯示該商號的虛帳戶和實帳戶結餘。\nD. 營運資金是非流動資產與非流動負債的差額。",en:"14. For a sole proprietorship selling office equipment, which of the following statements about its statement of financial position is correct?\n\nA. The office equipment for sale should be classified as current assets.\nB. This statement shows the detailed transactions of the year.\nC. This statement shows the balances of nominal accounts and real accounts of the firm.\nD. Working capital is the difference between non-current assets and non-current liabilities.",ans:"A",rate:"58%",exCn:"A 正確：對該商號來說，其主營業務即是「銷售辦公室設備」，因此「待售的設備」本質上是該企業旨在轉售的商品，屬於「存貨（Inventory）」，在財務狀況表（資產負債表）中應列作「流動資產（Current Assets）」。\nB 錯誤：財務狀況表反映的是企業在「特定結算日」的期末餘額（靜態財務狀況），而非全年度交易的詳細動態資料（那是日記簿與分類帳的工作）。\nC 錯誤：財務狀況表只反映「實帳戶（資產、負債、資本）」，所有的「虛帳戶（費用、收益）」在期末均已被結轉至損益帳以計算利潤，不會出現在財務狀況表上。\nD 錯誤：營運資金（Working Capital）是流動資產減流動負債的差額，而非非流動資產與負債的差額。",exEn:"A Correct: Since the firm's core business is 'selling office equipment', the 'equipment for sale' constitutes its trading goods, which is classified as inventory. Therefore, it must be reported as current assets in the Statement of Financial Position (SFP).\nB Incorrect: The SFP presents the financial position of an entity at a 'specific point in time' (static balance), not the detailed transactions throughout the year.\nC Incorrect: The SFP only displays 'real accounts' (assets, liabilities, capital). 'Nominal accounts' (revenues, expenses) are closed to the P&L account and do not appear on the SFP.\nD Incorrect: Working capital is defined as current assets minus current liabilities, not the difference between non-current assets and non-current liabilities."},
{q:15,year:2019,y:2019,top:"基礎個人理財 —— 證券交易（主板上市財務測試要求）",topEn:"Basics of Personal Financial Management —— Stock Trading (Main Board Listing Tests)",outc:true,reason:"自 2025 年文憑試起，必修個人理財考綱明確規定「以證券交易作投資：不包括主板及創業板新申請人的基本上市要求」。",reasonEn:"Starting from 2025, the specific basic listing requirements for new applicants on the Main Board and GEM are explicitly excluded from the Compulsory Part (Paper 1) syllabus.",cn:"15. 下列哪項有關新申請人在主板上市的基本要求的陳述是正確的？\n\n(1) 申請人必須符合營運歷史的要求。\n(2) 申請人必須是跨國公司。\n(3) 申請人必須符合以下其中一個要求：盈利測試、市值/收益測試、或市值/收益/現金流量測試。\n\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. (1)、(2)及(3)",en:"15. Which of the following statements about the basic requirements for new applicants of listing on the Main Board is/are correct?\n\n(1) Applicants must fulfil the requirement in operating history.\n(2) Applicants must be multinational corporations.\n(3) Applicants must meet one of the following criteria: the profit test, the market capitalisation/revenue test, or the market capitalisation/revenue/cash flow test.\n\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"65%",exCn:"(1) 正確：新上市申請人在主板上市必須符合至少三年（或特定年期）營運歷史（Operating history）的法定基本要求。\n(2) 錯誤：香港上市公司不論規模，均無規定必須是「跨國公司（MNCs）」，許多本地或內地大型單一市場企業均符合主板上市要求。\n(3) 正確：港交所主板設有三大平行的財務測試，新上市申請人只要符合其中任何一個（「盈利測試」、「市值/收益/現金流測試」或「市值/收益測試」）即可，這有助不同盈利特徵的大型企業上市籌資。\n因此 (1) 和 (3) 正確，選 C。",exEn:"(1) Correct: Applicants must have an adequate trading record of at least three financial years (operating history) under substantially the same management.\n(2) Incorrect: Listed companies are not required to be 'multinational corporations (MNCs)'; local or domestic Mainland enterprises can also list as long as they meet the criteria.\n(3) Correct: HKEX offers three alternative financial tests for Main Board listings: the 'profit test', the 'market capitalisation/revenue/cash flow test', or the 'market capitalisation/revenue test'. Applicants only need to satisfy one of them.\nTherefore, (1) and (3) are correct, making C the correct answer."},
{q:16,year:2019,y:2019,top:"不同企業擁有權類型的財務報告編製 —— 損益表（毛利金額之核算）",topEn:"Financial Reporting —— Income Statement (Calculation of Gross Profit)",outc:true,reason:"自 2025 年起，「貿易帳與損益表細項（毛利、銷貨成本及各類運費）之編製與計算」，已全數移至選修部分（會計單元）第七章（Paper 2A）。",reasonEn:"Starting from 2025, the detailed preparation and item computations of the Trading Account (Gross Profit, COGS, carriage inwards/outwards) are tested in Elective Module Paper 2A.",cn:"16. 某商號於 2018 年 1 月成立。2018 年 12 月 31 日摘錄自商號帳冊的帳戶結餘如下：\n\n| 項目 | $ |\n| :--- | :--- |\n| 銷貨 | 154 000 |\n| 購貨 | 51 000 |\n| 銷貨運費 | 2 500 |\n| 購貨運費 | 4 700 |\n| 薪金 | 31 000 |\n\n2018年12月31日的存貨為$7200。截至2018年12月31日止年度的毛利為：\n\nA. $72 000\nB. $105 500\nC. $107 700\nD. $114 900",en:"16. A firm was set up in January 2018. The following account balances were extracted from its books as at 31 December 2018:\n\n| Item | $ |\n| :--- | :--- |\n| Sales | 154 000 |\n| Purchases | 51 000 |\n| Carriage outwards | 2 500 |\n| Carriage inwards | 4 700 |\n| Salaries | 31 000 |\n\nThe inventory as at 31 December 2018 amounted to $7 200. The gross profit for the year ended 31 December 2018 was:\n\nA. $72 000\nB. $105 500\nC. $107 700\nD. $114 900",ans:"B",rate:"77%",exCn:"我們精確核算損益表中的毛利金額：\n1. 計算銷貨成本（COGS）= 期初存貨（首年成立，故為 $0）+ 購貨（$51,000）+ 購貨運費（$4,700）- 期末存貨（$7,200）= $48,500。注意：購貨運費（Carriage inwards）屬於直接進貨成本，必須計入 COGS 中。\n2. 計算毛利（Gross Profit）= 銷貨（$154,000）- 銷貨成本（$48,500）= $105,500（選 B）。\n3. 備註：銷貨運費（Carriage outwards, $2,500）與薪金（$31,000）屬於「營業費用 / 其他費用」，在損益表中列於毛利之後，僅影響當期「淨利（Net Profit）」，完全不影響毛利的計算。故選 B。",exEn:"We calculate the Gross Profit step-by-step:\n1. Calculate Cost of Goods Sold (COGS) = Opening Inventory (set up this year, so $0) + Purchases ($51,000) + Carriage Inwards ($4,700) - Closing Inventory ($7,200) = $48,500. (Note: Carriage inwards is a direct purchasing cost and must be capitalized into COGS).\n2. Calculate Gross Profit = Sales ($154,000) - COGS ($48,500) = $105,500. Thus, B is correct.\n3. Note: Carriage outwards ($2,500) and Salaries ($31,000) are operating/selling expenses. They are listed below the Gross Profit line in the Income Statement and only affect the Net Profit, not the Gross Profit."},
{q:17,year:2019,y:2019,top:"營商環境 —— 商業道德與社會責任（履行社會責任的實質案例）",topEn:"Business Environment —— Business Ethics & Social Responsibility (Corporate Social Responsibility in Practice)",cn:"17. 下列哪項是一家酒店履行社會責任的例子？\n\n(1) 允許文職員工在惡劣天氣情況下在家中工作\n(2) 以最低工資支付房務員\n(3) 若顧客要求，會提供魚翅\n\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"17. Which of the following is/are regarded as example(s) of a hotel fulfilling its social responsibilities?\n\n(1) allowing clerical staff to work from home when there are adverse weather conditions\n(2) paying the minimum wage to housekeepers\n(3) serving sharks' fins if requested by customers\n\nA. (1) only\nB. (1) and (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"55%",exCn:"(1) 正確：在惡劣天氣（如颱風或暴雨）下主動允許非一線的文職員工在家工作（Work from home），體現了企業對「員工（Staff / Employee）」這一重要內部持份者的福利關懷與社會責任。\n(2) 正確：雖然最低工資上調是法定義務，但「依法依規向基層房務員（勞工）足額支付法定最低工資」是企業對員工履行最基礎、最合規社會責任及法律責任之底線。\n(3) 錯誤：魚翅涉及嚴重的海洋生態破壞與瀕危物種保護問題。主動向顧客提供魚翅（即使顧客要求）完全不符合環境保護與生態永續發展的商業道德與社會責任原則。\n因此 (1) 和 (2) 正確，選 B。",exEn:"(1) Correct: Allowing non-frontline clerical staff to work from home under adverse weather conditions demonstrates the hotel's care and responsibility toward its employees (internal stakeholders).\n(2) Correct: Complying with the statutory requirements by paying the legal minimum wage to vulnerable housekeepers represents the baseline of fulfilling legal and ethical social responsibilities toward the workforce.\n(3) Incorrect: Serving sharks' fins directly harms marine ecology and biodiversity. Even if requested by customers, doing so violates the principles of environmental protection and sustainability under CSR.\nTherefore, (1) and (2) are correct, making B the correct answer."},
{q:18,year:2019,y:2019,top:"基礎個人理財 —— 強制性公積金（強積金）制度下的登記與供款義務",topEn:"Basics of Personal Financial Management —— MPF Schemes (Enrolment and Contribution Obligations)",cn:"18. 35 歲的徐思於 2015 年獨資開設了一家甜品店。自此，她以每月薪金 $5 000 聘請了 30 歲的畢玲為兼職助手。下列哪項有關強制性公積金（強積金）計劃的陳述是正確的？\n\n(1) 徐思需要為自己登記參加強積金計劃。\n(2) 徐思需要為畢玲登記參加強積金計劃，並且為她作強制性供款。\n(3) 畢玲需向強積金計劃作出強制性供款。\n\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"18. Tracy, aged 35, set up a dessert shop as a sole proprietor in 2015. Since then, she has employed Betty, aged 30, as a part-time helper at a monthly salary of $5 000. Which of the following statements about the Mandatory Provident Fund (MPF) Scheme is/are correct?\n\n(1) Tracy needs to enrol herself into an MPF scheme.\n(2) Tracy needs to enrol Betty into an MPF scheme and make mandatory contributions for her.\n(3) Betty needs to make mandatory contributions to the MPF Scheme.\n\nA. (1) only\nB. (1) and (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"51%",exCn:"(1) 正確：徐思作為獨資甜品店東主（年齡在18至65歲之間），屬於「自僱人士（Self-employed persons）」，依法必須自行為自己登記並加入強積金計劃。\n(2) 正確：兼職助手畢玲月薪雖然只有 $5,000（低於個人最低有關入息水平），但作為僱主的徐思仍有法定義務必須為她登記強積金計劃，並且必須代其作出僱主部分 5%（即 $250）的強制性供款。\n(3) 錯誤：畢玲的月薪（$5,000）低於強積金的最低有關入息水平（現為每月 $7,100）。在此入息底線下，畢玲個人「毋須（豁免）」作出僱員部分的 5% 強制性供款（亦可選擇自願供款，但非強制）。\n因此 (1) 和 (2) 正確，選 B。",exEn:"(1) Correct: Tracy is a sole proprietor (aged 35, within the 18-65 range), classifying her as a 'self-employed person'. By law, she is required to enrol herself in an MPF scheme.\n(2) Correct: Although Betty's monthly salary of $5,000 is below the minimum relevant income level, her employer, Tracy, is still legally obligated to enrol Betty in an MPF scheme and make the employer's mandatory contribution of 5% ($250).\n(3) Incorrect: Betty's monthly income ($5,000) is below the statutory minimum relevant income level (currently $7,100 per month). Therefore, Betty herself is exempt from making the employee's mandatory contribution of 5%.\nTherefore, (1) and (2) are correct, making B the correct answer."},
{q:19,year:2019,y:2019,top:"複式記帳法 —— 商業交易之過帳與分錄對比",topEn:"Double-entry Bookkeeping —— Recording Business Transactions in Accounts",outc:true,reason:"自 2025 年起，「複式記帳法在分類帳上的具體科目入帳及借貸判定」，已全數移至選修部分（會計單元）第三章（Paper 2A）。",reasonEn:"Starting from 2025, the double-entry system and detailed ledger account recordings of transactions are tested in Elective Module Paper 2A.",cn:"19. 下列哪項複式記帳是正確的？\n\n| | 交易 | 借記帳戶 | 貸記帳戶 |\n| :--- | :--- | :--- | :--- |\n| (1) | 賒銷客戶退回貨品 | 銷貨 | 應收貨款 |\n| (2) | 以支票清還銀行貸款 | 銀行貸款 | 銀行存款 |\n| (3) | 收到退回多付車輛費用的現金 | 現金 | 汽車費用 |\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"19. Which of the following double entries is/are correct?\n\n| | Transaction | Account to be debited | Account to be credited |\n| :--- | :--- | :--- | :--- |\n| (1) | Credit customers returned goods to the firm | Sales | Trade receivables |\n| (2) | A bank loan was settled by cheque | Loan from bank | Cash at bank |\n| (3) | A cash refund for the overpayment of motor expenses was received | Cash | Motor expenses |\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"67%",exCn:"(1) 錯誤：賒銷客戶退回貨品，在會計上屬於「銷貨退回」（Returns Inwards / Sales Returns），應專設「銷貨退回帳」予以借記，而不直接借記「銷貨帳（Sales）」本身，以保留總銷貨和退貨的個別數據資訊。\n(2) 正確：以支票清還長期/短期銀行貸款，負債減少「借記：銀行貸款」；銀行資產減少「貸記：銀行存款（或 cash at bank）」。\n(3) 正確：收到退回多付的汽車費用現金，現金資產增加「借記：現金」；汽車費用（費用沖減）「貸記：汽車費用（或 motor expenses）」。\n因此 (2) 和 (3) 正確，選 C。",exEn:"(1) Incorrect: When a credit customer returns goods, it is recorded as a sales return, which should be debited to the Returns Inwards (or Sales Returns) account, not directly to the 'Sales' account, to preserve individual record data.\n(2) Correct: Settling a bank loan by cheque decreases the liability (debit 'Loan from bank') and decreases bank assets (credit 'Cash at bank').\n(3) Correct: Receiving a cash refund for overpaid motor expenses increases cash assets (debit 'Cash') and offsets the expense (credit 'Motor expenses').\nTherefore, (2) and (3) are correct, making C the correct answer."},
{q:20,year:2019,y:2019,top:"基礎個人理財 —— 策劃個人理財及投資（金融工具風險回報取捨）",topEn:"Basics of Personal Financial Management —— Personal Financial Planning & Investment (Risk-Return Trade-off)",cn:"20. 下列哪項有關投資風險與回報的陳述是正確的？\n\n(1) 投資者必須面對較高風險的投資，以換取較高回報的機會。\n(2) 較高風險的投資未必帶來較高回報。\n(3) 投資於多種金融產品可避免市場風險。\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"20. Which of the following statements about investment risk and return is/are correct?\n\n(1) Investors must face higher risk to obtain higher returns.\n(2) Higher risk investments may not bring higher returns.\n(3) Investing in a variety of financial products can avoid market risk.\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"70%",exCn:"(1) 正確：根據金融投資的根本原則，高回報必定伴隨著高風險；投資者想要獲得取得更高回報的「機會」，就必須面臨並承擔更高的風險（即高風險、高預期回報），否則無法觸發高利潤。\n(2) 正確：高風險投資僅代表獲得高回報的「機會」，不等於保證。「較高風險的投資」伴隨著極高的本金虧損機率，在實務中「未必」能真正帶來高回報。\n(3) 錯誤：分散投資（Diversification，投資於多種產品或投資組合）只能規避/降低企業特有的「非系統性風險」，而完全無法避免或消除全市場共有的「市場風險（系統性風險 / Market Risk）」（如戰爭、高通膨、利率上調等）。\n因此 (1) 和 (2) 正確，選 A。",exEn:"(1) Correct: Under financial principles, higher potential returns always come with higher risks. Investors must face higher risks to have the 'opportunity' of obtaining higher returns.\n(2) Correct: Higher risk means higher volatility and potential loss, but it may not actually result in higher returns in practice.\n(3) Incorrect: Diversifying investments across different products can reduce or eliminate unsystematic (firm-specific) risk, but cannot avoid or eliminate market risk (systematic risk), which affects the entire financial market.\nTherefore, (1) and (2) are correct, making A the correct answer."},
{q:21,year:2019,y:2019,top:"中小型企業 —— 企業家特徵與貢獻",topEn:"Small and Medium Enterprises —— Entrepreneurship (Characteristics and Contributions of Entrepreneurs)",cn:"21. 下列哪項有關企業家的陳述是正確的？\n\n(1) 他們創造新市場和行業，從而促進經濟增長。\n(2) 他們引入更多產品種類，增加市場競爭。\n(3) 他們承擔企業風險以賺取利潤。\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"21. Which of the following statements about entrepreneurs are correct?\n\n(1) They create new markets and industries, thereby promoting economic growth.\n(2) They introduce more product variety, increasing market competition.\n(3) They take business risks in order to earn profits.\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"70%",exCn:"(1) 正確：企業家（Entrepreneurs）透過開發新商品、提供新服務，主動開創全新的市場與細分產業，是推動宏觀經濟增長的核心引擎。\n(2) 正確：企業家將多元化的創新產品引入市場，促使市場產品種類（Variety）大幅增加，打破既有壟斷並有效加強市場良性競爭，惠及消費者。\n(3) 正確：在學術與實務定義中，企業家最本質的特點即是「在面臨市場不確定性時，勇於承擔商業風險（Risk-taking），以期賺取利潤」。\n因此 (1)、(2) 和 (3) 正確，選 D。",exEn:"(1) Correct: Entrepreneurs innovate and create new markets and business sectors, which acts as a key driver of macroeconomic growth.\n(2) Correct: By introducing a wider variety of innovative products, they stimulate healthy market competition and expand consumer choice.\n(3) Correct: By definition, an entrepreneur is an individual who is willing to take business risks under uncertainty in order to earn profits.\nTherefore, (1), (2), and (3) are correct, making D the correct answer."},
{q:22,year:2019,y:2019,top:"營商環境 —— 國際貿易合作組織（世界貿易組織 WTO 的限制與職能）",topEn:"Business Environment —— Major International Trade Organisations (Functions and Limits of the WTO)",cn:"22. 下列哪項有關世界貿易組織的陳述是正確的？\n\n(1) 它執行成員之間的國際貿易規則。\n(2) 它協助發展中國家增加貿易機會。\n(3) 它消除成員之間的貿易障礙。\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"22. Which of the following statements about the World Trade Organization (WTO) are correct?\n\n(1) It enforces the rules of international trade among members.\n(2) It helps developing countries increase their trading opportunities.\n(3) It eliminates trade barriers among members.\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"54%",exCn:"(1) 正確：世界貿易組織（WTO）具備實質的多邊法律約束力，能透過爭端解決機制（Dispute settlement mechanism）或施加貿易制裁，切實執行成員國之間共同達成的國際貿易規則（Enforce the rules）。\n(2) 正確：WTO 致力於多邊自由貿易，並為低度開發或發展中國家提供專門的技術援助與貿易能力建設（Trade capacity building），以協助其增加全球貿易機會。\n(3) 錯誤：這是 BAFS 考試中最經典的字面陷阱題。WTO 的宗旨是「逐步削減、大幅降低（reduce / lower / substantially eliminate）」成員國之間的關稅與非關稅壁壘，而非一蹴而就「完全消除（eliminate / 100% remove）」所有貿易障礙。即使是 WTO 成員國之間，目前在農產品或鋼鐵等敏感領域依然合法存在各類關稅與非關稅壁壘。\n因此只有 (1) 和 (2) 正確，選 A。",exEn:"(1) Correct: The WTO possesses real legal binding authority and can enforce the agreed international trade rules among members through its dispute settlement mechanism.\n(2) Correct: The WTO provides technical assistance and trade capacity-building support to help developing countries expand their international trading opportunities.\n(3) Incorrect: This is a classic terminology trap. The WTO's objective is to 'reduce or substantially lower' tariffs and trade barriers, NOT to completely 'eliminate' them (there are still many legal tariffs and trade barriers among WTO members in sensitive sectors like agriculture and steel). There is a huge difference between 'reduce' and 'eliminate'.\nTherefore, (1) and (2) are correct, making A the correct answer."},
{q:23,year:2019,y:2019,top:"基礎會計 —— 會計循環流程之步驟順序",topEn:"Introductory Accounting —— Steps in the Accounting Cycle",outc:true,reason:"自 2025 年起，會計循環的完整流程、帳目登錄、原始分錄簿與試算表的登記編製，已全數移至選修部分（會計單元）Paper 2A 的第五、六章。",reasonEn:"Starting from 2025, the standard steps, bookkeeping entries, and trial balance extractions of the accounting cycle are tested in Elective Module Paper 2A.",cn:"23. 會計循環中，在過帳至分類帳帳戶之後，下一個步驟是：\n\nA. 編製財務報表\nB. 把交易記錄在原始分錄帳簿\nC. 編製試算表\nD. 作出期末調整",en:"23. In the accounting cycle, which of the following steps comes immediately after posting entries to the ledger accounts?\n\nA. preparing financial statements\nB. recording transactions in the books of original entry\nC. preparing a trial balance\nD. making period-end adjustments",ans:"C",rate:"71%",exCn:"在標準複式簿記的會計循環（Accounting Cycle）中，各流程的標準先後順序為：\n1. 確認交易事項，並記錄在原始分錄帳簿內（日記簿）。\n2. 過帳（Posting）至分類帳帳戶內（分門別類過入 T 字帳）。\n3. 在期末結平各帳戶，並編製試算表（Trial Balance）（即本題答案，選 C）。\n4. 根據應計基礎，作出期末調整（Accruals, prepayments, depreciation, bad debts 等）。\n5. 最終編製財務報表（損益表、財務狀況表）。\n故過帳至分類帳後的下一個步驟是編製試算表，選 C。",exEn:"In a standard bookkeeping accounting cycle, the correct sequence of steps is:\n1. Identify transactions and record them in the books of original entry (journals).\n2. Post entries to the ledger accounts (T-accounts).\n3. Extract account balances and prepare a trial balance (the immediate next step, making C the correct answer).\n4. Make period-end adjustments (e.g., accruals, prepayments, depreciation, doubtful debts).\n5. Prepare financial statements (Income Statement, Statement of Financial Position).\nTherefore, the step immediately following 'posting entries to the ledgers' is 'preparing a trial balance'. Thus, C is correct."},
{q:24,year:2019,y:2019,top:"基礎個人理財 —— 證券交易作投資（恆生指數特徵）",topEn:"Basics of Personal Financial Management —— Stock Trading (Characteristics of Hang Seng Index)",cn:"24. 下列哪項有關恆生指數的陳述是正確的？\n\nA. 它由 60 隻成分股組成。\nB. 它的所有成分股均是在香港聯合交易所主板上市的。\nC. 它反映亞太區股票市場的表現。\nD. 「資訊科技」是四個分類指數的其中一個。",en:"24. Which of the following statements about the Hang Seng Index is correct?\n\nA. It is composed of 60 constituent stocks.\nB. All of its constituent stocks are listed on the Main Board of the Stock Exchange of Hong Kong.\nC. It reflects the performance of the stock market in the Asia-Pacific region.\nD. 'Information technology' is one of the four sub-indexes.",ans:"B",rate:"62%",exCn:"A 錯誤：恆指的成份股（Constituent stocks）數目多年來是由恆指服務公司視市場發展而動態調整增加的（2019年時並非固定在 60 隻，現已增加至 80 隻以上，故非不變之特徵）。\nB 正確：恆生指數用以量度香港股市最大型、最具代表性的上市公司。其所有成份股依法必須且均是在香港交易所的「主板（Main Board）」上市，不包括創業板（GEM）股票。\nC 錯誤：恆指僅反映「香港股票市場（Hong Kong stock market）」的價格走勢與整體表現，而非整個「亞太區（Asia-Pacific）」股市。\nD 錯誤：恆生指數的四大分類指數（Sub-indexes）為：金融、公用事業、地產、工商業，並不設有獨立的「資訊科技」分類指數。\n因此 B 正確。",exEn:"A Incorrect: The number of constituent stocks in the HSI is not permanently fixed (it has been dynamically increased by Hang Seng Indexes Company over the years, from 50 to currently over 80), so '60' is not a fixed characteristic.\nB Correct: The HSI measures the performance of the largest and most liquid market leaders. All HSI constituent stocks must be and are listed on the Main Board of the Stock Exchange of Hong Kong (excluding GEM).\nC Incorrect: The HSI serves as a benchmark for the Hong Kong stock market, not the broader Asia-Pacific region.\nD Incorrect: The four sub-indexes of the HSI are Finance, Utilities, Properties, and Commerce & Industry. There is no sub-index named 'Information technology'.\nTherefore, B is correct."},
{q:25,year:2019,y:2019,top:"財務報表分析 —— 財務報表使用者及其資訊需要",topEn:"Financial Ratio Analysis —— Users of Financial Statements and Their Information Needs",outc:true,reason:"自 2025 年起，「財務報表的使用者與其特定財務資訊需要」，已全數歸入選修部分（會計單元）第七章（Paper 2A）。",reasonEn:"Starting from 2025, the financial statement users and their specific information needs are tested in Elective Module Paper 2A.",cn:"25. 下列哪項不是財務報表對相關用家的主要用途？\n\n| | 用家 | 主要用途 |\n| :--- | :--- | :--- |\n| A. | 僱員 | 評估公司的前景 |\n| B. | 管理人員 | 評估公司的財務表現 |\n| C. | 政府 | 計算公司的應繳利得稅額 |\n| D. | 顧客 | 評估公司的變現能力 |",en:"25. Which of the following is not the main use of financial statements for the respective users?\n\n| | User | Main use |\n| :--- | :--- | :--- |\n| A. | employees | to assess their prospects |\n| B. | managers | to assess their financial performance |\n| C. | government | to calculate corporate profits tax |\n| D. | customers | to assess the company's liquidity |",ans:"D",rate:"60%",exCn:"A、B、C 均為主要用途：僱員關注公司前景以了解其工作保障與薪酬空間；管理人員需要評估財務表現以進行控制與規劃；政府（稅務局）需利用報表利潤評估企業的應繳利得稅。\nD 不是主要用途（正確答案，選 D）：普通顧客（Customers）在會計學上關注的是公司「業務的持續性（Business continuity）」（如能否繼續提供產品、提供售後保養及配件），而並非去深入「評估公司的變現能力（Liquidity / short-term solvency）」（評估變現能力是短期債權人如供應商和銀行貸款人的核心需要，非普通顧客的主要用途）。",exEn:"A, B, and C are all main uses: Employees assess company prospects to evaluate job security; managers assess financial performance to coordinate, plan, and control; and the government (Inland Revenue Department) uses financial statements to calculate corporate profits tax.\nD is not a main use (the correct answer, choose D): In accounting, ordinary customers are primarily interested in 'business continuity' (whether the firm can continue supplying goods and providing warranty services), not in 'assessing the company's liquidity' (liquidity assessment is the primary interest of trade creditors and lenders, not ordinary retail customers)."},
{q:26,year:2019,y:2019,top:"基礎個人理財 —— 消費者信貸（信用卡信貸之特徵與額度）",topEn:"Basics of Personal Financial Management —— Consumer Credit (Characteristics and Limits of Credit Cards)",cn:"26. 下列哪項有關信用卡的陳述是正確的？\n\n(1) 它有預先批核的信用限額。\n(2) 它有繳款期限。\n(3) 結欠有每月最低還款額。\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"26. Which of the following statements about credit cards are correct?\n\n(1) It has a pre-approved credit limit.\n(2) It has a payment due date.\n(3) Outstanding balances have a monthly minimum payment.\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"50%",exCn:"(1) 正確：發卡銀行會根據申請人的個人信貸評級與入息，為其信用卡設定並批核一個最高的「信用限額（Credit limit）」（即信用額度）。\n(2) 正確：信用卡每月結帳後，月結單上均會明確列示一個「到期還款日 / 繳款期限（Payment due date）」，持卡人在此日期前全數清還可享有免息期。\n(3) 正確：持卡人若無法全數清還月結單結欠，發卡機構會要求每月必須至少清還一個小額的「最低還款額（Minimum payment）」，其餘未還餘額則會即時開始計算高昂的每日利息。\n因此 (1)、(2) 和 (3) 正確，選 D。",exEn:"(1) Correct: The card issuer sets a maximum borrowing cap, known as a 'pre-approved credit limit', based on the applicant's credit score and income.\n(2) Correct: Each monthly statement specifies a 'payment due date' (payment deadline). Paying in full before this date allows the user to enjoy an interest-free period.\n(3) Correct: If cardholders cannot settle the full statement balance, they must pay at least a small portion, known as the 'monthly minimum payment', to avoid default penalties, although interest will be charged on the remaining balance on a daily basis.\nTherefore, (1), (2), and (3) are correct, making D the correct answer."},
{q:27,year:2019,y:2019,top:"基礎管理 —— 管理功能（控制與比較標準）",topEn:"Basics of Management —— Management Functions (Controlling and Performance Comparison)",cn:"27. 一名經理將員工的實際表現與表現標準比較，這工作屬於下列哪項管理功能？\n\nA. 領導\nB. 組織\nC. 計劃\nD. 控制",en:"27. A manager compares employees' actual performance with performance standards. This task belongs to which of the following management functions?\n\nA. Leading\nB. Organising\nC. Planning\nD. Controlling",ans:"D",rate:"61%",exCn:"管理四大功能中：\n控制功能（Controlling）的定義是確保企業的實際行動與既定計劃相一致的過程。其四大核心步驟為：（1）制定表現標準；（2）量度實際表現並將之與表現標準比較（即本題所述工作）；（3）分析顯著差異之原因；（4）採取糾正與改善行動。故本題描述屬於「控制（Controlling）」，選 D。\nA 領導（Leading）涉及激勵與引導員工；B 組織（Organising）涉及分配資源與職權架構；C 計劃（Planning）涉及設立長期目標。",exEn:"Among the four management functions:\nControlling is the process of ensuring that actual activities conform to planned activities. Its core steps are: (1) establishing performance standards; (2) measuring and comparing actual performance against standards (as described in this question); (3) analyzing causes of variances; and (4) taking corrective actions. Thus, D is correct.\nA (Leading) involves motivating and directing staff; B (Organising) involves allocating resources and establishing structure; and C (Planning) involves defining long-term goals."},
{q:28,year:2019,y:2019,top:"試算表 —— 試算表平衡等式與期初資本額倒推",topEn:"Trial Balance —— Extraction of Account Balances and Deriving Capital",outc:true,reason:"自 2025 年起，「試算表（Trial Balance）借貸科目餘額的核算、結平與倒推資本」，已全數移至選修部分（會計單元）第六章（Paper 2A）。",reasonEn:"Starting from 2025, trial balance ledger classifications, balancing off, and missing capital calculations are tested in Elective Module Paper 2A.",cn:"28. 2018年12月31日一家商號的試算表有帳戶結餘如下：\n\n| 項目 | $ |\n| :--- | :--- |\n| 購貨 | 74 000 |\n| 存貨（2018年1月1日） | 6 200 |\n| 銀行存款 | 121 500 |\n| 銀行貸款 | 36 700 |\n| 辦公室設備 | 15 000 |\n| 銷貨 | 123 000 |\n| 營業費用 | 28 000 |\n| 提用 | 14 700 |\n| 資本（2018年1月1日） | ? |\n\n商號2018年1月1日的資本是：\n\nA. $43 700\nB. $70 300\nC. $99 700\nD. $197 700",en:"28. The following account balances as at 31 December 2018 were extracted from the books of a firm:\n\n| Item | $ |\n| :--- | :--- |\n| Purchases | 74 000 |\n| Inventory, 1 January 2018 | 6 200 |\n| Cash at bank | 121 500 |\n| Bank loan | 36 700 |\n| Office equipment | 15 000 |\n| Sales | 123 000 |\n| Operating expenses | 28 000 |\n| Drawings | 14 700 |\n| Capital, 1 January 2018 | ? |\n\nThe capital of the firm as at 1 January 2018 is:\n\nA. $43 700\nB. $70 300\nC. $99 700\nD. $197 700",ans:"C",rate:"74%",exCn:"1. 試算表（Trial Balance）的「借方結餘總和」必須恆等於「貸方結餘總和」：借方總額 = 貸方總額。\n2. 我們將上述所有已知科目進行借貸分類：\n   借方 (Debit) 餘額科目：購貨 $74,000 + 期初存貨 $6,200 + 銀行存款 $121,500 + 辦公室設備 $15,000 + 營業費用 $28,000 + 提用 $14,700 = $259,400。\n   貸方 (Credit) 餘額科目：銀行貸款（負債）$36,700 + 銷貨（收益）$123,000 + 期初資本 (?) = $159,700 + 期初資本。\n3. 計算平衡：$259,400 = $159,700 + 期初資本；期初資本 = $259,400 - $159,700 = $99,700（選 C）。",exEn:"1. In a trial balance, Total Debit Balances must equal Total Credit Balances: Total Debits = Total Credits.\n2. Classify the extracted balances into Debit or Credit columns:\n   Debit (Dr.) Balances: Purchases $74,000 + Opening Inventory $6,200 + Cash at Bank $121,500 + Office Equipment $15,000 + Operating Expenses $28,000 + Drawings $14,700 = $259,400.\n   Credit (Cr.) Balances: Bank Loan $36,700 + Sales $123,000 + Capital, 1 Jan 2018 (?) = $159,700 + Capital.\n3. Solve for Capital: $259,400 = $159,700 + Capital -> Capital = $259,400 - $159,700 = $99,700. Thus, C is the correct answer."},
{q:29,year:2019,y:2019,top:"基礎個人理財 —— 金錢的時間值（多筆存款的複利未來值計算）",topEn:"Basics of Personal Financial Management —— Time Value of Money (Future Value of Multiple Deposits under Compound Interest)",cn:"29. 2019 年 4 月 1 日，家欣為一儲蓄計劃存入 $3 000，利率為每年複息 1%。如家欣每年 4 月 1 日都把相同金額存入儲蓄計劃，在 2022 年 3 月 31 日家欣的儲蓄計劃戶口結餘是多少？\n\nA. $3 091\nB. $9 090\nC. $9 181\nD. $9 273",en:"29. On 1 April 2019, Yan deposited $3 000 into a savings plan which offers a return of 1% per annum, compounded annually. If Yan deposits the same amount on 1 April every year, what is the balance of Yan's savings plan account as at 31 March 2022?\n\nA. $3 091\nB. $9 090\nC. $9 181\nD. $9 273",ans:"C",rate:"70%",exCn:"本題考查多筆存款的複利未來值累計，存款期截至 2022年3月31日共經歷了三個完整的儲蓄計息期：\n1. 第一筆存款（2019年4月1日存入）：到 2022年3月31日共存滿 3年。\n   FV1 = $3,000 x (1 + 0.01)^3 = $3,000 x 1.030301 = $3,090.90\n2. 第二筆存款（2020年4月1日存入）：到 2022年3月31日共存滿 2年。\n   FV2 = $3,000 x (1 + 0.01)^2 = $3,000 x 1.0201 = $3,060.30\n3. 第三筆存款（2021年4月1日存入）：到 2022年3月31日共存滿 1年。\n   FV3 = $3,000 x (1 + 0.01)^1 = $3,000 x 1.01 = $3,030.00\n4. 2022年3月31日的戶口總結餘 = FV1 + FV2 + FV3 = $3,090.90 + $3,060.30 + $3,030.00 = $9,181.20。\n5. 四捨五入至整數元為 $9,181，選 C。",exEn:"We calculate the Future Value (FV) accumulated by each of the three deposits as of 31 March 2022:\n1. First Deposit (deposited on 1 April 2019): Compounded for 3 full years.\n   FV1 = $3,000 x (1 + 0.01)^3 = $3,000 x 1.030301 = $3,090.90\n2. Second Deposit (deposited on 1 April 2020): Compounded for 2 full years.\n   FV2 = $3,000 x (1 + 0.01)^2 = $3,000 x 1.0201 = $3,060.30\n3. Third Deposit (deposited on 1 April 2021): Compounded for 1 full year.\n   FV3 = $3,000 x (1 + 0.01)^1 = $3,000 x 1.01 = $3,030.00\n4. Total Account Balance as of 31 March 2022 = FV1 + FV2 + FV3 = $3,090.90 + $3,060.30 + $3,030.00 = $9,181.20.\n5. Rounding to the nearest dollar gives $9,181 (choose C)."},
{q:30,year:2019,y:2019,top:"基礎管理 —— 按功能劃分部門、控制幅度與直線職權",topEn:"Basics of Management —— Organising (Departmentalisation, Span of Control, and Line Authority)",cn:"30. 某公司的組織圖如下：\n\n總經理\n↓ (下設三個部門)\n市場營銷經理 | 會計及財務經理 | 人力資源經理\n↓ (每個經理之下共同管理或下設)\n主任 1 | 主任 2 | 主任 3 | 主任 4 | 主任 5 | 主任 6\n\n下列哪項陳述是正確的？\n(1) 該公司是按功能劃分部門。\n(2) 總經理的控制幅度是九。\n(3) 總經理對市場營銷經理有直線職權。\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"30. The organisation chart of a company is as follows:\n\nGeneral Manager\n(having 3 departments under him)\nMarketing Manager | Accounting & Finance Manager | Human Resources Manager\n(under these managers are)\nOfficer 1 | Officer 2 | Officer 3 | Officer 4 | Officer 5 | Officer 6\n\nWhich of the following statements are correct?\n(1) The company is departmentalised by function.\n(2) The span of control of the General Manager is nine.\n(3) The General Manager has line authority over the Marketing Manager.\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"61%",exCn:"(1) 正確：公司設立了「市場營銷」、「會計及財務」和「人力資源」部門，這是根據企業的專業管理和運作職能進行劃分，屬於典型的按功能劃分部門（Departmentalised by function）。\n(2) 錯誤：控制幅度（Span of control）是指一名經理所「直接」指揮和監督的下屬人數。組織圖中，直接向總經理匯報的只有 3位部門經理，因此總經理的控制幅度為 3，而非 9（6位主任是向各自部門經理匯報，不直接向總經理匯報）。\n(3) 正確：總經理是市場營銷經理的直接上司，擁有下達命令、督導和指揮其工作的直線職權（Line authority）。\n因此 (1) 和 (3) 正確，選 B。",exEn:"(1) Correct: The company is divided into Marketing, Accounting & Finance, and Human Resources departments. This structure aligns with the specialized business activities, which is a classic example of departmentalisation by function.\n(2) Incorrect: The span of control refers to the number of subordinates who report 'directly' to a manager. In this organization chart, only 3 managers report directly to the General Manager. Therefore, the General Manager's span of control is 3, not 9 (the 6 officers report directly to their respective department managers, not the GM).\n(3) Correct: The General Manager is the direct superior of the Marketing Manager, giving him the right to command, direct, and supervise his work, which represents line authority.\nTherefore, (1) and (3) are correct, making B the correct answer."},
{q:1,year:2020,y:2020,top:"營商環境 —— 企業擁有權類型（有限公司特徵）",topEn:"Business Environment —— Forms of Business Ownership (Characteristics of limited companies)",cn:"1. 何明與徐思計劃共同創立及經營一家餐館，這餐館並不會因任何一方的退出而結業。他們應採用哪一種企業擁有權類型？\nA. 合夥\nB. 公營公司\nC. 私人有限公司\nD. 上市公司",en:"1. Ken and Tracy plan to establish and operate a restaurant together, in which the withdrawal of either side would not lead to its closure. Which form of business ownership should they adopt?\nA. partnership\nB. public corporation\nC. private limited company\nD. listed company",ans:"C",rate:"63%",exCn:"1. **私人有限公司（Private Limited Company）**具有「永久延續（Perpetual succession）」的法律特徵，是一個獨立的法定法人個體，企業的生存與生命不會因任何股東或東主的退出、死亡或破產而結束，故選 C。\n2. 合夥（A）在法律上不具備獨立法人地位，任一合夥人退出會導致原合夥關係解散；公營公司（B）由政府全資擁有；上市公司（D）則是向公眾公開募資且股權自由流轉，均不符合兩位個人創業者開辦餐館的實際情況。",en:"1. **C is correct**: A **private limited company** is a separate legal entity and possesses the legal characteristic of \"perpetual succession\". Thus, its existence is not affected by the withdrawal, death, or bankruptcy of any shareholder or owner.\n2. A partnership (A) is not a separate legal entity, and the withdrawal of any partner legally dissolves the partnership. Public corporations (B) are owned by the government, and listed companies (D) trade shares publicly, which are inappropriate for two individuals starting a local restaurant."},
{q:2,year:2020,y:2020,top:"基礎管理 —— 管理功能（管理的重要性）",topEn:"Basics of Management —— Management Functions (Importance of management)",cn:"2. 下列哪項是管理對企業的重要？\n(1) 善用機構資源\n(2) 建立健全的組織架構\n(3) 有效達至機構的目標\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"2. Which of the following show the importance of management to a business?\n(1) efficient use of resources of the organisation\n(2) establishment of a sound organisational structure\n(3) effective achievement of organisation's goals\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"58%",exCn:"1. **(1) 正確**：管理的核心目的之一是提高效率（Efficiency），即「善用機構資源」，避免資源浪費。\n2. **(2) 正確**：通過管理的組織功能（Organising），企業能建立健全的組織架構，清晰界定職權關係與命令鏈。\n3. **(3) 正確**：管理的最終目標是實現效果（Effectiveness），即引導並協助員工「有效達至機構的目標」。\n因此，(1)、(2)及(3)均正確，選 D。",en:"1. **(1) is correct**: One of the primary goals of management is to achieve efficiency, which means the \"efficient use of resources\" and minimizing waste.\n2. **(2) is correct**: Through the organizing function of management, a business establishes a sound organisational structure, defining authority relationships and chains of command.\n3. **(3) is correct**: The ultimate aim of management is effectiveness, which means guiding and helping the organisation \"effectively achieve its goals\".\nTherefore, (1), (2), and (3) are all correct. Thus, D is correct."},
{q:3,year:2020,y:2020,top:"複式記帳法 —— 會計借貸基礎記帳概念",topEn:"Double-entry Bookkeeping —— Basic Concepts of Debit and Credit",outc:true,reason:"自 2025 年起，複式記帳記帳法則與借貸定義已全數移至選修部分會計單元（Paper 2A）。",reasonEn:"Starting from 2025, double-entry bookkeeping rules and debit/credit classifications are tested in Elective Module Paper 2A.",cn:"3. 下列哪項描述會計的「借」與「貸」是正確的？\n(1) 「借」記是增加帳戶的金額；「貸」記是減少帳戶的金額。\n(2) 「借」方指帳戶的左方；「貸」方指帳戶的右方。\n(3) 「借」方結餘是正數；「貸」方結餘是負數。\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(2)\nD. 只有(2)及(3)",en:"3. Which of the following descriptions of the 'debit' and 'credit' of an account is/are correct?\n(1) 'Debit' is to increase the amount while 'credit' is to decrease the amount of an account.\n(2) 'Debit' side refers to the left-hand side and 'credit' side refers to the right-hand side of an account.\n(3) 'Debit' balance is positive and 'credit' balance is negative.\nA. (1) only\nB. (2) only\nC. (1) and (2) only\nD. (2) and (3) only",ans:"B",rate:"77%",exCn:"1. **(2) 正確**：在 T 字帳戶中，借方（Debit）恆指定義為帳戶的左方，貸方（Credit）恆指定義為帳戶的右方，此為固定會計術語定義。\n2. **(1) 錯誤**：借貸並不等同於絕對的增加或減少。對於資產和費用類科目，借記表示增加、貸記表示減少；而對於負債、資本和收益類科目，貸記表示增加、借記表示減少。\n3. **(3) 錯誤**：在會計記帳邏輯中，借方結餘與貸方結餘並無代數上的「正負數」之分，它們僅代表不同的帳戶餘額方向。",en:"1. **(2) is correct**: In a T-account, the 'debit' side refers to the left-hand side and the 'credit' side refers to the right-hand side. This is a standard and fixed accounting definition.\n2. **(1) is incorrect**: Debit and credit do not simply mean increase and decrease. For assets and expenses, debit increases and credit decreases. For liabilities, capital, and revenues, credit increases and debit decreases.\n3. **(3) is incorrect**: There are no algebraic positive or negative values associated with debit or credit balances; they merely represent the directional balance of different ledger accounts."},
{q:4,year:2020,y:2020,top:"基礎個人理財 —— 策劃個人理財及投資（恒生指數的重要性）",topEn:"Basics of Personal Financial Management —— Personal Financial Planning & Investment (Importance of the HSI)",cn:"4. 下列哪項有關恒生指數的描述是正確的？\n(1) 「公用事業」是恒生指數的一個分類指數。\n(2) 它顯示成分股公司的派息政策。\n(3) 它是企業籌集資金的平台。\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"4. Which of the following descriptions of the Hang Seng Index is/are correct?\n(1) 'Utilities' is a sub-index of the Hang Seng Index.\n(2) It indicates the dividend policies of the companies of the constituent stocks.\n(3) It is a platform for businesses to raise capital.\nA. (1) only\nB. (1) and (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"A",rate:"57%",exCn:"1. **(1) 正確**：恒生指數由四大分類指數組成，分別是：金融、公用事業、地產、工商業。\n2. **(2) 錯誤**：恒生指數主要反映成分股整體股票市價變動的趨勢，與各別成份股公司的具體派息發放政策無關，不予顯示。\n3. **(3) 錯誤**：提供企業發行股票或債券籌集資金之「平台」是香港交易及結算所有限公司（港交所），而非恒指本身（指數僅為計算數值指標）。",en:"1. **(1) is correct**: The Hang Seng Index consists of four sub-indexes: Finance, Utilities, Properties, and Commerce & Industry.\n2. **(2) is incorrect**: The HSI measures the general price movements of its constituent stocks; it does not indicate the individual dividend policies of those companies.\n3. **(3) is incorrect**: The marketplace/platform for businesses to raise capital is the Stock Exchange of Hong Kong (HKEX), not the Hang Seng Index, which is merely a statistical index."},
{q:5,year:2020,y:2020,top:"複式記帳法 —— 商業交易對基礎會計等式的影響",topEn:"Double-entry Bookkeeping —— Effects of Transactions on the Accounting Equation",outc:true,reason:"自 2025 年起，會計等式運算及交易事項對會計等式的影響已全數移至選修部分會計單元（Paper 2A）。",reasonEn:"Starting from 2025, accounting equations and transactions' effects on assets, capital and liabilities are tested in Elective Module Paper 2A.",cn:"5. 下列哪項交易對資產、資本和負債的影響是正確的？\nA. 東主把他的汽車注入商號。資產增加、資本增加、負債增加\nB. 收取客戶現金，結清其帳戶。資產增加、資本不變、負債減少\nC. 東主以其私人支票為商號償還銀行貸款。資產不變、資本增加、負債減少\nD. 以現金支付商號本月的租金。資產減少、資本不變、負債減少\nA. 選項 A\nB. 選項 B\nC. 選項 C\nD. 選項 D",en:"5. Which of the following transactions has/have the correct effect on assets, capital and liabilities?\nA. The owner introduced his motor van into the firm. Assets increase, Capital increase, Liabilities increase\nB. Received cash from a customer to settle his account. Assets increase, Capital unchanged, Liabilities decrease\nC. The owner repaid a bank loan of the firm using his personal cheque. Assets unchanged, Capital increase, Liabilities decrease\nD. Paid the rental of the firm for the month in cash. Assets decrease, Capital unchanged, Liabilities decrease\nA. Option A\nB. Option B\nC. Option C\nD. Option D",ans:"C",rate:"64%",exCn:"1. **C 正確**：東主以個人支票代商號償還銀行貸款。這代表負債減少「借記：銀行貸款（負債減少）」；同時視同東主追加資本「貸記：資本（資本增加）」，此交易不影響商號的資產額（資產不變），會計等式完全平衡，故選 C。\n2. **A 錯誤**：汽車注入應是資產增加、資本增加、負債「不變」。\n3. **B 錯誤**：收現結帳屬於「資產內部轉換（現金增、應收減）」，資產總額「不變」，資本與負債亦「不變」。\n4. **D 錯誤**：以現金支付租金為「資產減少（現金減）」、當期利潤減少導致「資本減少」，負債「不變」。",en:"1. **C is correct**: When the owner repays a bank loan of the firm using his personal cheque, this is treated as a capital injection. The journal entry is Debit: Bank loan (decrease in liabilities) and Credit: Capital (increase in capital). Since no firm assets are involved, assets remain unchanged. This perfectly matches Option C.\n2. **A is incorrect**: Introducing a motor van increases assets and capital, while liabilities remain unchanged.\n3. **B is incorrect**: Receiving cash to settle a customer's account is an asset exchange (Cash increases, Trade Receivables decreases), leaving total assets, capital, and liabilities unchanged.\n4. **D is incorrect**: Paid rent in cash decreases assets (Cash) and decreases capital (Expenses reduce profit/retained earnings), with liabilities remaining unchanged."},
{q:6,year:2020,y:2020,top:"基礎管理 —— 管理功能（計劃：SMART目標準則之應用）",topEn:"Basics of Management —— Management Functions (Planning: SMART goals criteria)",cn:"6. 下列哪項有關良好(SMART)目標的描述是正確的？\n(1) 應是量化的\n(2) 應有預計的完成時間\n(3) 應清楚陳述達成目標的方法\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"6. Which of the following descriptions of a SMART goal are correct?\n(1) It should be quantified.\n(2) There should be an expected completion time.\n(3) The methods of achieving the goal should be stated clearly.\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"32%",exCn:"1. **(1) 正確**：良好目標應是量化的（Quantifiable / Measurable），以便對照和評估進度。\n2. **(2) 正確**：目標應有預計完成時間，即具時限的（Time-bound）。\n3. **(3) 錯誤**：目標（Goals）是指企業期望達到的終點與成果；而「清楚陳述達成目標的具體路徑、資源調配與策略方法」屬於**行動方案（Action Plan）**，不屬於目標本身的特徵。因此選 A。",en:"1. **(1) is correct**: Good objectives should be quantifiable or \"measurable\" to allow for monitoring and evaluation.\n2. **(2) is correct**: There should be a specific timeframe or target date for completion, making it \"time-bound\".\n3. **(3) is incorrect**: A goal represents the desired end result. Outlining the specific steps, resources, or methods to achieve that goal is part of the **action plan**, not the goal itself. Thus, A is correct."},
{q:7,year:2020,y:2020,top:"基礎管理 —— 有效管理的原則（分工、統一命令與統一的方向之應用）",topEn:"Basics of Management —— Principles of Effective Management (Division of work, unity of command, and unity of direction)",cn:"7. 某公司有不同部門。由於公司的其中一個目標是改善銷售人員的服務質素，因此公司人力資源經理指派她的下屬李先生為銷售人員設計培訓課程。李先生只向人力資源經理匯報。這情境展示了下列哪項有效管理原則？\n(1) 統一的方向\n(2) 統一命令\n(3) 分工\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"7. There are different departments in a company. One of the goals of the company is to improve the service quality of its salespersons. For this reason, the human resources manager of the company assigned her subordinate, Tim, to design training programmes for the salespersons. Tim reports to the human resources manager only. Which of the following principles of effective management are illustrated in this scenario?\n(1) unity of direction\n(2) unity of command\n(3) division of work\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"25%",exCn:"1. **(2) 正確（統一命令）**：個案特別指出下屬「只向人力資源經理（一名直屬主管）匯報工作」，避免了多頭指揮，貫徹了統一命令（Unity of Command）原則。\n2. **(3) 正確（分工）**：人力資源經理將「設計培訓課程」這項專業技術任務，專門委派指派給其部門內的專業下屬執行，體現了「分工（Division of labour）」與專業化管理。\n3. **(1) 錯誤（統一的方向）**：統一的方向（Unity of Direction）強調整個組織「具有相同目標的一組活動，應當由同一個計劃和同一個經理統領」。個案中僅是單一經理對單一下屬的日常任務授權，不涉及多個相同目標活動的統整合併，故不適用。選 C。",en:"1. **(2) is correct (Unity of command)**: The scenario explicitly notes that the subordinate (Tim) \"reports to the human resources manager only\". This means he receives instructions from and is accountable to a single superior, illustrating the principle of unity of command.\n2. **(3) is correct (Division of work)**: The HR manager delegates the specialized task of \"designing training programmes\" to a specific subordinate within her department, reflecting the specialization of labour and division of work.\n3. **(1) is incorrect (Unity of direction)**: Unity of direction implies that a group of activities with the same objective must be directed by one manager using one plan. This scenario describes simple task delegation, not the coordination of multiple related activities under a single plan. Thus, C is correct."},
{q:8,year:2020,y:2020,top:"基礎個人理財 —— 金錢的時間值（淨現值折現計算）",topEn:"Basics of Personal Financial Management —— Time Value of Money (Calculating NPV)",cn:"8. 以下是一項投資項目的資料：\n初始成本: $15 000\n貼現率: 10%\n投資年期: 三年\n這項目於第一及第二年年終時均會帶來現金流 $6 000。如果第三年年終的現金流是 _____，這項目的淨現值會趨近於零。\nA. 4 587\nB. 5 083\nC. 6 105\nD. 7 965",en:"8. There is an investment project with the following details:\nInitial cost: $15 000\nDiscount rate: 10%\nInvestment period: 3 years\nThe project will generate a cash inflow of $6 000 at the end of both Year 1 and Year 2. If the cash inflow at the end of Year 3 is _____, the net present value (NPV) of this project will be close to zero.\nA. 4 587\nB. 5 083\nC. 6 105\nD. 7 965",ans:"C",rate:"51%",exCn:"1. **C 正確**：本題考查淨現值（NPV）的算術推導。設第三年的現金流為 X，令 NPV = 0：\nNPV = -15,000 + 6,000/(1.1) + 6,000/(1.21) + X/(1.331) = 0\n-15,000 + 5,454.55 + 4,958.68 + X/1.331 = 0\n-4,586.77 + X/1.331 = 0 → X = 4,586.77 × 1.331 ≈ **6,105**，故選 C。",en:"1. **C is correct**: Under the curriculum guidelines, simple NPV calculations are restricted to maximum 3 periods. Let the cash flow of Year 3 be X. Setting the NPV equation to zero:\nNPV = -15,000 + 6,000/(1.1) + 6,000/(1.21) + X/(1.331) = 0\n-15,000 + 5,454.55 + 4,958.68 + X/1.331 = 0\n-4,586.77 + X/1.331 = 0 → X = 4,586.77 × 1.331 ≈ **6,105**. Thus, C is correct."},
{q:9,year:2020,y:2020,top:"財務報表分析 —— 變現能力會計比率之解讀與存貨佔比分析",topEn:"Financial Ratio Analysis —— Interpretation of Liquidity Ratios & Inventory Proportions",outc:true,reason:"自 2025 年起，財務報表分析及會計比率的核算與深入交叉比對，已全數移至選修部分會計單元（Paper 2A）。",reasonEn:"Starting from 2025, financial ratio calculations and comparative evaluations are tested in Elective Module Paper 2A.",cn:"9. 一家商號的流動比率是1.8:1，酸性測驗比率是0.9:1。下列哪項陳述是正確的？\nA. 商號的營運資金金額是負數。\nB. 商號一半的流動資產是存貨。\nC. 商號的變現能力和盈利能力差劣。\nD. 商號有足夠的速動資產清償流動負債。\nA. 陳述 A\nB. 陳述 B\nC. 陳述 C\nD. 陳述 D",en:"9. A firm had a current ratio of 1.8:1 and a liquid ratio of 0.9:1. Which of the following statements is correct?\nA. The amount of working capital of the firm is negative.\nB. Half of the current assets of the firm are inventory.\nC. The liquidity and profitability of the firm are poor.\nD. The firm has sufficient liquid assets to settle its current liabilities.\nA. Statement A\nB. Statement B\nC. Statement C\nD. Statement D",ans:"B",rate:"69%",exCn:"1. **B 正確**：流動比率 = 流動資產/流動負債 = 1.8；速動（酸性測驗）比率 = (流動資產-存貨)/流動負債 = 0.9。\n將兩個方程式相減，可得：存貨/流動負債 = 1.8 - 0.9 = 0.9。\n存貨佔總流動資產的比例：存貨/流動資產 = 0.9/1.8 = 50%。這表明商號流動資產中剛好有一半是存貨。\n2. **A 錯誤**：流動比率為 1.8 > 1，流動資產大於流動負債，營運資金必為「正數」。\n3. **C 錯誤**：無法僅從短期償債能力比率判斷出「盈利能力差劣」。\n4. **D 錯誤**：速動比率 0.9 < 1，說明速動資產不足以完全償還其流動負債。",en:"1. **B is correct**: Current ratio = Current Assets/Current Liabilities = 1.8. Liquid ratio = (Current Assets - Inventory)/Current Liabilities = 0.9. Subtracting the two equations gives: Inventory/Current Liabilities = 1.8 - 0.9 = 0.9. Now, find the proportion of inventory in total current assets: Inventory/Current Assets = 0.9/1.8 = 50%. This mathematically proves that half of the current assets are inventory.\n2. **A is incorrect**: Since the current ratio is 1.8 (> 1), current assets exceed current liabilities, so working capital must be positive.\n3. **C is incorrect**: Liquidity ratios do not indicate a firm's profitability.\n4. **D is incorrect**: Since the liquid ratio is 0.9 (< 1), the firm does not have sufficient liquid assets to settle all current liabilities."},
{q:10,year:2020,y:2020,top:"營商環境 —— 香港的營商環境與特徵",topEn:"Business Environment —— Hong Kong's Business Environment and Characteristics",cn:"10. 下列哪項是香港經濟的特色？\n(1) 香港大多數企業均為中小型企業。\n(2) 香港是原材料的淨出口地。\n(3) 香港沒有對入口設置貿易障礙。\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"10. Which of the following is/are feature(s) of Hong Kong's economy?\n(1) Most businesses in Hong Kong are small and medium enterprises.\n(2) Hong Kong is a net exporter of raw materials.\n(3) Hong Kong does not maintain trade barriers on imports.\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"C",rate:"63%",exCn:"1. **(1) 正確**：中小型企業（SMEs）佔香港企業總數的 98% 以上，因此大多數香港企業均是中小型企業。\n2. **(2) 錯誤**：香港缺乏第一級產業（缺乏天然資源與農業），是一個原材料的「淨進口地」，而非淨出口地。\n3. **(3) 正確**：香港實行自由貿易政策（Free trade），是一個自由港，對入口貨物基本上不設置關稅或任何貿易壁壘。\n因此，(1) 和 (3) 正確，選 C。",en:"1. **(1) is correct**: Small and medium enterprises (SMEs) account for over 98% of the total number of business establishments in Hong Kong, so most businesses are indeed SMEs.\n2. **(2) is incorrect**: Hong Kong lacks primary industries and is almost entirely dependent on imported raw materials. It is a net importer, not an exporter, of raw materials.\n3. **(3) is correct**: Hong Kong adopts a free-trade policy and operates as a free port. It does not impose tariffs or maintain trade barriers on most imports.\nTherefore, (1) and (3) are correct. Thus, C is correct."},
{q:11,year:2020,y:2020,top:"財務報表分析 —— 財務報表的使用與局限",topEn:"Financial Ratio Analysis —— Uses and Limitations of Financial Statements",outc:true,reason:"自 2025 年起，財務報表的局限與分析已全數移至選修部分會計單元（Paper 2A）。",reasonEn:"Starting from 2025, limitations and uses of financial statements are tested in Elective Module Paper 2A.",cn:"11. 下列哪項是使用財務報表的局限？\n(1) 財務報表主要記錄過去的交易，未能反映將來。\n(2) 由於財務報表一般會以市值匯報資產的價值，而市值會隨時間波動，因此很難比較商號不同年度的表現。\n(3) 由於不同商號會採用不同的會計方法，因此很難比較同一行業不同商號的表現。\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. (1)、(2)及(3)",en:"11. Which of the following is/are limitation(s) of financial statements?\n(1) They mainly record past transactions and fail to reflect the future.\n(2) Since assets are generally reported at market value which fluctuates over time, it is difficult to compare the performance of a firm across different years.\n(3) Since different firms adopt different accounting methods, it is difficult to compare the performance of firms in the same industry.\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"57%",exCn:"1. **(1) 正確**：財務報表主要記錄歷史數據（Historical cost），反映過去已發生的交易，因此缺乏前瞻性，無法直接反映企業未來的發展，此為主要局限。\n2. **(2) 錯誤**：財務報表通常是以「歷史成本原則（Historical Cost Principle）」而非「市值」來匯報和記錄資產價值，因此陳述 (2) 的前提假設本身是錯誤的。\n3. **(3) 正確**：由於不同企業在政策允許範圍內可能採用不同的會計政策和折舊/存貨計價方法，導致同一行業中不同商號的財務數據很難進行直接、客觀的橫向比較。因此，只有 (1) 和 (3) 為真正的局限，選 C。",en:"1. **(1) is correct**: Financial statements primarily record historical transaction data, which makes them backward-looking and limited in reflecting a firm's future potential.\n2. **(2) is incorrect**: Under Generally Accepted Accounting Principles (GAAP), assets are typically recorded at their historical cost rather than market value. Therefore, the premise of statement (2) is incorrect.\n3. **(3) is correct**: Different companies may adopt different accounting methods (such as different depreciation or inventory valuation methods), which hinders direct and consistent comparison between firms in the same industry. Thus, only (1) and (3) are correct, making C the correct answer."},
{q:12,year:2020,y:2020,top:"基礎管理 —— 組織功能（部門劃分：按產品與按地區）",topEn:"Basics of Management —— Organising (Departmentalisation: by product and by location)",cn:"12. 一家銀行設有存款、貸款、信用卡、投資及個人理財策劃部門，而個人理財策劃部門之下又設有港島、九龍及新界分部。指出這銀行劃分部門的方式。\n(1) 按產品\n(2) 按功能\n(3) 按地區\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"12. A bank is composed of deposit, loan, credit card, investment, and personal financial planning departments, while there are Hong Kong Island, Kowloon, and New Territories divisions under the personal financial planning department. State the forms of departmentalisation of this bank.\n(1) by product\n(2) by function\n(3) by location\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"57%",exCn:"1. **(1) 正確**：存款、貸款、信用卡、投資以及個人理財策劃，是銀行提供給客戶的不同「產品和服務（Products/Services）」，此劃分屬於「按產品劃分部門」。\n2. **(3) 正確**：在個人理財策劃部門之下，進一步劃分「港島、九龍及新界分部」，這是依據不同的地理位置或區域開展運營，屬於「按地區劃分部門（Departmentalisation by location/geographical）」。\n3. **(2) 錯誤**：按功能劃分部門通常是指按企業運作功能（如人資、會計、市場營銷、生產）來設立。銀行上述部門並非按功能設計。故 (1) 和 (3) 正確，選 B。",en:"1. **(1) is correct**: Deposit, loan, credit card, investment, and personal financial planning represent different \"products and services\" offered by the bank, which constitutes departmentalisation by product.\n2. **(3) is correct**: Subdividing the personal financial planning department into \"Hong Kong Island, Kowloon, and New Territories\" divisions is based on geographic regions, which constitutes departmentalisation by location/geography.\n3. **(2) is incorrect**: Departmentalisation by function refers to organizing based on core business operations (e.g., HR, R&D, Marketing, Finance). The listed departments do not follow functional lines. Therefore, only (1) and (3) are correct, making B the correct answer."},
{q:13,year:2020,y:2020,top:"會計的目的及角色 —— 會計循環的流程與順序",topEn:"Purpose of Accounting —— Flow of the Accounting Cycle",outc:true,reason:"自 2025 年起，整個會計循環（Accounting Cycle）的各個步驟與流程排序，已全數移至選修部分會計單元（Paper 2A）。",reasonEn:"Starting from 2025, the accounting cycle flow and its individual steps are tested in Elective Module Paper 2A.",cn:"13. 下列哪項有關會計循環流程的描述是正確的？\n(1) 過帳至分類帳後，隨即作期末調整。\n(2) 編製試算表後，隨即編製財務報表。\n(3) 確認商業交易後，隨即記錄在原始分錄帳簿。\nA. 只有(1)\nB. 只有(3)\nC. 只有(1)及(2)\nD. 只有(2)及(3)",en:"13. Which of the following descriptions of the accounting cycle flow is/are correct?\n(1) Making period-end adjustments comes immediately after posting entries to the ledgers.\n(2) Preparing financial statements comes immediately after the preparation of a trial balance.\n(3) Recording transactions in the books of original entry comes immediately after business transactions are identified.\nA. (1) only\nB. (3) only\nC. (1) and (2) only\nD. (2) and (3) only",ans:"B",rate:"62%",exCn:"1. **(3) 正確**：會計循環的起點是確認/辨識商業交易，隨後將其「記錄在原始分錄帳簿（Books of original entry / Journals）」中。\n2. **(1) 錯誤**：過帳至分類帳（Ledgers）後，下一個步驟是「編製試算表（Trial Balance）」，而非立即作期末調整。\n3. **(2) 錯誤**：編製試算表後，隨即是「作出期末調整（Adjustments）」及「編製調整後試算表」，之後才是編製財務報表，而非直接編製財務報表。因此選 B。",en:"1. **(3) is correct**: The first stage of the accounting cycle is identifying transactions, and the step that immediately follows is recording these transactions in the \"books of original entry\" (journals).\n2. **(1) is incorrect**: Immediately after posting entries to the ledgers, the next step is extracting ledger balances to prepare a \"trial balance\", not making period-end adjustments.\n3. **(2) is incorrect**: Immediately after the preparation of a trial balance, the business must make \"period-end adjustments\" and extract an adjusted trial balance. Preparing financial statements is the final step, which does not immediately follow the initial trial balance. Thus, B is correct."},
{q:14,year:2020,y:2020,top:"不同企業擁有權類型的財務報告編製 —— 損益表（利息收益對毛利與淨利的影響）",topEn:"SFP and Income Statement —— Impact of Other Income on Gross Profit and Net Profit",outc:true,reason:"自 2025 年起，損益表結構（毛利與淨利的核算）及營業外損益項目歸類，已全數移至選修部分會計單元（Paper 2A）。",reasonEn:"Starting from 2025, income statement construction, including gross profit and net profit calculations, is tested in Elective Module Paper 2A.",cn:"14. 一家貿易商號賺取利息收益$8000，這對商號該年度的毛利和淨利有什麼影響？\nA. 毛利不變、淨利增加\nB. 毛利增加、淨利不變\nC. 毛利不變、淨利不變\nD. 毛利增加、淨利增加\nA. 選項 A\nB. 選項 B\nC. 選項 C\nD. 選項 D",en:"14. A trading firm earned interest income of $8 000. How will the gross profit and net profit of the firm for the year be affected?\nA. Gross profit unchanged, Net profit increase\nB. Gross profit increase, Net profit unchanged\nC. Gross profit unchanged, Net profit unchanged\nD. Gross profit increase, Net profit increase\nA. Option A\nB. Option B\nC. Option C\nD. Option D",ans:"A",rate:"87%",exCn:"1. **A 正確**：\n- **對毛利的影響**：毛利（Gross Profit）= 銷貨淨額 - 銷貨成本（COGS）。「利息收益（Interest income）」屬於營業外的「其他收益」，列在損益表中毛利之後的項目中，因此不影響毛利的計算（**毛利不變**）。\n- **對淨利的影響**：淨利（Net Profit）= 毛利 + 其他收益 - 營業費用。利息收益增加會導致當期其他收益上升，從而直接使得**淨利增加**，選 A。",en:"1. **A is correct**:\n- **Impact on Gross Profit**: Gross profit is calculated as \"Net Sales - Cost of Goods Sold\". Since \"interest income\" is classified as \"other income/revenue\", it is listed below the gross profit line in the income statement. Thus, **gross profit remains unchanged**.\n- **Impact on Net Profit**: Net profit is calculated as \"Gross Profit + Other Income - Expenses\". An increase of $8,000 in interest income (other income) directly **increases net profit**. Thus, option A is correct."},
