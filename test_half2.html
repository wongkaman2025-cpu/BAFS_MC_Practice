{q:4,year:2022,y:2022,top:"[out c] 不同企業擁有權類型的財務報告編製 —— 損益表（期末調整與費用對利潤之影響）",topEn:"[out c] Preparation of Financial Statements for Different Forms of Ownership —— Income Statement (Impact of adjustments on profit)",outc:true,reason:"自 2025 年文憑試起，損益表各子項項目（如銷貨成本、毛利、淨利）的確認與期末調節計算，已全數歸入選修部分（會計單元）第七章（Paper 2A）。",reasonEn:"Starting from 2025, the detailed preparation and adjustment computations of trading and profit and loss accounts (COGS, gross profit, net profit) are tested in the Accounting Elective Module Paper 2A.",cn:"4. 如果一家商號的期末存貨減少及銷貨運費增加，這對商號的毛利和淨利會有什麼影響？\n| | 毛利 | 淨利 |\n| :---: | :---: | :---: |\n| A. | 增加 | 增加 |\n| B. | 增加 | 不變 |\n| C. | 減少 | 減少 |\n| D. | 減少 | 不變 |",en:"4. If a firm's closing inventory decreases and carriage outwards increases, how will the gross profit and net profit of the firm be affected?\n| | Gross profit | Net profit |\n| :---: | :---: | :---: |\n| A. | increases | increases |\n| B. | increases | unchanged |\n| C. | decreases | decreases |\n| D. | decreases | unchanged |",ans:"C",rate:"67%",exCn:"C 正確：\n- 對毛利的影響：根據銷貨成本公式：銷貨成本 = 期初存貨 + 購貨 - 期末存貨。期末存貨減少，會直接使銷貨成本增加，進而導致毛利減少。\n- 對淨利的影響：銷貨運費（Carriage outwards）屬於企業的「營業費用」。銷貨運費增加會直接使營業費用上升。在毛利已然減少、且營業費用增加的雙重打擊下，企業當期的最終淨利必定也減少，故選 C。",exEn:"C is correct:\n- Impact on Gross Profit: Under the COGS formula: COGS = Opening Inventory + Purchases - Closing Inventory. A decrease in closing inventory directly increases COGS, thereby decreasing gross profit.\n- Impact on Net Profit: Carriage outwards is classified as an operating expense. An increase in carriage outwards increases total expenses. Since gross profit decreases and expenses increase, the final net profit must decrease."},
{q:5,year:2022,y:2022,top:"基礎個人理財 —— 金錢的時間值（複利終值與計息頻率）",topEn:"Basics of Personal Financial Management —— Time Value of Money (Future value and compounding frequency)",cn:"5. 2021年4月1日，大偉存入銀行帳戶$300000。存款年利率為4%，每季複息計算。2021年12月31日大偉可得到的利息總額為：\nA. $8,000\nB. $8,080\nC. $9,000\nD. $9,090",en:"5. David deposited $300,000 into a bank account on 1 April 2021. The deposit interest rate was 4% per annum, compounded quarterly. The total interest that David could get on 31 December 2021 was:\nA. $8,000\nB. $8,080\nC. $9,000\nD. $9,090",ans:"D",rate:"67%",exCn:"D 正確：計算步驟如下：\n第一步：計算總計息期（n）：存款期由 2021 年 4 月 1 日至 12 月 31 日，共計 9 個月。按「每季」計算複利息，一季為 3 個月，因此 9 個月內共有 3 個計息複利期（n = 3）。\n第二步：計算每季實質利率（r）：每季利率 r = 4% ÷ 4 = 1% = 0.01。\n第三步：計算複利本利和（FV）：FV = $300,000 × (1.01)^3 = $300,000 × 1.030301 = $309,090.30。\n第四步：計算利息總額：利息 = FV - 本金 = $309,090.30 - $300,000 = $9,090.30（最接近 $9,090，選 D）。",exEn:"D is correct: Calculation steps:\nStep 1: From 1 April to 31 December 2021 is 9 months. Quarterly compounding = 3 periods (n=3).\nStep 2: Quarterly rate r = 4%/4 = 1% = 0.01.\nStep 3: FV = $300,000 × (1.01)^3 = $309,090.30.\nStep 4: Interest = $309,090.30 - $300,000 = $9,090.30 ≈ $9,090. Option D."},
{q:6,year:2022,y:2022,top:"[out c] 營商環境 —— 企業擁有權類型（合營企業）",topEn:"[out c] Business Environment —— Forms of Business Ownership (Joint Venture)",outc:true,reason:"自 2025 年文憑試起，「合營企業（Joint Venture）」已被完全移出必修部分考核大綱。",reasonEn:"Starting from 2025, 'Joint Ventures' are completely removed from the Compulsory Part (Paper 1) syllabus.",cn:"6. 下列哪項有關合營企業的陳述是正確的？\n(1) 合營企業必須向公眾披露其財務報表。\n(2) 合營企業是獨立於合營企業合夥人的個體。\n(3) 投資最多資本的合營企業合夥人在業務營運上有最終決定權。\nA. 只有(1)\nB. 只有(2)\nC. 只有(3)\nD. 只有(2)及(3)",en:"6. Which of the following statements about a joint venture is/are correct?\n(1) A joint venture is required to disclose its financial statements to the public.\n(2) A joint venture is an entity independent of its joint venture partners.\n(3) The joint venture partner contributing the most capital has the ultimate decision-making power in business operations.\nA. (1) only\nB. (2) only\nC. (3) only\nD. (2) and (3) only",ans:"B",rate:"70%",exCn:"B 正確：\n- (2) 正確：合營企業是由兩個或多個獨立的企業合資創立的全新、獨立的商業實體，其在法律和會計上均完全獨立於其各合作夥伴之外。\n- (1) 錯誤：在香港，合營企業通常註冊為「私人有限公司」，依法享有披露豁免，毋需向社會大眾公開披露其財務報表。\n- (3) 錯誤：合營企業的營運決策與權力分配，嚴格遵循雙方簽署的「合營協議」，不一定由出資最多的一方享有最終絕對控制或決定權。",exEn:"B is correct:\n- (2) is correct: A joint venture is a distinct business entity legally independent of its partners.\n- (1) is incorrect: Joint ventures in Hong Kong are usually registered as private limited companies with disclosure exemptions.\n- (3) is incorrect: Operational decisions are governed by the Joint Venture Agreement, not automatically by capital contribution."},
{q:7,year:2022,y:2022,top:"[out c] 基礎管理 —— 有效管理的原則與計劃功能（目標管理）",topEn:"[out c] Basics of Management —— Management Functions (Management by Objectives)",outc:true,reason:"自 2025 年文憑試起，「目標管理（MBO）」相關課題已被完全移出必修部分大綱。",reasonEn:"Starting from 2025, 'Management by Objectives (MBO)' has been completely removed from the Compulsory Part (Paper 1) syllabus.",cn:"7. 下列哪項是採用「目標管理」的好處？\n(1) 減少下屬的工作量\n(2) 有助監察下屬的工作進度\n(3) 激勵下屬達成公司目標\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"7. Which of the following is/are the benefit(s) of adopting 'management by objectives'?\n(1) reduce the workload of subordinates\n(2) help monitor subordinates' work progress\n(3) motivate subordinates to achieve company goals\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"80%",exCn:"C 正確：\n- (2) 及 (3) 正確：目標管理（MBO）強調主管與下屬共同參與制定指標，能激發員工主動性、發揮強大激勵作用（3）；同時，制定了清晰具體的量化指標，能顯著幫助主管在後期監控、評估和跟進工作進度（2）。\n- (1) 錯誤：目標管理的落地需要反覆召開溝通會議、審查指標、填報進度及撰寫評核，這會顯著增加（而非減少）行政負擔及下屬與經理的工作量。",exEn:"C is correct:\n- (2) and (3) are correct: MBO encourages active participation and joint-setting of goals, acting as a strong motivator (3) and making monitoring of work progress highly effective (2).\n- (1) is incorrect: Implementing MBO involves frequent meetings and documentation, which significantly increases workload."},
{q:8,year:2022,y:2022,top:"[out c] 試算表 —— 試算表的功能與限制",topEn:"[out c] Trial Balance —— Functions and Limitations of a Trial Balance",outc:true,reason:"自 2025 年起，「試算表（Trial Balance）的功能、編製與不平衡錯誤更正」已被全數歸入選修部分（會計單元）第六章（Paper 2A）。",reasonEn:"Starting from 2025, 'Trial Balances' (their functions, preparation, and corrections) are moved to Elective Module Paper 2A (Chapter 6).",cn:"8. 下列哪項是試算表的功能？\n(1) 找出分類帳戶的錯誤\n(2) 有助編製原始分錄帳簿\n(3) 檢視財務報表是否計算準確\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"8. Which of the following is/are function(s) of a trial balance?\n(1) errors in the ledger accounts can be detected\n(2) facilitate the preparation of the books of original entries\n(3) the arithmetical accuracy of the financial statements can be checked\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"A",rate:"43%",exCn:"A 正確：\n- (1) 正確：試算表唯一的核心功能是檢索並驗證分類帳登帳中在「借貸算術上」的過帳平衡錯誤。\n- (2) 錯誤：試算表的編製發生在「日記簿/原始分錄帳簿」和「分類帳過帳」全部完成之後，對編製原始分錄簿並無任何「幫助」作用。\n- (3) 錯誤：試算表只能證明分類帳餘額在複式記帳上的算術相等，無法用來檢查隨後編製的財務報表本身是否計算或內容正確。",exEn:"A is correct:\n- (1) is correct: The primary function of a trial balance is to check the mathematical accuracy of double-entry postings.\n- (2) is incorrect: A trial balance is extracted after entries are made in the books of original entries and posted to ledgers.\n- (3) is incorrect: A trial balance only checks the arithmetical balance of ledger accounts, not the accuracy of final financial statements."},
{q:9,year:2022,y:2022,top:"基礎個人理財 —— 策劃個人理財及投資（恆生指數特徵與重要性）",topEn:"Basics of Personal Financial Management —— Personal Financial Planning & Investment (Hang Seng Index characteristics and importance)",cn:"9. 下列哪項有關恆生指數的陳述是正確的？\n(1) 在計算指數時會包括所有在香港聯合交易所上市的股票。\n(2) 它是評估個別上市公司股票價格走勢的指標，有助投資決定。\n(3) 它反映在香港聯合交易所主板上市股票的整體價格水平。\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"9. Which of the following statements about the Hang Seng Index is/are correct?\n(1) It is computed by taking into account all stocks listed on the Stock Exchange of Hong Kong.\n(2) It serves as a benchmark to assess the price trend of a listed stock to facilitate investment decisions.\n(3) It reflects the general price level of the stocks listed on the Main Board of the Stock Exchange of Hong Kong.\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"D",rate:"50%",exCn:"D 正確：\n- (1) 錯誤：恆生指數並非包括聯交所上市的「所有」股票，而僅挑選了符合大市值、高流通性等特定要求的數十隻最具行業代表性的「成分股/藍籌股」作為樣本。\n- (2) 正確：恆指大盤指數是評估大市整體市價波動的主要指標，個股通常以恆指走勢為基準，有助於投資者做投資決定。\n- (3) 正確：恆指的成分股均是在香港聯合交易所的主板（Main Board）上市。因此其能有效反映主板上市大型股票的整體價格水平。",exEn:"D is correct:\n- (1) is incorrect: The HSI is calculated using a select group of representative blue-chip companies, not 'all' stocks.\n- (2) is correct: HSI acts as a crucial market benchmark for investment decisions.\n- (3) is correct: All constituent stocks are listed on the Main Board, reflecting the general price level of Main Board shares."},
{q:10,year:2022,y:2022,top:"[out c] 複式記帳法 —— 分類帳記帳原理與分錄借貸判定",topEn:"[out c] Double-entry Bookkeeping —— Ledger entry principles and Debit/Credit determination",outc:true,reason:"自 2025 年起，「複式記帳原則（Double-entry Bookkeeping）」分類帳科目借貸法則之應用，已全數移至選修部分（會計單元）第三章（Paper 2A）。",reasonEn:"Starting from 2025, the application of double-entry bookkeeping and credit/debit rules across ledgers are tested under Elective Module Paper 2A (Chapter 3).",cn:"10. 下列哪項複式記帳是正確的？\n| 交易內容 | 借記帳戶 | 貸記帳戶 |\n| (1) 收到退貨予供應商的現金退款 | 現金 | 購貨退出 |\n| (2) 以支票支付送貨給顧客的運費 | 銷貨運費 | 銀行存款 |\n| (3) 退回賒購的辦公室設備予賣家 | 應付帳款 | 辦公室設備 |\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"10. Which of the following double entries are correct?\n| Transaction | Account to be debited | Account to be credited |\n| (1) Received cash refund for goods returned to a supplier | Cash | Returns outwards |\n| (2) Paid freight charges for delivering goods to a customer by cheque | Carriage outwards | Bank |\n| (3) Office equipment bought on credit was returned to the seller | Accounts payables | Office equipment |\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"50%",exCn:"D 正確：\n- (1) 正確：收到供應商的退貨現金退款，資產（現金）增加借記「現金」；購貨退出增加貸記「購貨退出」。\n- (2) 正確：以支票支付送給客人的運費，即「銷貨運費」，費用增加借記「銷貨運費」，銀行存款減少貸記「銀行存款」。\n- (3) 正確：將賒購的辦公室設備退回給供應商，負債（應付帳款）減少借記「應付帳款」，非流動資產減少貸記「辦公室設備」。\n綜上，(1)、(2)、(3) 均正確，選 D。",exEn:"D is correct:\n- (1) is correct: Cash refund increases cash asset (debit Cash) and decreases net purchases (credit Returns outwards).\n- (2) is correct: Carriage outwards increases expenses (debit) and decreases bank asset (credit Bank).\n- (3) is correct: Returning equipment decreases liability (debit Accounts payables) and decreases non-current assets (credit Office equipment).\nAll three are correct, making D the answer."},
{q:11,year:2022,y:2022,top:"營商環境 —— 影響商業決策的因素（外在經濟因素）",topEn:"Business Environment —— Evaluating how different factors affect business decisions (External Economic Factors)",cn:"11. 一家外國商號在香港設立零售商店。下列哪項是影響該商號的經濟因素？\n(1) 顧客對國際品牌的喜好\n(2) 外幣匯率\n(3) 香港的就業水平\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"11. A foreign firm has established retail shops in Hong Kong. Which of the following is/are economic factor(s) that might affect this firm?\n(1) customers' preference for international brands\n(2) foreign exchange rate\n(3) employment level of Hong Kong\nA. (1) only\nB. (2) only\nC. (3) only\nD. (2) and (3) only",ans:"D",rate:"46%",exCn:"D 正確：\n- (1) 錯誤：顧客對國際品牌的喜好代表消費者的態度和消費習性，這屬於社會和文化因素，不屬於經濟因素。\n- (2) 正確：外幣匯率直接影響外資零售商的跨境進口進貨成本以及海外利潤折算，是核心的經濟因素。\n- (3) 正確：就業水平直接反映本地市民的可支配收入、消費購買力以及工資招聘成本，屬於經濟因素。",exEn:"D is correct:\n- (1) is incorrect: Customer preference is a social/cultural factor, not an economic factor.\n- (2) is correct: Foreign exchange rates directly impact import costs and profit conversion.\n- (3) is correct: Employment levels dictate purchasing power and labor costs, which are economic factors."},
{q:12,year:2022,y:2022,top:"[out c] 複式記帳法 —— 會計等式變動與資產總值推導",topEn:"[out c] Double-entry Bookkeeping —— Accounting equation變動與資產總值推導",outc:true,reason:"自 2025 年起，「會計等式及交易對會計等式資產、負債、資本項目的運算與分析」已全數歸入選修部分（會計單元）第二章（Paper 2A）。",reasonEn:"Starting from 2025, accounting equation formulas, transactions impact computations and assets ledger aggregations are tested under Elective Module Paper 2A (Chapter 2).",cn:"12. 2022年1月1日，黃氏商號的資產總值為$100000。1月3日，商號以賒帳方式購入成本$30000的貨物。1月31日，商號以賒帳方式售出成本$8000的貨物，售價為$12000。根據以上資料，計算2022年1月31日黃氏商號的資產總值。\nA. $122,000\nB. $126,000\nC. $134,000\nD. $142,000",en:"12. On 1 January 2022, the total asset value of Wong's firm was $100,000. On 3 January, the firm purchased goods on credit at a cost of $30,000. On 31 January, goods costing $8,000 were sold on credit at a price of $12,000. Based on the above information, calculate the total asset value of Wong's firm as at 31 January 2022.\nA. $122,000\nB. $126,000\nC. $134,000\nD. $142,000",ans:"C",rate:"45%",exCn:"C 正確：會計等式的運算步驟如下：\n第一步：1月1日 期初資產 = $100,000。\n第二步：1月3日 賒購貨物 $30,000：存貨（資產）增加 $30,000，應付貨款（負債）也增加 $30,000。此時總資產額增加為：$100,000 + $30,000 = $130,000。\n第三步：1月31日 賒銷貨品（成本 $8,000，售價 $12,000）：賒銷入帳會使應收貨款（資產）增加 $12,000；同時結轉成本使存貨（資產）減少 $8,000。此交易對資產總額的「淨增加額」= $12,000 - $8,000 = +$4,000。\n第四步：1月31日 期末資產總值 = $130,000 + $4,000 = $134,000（選 C）。",exEn:"C is correct: The accounting equation adjustments:\nStep 1: Opening Assets on 1 Jan = $100,000.\nStep 2: Credit purchase on 3 Jan: Inventory increases by $30,000. Assets total = $130,000.\nStep 3: Credit sale on 31 Jan: Trade receivables increases by $12,000, Inventory decreases by $8,000. Net impact on assets = +$4,000.\nStep 4: Closing Assets on 31 Jan = $130,000 + $4,000 = $134,000 (Option C)."},
{q:13,year:2022,y:2022,top:"基礎個人理財 —— 策劃個人理財及投資（政府政策與股票價格）",topEn:"Basics of Personal Financial Management —— Stock Trading (Impact of government policies on share prices)",cn:"13. 撇除其他因素，下列哪項政府政策會導致一家連鎖快餐店的股價上升？\n(1) 向市民發放電子消費券\n(2) 提高股票印花稅率\n(3) 放寬因2019冠狀病毒病推行的社交距離措施\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. (1)、(2)及(3)",en:"13. Ignoring other factors, which of the following government policies will lead to an increase in the share price of a fast food chain?\n(1) disbursement of electronic consumption vouchers to citizens\n(2) raise the stamp duty rate on stock transactions\n(3) release of social distancing measures imposed during the COVID-19 pandemic\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"63%",exCn:"C 正確：政府政策對股價的影響分析如下：\n- (1) 正確：政府派發電子消費券給市民，能直接刺激和擴大市民在日常餐飲和零售的消費，從而提升快餐連鎖店的營收及盈利前景，促使其股價上升。\n- (2) 錯誤：提高股票交易印花稅率會顯著增加投資者的交易成本，屬於利空因素，通常會抑制股市買氣，導致股價下跌。\n- (3) 正確：放寬疫情防控下的「社交距離措施」能讓快餐店實體門市的客流量和營業時間直接重回常態，大幅改善連鎖餐飲的營收與股價。",exEn:"C is correct:\n- (1) is correct: Government disbursement of electronic consumption vouchers directly stimulates public spending on retail and dining, driving share price up.\n- (2) is incorrect: Raising stamp duty increases trading costs, dampening market sentiment and pulling share prices down.\n- (3) is correct: Easing social distancing restrictions restores customer traffic and operating hours, improving sales and share price."},
{q:14,year:2022,y:2022,top:"[out c] 不同企業擁有權類型的財務報告編製 —— 財務報表與折扣會計處理",topEn:"[out c] Preparation of Financial Statements for Different Forms of Ownership —— Financial statements and trade discount accounting",outc:true,reason:"自 2025 年起，「會計記錄中各種交易折讓與折扣的複式記帳實務處理」已全數移至選修部分（會計單元）的第五、七章（Paper 2A）。",reasonEn:"Starting from 2025, trade and cash discount bookkeeping entries, sales ledger entries, and accounts receivable calculations are tested in the Accounting Elective Module Paper 2A.",cn:"14. 陳氏商號以每件定價$80銷售貨物。2022年3月10日，商號售出1200件貨物予一客戶。以下帳戶摘錄自陳氏商號的帳冊：\n銷貨 3月10日 應收貨款 $84,000 (Cr.)\n根據以上資料，下列哪項陳述是正確的？\n(1) 貨物是以賒帳方式出售的。\n(2) 銷貨折扣帳記錄了給予該客戶的折扣。\n(3) 給予客戶的是貿易折扣。\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"14. Chan's firm sells goods at a list price of $80 each. On 10 March 2022, it sold 1,200 units of goods to a customer. The following account was extracted from the books of Chan's firm:\nSales: 10 Mar | Trade receivables | $84,000 (Cr.)\nBased on the above information, which of the following statements are correct?\n(1) The goods were sold on credit.\n(2) The discount given to the customer was recorded in the discounts allowed account.\n(3) The discount given to the customer was trade discount.\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"55%",exCn:"B 正確：折扣會計與登帳分析：\n- (1) 正確：由於銷貨帳戶的貸方對應科目為「應收貨款」，這直接證明該筆交易屬於賒銷。\n- (3) 正確，(2) 錯誤：1200 件貨物按原定價 $80 計算，總金額應為 $96,000。然而商號僅以 $84,000 的價格入帳。這意味著商號直接給予了顧客 $12,000（即 12.5%）的貿易折扣。在會計上，貿易折扣應直接從發票定價中扣除，直接以扣除後淨額入帳。因此「銷貨折扣」帳戶完全不會記錄這筆折扣，故 (2) 錯誤，(3) 正確。",exEn:"B is correct:\n- (1) is correct: Since the Sales account is credited with 'Trade receivables', the goods were sold on credit.\n- (3) is correct, (2) is incorrect: 1,200 units at $80 = $96,000 list price, recorded at $84,000. A trade discount of $12,000 (12.5%) was granted and deducted directly from the list price. No entries are made in the 'Discounts allowed' account (reserved for cash discounts)."},
{q:15,year:2022,y:2022,top:"基礎管理 —— 組織架構與職權（直線與幕僚職權之特徵）",topEn:"Basics of Management —— Organisational structure by authority (Line authority and staff authority)",cn:"15. 下列哪項有關直線職權和幕僚職權的陳述是正確的？\n(1) 資訊管理經理有幕僚職權，支援市場營銷經理。\n(2) 人力資源經理對所有員工都有直線職權。\n(3) 生產經理對生產部員工有直線職權。\nA. 只有(1)及(3)\nB. 只有(1)及(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"15. Which of the following statements about line authority and staff authority is/are correct?\n(1) The information manager has staff authority to support the marketing manager.\n(2) The human resources manager has line authority over all staff.\n(3) The production manager has line authority over production department staff.\nA. (1) and (3) only\nB. (1) and (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"59%",exCn:"A 正確：直線與幕僚職權的學術特徵辨析：\n- (1) 正確：資訊管理屬於輔助與支援性幕僚部門。資訊管理經理對其他核心營運功能部門僅能提供電腦技術、系統及數據支援，其擁有的屬於「幕僚職權（Staff Authority）」。\n- (2) 錯誤：人力資源經理僅對其 HR 部門內部的直接下屬擁有直線職權；對公司其他功能部門的員工，僅擁有提供人事建議、協助招聘培訓的「幕僚職權」。\n- (3) 正確：生產部經理在其垂直指揮鏈中，對其直接下屬（生產部員工）擁有指揮和命令的直接主導權，即擁有「直線職權（Line Authority）」。",exEn:"A is correct:\n- (1) is correct: The IT manager provides technology and systems support to other managers, which represents staff authority.\n- (2) is incorrect: The HR manager only has line authority over direct subordinates within the HR department, not over all staff.\n- (3) is correct: The production manager has direct command and decision-making power over production department staff, representing line authority."},
{q:16,year:2022,y:2022,top:"[out c] 複式記帳法 —— 資本與提用帳戶借貸方向判定",topEn:"[out c] Double-entry Bookkeeping —— Capital and Drawings ledger account principles",outc:true,reason:"自 2025 年起，「複式記帳原則：資本、提用及各類費用帳戶借貸增減法則」已全數移至選修部分（會計單元）第三章（Paper 2A）。",reasonEn:"Starting from 2025, bookkeeping entries in Capital and Drawings accounts, as well as ledger debit/credit determinations, are tested under Elective Module Paper 2A (Chapter 3).",cn:"16. 下列哪項應列示在資本帳的貸方？\n(1) 商號錄得的虧損\n(2) 東主以私人財產支付的辦公室費用\n(3) 商號向東主的朋友借貸\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"16. Which of the following should be shown on the credit side of the capital account?\n(1) net loss of the firm\n(2) payment of office expenses using owner's personal asset\n(3) borrowing of a loan by the firm from owner's friend\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"B",rate:"58%",exCn:"B 正確：資本帳的借貸登帳原則分析：\n- (1) 應在借方：商號錄得的淨損失（Net Loss）會減少東主資本，在會計上應記入資本帳戶的借方以沖減權益，而非貸方。\n- (2) 應在貸方：東主以其個人的私人財產直接替商號支付辦公室費用，等同於東主向企業追加新資金投資。分錄應為「借：辦公室費用；貸：資本（Capital）」，故 (2) 正確。\n- (3) 與資本帳無關：商號向東主的朋友借貸，屬於企業向外部第三方的借債，分錄為「借記：銀行存款/現金；貸記：應付貸款」，完全不影響東主資本帳戶。",exEn:"B is correct:\n- (1) belongs to debit: A net loss reduces the owner's equity and is debited to the Capital account.\n- (2) belongs to credit: If the owner pays expenses using personal assets, it is treated as a capital injection. Entry: Dr Office expenses; Cr Capital.\n- (3) is irrelevant to Capital: Borrowing from a third party increases liability and does not affect the owner's capital account."},
{q:17,year:2022,y:2022,top:"基礎個人理財 —— 消費者信貸（個人信貸評級差劣的負面影響）",topEn:"Basics of Personal Financial Management —— Consumer Credit (Implications of maintaining poor credit records)",cn:"17. 美芝的個人信貸評級差劣。下列哪項是差劣的個人信貸評級對她的影響？\n(1) 債權人會申請她破產。\n(2) 她很可能要支付較高的貸款利息。\n(3) 她的信用卡申請或會不獲批准。\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"17. Mandy has a poor personal credit rating. Which of the following is/are the effect(s) of a poor personal credit rating on her?\n(1) Creditors will apply for her bankruptcy.\n(2) She is likely to pay a higher interest rate on loans.\n(3) Her credit card application may not be approved.\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"71%",exCn:"C 正確：信用評分的影響分析：\n- (1) 錯誤：信貸評分低下僅代表其過往還款信用習慣不良。債權人只有在債務人實質出現重大違約、無力清償到期債項時，才會向法院提出破產清算訴訟。\n- (2) 正確：信貸評級差劣表示借款人的違約與拖欠風險極高，金融機構為了彌補此高風險，會要求索取更高的利息補償。\n- (3) 正確：發卡機構審批新卡申請時必須查閱其信貸報告（TU），若評分差，發卡機構會直接拒絕其申請。",exEn:"C is correct:\n- (1) is incorrect: Creditors will only apply for bankruptcy if the debtor has actually committed a major default.\n- (2) is correct: A poor credit rating means high default risk, leading to higher interest rates.\n- (3) is correct: Banks routinely pull credit reports; a poor score leads to rejection of credit card applications."},
{q:18,year:2022,y:2022,top:"基礎管理 —— 組織結構與層級（高架與扁平組織特點對比）",topEn:"Basics of Management —— Organisational structure and levels (Tall vs. Flat structure characteristics)",cn:"18. 蘇珊是一家貿易公司的總經理。公司有兩位助理總經理，分別督導三位及四位部門經理。每位部門經理督導超過十名前線員工。根據以上資料，下列哪項有關該公司的陳述是正確的？\nA. 這是一家中小型企業。\nB. 與有三層階層的公司比較，它是扁平式組織。\nC. 與規模相若而有三層階層的公司比較，它的控制幅度較窄。\nD. 與規模相若而有三層階層的公司比較，它的決策過程相對較慢。",en:"18. Susan is the general manager of a trading company. The company has two assistant general managers, who supervise three and four department managers respectively. Each department manager supervises more than ten frontline employees. Based on the above information, which of the following statements about the company is correct?\nA. It is a small and medium enterprise.\nB. Compared to a company with three levels of hierarchy, it has a flat organisational structure.\nC. Compared to a company of a similar size with three levels of hierarchy, its span of control is narrower.\nD. Compared to a company of a similar size with three levels of hierarchy, its decision-making process is relatively slower.",ans:"D",rate:"69%",exCn:"D 正確：組織架構分析如下：\n- A 錯誤：本公司層級多（設有總經理、助理總經理、部門經理、前線員工，共有 4 個管理階層），且員工人數極多，不符合本港中小型企業的特徵。\n- B 錯誤：相較於 3 層組織，本公司擁有 4 層，屬於管理階層較多、控制幅度較窄的高架式組織（Tall structure），而非扁平式組織。\n- C 錯誤：控制幅度指經理人直接監督下屬的人數。雖然本公司控制幅度較窄，但 D 的描述更能概括本公司核心特徵。\n- D 正確：在高架式架構下，由於管理層級較多，信息傳遞容易失真且決策命令需層層上報與審批，導致公司的決策過程相對較慢。",exEn:"D is correct:\n- A is incorrect: The company has 4 levels of hierarchy and a large workforce, not fitting the SME definition.\n- B is incorrect: Having 4 levels makes it a tall organisational structure, not flat.\n- C is incorrect: Although its span of control is narrower, D represents the key operational drawback.\n- D is correct: In a tall structure, increased management levels cause slower decision-making due to longer communication chains."},
{q:19,year:2022,y:2022,top:"[out c] 財務報表分析 —— 變現能力比率（速動比率之計算）",topEn:"[out c] Financial Ratio Analysis —— Liquidity Ratios (Quick Ratio calculation)",outc:true,reason:"自 2025 年起，「財務報表分析：各類變現能力會計比率（包括流動及速動比率）之計算與評估」已全數移至選修部分（會計單元）第二十一章（Paper 2A）。",reasonEn:"Starting from 2025, the calculation and analysis of quick, liquid, and acid-test ratios are tested under Elective Module Paper 2A (Chapter 21).",cn:"19. 葉氏商號2021年12月31日的一些帳戶結餘如下：\n資本, 2021年1月1日 $420,000 ； 銀行透支 $18,000 ； 存貨 $71,000 ； 應付貨款 $86,000 ； 應收貨款 $162,000 ； 2021年度淨利 $155,000 ； 提用 $11,000\n2021年12月31日的速動比率是：\nA. 1.56:1\nB. 2.09:1\nC. 2.24:1\nD. 2.71:1",en:"19. The following account balances as at 31 December 2021 relate to Yip's firm:\nCapital, as at 1 January 2021: $420,000 | Bank overdraft: $18,000 | Inventory: $71,000 | Trade payables: $86,000 | Trade receivables: $162,000 | Net profit for the year 2021: $155,000 | Drawings: $11,000\nWhat is the quick ratio of Yip's firm as at 31 December 2021?\nA. 1.56:1\nB. 2.09:1\nC. 2.24:1\nD. 2.71:1",ans:"A",rate:"65%",exCn:"A 正確：計算步驟如下：\n第一步：計算流動負債（Current Liabilities）：流動負債項目包含「應付貨款 $86,000」與「銀行透支 $18,000」。流動負債 = $86,000 + $18,000 = $104,000。\n第二步：計算速動資產（Quick Assets）：速動資產指流動資產扣除變現最慢的存貨，因此本案中速動資產僅包含「應收貨款」項目 = $162,000。\n第三步：套用速動比率公式：速動比率 = $162,000 / $104,000 ≈ 1.56:1（選 A）。",exEn:"A is correct: Calculation steps:\nStep 1: Current Liabilities = Trade payables $86,000 + Bank overdraft $18,000 = $104,000.\nStep 2: Quick Assets = Trade receivables $162,000 (excluding inventory).\nStep 3: Quick Ratio = $162,000 / $104,000 ≈ 1.56:1 (Option A)."},
{q:20,year:2022,y:2022,top:"[out c] 財務報表分析 —— 運用資金報酬率（ROCE 之計算）",topEn:"[out c] Financial Ratio Analysis —— Return on Investment (ROCE calculation)",outc:true,reason:"自 2025 年起，「財務報表分析：運用資金報酬率（ROCE）等獲利與投資回報指標之公式運用與核算」已全數移至選修部分（會計單元）第二十一章（Paper 2A）。",reasonEn:"Starting from 2025, the calculation of return on capital employed (ROCE) and other investment efficiency indexes are tested under Elective Module Paper 2A (Chapter 21).",cn:"20. 承上題，2021年度的運用資金報酬率是：\nA. 26.96%\nB. 31.16%\nC. 31.50%\nD. 36.90%",en:"20. Refer to the information of Yip's firm in Question 19. What is the return on capital employed of Yip's firm for the year 2021?\nA. 26.96%\nB. 31.16%\nC. 31.50%\nD. 36.90%",ans:"C",rate:"45%",exCn:"C 正確：運用資金報酬率（ROCE）計算步驟：\n第一步：計算期末資本（31/12/2021）：期末資本 = 期初資本 + 淨利 - 提用 = $420,000 + $155,000 - $11,000 = $564,000。\n第二步：計算「平均運用資金」：平均運用資金 = ($420,000 + $564,000) / 2 = $492,000。\n第三步：套用 ROCE 核心公式：ROCE = ($155,000 / $492,000) × 100% ≈ 31.50%（選 C）。",exEn:"C is correct: Calculation steps:\nStep 1: Closing Capital = $420,000 + $155,000 - $11,000 = $564,000.\nStep 2: Average Capital Employed = ($420,000 + $564,000) / 2 = $492,000.\nStep 3: ROCE = ($155,000 / $492,000) × 100% ≈ 31.50% (Option C)."},
{q:21,year:2022,y:2022,top:"營商環境 —— 企業擁有權類型（跨國公司）",topEn:"Business Environment —— Forms of Business Ownership (Multinational Corporations)",cn:"21. 下列哪家公司是跨國公司？\n(1) 一家從泰國購買原材料的香港公司。\n(2) 一家在香港發行債券籌集資金的內地公司。\n(3) 一家在新加坡設立分行的香港公司。\nA. 只有(1)\nB. 只有(2)\nC. 只有(3)\nD. 只有(2)及(3)",en:"21. Which of the following companies is/are multinational corporation(s)?\n(1) A Hong Kong company which purchases raw materials from Thailand.\n(2) A Mainland company which issued bonds in Hong Kong to raise funds.\n(3) A Hong Kong company which established a branch in Singapore.\nA. (1) only\nB. (2) only\nC. (3) only\nD. (2) and (3) only",ans:"C",rate:"77%",exCn:"C 正確：\n- (3) 正確：跨國公司（MNC）的最本質特徵即是在多於一個國家或地區擁有或控制實體的商業營運。香港公司在新加坡設立分行營運，完全符合定義。\n- (1) 錯誤：僅從國外「採購原料」但不涉及在海外設點或進行跨國運作，不符合跨國公司特徵。\n- (2) 錯誤：僅在海外金融市場「發行債券籌集資金」而無在該地設立實體子公司或進行直接商業運作，不屬於跨國公司。",exEn:"C is correct:\n- (3) is correct: The primary defining feature of an MNC is owning or controlling business operations in more than one country. Establishing a branch in Singapore meets this definition.\n- (1) is incorrect: Merely purchasing raw materials from overseas does not constitute being an MNC.\n- (2) is incorrect: Simply raising funds in an offshore market without establishing subsidiaries does not classify a firm as an MNC."},
{q:22,year:2022,y:2022,top:"基礎管理 —— 主要商業功能之角色（財務部門職掌）",topEn:"Basics of Management —— Key Business Functions (Role of Finance Department)",cn:"22. 一家大型公司設有不同功能部門，下列哪項是該公司財務部門的工作？\n(1) 監控公司的現金流\n(2) 審視升級資訊管理系統的預算\n(3) 決定會計文員的薪金水平\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"22. A large company has different functional departments. Which of the following tasks are performed by the finance department of the company?\n(1) monitoring the cash flows of the company\n(2) reviewing the budget for upgrading the information management system\n(3) deciding the salary levels of the accounting clerks\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"71%",exCn:"A 正確：\n- (1) 正確：監控和管理公司的每日與期末現金流，確保企業擁有足夠的資金鏈安全與支付能力，屬於財務管理的核心職權。\n- (2) 正確：審核、評估及管控重大資本支出（如系統升級）的財務預算，為財務部的日常管控功能。\n- (3) 錯誤：決定與調整各級員工的薪資待遇、報酬政策，屬於人力資源管理部門的工作，財務部僅負責按照規定代發薪資與進行帳務記錄。",exEn:"A is correct:\n- (1) is correct: Monitoring and managing the company's cash flows represent the core functions of financial management.\n- (2) is correct: Reviewing and controlling capital budgets for major projects fall under financial planning responsibilities.\n- (3) is incorrect: Determining salary and compensation levels is the primary responsibility of the human resources department."},
{q:23,year:2022,y:2022,top:"基礎管理 —— 管理功能與風格（民主式領導）",topEn:"Basics of Management —— Leadership styles (Democratic / Participative Leadership)",cn:"23. 何明是一家商號的高級設計師，該商號設計流動電話的遊戲和應用程式。商號大多數員工都具創意、有經驗和自律。何明向設計師提供指引，審視他們的程式設計初稿，然後與他們討論審視結果，並邀請他們參與挑選程式設計。根據以上資料，何明採用了：\nA. 統一命令\nB. 統一的方向\nC. 自由放任式領導\nD. 民主式領導",en:"23. Ho Ming is a senior designer of a firm which designs mobile phone games and applications. Most of the employees in the firm are creative, experienced and self-disciplined. Ho Ming provides guidelines to the designers, reviews their drafts of program designs, then discusses the review findings with them and invites them to participate in selecting program designs. Based on the above information, Ho Ming adopts:\nA. unity of command\nB. unity of direction\nC. laissez-faire leadership\nD. democratic leadership",ans:"D",rate:"62%",exCn:"D 正確：領導風格分析如下：\n何明在帶領這一批「富有創意、經驗豐富且高度自律」的團隊時，主動給予專業指引、評估初稿，並「討論和邀請他們共同參與挑選設計」，這是一種典型尊重下屬專業意見、進行雙向溝通並鼓勵共同決策的民主式領導（Democratic Leadership）風格。\n自由放任式（C）強調完全不插手、不下發指引、任由下屬自行處理，與個案中「主動指導、審查與主持討論」的積極介入特徵不符。",exEn:"D is correct: Let's evaluate the leadership style:\nHo Ming manages a team of highly creative, experienced, and self-disciplined designers. By providing guidelines, reviewing progress, and actively inviting them to participate in selecting designs through two-way discussion, he demonstrates a democratic (participative) leadership style.\nLaissez-faire leadership (C) implies complete hands-off management, which does not fit Ho Ming's active involvement."},
{q:24,year:2022,y:2022,top:"基礎個人理財 —— 策劃個人理財及投資工具（普通股東的權利與責任）",topEn:"Basics of Personal Financial Management —— Stock Trading (Rights and responsibilities of individual investors)",cn:"24. 下列哪項是股票投資者（股東）的權利？\n(1) 收取投資交易結單\n(2) 收取穩定的股息收益\n(3) 參與公司的日常營運\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"24. Which of the following is/are the right(s) of a share investor?\n(1) receiving investment transaction statements\n(2) receiving stable dividend income\n(3) participating in the daily operations of the company\nA. (1) only\nB. (1) and (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"A",rate:"67%",exCn:"A 正確：股票投資者（股東）的權益判定：\n- (1) 正確：作為金融產品的投資者與消費者，有法定權利要求證券機構提供並定期收取投資交易明細結單。\n- (2) 錯誤：股票投資者所能獲得的股息發放，完完全全取決於公司的利潤水平以及董事會的股息政策，因此股息回報不具備穩定性或保證性。\n- (3) 錯誤：根據有限公司擁有權與管理權分離的原則，普通股股東無權直接參與、主導或管理公司的日常具體營運。",exEn:"A is correct:\n- (1) is correct: Investors have the legal right to receive investment transaction statements.\n- (2) is incorrect: Dividend payments depend on the company's profitability and board decisions, not guaranteed or stable.\n- (3) is incorrect: According to the principle of separation of ownership and management, shareholders have no right to participate directly in daily operations."},
{q:25,year:2022,y:2022,top:"[out c] 營商環境 —— 企業擁有權類型（特許經營之限制）",topEn:"[out c] Business Environment —— Forms of Business Ownership (Franchising constraints)",outc:true,reason:"自 2025 年起，「特許經營（Franchising）相關課題已被完全移出卷一（必修部分）考核大綱」。",reasonEn:"Starting from 2025, 'Franchising' topics are completely removed from the Compulsory Part (Paper 1) syllabus.",cn:"25. 下列哪項有關特許經營企業的陳述是正確的？\n(1) 如他的特許經營業務蒙受損失，特許權使用人毋須向特許權擁有人支付特許權使用費。\n(2) 特許權擁有人及其所有特許權使用人均在同一國家經營業務。\n(3) 如得到特許權擁有人的批准，特許權使用人可以採用與其他特許權使用人不同的營運模式。\nA. 只有(1)\nB. 只有(2)\nC. 只有(3)\nD. 只有(2)及(3)",en:"25. Which of the following statements about franchising is/are correct?\n(1) A franchisee is not required to pay royalties to the franchisor when his franchise business incurs a loss.\n(2) The franchisor and all its franchisees operate their businesses in the same country.\n(3) With the franchisor's approval, a franchisee could have a mode of operations different from other franchisees.\nA. (1) only\nB. (2) only\nC. (3) only\nD. (2) and (3) only",ans:"C",rate:"76%",exCn:"C 正確：特許經營運作與特徵分析：\n- (3) 正確：雖然特許經營強調高度標準化的營運，但若獲得特許權擁有人的官方授權與批准，使用人可採用微調或不同的本地化營運模式。\n- (1) 錯誤：無論店鋪是否虧損，特許權使用人通常都必須按照合約，定期向擁有人支付固定的特許權使用費/加盟管理費。\n- (2) 錯誤：特許經營廣泛應用於跨國、跨地區的國際品牌擴張，非限制在「同一國家」內。",exEn:"C is correct:\n- (3) is correct: Although franchising emphasizes standardized operations, a franchisee may adopt different operations upon obtaining the franchisor's approval.\n- (1) is incorrect: Franchisees are contractually required to pay royalty fees regardless of profitability.\n- (2) is incorrect: Franchising is commonly used for multinational brand expansions, beyond a single country."},
{q:26,year:2022,y:2022,top:"基礎個人理財 —— 策劃個人理財及投資（金融產品特徵對比）",topEn:"Basics of Personal Financial Management —— Personal Financial Planning & Investment (Financial instruments characteristics)",cn:"26. (1)和(2)均可能有資本增值或減值，而後者會提供利息作為投資者的回報。\n| | (1) | (2) |\n| :---: | :---: | :---: |\n| A. | 股票 | 定期存款 |\n| B. | 股票 | 債券 |\n| C. | 債券 | 定期存款 |\n| D. | 債券 | 股票 |",en:"26. Both (1) and (2) may have capital gain or loss, whereas the latter offers interest as a return to investors.\n| | (1) | (2) |\n| :---: | :---: | :---: |\n| A. | stocks | term deposits |\n| B. | stocks | bonds |\n| C. | bonds | term deposits |\n| D. | bonds | stocks |",ans:"B",rate:"54%",exCn:"B 正確：金融工具特徵比較如下：\n- 股票和債券（Stocks and Bonds）均在證券市場進行二級交易，其市場交易價格隨行情波動，因此投資者均面臨「資本增值（Capital Gain）或資本減值（Capital Loss）」的風險，而定期存款本金無市價變動，故排除 A、C。\n- 在回報形式上，股票（1）回報主要為非固定的股息（Dividends）；而債券（2）則會向投資者定期支付約定固定的「利息（Interest）」作為回報（普通股回報不叫利息，排除 D）。故選 B。",exEn:"B is correct:\n- Stocks and bonds are traded in secondary markets with fluctuating prices, meaning investors in both may experience capital gain or capital loss. This excludes term deposits (A, C).\n- In terms of return, stocks (1) yield dividend income; whereas bonds (2) pay fixed periodic interest (shares pay dividends, not interest, which excludes D). Option B is correct."},
{q:27,year:2022,y:2022,top:"基礎個人理財 —— 強制性公積金（強積金）制度之自願性供款與限制",topEn:"Basics of Personal Financial Management —— Rights and responsibilities under MPF Scheme",cn:"27. 下列哪項有關強制性公積金(強積金)制度的陳述是正確的？\nA. 僱員、自僱人士和僱主均可選擇在強制性供款以外，作出額外的自願性供款。\nB. 僱員如於60歲前退休，可即時提取強積金。\nC. 兼職員工可豁免參加強積金計劃。\nD. 月入$40000的僱員每月須供款$2000。",en:"27. Which of the following statements about the Mandatory Provident Fund (MPF) System is correct?\nA. Employees, self-employed persons and employers may choose to make voluntary contributions on top of their mandatory contributions.\nB. Employees can withdraw their MPF immediately if they retire before the age of 60.\nC. Part-time staff are exempted from joining the MPF Scheme.\nD. An employee with a monthly income of $40,000 is required to contribute $2,000 each month.",ans:"A",rate:"61%",exCn:"A 正確：強積金政策與供款規則分析：\n- A 正確：強積金體系除法定的 5% 強制性供款外，完全允許並鼓勵僱員、自僱人士及僱主作額外的「自願性供款（Voluntary Contributions）」。\n- B 錯誤：強積金通常提取年齡為 65 歲，年滿 60 歲並聲明永久退休僅為提早提取的特例，「60 歲前」退休一般完全不符合提取條件。\n- C 錯誤：兼職員工（年齡在 18 至 65 歲之間，且連續受僱滿 60 日或以上）亦必須強制參加並依法進行強積金供款，不獲豁免。\n- D 錯誤：僱員供款設有法定上有關入息上限（最高有關入息為每月 $30,000），每月供款額上限為 $1,500（即 $30,000 × 5%）。月入 $40,000 的僱員也只需供款 $1,500，而非 $2,000。",exEn:"A is correct:\n- A is correct: On top of statutory 5% mandatory contributions, the MPF system allows and encourages extra voluntary contributions.\n- B is incorrect: Normal retirement age is 65. Early retirement at 60 is an exemption; retiring before 60 does not permit immediate withdrawal.\n- C is incorrect: Part-time employees (aged 18-65, employed 60+ days) are legally required to join MPF.\n- D is incorrect: Maximum relevant income is capped at $30,000/month, so maximum employee contribution is $1,500, not $2,000."},
{q:28,year:2022,y:2022,top:"營商環境 —— 香港的營商環境（CEPA 零關稅優勢）",topEn:"Business Environment —— Hong Kong's Business Environment (CEPA agreements & trade relations)",cn:"28. 下列哪項有關《更緊密經貿關係的安排》(CEPA)的描述是正確的？\nA. 香港與內地互認所有專業資格。\nB. 所有內地企業均可申請在香港聯合交易所主板上市。\nC. 香港企業如將總部遷移至內地，可向內地政府申請免息貸款。\nD. 所有香港原產的貨物進口內地時，均可享有零關稅優惠。",en:"28. Which of the following descriptions about the 'Closer Economic Partnership Arrangement' (CEPA) is correct?\nA. All professional qualifications are mutually recognised between Hong Kong and the Mainland.\nB. All Mainland businesses can apply to list their stocks on the Main Board of the Stock Exchange of Hong Kong.\nC. Hong Kong businesses can apply for interest-free loans from the Mainland government if they relocate their headquarters to the Mainland.\nD. All goods of Hong Kong origin can enjoy zero tariff preference upon importation into the Mainland.",ans:"D",rate:"64%",exCn:"D 正確：CEPA 政策優勢分析：\n- D 正確：根據 CEPA 協議，凡符合原產地規則的「所有香港原產貨物」，在進口至內地時均可享有零關稅（Zero tariff）特惠待遇。\n- A 錯誤：CEPA 僅推動了部分特定行業的兩地資格考試便利與有條件認證，非互認「所有」專業資格。\n- B 錯誤：內地企業能否在港上市，取決於其是否符合香港交易所主板的各項法定上市要求，非因 CEPA 而自動具有上市資格。\n- C 錯誤：CEPA 沒有向赴內地設立總部的港企提供免息貸款的條款項目。",exEn:"D is correct:\n- D is correct: Under CEPA, all goods of Hong Kong origin that meet the agreed rules of origin can enjoy zero tariff preference upon importation into the Mainland.\n- A is incorrect: CEPA facilitates mutual recognition for specific service sectors only, not all professional qualifications.\n- B is incorrect: Listing on HKEX is governed by regulatory listing requirements, not by CEPA.\n- C is incorrect: CEPA does not provide any interest-free loans for companies relocating headquarters."},
{q:29,year:2022,y:2022,top:"[out c] 財務報表分析 —— 試算表借貸餘額倒推期末淨利",topEn:"[out c] Financial Ratio Analysis —— Income Statement Calculations (Deducing net profit from a trial balance)",outc:true,reason:"自 2025 年起，「財務報表分析：損益表各級項目（COGS、毛利、淨利）之交叉倒推與運算」已全數移至選修部分（會計單元）第七、二十一章（Paper 2A）。",reasonEn:"Starting from 2025, the detailed calculation of income statement items (COGS, gross profit, net profit) is tested under the Accounting Elective Module Paper 2A (Chapter 7 and 21).",cn:"29. 根據以下簿記員編製的試算表數據（存貨為 $14,000），截至2021年12月31日止年度的淨利是多少？\n銷貨 $102,000； 購貨 $56,500 ； 存貨 (2021年1月1日) $21,100 ； 汽車 $8,600 ； 購貨折扣 $2,500 ； 營業費用 $7,800 ； 銀行存款 $3,500 ； 銀行貸款 $40,000 ； 資本 $?\nA. $28,100\nB. $33,100\nC. $19,100\nD. $30,600",en:"29. Based on the following account balances extracted from the trial balance prepared by a bookkeeper as at 31 December 2021 (with closing inventory valued at $14,000):\nSales: $102,000 | Purchases: $56,500 | Inventory (1 Jan 2021): $21,100 | Motor cars: $8,600 | Discounts received: $2,500 | Operating expenses: $7,800 | Cash at bank: $3,500 | Bank loan: $40,000\nWhat is the net profit of the firm for the year ended 31 December 2021?\nA. $28,100\nB. $33,100\nC. $19,100\nD. $30,600",ans:"B",rate:"62%",exCn:"B 正確：利用已知帳戶數據進行損益倒推核算：\n第一步：計算銷貨成本（COGS）= 期初存貨 $21,100 + 購貨 $56,500 - 期末存貨 $14,000 = $63,600。\n第二步：計算毛利（Gross Profit）= 銷貨 $102,000 - 銷貨成本 $63,600 = $38,400。\n第三步：計算淨利（Net Profit）= 毛利 $38,400 + 其他收益（購貨折扣）$2,500 - 營業費用 $7,800 = $33,100（選 B）。",exEn:"B is correct: Calculation steps:\nStep 1: COGS = Opening inventory $21,100 + Purchases $56,500 - Closing inventory $14,000 = $63,600.\nStep 2: Gross Profit = Sales $102,000 - COGS $63,600 = $38,400.\nStep 3: Net Profit = Gross Profit $38,400 + Discounts received $2,500 - Operating expenses $7,800 = $33,100 (Option B)."},
{q:30,year:2022,y:2022,top:"[out c] 試算表 —— 試算表借貸平衡倒推期初資本額",topEn:"[out c] Trial Balance —— Balancing Trial Balance Accounts (Deducing capital balance)",outc:true,reason:"自 2025 年起，「試算表（Trial Balance）」的借貸餘額方向歸類、借貸平衡核算與期末倒推，已全數移至選修部分（會計單元）第六章（Paper 2A）。",reasonEn:"Starting from 2025, the arithmetical balancing of trial balances, correcting classification of ledger balances (Debit/Credit), and deducing capital accounts are tested under Elective Module Paper 2A (Chapter 6).",cn:"30. 承上題，正確排列試算表內的帳戶結餘後, (Y) 的數值為：\nA. $14,800\nB. $30,400\nC. $35,400\nD. $121,400",en:"30. Refer to Question 29. After correctly arranging the account balances in the trial balance, the figure for (Y) (representing the Capital balance) is:\nA. $14,800\nB. $30,400\nC. $35,400\nD. $121,400",ans:"B",rate:"62%",exCn:"B 正確：試算表借貸平衡法倒推：\n借方正常科目 (Debit Balances)：購貨 $56,500 + 期初存貨 $21,100 + 汽車 $8,600 + 營業費用 $7,800 + 銀行存款 $3,500 = $97,500。\n貸方正常科目 (Credit Balances)：銷貨 $102,000 + 購貨折扣 $2,500 + 銀行貸款 $40,000 + 資本。\n根據借貸平衡：貸方總額也必須為 $97,500。由於借貸平衡核算及倒推，期初資本結餘為 $30,400，選 B。",exEn:"B is correct: Trial balance balancing:\nDebit (Dr.) Balances: Purchases $56,500 + Opening inventory $21,100 + Motor cars $8,600 + Operating expenses $7,800 + Cash at bank $3,500 = $97,500.\nCredit (Cr.) Balances: Sales $102,000 + Discounts received $2,500 + Bank loan $40,000 + Capital.\nSince total debits must equal total credits, after proper correction, the Capital balance (Y) = $30,400 (Option B)."},
{q:1,year:2023,y:2023,top:"營商環境 —— 香港的營商環境與經濟特徵",topEn:"Business Environment —— Hong Kong's Business Environment and Economic Characteristics",cn:"1. 下列哪項有關香港營商環境的陳述是正確的？\n(1) 香港天然資源豐富，可以自給自足。\n(2) 香港大多數進口的貨物來自內地。\n(3) 香港政府沒有對貨物零售徵收銷售稅。\n\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"1. Which of the following statements about Hong Kong business environment is/are correct?\n(1) Hong Kong is rich in natural resources and is self-sufficient.\n(2) Most of the goods imported into Hong Kong come from the Mainland.\n(3) Hong Kong government does not impose sales tax on the retailing of goods.\n\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"D",rate:"67%",exCn:"(1) 錯誤：香港天然資源匱乏，高度依賴進口。\n(2) 正確：中國內地是香港最大進口來源地。\n(3) 正確：香港無銷售稅或增值稅。\n因此，只有 (2) 和 (3) 正確，選 D。",exEn:"(1) Incorrect: Hong Kong is scarce in natural resources and relies on imports.\n(2) Correct: Mainland China is Hong Kong's largest import source.\n(3) Correct: Hong Kong does not levy sales tax or VAT.\nTherefore, only (2) and (3) are correct, making D the correct answer."},
{q:2,year:2023,y:2023,top:"基礎管理 —— 有效管理的原則（權力與責任）",topEn:"Basics of Management —— Principles of Effective Management (Authority and responsibility)",cn:"2. 下列哪項有關職權和責任的陳述是正確的？\n(1) 授權是把職權和責任交予下屬。\n(2) 前線管理人員需要職權來執行他們的責任。\n(3) 控制幅度較闊的管理人員擁有較多職權。\n\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"2. Which of the following statements about authority and responsibility is/are correct?\n(1) Delegation is the assigning of authority and responsibility to the subordinates.\n(2) Front-line managers require authority to carry out their responsibilities.\n(3) Managers with a wider span of control possess more authority.\n\nA. (1) only\nB. (1) and (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"23%",exCn:"(1) 正確：授權是將職權和責任委派給下屬。\n(2) 正確：前線管理人員需要職權來執行責任。\n(3) 錯誤：控制幅度與職權等級無必然因果關係。\n因此，只有 (1) 和 (2) 正確，選 B。",exEn:"(1) Correct: Delegation assigns authority and responsibility to subordinates.\n(2) Correct: Front-line managers require authority to carry out responsibilities.\n(3) Incorrect: Span of control does not correlate with authority level.\nTherefore, only (1) and (2) are correct, making B the correct answer."},
{q:3,year:2023,y:2023,top:"[out c] 會計的目的及角色 —— 會計的功能與分類",topEn:"[out c] Purpose of Accounting —— Tasks and Functions of Accounting",outc:true,reason:"自 2025 年起，基礎財務會計、會計的目的與角色已移出必修部分，改於選修會計單元（Paper 2A）第一章進行考核。",reasonEn:"Starting from 2025, basic accounting concepts including the purpose and functions of accounting are removed from the Compulsory Part (Paper 1) and are now tested in Accounting Elective Module Paper 2A (Chapter 1).",cn:"3. 下列哪項是會計的主要功能？\n(1) 將交易按盈利能力分類\n(2) 傳遞企業的財務表現資訊予持份者\n(3) 歸納企業的所有資料供使用者作決策之用\n\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(2)\nD. 只有(2)及(3)",en:"3. Which of the following is a main function of accounting?\n(1) classifying transactions according to profitability\n(2) communicating information about the financial performance of a business to stakeholders\n(3) summarising all information of a business for decision-making by users.\n\nA. (1) only\nB. (2) only\nC. (1) and (2) only\nD. (2) and (3) only",ans:"B",rate:"23%",exCn:"(1) 錯誤：會計分類依據財務屬性，非盈利能力。\n(2) 正確：匯報財務資訊予持份者是會計核心功能。\n(3) 錯誤：會計只處理財務資訊，非所有資料。\n選 B。",exEn:"(1) Incorrect: Classifying is based on financial nature, not profitability.\n(2) Correct: Communicating financial information is the core function.\n(3) Incorrect: Accounting only handles financial information.\nB is correct."},
{q:4,year:2023,y:2023,top:"基礎個人理財 —— 金錢的時間值（淨現值計算）",topEn:"Basics of Personal Financial Management —— Time Value of Money (NPV calculation)",cn:"4. 一家銀行提供一個投資計劃，需要初始存款 $180000。投資者可在加入該計劃時獲得 $2000 現金回贈。在第二及第三年年初時，現金流入分別為 $70000 及 $150000。如果貼現率為每年 5%，該投資計劃的淨現值是多少？\n\nA. $14 973\nB. $22 721\nC. $24 721\nD. $31 429",en:"4. A bank offers an investment plan which requires an initial deposit of $180 000. Investors can get a cash rebate of $2 000 upon joining the plan. The cash inflows at the beginning of Year 2 and Year 3 are $70 000 and $150 000 respectively. If the discount rate is 5% per annum, what is the net present value of this investment plan?\n\nA. $14 973\nB. $22 721\nC. $24 721\nD. $31 429",ans:"C",rate:"51%",exCn:"實際淨現金流出 = $180,000 - $2,000 = $178,000。\nPV1 = $70,000 / 1.05 = $66,666.67\nPV2 = $150,000 / 1.05^2 = $136,054.42\nNPV = $66,666.67 + $136,054.42 - $178,000 = $24,721\n選 C。",exEn:"Net outflow = $180,000 - $2,000 = $178,000.\nPV1 = $70,000/1.05 = $66,666.67\nPV2 = $150,000/1.05^2 = $136,054.42\nNPV = $66,666.67 + $136,054.42 - $178,000 = $24,721\nC is correct."},
{q:5,year:2023,y:2023,top:"[out c] 會計的目的及角色 —— 會計循環流程",topEn:"[out c] Purpose of Accounting —— The Accounting Cycle",outc:true,reason:"自 2025 年起，會計循環、日記帳、分類帳過帳與結平、試算表及期末調整已全數移出必修部分，歸入選修會計單元（Paper 2A）。",reasonEn:"Starting from 2025, the bookkeeping cycle and operational steps are removed from the Compulsory Part (Paper 1) and are now tested in Accounting Elective Module Paper 2A.",cn:"5. 下列哪項是會計循環的流程？\n(1) 作出期末調整\n(2) 編製財務報表\n(3) 在原始分錄帳簿記錄交易\n(4) 編製試算表\n(5) 過帳至分類帳戶\n\nA. (3) → (5) -> (4) -> (1) -> (2)\nB. (3) → (5) -> (1) -> (4) -> (2)\nC. (5) → (1) -> (3) -> (2) -> (4)\nD. (5) → (3) -> (1) -> (4) -> (2)",en:"5. Which of the following is the flow of the accounting cycle?\n(1) Make period-end adjustments\n(2) Prepare financial statements\n(3) Record transactions in the books of original entry\n(4) Prepare a trial balance\n(5) Post entries to the ledger accounts\n\nA. (3) → (5) → (4) → (1) → (2)\nB. (3) → (5) → (1) → (4) → (2)\nC. (5) → (1) → (3) → (2) → (4)\nD. (5) → (3) → (1) → (4) → (2)",ans:"A",rate:"73%",exCn:"標準順序：記錄交易(3) → 過帳(5) → 試算表(4) → 期末調整(1) → 財務報表(2)。\n選 A。",exEn:"Standard sequence: Record(3) → Post(5) → Trial balance(4) → Adjust(1) → Statements(2).\nA is correct."},
{q:6,year:2023,y:2023,top:"營商環境 —— 企業擁有權類型（獨資轉有限公司之優劣）",topEn:"Business Environment —— Forms of Business Ownership (Pros and cons of converting to a limited company)",cn:"6. 何明是一家獨資商號的東主，最近他決定將商號轉為私人有限公司。下列哪項是這改變的可能原因？\n(1) 這公司是獨立的法定個體。\n(2) 這公司的股東人數沒有上限。\n(3) 這公司毋須向公眾披露其財務報表。\n\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"6. Ken is the owner of a sole proprietorship. Recently, he has decided to turn the firm into a private limited company. Which of the following is/are possible reason(s) for the change?\n(1) The company is a separate legal entity.\n(2) There is no limit to the number of shareholders of the company.\n(3) The company is not required to disclose its financial statements to the public.\n\nA. (1) only\nB. (1) and (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"A",rate:"37%",exCn:"(1) 正確：私人有限公司是獨立法定個體，享有有限債務責任。\n(2) 錯誤：私人有限公司股東上限為50人。\n(3) 錯誤：獨資商號本身也毋須披露財報，非轉換原因。\n選 A。",exEn:"(1) Correct: A private limited company is a separate legal entity with limited liability.\n(2) Incorrect: Private limited companies have a maximum of 50 shareholders.\n(3) Incorrect: Sole proprietorships also do not disclose financial statements.\nA is correct."},
{q:7,year:2023,y:2023,top:"[out c] 基礎財務會計 —— 商業交易對淨利利潤的影響",topEn:"[out c] Introductory Financial Accounting —— Effects of Transactions on Net Profit",outc:true,reason:"自 2025 年起，商業交易對會計等式及各項損益科目的登帳、核算與分析已全數歸入選修部分（會計單元）Paper 2A。",reasonEn:"Starting from 2025, the recording of daily transactions, account classifications, and the analysis of transaction effects on net profit are moved to Accounting Elective Module Paper 2A.",cn:"7. 下列哪項交易會減低商號的淨利？\n(1) 以支票償還應付貨款\n(2) 購買在辦公室使用的文具\n(3) 退貨予供應商\n\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"7. Which of the following transactions will reduce the net profit of a firm?\n(1) Repaid trade payables by cheque.\n(2) Bought stationery for office use.\n(3) Returned goods to suppliers.\n\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"B",rate:"23%",exCn:"(1) 無影響：僅涉及資產與負債減少。\n(2) 減低：文具費用增加扣減淨利。\n(3) 無影響：購貨退出沖減費用但不直接減淨利。\n選 B。",exEn:"(1) No effect: Only assets and liabilities decrease.\n(2) Reduces: Stationery expense reduces net profit.\n(3) No effect: Returns outwards reduce purchases but not directly profit.\nB is correct."},
{q:8,year:2023,y:2023,top:"基礎管理 —— 管理功能（領導風格：獨裁與民主之優劣對比）",topEn:"Basics of Management —— Management Functions (Leadership styles: Democratic vs. autocratic)",cn:"8. 與獨裁式領導比較，下列哪項是機構採用民主式領導的優點？\n(1) 提升決策效率\n(2) 促進上司與下屬之間的溝通\n(3) 誘導下屬主動工作\n\nA. 只有(1)\nB. 只有(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"8. Compared to an autocratic leadership, which of the following is/are advantage(s) of adopting democratic leadership in an organisation?\n(1) It increases efficiency in making decisions.\n(2) It facilitates communication between superiors and subordinates.\n(3) It induces subordinates' work initiative.\n\nA. (1) only\nB. (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"67%",exCn:"(1) 錯誤：民主式領導決策過程漫長，降低效率。\n(2) 正確：促進上下級雙向溝通。\n(3) 正確：員工參與決策，激發主動性。\n選 C。",exEn:"(1) Incorrect: Democratic leadership is time-consuming and reduces efficiency.\n(2) Correct: Facilitates two-way communication.\n(3) Correct: Employee participation boosts initiative.\nC is correct."},
{q:9,year:2023,y:2023,top:"基礎個人理財 —— 消費者信貸（信用卡的特徵與個人信用）",topEn:"Basics of Personal Financial Management —— Consumer Credit (Characteristics of credit cards)",cn:"9. 下列哪項有關信用卡的陳述是正確的？\n(1) 批核信用卡申請前，發卡銀行可查閱申請人的個人信貸記錄。\n(2) 申請信用卡須提供抵押品。\n(3) 持卡人若準時清償每月信用卡欠款，可獲年費豁免。\n\nA. 只有(1)\nB. 只有(2)\nC. 只有(3)\nD. 只有(1)及(3)",en:"9. Which of the following statements about credit cards is/are correct?\n(1) The issuing bank can check the personal credit record of an applicant before approving the credit card application.\n(2) Collateral is required when applying for a credit card.\n(3) The annual fee is waived if the cardholder settles the monthly credit card balance punctually.\n\nA. (1) only\nB. (2) only\nC. (3) only\nD. (1) and (3) only",ans:"D",rate:"77%",exCn:"(1) 正確：銀行可查閱信貸記錄。\n(2) 錯誤：信用卡是無抵押信貸。\n(3) 正確：準時清還可獲年費豁免。\n選 D。",exEn:"(1) Correct: Banks can check credit records.\n(2) Incorrect: Credit cards are unsecured credit.\n(3) Correct: Punctual repayment earns fee waiver.\nD is correct."},
{q:10,year:2023,y:2023,top:"[out c] 基礎財務會計 —— 會計等式及交易分析",topEn:"[out c] Introductory Financial Accounting —— Effects of Transactions on the Accounting Equation",outc:true,reason:"自 2025 年起，會計等式、複式記帳與交易事項對等式之影響已全數歸入選修部分會計單元（Paper 2A）第二章。",reasonEn:"Starting from 2025, the accounting equation, expanded equations, and the analysis of business transaction effects are tested in the Accounting Elective Module Paper 2A (Chapter 2).",cn:"10. 下列哪項交易對會計等式中的資產和資本有相同的影響？\n(1) 收到租金收益的支票\n(2) 以東主的私人支票償還銀行貸款\n(3) 以現金支付本月的費用\n\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. (1)、(2)及(3)",en:"10. Which of the following transactions will lead to the same effect to the assets and capital in the accounting equation?\n(1) Received rental income by cheque.\n(2) Repaid a bank loan by the owner's personal cheque.\n(3) Paid expenses for the current month in cash.\n\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"35%",exCn:"(1) 同向：資產增加，資本增加。\n(2) 異向：資產不變，負債減少，資本增加。\n(3) 同向：資產減少，資本減少。\n選 C。",exEn:"(1) Same: Assets increase, Capital increases.\n(2) Different: Assets unchanged, Liabilities decrease, Capital increases.\n(3) Same: Assets decrease, Capital decreases.\nC is correct."},
{q:11,year:2023,y:2023,top:"營商環境 —— 企業擁有權類型（合夥與有限合夥之特徵）",topEn:"Business Environment —— Forms of Business Ownership (Characteristics of a limited partnership)",cn:"11. 謝富與陳威是一家貿易商號的合夥人。如果陳威是有限合夥人，下列哪項有關該合夥商號的陳述是正確的？\n(1) 如果謝富退出合夥，商號就要結束營業。\n(2) 陳威不會參與合夥的管理。\n(3) 兩位合夥人的最高損失是他們投資在合夥的金額。\n\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"11. Jeff and Simon are partners of a trading firm. If Simon is a limited partner, which of the following statements about the partnership is/are correct?\n(1) If Jeff withdraws from the partnership, then the firm will be closed down.\n(2) Simon does not participate in the management of the partnership.\n(3) The maximum loss of both partners is the amount they invested in the partnership.\n\nA. (1) only\nB. (1) and (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"55%",exCn:"(1) 正確：普通合夥人退出，合夥必須解散。\n(2) 正確：有限合夥人不得參與管理。\n(3) 錯誤：普通合夥人承擔無限責任。\n選 B。",exEn:"(1) Correct: Withdrawal of general partner dissolves the partnership.\n(2) Correct: Limited partners must not participate in management.\n(3) Incorrect: General partner bears unlimited liability.\nB is correct."},
{q:12,year:2023,y:2023,top:"基礎個人理財 —— 策劃個人理財及投資（影響股票價格的因素）",topEn:"Basics of Personal Financial Management —— Personal Financial Planning & Investment (Factors affecting share prices)",cn:"12. 撇除其他因素，下列哪項會導致一家銷售電動車的上市公司的股價上升？\n(1) 有更多充電站\n(2) 政府宣布電動車首次登記稅寬減安排\n(3) 科技突破提高了電動車的能源效益\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"12. Ignoring other factors, which of the following will lead to an increase in the share price of a listed company selling electric vehicles?\n(1) More electric charging stations are available.\n(2) The government announces the first registration tax concession arrangement for electric vehicles.\n(3) A technology breakthrough which enhances the energy efficiency of electric vehicles.\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"61%",exCn:"三項均為利好因素，提振盈利預期，拉動股價上升。\n選 D。",exEn:"All three are positive factors boosting profitability expectations and share price.\nD is correct."},
{q:13,year:2023,y:2023,top:"基礎管理 —— 有效管理的原則（統一的方向）",topEn:"Basics of Management —— Principles of Effective Management (Unity of direction)",cn:"13. 下列哪項有關「統一的方向」的陳述是正確的？\n(1) 有助建立團隊精神\n(2) 避免兩位上司給予矛盾的指令\n(3) 管理人員需定期檢視下屬的工作進度,帶來額外的行政工作\n\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"13. Which of the following statements about 'unity of direction' is/are correct?\n(1) It helps build up team spirit.\n(2) It avoids conflicting instructions given by two superiors.\n(3) It involves extra administrative work as managers need to conduct a periodic review of work progress of their subordinates.\n\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"A",rate:"56%",exCn:"(1) 正確：統一方向有助建立團隊精神。\n(2) 錯誤：避免矛盾指令是統一命令的功能。\n(3) 錯誤：檢視進度屬於控制功能。\n選 A。",exEn:"(1) Correct: Unity of direction builds team spirit.\n(2) Incorrect: Avoiding conflicting instructions is unity of command.\n(3) Incorrect: Reviewing progress belongs to controlling.\nA is correct."},
{q:14,year:2023,y:2023,top:"[out c] 財務報表分析 —— 企業變現能力變動分析",topEn:"[out c] Financial Ratio Analysis —— Factors Enhancing Corporate Liquidity",outc:true,reason:"自 2025 年起，財務報表分析與流動比率分析已全數歸入選修部分（會計單元）第二十一章（Paper 2A）。",reasonEn:"Starting from 2025, the calculation and comparative analysis of liquidity ratios are tested under Accounting Elective Module Paper 2A (Chapter 21).",cn:"14. 下列哪項交易可提高商號的變現能力？\n(1) 東主向商號注入現金。\n(2) 商號以銀行透支獲得現金。\n(3) 商號借取一筆五年期的銀行貸款以償還應付貨款。\n\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"14. Which of the following transactions could enhance the liquidity of a firm?\n(1) The owner injects cash into the firm.\n(2) The firm obtains cash through a bank overdraft.\n(3) The firm obtains a 5-year bank loan to repay its trade payables.\n\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"C",rate:"48%",exCn:"(1) 可提高：流動資產增加，流動比率上升。\n(2) 無提升：透支屬流動負債，比率可能下降。\n(3) 可提高：將流動負債轉為非流動負債。\n選 C。",exEn:"(1) Enhances: Current assets increase, ratio rises.\n(2) No: Overdraft is current liability, ratio may fall.\n(3) Enhances: Converts current to non-current liability.\nC is correct."},
{q:15,year:2023,y:2023,top:"基礎個人理財 —— 策劃個人理財及投資（投資者的權利與責任）",topEn:"Basics of Personal Financial Management —— Personal Financial Planning (Rights and responsibilities of individual investors)",cn:"15. 下列哪項有關投資者權利和責任的陳述是正確的？\n(1) 有責任在簽訂投資合約前了解合約條款。\n(2) 有權決定是否依照經紀的投資建議。\n(3) 如投資經常出現虧損，有權索償。\n\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"15. Which of the following statements about the rights and responsibilities of individual investors is/are correct?\n(1) They have a responsibility to understand the terms of an investment contract before signing it.\n(2) They have the right to decide whether to follow the investment recommendations of their brokers.\n(3) They have the right to claim compensation if their investments frequently suffer losses.\n\nA. (1) only\nB. (1) and (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"79%",exCn:"(1) 正確：投資者有責任了解合約條款。\n(2) 正確：投資者有權決定是否跟隨建議。\n(3) 錯誤：盈虧自負，無權因虧損索償。\n選 B。",exEn:"(1) Correct: Investors must understand contract terms.\n(2) Correct: Investors decide whether to follow advice.\n(3) Incorrect: Investors bear their own losses.\nB is correct."},
{q:16,year:2023,y:2023,top:"營商環境 —— 香港經濟發展近況及特徵（中港貿易與 CEPA 協議的益處）",topEn:"Business Environment —— Recent Developments of Hong Kong Economy (Trade relations with Mainland & CEPA benefits)",cn:"16. 下列哪項是《更緊密經貿關係安排》(CEPA)為香港帶來的好處？\nA. 從內地進口香港的貨物不需繳付關稅。\nB. 勞工可在內地與香港之間自由流動。\nC. 香港的服務提供者在東南亞國家開設業務可享優惠待遇。\nD. 香港的專業人士可投考內地的專業資格考試,以進入內地市場。",en:"16. Which of the following is a benefit brought about by the 'Closer Economic Partnership Arrangement' (CEPA) to Hong Kong?\nA. No tariffs are imposed on goods imported from the Mainland to Hong Kong.\nB. There is a free flow of labour between the Mainland and Hong Kong.\nC. Hong Kong service suppliers enjoy preferential treatment when setting up business in the Southeast Asian countries.\nD. Hong Kong professionals may enter the Mainland market by taking the Mainland professional qualification examinations.",ans:"D",rate:"22%",exCn:"A 錯誤：香港本身是自由港，非CEPA好處。\nB 錯誤：CEPA未實現勞工自由流動。\nC 錯誤：CEPA僅涵蓋內地與香港。\nD 正確：專業人士可投考內地資格考試。\n選 D。",exEn:"A incorrect: HK is already a free port.\nB incorrect: CEPA does not establish free labour flow.\nC incorrect: CEPA only covers Mainland and HK.\nD correct: Professionals can take Mainland qualification exams.\nD is correct."},
{q:17,year:2023,y:2023,top:"[out c] 基礎財務會計 —— 應計會計概念與租金費用調整",topEn:"[out c] Introductory Financial Accounting —— Accrual Concept and Year-end Rent Adjustments",outc:true,reason:"自 2025 年起，會計期末損益調整、應計與預付科目已全數歸入選修部分（會計單元）第六章（Paper 2A）。",reasonEn:"Starting from 2025, year-end adjustments, accruals and prepayments are tested in Accounting Elective Module Paper 2A (Chapter 9).",cn:"17. 一家商號簽訂合約,由2022年8月1日起以月租$10000租賃辦公室。商號於租約期首天支付首六個月的租金。\n根據______(1)______，截至2022年12月31日止年度的租金費用為______(2)______。\n\nA. 應計觀念 | $50 000\nB. 應計觀念 | $60 000\nC. 繼續經營假設 | $50 000\nD. 繼續經營假設 | $60 000",en:"17. A firm signed a contract to rent an office at a monthly rental of $10 000 starting from 1 August 2022. The firm paid the rent for the first six months on the first day of the rental period.\nAccording to the ______(1)______, the rental expenses for the year ended 31 December 2022 amounted to ______(2)______.\n\nA. accrual concept | $50 000\nB. accrual concept | $60 000\nC. going concern assumption | $50 000\nD. going concern assumption | $60 000",ans:"A",rate:"61%",exCn:"(1) 應計觀念：費用按實際使用期間確認。\n(2) 5個月 x $10,000 = $50,000。\n選 A。",exEn:"(1) Accrual concept: Expenses recognized when incurred.\n(2) 5 months x $10,000 = $50,000.\nA is correct."},
{q:18,year:2023,y:2023,top:"中小型企業 —— 香港中小型企業的特徵、定義與重要性",topEn:"Small and Medium Enterprises (SMEs) —— Characteristics and Importance of SMEs to Hong Kong",cn:"18. 下列哪項有關香港中小型企業(中小企)的陳述是正確的？\n(1) 它們為大型企業提供互補的服務和支援。\n(2) 它們服務大型企業未有涵蓋的狹窄市場。\n(3) 超過90%的香港企業都是中小企。\n\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"18. Which of the following statements about small and medium enterprises (SMEs) in Hong Kong is/are correct?\n(1) They provide complementary services and support to large enterprises.\n(2) They serve narrow markets which are not covered by large enterprises.\n(3) More than 90% of businesses in Hong Kong are SMEs.\n\nA. (1) only\nB. (1) and (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"47%",exCn:"三項皆正確。中小企佔全港98%以上。\n選 D。",exEn:"All three are correct. SMEs make up over 98% of businesses.\nD is correct."},
{q:19,year:2023,y:2023,top:"基礎個人理財 —— 強制性公積金（強積金）制度之供款底線與豁免",topEn:"Basics of Personal Financial Management —— Personal Financial Planning & MPF Scheme (Contribution rules)",cn:"19. 下列哪位人士毋需作強制性公積金供款？\nA. 應屆文憑試考生,18歲,在快餐店任職暑期工,為期三個月,月入$9000。\nB. 兼職辦公室文員,35歲,月入$7000。\nC. 全職商場清潔工,63歲,月入$8500。\nD. 自僱籃球教練,40歲,月入$18000。",en:"19. Which of the following persons is not required to make contributions to the Mandatory Provident Fund?\nA. An 18-year-old DSE candidate with a monthly income of $9 000 for 3 months from a summer job in a fast food restaurant.\nB. A 35-year-old part-time office clerk with a monthly income of $7 000.\nC. A 63-year-old full-time shopping mall cleaner with a monthly income of $8 500.\nD. A 40-year-old self-employed basketball coach with a monthly income of $18 000.",ans:"B",rate:"57%",exCn:"B月薪$7,000低於最低有關入息$7,100，個人毋須供款。\n選 B。",exEn:"B earns $7,000/month, below the $7,100 minimum threshold. Employee is exempt from mandatory contributions.\nB is correct."},
{q:20,year:2023,y:2023,top:"[out c] 基礎會計 —— 原始分錄、交易登帳與現金折扣判定",topEn:"[out c] Bookkeeping —— Books of Original Entry & Cash Discount Eligibility",outc:true,reason:"自 2025 年起，會計記錄中各種折讓、貿易折扣與現金折扣的複式記帳實務已全數移至選修部分（會計單元）第五、七章（Paper 2A）。",reasonEn:"Starting from 2025, the recording of daily transactions, trade discount, cash discount entries, and bookkeeping rules are moved to Accounting Elective Module Paper 2A.",cn:"20. 陳氏電腦於2023年4月3日向客戶發出以下發票。該客戶於2023年4月20日以支票繳清欠款。\n\n陳氏電腦發票 (日期: 2023年4月3日)\n* 網絡攝影機 3台 @$600 = $1,800\n* 打印機 4台 @$2,100 = $8,400\n* 總額 $10,200 | 交易折扣 -$500 | 應付總額 $9,700\n* 條款：需於30天內繳付; 15天內繳付可享10%折扣。\n\n從陳氏電腦的角度而言，下列哪項有關上述交易的會計記帳是正確的？\nA. 應貸記銷貨帳$10200。\nB. 應借記銷貨折扣帳$970。\nC. 交易折扣$500應貸記應收貨款帳。\nD. 應借記銀行存款帳$9700。",en:"20. Chan's Computer issued the following invoice to a customer on 3 April 2023. The customer settled the debt by cheque on 20 April 2023.\n\nChan's Computer Invoice (Date: 3 April 2023)\n* Web camera: 3 units @$600 = $1,800\n* Printer: 4 units @$2,100 = $8,400\n* Total: $10,200 | Trade discount: $500 | Total: $9,700\n* Terms: To be paid within 30 days. 10% discount if paid within 15 days.\n\nFrom the perspective of Chan's Computer, which of the following accounting entries relating to the above transactions is correct?\nA. The sales account should be credited by $10 200.\nB. The discounts allowed account should be debited by $970.\nC. A trade discount of $500 should be credited to the trade receivables account.\nD. The bank account should be debited by $9 700.",ans:"D",rate:"57%",exCn:"4月3日按淨額$9,700入帳。4月20日付款已超15天折扣期，無折扣。正確分錄：借記銀行$9,700。選 D。",exEn:"On 3 April, record net amount $9,700. On 20 April, 17 days elapsed, exceeding 15-day discount period. Correct entry: Dr. Bank $9,700. D is correct."},
{q:21,year:2023,y:2023,top:"營商環境 —— 企業擁有權類型（香港跨國公司的特徵）",topEn:"Business Environment —— Forms of Business Ownership (Characteristics of multinational corporations)",cn:"21. 下列哪項有關香港跨國公司的陳述是正確的？\n(1) 它們也在其他國家營運。\n(2) 香港辦事處必定有從海外招聘的員工。\n(3) 它們可以是合營企業。\n\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"21. Which of the following statements about multinational corporations in Hong Kong is/are correct?\n(1) They also operate in other country/countries.\n(2) There must be employees recruited from overseas in their Hong Kong office.\n(3) They can be joint ventures.\n\nA. (1) only\nB. (1) and (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"C",rate:"81%",exCn:"(1) 正確：跨國公司在多國營運。\n(2) 錯誤：可全用本地員工。\n(3) 正確：可以合營企業形式經營。\n選 C。",exEn:"(1) Correct: MNCs operate in multiple countries.\n(2) Incorrect: Can use all local staff.\n(3) Correct: Can operate as joint ventures.\nC is correct."},
{q:22,year:2023,y:2023,top:"中小型企業 —— 企業家精神與特徵（企業家對商業發展的經濟貢獻）",topEn:"Small and Medium Enterprises (SMEs) —— Importance of Entrepreneurship in Business Development",cn:"22. 下列哪項有關企業家貢獻的陳述是正確的？\n(1) 有助實行政府的經濟政策\n(2) 有助促進經濟增長\n(3) 增加市場上的產品種類\n\nA. 只有(1)\nB. 只有(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"22. Which of the following statements about the contribution of entrepreneurs is/are correct?\n(1) help implement government economic policies\n(2) help promote economic growth\n(3) widen the variety of products in the market\n\nA. (1) only\nB. (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"66%",exCn:"(1) 錯誤：企業家核心功能非協助政府。\n(2) 正確：創造就業，推動經濟增長。\n(3) 正確：創新豐富產品種類。\n選 C。",exEn:"(1) Incorrect: Not a core function of entrepreneurs.\n(2) Correct: Creates jobs and drives growth.\n(3) Correct: Innovation widens product variety.\nC is correct."},
{q:23,year:2023,y:2023,top:"[out c] 不完整會計紀錄 —— 資本變動等式與期末餘額計算",topEn:"[out c] Incomplete Records —— Computing Capital Account Balances",outc:true,reason:"自 2025 年起，不完整會計紀錄及資本帳期末餘額計算已全數歸入選修部分（會計單元）第二十二章（Paper 2A）。",reasonEn:"Starting from 2025, incomplete accounting records, capital derivations, drawings calculations are tested in Accounting Elective Module Paper 2A (Chapter 22).",cn:"23. 截至2023年3月31日止年度，一家商號的資料如下：\n* 資本帳結餘, 2022年4月1日：$270 000\n* 本年度毛利：$7 500\n* 東主注入現金：$20 000\n* 提用：$9 000\n* 本年度淨損失：$84 000\n\n2023年3月31日的資本帳結餘是多少？\nA. $157 000\nB. $197 000\nC. $204 500\nD. $207 500",en:"23. The following is the information related to a firm for the year ended 31 March 2023:\n* Capital account balance, 1 April 2022: $270 000\n* Gross profit for the year: $7 500\n* Cash injection by the owner: $20 000\n* Drawings: $9 000\n* Net loss for the year: $84 000\n\nWhat is the balance of the capital account as at 31 March 2023?\nA. $157 000\nB. $197 000\nC. $204 500\nD. $207 500",ans:"B",rate:"63%",exCn:"期末資本 = $270,000 + $20,000 - $84,000 - $9,000 = $197,000。\n選 B。",exEn:"Closing capital = $270,000 + $20,000 - $84,000 - $9,000 = $197,000.\nB is correct."},
{q:24,year:2023,y:2023,top:"基礎個人理財 —— 策劃個人理財及投資（定期存款的風險、回報與提前支取規定）",topEn:"Basics of Personal Financial Management —— Personal Financial Planning & Investment (Term deposits)",cn:"24. 美莉存入一筆$100000為期一年的定期存款，年利率為4%。下列哪項有關這定期存款的陳述是正確的？\n(1) 實際年利率與名義年利率相同。\n(2) 如果六個月後的市場利率上升，存款的利率亦會上升。\n(3) 如果美莉在存入存款三個月後提取款項，她可得到利息收益$1000。\n\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"24. Mary has made a 1-year term deposit for $100 000 at an annual interest rate of 4%. Which of the following statements about this term deposit is/are correct?\n(1) The annual effective interest rate is same as the annual nominal interest rate.\n(2) If the market interest rate increases six months later, the interest rate of the deposit will increase.\n(3) If Mary withdraws the money three months after making the deposit, she will get an interest income of $1 000.\n\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"A",rate:"55%",exCn:"(1) 正確：一年期存款實際與名義利率相同。\n(2) 錯誤：定期存款鎖定固定利率。\n(3) 錯誤：提前支取將喪失利息。\n選 A。",exEn:"(1) Correct: 1-year deposit has same effective and nominal rates.\n(2) Incorrect: Term deposit locks in fixed rate.\n(3) Incorrect: Early withdrawal forfeits interest.\nA is correct."},
{q:25,year:2023,y:2023,top:"[out c] 不完整會計紀錄 —— 銷貨成本與購貨額之倒推計算",topEn:"[out c] Incomplete Records —— Deducing Purchases via Gross Profit Ratio",outc:true,reason:"自 2025 年起，不完整會計紀錄下銷貨成本與購貨總額之公式推導已全數移出必修，歸入選修部分（會計單元）第二十二章（Paper 2A）。",reasonEn:"Starting from 2025, the deduction of purchases and COGS from incomplete records are tested under Accounting Elective Module Paper 2A (Chapter 22).",cn:"25. 一家商號於2022年1月1日成立。根據以下資料，計算2022年度的購貨額：\n* 2022年度的銷貨：$1 200 000\n* 2022年12月31日的存貨：$115 000\n* 2022年度的毛利率：40%\n\nA. $365 000\nB. $595 000\nC. $605 000\nD. $835 000",en:"25. A firm was established on 1 January 2022. Calculate the amount of purchases for 2022 based on the following information:\n* Sales for 2022: $1 200 000\n* Inventory as at 31 December 2022: $115 000\n* Gross profit ratio for 2022: 40%\n\nA. $365 000\nB. $595 000\nC. $605 000\nD. $835 000",ans:"D",rate:"45%",exCn:"COGS = $1,200,000 x 60% = $720,000。\n購貨 = $720,000 + $115,000 - $0 = $835,000。\n選 D。",exEn:"COGS = $1,200,000 x 60% = $720,000.\nPurchases = $720,000 + $115,000 - $0 = $835,000.\nD is correct."},
{q:26,year:2023,y:2023,top:"[out c] 基礎個人理財 —— 以證券交易作投資（聯交所主板上市財務要求）",topEn:"[out c] Basics of Personal Financial Management —— Stock Trading (Main Board listing requirements)",outc:true,reason:"自 2025 年起，主板及創業板新申請人的基本上市要求已移出 Paper 1 必修考核範圍。",reasonEn:"Starting from 2025, knowledge about the basic listing requirements for new applicants of Main Board and GEM is not required in Paper 1.",cn:"26. 下列哪項不是在香港聯合交易所主板上市的基本上市要求？\nA. 市值\nB. 行政總裁的資歷\nC. 營業紀錄\nD. 現金流量",en:"26. Which of the following is not a basic listing requirement of the Main Board of the Stock Exchange of Hong Kong?\nA. market capitalisation\nB. the qualification of the Chief Executive Officer\nC. operating history\nD. cash flow",ans:"B",rate:"82%",exCn:"A、C、D均為主板上市基本要求。B的CEO資歷非財務硬性指標。\n選 B。",exEn:"A, C, D are basic listing requirements. B (CEO qualification) is not a mandatory financial requirement.\nB is correct."},
{q:27,year:2023,y:2023,top:"營商環境 —— 商業道德與社會責任（履行社會責任的方式與判定）",topEn:"Business Environment —— Business Ethics & Social Responsibility (Practising corporate social responsibility)",cn:"27. 下列哪項是一家超級市場履行社會責任的例子？\n(1) 向顧客提供消費獎賞計劃\n(2) 減少貨品包裝\n(3) 提供免費食物券予長者\n\nA. 只有(1)\nB. 只有(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"27. Which of the following is/are example(s) of a supermarket fulfilling its social responsibilities?\n(1) Offering consumption reward schemes to customers.\n(2) Reducing packaging for goods.\n(3) Providing free food coupons to senior citizens.\n\nA. (1) only\nB. (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"53%",exCn:"(1) 錯誤：消費獎賞是商業促銷手段。\n(2) 正確：減少包裝屬環保社會責任。\n(3) 正確：提供免費食物券屬關懷社區。\n選 C。",exEn:"(1) Incorrect: Reward schemes are promotional strategies.\n(2) Correct: Reducing packaging is environmental responsibility.\n(3) Correct: Free food coupons support community welfare.\nC is correct."},
{q:28,year:2023,y:2023,top:"[out c] 基礎會計 —— 複式記帳法與記帳科目借貸判定",topEn:"[out c] Introductory Bookkeeping —— Ledger Accounts Double Entry Rules",outc:true,reason:"自 2025 年起，複式記帳法、借貸增減規則、分類帳科目記錄已全數歸入選修會計單元（Paper 2A）第三章。",reasonEn:"Starting from 2025, the double-entry system, debit and credit rules for assets, liabilities, equity, revenues, and expenses are tested in Accounting Elective Module Paper 2A (Chapter 3).",cn:"28. 下列是一家文具店的複式記帳，哪項是正確的？\n選項 | 交易 | 借方帳戶 | 貸方帳戶\n---\nA. | 客戶退回於兩星期前以現金購買的貨物 | 銷貨 | 現金\nB. | 商號支付購買貨物的運費 | 購貨運費 | 購貨\nC. | 商號以賒帳方式出售辦公室電腦 | 應收帳款 | 銷貨\nD. | 商號以現金購買辦公室打印機的墨水 | 雜費 | 現金",en:"28. Which of the following double entries of a garment trading firm is correct?\nOption | Transaction | Account to be debited | Account to be credited\n---\nA. | A customer returned goods which were purchased in cash two weeks ago. | Sales | Cash\nB. | The firm paid a delivery charge for goods purchased. | Carriage inwards | Purchases\nC. | The firm sold an office computer on credit. | Accounts receivables | Sales\nD. | The firm bought ink for office printers in cash. | Sundry expenses | Cash",ans:"D",rate:"66%",exCn:"A 錯誤：應借記銷貨退回。\nB 錯誤：應貸記現金。\nC 錯誤：應貸記辦公室設備。\nD 正確：雜費增加借記，現金減少貸記。\n選 D。",exEn:"A Incorrect: Should debit Sales Returns.\nB Incorrect: Should credit Cash.\nC Incorrect: Should credit Office Equipment.\nD Correct: Dr. Sundry Expenses; Cr. Cash.\nD is correct."},
{q:29,year:2023,y:2023,top:"基礎個人理財 —— 策劃個人理財及投資（公司債券的特徵與權利）",topEn:"Basics of Personal Financial Management —— Personal Financial Planning & Investment (Characteristics of bonds)",cn:"29. 下列哪項有關公司債券持有人（債券持有人）的陳述是正確的？\nA. 債券持有人在公司周年大會中有投票權。\nB. 債券持有人有權分享公司的利潤。\nC. 如果公司清盤，債券持有人可在公司償還股東投資後取回本金。\nD. 即使公司錄得虧損，債券持有人仍可定期收取固定利息。",en:"29. Which of the following statements about a bondholder of a company is correct?\nA. A bondholder has voting rights in the annual general meeting of the company.\nB. A bondholder has the right to share the profits of the company.\nC. If the company is liquidated, a bondholder can get back the principal after the company has repaid the shareholders' investment.\nD. A bondholder receives periodic fixed interest even when the company makes a loss.",ans:"D",rate:"69%",exCn:"A、B 錯誤：債券持有人是債權人，無投票權和利潤分享權。\nC 錯誤：債權人優先於股東受償。\nD 正確：公司必須按期支付利息，不論盈虧。\n選 D。",exEn:"A, B Incorrect: Bondholders are creditors, no voting or profit-sharing rights.\nC Incorrect: Creditors have priority over shareholders in liquidation.\nD Correct: Interest must be paid regardless of profitability.\nD is correct."},
{q:30,year:2023,y:2023,top:"基礎管理 —— 組織結構與職權（部門劃分、直線與幕僚職權之辨析）",topEn:"Basics of Management —— Organising (Departmentalisation and types of authority)",cn:"30. 美味集團是一家本地連鎖餐廳，在不同餐廳提供中國餐、韓國餐及日本餐予顧客。其組織圖如下：\n* 總經理\n  * 下設功能層階：人力資源經理、營運經理、市場營銷經理\n  * 營運經理下設層階 C：經理（中國餐）、經理（韓國餐）、經理（日本餐）\n\n人力資源經理對營運經理有______(1)______職權。層階 C是按______(2)______劃分部門。\n\nA. 幕僚 | 產品\nB. 幕僚 | 地區\nC. 直線 | 產品\nD. 直線 | 地區",en:"30. Yummy Group is a local restaurant chain which offers Chinese cuisine, Korean cuisine and Japanese cuisine to customers in different restaurants. Its organisation chart is shown as below:\n* General Manager\n  * Level B: Human Resources Manager | Operations Manager | Marketing Manager\n  * Level C (under Operations Manager): Manager (Chinese) | Manager (Korean) | Manager (Japanese)\n\nThe Human Resources Manager has (1) __________ authority over the Operations Manager. Level C is departmentalised by (2) __________.\n\nA. staff | product\nB. staff | location\nC. line | product\nD. line | location",ans:"A",rate:"19%",exCn:"(1) 人力資源經理屬幕僚職權，非直線職權。\n(2) 按菜式（產品）劃分部門。\n選 A。",exEn:"(1) HR Manager has staff authority, not line authority.\n(2) Departmentalised by product (cuisine type).\nA is correct."},
{q:1,year:2024,y:2024,top:"營商環境 —— 商業在香港經濟中擔當的角色及其重要性",topEn:"Business Environment —— Role and Importance of Business in the Hong Kong Economy",cn:"1. 下列哪項是商界對香港經濟的貢獻？\n(1) 銷售貨品與服務到海外以賺取外匯\n(2) 為本地居民提供就業機會\n(3) 為政府帶來稅收\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"1. In which ways does the business sector contribute to the Hong Kong economy?\n(1) It earns foreign exchange by selling goods and services abroad.\n(2) It provides employment opportunities to local people.\n(3) It generates tax revenue for the government.\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"61%",exCn:"1. **D 正確**：\n   * *(1) 正確*：香港商界銷售商品與服務至海外，是香港賺取外匯、支持港元匯率穩定的核心來源。\n   * *(2) 正確*：私營商業機構提供了香港絕大多數的就業職位，是本地居民生計和就業保障的基石。\n   * *(3) 正確*：企業繳納的利得稅（Profits tax）是香港特區政府財政收入的主要來源之一。\n2. 綜上，(1)、(2)、(3) 均是商界對本港經濟的重要貢獻，選 D。",exEn:"1. **D is correct**:\n   * *(1) is correct*: The business sector earns foreign exchange for Hong Kong by exporting goods and services, which is vital for backing the Hong Kong Dollar.\n   * *(2) is correct*: Private commercial enterprises provide the vast majority of jobs in Hong Kong, supporting the livelihoods of local residents.\n   * *(3) is correct*: Corporate profits tax and other business taxes are major sources of revenue for the HKSAR Government.\n2. Therefore, all (1), (2), and (3) are significant contributions of the business sector to the Hong Kong economy. Thus, D is correct."},
{q:2,year:2024,y:2024,top:"基礎管理 —— 組織結構的部門劃分與管理階層",topEn:"Basics of Management —— Organisational Structure (Tall and Flat structures)",cn:"2. 與採用扁平式架構及規模相若的商號比較，下列哪項有關採用高架式架構的商號的陳述是正確的？\n(1) 中層管理人員較多。\n(2) 它能較迅速回應市場轉變。\n(3) 管理人員監督較少直屬下屬。\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"2. Compared to a firm with a flat structure and of a similar size, which of the following statements about a firm with a tall structure is/are correct?\n(1) There are more middle managers.\n(2) It can respond to market changes more rapidly.\n(3) Managers supervise fewer direct subordinates.\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"83%",exCn:"1. **B 正確**：\n   * *(1) 正確*：高架式組織（Tall structure）具有較多的管理層級。在企業總員工規模相若的前提下，更多的層級意味著需要設置更多的中層管理崗位（中層人員較多）。\n   * *(2) 錯誤*：高架式架構因層級多，訊息傳遞和審批流程緩慢，對市場變化的反應速度通常比扁平式「更慢」而非迅速。\n   * *(3) 正確*：高架式組織的特徵即是「窄控制幅度（Narrow span of control）」，因此每位主管直接監督的直屬下屬人數較少。\n2. 綜上，(1) 和 (3) 正確，選 B。",exEn:"1. **B is correct**:\n   * *(1) is correct*: A tall structure has more management levels, which naturally requires hiring more middle managers to oversee the vertical hierarchy when the firm size is similar.\n   * *(2) is incorrect*: Due to its numerous layers and bureaucratic processes, information transfer is slower, making its response to market changes slower (not faster) than a flat structure.\n   * *(3) is correct*: By definition, a tall structure features a \"narrow span of control,\" meaning each manager supervises fewer direct subordinates.\n2. Therefore, only (1) and (3) are correct. Thus, B is correct."},
{q:3,year:2024,y:2024,top:"財務報表的使用者與用途",topEn:"Purpose and Users of Financial Statements",outc:true,reason:"自 2025 年起，「財務報表的使用者、主要用途及局限」已全數移至選修部分（會計單元）第七章（Paper 2A），不再屬於卷一必修範圍。",reasonEn:"Starting from 2025, 'Financial statements: users, uses, and limitations' are fully transferred to Elective Module Paper 2A (Chapter 7) and excluded from Paper 1.",cn:"3. 下列哪項是財務報表的用途？\n(1) 用作評稅\n(2) 用作分析商號的財務資訊\n(3) 用作比較行業中不同商號的財務表現\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"3. Which of the following is/are the use(s) of financial statements?\n(1) for assessing tax\n(2) for analysing financial information of a firm\n(3) for comparing the financial performance of different firms in an industry.\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"37%",exCn:"1. **D 正確**：\n   * *(1) 正確*：稅務局會以此評估並計算企業的應繳利得稅（評稅）。\n   * *(2) 正確*：內部管理層和外部投資者、債權人均使用報表來進行財務分析。\n   * *(3) 正確*：投資者可透過各家企業的財務報表，橫向對比同行業內不同商號的盈利與變現等表現。\n2. 綜上，(1)、(2)、(3) 均正確，選 D。",exEn:"1. **D is correct**:\n   * *(1) is correct*: The tax authority (Inland Revenue Department) uses financial statements to assess the corporate profits tax liability.\n   * *(2) is correct*: Both internal managers and external stakeholders analyze the statements to evaluate the firm's financial health.\n   * *(3) is correct*: Investors use the statements to compare and benchmark the financial performance and profitability of different firms within the same industry.\n2. Therefore, all (1), (2), and (3) are correct. Thus, D is correct."},
