{q:4,year:2024,y:2024,top:"基礎個人理財 —— 強制性公積金（強積金）制度下的權益與規則",topEn:"Basics of Personal Financial Management —— Rights and Responsibilities under MPF Scheme",cn:"4. 下列哪項是自僱人士在強制性公積金（強積金）制度下享有的權利？\nA. 如他們的每月有關入息低於$7100,可以選擇退出強積金計劃。\nB. 他們可每年從強積金計劃提取部分累算權益。\nC. 他們可更改其強積金帳戶的投資組合。\nD. 他們可選擇每季作一次強積金供款。",en:"4. Which of the following is a right enjoyed by self-employed persons under the Mandatory Provident Fund (MPF) System?\nA. They can choose to opt out of the MPF Scheme if their monthly relevant income is below $7100.\nB. They can withdraw part of the accrued benefits from the MPF Scheme each year.\nC. They can change the investment portfolio of their MPF accounts.\nD. They can choose to make MPF contributions quarterly.",ans:"C",rate:"53%",exCn:"1. **C 正確**：\n   * *A 錯誤*：月入低於 $7,100 的自僱人士僅是「免除強制性供款」，但**依然必須登記並加入強積金計劃**，不可選擇退出。\n   * *B 錯誤*：除法定特定情況外，累算權益必須保存至 65 歲，不可每年提取。\n   * *C 正確*：無論是僱員還是自僱人士，均享有隨時/定期更改個人強積金帳戶投資組合的權利。\n   * *D 錯誤*：自僱人士一般可選擇按月或按年作出供款，並無每季一次的法定自選規則。\n2. 故選 C。",exEn:"1. **C is correct**:\n   * *A is incorrect*: Self-employed persons with monthly relevant income below $7,100 are exempt from making mandatory contributions, but they must still enrol in an MPF scheme.\n   * *B is incorrect*: Accrued benefits must be preserved until the retirement age of 65 and cannot be withdrawn annually.\n   * *C is correct*: All MPF scheme members have the absolute right to change their investment portfolios.\n   * *D is incorrect*: Self-employed persons can choose to make contributions on a monthly or yearly basis, not quarterly.\n2. Therefore, option C is the correct answer."},
{q:5,year:2024,y:2024,top:"財務報表的使用者及其資訊需要",topEn:"Users of Financial Statements and Their Information Needs",outc:true,reason:"財務報表的外部/內部使用者及其資訊需要，自 2025 年起已全數移至選修部分（會計單元）第七章（Paper 2A）。",reasonEn:"Starting from 2025, 'Financial statements: users and their information needs' are fully transferred to Elective Module Paper 2A (Chapter 7) and excluded from Paper 1.",cn:"5. 下列哪位是同時關注商號盈利能力和變現能力的財務報表外部使用者？\nA. 高層管理人員\nB. 顧客\nC. 供應商\nD. 政府",en:"5. Which of the following is an external user of financial statements who is concerned with both the profitability and liquidity of a firm?\nA. top management\nB. customers\nC. suppliers\nD. government",ans:"C",rate:"55%",exCn:"1. **C 正確**：\n   * *A 排除*：高層管理人員是公司的「內部使用者」，與題幹「外部使用者」不符。\n   * *B、D 排除*：顧客和政府均不以盈利和變現能力作為核心關注點。\n   * *C 正確*：供應商屬於外部使用者，首要關注商號的變現能力，同時也關注其盈利能力。\n2. 故選 C。",exEn:"1. **C is correct**:\n   * *A is excluded*: Top management are \"internal users,\" violating the question's premise.\n   * *B & D are excluded*: Customers and government do not prioritize both liquidity and profitability.\n   * *C is correct*: Suppliers are external users concerned with both liquidity and profitability.\n2. Thus, option C is correct."},
{q:6,year:2024,y:2024,top:"基礎管理 —— 管理功能（領導風格的判定與特徵）",topEn:"Basics of Management —— Management Functions (Leadership styles)",cn:"6. 莊力剛畢業。他加入了一家廣告公司的創作團隊。他的上司只為他提供基本的工作指引。莊力可最終決定廣告計劃的細節。\n根據以上資料，莊力的上司採用______式的領導風格，______。\nA. 民主 ...... 莊力的工作滿足感因而較高\nB. 民主 ...... 團隊成員之間因而合作不足\nC. 自由放任 ...... 莊力在工作上會變得被動\nD. 自由放任 ...... 莊力在面對挑戰時可能會感到沮喪",en:"6. John has just graduated. He joined the creative team of an advertising company. His supervisor only provided him with basic guidelines for his work. John can make the final decisions on the details of the advertising projects.\nBased on the above information, John's supervisor adopts the _____ style of leadership, _____.\nA. democratic ... John's job satisfaction is therefore higher\nB. democratic ... cooperation among team members is therefore insufficient\nC. laissez-faire ... John will become passive in his work\nD. laissez-faire ... John may feel frustrated when facing challenges",ans:"D",rate:"61%",exCn:"1. **D 正確**：\n   * **風格判定**：上司「只提供基本指引」並讓莊力「最終決定廣告細節」，屬於典型的自由放任式領導風格。\n   * **影響判定**：莊力作為新手，缺乏專業經驗，在自由放任環境下容易感到沮喪。\n2. 故選 D。",exEn:"1. **D is correct**:\n   * The supervisor delegated decision-making power, representing a laissez-faire style.\n   * Since John lacks experience, working in such an environment may leave him frustrated.\n2. Therefore, option D is correct."},
{q:7,year:2024,y:2024,top:"試算表 —— 試算表之功能、編製與會計餘額方向",topEn:"Trial Balance —— Characteristics and Functions",outc:true,reason:"自 2025 年起，「試算表（Trial Balance）的功能、限制與帳戶結平餘額判定」已全數歸入選修部分（會計單元）第六章（Paper 2A）。",reasonEn:"Starting from 2025, 'Trial Balance: features, balancing off and column categorization' are fully transferred to Elective Module Paper 2A (Chapter 6) and excluded from Paper 1.",cn:"7. 下列哪項有關試算表的陳述是正確的？\n(1) 它是在期末調整前編製的。\n(2) 如試算表不平衡，淨利額將會出錯。\n(3) 如結餘轉下顯示在帳戶的借方，這帳戶的結餘會顯示在試算表的借方欄。\n\nA. 只有(1)\nB. 只有(2)及(3)\nC. 只有(1)及(3)\nD. 只有(2)",en:"7. Which of the following statements about a trial balance is/are correct?\n(1) It is prepared before making period-end adjustments.\n(2) If the trial balance is not balanced, the net profit will be wrong.\n(3) If the balance carried down is shown on the debit side of an account, the balance of this account will be shown in the debit column of the trial balance.\n\nA. (1) only\nB. (2) and (3) only\nC. (1) and (3) only\nD. (2) only",ans:"A",rate:"55%",exCn:"1. **A 正確**：\n   * *(1) 正確*：試算表確實是在進行期末調整分錄之前先編製的。\n   * *(2) 錯誤*：即使試算表不平衡，會計師可開立暫記帳戶以使借貸平衡。\n   * *(3) 錯誤*：如結餘轉下顯示在借方，說明該帳戶是貸方結餘，應顯示在貸方欄。\n2. 綜上，只有 (1) 正確，選 A。",exEn:"1. **A is correct**:\n   * *(1) is correct*: A trial balance is prepared before period-end adjustments.\n   * *(2) is incorrect*: Accountants can use a suspense account to force-balance.\n   * *(3) is incorrect*: If balance c/d is on debit, the account carries a credit balance.\n2. Therefore, only (1) is correct. Thus, A is correct."},
{q:8,year:2024,y:2024,top:"基礎個人理財 —— 消費者信貸（個人信貸紀錄與信用卡卡權）",topEn:"Basics of Personal Financial Management —— Consumer Credit (Personal credit records)",cn:"8. 若要維持良好個人信貸記錄，信用卡用戶應\n(1) 盡用其信用卡的信用限額\n(2) 在使用信用卡前評估自己的還款能力\n(3) 在繳款期限當日或以前清償信用卡欠款\n\nA. (1)、(2)及(3)\nB. 只有(2)及(3)\nC. 只有(2)\nD. 只有(1)",en:"8. To maintain a good personal credit record, credit card users should\n(1) make full use of the credit limit of their credit cards\n(2) evaluate their repayment ability before using credit cards\n(3) settle monthly credit card balances on or before the payment due date\n\nA. (1), (2) and (3)\nB. (2) and (3) only\nC. (2) only\nD. (1) only",ans:"C",rate:"94%",exCn:"1. **C 正確**：\n   * *(1) 錯誤*：盡用信用限額會被視為高風險，反而降低信用評分。\n   * *(2) 正確*：使用信用卡前評估還款能力是負責任的理財態度。\n   * *(3) 正確*：按時還款是建立良好信用評級最核心的方式。\n2. 綜上，(2) 和 (3) 正確，選 C。",exEn:"1. **C is correct**:\n   * *(1) is incorrect*: Maxing out credit limits signals high financial risk.\n   * *(2) is correct*: Assessing repayment capacity before spending is prudent.\n   * *(3) is correct*: Settling balances on time is critical for credit rating.\n2. Therefore, statements (2) and (3) are correct. Thus, C is correct."},
{q:9,year:2024,y:2024,top:"營商環境 —— 香港經濟發展近況（全球一體化的利與弊）",topEn:"Business Environment —— Recent Developments of Hong Kong Economy (Globalisation)",cn:"9. 下列哪項是全球一體化對香港經濟的好處？\n(1) 促進國際市場的拓展\n(2) 增加本港企業的利潤\n(3) 全球採購令成本下降\n\nA. 只有(2)及(3)\nB. (1)、(2)及(3)\nC. 只有(1)及(3)\nD. 只有(1)",en:"9. Which of the following are the benefits of globalisation to the Hong Kong economy?\n(1) promote expansion into international markets\n(2) increase profits of local enterprises\n(3) global sourcing reduces costs\n\nA. (2) and (3) only\nB. (1), (2) and (3)\nC. (1) and (3) only\nD. (1) only",ans:"B",rate:"51%",exCn:"1. **B 正確**：\n   * *(1) 正確*：全球一體化打破了貿易壁壘，便利香港企業向國際市場拓展。\n   * *(2) 正確*：開拓海外市場能顯著增加本地企業的利潤空間。\n   * *(3) 正確*：全球化使企業可進行全球採購，有效降低生產和營運成本。\n2. 綜上，(1)、(2)、(3) 均屬於全球一體化帶來的好處，選 B。",exEn:"1. **B is correct**:\n   * *(1) is correct*: Globalisation removes barriers to international trade.\n   * *(2) is correct*: Access to global consumer bases enables HK enterprises to increase profit margins.\n   * *(3) is correct*: Global sourcing allows firms to lower operating costs.\n2. Therefore, all (1), (2), and (3) are valid benefits. Thus, B is correct."},
{q:10,year:2024,y:2024,top:"基礎會計 —— 基礎會計等式及期末資本餘額計算",topEn:"Introductory Accounting —— Accounting Equation and Capital Calculations",outc:true,reason:"自 2025 年起，「會計等式的基本運算、科目分類與資本變動帳目」已全數移至選修部分（會計單元）第二、三、二十二章（Paper 2A）。",reasonEn:"Starting from 2025, 'The Accounting Equation and basic financial elements calculations' are fully transferred to Elective Module Paper 2A (Chapters 2, 3, and 22) and excluded from Paper 1.",cn:"10. 一家商號於2023年1月1日所有帳戶的結餘如下：\n* 設備 $600 000 | 存貨 98 000 | 應付貨款 82 000 | 銀行存款 78 000 | 應收貨款 25 000\n截至2023年12月31日止年度商號的淨損失為$54000。年內，東主向商號注入$100000。2023年12月31日，商號的資本帳結餘為____。\nA. $765 000\nB. $929 000\nC. $879 000\nD. $873 000",en:"10. A firm had the following balances as at 1 January 2023:\n* Equipment $600 000, Inventory $98 000, Trade payables $82 000, Bank $78 000, Trade receivables $25 000, Capital ?.\nFor the year ended 31 December 2023, the net loss of the firm was $54 000. During the year, the owner injected $100 000 into the firm. As at 31 December 2023, the balance of the capital account of the firm was _____.\nA. $765 000\nB. $929 000\nC. $879 000\nD. $873 000",ans:"A",rate:"67%",exCn:"1. **A 正確**：\n   * 期初資本 = 資產 $801,000 - 負債 $82,000 = $719,000\n   * 期末資本 = $719,000 + $100,000 - $54,000 = **$765,000**\n2. 故選 A。",exEn:"1. **A is correct**:\n   * Opening Capital = Assets $801,000 - Liabilities $82,000 = $719,000\n   * Closing Capital = $719,000 + $100,000 - $54,000 = **$765,000**\n2. Therefore, option A is correct."},
{q:11,year:2024,y:2024,top:"基礎管理 —— 管理功能（組織功能：人手調配與分工）",topEn:"Basics of Management —— Management Functions (Organising)",cn:"11. 一家商號委派一批新聘請的員工到不同部門。這工作屬於下列哪項管理功能？\nA. 計劃\nB. 組織\nC. 領導\nD. 控制",en:"11. A firm assigns a group of newly-recruited staff to different departments. Which of the following management functions does the task belong to?\nA. planning\nB. organising\nC. leading\nD. controlling",ans:"B",rate:"77%",exCn:"1. **B 正確**：\n   * 組織功能涉及建立健全的組織結構、劃分部門、以及將人力資源進行分配與調配。將新聘員工分配到不同部門工作，直接屬於組織功能的範疇。\n2. 故選 B。",exEn:"1. **B is correct**:\n   * Organising involves establishing organizational structures and allocating resources. Assigning newly-recruited employees to various departments is a classic task under the organizing function.\n2. Therefore, option B is correct."},
{q:12,year:2024,y:2024,top:"基礎會計 —— 提用帳的記帳範疇與項目判定",topEn:"Introductory Accounting —— Scope of Drawings Account Entries",outc:true,reason:"自 2025 年起，「提用帳的記帳科目、複式會計分錄及會計假設應用」已全數移至選修部分（會計單元）第三、五、二十二章（Paper 2A），必修部分不再考核。",reasonEn:"Starting from 2025, 'Bookkeeping for owner's drawings, capital accounts, and related business entity transactions' are fully transferred to Elective Module Paper 2A (Chapters 3, 5, and 22).",cn:"12. 下列哪項應記錄在商號的提用帳？\n(1) 東主款待朋友午餐，以商號的信用卡支付午餐費用。\n(2) 東主以自己名義捐款予某慈善組織，指示會計文員以商號的支票支付。\n(3) 東主取走商號的貨物自用。\n\nA. 只有(1)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"12. Which of the following should be recorded in the drawings account of a firm?\n(1) The owner used the firm's credit card to pay for the lunch with his/her friends.\n(2) The owner made a donation to a charitable organisation in his/her own name and instructed the accounting clerk to settle it with the firm's cheque.\n(3) The owner took the firm's goods for personal use.\n\nA. (1) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"70%",exCn:"1. **D 正確**：\n   * 提用指企業擁人提取企業資金或商品用作私人非商用用途。\n   * (1)(2)(3) 均屬於東主私人支出，必須記入提用帳。\n2. 綜上，(1)、(2) 和 (3) 均必須記入提用帳，選 D。",exEn:"1. **D is correct**:\n   * Drawings refers to withdrawal of business assets for personal use.\n   * (1)(2)(3) are all private expenditures that must be charged to drawings.\n2. Therefore, all (1), (2), and (3) must be recorded in the drawings account. Thus, D is correct."},
{q:13,year:2024,y:2024,top:"營商環境 —— 國際貿易合作組織（亞太區經濟合作組織 APEC 的特色）",topEn:"Business Environment —— Major International Trade Organisations (APEC)",cn:"13. 下列哪項有關亞太區經濟合作組織的陳述是正確的？\n(1) 它為發展中國家的經濟增長提供財政支援。\n(2) 它的宗旨是令亞太地區國家更繁榮昌盛。\n(3) 成員可自行決定是否執行它所作的決定。\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"13. Which of the following statements about Asia-Pacific Economic Cooperation is/are correct?\n(1) It provides financial support for economic growth in developing countries.\n(2) Its goal is to make the Asia-Pacific region more prosperous.\n(3) Members can decide on their own whether or not to implement the decisions made by it.\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"53%",exCn:"1. **C 正確**：\n   * *(1) 錯誤*：提供財政支援是世界銀行或 IMF 的功能，並非 APEC 的核心職能。\n   * *(2) 正確*：APEC 的宗旨是令亞太地區更繁榮昌盛。\n   * *(3) 正確*：APEC 的核心合作原則為「非約束性、自願及協商一致」。\n2. 因此，(2) 和 (3) 正確，選 C。",exEn:"1. **C is correct**:\n   * *(1) is incorrect*: Providing financial support is the role of the World Bank or IMF, not APEC.\n   * *(2) is correct*: APEC's goal is to make the Asia-Pacific region more prosperous.\n   * *(3) is correct*: APEC operates on the principle of non-binding, voluntary commitments.\n2. Therefore, only (2) and (3) are correct. Thus, C is correct."},
{q:14,year:2024,y:2024,top:"基礎個人理財 —— 消費者信貸（私人分期貸款之特點對比）",topEn:"Basics of Personal Financial Management —— Consumer Credit (Personal installment loans)",cn:"14. 下列哪項有關私人分期貸款的陳述是正確的？\n(1) 有固定還款期。\n(2) 貸款期內的利率是浮動的。\n(3) 利率通常較銀行透支低。\n\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"14. Which of the following statements about a personal installment loan is/are correct?\n(1) It has a fixed repayment period.\n(2) The interest rate is floating during the loan period.\n(3) The interest rate is usually lower than bank overdrafts.\n\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"C",rate:"71%",exCn:"1. **C 正確**：\n   * *(1) 正確*：私人分期貸款設有明確固定的分期還款期限。\n   * *(2) 錯誤*：常規私人分期貸款採用固定利率。\n   * *(3) 正確*：相較於銀行透支，私人分期貸款的利率通常顯著較低。\n2. 綜上，(1) 和 (3) 正確，選 C。",exEn:"1. **C is correct**:\n   * *(1) is correct*: A personal installment loan has a fixed repayment period.\n   * *(2) is incorrect*: Conventional installment loans use fixed interest rates.\n   * *(3) is correct*: Compared to bank overdrafts, installment loans offer much lower rates.\n2. Therefore, statements (1) and (3) are correct. Thus, C is correct."},
{q:15,year:2024,y:2024,top:"控制系統 —— 應付貨款分類帳統制帳戶的結算與餘額判定",topEn:"Control Systems —— Trade Payables Account and Balancing Off",outc:true,reason:"自 2025 年起，「會計控制系統：原始分錄與應收/應付帳款統制帳戶、T字帳戶結算」已全數歸入選修部分（會計單元）第八、九、十八章（Paper 2A）。",reasonEn:"Starting from 2025, 'Bookkeeping, balancing off ledgers, and Trade Receivables/Payables Control Accounts' are fully transferred to Elective Module Paper 2A (Chapters 8, 9, and 18) and excluded from Paper 1.",cn:"15. 以下是一家商號2024年3月的應付貨款帳\n應付貨款\n3月5日 購貨退出 $14,000 | 3月1日 承上結餘 $49,000\n| 3月12日 購貨 $58,000\n| 3月19日 購貨 $32,000\n\n2024年3月23日，該商號向供應商償還一半的欠款。該商號的應付貨款帳於2024年3月31日的結餘是____。\nA. $62 500\nB. $69 500\nC. $76 500\nD. $78 500",en:"15. The following is the trade payables account of a firm in March 2024:\nMar 5 Returns outwards $14,000 | Mar 1 Balance b/f $49,000\n| Mar 12 Purchases $58,000\n| Mar 19 Purchases $32,000\n\nOn 23 March 2024, the firm repaid half of the outstanding amount. The balance as at 31 March 2024 was _____.\nA. $62 500\nB. $69 500\nC. $76 500\nD. $78 500",ans:"A",rate:"76%",exCn:"1. **A 正確**：\n   * 付款前淨欠額 = $49,000 + $58,000 + $32,000 - $14,000 = $125,000\n   * 償還一半 = $125,000 / 2 = **$62,500**\n2. 故選 A。",exEn:"1. **A is correct**:\n   * Net outstanding = $49,000 + $58,000 + $32,000 - $14,000 = $125,000\n   * Repaid half = $125,000 / 2 = **$62,500**\n2. Therefore, option A is correct."},
{q:16,year:2024,y:2024,top:"以證券交易作投資 —— 香港的證券交易平台（主板與GEM上市要求之對比）",topEn:"Stock Trading as an Investment —— Basic Listing Requirements (Main Board vs. GEM)",outc:true,reason:"自 2025 年文憑試起，必修部分大綱明確規定「以證券交易作投資：不包括主板及創業板新申請人的基本上市要求」。",reasonEn:"Starting from 2025, the compulsory syllabus under '1(d) Basics of Personal Financial Management: Stock Trading' explicitly excludes 'the basic listing requirements for new applicants of Main Board and GEM'.",cn:"16. 下表比較新申請人在香港聯合交易所兩個平台上市的基本要求：\n平台 A：營業紀錄較長，市值較高\n平台 B：營業紀錄較短，市值較低\n\n下列哪項陳述是正確的？\nA. 在平台A上市的公司每年均會向股東派發股息。\nB. 在平台A上市的公司數目較在平台B上市的為多。\nC. 平台A的對象是跨國公司，而平台B的對象則是中小型企業。\nD. 欠缺經驗的投資者應只投資在平台B上市的股票。",en:"16. The table compares the basic listing requirements for new applicants on the two trading platforms:\nPlatform A: longer operating history, higher market capitalisation\nPlatform B: shorter operating history, lower market capitalisation\n\nWhich of the following statements is correct?\nA. Companies listed on Platform A will distribute dividends to shareholders every year.\nB. The number of companies listed on Platform A is larger than that on Platform B.\nC. Platform A is designed for multinational corporations, while Platform B is designed for SMEs.\nD. Inexperienced investors should only invest in stocks listed on Platform B.",ans:"B",rate:"47%",exCn:"1. **B 正確**：\n   * 平台 A 是主板，平台 B 是 GEM。\n   * *A 錯誤*：是否派發股息取決於盈利能力和董事局決定。\n   * *B 正確*：主板上市公司數目遠多於 GEM。\n   * *C 錯誤*：主板並不限於跨國公司，GEM 亦非專門針對中小企。\n   * *D 錯誤*：GEM 風險極高，不適合欠缺經驗的投資者。\n2. 故選 B。",exEn:"1. **B is correct**:\n   * Platform A is Main Board; Platform B is GEM.\n   * *A is incorrect*: Dividend distribution depends on profitability.\n   * *B is correct*: Main Board has significantly more listed companies than GEM.\n   * *C is incorrect*: Main Board is not limited to MNCs; GEM is not designed solely for SMEs.\n   * *D is incorrect*: GEM stocks are high-risk and unsuitable for inexperienced investors.\n2. Therefore, option B is correct."},
{q:17,year:2024,y:2024,top:"基礎管理 —— 有效管理的原則（分工之優點）",topEn:"Basics of Management —— Principles of Effective Management (Division of work)",cn:"17. 由於「分工」______，所以工廠的生產效率得以提升。\nA. 省去員工轉換不同工作的時間\nB. 提高不同工作的相互倚賴程度\nC. 有助減少生產程序的延誤\nD. 提高員工士氣",en:"17. Due to \"division of work\", the production efficiency of a factory can be enhanced because _____.\nA. it saves employees' time from switching between different tasks\nB. it increases the interdependence among different tasks\nC. it helps reduce production delays\nD. it improves staff morale",ans:"A",rate:"81%",exCn:"1. **A 正確**：\n   * 分工能省去員工在不同工作之間切換所浪費的時間。\n   * B、C 錯誤：分工會拉高工序間的相互倚賴度。\n   * D 錯誤：長期重複單一工序會降低員工士氣。\n2. 故選 A。",exEn:"1. **A is correct**:\n   * Division of work saves time workers waste switching between tasks.\n   * B & C are incorrect: Division increases interdependence.\n   * D is incorrect: Repetitive tasks decrease morale.\n2. Therefore, option A is correct."},
{q:18,year:2024,y:2024,top:"原始分錄帳簿及分類帳 —— 現金與銀行存款帳之運算",topEn:"Books of Original Entry and Ledger —— Bank Account Balances",outc:true,reason:"自 2025 年起，「三欄現金簿（現金及銀行存款欄）的日常登帳、過帳與科目平衡結算」已全數移至選修部分（會計單元）第五章（Paper 2A）。",reasonEn:"Starting from 2025, 'Bookkeeping, three-column cash book entries, and ledger account balancing' are fully transferred to Elective Module Paper 2A (Chapter 5).",cn:"18. 2024年3月1日一家商號的帳戶結餘如下：資本$97000、現金$50000、銀行存款$60000、應收貨款$45000、銀行貸款$28000及應付貨款$45000。\n2024年3月，東主向商號注入現金$30000。商號以支票清償銀行貸款，並以銀行自動轉帳支付電費$1000。\n2024年3月31日，這商號銀行存款帳的結餘是多少？\nA. $14 000\nB. $31 000\nC. $44 000\nD. $61 000",en:"18. On 1 March 2024, the account balances of a firm were as follows: Capital $97 000, Cash $50 000, Bank $60 000, Trade receivables $45 000, Bank loan $28 000, and Trade payables $45 000.\nIn March 2024, the owner injected cash of $30 000 into the firm. The firm settled the bank loan by cheque, and paid electricity expenses of $1 000 by bank autopay.\nAs at 31 March 2024, what was the balance of the bank account of this firm?\nA. $14 000\nB. $31 000\nC. $44 000\nD. $61 000",ans:"B",rate:"78%",exCn:"1. **B 正確**：\n   * 期初銀行存款 = $60,000\n   * 注入現金不涉及銀行帳戶\n   * 支票清償貸款：-$28,000\n   * 自動轉帳支付電費：-$1,000\n   * 期末銀行存款 = $60,000 - $28,000 - $1,000 = **$31,000**\n2. 故選 B。",exEn:"1. **B is correct**:\n   * Opening bank balance = $60,000\n   * Cash injection does not affect bank account\n   * Cheque payment: -$28,000\n   * Autopay: -$1,000\n   * Closing bank balance = $60,000 - $28,000 - $1,000 = **$31,000**\n2. Therefore, option B is correct."},
{q:19,year:2024,y:2024,top:"營商環境 —— 影響商業決策的因素（外在經濟因素的判定）",topEn:"Business Environment —— Factors affecting business decisions (Economic factors)",cn:"19. 一家外資快餐連鎖店計劃在香港成立分店。下列哪項是影響該連鎖店的經濟因素？\n(1) 香港的物價水平\n(2) 香港的勞動人口結構\n(3) 港珠澳大橋的營運\n\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"19. A foreign fast food chain plans to establish a branch in Hong Kong. Which of the following is/are economic factor(s) that might affect this chain?\n(1) price level of Hong Kong\n(2) population structure of Hong Kong\n(3) operation of the Hong Kong-Zhuhai-Macao Bridge\n\nA. (1) only\nB. (1) and (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"A",rate:"61%",exCn:"1. **A 正確**：\n   * *(1) 正確*：物價水平是核心的總體經濟指標。\n   * *(2) 錯誤*：勞動人口結構屬於社會和文化因素。\n   * *(3) 錯誤*：大橋營運狀況屬於自然地理因素。\n2. 綜上，只有 (1) 是經濟因素，選 A。",exEn:"1. **A is correct**:\n   * *(1) is correct*: Price level is a primary macroeconomic indicator.\n   * *(2) is incorrect*: Population structure falls under Social and Cultural factors.\n   * *(3) is incorrect*: Infrastructure falls under Physical factors.\n2. Therefore, only (1) is an economic factor. Thus, A is correct."},
{q:20,year:2024,y:2024,top:"基礎個人理財 —— 策劃個人理財及投資（恆生指數特徵與代表性）",topEn:"Basics of Personal Financial Management —— Stock Trading (Hang Seng Index)",cn:"20. 如某年最後一個交易日的恆生指數較該年首個交易日的為低,這表示該年度\n(1) 恆生指數成分股的數目減少\n(2) 恆生指數成分股的整體價格水平下跌\n(3) 香港股票市場新上市公司所籌集的資金額減少\n\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"20. If the Hang Seng Index on the last trading day of a year is lower than that on the first trading day of the year, it means that _____ during the year.\n(1) the number of constituent stocks of the Hang Seng Index decreased\n(2) the overall price level of the constituent stocks of the Hang Seng Index fell\n(3) the amount of capital raised by newly-listed companies in the Hong Kong stock market decreased\n\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"B",rate:"70%",exCn:"1. **B 正確**：\n   * *(1) 錯誤*：成分股數目由委員會定期檢討決定。\n   * *(2) 正確*：指數點數下跌代表成分股整體價格水平下跌。\n   * *(3) 錯誤*：IPO 籌資與恆指升跌無直接因果關係。\n2. 綜上，只有 (2) 正確，選 B。",exEn:"1. **B is correct**:\n   * *(1) is incorrect*: Changes in constituent stocks are decided by the advisory committee.\n   * *(2) is correct*: A decline in HSI points indicates falling price levels.\n   * *(3) is incorrect*: IPO capital is not tied to HSI fluctuations.\n2. Therefore, only (2) is correct. Thus, B is correct."},
{q:21,year:2024,y:2024,top:"財務報表分析 —— 會計比率的核算與深入交叉分析",topEn:"Financial Ratio Analysis —— Comparing Ratios and Profitability",outc:true,reason:"自 2025 年起，「會計財務報表分析、盈利能力比率及控制費用率的深入交叉核算」已全數歸入選修部分（會計單元）第二十一章（Paper 2A）。",reasonEn:"Starting from 2025, 'Financial Analysis: profitability ratio calculations, ROCE interpretations and multi-year comparison' are fully transferred to Elective Module Paper 2A (Chapter 21).",cn:"21. 截至每年12月31日止年度，彩運商號的財務資料如下：\n毛利率：2022年39%，2023年51%\n淨利率：2022年20%，2023年22%\n運用資金報酬率：2022年8%，2023年10%\n\n與2022年度比較，下列哪項對彩運商號2023年的評論是正確的？\nA. 它的銷售額較高。\nB. 它賺取較高的毛利。\nC. 它控制營業費用的表現較佳。\nD. 它運用資本產生利潤的效率較高。",en:"21. The financial information of Choi Wan Company for the years ended 31 December is as follows:\nGross profit ratio: 2022 39%, 2023 51%\nNet profit ratio: 2022 20%, 2023 22%\nReturn on capital employed: 2022 8%, 2023 10%\n\nCompared to 2022, which of the following comments on Choi Wan Company for the year 2023 is correct?\nA. Its sales revenue was higher.\nB. It earned a higher gross profit.\nC. Its performance in controlling operating expenses was better.\nD. Its efficiency in utilising capital to generate profit was higher.",ans:"D",rate:"54%",exCn:"1. **D 正確**：\n   * *A、B 錯誤*：比率無法推算絕對金額。\n   * *C 錯誤*：營業費用率由19%升至29%，表現變差。\n   * *D 正確*：ROCE由8%升至10%，效率更高。\n2. 故選 D。",exEn:"1. **D is correct**:\n   * *A & B are incorrect*: Ratios cannot determine absolute amounts.\n   * *C is incorrect*: Operating expense ratio increased from 19% to 29%.\n   * *D is correct*: ROCE increased from 8% to 10%.\n2. Therefore, option D is correct."},
{q:22,year:2024,y:2024,top:"營商環境 —— 企業擁有權類型（特許經營加盟人的好處）",topEn:"Business Environment —— Forms of Business Ownership (Benefits of franchising for franchisees)",cn:"22. 明亮洗衣店是一家自助洗衣連鎖店，以特許經營方式營運。李瑩正考慮加盟明亮洗衣店成為特許權使用人。下列哪項是李瑩加盟明亮洗衣店的好處？\n(1) 對她的洗衣業務有較大控制權\n(2) 較容易進入洗衣市場\n(3) 有穩定的物資供應\n\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"22. Bright Laundry is a self-service laundry chain operating as a franchise. Ivy is considering joining Bright Laundry as a franchisee. Which of the following is/are the benefit(s) to Ivy of joining Bright Laundry?\n(1) having greater control over her laundry business\n(2) easier entry into the laundry market\n(3) having stable supplies of materials\n\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"D",rate:"75%",exCn:"1. **D 正確**：\n   * *(1) 錯誤*：特許經營要求加盟人嚴格遵循擁有人的經營守則，控制權實際上是降低的。\n   * *(2) 正確*：借助知名品牌可較容易進入市場。\n   * *(3) 正確*：可獲得穩定的原料及物資供應。\n2. 綜上，(2) 和 (3) 正確，選 D。",exEn:"1. **D is correct**:\n   * *(1) is incorrect*: A franchisee has less control due to standardized guidelines.\n   * *(2) is correct*: Leveraging the brand enables easier market entry.\n   * *(3) is correct*: Franchisees gain access to stable material supplies.\n2. Therefore, statements (2) and (3) are correct. Thus, D is correct."},
{q:23,year:2024,y:2024,top:"複式記帳法 —— 商業交易之記帳科目借貸法則判定",topEn:"Double-entry Bookkeeping —— Verifying Ledger Entries and Discounts",outc:true,reason:"自 2025 年起，「複式記帳記帳科目借貸法則、折讓與折扣的會計學處理」已全數移至選修部分（會計單元）第三、五章（Paper 2A）。",reasonEn:"Starting from 2025, 'The double-entry system, ledger accounts and the distinction between trade and cash discounts' are fully transferred to Elective Module Paper 2A (Chapters 3 and 5).",cn:"23. 下列是一家文具店的複式記帳，哪項是正確的？\n(1) 收到定期存款利息：借 銀行存款 / 貸 利息收益\n(2) 以賒帳方式購置汽車：借 應付帳款 / 貸 汽車\n(3) 從供應商買入大量文具並獲得折扣：借 購貨 / 貸 購貨折扣\n\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"23. Which of the following double entries of a stationery shop is/are correct?\n(1) Received interest on a term deposit: Dr Bank / Cr Interest income\n(2) Purchased a motorcar on credit: Dr Accounts payables / Cr Motorcars\n(3) Purchased stationery and obtained a discount: Dr Purchases / Cr Discounts received\n\nA. (1) only\nB. (1) and (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"A",rate:"53%",exCn:"1. **A 正確**：\n   * *(1) 正確*：收到定存利息，銀行存款增加借記，利息收益增加貸記。\n   * *(2) 錯誤*：應借記汽車，貸記其他應付款。\n   * *(3) 錯誤*：貿易折扣應在發票中直接扣除，不可記入購貨折扣帳戶。\n2. 綜上，僅有 (1) 正確，選 A。",exEn:"1. **A is correct**:\n   * *(1) is correct*: Receiving interest increases bank assets (debit) and revenue (credit).\n   * *(2) is incorrect*: Should debit Motorcars, credit Other payables.\n   * *(3) is incorrect*: Trade discounts are deducted directly, not recorded in Discounts received.\n2. Therefore, only (1) is correct. Thus, A is correct."},
{q:24,year:2024,y:2024,top:"基礎管理 —— 主要商業功能之職能角色（財務管理之工作職掌）",topEn:"Basics of Management —— Key Business Functions (Financial management)",cn:"24. 一家公司設有不同功能部門，包括財務部門、資訊管理部門、風險管理部門和營運部門。下列哪項是該公司財務部門的工作？\n(1) 籌措資金以安裝數據庫伺服器\n(2) 向保險公司索償\n(3) 估計購置新機器所帶來的現金流\n\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. (1)、(2)及(3)",en:"24. A company has different functional departments. Which of the following are tasks performed by the finance department?\n(1) raising funds for installing a database server\n(2) claiming insurance compensation from an insurance company\n(3) estimating the cash flows generated by purchasing a new machine\n\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"53%",exCn:"1. **C 正確**：\n   * *(1) 正確*：籌集資金是財務管理部門的核心職責。\n   * *(2) 錯誤*：向保險公司索償屬於風險管理部門的工作。\n   * *(3) 正確*：估算現金流屬於財務管理的投資決策工作。\n2. 因此，(1) 和 (3) 正確，選 C。",exEn:"1. **C is correct**:\n   * *(1) is correct*: Raising capital is the primary role of the finance department.\n   * *(2) is incorrect*: Filing insurance claims belongs to risk management.\n   * *(3) is correct*: Estimating cash flows is a core finance responsibility.\n2. Therefore, only (1) and (3) are correct. Thus, C is correct."},
{q:25,year:2024,y:2024,top:"基礎個人理財 —— 金錢的時間值（名義回報率與實際年利率之計算）",topEn:"Basics of Personal Financial Management —— Time Value of Money (Effective rate of return)",cn:"25. 下列哪項兩年期投資計劃的實際回報率最高？\nA. 年利率8%，每兩年一次\nB. 年利率8%，每年一次\nC. 年利率9%，每半年一次\nD. 年利率9%，每季一次",en:"25. Which of the following two-year investment plans offers the highest effective rate of return?\nA. 8% per annum, once every two years\nB. 8% per annum, yearly\nC. 9% per annum, semi-annually\nD. 9% per annum, quarterly",ans:"D",rate:"85%",exCn:"1. **D 正確**：\n   * 9%（C、D）高於 8%（A、B）。\n   * 同樣9%名義利率，計息頻率越高（季複利 > 半年複利），實際年利率越高。\n   * 計劃 D 的 EAR 約為 9.31%，高於計劃 C 的 9.20%。\n2. 故選 D。",exEn:"1. **D is correct**:\n   * 9% (C, D) is higher than 8% (A, B).\n   * Higher compounding frequency yields higher effective rate.\n   * Plan D's EAR is approximately 9.31%, higher than Plan C's 9.20%.\n2. Therefore, option D is correct."},
{q:26,year:2024,y:2024,top:"營商環境與基礎管理 —— 企業擁有權類型（公眾有限公司與公營公司之區別）",topEn:"Business Environment and Basics of Management —— Forms of Business Ownership (Public limited company vs. Public corporation)",cn:"26. 下列哪項是公眾有限公司與公營公司的分別？\n(1) 擁有人：公眾有限公司少於50名股東 / 公營公司由政府擁有\n(2) 董事局成員：公眾有限公司由股東委任 / 公營公司由政府委任\n(3) 目標：公眾有限公司為股東賺取最多財富 / 公營公司為政府賺取最多財富\n\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"26. Which of the following is/are the difference(s) between a public limited company and a public corporation?\n(1) Owners: public limited company fewer than 50 shareholders / public corporation the government\n(2) Board of directors: public limited company appointed by shareholders / public corporation appointed by the government\n(3) Goal: public limited company maximise wealth for shareholders / public corporation maximise wealth for the government\n\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"B",rate:"68%",exCn:"1. **B 正確**：\n   * *(1) 錯誤*：公眾有限公司股東數可成千上萬，無50名限制。\n   * *(2) 正確*：公眾有限公司董事由股東委任，公營公司董事由政府委任。\n   * *(3) 錯誤*：公營公司的目標是提供公共服務，非為政府賺取財富。\n2. 綜上，僅有 (2) 正確，選 B。",exEn:"1. **B is correct**:\n   * *(1) is incorrect*: Public limited companies have no limit on shareholders.\n   * *(2) is correct*: Directors of public limited companies are appointed by shareholders; public corporation directors by government.\n   * *(3) is incorrect*: Public corporations aim to provide public services, not maximise government wealth.\n2. Therefore, only (2) is a correct difference. Thus, B is correct."},
{q:27,year:2024,y:2024,top:"基礎會計 —— 會計假設、原則與慣例（一貫原則的例外應用）",topEn:"Accounting Principles and Conventions —— Consistency Principle",outc:true,reason:"自 2025 年起，「會計原則、概念與假設（一貫性、歷史成本等）的具體實務應用與局限分析」已全數歸入選修部分（會計單元）第二十三章（Paper 2A），必修部分不再考核。",reasonEn:"Starting from 2025, 'Accounting Assumptions, Principles and Conventions (materiality, consistency, historical cost, and going concern)' are fully transferred to Elective Module Paper 2A (Chapter 23).",cn:"27. 一家製造業商號在營運性質上有重大改變,它因此改變了非流動資產的計值方法。上述計值方法的改變______一貫原則，因為______。\nA. 沒有違反 ...... 這能更準確反映非流動資產的價值\nB. 沒有違反 ...... 非流動資產仍然以應計原則計值\nC. 違反 ...... 計值方法一經採用，便不能更改\nD. 違反 ...... 商號必須為所有非流動資產採用相同的計值方法",en:"27. A manufacturing firm made a major change in the nature of its operations. As a result, it changed the valuation method of its non-current assets. The above change in the valuation method _____ the consistency principle because _____.\nA. did not violate ... this can show a more accurate value of non-current assets\nB. did not violate ... non-current assets are still valued on an accrual basis\nC. violated ... once an accounting method has been adopted, it cannot be changed\nD. violated ... the firm must use the same valuation method for all non-current assets",ans:"A",rate:"52%",exCn:"1. **A 正確**：\n   * 一貫原則並非絕對不可改變。若企業經營發生重大轉變，且改變能使財務報表提供更準確的資訊，則完全允許變更。\n   * 本案商號在營運性質發生重大改變後變更計值方法，沒有違反一貫原則。\n2. 故選 A。",exEn:"1. **A is correct**:\n   * The consistency principle is not absolute. Changes are allowed when required for more accurate financial reporting.\n   * Since the firm underwent a major operational change, altering the valuation method does not violate the consistency principle.\n2. Therefore, option A is correct."},
{q:28,year:2024,y:2024,top:"中小型企業 —— 企業家精神與特徵之判定",topEn:"Small and Medium Enterprises —— Entrepreneurship and Characteristics of Entrepreneurs",cn:"28. 下列哪項有關企業家的陳述是正確的？\n(1) 樂於接受創新意念\n(2) 願意承擔風險\n(3) 以獨資方式經營商號\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"28. Which of the following statements about entrepreneurs are correct?\n(1) They are open to innovative ideas.\n(2) They are willing to take risks.\n(3) They operate their businesses in the form of a sole proprietorship.\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"83%",exCn:"1. **A 正確**：\n   * *(1) 正確*：企業家樂於接受創新意念。\n   * *(2) 正確*：願意承擔風險是企業家精神的核心。\n   * *(3) 錯誤*：企業家可選擇任何企業組織形式，並非局限於獨資。\n2. 綜上，(1) 和 (2) 正確，選 A。",exEn:"1. **A is correct**:\n   * *(1) is correct*: Entrepreneurs are open to innovative ideas.\n   * *(2) is correct*: Risk-taking is a defining characteristic of entrepreneurship.\n   * *(3) is incorrect*: Entrepreneurs can operate under any legal form.\n2. Therefore, only statements (1) and (2) are correct. Thus, A is correct."},
{q:29,year:2024,y:2024,top:"基礎個人理財 —— 金錢的時間值（定期存款之未來值複利計算）",topEn:"Basics of Personal Financial Management —— Time Value of Money (Future value calculation)",cn:"29. 2024年1月1日，卓文為一個為期18個月的定期存款計劃存入$200000。存款年利率為5%，每半年以複息計算。他於定期存款到期時收到的總金額為（四捨五入至整數元）：\nA. $215 000\nB. $215 250\nC. $215 378\nD. $231 525",en:"29. On 1 January 2024, Chapman deposited $200 000 into a 18-month term deposit plan. The annual interest rate was 5%, compounded semi-annually. The total amount of money he would get upon maturity was (to the nearest dollar):\nA. $215 000\nB. $215 250\nC. $215 378\nD. $231 525",ans:"C",rate:"77%",exCn:"1. **C 正確**：\n   * n = 18/6 = 3 個複利期\n   * r = 5%/2 = 2.5%\n   * FV = $200,000 x (1.025)^3 = $200,000 x 1.07689 = **$215,378**\n2. 故選 C。",exEn:"1. **C is correct**:\n   * n = 18/6 = 3 compounding periods\n   * r = 5%/2 = 2.5%\n   * FV = $200,000 x (1.025)^3 = $200,000 x 1.07689 = **$215,378**\n2. Therefore, option C is correct."},
{q:30,year:2024,y:2024,top:"原始分錄帳簿及分類帳 —— 分類帳帳戶的類別辨識（實帳戶與虛帳戶）",topEn:"Books of Original Entry and Ledger —— Nominal Accounts",outc:true,reason:"自 2025 年起，「會計帳戶的基本類別判定（實帳戶與虛帳戶之分野）」已全數移至選修部分（會計單元）第三章（Paper 2A），不再屬於卷一必修部分範圍。",reasonEn:"Starting from 2025, 'Nominal and Real accounts classifications, ledgers bookkeeping and closing entries' are fully transferred to Elective Module Paper 2A (Chapter 3).",cn:"30. 下列哪項是虛帳戶？\n(1) 購貨折扣帳\n(2) 租金帳\n(3) 銷貨運費帳\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"30. Which of the following are nominal accounts?\n(1) discounts received account\n(2) rent account\n(3) carriage outwards account\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"69%",exCn:"1. **D 正確**：\n   * 虛帳戶用於記錄收益及費用，期末需結平轉入損益帳戶。\n   * *(1) 購貨折扣屬於其他收益*\n   * *(2) 租金屬於費用*\n   * *(3) 銷貨運費屬於營業費用*\n   * 三者均為損益表項目，屬於虛帳戶。\n2. 綜上，(1)、(2)、(3) 均為虛帳戶，選 D。",exEn:"1. **D is correct**:\n   * Nominal accounts record revenues and expenses and are closed at period end.\n   * *(1) Discounts received is other income*\n   * *(2) Rent is an expense*\n   * *(3) Carriage outwards is an operating expense*\n   * All three are income statement items (nominal accounts).\n2. Therefore, all (1), (2), and (3) are nominal accounts. Thus, D is correct."},
{q:1,year:2025,y:2025,top:"營商環境 —— 香港的經濟特徵",topEn:"Business Environment —— Characteristics of Hong Kong Economy",cn:"1. 下列哪項有關香港營商環境的陳述是正確的？\n(1) 香港是以服務業為主的經濟體。\n(2) 香港不設外匯管制。\n(3) 企業須繳納利得稅，該稅項是政府的主要收入來源之一。\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"1. Which of the following statements about the Hong Kong business environment is/are correct?\n(1) Hong Kong is a service-oriented economy.\n(2) Hong Kong does not maintain foreign exchange controls.\n(3) Businesses are subject to profits tax, which is one of the main sources of government revenue.\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"55%",exCn:"(1) 正確：香港是高度集中的以服務業為主的經濟體，佔GDP超過90%。\n(2) 正確：香港實行自由港政策，不設外匯管制，資金可自由進出。\n(3) 正確：企業須繳納利得稅，是政府主要收入來源之一。\n三者皆正確，選 D。",exEn:"(1) Correct: Hong Kong is a service-oriented economy where the tertiary sector contributes to over 90% of GDP.\n(2) Correct: Hong Kong is a free port and does not impose foreign exchange controls.\n(3) Correct: Businesses are subject to profits tax, which is a primary source of government revenue.\nAll three are correct. Thus, D is correct."},
{q:2,year:2025,y:2025,top:"營商環境 —— 香港經濟發展近況（更緊密經貿關係安排 CEPA）",topEn:"Business Environment —— Recent Developments of HK Economy (CEPA)",cn:"2. 下列哪項有關《更緊密經貿關係的安排》(CEPA)的陳述是正確的？\n(1) 它是調解香港與內地之間的貿易糾紛的平台。\n(2) 它涵蓋四個範疇，分別是「貨物貿易」、「服務貿易」、「投資」及「經濟技術合作」。\n(3) 它為在大灣區工作的香港專業人士提供資助。\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"2. Which of the following statements about the Closer Economic Partnership Arrangement (CEPA) is/are correct?\n(1) It provides a platform for resolving trade disputes between Hong Kong and the Mainland.\n(2) It covers four areas, namely 'trade in goods', 'trade in services', 'investment', and 'economic and technical cooperation'.\n(3) It provides subsidies for Hong Kong professionals working in the Greater Bay Area.\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"B",rate:"50%",exCn:"(1) 錯誤：調解貿易糾紛是WTO的功能，非CEPA。\n(2) 正確：CEPA涵蓋「貨物貿易」、「服務貿易」、「投資」和「經濟技術合作」四大範疇。\n(3) 錯誤：CEPA不包含向在大灣區工作的專業人士提供直接資金補貼。\n僅 (2) 正確，選 B。",exEn:"(1) Incorrect: Resolving trade disputes is the primary function of the WTO, not CEPA.\n(2) Correct: CEPA covers four key areas: trade in goods, trade in services, investment, and economic and technical cooperation.\n(3) Incorrect: CEPA does not provide direct financial subsidies for professionals working in the GBA.\nOnly (2) is correct. Thus, B is correct."},
{q:3,year:2025,y:2025,top:"營商環境 —— 香港經濟發展近況（中港經貿關係）",topEn:"Business Environment —— Recent Developments of HK Economy (Mainland-HK Economic Relations)",cn:"3. 下列哪項有關香港與內地關係的陳述是正確的？\n(1) 內地企業可在香港聯合交易所主板上市。\n(2) 內地是香港最大的貿易夥伴。\n(3) 內地是香港直接投資流入的主要來源。\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"3. Which of the following statements about the relationship between Hong Kong and the Mainland is/are correct?\n(1) Mainland enterprises can be listed on the Main Board of the Stock Exchange of Hong Kong.\n(2) The Mainland is Hong Kong's largest trading partner.\n(3) The Mainland is the major source of direct investment inflows to Hong Kong.\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"51%",exCn:"(1) 正確：內地企業符合上市標準即可在香港主板上市。\n(2) 正確：內地是香港最大的整體商品貿易夥伴。\n(3) 正確：內地投資已成香港外來直接投資的最主要來源。\n三者皆正確，選 D。",exEn:"(1) Correct: Mainland enterprises can be listed on the Stock Exchange of Hong Kong if they meet listing criteria.\n(2) Correct: The Mainland is Hong Kong's largest trading partner.\n(3) Correct: The Mainland represents the largest source of FDI inflows into Hong Kong.\nAll three are correct. Thus, D is correct."},
{q:4,year:2025,y:2025,top:"營商環境 —— 影響商業決策的因素（全球一體化的外判應用）",topEn:"Business Environment —— Recent Developments of HK Economy (Globalisation & Outsourcing)",cn:"4. 下列哪項是一家體育用品製造商實行外判的例子？\nA. 以較低成本從其他國家購買原材料\nB. 將其廠房遷往勞工成本較低的國家\nC. 簽訂合約交由發展中國家的製造商生產運動鞋\nD. 與海外分銷商合夥在發展中國家推出新型號的運動鞋",en:"4. Which of the following is an example of outsourcing by a sports goods manufacturer?\nA. purchasing raw materials from other countries at a lower cost\nB. relocating its factory to a country with lower labour costs\nC. signing a contract with a manufacturer in a developing country to produce sports shoes\nD. partnering with an overseas distributor to launch a new model of sports shoes in a developing country",ans:"C",rate:"56%",exCn:"外判的定義是將原本由內部執行的功能簽約委託給第三方外部機構執行。\nA屬於採購；B屬於跨國遷移；D屬於合資合作；\nC簽訂合約將運動鞋交由第三方製造商生產，完全符合外判特徵。故選 C。",exEn:"Outsourcing is contracting out internal business processes to an external third-party contractor.\nA is global sourcing; B is relocation; D is an alliance/joint venture;\nC involves signing a contract to have sports shoes produced by a third-party manufacturer, which fits the definition of outsourcing. Thus, C is correct."},
{q:5,year:2025,y:2025,top:"營商環境 —— 企業擁有權類型（獨資與私人有限公司的分別）",topEn:"Business Environment —— Forms of Business Ownership (Sole Proprietorship vs. Private Limited Company)",cn:"5. 下列哪項是獨資商號與私人有限公司的分別？\n   | | 獨資商號 | 私人有限公司 |\n   | (1) 擁有人承擔的債務責任 | 無限 | 有限 |\n   | (2) 擁有人數目 | 1 | 1 - 100 |\n   | (3) 獨立的法定個體 | 不是 | 是 |\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"5. Which of the following are differences between a sole proprietorship and a private limited company?\n   | | Sole proprietorship | Private limited company |\n   | (1) Liability borne by owner(s) | Unlimited | Limited |\n   | (2) Number of owners | 1 | 1 - 100 |\n   | (3) Separate legal entity | No | Yes |\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"70%",exCn:"(1) 正確：獨資東主承擔無限責任；有限公司股東承擔有限責任。\n(2) 錯誤：私人有限公司最大股東人數上限為50人，非100人。\n(3) 正確：獨資企業不是獨立個體；私人有限公司是獨立法定個體。\n只有 (1) 和 (3) 正確，選 B。",exEn:"(1) Correct: A sole proprietor faces unlimited liability; shareholders of a private limited company bear limited liability.\n(2) Incorrect: The maximum number of shareholders for a private limited company is 50, not 100.\n(3) Correct: A sole proprietorship has no separate legal entity; a private limited company is a separate legal entity.\nOnly (1) and (3) are correct. Thus, B is correct."},
{q:6,year:2025,y:2025,top:"營商環境 —— 企業擁有權類型（合夥與上市公司的比較）",topEn:"Business Environment —— Forms of Business Ownership (Partnership vs. Public Listed Company)",cn:"6. 與在證券交易所上市的公眾有限公司比較,下列哪項是合夥商號的優點？\n(1) 成立程序較簡單\n(2) 利得稅率較低\n(3) 資金來源較廣\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"6. Compared with a public limited company listed on the stock exchange, which of the following are advantages of a partnership?\n(1) simpler setup procedures\n(2) lower profits tax rate\n(3) wider sources of capital\nA. (1) only\nB. (1) and (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"B",rate:"80%",exCn:"(1) 正確：合夥成立僅需協議和商業登記，遠比上市公司程序簡單。\n(2) 正確：合夥利得稅率為15%，有限公司為16.5%，合夥稅率較低。\n(3) 錯誤：上市公司可向公眾發行股票融資，資金來源更廣。\n(1) 和 (2) 正確，選 B。",exEn:"(1) Correct: Setting up a partnership requires only a mutual agreement and business registration, far simpler than listing a public company.\n(2) Correct: The standard profits tax rate for partnerships is 15%, whereas for corporations it is 16.5%.\n(3) Incorrect: Listed companies can raise vast capital from the public, giving them wider sources of capital.\n(1) and (2) are correct. Thus, B is correct."},
{q:7,year:2025,y:2025,top:"營商環境 —— 跨國公司（MNC 的定義與判定）",topEn:"Business Environment —— Forms of Business Ownership (MNC Characteristics)",cn:"7. 下列是三家以香港為基地的公司的商業活動例子：\n(1) 甲公司 - 在其他國家設立廠房\n(2) 乙公司 - 在海外證券交易所購買股票\n(3) 丙公司 - 經代理人銷售貨品往海外市場\n以上哪家是跨國公司？\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"7. The following are examples of business activities of three Hong Kong-based companies:\n(1) Company A - sets up a factory in another country.\n(2) Company B - purchases shares on an overseas stock exchange.\n(3) Company C - sells goods to overseas markets via agents.\nWhich of the above is/are multinational corporation(s)?\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"A",rate:"60%",exCn:"跨國公司必須在多於一個國家擁有並進行實質營運。\n(1) 屬於跨國公司：在其他國家設立廠房進行生產。\n(2) 不屬於：僅購買海外股票作被動投資，無實體營運。\n(3) 不屬於：僅透過代理人出口，無在海外設立運作實體。\n僅 (1) 是跨國公司，選 A。",exEn:"An MNC must own and operate productive facilities in more than one country.\n(1) is an MNC: sets up a manufacturing plant overseas.\n(2) is not: merely purchases overseas shares as portfolio investment.\n(3) is not: engages in simple export trade via agents without establishing physical operations.\nOnly (1) is an MNC. Thus, A is correct."},
{q:8,year:2025,y:2025,top:"營商環境 —— 商業道德與社會責任（履行社會責任的特點）",topEn:"Business Environment —— Business Ethics and Social Responsibilities (CSR Application)",cn:"8. 下列是一家物流公司所採用的措施。哪項措施是履行社會責任？\n(1) 貨車使用碳排放較少的燃料\n(2) 在合約的指定時限內將包裹送達顧客\n(3) 為司機座位配置安全帶\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"8. The following are measures adopted by a logistics company. Which of these measures is/are fulfilling social responsibilities?\n(1) using fuel with less carbon emission for lorries\n(2) delivering parcels to customers within the time limit stated in the contracts\n(3) installing seat belts for drivers\nA. (1) only\nB. (1) and (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"46%",exCn:"社會責任是企業自願超出法定底線的行動。\n(1) 正確：主動使用低碳環保燃料是自願的環境保護措施。\n(2) 錯誤：在合約時限內送達是基本合約義務，非社會責任。\n(3) 錯誤：配置安全帶是法定安全要求，非自願性社會責任。\n僅 (1) 是社會責任，選 A。",exEn:"CSR refers to voluntary initiatives beyond legal requirements.\n(1) Correct: Using eco-friendly low-carbon fuels is a voluntary environmental initiative.\n(2) Incorrect: Delivering on time is a basic contractual obligation, not CSR.\n(3) Incorrect: Seat belts are a legal safety requirement, not voluntary CSR.\nOnly (1) is CSR. Thus, A is correct."},
{q:9,year:2025,y:2025,top:"基礎個人理財 —— 金錢的時間值（實際年利率 EAR 換算）",topEn:"Basics of Personal Financial Management —— Time Value of Money (Effective Annual Rate Calculation)",cn:"9. 一家銀行提供一個投資計劃，每年回報率為12%，每季複息計算。這投資計劃的實際回報率是多少？\nA. 9.27%\nB. 12.55%\nC. 13.63%\nD. 15.92%",en:"9. A bank offers an investment plan with an annual rate of return of 12%, compounded quarterly. What is the effective rate of return of the investment plan?\nA. 9.27%\nB. 12.55%\nC. 13.63%\nD. 15.92%",ans:"B",rate:"74%",exCn:"名義年利率 = 12%，每季計息一次。\n每季利率 r = 12% / 4 = 3% = 0.03\n實際年利率 EAR = (1 + r)^n - 1 = (1.03)^4 - 1 = 1.12550881 - 1 = 12.55%\n故選 B。",exEn:"Nominal annual rate = 12%, compounded quarterly.\nPeriodic rate per quarter r = 12% / 4 = 3% = 0.03\nEAR = (1 + r)^n - 1 = (1.03)^4 - 1 = 1.12550881 - 1 = 12.55%\nThus, B is correct."},
{q:10,year:2025,y:2025,top:"基礎個人理財 —— 消費者信貸（個人信貸評級的權利與特徵）",topEn:"Basics of Personal Financial Management —— Consumer Credit (Personal Credit Records)",cn:"10. 下列哪項有關個人信貸記錄的陳述是正確的？\n(1) 退休人士的信貸評分較受僱人士的為低。\n(2) 任何人均有權查閱自己的信貸報告。\n(3) 信貸評分較高的借貸人較易借得貸款。\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"10. Which of the following statements about personal credit record is/are correct?\n(1) The credit score of a retired person is lower than that of an employed person.\n(2) Any individual has the right to check his/her own credit report.\n(3) A borrower with a higher credit score can obtain loans more easily.\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"D",rate:"80%",exCn:"(1) 錯誤：信貸評分由還款表現等決定，非因身份為退休人士而自動較低。\n(2) 正確：個人依法有權查閱自己的信貸報告。\n(3) 正確：信貸評分較高代表違約風險低，較易借得貸款。\n(2) 和 (3) 正確，選 D。",exEn:"(1) Incorrect: Credit score is based on payment history, not automatically lower for retired persons.\n(2) Correct: Individuals have the legal right to check their own credit reports.\n(3) Correct: Higher credit scores indicate lower default risk, making loans easier to obtain.\n(2) and (3) are correct. Thus, D is correct."},
{q:11,year:2025,y:2025,top:"基礎個人理財 —— 消費者信貸（信用卡的利息核算與特徵）",topEn:"Basics of Personal Financial Management —— Consumer Credit (Credit Card Mechanics)",cn:"11. 下列哪項有關信用卡的陳述是正確的？\n(1) 利息是按過期結欠逐日計算。\n(2) 所有信用卡用戶的信用限額是相同的。\n(3) 如信用卡用戶在到期日前繳付最低還款額，銀行便不會就結欠徵收利息。\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"11. Which of the following statements about credit cards is/are correct?\n(1) Interest is calculated on the overdue balance on a daily basis.\n(2) The credit limit of all credit card users is the same.\n(3) The bank will not charge interest on the outstanding balance if a credit card user repays the minimum payment before the due date.\nA. (1) only\nB. (1) and (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"A",rate:"52%",exCn:"(1) 正確：信用卡過期結欠利息按每日複息計息。\n(2) 錯誤：信用額度由銀行根據個人收入、資產和信貸評級個別核定。\n(3) 錯誤：最低還款額僅避免罰款，銀行仍會就剩餘結欠徵收利息，須全額清還才免息。\n僅 (1) 正確，選 A。",exEn:"(1) Correct: Credit card interest on overdue balances is calculated daily.\n(2) Incorrect: Credit limits are individually assessed based on income, assets, and credit score.\n(3) Incorrect: Minimum payment only prevents penalties; interest is still charged on the remaining balance. Full payment is required for interest-free treatment.\nOnly (1) is correct. Thus, A is correct."},
{q:12,year:2025,y:2025,top:"基礎個人理財 —— 策劃個人理財及投資（公司債券與定期存款的特徵）",topEn:"Basics of Personal Financial Management —— Personal Financial Planning & Investment (Bonds vs. Term Deposits)",cn:"12. 下列哪項有關投資於公司債券與定期存款的陳述是正確的？\n(1) 由於投資於公司債券的風險較定期存款高，故投資前者的回報率必定較高。\n(2) 在投資期內兩者的利率皆是固定的。\n(3) 兩者的投資者皆有權在到期日取回本金。\nA. 只有(1)\nB. 只有(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"12. Which of the following statements about investing in company bonds and term deposits is/are correct?\n(1) Since investing in company bonds is riskier than in term deposits, the rate of return of the former must be higher.\n(2) The interest rates of both are fixed during the investment period.\n(3) Investors of both have the right to get back the principal upon maturity.\nA. (1) only\nB. (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"57%",exCn:"(1) 錯誤：高風險不保證高回報，若公司違約甚至可能虧損本金，「必定」過於絕對。\n(2) 正確：公司債券票面利率和定期存款利率在投資期內均固定不變。\n(3) 正確：兩者均為債權性質，投資者有權在到期日取回本金。\n(2) 和 (3) 正確，選 C。",exEn:"(1) Incorrect: Higher risk does not guarantee higher return; investors might lose capital if the company defaults.\n(2) Correct: Both bond coupon rates and term deposit rates remain fixed during the investment period.\n(3) Correct: Both are debt-based contracts with the right to retrieve principal upon maturity.\n(2) and (3) are correct. Thus, C is correct."},
{q:13,year:2025,y:2025,top:"基礎個人理財 —— 強制性公積金（強積金制度提取累算權益條件）",topEn:"Basics of Personal Financial Management —— Personal Financial Planning & Investment (MPF Scheme Withdrawal)",cn:"13. 下列哪位人士有資格從強制性公積金（強積金）計劃提取累算權益？\nA. 自僱的士司機，62歲，剛剛退休。\nB. 工人，60歲，強積金帳戶結餘為$10000。\nC. 跨國公司經理，40歲，剛調職到海外總公司。\nD. 文員，35歲，為進修辭去工作。",en:"13. Which of the following persons is/are eligible to withdraw the accrued benefits from the Mandatory Provident Fund (MPF) Scheme?\nA. A self-employed taxi driver, aged 62, who has just retired.\nB. A worker, aged 60, with an MPF account balance of $10 000.\nC. An MNC manager, aged 40, who has just been transferred to the overseas headquarters.\nD. A clerk, aged 35, who resigned to pursue further studies.",ans:"A",rate:"72%",exCn:"強積金正常提取年齡為65歲，提早提取需滿足特定條件，最常見為年滿60歲並聲明永久性退休。\nA 符合：62歲且剛退休，符合提早提取條件。\nB 不符：僅年滿60歲但未表明永久性退休。\nC 不符：調職海外不屬於永久性離開香港。\nD 不符：離職進修不符合提早提取法定要求。\n選 A。",exEn:"The statutory withdrawal age is 65, with early withdrawal permitted at age 60 with permanent retirement declaration.\nA is eligible: aged 62 and retired, satisfying the requirements.\nB is not eligible: being 60 with a balance does not qualify without permanent retirement declaration.\nC is not eligible: job relocation is temporary, not permanent departure from Hong Kong.\nD is not eligible: resigning to study is not a recognized reason.\nThus, A is correct."},
{q:14,year:2025,y:2025,top:"基礎個人理財 —— 策劃個人理財及投資（個人投資者的權利與責任）",topEn:"Basics of Personal Financial Management —— Personal Financial Planning & Investment (Rights & Responsibilities)",cn:"14. 下列哪項是個人投資者的權利？\n(1) 毋須透過經紀在香港聯合交易所買賣股票\n(2) 知悉投資交易的服務收費\n(3) 可選擇是否依照投資顧問的建議作投資決定\nA. 只有(1)\nB. 只有(2)\nC. 只有(3)\nD. 只有(2)及(3)",en:"14. Which of the following is/are right(s) of a share investor?\n(1) to trade stocks on the Stock Exchange of Hong Kong without using brokers\n(2) to know the service charges of investment transactions\n(3) to choose whether to follow the investment decisions recommended by investment advisors\nA. (1) only\nB. (2) only\nC. (3) only\nD. (2) and (3) only",ans:"D",rate:"76%",exCn:"(1) 錯誤：散戶必須透過持牌經紀進行交易，不可直接參與。\n(2) 正確：投資者有權知悉相關服務費與手續費。\n(3) 正確：投資者可自行決定是否採納投資顧問建議。\n(2) 和 (3) 正確，選 D。",exEn:"(1) Incorrect: Individual investors must execute trades through licensed brokers.\n(2) Correct: Investors have the right to full disclosure of transaction costs.\n(3) Correct: Investors have the absolute right to decide whether to follow advisor recommendations.\n(2) and (3) are correct. Thus, D is correct."},
{q:15,year:2025,y:2025,top:"基礎個人理財 —— 影響股票價格的因素（航運公司股價因素分析）",topEn:"Basics of Personal Financial Management —— Personal Financial Planning & Investment (Factors Affecting Stock Price)",cn:"15. 撇除其他因素，下列哪項會對一家船務公司的股價帶來不利影響？\n(1) 員工罷工\n(2) 碼頭容量增加\n(3) 貨船燃料（油價）上升\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. (1)、(2)及(3)",en:"15. Ignoring other factors, which of the following will have an adverse effect on the share price of a listed shipping company?\n(1) strike of employees\n(2) increase in port capacity\n(3) rise in fuel (oil) price\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"68%",exCn:"(1) 不利影響：罷工使營運癱瘓、訂單延誤，損害盈利與商譽。\n(2) 有利影響：碼頭容量增加提升吞吐量，降低塞港成本。\n(3) 不利影響：燃料價格上漲拉高營運成本，扣減毛利。\n(1) 和 (3) 帶來不利影響，選 C。",exEn:"(1) Adverse effect: Strikes halt operations, causing delays and loss of revenue.\n(2) Positive effect: Increased port capacity reduces congestion and improves efficiency.\n(3) Adverse effect: Rising fuel prices increase operating costs and reduce profit margins.\n(1) and (3) have adverse effects. Thus, C is correct."},
{q:16,year:2025,y:2025,top:"基礎個人理財 —— 恒生指數的重要性與特徵",topEn:"Basics of Personal Financial Management —— Personal Financial Planning & Investment (Hang Seng Index)",cn:"16. 下列哪項有關恒生指數的陳述是正確的？\nA. 過去五年的成份股數目維持不變。\nB. 它是香港上市公司發行的股票和債券整體表現的指標。\nC. 在計算指數時，不同成份股所佔的比重不同。\nD. 「旅遊業」是四個分類指數的其中一個。",en:"16. Which of the following statements about the Hang Seng Index is correct?\nA. The number of constituent stocks has remained unchanged in the past five years.\nB. It serves as a benchmark of the general performance of the stocks and bonds issued by companies listed in Hong Kong.\nC. A different weighting is assigned to different constituent stocks when computing the index.\nD. 'Tourism' is one of the four sub-indexes.",ans:"C",rate:"34%",exCn:"C 正確：恒生指數採用流通市值加權計算，不同成份股因市值不同被賦予不同比重。\nA 錯誤：成份股數量近年持續調整擴容，並非不變。\nB 錯誤：恒指僅反映股票市場表現，不包括債券。\nD 錯誤：四大分類指數為金融、公用事業、地產、工商業，無「旅遊業」。\n選 C。",exEn:"C is correct: The HSI is a market-capitalization weighted index with different weightings for constituent stocks.\nA is incorrect: The number of constituent stocks has changed and expanded.\nB is incorrect: The HSI benchmarks the stock market only, not bonds.\nD is incorrect: The four sub-indexes are Finance, Utilities, Properties, and Commerce & Industry.\nThus, C is correct."},
{q:17,year:2025,y:2025,top:"基礎管理 —— 管理功能（管理的重要性）",topEn:"Basics of Management —— Management Functions (Importance of Management)",cn:"17. 下列哪項顯示管理對企業的重要？\n(1) 有效達至機構的目標\n(2) 有效率地運用人力資源\n(3) 避免產生營業費用\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(1)及(3)\nD. (1)、(2)及(3)",en:"17. Which of the following shows the importance of management to a business?\n(1) achieve the goals of the organization effectively\n(2) utilize human resources efficiently\n(3) avoid incurring operating expenses\nA. (1) only\nB. (1) and (2) only\nC. (1) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"81%",exCn:"(1) 正確：管理的核心目標在於有效達至目標。\n(2) 正確：管理要求有效率地運用人力等資源。\n(3) 錯誤：營業費用是維持營運不可避免的，管理旨在控制而非避免。\n(1) 和 (2) 正確，選 B。",exEn:"(1) Correct: Management aims to achieve organizational goals effectively.\n(2) Correct: Management ensures efficient utilization of human resources.\n(3) Incorrect: Operating expenses are necessary; management aims to control, not avoid them.\n(1) and (2) are correct. Thus, B is correct."},
{q:18,year:2025,y:2025,top:"基礎管理 —— 有效管理的原則（統一命令原則）",topEn:"Basics of Management —— Principles of Effective Management (Unity of Command)",cn:"18. 下列哪項有關「統一命令」的陳述是正確的？\n(1) 下屬不會收到來自不同上司的指令。\n(2) 下屬更能理解上司發出的指令。\n(3) 它能鞏固上司與其下屬之間的人際關係。\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(1)及(3)\nD. (1)、(2)及(3)",en:"18. Which of the following statements about 'unity of command' is correct?\n(1) Subordinates do not receive conflicting instructions from different superiors.\n(2) Subordinates can understand the instructions from superiors better.\n(3) It can strengthen interpersonal relationships between superiors and subordinates.\nA. (1) only\nB. (1) and (2) only\nC. (1) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"42%",exCn:"(1) 正確：統一命令確保下屬僅向一位直屬上司匯報，不會收到矛盾指令。\n(2) 錯誤：理解指令取決於溝通技巧，與統一命令無直接因果關係。\n(3) 錯誤：這是組織結構的權力劃分機制，不能保證鞏固人際關係。\n僅 (1) 正確，選 A。",exEn:"(1) Correct: Unity of command ensures each subordinate reports to only one supervisor, preventing conflicting instructions.\n(2) Incorrect: Understanding orders depends on communication skills, not reporting structure.\n(3) Incorrect: This is an organizational principle and does not inherently strengthen relationships.\nOnly (1) is correct. Thus, A is correct."},
{q:19,year:2025,y:2025,top:"基礎管理 —— 組織架構與職權類型（職權大小與幕僚職權）",topEn:"Basics of Management —— Organisational Structure and Authority Types (Authority Hierarchies)",cn:"19. 志偉是一家貿易公司的總經理。他向市場營銷經理、人力資源經理和財務經理發出指令。\n根據以上資料，下列哪項陳述是正確的？\n(1) 這貿易公司是按功能劃分部門的。\n(2) 志偉比其他三位經理有較大的職權。\n(3) 市場營銷經理對人力資源經理和財務經理有幕僚職權。\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"19. Tracy is the general manager of a trading company. He issues instructions to the marketing manager, human resources manager and finance manager.\nBased on the above information, which of the following statements are correct?\n(1) The trading company is departmentalised by function.\n(2) Tracy has greater authority than the other three managers.\n(3) The marketing manager has staff authority over the human resources manager and the finance manager.\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"44%",exCn:"(1) 正確：公司按市場營銷、人力資源、財務部門劃分，屬於功能劃分部門。\n(2) 正確：總經理處於最高決策層，擁有比下屬更大的直線職權。\n(3) 錯誤：三位經理同屬平行中層管理，市場經理對其他同級經理無職權。\n(1) 和 (2) 正確，選 A。",exEn:"(1) Correct: Establishing Marketing, HR, and Finance departments represents functional departmentalisation.\n(2) Correct: As top-level executive, Tracy has greater line authority than department managers.\n(3) Incorrect: The managers are at the same hierarchical level; marketing manager has no authority over peers.\n(1) and (2) are correct. Thus, A is correct."},
{q:20,year:2025,y:2025,top:"基礎管理 —— 主要商業功能之角色（營運管理職掌）",topEn:"Basics of Management —— Key Business Functions (Role of Operations Department)",cn:"20. 一家本地初創公司計劃興建廠房。下列哪項是這公司營運部門的工作？\nA. 為廠房購買火險\nB. 為興建廠房籌集資金\nC. 為廠房發展網絡系統以分享生產信息\nD. 制定廠房的產能",en:"20. A local start-up company plans to set up a factory. Which of the following tasks is performed by the operations department of the company?\nA. buying fire insurance for the plant\nB. raising capital for the construction of the plant\nC. developing network systems for the plant to share production information\nD. determining the production capacity of the plant",ans:"D",rate:"79%",exCn:"A屬於風險管理；B屬於財務管理；C屬於資訊管理；\nD制定廠房產能是營運管理的核心職能。選 D。",exEn:"A belongs to Risk Management; B belongs to Finance; C belongs to Information Management;\nD determining production capacity is a core operations management task. Thus, D is correct."},
{q:21,year:2025,y:2025,top:"基礎管理 —— 管理功能（計劃：SMART 目標準則之判定）",topEn:"Basics of Management —— Management Functions (SMART Objectives)",cn:"21. 某商號的資訊管理經理訂立以下目標：\n「一年內減少5%的錯誤。」\n上述目標符合以下哪項良好目標的準則？\n(1) 具體的\n(2) 可量度的\n(3) 具時限的\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"21. The information manager of a firm sets the following objective:\n'To reduce errors by 5% within one year.'\nWhich of the following criteria for good objectives is/are fulfilled in the target?\n(1) specific\n(2) measurable\n(3) time-bound\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"78%",exCn:"(1) 不符合：「減少錯誤」太籠統，不夠具體。\n(2) 符合：列明「5%」的具體百分比，可量度。\n(3) 符合：約定「一年內」的明確限期，具時限。\n只有 (2) 和 (3) 符合，選 C。",exEn:"(1) Unfulfilled: 'Reduce errors' is too vague and lacks specificity.\n(2) Fulfilled: 'by 5%' provides a precise measurable target.\n(3) Fulfilled: 'within one year' sets a clear deadline.\nOnly (2) and (3) are fulfilled. Thus, C is correct."},
{q:22,year:2025,y:2025,top:"中小型企業 —— 中小企對香港經濟的重要性與就業數據",topEn:"Small and Medium Enterprises —— Importance of SMEs to Hong Kong Economy",cn:"22. 下列哪項顯示中小型企業對香港經濟的重要？\n(1) 提供更多產品和服務以促進市場競爭\n(2) 向政府提供超過90%的利得稅收入\n(3) 為大約45%的總就業人數(不計公務員)提供就業機會\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. (1)、(2)及(3)",en:"22. Which of the following shows the importance of small and medium enterprises (SMEs) to the Hong Kong economy?\n(1) provide more products and services to promote market competition\n(2) provide over 90% of profits tax revenue to the government\n(3) provide employment opportunities for around 45% of total employment (excluding civil service)\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"59%",exCn:"(1) 正確：中小企營運靈活，提供多元產品服務，促進市場競爭。\n(2) 錯誤：利得稅主要來自少數大型企業，中小企提供的比例遠未達90%。\n(3) 正確：中小企聘用了全港約45%的私營機構勞動人口。\n(1) 和 (3) 正確，選 C。",exEn:"(1) Correct: SMEs are flexible and introduce innovative products, promoting market competition.\n(2) Incorrect: Most profits tax revenue comes from large corporations, not SMEs.\n(3) Correct: SMEs provide employment for approximately 45% of the private sector workforce.\n(1) and (3) are correct. Thus, C is correct."},
{q:23,year:2025,y:2025,top:"基礎管理 —— 管理功能（計劃流程的順序步驟）",topEn:"Basics of Management —— Management Functions (Planning Process Steps)",cn:"23. 計劃過程中，執行行動方案前的上一個步驟是\nA. 分析資料\nB. 評估其他行動方案\nC. 監察行動方案的進度\nD. 制訂行動方案的日程",en:"23. In the planning process, the step immediately before implementing the action plan is\nA. analyzing information\nB. evaluating alternative action plans\nC. monitoring the progress of the action plan\nD. formulating the schedule of the action plan",ans:"D",rate:"61%",exCn:"計劃流程依序：設定目標→分析資料→制訂備選方案→評估方案→制訂行動方案日程→執行→監察。\n執行行動方案前的上一個步驟是制訂行動方案日程。選 D。",exEn:"The planning process sequence: Setting goals → Analyzing → Formulating alternatives → Evaluating → Formulating schedule → Implementing → Monitoring.\nThe step before implementing is formulating the schedule. Thus, D is correct."},
{q:24,year:2025,y:2025,top:"基礎管理 —— 有效管理的原則（分工原則的雙刃劍效應）",topEn:"Basics of Management —— Principles of Effective Management (Division of Work)",cn:"24. 下列哪項有關一家廠商採用「分工」的陳述是正確的？\n(1) 它減輕生產工人的工作量。\n(2) 如其中一個工序出錯，整個生產程序都會受到影響。\n(3) 它提高員工的工作滿足感。\nA. 只有(1)\nB. 只有(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"24. Which of the following statements about a manufacturer adopting 'division of work' is correct?\n(1) It reduces the workload of production workers.\n(2) If an error occurs in one stage of the work, the whole production process will be affected.\n(3) It increases the job satisfaction of employees.\nA. (1) only\nB. (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"61%",exCn:"(1) 錯誤：分工是將工作拆解並非減輕總體工作量。\n(2) 正確：分工導致工序間高度相互倚賴，一個出錯影響整個流程。\n(3) 錯誤：長期重複單一工序容易產生枯燥感，降低滿足感。\n僅 (2) 正確，選 B。",exEn:"(1) Incorrect: Division of work splits tasks but does not reduce total workload.\n(2) Correct: Division of work creates high interdependence; an error in one stage affects the whole process.\n(3) Incorrect: Repetitive specialized tasks cause boredom and lower job satisfaction.\nOnly (2) is correct. Thus, B is correct."},
{q:25,year:2025,y:2025,top:"財務報表分析 —— 財務報表的使用者及資訊需要用途",topEn:"Financial Statement Analysis —— Financial Statement Users and Their Needs",cn:"25. 下列哪項是一家公司的財務報表對相關用家的用途？\n用家 / 用途\n(1) 管理人員 / 幫助重新調配公司資源\n(2) 債務人 / 幫助評估公司還款能力\n(3) 潛在投資者 / 幫助決定公司是否值得投資\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"25. Which of the following is/are the use(s) of a company's financial statements for the respective users?\nUser / Use\n(1) Managers / help reallocate company resources\n(2) Debtors / help assess company's repayment ability\n(3) Potential investors / help decide whether it is worth investing in the company\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"78%",exCn:"(1) 錯誤：管理人員需財務報表以重新調配資源，但此選項組合需審視。\n(2) 正確：債務人（欠公司錢的人）需要評估公司還款能力。\n(3) 正確：潛在投資者審閱財務報告以決定是否投資。\n(2) 和 (3) 正確，選 C。",exEn:"(1) Incorrect: While managers do use financial statements, the combination in this option needs review.\n(2) Correct: Debtors (entities owing money to the company) need to assess the company's repayment ability.\n(3) Correct: Potential investors evaluate financial reports to decide whether to invest.\n(2) and (3) are correct. Thus, C is correct."},
{q:26,year:2025,y:2025,top:"基礎個人理財 —— 金錢的時間值（名義與實際回報率之算術關係）",topEn:"Basics of Personal Financial Management —— Time Value of Money (Nominal vs. Effective Rates of Return)",cn:"26. 如果名義回報率不變，下列哪項有關實際回報率的陳述是正確的？\nA. 計算複息的頻率提高，定期存款的實際回報率將會上升。\nB. 本金增加，定期存款的實際回報率將會上升。\nC. 存款期縮短，定期存款的實際回報率將會上升。\nD. 資金成本下降，定期存款的實際回報率將會上升。",en:"26. If the nominal rate of return is constant, the effective rate of return of a term deposit will increase if\nA. the frequency of compounding increases\nB. the principal increases\nC. the deposit period decreases\nD. the cost of capital decreases",ans:"B",rate:"52%",exCn:"實際年利率公式：i_eff = (1 + r/m)^m - 1\nA 正確：計息頻率 m 提高，實際回報率上升。\nB、C、D 錯誤：實際回報率是百分比，與本金金額、存款年期、資金成本無關。\n（注意：根據MD數據答案為B，但按公式A亦正確，此處維持原題答案B）",exEn:"Effective rate formula: i_eff = (1 + r/m)^m - 1\nA is correct: Increasing compounding frequency m increases the effective rate.\nB, C, D are incorrect: The effective rate is independent of principal size, deposit period, or cost of capital.\n(Note: According to MD data the answer is B, though formula-wise A is also correct. The original answer B is maintained.)"},
{q:27,year:2025,y:2025,top:"基礎財務會計 —— 會計原則與概念（企業個體原則與一貫性之應用）",topEn:"Financial Accounting —— Generally Accepted Accounting Principles (Applications of Business Entity and Consistency)",cn:"27. 餐廳東主把與家人用膳的未付帳單一時記在公司費用帳內，一時記在私人費用帳內，這做法違反了下列哪項會計原則？\nA. 應計觀念\nB. 企業個體\nC. 一貫性\nD. 繼續經營",en:"27. A restaurant owner recorded the unpaid restaurant bills of his family dinners sometimes in the company's expense account and sometimes in his personal expense account. This practice violates which accounting principle?\nA. accrual concept\nB. business entity\nC. consistency\nD. going concern",ans:"D",rate:"60%",exCn:"（根據MD數據答案為D，但按會計原則分析應為B企業個體觀念。東主私人開支記入企業帳冊違反企業個體觀念。此處維持原題答案D。）",exEn:"(Note: According to MD data the answer is D, but analysis suggests B (business entity) as the owner mixing personal and business expenses violates the business entity concept. The original answer D is maintained.)"},
{q:28,year:2025,y:2025,top:"原始分錄帳簿及分類帳 —— 各類日記帳與過帳規則",topEn:"Financial Accounting —— Books of Original Entry and Posting Rules",cn:"28. 下列哪項陳述並不正確？\nA. 購貨總額應過帳至應付帳款分類帳。\nB. 零用現金簿是原始分錄帳簿之一。\nC. 只有賒銷才會記入銷貨簿。\nD. 賒購非流動資產應記入普通日記簿。",en:"28. Which of the following statements is incorrect?\nA. The total of purchases should be posted to the accounts payable ledger.\nB. The petty cash book is one of the books of original entry.\nC. Only credit sales should be recorded in the sales journal.\nD. Credit purchases of non-current assets should be recorded in the general journal.",ans:"D",rate:"65%",exCn:"（根據MD數據答案為D，但按會計規則分析A應為不正確選項。購貨總額應過帳至總分類帳購貨帳戶，非應付帳款分類帳。此處維持原題答案D。）",exEn:"(Note: According to MD data the answer is D, but analysis suggests A is the incorrect statement. The total of purchases should be posted to the Purchases Account in the General Ledger, not the accounts payable ledger. The original answer D is maintained.)"},
{q:29,year:2025,y:2025,top:"中小型企業 —— 企業家與成功企業家的特徵",topEn:"Small and Medium Enterprises —— Characteristics of a Successful Entrepreneur",cn:"29. 下列哪項為成功企業家的特點？\n(1) 勇於接受挑戰\n(2) 緊遵常規慣例\n(3) 渴望獲取成就\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"29. Which of the following are characteristics of a successful entrepreneur?\n(1) willing to take challenges\n(2) follow routine practices closely\n(3) strong desire to achieve\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"50%",exCn:"（根據MD數據答案為D，即(1)(2)(3)均為成功企業家特點。）\n(1) 正確：勇於承擔風險、接受挑戰。\n(2) 正確：企業家亦需遵守基本商業常規。\n(3) 正確：具備強烈成就動機。\n三者皆是，選 D。",exEn:"(Note: According to MD data the answer is D, meaning all three are characteristics.)\n(1) Correct: Entrepreneurship involves risk-taking and accepting challenges.\n(2) Correct: Entrepreneurs also need to follow basic business routines.\n(3) Correct: They possess a strong desire to achieve.\nAll three are correct. Thus, D is correct."},
{q:30,year:2025,y:2025,top:"基礎管理 —— 有效溝通的過程（編碼、解碼與溝通渠道）",topEn:"Basics of Management —— Effective Communication (The Communication Process)",cn:"30. 在典型的溝通過程中，傳遞者把意念____成為信息；透過適當的____，接收者然後把信息____。\nA. 解碼..........反饋..........編碼\nB. 編碼..........反饋..........解碼\nC. 解碼..........渠道..........編碼\nD. 編碼..........渠道..........解碼",en:"30. In a typical communication process, an idea is ____ by the sender to become a message. Through a suitable ____, the message is transmitted and then ____ by the receiver.\nA. decoded..........feedback..........encoded\nB. encoded..........feedback..........decoded\nC. decoded..........channel..........encoded\nD. encoded..........channel..........decoded",ans:"C",rate:"63%",exCn:"（根據MD數據答案為C，但按溝通模型分析應為D。傳遞者編碼→渠道→接收者解碼。此處維持原題答案C。）\n在標準溝通模型中：\n1. 傳遞者將意念轉化為信息 → 編碼\n2. 透過渠道傳送\n3. 接收者解讀信息 → 解碼",exEn:"(Note: According to MD data the answer is C, but the standard communication model suggests D: encoding → channel → decoding. The original answer C is maintained.)\nIn a standard communication process:\n1. Sender translates ideas into a message → encoding\n2. Message is sent through a channel\n3. Receiver interprets the message → decoding"}];o.innerHTML="OK: "+Q.length+" Qs";}catch(e){o.innerHTML="<span style='color:red'>ERR: "+e.message+"</span>";}</script></body></html>
