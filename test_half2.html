{q:15,year:2020,y:2020,top:"基礎個人理財 —— 以證券交易作投資（影響股票價格的因素）",topEn:"Basics of Personal Financial Management —— Stock Trading (Factors affecting share prices)",cn:"15. 撇除其他因素，下列哪項會導致一家上市航空公司的股價下跌？\n(1) 利率上升\n(2) 燃油價格上升\n(3) 該航空公司發出盈利警告\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"15. Ignoring other factors, which of the following will lead to a decrease in the share price of a listed airline company?\n(1) a rise in interest rate\n(2) a rise in fuel price\n(3) the airline company issued a profit warning\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"48%",exCn:"1. **(1) 會導致股價下跌**：市場利率上升，會使得無風險資產（如定存、國債）的吸引力增加，導致資金從股票等風險資產流出，壓低大市及航空公司股價。\n2. **(2) 會導致股價下跌**：航空公司的日常營運中，「航空燃油」是其最龐大且不可控的變動成本。燃油價格上升會顯著提高其營運成本，壓縮利潤空間，使其股價下跌。\n3. **(3) 會導致股價下跌**：航空公司發出盈利警告（Profit warning），代表其預期利潤大幅倒退或將面臨虧損。這直接打擊投資者的信心，會引發拋售，導致股價下跌。\n因此，(1)、(2)及(3)均正確，選 D。",en:"1. **(1) causes share price to fall**: A rise in the market interest rate increases the attractiveness of risk-free assets (such as government bonds and term deposits), leading to capital outflow from equities (risk assets), which depresses stock prices including the airline company's.\n2. **(2) causes share price to fall**: Aviation fuel is the largest variable operating cost for any airline. A rise in fuel prices significantly increases its operating costs, compresses profit margins, and negatively impacts the share price.\n3. **(3) causes share price to fall**: A profit warning issued by the company alerts the market that its profits will fall or that it will face losses. This directly dampens investor confidence and triggers stock sales, resulting in a decline in the share price.\nTherefore, (1), (2), and (3) are all correct. Thus, D is correct."},
{q:16,year:2020,y:2020,top:"營商環境 —— 企業擁有權類型（合夥人特徵：名義與普通合夥人）",topEn:"Business Environment —— Forms of Business Ownership (Characteristics of partners: nominal and general partners)",cn:"16. 以下是一家合夥商號兩名合夥人在角色上的差別：\n合夥人甲：不承擔債務責任、不投入資本、不參與日常營運\n合夥人乙：需要承擔債務責任、需要投入資本、不參與日常營運\n合夥人甲是(1)合夥人，而合夥人乙則是(2)合夥人。\nA. (1) 名義 (2) 有限\nB. (1) 名義 (2) 普通\nC. (1) 普通 (2) 有限\nD. (1) 有限 (2) 名義\nA. (1) 名義 (2) 有限\nB. (1) 名義 (2) 普通\nC. (1) 普通 (2) 有限\nD. (1) 有限 (2) 名義",en:"16. The following are the differences in characteristics of two partners in a partnership:\nPartner A: not liable for partnership debts, does not invest capital, does not participate in daily operations\nPartner B: liable for partnership debts, invests capital, does not participate in daily operations\nPartner A is a (1) partner, while Partner B is a (2) partner.\nA. (1) nominal (2) limited\nB. (1) nominal (2) general\nC. (1) general (2) limited\nD. (1) limited (2) nominal\nA. (1) nominal (2) limited\nB. (1) nominal (2) general\nC. (1) general (2) limited\nD. (1) limited (2) nominal",ans:"B",rate:"39%",exCn:"1. **合夥人甲為「名義合夥人」（Nominal partner）**：名義合夥人僅出借其個人姓名或聲譽予合夥商號以利於業務推廣，他們並非商號的實質擁有人，因此不需要投入資本、不參與日常營運，亦不需對合夥債務承擔責任，故 (1) 應為「名義」。\n2. **合夥人乙為「普通合夥人」（General partner / Dormant partner）**：合夥人乙投入了資本且對債務承擔責任（即負有無限責任），雖然他「不參與日常營運」（在實務上屬於不活躍的「睡夥/潛在合夥人 Dormant partner」），但因為其承擔無限債務責任，他的法定身分仍屬於「普通合夥人」。因此 (2) 應為「普通」，選 B。",en:"1. **Partner A is a \"nominal partner\"**: A nominal partner is one who lends his/her name or reputation to the firm to help promote the business. They do not invest capital, do not participate in daily operations, and are not liable for partnership debts. Thus, (1) is \"nominal\".\n2. **Partner B is a \"general partner\" (specifically, a dormant general partner)**: Partner B invests capital and is liable for the partnership debts (meaning he carries unlimited liability). Although he does not participate in daily operations (which makes him a \"dormant/sleeping partner\" in practice), his legal status is still a \"general partner\" because he has unlimited liability. Thus, (2) is \"general\". Hence, B is correct."},
{q:17,year:2020,y:2020,top:"基礎管理 —— 有效管理的原則（權力及責任與授權原理）",topEn:"Basics of Management —— Principles of Effective Management (Authority and responsibility & Delegation rules)",cn:"17. 下列哪項有關權力和責任的陳述是正確的？\n(1) 工作崗位的責任應與權力平衡。\n(2) 管理人員的權力和責任由低層至高層遞增。\n(3) 授權是指上司把與工作有關的權力和責任交予下屬。\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"17. Which of the following statements about authority and responsibility is/are correct?\n(1) The responsibility of a job position should balance with its authority.\n(2) The authority and responsibility of managers increase from lower levels to higher levels of management.\n(3) Delegation refers to the transfer of work-related authority and responsibility from a superior to a subordinate.\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"72%",exCn:"1. **(1) 正確**：權力與責任平衡原則（Balancing authority and responsibility）指出，員工所承擔的責任應當與其被授予的職權相對等，否則會導致濫用權力或無法履行職責。\n2. **(2) 正確**：在組織科層中，管理人員的層級越高，其所擁有的法定職權越大，所承擔的整體組織責任也越重。因此權力和責任是由低層至高層遞增。\n3. **(3) 錯誤**：在管理學授權（Delegation）理論中，**「職權（Authority）可以被下授，但最終責任（Responsibility/Accountability）不能被轉授或推卸」**。上司將工作指派給下屬並授予相應職權，但上司對該項工作成果的最終責任仍須向其上級承擔。因此 (3) 稱把「責任也交予/轉授下屬」是錯誤的，選 A。",en:"1. **(1) is correct**: The principle of balancing authority and responsibility states that the authority granted to a job position must equal the responsibility assigned to it. If authority exceeds responsibility, power may be abused; if responsibility exceeds authority, tasks cannot be completed effectively.\n2. **(2) is correct**: In an organizational hierarchy, high-level managers hold greater formal authority and carry larger responsibilities for the organisation's overall success, which means both authority and responsibility increase from lower to higher levels.\n3. **(3) is incorrect**: In management theory, **\"authority can be delegated, but ultimate responsibility (accountability) can never be delegated or passed on\"**. When a superior delegates a task, they grant the subordinate the authority to carry it out, but the superior remains ultimately accountable to their own bosses for the task's final outcome. Thus, (3) is incorrect, making A the correct answer."},
{q:18,year:2020,y:2020,top:"原始分錄帳簿及分類帳 —— 購貨帳戶的登記與沖減（提用商品、購貨折扣）",topEn:"Books of Original Entry & Ledgers —— Postings and Adjustments to the Purchases Account",outc:true,reason:"自 2025 年起，購貨帳的記帳原則與存貨非常規流轉的分錄處理，已全數移至選修部分會計單元（Paper 2A）。",reasonEn:"Starting from 2025, recording credit purchases and merchandise stock movements is tested in Elective Module Paper 2A.",cn:"18. 下列哪項交易應記錄在超級市場的購貨帳？\n(1) 購置冰箱貯存雪糕\n(2) 東主從貨倉取去一些罐頭食品供家庭享用\n(3) 因大量採購貨品而獲得供應商給予折扣\nA. 只有(1)\nB. 只有(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"18. Which of the following transactions should be recorded in the purchases account of a supermarket?\n(1) purchased a refrigerator for storing ice-cream\n(2) the owner took some canned food from the warehouse for his family's consumption\n(3) received discount from the supplier for bulk purchases\nA. (1) only\nB. (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"39%",exCn:"1. **(2) 應記錄在購貨帳（貸記）**：東主取走貨倉的商品自用，屬於「提用商品（Drawings of goods）」。會計分錄為「借記：提用」；**「貸記：購貨（Purchases）」**（按成本價沖減購貨額）。因此，這筆交易必須登記並記錄在「購貨帳（Purchases Account）」中，故 (2) 正確。\n2. **(1) 不記錄在購貨帳**：購置冰箱屬於購買「非流動資產（設備）」，應記入「辦公室設備/器材帳」，而非用於記錄轉售商品的購貨帳。\n3. **(3) 不記錄在購貨帳**：因大量採購獲得的折扣屬於「貿易折扣（Trade discount）」。貿易折扣在賒購當時已直接從貨品定價中扣除，商號直接按扣除後的「淨額」記入購貨帳中，在會計帳冊內不對貿易折扣作任何單獨記錄。故選 B。",en:"1. **(2) should be recorded in the purchases account**: When the owner takes inventory (canned food) for personal use, this represents drawings of goods. The double-entry is Debit: Drawings and **Credit: Purchases** (to reduce the total purchase cost). Since the purchases account is credited, this transaction must be recorded in it. Thus, (2) is correct.\n2. **(1) should not be recorded**: Purchasing a refrigerator for store use is an acquisition of a non-current asset (equipment), which is recorded in the equipment account, not the purchases account (which only records trading inventory).\n3. **(3) should not be recorded**: Discounts received for bulk purchases are \"trade discounts\". Trade discounts are deducted directly on the invoice, and the transaction is recorded immediately at the net purchase price. No separate entry is made in the purchases account for the trade discount. Thus, B is correct."},
{q:19,year:2020,y:2020,top:"基礎個人理財 —— 策劃個人理財及投資（投資工具特徵與投資者權利）",topEn:"Basics of Personal Financial Management —— Personal Financial Planning & Investment (Rights of a bond investor)",cn:"19. 下列哪項是債券投資者的權利？\n(1) 若投資顧問行為不當，可作出投訴\n(2) 可查詢投資建議的背後理念\n(3) 在冷靜期內可取消投資交易\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"19. Which of the following are the rights of a bond investor?\n(1) make a complaint if the investment advisor behaves inappropriately\n(2) ask for the rationale behind the investment recommendation\n(3) cancel the investment transaction within the cooling-off period\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"43%",exCn:"1. **(1) 正確**：作為個人投資者，若金融服務中介或投資顧問有任何不當或違規行為，投資者依法享有向監管機構（如證監會、金管局）「提出投訴的權利」。\n2. **(2) 正確**：個人投資者享有「知情權」，有權隨時要求經紀或投資顧問詳細「解釋和查詢其所提出投資建議背後的理據與分析邏輯」。\n3. **(3) 錯誤**：在香港，購買常規公司債券或經二級市場交易的債券，法律和交易所規則上**並無提供「冷靜期內無條件取消投資交易」**的權利（冷靜期僅存在於部分保險合約或特定的非上市結構性衍生產品中）。因此選 A。",en:"1. **(1) is correct**: As an individual investor/consumer of financial services, if an investment advisor behaves inappropriately or violates regulations, the investor has the right to file a complaint with regulatory bodies (such as the SFC or HKMA).\n2. **(2) is correct**: Individual investors have the right to information and transparency. They have the right to ask for and understand the rationale or logic behind any investment recommendation made by their broker or bank.\n3. **(3) is incorrect**: In Hong Kong, purchasing corporate bonds or trading bonds in the secondary market does not carry a statutory \"cooling-off period\" during which investors can unconditionally cancel transactions. (Cooling-off periods only apply to specific insurance contracts or non-listed structured investment products). Thus, A is correct."},
{q:20,year:2020,y:2020,top:"會計假設、原則及慣例 —— 企業個體觀念之違反與應用",topEn:"Generally Accepted Accounting Principles —— Violation of the Business Entity Concept",outc:true,reason:"自 2025 年起，公認會計假設、原則及慣例（包括企業個體觀念）的定義與實務應用，已全數移至選修部分會計單元（Paper 2A）。",reasonEn:"Starting from 2025, accounting assumptions, principles, and conventions are tested in Elective Module Paper 2A.",cn:"20. 陳輝是兩家商號的東主。為方便起見，他把兩家商號的所有購貨記入同一帳冊內。這個案違反了下列哪項會計假設、原則或慣例？\nA. 應計觀念\nB. 歷史成本\nC. 繼續經營\nD. 企業個體\nA. 應計觀念\nB. 歷史成本\nC. 繼續經營\nD. 企業個體",en:"20. Chan Fai is the owner of two firms. For convenience, he recorded all purchases of the two firms in the same set of books. Which of the following accounting assumptions, principles or conventions has been violated in this case?\nA. Accrual\nB. Historical cost\nC. Going concern\nD. Business entity\nA. Accrual\nB. Historical cost\nC. Going concern\nD. Business entity",ans:"D",rate:"93%",exCn:"1. **D 正確**：**企業個體觀念（Business Entity Concept）**規定，在會計上，企業應被視作獨立於其東主及其他個體的獨立會計主體。即使兩家商號屬於同一個東主（陳輝），這兩家商號也是兩個「互不相同、彼此獨立」的會計個體，必須各自獨立開設和保存自己專屬的會計帳冊，不得混合記錄。將兩家公司的購貨混記入同一本帳冊中，直接違反了企業個體觀念，選 D。\n2. **A（應計觀念）**要求按賺得/招致而非現金收付記錄損益；**B（歷史成本）**要求按購置成本入帳；**C（繼續經營）**假定企業在可見未來持續經營。三者與本案無關。",en:"1. **D is correct**: The **business entity concept** states that a business is treated as an accounting entity separate and distinct from its owner(s) and any other businesses. Even though the two firms are owned by the same proprietor (Chan Fai), they are legally and accounting-wise distinct entities. Each firm must maintain its own independent set of books. Mixing the purchases of both firms in a single set of books violates the business entity concept. Thus, D is correct.\n2. **A (Accrual)** states that transactions should be recorded when they occur, not when cash is paid or received. **B (Historical cost)** states that assets are recorded at acquisition cost. **C (Going concern)** assumes the business will continue to operate for the foreseeable future. These are not violated in this scenario."},
{q:21,year:2020,y:2020,top:"基礎管理 —— 主要商業功能（部門與功能分工：資訊與市場營銷管理）",topEn:"Basics of Management —— Major Business Functions (Functional department roles: information and marketing management)",cn:"21. 下列哪項陳述是不正確的？\nA. 人力資源部門根據財務部門所設的條件招聘會計文員。\nB. 資訊管理部門運用市場營銷部門收集的數據訂定產品價格。\nC. 風險管理部門為營運部門評估使用工具和機器的風險。\nD. 財務部門為營運部門取得貸款，以擴展生產能力。\nA. 陳述 A\nB. 陳述 B\nC. 陳述 C\nD. 陳述 D",en:"21. Which of the following statements is not correct?\nA. The human resources department recruits an accounting clerk according to the requirements set by the finance department.\nB. The information management department uses data collected by the marketing department to set the product price.\nC. The risk management department assesses the risks of using tools and machinery for the operations department.\nD. The finance department obtains loans for the operations department to expand production capacity.\nA. Statement A\nB. Statement B\nC. Statement C\nD. Statement D",ans:"B",rate:"74%",exCn:"1. **B 為不正確的陳述（即正確答案）**：在企業內，產品或服務價格的制定與定價策略，屬於**市場營銷管理部門（Marketing Department）**的核心職掌（營銷 4P 中的 Price），資訊管理部門（Information Management）僅提供技術與數據處理支援，不具備「訂定產品價格」的職能。\n2. **A 正確**：財務部設立文員崗位需求，人資部（HR）據此招聘，體現了人力資源與財務功能的分工合作。\n3. **C 正確**：風險管理部為營運/生產部門提供職安健及工具使用安全風險評估，以避免事故。\n4. **D 正確**：財務部負責融資，為生產營運部籌集貸款購置設備以擴展產能。因此選 B。",en:"1. **B is the incorrect statement (making it the correct answer)**: Deciding and setting the product price is a core responsibility of the **marketing management department** (Price under the marketing mix 4Ps). The information management department only provides data processing and systems support, and does not have the authority or role to \"set product prices\".\n2. **A is correct**: The HR department recruits an accounting clerk according to the specific job requirements and criteria set by the finance department.\n3. **C is correct**: The risk management department evaluates operational hazards (such as using tools/machinery) to safeguard the operations department.\n4. **D is correct**: The finance department secures external funding (loans) to enable the operations department to acquire assets and expand output. Thus, B is correct."},
{q:22,year:2020,y:2020,top:"營商環境 —— 商業道德與社會責任（對各持份者履行社會責任）",topEn:"Business Environment —— Business Ethics & Social Responsibility (Fulfilling social responsibilities to stakeholders)",cn:"22. 下列哪一家公司並沒有向持份者履行社會責任？\nA. 公司向客戶採取嚴格的信貸政策。\nB. 公司沒有派發股息予普通股股東。\nC. 公司產品的價格較競爭對手的同類產品為高。\nD. 公司沒有為僱員提供培訓和發展的機會。\nA. 公司 A\nB. 公司 B\nC. 公司 C\nD. 公司 D",en:"22. Which of the following companies is not fulfilling its social responsibility towards stakeholders?\nA. A company which adopts a strict credit policy towards its customers.\nB. A company which does not distribute dividends to its ordinary shareholders.\nC. A company which sells its products at prices higher than those of its competitors.\nD. A company which does not provide training and development opportunities for its employees.\nA. Company A\nB. Company B\nC. Company C\nD. Company D",ans:"D",rate:"66%",exCn:"1. **D 正確（代表該公司未履行社會責任）**：僱員是企業極其重要的內部持份者。企業對僱員的社會責任包括：提供安全舒適的工作環境、給予公平報酬，以及**提供合適的培訓與個人發展/晉升機會**。未提供培訓機會，屬於未履行對僱員持份者的社會責任，選 D。\n2. **A、B、C 屬於常規商業運作決定**：採取嚴格信貸政策（A）以規避呆壞帳，決定不分分紅派息（B）以留存利潤擴大經營，及按高溢價定位產品（C），皆屬於企業合法、合理的日常商業和財務運作策略，並不等同於「違反或未履行社會責任」。",en:"1. **D is correct (indicating non-fulfillment of social responsibility)**: Employees are vital internal stakeholders. A company's social responsibility toward its workforce includes providing a safe workplace, fair pay, and **offering opportunities for professional training and career development**. Failure to provide training is a failure to fulfill CSR to employees.\n2. **A, B, and C are normal business decisions**: Adopting a strict credit policy (A) avoids bad debts; withholding dividends (B) retains profits for business growth; and premium-pricing products (C) represents a marketing strategy. These decisions are within legal and normal business operations and do not constitute a failure of social responsibility."},
{q:23,year:2020,y:2020,top:"財務報表分析 —— 變現能力會計比率計算（速動比率/酸性測驗比率）",topEn:"Financial Ratio Analysis —— Calculating Liquidity Ratios (Liquid ratio / Acid-test ratio)",outc:true,reason:"自 2025 年起，財務報表分析的各類會計比率計算（如速動比率），已全數移至選修部分會計單元（Paper 2A）。",reasonEn:"Starting from 2025, financial ratios (including the liquid ratio) are tested in Elective Module Paper 2A.",cn:"23. 2019年12月31日，一家商號的帳戶結餘摘錄如下：\n存貨 $17 500 | 銀行存款 $27 000 | 應付貨款 $30 800 | 應收貨款 $16 400 | 借給僱員的短期貸款 $8 000 | 銀行貸款(於2022年到期) $13 000\n商號的速動比率是多少？\nA. 1.12:1\nB. 1.57:1\nC. 1.67:1\nD. 2.24:1\nA. 1.12:1\nB. 1.57:1\nC. 1.67:1\nD. 2.24:1",en:"23. The following balances as at 31 December 2019 were extracted from the accounts of a firm:\nInventory $17 500 | Bank $27 000 | Trade payables $30 800 | Trade receivables $16 400 | Short term loan to employees $8 000 | Bank loan (repayable in 2022) $13 000\nWhat is the liquid ratio of the firm?\nA. 1.12:1\nB. 1.57:1\nC. 1.67:1\nD. 2.24:1\nA. 1.12:1\nB. 1.57:1\nC. 1.67:1\nD. 2.24:1",ans:"C",rate:"34%",exCn:"1. **C 正確**：\n- **第一步：識別流動負債（Current Liabilities）**：流動負債項目僅包括「應付貨款 $30,800」（長期銀行貸款於 2022 年到期，在 2019 年底屬於非流動負債，排除）。流動負債 = **$30,800**。\n- **第二步：計算速動資產（Quick Assets / Liquid Assets）**：速動資產指可迅速變現的流動資產，公式為「流動資產 - 存貨」。\n  流動資產項目有：存貨 $17,500、銀行存款 $27,000、應收貨款 $16,400、借給僱員的短期貸款 $8,000。\n  速動資產 = 銀行存款 $27,000 + 應收貨款 $16,400 + 借給僱員的短期貸款 $8,000 = **$51,400**（存貨 $17,500 變現最慢，排除）。\n- **第三步：套用速動比率公式**：\n  速動（酸性測驗）比率 = 速動資產/流動負債 = $51,400/$30,800 ≈ **1.67:1**（選 C）。",en:"1. **C is correct**:\n- **Step 1: Identify Current Liabilities**: The only current liability is \"Trade payables $30,800\". The long-term bank loan matures in 2022 (over one year from 31 Dec 2019) and is classified as a non-current liability, thus excluded.\n- **Step 2: Calculate Quick Assets (Liquid Assets)**: Quick assets are current assets excluding inventory. These include:\n  Bank $27,000 + Trade receivables $16,400 + Short-term loan to employees $8,000 = **$51,400** (inventory is excluded as it is the least liquid current asset).\n- **Step 3: Calculate Liquid (Quick) Ratio**:\n  Liquid Ratio = Quick Assets/Current Liabilities = $51,400/$30,800 ≈ **1.67:1** (Option C)."},
{q:24,year:2020,y:2020,top:"營商環境 —— 香港的經濟發展近況（全球一體化的影響）",topEn:"Business Environment —— Recent Developments of Hong Kong Economy (Impact of globalisation)",cn:"24. 下列哪項是全球一體化對香港企業的好處？\n(1) 更多資金來源\n(2) 引入新技術\n(3) 較低生產成本\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"24. Which of the following are the benefits brought about by globalisation to Hong Kong businesses?\n(1) more sources of capital\n(2) introduction of new technology\n(3) lower production cost\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"75%",exCn:"1. **(1) 正確**：全球金融市場一體化便利了資本的跨國自由流動，本港企業能更容易吸收外來投資或在境外融資，擁有「更多資金來源」。\n2. **(2) 正確**：跨國合作與外商直接投資（FDI）可促進先進「新技術與管理經驗之轉移」，提升本港企業的技術和生產力。\n3. **(3) 正確**：全球採購與業務外包（Outsourcing）使本港企業能將生產或後勤工序外判予原材料或勞工成本更低廉的地區，從而實現「較低生產成本」。\n因此，(1)、(2)及(3)均為好處，選 D。",en:"1. **(1) is correct**: Globalisation facilitates the free flow of capital internationally, allowing Hong Kong businesses to source investments or finance their projects from international capital markets easily.\n2. **(2) is correct**: Cross-border collaborations and foreign direct investments promote technology transfer, allowing local firms to adopt advanced new technologies and systems.\n3. **(3) is correct**: Global sourcing and offshore outsourcing enable Hong Kong businesses to purchase cheap materials or outsource manufacturing and support operations to low-cost countries, thereby achieving lower overall production costs.\nTherefore, (1), (2), and (3) are all correct. Thus, D is correct."},
{q:25,year:2020,y:2020,top:"基礎個人理財 —— 強制性公積金（強積金）制度下的權利和責任",topEn:"Basics of Personal Financial Management —— MPF Scheme Rights and Responsibilities",cn:"25. 下列哪項有關強制性公積金(強積金)制度的陳述是正確的？\n(1) 僱員可每年一次將供款帳戶內的累算權益轉移到他們自選的強積金計劃。\n(2) 自僱小販毋須參加強積金計劃。\n(3) 如僱員的收入低於最低有關入息水平，僱員及僱主均毋須作強制性供款。\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"25. Which of the following statements about the Mandatory Provident Fund (MPF) System is/are correct?\n(1) Employees can transfer the accrued benefits in their contribution accounts to an MPF scheme of their own choice once a year.\n(2) Self-employed hawkers are not required to join an MPF scheme.\n(3) If the income of an employee is below the minimum relevant income level, both the employee and the employer are not required to make mandatory contributions.\nA. (1) only\nB. (1) and (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"56%",exCn:"1. **(1) 正確**：根據強積金「僱員自選安排」（俗稱強積金半自由行），僱員有權每年一次，將自己供款帳戶內的僱員強制性供款累算權益，轉移至自選的強積金計劃。\n2. **(2) 正確**：強積金條例列明部分特定「豁免人士（Exempt persons）」群體，其中包括「持牌自僱小販（Licensed hawkers）」，他們依法毋須參加強積金計劃。\n3. **(3) 錯誤**：若普通僱員的入息低於法定最低水平（目前為每月 $7,100），該**僱員個人「毋須」作 5% 的強制供款，但「其僱主」仍然必須依法承擔並作出 5% 的強制性供款**（並非雙方均毋須供款）。\n因此，(1) 和 (2) 正確，選 B。",en:"1. **(1) is correct**: Under the \"Employee Choice Arrangement\" (the MPF semi-free pass), employees can transfer their accrued benefits derived from employee mandatory contributions in their contribution accounts to an MPF scheme of their own choice once a year.\n2. **(2) is correct**: Under the MPF Ordinance, \"licensed self-employed hawkers\" are designated as exempt persons, and are not required to join any MPF schemes.\n3. **(3) is incorrect**: If an employee's monthly income is below the minimum relevant income level (currently $7,100 per month), the **employee is exempt from making mandatory contributions, but the employer is still legally required to contribute 5%** of the employee's income. It is incorrect to say both do not need to contribute.\nTherefore, only (1) and (2) are correct. Thus, B is correct."},
{q:26,year:2020,y:2020,top:"基礎管理 —— 組織功能（組織架構：扁平式與高架式組織架構之對比）",topEn:"Basics of Management —— Organising (Organisational structure: flat vs. tall structures)",cn:"26. 甲公司和乙公司的員工數目相同。甲公司採用扁平式組織架構，而乙公司採用高架式組織架構。下列哪項陳述是正確的？\n(1) 甲公司較迅速回應市場轉變。\n(2) 甲公司的管理層級較多。\n(3) 甲公司的管理人員較多。\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"26. The number of staff in Firm A and Firm B are the same. Firm A has a flat organisational structure while Firm B has a tall organisational structure. Which of the following statements is/are correct?\n(1) Firm A is more responsive to market changes.\n(2) There are more levels of management in Firm A.\n(3) There are more managers in Firm A.\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"A",rate:"74%",exCn:"1. **(1) 正確**：扁平式組織架構（Flat structure）管理層級少，信息傳遞和決策反饋鏈條更短，因此能更靈活、迅速地回應市場變化與顧客需求。\n2. **(2) 錯誤**：扁平式組織比高架式組織（Tall structure）的管理層級（Levels of management）更「少」，而非更多。\n3. **(3) 錯誤**：在員工總數完全相同的條件下，扁平式組織的控制幅度（Span of control）較寬，每位經理直接督導的下屬人數較多，因此其所需的管理人員（Managers）總數實際上會比高架式組織「更少」，而非更多。因此選 A。",en:"1. **(1) is correct**: A flat organisational structure has fewer levels of management, which shortens the communication and decision-making feedback loop, allowing the firm (Firm A) to be more flexible and responsive to market and customer changes.\n2. **(2) is incorrect**: A flat structure has *fewer* levels of management compared to a tall structure, not more.\n3. **(3) is incorrect**: Given the same total number of employees, managers in a flat structure have a wider span of control (supervising more subordinates), meaning Firm A requires *fewer* total managers than Firm B (which has a tall structure with narrow spans of control). Thus, only (1) is correct, making A the correct answer."},
{q:27,year:2020,y:2020,top:"營商環境 —— 企業擁有權類型（跨國公司 MNCs 的定義與特徵）",topEn:"Business Environment —— Forms of Business Ownership (Characteristics of multinational corporations)",cn:"27. 下列哪項有關跨國公司的陳述是正確的？\n(1) 跨國公司是公眾有限公司。\n(2) 跨國公司在不同國家營運。\n(3) 本地公司在其他國家籌集資本便成為跨國公司。\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(2)\nD. 只有(2)及(3)\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(2)\nD. 只有(2)及(3)",en:"27. Which of the following statements about multinational corporations is/are correct?\n(1) Multinational corporations are public limited companies.\n(2) Multinational corporations operate in different countries.\n(3) A local company becomes a multinational corporation by raising capital in other countries.\nA. (1) only\nB. (2) only\nC. (1) and (2) only\nD. (2) and (3) only\nA. (1) only\nB. (2) only\nC. (1) and (2) only\nD. (2) and (3) only",ans:"B",rate:"62%",exCn:"1. **(2) 正確**：跨國公司（MNCs）在定義上，必須在兩個或多個國家或地區擁有生產、營運設施、或持有實質資產，並開展跨國的商業運作，故 (2) 正確。\n2. **(1) 錯誤**：跨國公司並不一定要是「公眾有限公司」（Public limited companies），很多大型跨國公司亦可以以私人有限公司的形式註冊和經營。\n3. **(3) 錯誤**：一家本地公司如果僅在海外金融市場發行債券或股票籌集資金，但並未在海外設立生產設施或開展營運，它在定義上仍不屬於跨國公司。融資管道與經營實體的分佈是不同的概念。因此，只有 (2) 正確，選 B。",en:"1. **(2) is correct**: By definition, a multinational corporation (MNC) must possess productive assets, facilities, or offices, and conduct commercial business operations in two or more countries.\n2. **(1) is incorrect**: MNCs do not necessarily have to be public limited companies; many operate successfully as private limited companies.\n3. **(3) is incorrect**: Simply raising capital on overseas stock or bond markets (such as a Mainland firm issuing bonds in HK) does not qualify a local business as an MNC. It must establish actual operations or own assets abroad to meet the definition. Thus, only (2) is correct, making B the correct answer."},
{q:28,year:2020,y:2020,top:"基礎個人理財 —— 證券交易作投資（香港主板與 GEM 上市要求對比）",topEn:"Basics of Personal Financial Management —— Stock Trading as an Investment (Main Board vs. GEM listing requirements)",outc:true,reason:"自 2025 年起，新版課綱已明確規定必修部分「不包括主板及創業板新申請人的基本上市要求」之考核，此細部對比已移出必修部分大綱。",reasonEn:"Starting from 2025, the detailed basic listing requirements for new applicants of Main Board and GEM are excluded from Paper 1 (Compulsory Part) syllabus.",cn:"28. 下列哪項有關主板及GEM(前稱創業板)的描述是正確的？\n(1) 在主板上市的公司數目較在GEM上市的為多。\n(2) 主板上市申請人的其中一項基本上市要求是「最少前三個會計年度的管理層維持不變」。\n(3) 主板是為大型及根基穩健的公司而設的。\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"28. Which of the following descriptions of the Main Board and GEM (previously known as Growth Enterprise Market) are correct?\n(1) More companies are listed on the Main Board than on GEM.\n(2) 'Management continuity for at least the three preceding financial years' is one of the basic listing requirements for applicants to list on the Main Board.\n(3) The Main Board was set up for large and established companies.\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"19%",exCn:"1. **(1) 正確**：在香港證券交易所，主板上市的公司數量在客觀實務上遠遠多於創業板（GEM）上市的公司。\n2. **(2) 正確**：聯交所規定，申請在主板上市的新申請人，必須滿足「最少前三個會計年度（3年）管理層維持不變（Management continuity）」及「最近一個會計年度擁有權及控制權維持不變」之法定基本要求。\n3. **(3) 正確**：主板的定位正是為達到較高財務盈利測試標準、經營根基穩健且具備一定規模的「大型企業」而設；而 GEM（創業板）則是為具有增長潛力的中小型企業設計的集資平台。因此，三者描述皆正確，選 D。",en:"1. **(1) is correct**: Historically, the number of companies listed on the Main Board of the HKEX is significantly larger than those on the GEM board.\n2. **(2) is correct**: To protect investors, a key basic listing requirement for new applicants of the Main Board is demonstrating \"management continuity for at least the three preceding financial years\".\n3. **(3) is correct**: The Main Board is specifically designed as a fundraising platform for large, mature, and well-established companies with historical profits; GEM is targeted at high-growth SMEs. Therefore, all three statements are correct, making D the correct answer."},
{q:29,year:2020,y:2020,top:"基礎管理 —— 管理功能（領導：自由放任式領導風格之應用）",topEn:"Basics of Management —— Management Functions (Leading: laissez-faire leadership style applications)",cn:"29. 在下列哪些情況下，上司應採用自由放任式領導？\n(1) 工作要求高階的創意\n(2) 下屬均年青而有活力\n(3) 上司與下屬關係良好\nA. 只有(1)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)\nA. 只有(1)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"29. Under which of the following circumstances should laissez-faire leadership be adopted by a superior?\n(1) the work requires a high level of creativity\n(2) subordinates are young and energetic\n(3) superior-subordinate relationship is good\nA. (1) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)\nA. (1) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"59%",exCn:"1. **(1) 正確**：自由放任式（Laissez-faire）領導強調整體授權、極少干預。當工作需要「高階創意與靈感」（如藝術設計、程式開發、科研）時，給予下屬極大自主權可激發創造力，此時最適合採用自由放任風格。\n2. **(2) 錯誤**：下屬「年輕而有活力」並不代表其具備高度的專業自律、豐富經驗與獨立解決問題能力。若下屬缺乏經驗，盲目採用自由放任會導致目標迷失或運作混亂。\n3. **(3) 錯誤**：上下級關係良好，並不直接構成採用自由放任式的依據。關係良好亦可採用民主式或參與式領導。故選 A。",en:"1. **(1) is correct**: Laissez-faire leadership grants complete autonomy and involves minimal interference. It is highly suitable when the tasks require high levels of \"creativity, innovation and self-motivation\" (e.g. fashion design, software programming, academic research).\n2. **(2) is incorrect**: \"Young and energetic\" employees do not necessarily possess high self-discipline, industry knowledge, or experienced decision-making skills. Inexperienced staff will become confused and passive under a laissez-faire boss.\n3. **(3) is incorrect**: Good relationships between a superior and subordinates are common across various leadership styles (like democratic or participative) and do not serve as a primary justification for total non-interference. Thus, only (1) is correct, making A the correct answer."},
{q:30,year:2020,y:2020,top:"原始分錄帳簿及分類帳 —— 商業折扣運算與應收貨款結欠核算",topEn:"Books of Original Entry & Ledgers —— Calculating Trade and Cash Discounts for Settlement",outc:true,reason:"自 2025 年起，商品交易的核算（包括交易折扣與現金折扣的分開處理）已全數移至選修部分會計單元（Paper 2A）。",reasonEn:"Starting from 2025, detailed accounting computations of trade and cash discounts are tested in Elective Module Paper 2A.",cn:"30. 4月8日，天明向華順賒購貨品$60000，可享交易折扣2%;如十日內清還貨欠，天明可另享折扣3%。如果天明於4月21日清還貨欠，他須償還：\nA. $57 036\nB. $58 200\nC. $58 800\nD. $60 000\nA. $57 036\nB. $58 200\nC. $58 800\nD. $60 000",en:"30. On 8 April, Tin Ming purchased goods for $60 000 on credit from Walter with a trade discount of 2%. Another 3% discount would be received by Tin Ming if settlement was made within 10 days. If Tin Ming makes the settlement on 21 April, he has to repay\nA. $57 036\nB. $58 200\nC. $58 800\nD. $60 000\nA. $57 036\nB. $58 200\nC. $58 800\nD. $60 000",ans:"C",rate:"89%",exCn:"1. **C 正確**：計算步驟如下：\n- **第一步：扣除交易折扣（Trade discount 2%）計算賒購淨發票額**：\n  淨購貨額 = $60,000 × (1 - 2%) = $60,000 × 0.98 = **$58,800**\n  （此淨額 $58,800 即為當初賒購時登記入帳的應付貨款金額）。\n- **第二步：判定是否享有現金折扣（Cash discount 3%）**：\n  賒購日期：4月8日。享有 3% 折扣的最後限期為 10 天內：即 4月18日或之前。天明清還貨欠日期為 4月21日（已過期 13 天），因此**無法享有任何現金折扣**。\n- **第三步：求償還總金額**：天明必須按發票淨額全額清還欠款 = **$58,800**，故選 C。",en:"1. **C is correct**: Calculation steps are as follows:\n- **Step 1: Deduct Trade Discount (2%) to find the net invoice price**:\n  Net purchase price = $60,000 × (1 - 0.02) = $60,000 × 0.98 = **$58,800**\n  (This $58,800 is recorded as the accounts payable upon transaction date).\n- **Step 2: Determine eligibility for cash discount (3%)**:\n  Purchase date: 8 April. 10-day discount period deadline: 18 April or before. Tin Ming settles the debt on 21 April (13 days later), which is beyond the discount period. Therefore, **he is NOT eligible for any cash discount**.\n- **Step 3: Calculate the repayment amount**:\n  He must repay the full net invoice amount of **$58,800**. Thus, C is correct."},
{q:1,year:2021,y:2021,top:"營商環境 —— 國際貿易合作組織（世界貿易組織 WTO）",topEn:"Business Environment —— International Trade Organisations (World Trade Organisation)",cn:"下列哪項有關世界貿易組織的陳述是正確的？\n(1) 它執行成員之間的國際貿易規則。\n(2) 它協助發展中國家增加貿易機會。\n(3) 它消除成員之間的貿易障礙。\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"Which of the following statements about the World Trade Organisation is/are correct?\n(1) It enforces the rules of international trade among members.\n(2) It helps developing countries increase their trading opportunities.\n(3) It eliminates trade barriers among members.\nA. (1) only\nB. (1) and (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"17%",exCn:"1. (1) 正確：WTO 擁有具法律約束力的爭端解決機制，確實會對其成員「執行」國際貿易規則。\n2. (2) 正確：WTO 的核心政策方針之一，即是提供技術援助和構建貿易能力，協助發展中國家增加貿易和出口機會。\n3. (3) 錯誤（最大陷阱）：WTO 的目標在於「逐步削減、大幅降低」關稅和貿易壁壘，而並非「完全消除」。實務上各成員國之間依然保留了許多合法的保護性關稅和壁壘。因此選 B。",exEn:"1. (1) is correct: The WTO possesses a legally binding dispute settlement mechanism and indeed 'enforces' international trade rules among members.\n2. (2) is correct: One of the core mandates of the WTO is to provide technical assistance and trade capacity building to help developing countries expand their trade and export opportunities.\n3. (3) is incorrect (Major Trap): The WTO's objective is to 'reduce or lower' tariffs and trade barriers progressively, not to 'eliminate' them entirely. In practice, many legal protective tariffs and trade barriers remain between members. Thus, B is correct."},
{q:2,year:2021,y:2021,top:"基礎管理 —— 組織結構的部門劃分（按產品成立部門）",topEn:"Basics of Management —— Organisational Structure (Departmentalisation by product)",cn:"按產品劃分部門的意思是指\nA. 不同部門服務不同國家的顧客\nB. 為不同市場發展不同的產品線\nC. 工人按生產程序分工\nD. 產品的生產、市場營銷及其他相關工作均由一位經理負責",en:"Departmentalisation by product means\nA. different departments serve customers in different countries\nB. different product lines are developed for different markets\nC. workers are divided according to production processes\nD. the production, marketing and other related work of a product are under the charge of a manager",ans:"D",rate:"30%",exCn:"D 正確：按產品成立部門（Departmentalisation by product）是指將與某種特定產品或產品線相關的研發、生產、銷售、財務等所有營運活動，全部交由同一位專責經理來統一領導和管理。\n其他選項分析：A 屬於按地區劃分；B 僅是市場發展策略，而非部門組織劃分；C 屬於按過程/程序分工。",exEn:"D is correct: Departmentalisation by product means grouping all activities associated with a single product or product line—including development, production, marketing, and finance—under the leadership and responsibility of a single manager.\nAnalysis of other options: A refers to departmentalisation by location; B is a marketing expansion strategy, not an organisational structure; C refers to departmentalisation by process/division of labor."},
{q:3,year:2021,y:2021,top:"[out c] 基礎財務會計 —— 會計的目的及角色（會計的功能）",topEn:"[out c] Purpose of Accounting —— Tasks and Functions of Accounting",outc:true,reason:"自 2025 年起，「會計的目的及角色（記錄、分類、歸納和溝通功能）」已全數移至選修部分（會計單元）第一章（Paper 2A）。",reasonEn:"Starting from 2025, 'the purpose and role of accounting (recording, classifying, summarising, communicating)' has been entirely transferred to Elective Module Paper 2A, Chapter 1.",cn:"一家零售店的簿記員於年終時結平帳戶，列出帳戶結餘，並編製試算表。該簿記員執行了以下哪項會計功能？\nA. 記錄\nB. 分類\nC. 歸納\nD. 溝通",en:"A bookkeeper of a retail shop balances off accounts at the end of the year, lists out the account balances and prepares a trial balance. Which of the following functions of accounting has the bookkeeper performed?\nA. recording\nB. classifying\nC. summarising\nD. communicating",ans:"C",rate:"56%",exCn:"C 正確：在會計的四大基本功能中，「歸納（Summarising）」是指在期末將所有分類帳戶的借貸餘額結平，並彙總編製成未調整試算表及財務報表的過程。\n其他選項分析：記錄日常交易屬於「記錄（Recording）」；過帳到分類帳屬於「分類（Classifying）」；將財報傳遞給用家屬於「溝通（Communicating）」。",exEn:"C is correct: Among the four primary functions of accounting, 'summarising' refers to the period-end process of balancing ledger accounts and preparing summaries like trial balances and financial statements.\nAnalysis of other options: Entering daily transactions is 'recording'; posting entries to the ledgers is 'classifying'; presenting reports to users is 'communicating'."},
{q:4,year:2021,y:2021,top:"基礎個人理財 —— 金錢的時間值（淨現值計算）",topEn:"Basics of Personal Financial Management —— Time Value of Money (Net Present Value)",cn:"文妮正考慮一項三年期的投資項目，詳情如下：\n* 第一年年初：($70 000)\n* 第二年年初：$25 000\n* 第三年年初：$35 000\n該項目終結時的殘值為$20000，貼現率為每年5%。該項目的淨現值是多少？\nA. -$14 445\nB. $187\nC. $2 832\nD. $3 520",en:"Mandy is considering investing in a 3-year project with the following details:\n* Beginning of Year 1: ($70 000)\n* Beginning of Year 2: $25 000\n* Beginning of Year 3: $35 000\nThe scrap value at the end of the project is $20 000. The discount rate is 5% per annum. What is the net present value of the project?\nA. -$14 445\nB. $187\nC. $2 832\nD. $3 520",ans:"C",rate:"40%",exCn:"本題關鍵在於精確將時間點對應到折現公式：\n1. 第一年年初（即當前，t=0）：現金流出 = -$70,000。\n2. 第二年年初（等同於第一年年終，t=1）：現金流入 = $25,000。其現值為 $25,000 / 1.05^1 = $23,809.52。\n3. 第三年年初（等同於第二年年終，t=2）：現金流入 = $35,000。其現值為 $35,000 / 1.05^2 = $31,746.03。\n4. 項目終結時（即第三年年底，t=3）：殘值 = $20,000。其現值為 $20,000 / 1.05^3 = $17,276.75。\n5. 淨現值（NPV）= $23,809.52 + $31,746.03 + $17,276.75 - $70,000 = $2,832.30 = $2,832。因此選 C。",exEn:"The key is to map the time points accurately on the timeline (t=0, 1, 2, 3):\n1. Beginning of Year 1 (today, t=0): Cash outflow = -$70,000.\n2. Beginning of Year 2 (End of Year 1, t=1): Cash inflow = $25,000. PV = $25,000 / 1.05^1 = $23,809.52.\n3. Beginning of Year 3 (End of Year 2, t=2): Cash inflow = $35,000. PV = $35,000 / 1.05^2 = $31,746.03.\n4. End of project (End of Year 3, t=3): Scrap value = $20,000. PV = $20,000 / 1.05^3 = $17,276.75.\n5. Net Present Value (NPV) = $23,809.52 + $31,746.03 + $17,276.75 - $70,000 = $2,832.30 = $2,832. Thus, C is correct."},
{q:5,year:2021,y:2021,top:"基礎管理 —— 有效管理原則（授權與職權）",topEn:"Basics of Management —— Principles of Effective Management (Authority and Delegation)",cn:"下列哪項不是授權的好處？\nA. 提高下屬的工作滿足感\nB. 改善上司與下屬的關係\nC. 為下屬提供培訓機會\nD. 讓上司專注於重要的工作",en:"Which of the following is not a benefit of delegation?\nA. increases subordinates' job satisfaction\nB. improves the relationship between superior and subordinates\nC. provides training opportunities for subordinates\nD. allows superiors to focus on important tasks",ans:"B",rate:"44%",exCn:"B 正確：授權（Delegation）能減輕主管的日常例行事務，使其專注於重大戰略決策（D）；同時授予下屬自主權可提高下屬的工作滿足感及提供實際的在職培訓機會（A、C）。\n錯誤分析：授權本身並不直接旨在「改善上司與下屬的關係」，在缺乏信任或溝通不暢時，甚至可能因監督或職權範圍不清而使上下級關係緊張。故選 B。",exEn:"B is correct: Delegation reduces a superior's routine workload, allowing them to focus on major strategic planning (D). Assigning responsibilities also enhances subordinates' job satisfaction and provides practical on-the-job training opportunities (A & C).\nError analysis: Delegation itself is not directly intended to 'improve the relationship between superiors and subordinates'. In fact, if not accompanied by proper trust or clear communication, it could lead to friction or conflict. Thus, B is not a direct benefit."},
{q:6,year:2021,y:2021,top:"[out c] 原始分錄帳簿及分類帳 —— 購貨帳戶的餘額核算",topEn:"[out c] Books of Original Entry —— Verifying Purchases Account Balances",outc:true,reason:"自 2025 年起，「原始分錄帳簿及分類帳（登帳、過帳與科目結平）」已全數移至選修部分（會計單元）第四章與第五章（Paper 2A）。",reasonEn:"Starting from 2025, bookkeeping transactions, ledgers posting, and accounts balancing are tested under Accounting Elective Module Paper 2A, Chapters 4 & 5.",cn:"2021年2月1日，李先生成立一家售賣電腦的零售商號。同日，該商號從供應商賒購十台電腦，每台成本$4500。在2月，這商號把兩台損壞的電腦退回供應商，並售出三台電腦，每台售價$7000。\n2021年2月28日，該商號購貨帳的結餘是多少？\nA. $22 500\nB. $31 500\nC. $36 000\nD. $45 000",en:"On 1 February 2021, Mr Lee set up a retail firm selling computers. On the same day, the firm purchased ten sets of computers on credit from a supplier at a cost of $4 500 each. During February, two sets of damaged computers were returned to the supplier and three sets of computers were sold at a selling price of $7 000 each.\nWhat is the balance of the purchases account of the firm as at 28 February 2021?\nA. $22 500\nB. $31 500\nC. $36 000\nD. $45 000",ans:"D",rate:"33%",exCn:"D 正確：在複式記帳體系下，「購貨帳（Purchases Account）」專門用於記錄當期買入貨物的原始進貨總額（記入借方）。\n2月1日賒購時分錄：借記「購貨」$45,000（10台 x $4,500）；貸記「應付貨款」$45,000。\n錯誤分析：退回2台損壞電腦給供應商，必須記入獨立的「購貨退出帳」，而非直接在購貨帳中扣減。售出3台電腦，應記入獨立的「銷貨帳」，不影響購貨帳戶的數據。因此，直到2月28日，該商號的「購貨帳結餘」依然保持原入帳金額 $45,000。",exEn:"D is correct: Under the double-entry bookkeeping system, the 'Purchases Account' is used exclusively to record the total cost of goods acquired for resale during the period (debited).\nEntry on 1 Feb: Debit 'Purchases' $45,000 (10 sets x $4,500) and Credit 'Trade Payables' $45,000.\nError analysis: Returning 2 damaged sets to the supplier must be recorded in the separate 'Returns Outwards Account', rather than directly deducting from the Purchases account. Selling 3 sets must be recorded in the separate 'Sales Account', which has no effect on the Purchases account. Thus, as at 28 February, the balance of the Purchases account remains unchanged at $45,000."},
{q:7,year:2021,y:2021,top:"營商環境 —— 影響商業決策的因素（法律因素）",topEn:"Business Environment —— PEEST Factors (Legal Factors)",cn:"下列哪項是影響一家香港餐館營運的法律因素？\n(1) 最低工資水平上調。\n(2) 因2019冠狀病毒病擴散，公眾地方羣組聚集的人數受到限制。\n(3) 消費物價指數下降。\nA. 只有(1)\nB. 只有(2)\nC. 只有(3)\nD. 只有(1)及(2)",en:"Which of the following is/are legal factor(s) affecting the operations of a restaurant in Hong Kong?\n(1) There is an increase in the minimum wage rate.\n(2) The number of people participating in group gatherings in any public places is restricted because of the spread of COVID-19.\n(3) There is a decrease in the Consumer Price Index.\nA. (1) only\nB. (2) only\nC. (3) only\nD. (1) and (2) only",ans:"D",rate:"63%",exCn:"D 正確：\n(1) 正確：最低工資法規調整，屬於政府法規限制，是直接的法律因素。\n(2) 正確：公眾限聚令是政府根據香港預防及控制疾病條例發布的法定衛生安全規管，對餐飲業具有強制約束力，屬於法律因素。\n(3) 錯誤：消費物價指數（CPI）下降，反映的是市場購買力與通貨緊縮，屬於經濟因素。\n綜上，只有(1)和(2)屬於法律因素，選 D。",exEn:"D is correct:\n(1) is correct: An increase in the minimum wage rate is determined by statutory employment legislation, which is a direct legal factor.\n(2) is correct: Restrictions on public group gatherings are legally binding orders issued by the government under public health laws, directly constraining restaurant capacity and operations.\n(3) is incorrect: A decrease in the Consumer Price Index (CPI) reflects purchasing power and deflationary trends, which are economic factors.\nTherefore, only (1) and (2) are legal factors. Thus, D is correct."},
{q:8,year:2021,y:2021,top:"基礎管理 —— 有效管理的原則（有效管理原則的特徵與應用）",topEn:"Basics of Management —— Principles of Effective Management",cn:"下列哪項有關有效管理原則所帶來的好處是正確的？\nA. 平衡職權和責任 —— 改善員工之間的溝通\nB. 分工 —— 減少生產延誤\nC. 統一命令 —— 減少工作混亂\nD. 目標管理 —— 減少行政工作",en:"Which of the following is/are the benefit(s) of effective management principles that is/are correct?\nA. Balancing authority and responsibility —— improves communication among employees\nB. Division of work —— reduces production delays\nC. Unity of command —— reduces work confusion\nD. Management by objectives —— reduces administrative work",ans:"C",rate:"78%",exCn:"C 正確：統一命令原則（Unity of Command）規定每位下屬在同一時間只能且必須直接聽命於一位上司，這樣可以完全避免多重指揮與矛盾指令，從而顯著「減少工作混亂」。\n其他選項分析：A 錯誤：平衡職權與責任主要能使下屬擁有相應權力以執行其所負責任，而非為改善員工溝通。B 錯誤：分工雖然能熟能生巧提升單人效率，但由於工序間相互依賴度極高，一旦某一環節停滯反而極易增加生產延誤。D 錯誤：目標管理在實際實施中需要上下級反覆討論、開會、撰寫反饋，通常會顯著「增加」而非減少行政工作。",exEn:"C is correct: The principle of Unity of Command states that an employee should receive orders from and report to only one direct superior. This eliminates conflicting instructions, thereby significantly reducing work confusion.\nAnalysis of other options: A is incorrect: Balancing authority and responsibility ensures employees have enough power to complete their assigned responsibilities; it is not meant for improving communication. B is incorrect: Although division of work increases individual speed, the high interdependency of tasks means any bottleneck could easily cascade and increase, rather than reduce, production delays. D is incorrect: Management by objectives (MBO) involves regular meetings, documentation, and continuous evaluations, which 'increases' (rather than reduces) administrative workload."},
{q:9,year:2021,y:2021,top:"[out c] 基礎財務會計 —— 基礎會計等式與期末資本額計算",topEn:"[out c] Double-entry Bookkeeping —— Accounting Equation and Capital Computation",outc:true,reason:"自 2025 年起，會計等式的計算與資產、負債、資本科目的分類判定，已全數移至選修部分（會計單元）第二章與第七章（Paper 2A）。",reasonEn:"Starting from 2025, accounting equations, assets and liabilities classifications, and balance sheet groupings are tested under Accounting Elective Module Paper 2A, Chapters 2 & 7.",cn:"2020年12月31日，李氏商號的所有帳戶結餘列示如下：\n* 應收帳款 $55 000； 銀行透支 $2 500； 存貨 $21 200； 貸款予陳先生 $18 000； 現金 $23 000； 應付帳款 $42 300； 設備 $121 000\n2020年12月31日資本帳的結餘是多少？\nA. $157 400\nB. $162 400\nC. $193 400\nD. $198 400",en:"The following balances as at 31 December 2020 were extracted from the accounts of Lee's firm:\n* Trade receivables $55 000; Bank overdraft $2 500; Inventory $21 200; Loan to Mr Chan $18 000; Cash $23 000; Trade payables $42 300; Equipment $121 000\nWhat is the balance of the capital account as at 31 December 2020?\nA. $157 400\nB. $162 400\nC. $193 400\nD. $198 400",ans:"C",rate:"55%",exCn:"C 正確：運用基本會計等式：資本 = 總資產 - 總負債\n資產項目：應收帳款 $55,000 + 存貨 $21,200 + 現金 $23,000 + 設備 $121,000 = $220,200。貸款予陳先生 $18,000 這是企業借款給他人，應列作「資產」。總資產 = $238,200。\n負債項目：應付帳款 $42,300 + 銀行透支 $2,500 = $44,800。\n資本 = $238,200 - $44,800 = $193,400。故選 C。",exEn:"C is correct: Apply the fundamental accounting equation: Capital = Total Assets - Total Liabilities.\nTotal Assets: Trade receivables $55,000 + Inventory $21,200 + Cash $23,000 + Equipment $121,000 + Loan to Mr Chan $18,000 = $238,200.\nTotal Liabilities: Trade payables $42,300 + Bank overdraft $2,500 = $44,800.\nCapital = $238,200 - $44,800 = $193,400. Thus, C is correct."},
{q:10,year:2021,y:2021,top:"基礎個人理財 —— 消費者信貸（銀行透支與私人貸款之對比）",topEn:"Basics of Personal Financial Management —— Consumer Credit (Overdraft vs. Personal Loan)",cn:"下列哪項是銀行透支與私人貸款的分別？\nA. 利率：透支較低/貸款較高\nB. 還款安排：透支靈活/貸款固定\nC. 預先批核信貸額：透支沒有/貸款有\nD. 每月最低還款額：透支有/貸款沒有",en:"Which of the following is a difference between a bank overdraft and a personal loan?\nA. interest rate: overdraft lower / loan higher\nB. repayment arrangement: overdraft flexible / loan fixed\nC. pre-approved credit limit: overdraft no / loan yes\nD. monthly minimum payment: overdraft yes / loan no",ans:"B",rate:"46%",exCn:"B 正確：銀行透支不設定固定的還款期與每期固定還款金額，客戶在有資金時可隨時存入款項清還，還款安排極其「靈活」；而私人分期貸款則有明確的貸款年期和固定的每月還款計劃。\n其他選項分析：A 錯誤：銀行透支本質上是高息無抵押信貸，其年利率通常顯著「高於」私人貸款。C 錯誤：銀行透支是銀行根據往來賬戶客戶的信用度「預先核批」的最高信用透支限額。D 錯誤：只有信用卡才有每月最低還款額的規定；透支與私人貸款均無此機制。",exEn:"B is correct: A bank overdraft does not have a fixed repayment schedule; borrowers can repay any amount at any time when they have funds, which is highly 'flexible'. A personal loan requires regular repayments on a 'fixed' schedule.\nAnalysis of other options: A is incorrect: Bank overdrafts are a form of high-interest unsecured borrowing; their annual interest rates are generally 'higher' than those of personal loans. C is incorrect: A bank overdraft limit is usually pre-approved by the bank for current account holders. D is incorrect: Only credit cards have a 'monthly minimum payment' mechanism."},
{q:11,year:2021,y:2021,top:"[out c] 不同企業擁有權類型的財務報告編製 —— 損益表（折讓與費用對毛利的影響）",topEn:"[out c] Trading Account —— Cost of Goods Sold and Gross Profit Components",outc:true,reason:"自 2025 年起，「損益表貿易部細項科目（如銷貨成本、毛利與營業費用的組成與推算）」已全數移至選修部分（會計單元）第七章（Paper 2A）。",reasonEn:"Starting from 2025, the detailed components and calculation of trading account items (COGS, gross profit vs. operating expenses) are tested under Accounting Elective Module Paper 2A, Chapter 7.",cn:"下列哪項會減少商號的毛利？\n(1) 提用貨品\n(2) 購貨運費增加\n(3) 電費增加\nA. 只有(1)\nB. 只有(2)\nC. 只有(3)\nD. 只有(1)及(2)",en:"Which of the following will reduce the gross profit of a firm?\n(1) drawing of goods\n(2) increase in carriage inwards\n(3) increase in electricity expenses\nA. (1) only\nB. (2) only\nC. (3) only\nD. (1) and (2) only",ans:"B",rate:"74%",exCn:"B 正確：\n(1) 錯誤：東主提用商品存貨自用，會計分錄為「借記：提用；貸記：購貨」。這會直接扣減當期購貨總額，降低銷貨成本，因而使毛利維持不變或增加。\n(2) 正確：購貨運費是直接計入「銷貨成本（COGS）」的進貨附加成本，購貨運費增加會直接拉高 COGS，從而導致毛利減少。\n(3) 錯誤：電費屬於日常運營的「營業費用」，在損益表中列在毛利之後。電費增加只會減少「淨利」，毛利則完全不受影響。故選 B。",exEn:"B is correct:\n(1) is incorrect: Drawing of goods reduces net purchases, which reduces COGS, meaning it will not decrease gross profit.\n(2) is correct: Carriage inwards is a direct cost of bringing inventory into the business. An increase in carriage inwards directly increases COGS, which in turn reduces gross profit.\n(3) is incorrect: Electricity is an operating expense listed below the gross profit line. An increase in electricity expenses only reduces net profit but has no effect on gross profit. Thus, B is correct."},
{q:12,year:2021,y:2021,top:"[out c] 營商環境 —— 企業擁有權類型（公營公司）",topEn:"[out c] Business Environment —— Forms of Business Ownership (Public Corporations)",outc:true,reason:"根據 2025 年及以後文憑試最新修訂之考核大綱，「公營公司（Public Corporation）」已被移出必修部分大綱，不再納入任何卷一的考核範圍。",reasonEn:"According to the latest curriculum guidelines for the 2025 HKDSE and beyond, the topic of 'Public Corporations' has been completely removed from the compulsory syllabus.",cn:"下列哪項是公營公司的特徵？\n(1) 政府參與日常營運。\n(2) 董事局主席由政府委任。\n(3) 它是獨立的法定個體。\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"Which of the following are the characteristics of a public corporation?\n(1) The government participates in its daily operations.\n(2) The chairperson of the board of directors is appointed by the government.\n(3) It is a separate legal entity.\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2), and (3)",ans:"C",rate:"69%",exCn:"C 正確：\n(1) 錯誤：在香港，公營公司依法實行商業化運作、自負盈虧。政府僅進行宏觀監管或政策指導，並不直接參與其日常具體營運。\n(2) 正確：公營公司的董事局主席及大多數董事會成員，依法均由政府直接進行指派或委任。\n(3) 正確：公營公司均依據專門條例成立，擁有獨立的法人地位，是一個獨立的法定個體。\n綜上，只有(2)和(3)為公營公司的特徵，選 C。",exEn:"C is correct:\n(1) is incorrect: In Hong Kong, public corporations are run on commercial principles and are financially self-sufficient. The government plays a supervisory role but does not participate in daily business operations.\n(2) is correct: The chairperson and directors of the board of a public corporation are legally appointed by the government.\n(3) is correct: Public corporations are established under specific ordinances and possess separate legal identity.\nTherefore, only (2) and (3) are correct. Thus, C is correct."},
{q:13,year:2021,y:2021,top:"[out c] 試算表 —— 試算表之功能與登帳原則",topEn:"[out c] Trial Balance —— Characteristics and Recording of a Trial Balance",outc:true,reason:"自 2025 年起，「試算表（Trial Balance）」的編製、科目借貸餘額歸納與限制，已全數移至選修部分（會計單元）第六章（Paper 2A）。",reasonEn:"Starting from 2025, the preparation, posting, and arithmetical checks of a trial balance are tested under Accounting Elective Module Paper 2A, Chapter 6.",cn:"下列哪項有關試算表的陳述是正確的？\n(1) 如試算表平衡，帳戶結餘沒有錯誤。\n(2) 試算表顯示商號所有帳戶的結餘。\n(3) 如帳戶的借方總額較貸方總額少，這帳戶的結餘會顯示在試算表的貸方欄。\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"Which of the following statements about a trial balance is/are correct?\n(1) If the trial balance balances, the account balances have no errors.\n(2) The trial balance shows the balances of all the accounts of the firm.\n(3) If the total debit of an account is less than the total credit, the balance of this account will be shown in the credit column of the trial balance.\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"D",rate:"36%",exCn:"D 正確：\n(1) 錯誤：試算表借貸金額平衡僅能檢視過帳時的「算術準確度」，不能保證沒有任何錯誤。\n(2) 正確：試算表的目的即是在特定日期將分類帳中所有具有期末餘額的帳戶進行彙總與陳列。\n(3) 正確：借方總額小於貸方總額，代表該帳戶具有「貸方結餘」，必然列在貸方金額欄。綜上，(2)和(3)正確，選 D。",exEn:"D is correct:\n(1) is incorrect: A balanced trial balance only proves arithmetical accuracy, not the absence of errors.\n(2) is correct: The trial balance summarizes and lists the balances of all active accounts in the ledger.\n(3) is correct: If the debit total is less than the credit total, it has a credit balance displayed in the credit column.\nTherefore, only (2) and (3) are correct. Thus, D is correct."},
{q:14,year:2021,y:2021,top:"基礎個人理財 —— 消費者信貸（個人信貸評級的影響因素）",topEn:"Basics of Personal Financial Management —— Consumer Credit (Factors Affecting Credit Rating)",cn:"下列哪項對個人的信貸評級有負面影響？\n(1) 有破產紀錄\n(2) 曾經沒有如期償還貸款\n(3) 失業超過一年\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"Which of the following has/have a negative impact on an individual's personal credit rating?\n(1) having a record of bankruptcy\n(2) failure to repay a loan on time in the past\n(3) being unemployed for more than 1 year\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"52%",exCn:"A 正確：\n(1) 正確：破產紀錄是信貸報告庫中權重極大且直接拉低信用評分的負面指標。\n(2) 正確：逾期未還款項直接反映借款人的違約風險，對信用評級有直接負面影響。\n(3) 錯誤：「失業」本身並不會記入個人信貸報告或被作為信用評級直接扣分的指標。故選 A。",exEn:"A is correct:\n(1) is correct: Bankruptcy records are critical negative indicators that lower credit scores.\n(2) is correct: Past payment history directly reflects default risk and adversely affects credit rating.\n(3) is incorrect: Unemployment itself is not tracked by credit bureaus as a score-deducting factor.\nTherefore, only (1) and (2) are correct. Thus, A is correct."},
{q:15,year:2021,y:2021,top:"[out c] 不同企業擁有權類型的財務報告編製 —— 財務狀況表（資產排列與特徵）",topEn:"[out c] SFP and Income Statement —— Presentation of SFP Items",outc:true,reason:"自 2025 年起，「財務狀況表（Balance Sheet / Statement of Financial Position）」的資產結構、比率交叉分析，已被全數移至選修部分（會計單元）第七章及二十一章（Paper 2A）。",reasonEn:"Starting from 2025, the structure of the Balance Sheet (SFP) and detailed liquidity ratios evaluation are tested in Accounting Elective Module Paper 2A, Chapters 7 & 21.",cn:"下列哪項有關財務狀況表的陳述是正確的？\n(1) 它顯示商號的變現能力。\n(2) 非流動資產按其總額由大至小排列。\n(3) 它顯示商號某段時間的財務狀況。\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"Which of the following about the statement of financial position is/are correct?\n(1) It reveals the liquidity of a firm.\n(2) Non-current assets are listed according to their total amounts in descending order.\n(3) It reveals the financial status of a firm for a period of time.\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"A",rate:"22%",exCn:"A 正確：\n(1) 正確：財務狀況表羅列了流動資產與流動負債，能直接評估商號的短期變現能力。\n(2) 錯誤：非流動資產在財務狀況表上的編排順序是根據其「永久性/變現難易度」由低至高排列，與資產金額無關。\n(3) 錯誤：財務狀況表展示的是商號在「特定某一時點」的靜態財政狀況；反映「某一段時期」營運表現的是損益表。故選 A。",exEn:"A is correct:\n(1) is correct: By listing current assets and current liabilities, the SFP enables users to evaluate liquidity.\n(2) is incorrect: Non-current assets are listed in order of 'permanence' or 'liquidity', not by dollar amounts.\n(3) is incorrect: The SFP shows financial status as at a 'specific point in time', whereas the income statement displays performance over a 'period of time'.\nTherefore, only (1) is correct. Thus, A is correct."},
{q:16,year:2021,y:2021,top:"營商環境 —— 商業道德及社會責任（履行社會責任的方式）",topEn:"Business Environment —— Business Ethics & Social Responsibilities (Practising Social Responsibility)",cn:"下列哪家商號在2019冠狀病毒病擴散下向持份者履行社會責任？\n(1) 一家室內設計公司容許僱員在家工作。\n(2) 一家餐館向堂食顧客提供折扣。\n(3) 一家出版社讓公眾經互聯網免費閱讀其書本。\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"Which of the following firms are fulfilling their social responsibility towards stakeholders during the spread of COVID-19?\n(1) An interior design company which allows its employees to work from home.\n(2) A restaurant which offers discounts to dine-in customers.\n(3) A publisher which allows the public to read its books online free of charge.\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"70%",exCn:"B 正確：\n(1) 正確：疫情期間允許員工在家工作，能直接保護「僱員」這一核心持份者的生命健康安全。\n(2) 錯誤：餐館向堂食顧客提供折扣，本質上是以增加客流為目的之日常價格促銷手段，不能視為履行社會責任。\n(3) 正確：出版社主動向公眾「免費開放電子書籍」，為學生與市民提供教育與學習資源。故選 B。",exEn:"B is correct:\n(1) is correct: Allowing employees to work from home directly protects employees (a core stakeholder group).\n(2) is incorrect: Offering discounts is a standard promotional strategy, not a CSR action.\n(3) is correct: Providing free online access to books supports the education and well-being of the general public.\nTherefore, only (1) and (3) are correct. Thus, B is correct."},
{q:17,year:2021,y:2021,top:"基礎管理 —— 管理功能（計劃：良好目標的 SMART 準則）",topEn:"Basics of Management —— Management Functions (Planning: SMART Objectives)",cn:"一家新成立的電動車製造商設定目標如下：\n「我們將在下年度成為電動車市場的領導者。」\n這目標符合以下哪項良好目標的準則？\n(1) 具體的\n(2) 具時限的\n(3) 可量度的\nA. 只有(1)\nB. 只有(2)\nC. 只有(3)\nD. 只有(1)及(2)",en:"A newly-established electric car manufacturer sets the following target:\n'We shall become the leader in the electric car market next year.'\nWhich of the following criteria for good objectives is/are fulfilled in the target?\n(1) specific\n(2) time-bound\n(3) measurable\nA. (1) only\nB. (2) only\nC. (3) only\nD. (1) and (2) only",ans:"B",rate:"55%",exCn:"B 正確：\n(1) 不符合：「市場領導者」一詞十分含糊，因此不夠具體。\n(2) 符合：目標明確約定了達成的時間界限為「下年度」，符合具時限的要求。\n(3) 不符合：目標中未列示任何可以供後期比對測量的百分比或具體數據。綜上，只有(2)符合要求，選 B。",exEn:"B is correct:\n(1) is unfulfilled: The term 'market leader' is highly ambiguous, thus not specific.\n(2) is fulfilled: The objective specifies 'next year', satisfying the time-bound criterion.\n(3) is unfulfilled: There are no numerical metrics stated, making it not measurable.\nTherefore, only (2) is correct. Thus, B is correct."},
{q:18,year:2021,y:2021,top:"[out c] 基礎會計 —— 會計假設、原則與資產計量（繼續經營假設）",topEn:"[out c] Accounting Assumptions —— Going Concern Assumption",outc:true,reason:"自 2025 年起，「會計假設、原則及慣例（一貫性、歷史成本、繼續經營等假設在特定情境下的套用）」已全數移至選修部分（會計單元）第二十三章（Paper 2A）。",reasonEn:"Starting from 2025, accounting assumptions and conventions (practical scenarios of going concern, prudence, accrual etc.) are tested under Accounting Elective Module Paper 2A, Chapter 23.",cn:"2020年12月31日，新輝公司決定於三個月後結束營業。同日，它的非流動資產記錄為，而其清算值則為。\n根據________，新輝公司2020年12月31日的財務狀況表中，非流動資產的計值應為________\nA. 繼續經營假設.................. \nB. 繼續經營假設.................. \nC. 歷史成本概念.................. \nD. 歷史成本概念.................. ",en:"On 31 December 2020, Sunview Company decided to close the business three months later. On that date, its non-current assets were recorded at  800 000 and its liquidation value was  098 000.\nAccording to the ________, the value of the non-current assets shown in the statement of financial position of Sunview Company as at 31 December 2020 should be ________.\nA. going concern assumption ......  098 000\nB. going concern assumption ......  800 000\nC. historical cost concept ..........  098 000\nD. historical cost concept ..........  800 000",ans:"A",rate:"55%",exCn:"A 正確：繼續經營假設指出，除非有相反證據，否則假定企業在可見的未來會無限期持續營運下去。當企業已正式做出決定即將在短期內結束營業時，繼續經營假設隨即宣告失效。資產必須按其清算值列報。故選 A。",exEn:"A is correct: The Going Concern Assumption states that an entity is assumed to continue its operations for the foreseeable future. When a business has decided to discontinue operations in the near future, this assumption is no longer valid. Assets must be valued at their liquidation value. Thus, A is correct."},
{q:19,year:2021,y:2021,top:"營商環境 —— 商業道德及社會責任（道德守則之主要功能）",topEn:"Business Environment —— Business Ethics (Importance of Code of Ethics)",cn:"企業編製道德守則的主要原因是甚麼？\nA. 法例規定\nB. 可以降低生產成本\nC. 可以改善公司的形象,賺取最高利潤\nD. 為僱員提供規則和標準",en:"What is the main reason for a business to compile a code of ethics?\nA. This is required by law.\nB. This could reduce the cost of production.\nC. This could improve the firm's image and maximise its profit.\nD. This provides rules and standards for employees.",ans:"D",rate:"42%",exCn:"D 正確：企業編製內部道德守則的最核心目的與功能，在於為內部所有管理層及全體僱員提供一套明確、可遵循的職業行為標準、倫理準則與操作規則，以防微杜漸，指導其日常商業決策。\n其他選項分析：香港並無任何強制性法律要求普通企業編製道德守則（排除 A）；降低成本和賺取最高利潤是企業的純財務/經營目標（排除 B、C）。",exEn:"D is correct: The primary and core purpose of compiling a code of ethics is to provide explicit rules, ethical standards, and behavioral guidelines for employees.\nAnalysis of other options: Compiling a code of ethics is voluntary in Hong Kong (excludes A); reducing costs and maximizing profits are general financial objectives (excludes B and C)."},
{q:20,year:2021,y:2021,top:"基礎個人理財 —— 強制性公積金（強積金）制度下的權益和責任",topEn:"Basics of Personal Financial Management —— MPF Scheme (Rights & Responsibilities)",cn:"下列哪項有關強制性公積金（強積金）制度的陳述是正確的？\n(1) 僱員可在強制供款以外，向強積金計劃作出自願性供款。\n(2) 林先生是一名的士司機，現年68歲，月入，他須向強積金計劃每月供款。\n(3) 陳先生是一名自僱小販，去年淨收入為，他須向強積金計劃供款。\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"Which of the following statements about the Mandatory Provident Fund (MPF) System is/are correct?\n(1) Employees can make voluntary contributions in addition to mandatory contributions to the MPF scheme.\n(2) Mr Lam is a 68-year-old taxi driver with a monthly income of  000. He is required to contribute  each month to the MPF scheme.\n(3) Mr Chan is a self-employed hawker who earned a net income of  000 last year. He was required to contribute  000 to the MPF scheme.\nA. (1) only\nB. (1) and (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"A",rate:"65%",exCn:"A 正確：\n(1) 正確：強積金成員完全可以在法定 5% 的強制性供款之外，自行決定作額外的自願性供款。\n(2) 錯誤：強積金強制供款年齡範圍為 18 至 65 歲。的士司機林先生已 68 歲，依法毋須也無法作強制供款。\n(3) 錯誤：強積金條例明確豁免了「持牌自僱小販」。陳先生依法屬於完全免除強制登記和供款的豁免人士。故選 A。",exEn:"A is correct:\n(1) is correct: MPF scheme members can choose to make extra voluntary contributions on top of their regular 5% mandatory contributions.\n(2) is incorrect: The statutory age range for mandatory MPF contributions is 18 to 65. Since Mr. Lam is 68, he is not required to contribute.\n(3) is incorrect: Under the MPF Ordinance, 'licensed self-employed hawkers' are exempt persons.\nIn conclusion, only (1) is correct. Thus, A is correct."},
{q:21,year:2021,y:2021,top:"中小型企業 —— 香港中小型企業的特徵與界定",topEn:"Basics of Management —— Small and Medium Enterprises (Characteristics)",cn:"下列哪項有關香港中小型企業（中小企）的陳述是正確的？\nA. 中小企的規模較細,未能實行分工。\nB. 東主承擔有限債務責任。\nC. 大多數中小企從事次級產業。\nD. 聘用少於50名員工的非製造業公司屬中小企。",en:"Which of the following statements about small and medium enterprises (SMEs) in Hong Kong is correct?\nA. The scale of an SME is so small that it cannot practise division of work.\nB. The owners enjoy limited liability.\nC. Most of them are engaged in secondary industries.\nD. Enterprises in the non-manufacturing sector with fewer than 50 employees are SMEs.",ans:"D",rate:"78%",exCn:"D 正確：\nA 錯誤：中小企在日常運作中依然廣泛實行基本的分工。\nB 錯誤：香港多數中小企是由「獨資」或「合夥」形式組建而成，東主對債務均須承擔「無限責任」。\nC 錯誤：香港是服務型經濟，高達 90% 以上的中小企均專注於第三級產業（服務業）。\nD 正確：根據香港特區政府的官方定義，在香港僱用「少於 50 名員工的非製造業公司」即屬於中小型企業。",exEn:"D is correct:\nA is incorrect: Basic division of work can still be and is commonly practiced in SMEs.\nB is incorrect: Many SMEs in Hong Kong are formed as 'sole proprietorships' or 'partnerships', under which owners bear 'unlimited liability'.\nC is incorrect: Hong Kong is a service-based economy; more than 90% of local SMEs are engaged in the tertiary sector.\nD is correct: According to the official definition of the HKSAR Government, any non-manufacturing enterprise employing fewer than 50 employees is classified as an SME."},
{q:22,year:2021,y:2021,top:"[out c] 財務報表分析 —— 盈利能力（費用與淨利率分析）",topEn:"[out c] Financial Ratio Analysis —— Profitability and Expense Ratios",outc:true,reason:"自 2025 年起，「會計比率的公式核算（如毛利率、淨利率、ROCE、費用控制分析等）」已被全數移至選修部分（會計單元）第二十一章（Paper 2A）。",reasonEn:"Starting from 2025, accounting ratios formulas, computations (gross profit, net profit margins, expense control, etc.) are tested in the Accounting Elective Module Paper 2A, Chapter 21.",cn:"順記與錦記 2020 數據如下：\n* 順記：銷貨 ,800M，銷貨成本 ,400M，營業費用 ,800M\n* 錦記：銷貨 ,000M，銷貨成本 ,600M，營業費用 ,800M\n按照上述資料，下列哪項陳述是正確的？\nA. 錦記的毛利較低。\nB. 錦記的運用資金報酬率較高。\nC. 錦記在控制營業費用的表現較佳。\nD. 錦記的淨利率較低。",en:"Information about Shun Kee and Kam Kee for the year ended 31 December 2020 is shown below:\n* Shun Kee: Sales  800M | Cost of goods sold  400M | Operating expenses  800M\n* Kam Kee: Sales  000M | Cost of goods sold  600M | Operating expenses  800M\nAccording to the above information, which of the following is correct?\nA. Kam Kee has a lower gross profit.\nB. Kam Kee has a higher return on capital employed.\nC. Kam Kee has better control over operating expenses.\nD. Kam Kee has a lower net profit ratio.",ans:"D",rate:"80%",exCn:"D 正確：\n毛利 = 銷貨 - 銷貨成本。順記毛利 = ,400M；錦記毛利 = ,400M。錦記毛利更高（排除 A）。\n營業費用率 = 營業費用 / 銷貨。順記 = 31.82%；錦記 = 65.33%。錦記控制表現較差（排除 C）。\n淨利率 = 淨利 / 銷貨。順記 = 40.91%；錦記 = 17.33%。錦記淨利率顯著低於順記，D 正確。\n因缺乏運用資金數據，無法計算 ROCE，排除 B。",exEn:"D is correct:\nGross Profit: Shun Kee ,400M; Kam Kee ,400M. Kam Kee's is higher (A is incorrect).\nOperating Expense Ratio: Shun Kee 31.82%; Kam Kee 65.33%. Kam Kee has poor cost control (C is incorrect).\nNet Profit Ratio: Shun Kee 40.91%; Kam Kee 17.33%. Kam Kee has a much lower net profit ratio. Thus, D is correct.\nNote: ROCE cannot be determined due to absence of capital employed figures (B is incorrect)."},
{q:23,year:2021,y:2021,top:"基礎個人理財 —— 策劃個人理財及投資（金融產品特徵：債券與股票）",topEn:"Basics of Personal Financial Management —— Personal Financial Planning & Investment (Bonds vs. Stocks)",cn:"下列哪項有關債券的陳述是正確的？\n(1) 承擔風險能力較低的投資者通常偏向投資債券多於股票。\n(2) 如市場利率上升,債券持有人會收取較高利息。\n(3) 債券持有人可於到期日取回本金。\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"Which of the following statements about a bond is correct?\n(1) Investors who have lower risk tolerance usually prefer to invest in bonds rather than stocks.\n(2) If the market interest rate increases, the bondholder will receive a higher interest payment.\n(3) A bondholder can get back the principal on the maturity date.\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"67%",exCn:"B 正確：\n(1) 正確：債券具有固定利息及到期收回本金的特徵，風險遠低於股票，極其適合低風險承受能力的保守型投資者。\n(2) 錯誤：普通債券在發行時其票面年利率就已固定。即使市場利率上升，債券持有人每期能獲得的利息金額依然固定不變。\n(3) 正確：在債券到期日，只要發行人沒有清盤違約，債券持有人有法定合約權利全額按面值取回原始投資本金。故選 B。",exEn:"B is correct:\n(1) is correct: Bonds offer stable interest payments and principal safety at maturity, with significantly lower risk than stocks.\n(2) is incorrect: For fixed-rate bonds, the coupon rate is fixed at issuance. Even if market interest rates increase, the coupon payment remains unchanged.\n(3) is correct: At maturity, bondholders have a legal right to receive the full principal from the issuer.\nTherefore, only (1) and (3) are correct. Thus, B is correct."},
{q:24,year:2021,y:2021,top:"營商環境 —— 香港經濟發展近況（全球一體化的影響）",topEn:"Business Environment —— Recent Developments of Hong Kong Economy (Impacts of Globalisation)",cn:"下列哪項是全球一體化對香港的好處？\n(1) 較易從海外招聘專家\n(2) 較便宜的原料供應\n(3) 減少企業之間的競爭\nA. 只有(1)\nB. 只有(2)\nC. 只有(3)\nD. 只有(1)及(2)",en:"Which of the following is/are benefit(s) to Hong Kong brought about by globalisation?\n(1) easier to recruit experts from overseas\n(2) cheaper supplies of materials\n(3) reduce competition among firms\nA. (1) only\nB. (2) only\nC. (3) only\nD. (1) and (2) only",ans:"D",rate:"78%",exCn:"D 正確：\n(1) 正確：全球一體化加強了跨國人才的國際流動，使香港企業更易跨國招攬外國頂尖專家。\n(2) 正確：全球化促進了國際貿易壁壘降低，企業可開展全球採購，從全球各國尋求更便宜的原材料供應。\n(3) 錯誤：全球一體化打破了地區市場限制，反而會大幅加劇本地企業與海外企業之間的激烈競爭。故選 D。",exEn:"D is correct:\n(1) is correct: Globalisation enhances international mobility of talent, making it easier for HK firms to recruit experts from overseas.\n(2) is correct: Globalisation facilitates global sourcing, allowing firms to purchase cheaper raw materials globally.\n(3) is incorrect: Globalisation breaks down regional market barriers, significantly increasing rather than reducing competition.\nTherefore, only (1) and (2) are correct. Thus, D is correct."},
{q:25,year:2021,y:2021,top:"基礎管理 —— 管理功能（計劃的功能與基本步驟）",topEn:"Basics of Management —— Management Functions (Planning Process Steps)",cn:"一家工廠的生產經理決定在2021年底前生產1000件貨品。他已安排生產日程，並調配所需資源及人手。在計劃過程中，下一個步驟是什麼？\nA. 評估可行方案\nB. 制訂行動方案\nC. 執行行動方案\nD. 設定目標",en:"The production manager of a factory decided to produce 1 000 units of products by the end of 2021. He has arranged the production schedule and deployed the necessary resources and manpower. Which step in the planning process will be undergone next?\nA. evaluate alternatives\nB. formulate the action plan\nC. implement the action plan\nD. set the goal",ans:"C",rate:"55%",exCn:"C 正確：管理的計劃過程包含五個核心步驟：\n1. 設定目標（已完成）。\n2. 分析目前環境及預測未來狀況。\n3. 制定各種可行方案並進行評估。\n4. 選擇最優方案並制訂具體行動方案（已完成）。\n5. 執行行動方案：將上述計劃付諸日常具體生產運作中。故選 C。",exEn:"C is correct: The planning process consists of five sequential steps:\n1. Set the goals (completed).\n2. Analyze the current situation and forecast future conditions.\n3. Develop alternative courses of action and evaluate them.\n4. Select the best course and formulate the action plan (completed).\n5. Implement the action plan: Putting the plan into daily operational activities. Thus, C is correct."},
{q:26,year:2021,y:2021,top:"[out c] 複式記帳法 —— 商業交易在分類帳帳戶的借貸記錄",topEn:"[out c] Double-entry Bookkeeping —— Verifying Double Entries in Ledger Accounts",outc:true,reason:"自 2025 年起，「複式記帳原則（Double-entry Bookkeeping）」分類帳戶之借貸方向判定、過帳科目編製，已全數移至選修部分（會計單元）第三章（Paper 2A）。",reasonEn:"Starting from 2025, the fundamental rules and applications of double-entry bookkeeping are tested in the Accounting Elective Module Paper 2A, Chapter 3.",cn:"下列哪項複式記帳是正確的？\n(1) 以支票向銀光公司購置一輛汽車：借記 汽車 ； 貸記 銀光公司\n(2) 從梁先生收取佣金支票：借記 銀行存款 ； 貸記 佣金收益\n(3) 東主以其個人支票支付商號的租金費用：借記 租金費用 ； 貸記 資本\nA. 只有(1)\nB. 只有(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"Which of the following double entries is/are correct?\n(1) Purchased a motor van by cheque from Silver Company | Account to be debited: Motor vans | Account to be credited: Silver Company\n(2) Received commission by cheque from Mr Leung | Account to be debited: Bank | Account to be credited: Commission income\n(3) The owner paid the rental expenses of the firm with his personal cheque | Account to be debited: Rental expenses | Account to be credited: Capital\nA. (1) only\nB. (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"60%",exCn:"C 正確：\n(1) 錯誤：以支票購車代表銀行存款減少，正確分錄應為：「借記：汽車（資產增加）；貸記：銀行存款（資產減少）」。只有賒購時貸方才是「銀光公司」。\n(2) 正確：收取佣金支票，銀行存款增加（借記「銀行存款」），佣金收益增加（貸記「佣金收益」），正確。\n(3) 正確：東主以個人支票代商號支付租金，商號費用增加（借記「租金費用」），同時等同於東主向商號注入資本（貸記「資本」），正確。故選 C。",exEn:"C is correct:\n(1) is incorrect: Purchasing by cheque means bank is paid. The correct entry should be: Debit Motor vans, Credit Bank. Crediting Silver Company is only appropriate for credit purchases.\n(2) is correct: Receiving commission by cheque increases bank assets (Debit: Bank) and increases commission revenue (Credit: Commission income).\n(3) is correct: The owner paying rent with a personal cheque means firm incurs rent expense (Debit: Rental expenses) and has equity injection (Credit: Capital).\nIn conclusion, only (2) and (3) are correct. Thus, C is correct."},
{q:27,year:2021,y:2021,top:"基礎個人理財 —— 策劃個人理財及投資（理財及金融產品特徵：風險與回報）",topEn:"Basics of Personal Financial Management —— Personal Financial Planning & Investment (Bonds vs. Stocks)",cn:"彭力剛剛退休。他欲以公積金作投資，賺取穩定的收益。下列哪項投資工具最適合他？\nA. 恆生指數成分股\nB. 在GEM上市的股票\nC. 定期存款\nD. 儲蓄存款",en:"Ben has just retired. He wants to invest his provident fund to earn a stable income. Which of the following financial instruments is most suitable to him?\nA. constituent stocks of the Hang Seng Index\nB. stocks listed on GEM\nC. term deposits\nD. savings deposits",ans:"C",rate:"48%",exCn:"C 正確：彭力剛退休，追求的主要目標是「保證本金安全」及「獲得穩定的中高息回報」。\nA、B 錯誤：恆指成分股及 GEM 股票價格波動極大，存在嚴重的本金虧損風險。\nD 錯誤：儲蓄存款雖然極其安全，但其利率過低，難以提供令人滿意的穩定投資收益。\nC 正確：定期存款由商業銀行保證本金安全，且在約定期內鎖定優於普通儲蓄的固定高利息回報，最切合退休期穩健理財的需求。",exEn:"C is correct: Ben has just retired, meaning his risk tolerance is low. His primary objectives are capital preservation and stable, attractive returns.\nA and B are incorrect: Blue-chip stocks and GEM stocks carry high price volatility and capital loss risks.\nD is incorrect: Savings deposits are safe, but their interest yield is too low.\nC is correct: Term deposits provide guaranteed principal safety and secure a fixed, relatively high interest yield, perfectly satisfying Ben's retirement need."},
{q:28,year:2021,y:2021,top:"基礎管理 —— 主要商業功能之角色（資訊管理經理的職掌）",topEn:"Basics of Management —— Key Business Functions (Role of Information Management)",cn:"一家內地凍肉食品公司擬在香港開設分店。下列哪項是公司資訊管理經理可給予市場營銷經理的支援？\n(1) 處理有關香港凍肉食品市場的數據\n(2) 蒐集冷藏系統供應商的資料\n(3) 建立銷售人員的薪酬制度\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"A Mainland frozen food company plans to establish a branch in Hong Kong. Which of the following is/are the support provided by the company's information manager to the marketing manager?\n(1) process data about the frozen food market in Hong Kong\n(2) collect information about suppliers of freezing systems\n(3) set up a salary scheme for the salespersons\nA. (1) only\nB. (1) and (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"28%",exCn:"A 正確：\n(1) 正確：處理、分析和有系統地組織市場調研數據，是資訊管理部門為市場營銷經理決策提供的核心系統性支援。\n(2) 錯誤：蒐集「冷藏系統設備供應商」的資料，是輔助生產和倉庫裝備的採購，屬於營運管理的職責。\n(3) 錯誤：建立銷售團隊員工的薪酬與提成制度，是人力資源管理及財務部的核心工作。故選 A。",exEn:"A is correct:\n(1) is correct: Processing and analyzing market survey data is a core data-support function of the information management department to assist marketing managers.\n(2) is incorrect: Collecting information about freezing system suppliers falls under operations management.\n(3) is incorrect: Designing salary schemes falls under human resources management.\nTherefore, only (1) is correct. Thus, A is correct."},
{q:29,year:2021,y:2021,top:"[out c] 原始分錄帳簿及分類帳 —— 分類帳帳戶的類別（實帳戶的判定）",topEn:"[out c] Books of Original Entry and Ledgers —— Classification of Ledger Accounts",outc:true,reason:"自 2025 年起，「原始分錄帳簿與分類帳類別（實虛帳戶的分類定義、結轉分錄）」已全數移至選修部分（會計單元）第三章（Paper 2A）。",reasonEn:"Starting from 2025, the classification and bookkeeping properties of ledger accounts (real vs. nominal accounts) are tested in the Accounting Elective Module Paper 2A, Chapter 3.",cn:"下列哪項是實帳戶的例子？\nA. 購貨帳\nB. 應收貨款帳\nC. 銷貨折扣帳\nD. 電費帳",en:"Which of the following is an example of a real account?\nA. purchases account\nB. trade receivables account\nC. discounts allowed account\nD. electricity expenses account",ans:"B",rate:"67%",exCn:"B 正確：在複式記帳的帳戶分類中：\n實帳戶（Real Accounts / Permanent Accounts）：指記錄資產、負債和東主權益的帳戶。其期末餘額不予結平，而是直接轉入下一個會計期初。應收貨款帳屬於流動資產，是典型的實帳戶。\n虛帳戶（Nominal Accounts / Temporary Accounts）：指記錄所有收入、費用和損失的帳戶。購貨、銷貨折扣和電費帳皆屬於損益類科目，為虛帳戶。",exEn:"B is correct: In the classification of ledger accounts under double-entry bookkeeping:\nReal Accounts (Permanent Accounts) are those recording assets, liabilities, and owner's equity. Their balances do not close at the end of the year. Trade receivables account is a current asset account, making it a real account.\nNominal Accounts (Temporary Accounts) are those recording revenues, expenses, and losses. Purchases, discounts allowed, and electricity expenses are P&L items, making them nominal accounts."},
{q:30,year:2021,y:2021,top:"基礎個人理財 —— 金錢的時間值（名義回報率與實際回報率之辨析）",topEn:"Basics of Personal Financial Management —— Time Value of Money (Nominal vs. Effective Rates)",cn:"假如某投資項目的利息每半年以複息計算，下列哪項有關該項目名義回報率與實際回報率的陳述是正確的？\n(1) 該項目的實際回報率較其名義回報率高。\n(2) 如該項目的利息改為每季以複息計算，實際回報率會更高。\n(3) 如投資金額降低，該項目的實際回報率亦會降低。\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"Assuming the interest on an investment project is compounded semi-annually, which of the following statements about its nominal rate of return and effective rate of return are correct?\n(1) The effective rate of return of the project is higher than its nominal rate of return.\n(2) The effective rate of return of the project will be higher if its interest is compounded quarterly instead.\n(3) The effective rate of return of the project will be lower if the investment amount is lower.\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"56%",exCn:"A 正確：\n(1) 正確：實際年回報率公式為 EAR = (1 + r/m)^m - 1。當計息頻率 m 多於每年一次（此處每半年計息，m=2），利滾利產生的利息會使實際年回報率高於名義年利率。\n(2) 正確：當複利計息頻率增加（如由每半年計息改為每季複利，m 從 2 增加到 4），複利的增量效應會進一步拉高實際年回報率。\n(3) 錯誤：實際年回報率是一個純比例（百分比）利率指標，其大小完全取決於名義年利率與計息頻率，與投資的本金大小完全無關。故選 A。",exEn:"A is correct:\n(1) is correct: The Effective Annual Rate formula is EAR = (1 + r/m)^m - 1. When compounding frequency m is greater than once a year (m=2 for semi-annual), the interest-on-interest compounding effect ensures the effective rate is higher than the nominal rate.\n(2) is correct: As the frequency of compounding increases (from semi-annually to quarterly, m increases from 2 to 4), the compounding effect is amplified, resulting in a higher effective rate.\n(3) is incorrect: The effective rate of return is a pure percentage metric, completely independent of the investment principal amount.\nTherefore, only (1) and (2) are correct. Thus, A is correct."},
{q:1,year:2022,y:2022,top:"營商環境 —— 香港的營商環境與特徵",topEn:"Business Environment —— Hong Kong's Business Environment & Characteristics",cn:"1. 下列哪項有關香港營商環境的陳述是正確的？\n(1) 香港是亞太區經濟合作組織及世界貿易組織的成員。\n(2) 香港的本地生產總值主要來自第二級產業。\n(3) 在香港賺取利潤的企業須繳納薪俸稅。\nA. 只有(1)\nB. 只有(2)\nC. 只有(3)\nD. 只有(1)及(2)",en:"1. Which of the following statements about Hong Kong business environment is/are correct?\n(1) Hong Kong is a member of the Asia-Pacific Economic Cooperation and the World Trade Organization.\n(2) The secondary industry contributes to a major part of the Gross Domestic Product of Hong Kong.\n(3) Businesses which make profits in Hong Kong are subject to salary tax.\nA. (1) only\nB. (2) only\nC. (3) only\nD. (1) and (2) only",ans:"A",rate:"76%",exCn:"1. (1) 正確：香港是亞太區經濟合作組織（APEC）和世界貿易組織（WTO）的正式成員。\n2. (2) 錯誤：香港是高度發達的服務業經濟體，其本地生產總值（GDP）有 90% 以上主要來自第三級產業（服務業），而非第二級產業。\n3. (3) 錯誤：在香港賺取利潤的企業須繳納的是利得稅（Profits Tax）；薪俸稅（Salaries Tax）是針對個人受僱薪金所得徵收的。\n故選 A。",exEn:"1. (1) is correct: Hong Kong is a full member of both APEC and WTO.\n2. (2) is incorrect: Hong Kong's GDP is over 90% from the tertiary sector, not the secondary sector.\n3. (3) is incorrect: Businesses earning profits in Hong Kong are subject to Profits Tax, not salary tax.\nHence, option A is correct."},
{q:2,year:2022,y:2022,top:"中小型企業 —— 香港中小型企業的特徵與定義",topEn:"Small and Medium Enterprises —— Characteristics and Definition of SMEs in Hong Kong",cn:"2. 下列哪項有關本港中小型企業（中小企）的陳述是正確的？\n(1) 大多數中小企均從事進出口貿易及批發行業。\n(2) 資產總值低於一百萬元的企業屬中小企。\n(3) 中小企聘用了大約90%的勞動人口。\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"2. Which of the following statements about small and medium enterprises (SMEs) in Hong Kong is/are correct?\n(1) Most of them are engaging in the import/export trade and wholesale industries.\n(2) An enterprise with total asset value under $1 million is an SME.\n(3) SMEs employ about 90% of the working population.\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"A",rate:"35%",exCn:"1. (1) 正確：香港絕大多數中小型企業皆從事第三級產業（服務業），其中以從事進出口貿易、批發及零售業的中小企佔比最高。\n2. (2) 錯誤：在香港，中小型企業的定義並非按其資產總值劃分，而是按其僱員人數來界定（製造業僱用少於 100 人；非製造業/服務業僱用少於 50 人）。\n3. (3) 錯誤：根據統計，香港中小企聘用了本港大約 45% 的私營機構勞動人口，而非大約 90%。\n故選 A。",exEn:"1. (1) is correct: The vast majority of SMEs in Hong Kong operate in the tertiary (service) sector, with the largest share engaged in import/export trade.\n2. (2) is incorrect: SMEs in Hong Kong are defined by number of employees, not total asset value.\n3. (3) is incorrect: SMEs employ around 45% of the private sector workforce, not 90%.\nHence, option A is correct."},
{q:3,year:2022,y:2022,top:"[out c] 會計的目的及角色 —— 會計功能（歸納與溝通）",topEn:"[out c] Purpose and Role of Accounting —— Accounting Functions (Summarising and Communicating)",outc:true,reason:"自 2025 年文憑試起，「基礎財務會計：會計的功能（記錄、分類、歸納和溝通）」已從卷一必修完全移往選修部分（會計單元）第一章（Paper 2A）。",reasonEn:"Starting from 2025, the fundamental accounting functions (recording, classifying, summarising, communicating) are completely removed from Paper 1 and are now tested in Elective Module Paper 2A.",cn:"3. 一家商號的會計文員正編製試算表和財務報表，其後會向經理呈交相關資訊。上述情況屬於哪項會計功能？\n(1) 溝通\n(2) 記錄\n(3) 歸納\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"3. An accounts clerk at a firm is preparing the trial balance and the financial statements, he will then submit relevant information to the manager. Which accounting function(s) is/are performed in the situation above?\n(1) communicating\n(2) recording\n(3) summarising\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"C",rate:"43%",exCn:"1. (1) 和 (3) 正確（即 C 正確）：\n- (3) 歸納：將日常分類帳各科目的餘額進行彙總並編製成「試算表」和「財務報表」，這是典型的歸納（Summarising）過程。\n- (1) 溝通：將編製好的財務會計報表資訊向經理提交，屬於會計的溝通（Communicating）功能。\n- (2) 記錄：記錄是指原始的日記分錄登帳，不符合本案後期編表及呈交的描述。",exEn:"1. (1) and (3) are correct (C is correct):\n- (3) Summarising: Preparing the trial balance and financial statements from ledger balances is the summarising function.\n- (1) Communicating: Submitting the prepared financial reports to managers is the communicating function.\n- (2) Recording: Recording refers to initial bookkeeping of transactions in journals, which does not apply here."},
