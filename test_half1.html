<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body><div id="out">Testing half1...</div><script>var o=document.getElementById("out");try{var Q=[{q:1,year:2012,y:2012,top:"營商環境 —— 企業擁有權類型（有限合夥人的特徵）",topEn:"Business Environment —— Forms of Business Ownership (Characteristics of Limited Partners)",cn:"1. 一家連鎖便利店正為其中一家分店招聘店舖主管。以下哪項不是該新店舖主管的工作？\nA. 監督店內日常運作\nB. 指導店務助理\nC. 處理員工與顧客之間的糾紛\nD. 決定連鎖店的發展策略",en:"1. A convenience store chain is looking for a shop supervisor for one of its stores. Which of the following will not be a task for the new supervisor?\nA. monitor the daily operations of the shop\nB. coach shop assistants\nC. handle disputes between staff and customers\nD. decide on the development strategies for the chain",ans:"D",rate:"88%",exCn:"店舖主管屬於前線/中層管理人員，負責日常營運、監督基層店員及處理即時紛爭。而「決定整個連鎖集團的長遠發展策略」屬於「高層管理人員」的核心決策權。故答案為 D。",exEn:"A shop supervisor belongs to frontline/middle management whose duties are to oversee daily operations, coach assistants, and resolve disputes. Deciding on long-term development strategies is the responsibility of top management. Thus, D is correct."},
{q:2,year:2012,y:2012,top:"基礎財務會計 —— 損益表組成項目與會計調整",topEn:"Financial Accounting —— Components of Income Statement and Adjustments",outc:true,reason:"自 2025 年起，所有涉及損益表、銷貨成本及各項調整的基礎會計與過帳實務，已全數移至選修部分會計單元（Paper 2A）。",reasonEn:"Starting from 2025, all introductory accounting practices and financial statement adjustments have been moved to Elective Module Paper 2A.",cn:"2. 收益表上，____須從銷貨中扣除，而____則須加進銷貨成本內。\nA. 銷貨退回;期末存貨\nB. 銷貨退回;購貨運費\nC. 購貨退出;期初存貨\nD. 購貨退出;銷貨運費",en:"2. In an income statement, ____ should be deducted from sales, while ____ should be added to the cost of goods sold.\nA. returns inwards; closing inventory\nB. returns inwards; carriage inwards\nC. returns outwards; opening inventory\nD. returns outwards; carriage outwards",ans:"B",rate:"83%",exCn:"1. 銷貨淨額 = 銷貨 - 銷貨退回，因此「銷貨退回」須從銷貨中扣除。\n2. 銷貨成本 = 期初存貨 + 購貨淨額 + 購貨運費 - 期末存貨，因此「購貨運費」必須加進銷貨成本內。\n故選 B。",exEn:"1. Net Sales = Sales - Returns inwards, so returns inwards should be deducted from sales.\n2. COGS = Opening inventory + Net purchases + Carriage inwards - Closing inventory, so carriage inwards must be added to COGS.\nThus, B is correct."},
{q:3,year:2012,y:2012,top:"試算表 —— 帳戶結餘之借貸分類",topEn:"Financial Accounting —— Classification of Trial Balance Debit/Credit Balances",outc:true,reason:"自 2025 年起，試算表之編製、不平衡更正、以及科目借貸結餘歸類，已全數移至選修部分會計單元（Paper 2A）。",reasonEn:"Starting from 2025, trial balance preparation and debit/credit classification have been moved to Elective Module Paper 2A.",cn:"3. 以下哪個帳戶在試算表上必定為借方結餘？\n(1) 短期貸款 (2) 存貨 (3) 銀行結存 (4) 物業\nA. 只有(1)及(3)\nB. 只有(1)及(4)\nC. 只有(2)及(4)\nD. 只有(2)、(3)及(4)",en:"3. Which of the following accounts must carry a debit balance in a trial balance?\n(1) short-term loan (2) inventory (3) bank balance (4) premises\nA. (1) and (3) only\nB. (1) and (4) only\nC. (2) and (4) only\nD. (2), (3) and (4) only",ans:"C",rate:"52%",exCn:"(1) 短期貸款屬於負債，必定為貸方結餘。\n(2) 存貨屬於資產，必定為借方結餘。\n(3) 銀行結存正常情況為借方，但發生銀行透支時會轉為貸方，故非必定。\n(4) 物業屬於非流動資產，必定為借方結餘。\n故只有 (2) 和 (4) 必定為借方結餘，選 C。",exEn:"(1) Short-term loan is a liability and must carry a credit balance.\n(2) Inventory is an asset and must carry a debit balance.\n(3) Bank balance is normally a debit but can become credit (overdraft), so not always debit.\n(4) Premises are non-current assets and must carry a debit balance.\nTherefore, only (2) and (4) must carry a debit balance, which is option C."},
{q:4,year:2012,y:2012,top:"中小型企業 —— 中小型企業的特徵及擁有權",topEn:"Small and Medium Enterprises —— Characteristics of SMEs and Ownership",cn:"4. 中小型企業可以不同形式的擁有權經營。它們\n(1) 涵蓋大型企業未能服務的市場區隔。\n(2) 較大型企業為本地勞工提供更多就業機會。\n(3) 較大型企業享有更低稅率。\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"4. Small and medium enterprises can be operated in different forms of business ownership. They\n(1) cover market segments that are not served by large enterprises.\n(2) provide more employment opportunities for local workforce than large enterprises.\n(3) enjoy a lower tax rate than large enterprises.\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"21%",exCn:"(1) 正確：中小企營運靈活，能專注於大型企業未能覆蓋的細分市場。\n(2) 正確：中小企佔所有企業總數的98%以上，提供了絕大多數就業機會。\n(3) 錯誤：香港利得稅率由企業法律性質決定，與企業規模無關。\n故 (1) 和 (2) 正確，選 A。",exEn:"(1) Correct: SMEs can cater to niche market segments neglected by large corporations.\n(2) Correct: SMEs make up over 98% of all businesses in Hong Kong, providing the majority of employment.\n(3) Incorrect: Hong Kong profits tax rates are determined by legal form, not business scale.\nTherefore, (1) and (2) are correct, making option A correct."},
{q:5,year:2012,y:2012,top:"基礎個人理財 —— 策劃個人理財及投資（強積金豁免對象）",topEn:"Basics of Personal Financial Management —— Personal Financial Planning & Investment (MPF Exemptions)",cn:"5. 以下哪類僱員可獲豁免參加強制性公積金計劃？\nA. 建築工人\nB. 保安員\nC. 飲食業員工\nD. 家務僱員",en:"5. Which of the following categories of employees can be exempted from enrolling in the Mandatory Provident Fund (MPF) scheme?\nA. construction workers\nB. security guards\nC. catering industry employees\nD. domestic employees",ans:"D",rate:"74%",exCn:"根據香港法例，家務僱員（Domestic employees）被法例豁免參加強積金計劃。建築工人、保安員和飲食業員工皆必須依法登記參加。故選 D。",exEn:"Under Hong Kong MPF regulations, domestic employees are legally exempted from enrolling in MPF schemes. Construction workers, security guards, and catering employees are required by law to enroll. Thus, D is correct."},
{q:6,year:2012,y:2012,top:"基礎管理 —— 管理功能（控制與組織之別）",topEn:"Basics of Management —— Management Functions (Organising vs. Controlling)",cn:"6. 下列哪項不屬於一家企業銷售部門的控制過程之內？\nA. 設定銷售目標\nB. 委派售貨員至不同的銷售隊伍\nC. 記錄售貨員的銷售量\nD. 調整銷售目標",en:"6. Which of the following is not within the control process of a sales department in a business?\nA. setting sales targets\nB. assigning salespeople to different sales teams\nC. recording sales volume of salespeople\nD. adjusting sales targets",ans:"B",rate:"45%",exCn:"控制功能包含四步：設定標準(A)、量度表現(C)、比較表現、採取跟進(D)。而「B. 委派售貨員至不同的銷售隊伍」屬於「組織功能」中的資源配置，不屬於控制過程。故選 B。",exEn:"The Controlling function consists of: setting standards (A), measuring performance (C), comparing, and taking corrective action (D). 'Assigning salespeople to different teams' belongs to Organising, not Controlling. Thus, B is correct."},
{q:7,year:2012,y:2012,top:"主要商業功能 —— 資訊管理（優質商業資訊的特徵）",topEn:"Key Business Functions —— Information Management (Characteristics of Quality Business Information)",cn:"7. 為什麼愛妮願意購買這些報告？\n(1) 適時的資訊有助愛妮作出恰當的商業決策。\n(2) 購買報告的成本低於愛妮親自找尋資料的成本。\n(3) 這些報告每本均超過兩百頁。\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"7. Why is Ronnie willing to buy these reports?\n(1) Timely information helps Ronnie make appropriate business decisions.\n(2) The cost of buying the report is lower than the cost of finding the information herself.\n(3) Each of these reports has more than two hundred pages.\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"88%",exCn:"(1) 正確：資訊具備「適時性」，能幫助其做出即時決策。\n(2) 正確：符合「成本與效益原則」，花費低於親自搜集資料的機會成本。\n(3) 錯誤：報告頁數是物理數量，不代表資訊品質。\n故 (1) 和 (2) 正確，選 A。",exEn:"(1) Correct: The information possesses 'timeliness' for current market decisions.\n(2) Correct: It satisfies the 'cost-benefit relationship'.\n(3) Incorrect: Physical size is a measure of quantity, not quality.\nTherefore, (1) and (2) are correct, making option A correct."},
{q:8,year:2012,y:2012,top:"中小型企業 —— 政府對中小企的支援與基金政策",topEn:"Small and Medium Enterprises —— Government Support and Funding Schemes for SMEs",cn:"8. 愛妮打算參與海外展銷會宣傳業務，下列哪項可為她提供津貼？\nA. 中小企業市場推廣基金\nB. 中小企業信貸保證計劃\nC. 中小企業發展支援基金\nD. 小型企業研究資助計劃",en:"8. Ronnie plans to participate in an overseas trade fair to promote her business. Which of the following can provide her with a subsidy?\nA. SME Export Marketing Fund\nB. SME Loan Guarantee Scheme\nC. SME Development Fund\nD. Small Entrepreneur Research Assistance Programme",ans:"A",rate:"55%",exCn:"**中小企業市場推廣基金（EMF）**專門資助中小企參與「海外展銷會」以開拓境外市場，提供直接津貼。信貸保證計劃提供的是擔保而非津貼；發展支援基金資助非牟利組織；研究資助計劃資助科技研發。故選 A。",exEn:"The **SME Export Marketing Fund (EMF)** provides financial subsidies for SMEs to participate in overseas trade fairs. Loan guarantee schemes provide guarantees, not subsidies. Thus, A is correct."},
{q:9,year:2012,y:2012,top:"基礎個人理財 —— 金錢的時間值（複利未來值計算）",topEn:"Basics of Personal Financial Management —— Time Value of Money (Future Value Compounding)",cn:"9. 2012年首天，莊尼在一固定利息的銀行帳戶存入$6000。若該存款的年利率以複息每年計為4%，試找出(至整數元)2014年年終時莊尼可提取的總金額。\nA. $6480\nB. $6720\nC. $6749\nD. $7019",en:"9. On the first day of 2012, Johnny deposited $6000 into a fixed-interest bank account. Suppose the interest rate is 4% per annum compounded annually, find out (to the nearest dollar) the total amount Johnny could withdraw at the end of 2014.\nA. $6480\nB. $6720\nC. $6749\nD. $7019",ans:"C",rate:"71%",exCn:"存款期 n=3年，利率 r=4%。\nFV = $6,000 × (1.04)^3 = $6,000 × 1.124864 = $6,749.184\n四捨五入為 **$6,749**，故選 C。",exEn:"n=3 years, r=4%.\nFV = $6,000 × (1.04)^3 = $6,000 × 1.124864 = $6,749.184\nRounded to **$6,749**, which corresponds to option C."},
{q:10,year:2012,y:2012,top:"營商環境 —— 國際貿易及全球化（全球一體化的影響）",topEn:"Business Environment —— International Trade & Globalisation (Impacts of Globalisation)",cn:"10. 下列哪項是全球化對商界的影響？\n(1) 國際貿易增加\n(2) 貨物生產成本減低\n(3) 環球競爭加劇\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"10. Which of the following are the impacts of globalisation on the business sector?\n(1) increased international trade\n(2) reduced production cost of goods\n(3) intensified global competition\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"78%",exCn:"(1) 正確：關稅壁壘降低與跨國供應鏈發展推動國際貿易增加。\n(2) 正確：企業可透過全球採購及外判至低成本地區減低生產成本。\n(3) 正確：市場開放使環球競爭加劇。\n三者皆是，選 D。",exEn:"(1) Correct: Trade barrier reduction has expanded international trade.\n(2) Correct: Global sourcing and outsourcing reduce production costs.\n(3) Correct: Open markets intensify global competition.\nAll three are correct, making D the answer."},
{q:11,year:2012,y:2012,top:"營商環境 —— 香港經濟發展近況（CEPA 的協議宗旨）",topEn:"Business Environment —— Hong Kong's Economic Development (Objectives of CEPA)",cn:"11. 下列哪項不是《更緊密經貿關係安排》(CEPA)的目的？\nA. 減少香港與內地的貨物貿易障礙。\nB. 促進香港與內地的服務業自由貿易。\nC. 確保香港與內地之間資訊自由流通。\nD. 便利香港與內地的跨境商業投資。",en:"11. Which of the following is not a purpose of the Closer Economic Partnership Arrangement (CEPA)?\nA. reduce barriers on the trade of goods between Hong Kong and the Mainland\nB. promote free trade in services between Hong Kong and the Mainland\nC. ensure free flow of information between Hong Kong and the Mainland\nD. facilitate cross-border business investment between Hong Kong and the Mainland",ans:"C",rate:"66%",exCn:"CEPA 的三大支柱為：1. 貨物貿易（A）；2. 服務貿易（B）；3. 貿易及投資便利化（D）。CEPA 屬於經濟與貿易協議，完全不涉及資訊自由流通（C）。故答案為 C。",exEn:"CEPA's three pillars are: 1. Trade in goods (A); 2. Trade in services (B); 3. Investment facilitation (D). CEPA does not contain provisions for free flow of information. Thus, C is correct."},
{q:12,year:2012,y:2012,top:"營商環境 —— 企業擁有權類型（公營公司、合夥及有限公司之辨析）",topEn:"Business Environment —— Forms of Business Ownership (Public Corporations, Partnerships and Limited Companies)",outc:true,reason:"自 2025 年起，「公營公司（Public Corporation）」已完全從卷一必修部分大綱中刪除。",reasonEn:"Starting from 2025, 'Public Corporation' has been completely removed from the Paper 1 Compulsory syllabus.",cn:"12. 下列哪項為正確的陳述？\nA. 有限合夥的所有合夥人均負有有限債務責任。\nB. 有限公司的所有股東在董事局會議中均擁有投票權。\nC. 有限公司需向大眾披露其財務報表。\nD. 公營公司為政府擁有。",en:"12. Which of the following statements is correct?\nA. All partners in a limited partnership enjoy limited liability.\nB. All shareholders of a limited company have voting rights in the board of directors' meeting.\nC. A limited company needs to disclose its financial statements to the public.\nD. A public corporation is owned by the government.",ans:"D",rate:"62%",exCn:"A 錯誤：有限合夥中必須有至少一名「普通合夥人」承擔無限責任。\nB 錯誤：股東僅在股東大會中有投票權，非董事局會議。\nC 錯誤：只有公眾有限公司才需向公眾披露財報。\nD 正確：公營公司（如港鐵、機管局）由政府全資擁有。故選 D。",exEn:"A Incorrect: Limited partnership must have at least one general partner with unlimited liability.\nB Incorrect: Shareholders vote at general meetings, not board meetings.\nC Incorrect: Only public limited companies must disclose financial statements.\nD Correct: A public corporation is wholly owned by the government. Thus, D is correct."},
{q:13,year:2012,y:2012,top:"營商環境 —— 公司管治（良好公司管治的好處）",topEn:"Business Environment —— Corporate Governance (Benefits of Good Corporate Governance)",outc:true,reason:"自 2025 年起，有關公司管治、董事局架構及監管細則已完全移出卷一考核範圍。",reasonEn:"Starting from 2025, corporate governance has been removed from Paper 1.",cn:"13. 下列哪項不是良好公司管治的好處？\nA. 減少持份者之間的衝突\nB. 改善企業形象及聲譽\nC. 增加投資者的信心\nD. 確保與其他企業公平競爭",en:"13. Which of the following is not a benefit of good corporate governance?\nA. reduce conflicts among stakeholders\nB. improve corporate image and reputation\nC. increase investors' confidence\nD. ensure fair competition with other businesses",ans:"D",rate:"75%",exCn:"良好公司管治能：(A) 減少持份者衝突；(B) 改善形象與聲譽；(C) 增加投資者信心。而「確保與其他企業公平競爭」屬於政府競爭法律制度，與個別企業內部管治無關。故選 D。",exEn:"Good corporate governance helps to: (A) reduce conflicts; (B) improve image; (C) increase investors' confidence. 'Ensuring fair competition' is a matter of government antitrust legislation, not internal governance. Thus, D is correct."},
{q:14,year:2012,y:2012,top:"基礎會計 —— 會計循環的工作流程排序",topEn:"Introductory Accounting —— Sequence of Steps in the Accounting Cycle",outc:true,reason:"自 2025 年起，整個會計循環已全數移至選修部分會計單元（Paper 2A）。",reasonEn:"Starting from 2025, the accounting cycle has been moved to Elective Module Paper 2A.",cn:"14. 試為下列會計循環的工作排序：\n(1) 編製試算表 (2) 編製財務報表 (3) 在日記簿記錄交易 (4) 過帳至分類帳戶\nA. (3) -> (4) -> (2) -> (1)\nB. (3) -> (4) -> (1) -> (2)\nC. (4) -> (3) -> (1) -> (2)\nD. (4) -> (3) -> (2) -> (1)",en:"14. Arrange the following steps in an accounting cycle in the correct order:\n(1) preparing a trial balance (2) preparing financial statements (3) recording transactions in the journal (4) posting entries to ledger accounts\nA. (3) -> (4) -> (2) -> (1)\nB. (3) -> (4) -> (1) -> (2)\nC. (4) -> (3) -> (1) -> (2)\nD. (4) -> (3) -> (2) -> (1)",ans:"B",rate:"83%",exCn:"會計循環標準順序：1. 在日記簿記錄交易(3) → 2. 過帳至分類帳戶(4) → 3. 編製試算表(1) → 4. 編製財務報表(2)。正確順序為 (3)->(4)->(1)->(2)，選 B。",exEn:"The accounting cycle sequence is: 1. Record in journal (3) → 2. Post to ledgers (4) → 3. Prepare trial balance (1) → 4. Prepare financial statements (2). The correct order is (3)->(4)->(1)->(2), making B correct."},
{q:15,year:2012,y:2012,top:"主要商業功能 —— 人力資源管理的功能職掌",topEn:"Key Business Functions —— Human Resources Management (HRM Functions)",cn:"15. 人力資源經理負責：\n(1) 設計工作評核系統\n(2) 發展員工技能與天賦\n(3) 編排工作流程\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"15. A human resources manager is responsible for:\n(1) designing a job appraisal system.\n(2) developing staff skills and talents.\n(3) scheduling work flows.\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"42%",exCn:"(1) 正確：設計工作評核系統是人力資源管理的重要範疇。\n(2) 正確：提供技能發展培訓是人資的核心角色。\n(3) 錯誤：編排工作流程屬於「營運管理」部門的職責。\n故只有 (1) 和 (2) 正確，選 A。",exEn:"(1) Correct: Designing appraisal systems is a standard HRM function.\n(2) Correct: Developing staff skills is a core HR role.\n(3) Incorrect: Scheduling workflows belongs to Operations Management.\nTherefore, (1) and (2) are correct, making option A correct."},
{q:16,year:2012,y:2012,top:"基礎會計 —— 交易對會計等式及負債的影響",topEn:"Introductory Accounting —— Impact of Transactions on the Accounting Equation and Liabilities",outc:true,reason:"自 2025 年起，交易分析、會計等式變動已全數移至選修部分會計單元（Paper 2A）。",reasonEn:"Starting from 2025, transaction analysis and accounting equation have been moved to Elective Module Paper 2A.",cn:"16. 下列哪項交易會影響企業的負債總額？\nA. 東主向企業注入資產\nB. 向顧客賒銷\nC. 購入機器並於兩個月後支付機價\nD. 把銷貨款項存入企業的銀行戶口",en:"16. Which of the following transactions will affect the total liabilities of a business?\nA. The owner introduces assets into the business.\nB. Sales to customers on credit.\nC. Purchasing a machine and paying for it two months later.\nD. Depositing sales proceeds into the bank account of the business.",ans:"C",rate:"78%",exCn:"A：資產及資本增加，負債不變。\nB：應收貨款資產增加及銷貨收益增加，不涉及負債。\nC：機器資產增加以及**應付帳款負債增加**，會增加負債總額。\nD：銀行存款資產增加及現金資產減少，負債不變。\n故選 C。",exEn:"A: Increases Assets and Capital; Liabilities unchanged.\nB: Increases Assets (receivables) and Revenue; Liabilities unaffected.\nC: Increases Assets (machinery) and **increases Liabilities (accounts payable)**. Thus, C is correct.\nD: Increases one asset and decreases another; Liabilities unchanged."},
{q:17,year:2012,y:2012,top:"基礎會計 —— 獨資期初開辦資本的核算",topEn:"Introductory Accounting —— Computation of Opening Capital for Sole Proprietorship",outc:true,reason:"自 2025 年起，資產、負債、資本開初與期末的會計算術推導已全數移至選修部分會計單元（Paper 2A）。",reasonEn:"Starting from 2025, computations of opening/closing capital have been moved to Elective Module Paper 2A.",cn:"17. 2012年1月1日，湯先生成立了一家商號，注入客貨車$2000、物業$14000及存貨$5000。該商號向銀行借款$3000，用以購買一項設備。同時，湯先生存入$1000至商號的現金箱及$8000至商號的銀行戶口。\n於2012年1月1日湯先生的資本總額為多少？\nA. $9000\nB. $27000\nC. $30000\nD. $33000",en:"17. On 1 January 2012, Mr Tong set up a firm and brought in a motor van of $2000, premises of $14 000 and inventory of $5000. The firm borrowed $3000 from the bank to acquire equipment. Mr Tong put $1000 into the cash box and $8000 into the bank account.\nWhat was Mr Tong's capital on 1 January 2012?\nA. $9000\nB. $27000\nC. $30000\nD. $33000",ans:"C",rate:"42%",exCn:"資本 = 資產總額 - 負債總額\n資產總額 = $2,000 + $14,000 + $5,000 + $3,000 + $1,000 + $8,000 = $33,000\n負債總額 = $3,000\n資本 = $33,000 - $3,000 = **$30,000**\n（捷徑：東主私人注入資產淨值 = $2,000 + $14,000 + $5,000 + $1,000 + $8,000 = $30,000）\n故選 C。",exEn:"Capital = Total Assets - Total Liabilities\nTotal Assets = $2000 + $14000 + $5000 + $3000 + $1000 + $8000 = $33000\nTotal Liabilities = $3000\nCapital = $33000 - $3000 = **$30000**\nThus, C is correct."},
{q:18,year:2012,y:2012,top:"基礎個人理財 —— 以證券交易作投資（一手與二手證券市場分辨）",topEn:"Basics of Personal Financial Management —— Stock Trading as an Investment (Primary vs. Secondary Markets)",cn:"18. 一家有限公司擬透過發行新股上市集資，該公司應該在下列哪個市場招股？\nA. 一手市場\nB. 交易所\nC. 二手市場\nD. 場外市場",en:"18. If a limited company wants to go public through the issuing of new shares, which of the following markets should it go to?\nA. primary market\nB. listed exchange\nC. secondary market\nD. over-the-counter market",ans:"A",rate:"62%",exCn:"當公司發行新股票以募集資金時，必須在「一手市場（Primary Market）」中進行。二手市場是投資者之間買賣已發行證券的平台，不能幫助發行公司募集新資金。故選 A。",exEn:"When a company issues new shares to raise capital, the transaction must take place in the primary market. The secondary market is where investors trade existing securities. Thus, A is correct."},
{q:19,year:2012,y:2012,top:"基礎管理 —— 管理功能（計劃：目標管理 MBO 的好處）",topEn:"Basics of Management —— Management Functions (Benefits of Management by Objectives)",outc:true,reason:"根據2025年最新考綱，「目標管理（MBO）」相關概念已被完全刪除，不再屬於卷一必修部分考核內容。",reasonEn:"Starting from 2025, 'Management by Objectives (MBO)' has been completely removed from the Paper 1 Compulsory syllabus.",cn:"19. 下列哪項是企業應用目標管理的好處？\n(1) 改善管理層與員工之間的溝通\n(2) 提高員工士氣\n(3) 有助監察員工表現\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"19. Which of the following are benefits of applying Management by Objectives in a business?\n(1) improved communication between management and staff\n(2) better staff morale\n(3) enhanced monitoring of staff performance\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"59%",exCn:"(1) 正確：雙方頻繁討論目標，能改善溝通。\n(2) 正確：員工參與目標制定，提高工作士氣。\n(3) 正確：量化目標提供清晰基準，有助監察表現。\n三者皆是其好處，選 D。",exEn:"(1) Correct: Collaborative goal-setting improves communication.\n(2) Correct: Employee participation boosts morale.\n(3) Correct: Quantified goals facilitate performance monitoring.\nAll three are benefits, making D correct."},
{q:20,year:2012,y:2012,top:"基礎會計 —— 會計的目的與主要功能",topEn:"Introductory Accounting —— Purpose and Functions of Accounting",outc:true,reason:"自 2025 年起，會計的目的、角色與功能已全數移至選修部分會計單元（Paper 2A）。",reasonEn:"Starting from 2025, the purposes and functions of accounting have been moved to Elective Module Paper 2A.",cn:"20. 下列哪項是會計的功能？\n(1) 評估企業業績\n(2) 協助企業制定計劃\n(3) 增強企業競爭力\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"20. Which of the following are functions of accounting?\n(1) evaluate business performance\n(2) help businesses formulate plans\n(3) enhance the competitiveness of a business\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"81%",exCn:"(1) 正確：會計提供財務報表以評估企業業績。\n(2) 正確：管理會計數據有助制定預算與計劃。\n(3) 錯誤：增強競爭力是營運管理的成果，非會計功能。\n故只有 (1) 和 (2) 正確，選 A。",exEn:"(1) Correct: Financial statements evaluate business performance.\n(2) Correct: Managerial accounting data helps formulate plans.\n(3) Incorrect: Enhancing competitiveness is an operational management outcome.\nTherefore, (1) and (2) are correct, making A correct."},
{q:21,year:2012,y:2012,top:"基礎個人理財 —— 消費者信貸（申請信用卡的審批考慮因素）",topEn:"Basics of Personal Financial Management —— Consumer Credit (Factors for Approving Credit Card Applications)",cn:"21. 下列哪項客戶資料是銀行拒絕客戶申請信用卡最不相關的因素？\nA. 還款記錄\nB. 對該銀行的忠誠度\nC. 尚欠債務水平\nD. 破產記錄",en:"21. Which of the following pieces of customer information is the least relevant factor for a bank in rejecting a customer's application for a credit card?\nA. repayment record\nB. loyalty to the bank\nC. outstanding debt level\nD. record of bankruptcy",ans:"B",rate:"84%",exCn:"還款記錄（A）、尚欠債務水平（C）及破產記錄（D）都是衡量客戶還債能力的關鍵指標。而客戶對銀行的忠誠度（B）與違約風險無關。故選 B。",exEn:"Repayment record (A), outstanding debt level (C), and bankruptcy records (D) are critical indicators of creditworthiness. Loyalty to the bank (B) has no direct relation to default risk. Therefore, B is the least relevant factor."},
{q:22,year:2012,y:2012,top:"財務報表分析 —— 變現能力比率（營運資金的計算）",topEn:"Financial Statement Analysis —— Liquidity Ratios (Computation of Working Capital)",outc:true,reason:"自 2025 年起，營運資金及所有財務比率之具體公式運算已全數移至選修部分會計單元（Paper 2A）。",reasonEn:"Starting from 2025, computation of working capital and financial ratios have been moved to Elective Module Paper 2A.",cn:"22. 2011年12月31日，某公司的流動負債總額為$120000，流動比率為3:1，公司在當日的營運資金總額為多少？\nA. $40000\nB. $80000\nC. $240000\nD. $360000",en:"22. On 31 December 2011, the total current liabilities of a company was $120 000 and its current ratio was 3:1. What was the amount of working capital?\nA. $40000\nB. $80000\nC. $240000\nD. $360000",ans:"C",rate:"47%",exCn:"流動比率 = 流動資產 / 流動負債 = 3:1\n流動資產 = $120,000 × 3 = $360,000\n營運資金 = 流動資產 - 流動負債 = $360,000 - $120,000 = **$240,000**\n故選 C。",exEn:"Current Ratio = Current Assets / Current Liabilities = 3\nCurrent Assets = $120,000 × 3 = $360,000\nWorking Capital = Current Assets - Current Liabilities = $360,000 - $120,000 = **$240,000**\nThus, C is correct."},
{q:23,year:2012,y:2012,top:"中小型企業 —— 中小型企業與大型企業之特徵及營運模式對比",topEn:"Small and Medium Enterprises —— Comparison of Characteristics between SMEs and Large Enterprises",cn:"23. 下列哪項為一家小型商號與一家大型企業不同之處？\n小型商號 / 大型企業\n(1) 決策：具彈性 / 欠缺彈性\n(2) 業務範圍：多元化 / 專門化\n(3) 管理層次：較少 / 較多\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"23. Which of the following are the differences between a small firm and a large enterprise?\nSmall firm / Large enterprise\n(1) Decision making: flexible / inflexible\n(2) Scope of business: diversified / specialised\n(3) Managerial hierarchy: fewer levels / more levels\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"69%",exCn:"(1) 正確：小型商號決策具彈性，大型企業欠缺彈性。\n(2) 錯誤：小型商號業務專門化，大型企業多元化（描述顛倒）。\n(3) 正確：小型商號管理層次較少，大型企業較多。\n故 (1) 和 (3) 正確，選 B。",exEn:"(1) Correct: Small firms are flexible; large enterprises are inflexible.\n(2) Incorrect: Small firms are specialised; large enterprises are diversified (statement is inverted).\n(3) Correct: Small firms have fewer levels; large enterprises have more.\nTherefore, (1) and (3) are correct, making B correct."},
{q:24,year:2012,y:2012,top:"營商環境 —— 香港的金融機構與職能（香港金融管理局的主掌職掌）",topEn:"Business Environment —— Hong Kong's Financial Institutions (Functions of HKMA)",cn:"24. 下列哪項為香港金融管理局的主要功能？\nA. 監管證券及期貨市場\nB. 營運證券及衍生工具市場\nC. 維持貨幣及銀行穩定\nD. 決定銀行存款利率",en:"24. Which of the following is the main function of the Hong Kong Monetary Authority?\nA. regulate securities and futures markets\nB. operate securities and derivatives markets\nC. maintain monetary and banking stability\nD. determine bank deposit interest rates",ans:"C",rate:"72%",exCn:"香港金融管理局（HKMA）的核心功能為**維持港元匯率穩定及維護銀行體系安全與穩定**。A是證監會的職責；B是港交所的業務；D由商業銀行自行釐定。故選 C。",exEn:"The HKMA's primary functions are **maintaining monetary stability and promoting banking system safety**. A is the SFC's function; B is HKEX's business; D is decided by commercial banks. Thus, C is correct."},
{q:25,year:2012,y:2012,top:"不同企業擁有權類型的財務報告編製 —— 財務報表的使用者及資訊需要用途",topEn:"Financial Accounting —— Financial Statement Users and Their Needs",outc:true,reason:"自 2025 年起，財務報表的使用者、資訊需要與用途分析已全數移至選修部分會計單元（Paper 2A）。",reasonEn:"Starting from 2025, financial statement users and their information needs have been moved to Elective Module Paper 2A.",cn:"25. 下列哪項為一家公司的財務報表對相關用家的用途？\n用家 / 用途\n(1) 管理人員 / 幫助重新調配公司資源\n(2) 債務人 / 幫助評估公司還款能力\n(3) 潛在投資者 / 幫助決定公司是否值得投資\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"25. Which of the following is/are the use(s) of a company's financial statements for the respective users?\nUser / Use\n(1) Managers / help reallocate company resources\n(2) Debtors / help assess company's repayment ability\n(3) Potential investors / help decide whether it is worth investing in the company\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"52%",exCn:"(1) 正確：管理人員需要財務報表以重新調配資源。\n(2) 錯誤：**債務人是欠公司錢的人**。關注還款能力的應是「債權人」。\n(3) 正確：潛在投資者審閱財務報告以決定是否投資。\n故只有 (1) 和 (3) 正確，選 B。",exEn:"(1) Correct: Managers use financial statements to reallocate resources.\n(2) Incorrect: **A debtor is an entity that owes money to the company**. The party interested in repayment ability is the creditor, not the debtor.\n(3) Correct: Potential investors evaluate profitability before investing.\nTherefore, only (1) and (3) are correct, making B correct."},
{q:26,year:2012,y:2012,top:"基礎個人理財 —— 金錢的時間值（名義與實際回報率之算術關係）",topEn:"Basics of Personal Financial Management —— Time Value of Money (Nominal vs. Effective Rates of Return)",cn:"26. 如果名義回報率不變，下列哪項有關實際回報率的陳述是正確的？\nA. 計算複息的頻率提高，定期存款的實際回報率將會上升。\nB. 本金增加，定期存款的實際回報率將會上升。\nC. 存款期縮短，定期存款的實際回報率將會上升。\nD. 資金成本下降，定期存款的實際回報率將會上升。",en:"26. If the nominal rate of return is constant, the effective rate of return of a term deposit will increase if\nA. the frequency of compounding increases\nB. the principal increases\nC. the deposit period decreases\nD. the cost of capital decreases",ans:"A",rate:"73%",exCn:"實際年利率公式：i_eff = (1 + r/m)^m - 1\nA 正確：計息頻率 m 提高，會拉高實際回報率。\nB、C、D 錯誤：實際回報率是百分比，與本金金額、存款年期、資金成本無關。",exEn:"Effective rate formula: i_eff = (1 + r/m)^m - 1\nA is correct: Increasing compounding frequency m increases the effective rate.\nB, C, D are incorrect: The effective rate is independent of principal size, deposit period, or cost of capital."},
{q:27,year:2012,y:2012,top:"基礎財務會計 —— 會計原則與概念（企業個體原則與一貫性之應用）",topEn:"Financial Accounting —— Generally Accepted Accounting Principles (Applications of Business Entity and Consistency)",outc:true,reason:"自 2025 年起，會計假設、會計原則及會計概念之定義與應用已全數移至選修部分會計單元（Paper 2A）。",reasonEn:"Starting from 2025, GAAP definitions and applications have been moved to Elective Module Paper 2A.",cn:"27. 餐廳東主把與家人用膳的未付帳單一時記在公司費用帳內，一時記在私人費用帳內，這做法違反了下列哪項會計原則？\nA. 應計觀念\nB. 企業個體\nC. 一貫性\nD. 繼續經營",en:"27. A restaurant owner recorded the unpaid restaurant bills of his family dinners sometimes in the company's expense account and sometimes in his personal expense account. This practice violates which accounting principle?\nA. accrual concept\nB. business entity\nC. consistency\nD. going concern",ans:"B",rate:"77%",exCn:"本題涉及東主個人私人開支，直接違反了**企業個體觀念**：企業在會計上是獨立於東主的個體，東主私人活動不能記入企業帳冊。故選 B。",exEn:"The transaction involves the owner's personal expenses, directly violating the **Business Entity Concept**: a business is treated as a separate entity from its owner, and personal expenditures must not be mixed with business records. Thus, B is correct."},
{q:28,year:2012,y:2012,top:"原始分錄帳簿及分類帳 —— 各類日記帳與過帳規則",topEn:"Financial Accounting —— Books of Original Entry and Posting Rules",outc:true,reason:"自 2025 年起，原始分錄帳簿、輔助分類帳及過帳規則已全數移至選修部分會計單元（Paper 2A）。",reasonEn:"Starting from 2025, books of original entry and posting rules have been moved to Elective Module Paper 2A.",cn:"28. 下列哪項陳述並不正確？\nA. 購貨總額應過帳至應付帳款分類帳。\nB. 零用現金簿是原始分錄帳簿之一。\nC. 只有賒銷才會記入銷貨簿。\nD. 賒購非流動資產應記入普通日記簿。",en:"28. Which of the following statements is incorrect?\nA. The total of purchases should be posted to the accounts payable ledger.\nB. The petty cash book is one of the books of original entry.\nC. Only credit sales should be recorded in the sales journal.\nD. Credit purchases of non-current assets should be recorded in the general journal.",ans:"A",rate:"33%",exCn:"A 不正確：購貨總額應過帳至**總分類帳的購貨帳戶**，而非應付帳款分類帳（僅記錄個別供應商賒購細帳）。\nB、C、D 正確：零用現金簿是日記帳；銷貨簿記錄賒銷；賒購非流動資產應記入普通日記簿。\n故選 A。",exEn:"A is incorrect: The total of purchases must be posted to the **Purchases Account in the General Ledger**, not the accounts payable ledger (which only records individual supplier details).\nB, C, and D are correct.\nThus, A is the incorrect statement and the correct answer."},
{q:29,year:2012,y:2012,top:"中小型企業 —— 企業家與成功企業家的特徵",topEn:"Small and Medium Enterprises —— Characteristics of a Successful Entrepreneur",cn:"29. 下列哪項為成功企業家的特點？\n(1) 勇於接受挑戰\n(2) 緊遵常規慣例\n(3) 渴望獲取成就\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"29. Which of the following are characteristics of a successful entrepreneur?\n(1) willing to take challenges\n(2) follow routine practices closely\n(3) strong desire to achieve\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"72%",exCn:"(1) 正確：企業家精神核心在於勇於承擔風險、接受挑戰。\n(2) 錯誤：企業家是開創者與革新者，往往打破常規，而非緊遵常規。\n(3) 正確：他們具備強烈的成就動機。\n故 (1) 和 (3) 正確，選 B。",exEn:"(1) Correct: Entrepreneurship is about risk-taking and accepting challenges.\n(2) Incorrect: Entrepreneurs are innovators who break rules, not follow routines.\n(3) Correct: They possess a strong desire to achieve.\nTherefore, (1) and (3) are correct, making B correct."},
{q:30,year:2012,y:2012,top:"基礎管理 —— 有效溝通的過程（編碼、解碼與溝通渠道）",topEn:"Basics of Management —— Effective Communication (The Communication Process)",outc:true,reason:"自 2025 年起，「有效溝通」及溝通過程等相關大綱已從卷一必修部分中完全刪除。",reasonEn:"Starting from 2025, 'Effective Communication' and its process have been removed from Paper 1.",cn:"30. 在典型的溝通過程中，傳遞者把意念____成為信息；透過適當的____，接收者然後把信息____。\nA. 解碼..........反饋..........編碼\nB. 編碼..........反饋..........解碼\nC. 解碼..........渠道..........編碼\nD. 編碼..........渠道..........解碼",en:"30. In a typical communication process, an idea is ____ by the sender to become a message. Through a suitable ____, the message is transmitted and then ____ by the receiver.\nA. decoded..........feedback..........encoded\nB. encoded..........feedback..........decoded\nC. decoded..........channel..........encoded\nD. encoded..........channel..........decoded",ans:"D",rate:"85%",exCn:"在標準溝通模型中：\n1. 傳遞者將意念轉化為信息 → **編碼（Encoding）**\n2. 透過適合的**渠道（Channel）**傳送\n3. 接收者解讀信息 → **解碼（Decoding）**\n故選 D。",exEn:"In a standard communication process:\n1. The sender translates ideas into a message → **encoding**\n2. The message is sent through a suitable **channel**\n3. The receiver interprets the message → **decoding**\nThus, D is correct."},
{q:1,year:2013,y:2013,top:"營商環境 —— 企業擁有權類型（特許經營與合夥人的特徵）",topEn:"Business Environment —— Forms of Business Ownership (Characteristics of franchising and limited partners)",cn:"1. 下列哪項有關特許經營商店的描述是正確的？\nA. 在特許權擁有人的授權下運作\nB. 可完全控制商店的推廣策略\nC. 必須登記成為有限公司\nD. 只適用於零售業及飲食業",en:"1. Which of the following descriptions about a franchised shop is correct?\nA. operates under the authorisation of franchisor\nB. has full control over its promotion strategies\nC. must be registered as a limited company\nD. only applicable to retail and catering businesses",ans:"A",rate:"89%",exCn:"1. **A 正確**：特許經營商店是在特許權擁有人（Franchisor）授權許可下，使用其品牌和運作模式進行營運。\n2. **B 錯誤**：特許經營商必須遵守總部統一制定的營銷與推廣策略，無完全控制權。\n3. **C 錯誤**：特許經營商可以獨資、合夥或有限公司等多種形式營運，法律上並無強制規定必須是有限公司。\n4. **D 錯誤**：特許經營廣泛應用於零售、餐飲、酒店、教育及各類服務業，非僅限於零售和飲食業。\n本題屬於 **2025 年及以後新考綱必修部分「1(a) 營商環境：企業擁有權類型」**。",exEn:"1. **A is correct**: A franchised shop operates under the authorisation and license of the franchisor, using its brand name, business model, and systems.\n2. **B is incorrect**: Franchisees must adhere to standardized corporate marketing and promotional strategies.\n3. **C is incorrect**: Franchise businesses can operate under various ownership types; there is no legal requirement to register as a limited company.\n4. **D is incorrect**: Franchising is applied across a wide range of industries and is not restricted solely to retail and catering.\nThis topic falls under the **2025+ New Syllabus Paper 1 Compulsory Part '1(a) Business Environment: Forms of Business Ownership'**."},
{q:2,year:2013,y:2013,top:"營商環境 —— 香港的金融市場（金融中介機構與資金融通功能）",topEn:"Business Environment —— Hong Kong's Financial Market (Financial intermediaries and capital channeling)",cn:"2. 金融市場的主要功能是將資金從有盈餘的經濟單位轉移至需要資金的經濟單位。下列哪些界別有助發揮此功能？\n(1) 銀行界\n(2) 保險界\n(3) 證券界\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"2. The primary function of a financial market is to transfer funds from economic units with surpluses to economic units in need of them. Which of the following sectors help performing this function?\n(1) banking sector\n(2) insurance sector\n(3) securities sector\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"49%",exCn:"1. **D 正確**：金融市場通過直接融資與間接融資將閒置資金配置到需求方：\n   - **(1) 銀行界**：典型的間接融資中介，吸收儲蓄存款，並向個人或企業發放貸款。\n   - **(2) 保險界**：匯集投保人的保費，並將其投資於各類金融工具和資本項目，發揮資金融通作用。\n   - **(3) 證券界**：提供股票、債券等有價證券的發行（一手）與買賣（二手）平台，實現直接資融通。\n本題屬於 **2025 年及以後新考綱必修部分「1(a) 營商環境：香港的金融機構與服務」**。",exEn:"1. **D is correct**: Financial markets channel funds from surplus units to deficit units through both direct and indirect financial intermediation:\n   - **(1) Banking sector**: Acts as an indirect financial intermediary by accepting deposits and providing loans.\n   - **(2) Insurance sector**: Pools premiums from policyholders and invests them in various financial assets.\n   - **(3) Securities sector**: Provides direct financing channels through the issuance and trading of stocks and bonds.\nThis topic falls under the **2025+ New Syllabus Paper 1 Compulsory Part '1(a) Business Environment: Hong Kong's Financial Institutions and Services'**."},
{q:3,year:2013,y:2013,top:"原始分錄帳簿 —— 普通日記簿的登記範疇",topEn:"Books of Original Entry —— Scope of General Journal",outc:true,reason:"自 2025 年起，原始分錄帳簿及複式記帳之具體分錄，已全數歸入選修部分（會計單元）Paper 2A 考核。",reasonEn:"Since 2025, specific bookkeeping entries, journals, and ledgers are tested under Elective Module Paper 2A.",cn:"3. 下列哪項交易會記錄在普通日記簿內？\nA. 賒購貨品\nB. 顧客退回貨品\nC. 注入辦公室物業作為資本\nD. 東主提用現金作私人用途",en:"3. Which of the following transactions would be recorded in the general journal?\nA. purchase of goods on credit\nB. return of goods by customers\nC. introduction of office premises as capital\nD. withdrawal of cash by the owner for personal use",ans:"C",rate:"56%",exCn:"1. **C 正確**：普通日記簿（General Journal）用於記錄不屬於任何其他專用原始分錄日記簿的非經常性交易項目。\n2. **A 錯誤**：賒購貨品應記入「購貨日記簿」。\n3. **B 錯誤**：顧客退回貨品應記入「銷貨退回日記簿」。\n4. **C 正確**：東主注入非貨幣資產作為初始資本，不涉及現金收付亦非存貨交易，必須記入普通日記簿。\n5. **D 錯誤**：東主提用現金應記入「現金簿」的貸方。",exEn:"1. **C is correct**: The general journal is used to record non-frequently occurring transactions that do not fit into any other specialized journals.\n2. **A is incorrect**: Purchase of trading goods on credit must be recorded in the Purchases Journal.\n3. **B is incorrect**: Return of goods by customers must be recorded in the Sales Returns Journal.\n4. **C is correct**: The introduction of a non-monetary asset by the owner as capital must be recorded in the General Journal.\n5. **D is incorrect**: Cash drawings by the owner must be recorded on the credit side of the Cash Book."},
{q:4,year:2013,y:2013,top:"基礎管理 —— 管理功能（計劃：策略與長遠計劃之界定）",topEn:"Basics of Management —— Management Functions (Planning: Strategic and long-term plans)",cn:"4. 一家公司決定改變整體商業目標，並為未來十年草擬了一份商業計劃。這類商業計劃是\n(1) 策略計劃。\n(2) 長遠計劃。\n(3) 運作計劃。\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"4. A company decides to change its overall business objectives and drafts a business plan for the next ten years. This type of business plan is a\n(1) strategic plan.\n(2) long-term plan.\n(3) operational plan.\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"63%",exCn:"1. **A 正確**：\n   - **(1) 是策略計劃**：涉及決定及改變公司的「整體商業目標」，屬於最高層級的策略計劃。\n   - **(2) 是長遠計劃**：跨越 5 年或以上（本題為 10 年）的計劃屬於長遠計劃。\n   - **(3) 不是運作計劃**：運作計劃是指針對日常具體工作細節而制定的短期執行計劃（通常在 1 年以內）。\n本題屬於 **2025 年後必修部分「1(b) 基礎管理：管理功能（計劃之特徵）」**。",exEn:"1. **A is correct**:\n   - **(1) is a strategic plan**: It involves changing the \"overall business objectives\" of the firm.\n   - **(2) is a long-term plan**: Any plan that spans 5 years or more is classified as a long-term plan.\n   - **(3) is not an operational plan**: An operational plan is a short-term plan designed to guide day-to-day operations.\nThis topic falls under the **2025+ New Syllabus Paper 1 Compulsory Part '1(b) Basics of Management: Management Functions (Planning)'**."},
{q:5,year:2013,y:2013,top:"營商環境 —— 企業擁有權類型（私人有限公司的特徵）",topEn:"Business Environment —— Forms of Business Ownership (Characteristics of private limited companies)",cn:"5. 某企業的所有東主均只負有限的債務責任。雖然這企業在監管責任上毋需公開財務報表，但它每年仍會經互聯網發布這些報表。這企業是一家\nA. 有限合夥。\nB. 私人有限公司。\nC. 在主板市場上市的公司。\nD. 在創業板市場上市的公司。",en:"5. All the owners of a business have limited liability. Although the business does not have a regulatory obligation to publish its financial statements to the public, it publishes them through the Internet every year. This business is a\nA. limited partnership.\nB. private limited company.\nC. company listed on the Main Board.\nD. company listed on the Growth Enterprise Market.",ans:"B",rate:"77%",exCn:"1. **B 正確**：\n   - **有限責任**：東主只承擔有限債務責任，這排除了一般合夥與獨資（排除 A）。\n   - **無公開監管責任，但主動公開**：上市公司在法律上有強制公開披露責任；而私人有限公司在監管法規上則豁免公開財務報表，但可選擇自願在網上發布。\n本題屬於 **2025 年及以後新考綱必修部分「1(a) 營商環境：企業擁有權類型」**。",exEn:"1. **B is correct**:\n   - **Limited liability**: All owners enjoy limited liability, eliminating unincorporated partnerships (A).\n   - **No regulatory obligation to publish statements**: Public listed companies have mandatory disclosure requirements; a private limited company is legally exempted from public disclosure but may choose to publish voluntarily.\nThis topic falls under the **2025+ New Syllabus Paper 1 Compulsory Part '1(a) Business Environment: Forms of Business Ownership'**."},
{q:6,year:2013,y:2013,top:"基礎個人理財 —— 策劃個人理財及投資（金融工具風險回報特徵）",topEn:"Basics of Personal Financial Management —— Personal Financial Planning & Investment (Characteristics of financial instruments)",cn:"6. 下列哪項是正確的陳述？\nA. 六個月期的政府票據是資本市場的投資工具。\nB. 風險較高的投資工具或會帶來較高的回報。\nC. 投資多種金融產品可避免市場風險。\nD. 投資於某公司的優先股較投資於其普通股的風險為高。",en:"6. Which of the following statements is correct?\nA. A six-month government bill is an investment instrument in the capital market.\nB. Financial instruments with higher risk may bring higher returns.\nC. Investing in a variety of financial products can avoid market risk.\nD. Investing in preferred shares of a company is riskier than investing in its ordinary shares.",ans:"B",rate:"82%",exCn:"1. **B 正確**：金融學中的基本原則是風險與回報成正比。高風險投資工具伴隨着獲得高回報的「可能性（或會）」。\n2. **A 錯誤**：六個月期的政府票據屬於短期金融工具，屬於「貨幣市場」而非資本市場。\n3. **C 錯誤**：多元化投資只能減少「非系統性風險」，而無法避免整體的「市場風險」。\n4. **D 錯誤**：優先股在股息派發和清盤索償時均排在普通股之前，因此普通股風險較優先股高。\n本題屬於 **2025 年及以後新考綱必修部分「1(d) 基礎個人理財：策劃個人理財及投資」**。",exEn:"1. **B is correct**: The risk-return tradeoff dictates that higher-risk instruments are associated with the potential for higher returns.\n2. **A is incorrect**: A six-month government bill is a short-term instrument belonging to the money market.\n3. **C is incorrect**: Diversification can reduce unsystematic risk but cannot avoid systematic/market risk.\n4. **D is incorrect**: Preferred shares have higher priority claim on dividends and assets upon liquidation than ordinary shares.\nThis topic falls under the **2025+ New Syllabus Paper 1 Compulsory Part '1(d) Basics of Personal Financial Management: Personal Financial Planning & Investment'**."},
{q:7,year:2013,y:2013,top:"營商環境 —— 商業道德與社會責任（公司管治的提升）",topEn:"Business Environment —— Business Ethics & Social Responsibility (Enhancing corporate governance)",cn:"7. 下列哪些方法可提升企業的公司管治？\n(1) 為員工引進道德守則\n(2) 向公眾發布產品目錄\n(3) 邀請顧客提供意見\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"7. Which of the following methods can enhance corporate governance?\n(1) introducing code of ethics to employees\n(2) publishing product catalogues to the public\n(3) inviting feedback from customers\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"59%",exCn:"1. **B 正確**：公司管治的核心是提高透明度、誠信度、問責性並保障持份者利益：\n   - **(1) 道德守則**：能有效指引員工的道德行為與商業操守，直接提升管治水平。\n   - **(2) 產品目錄**：純屬商業營銷活動，不屬於公司內部管治機制。\n   - **(3) 邀請顧客反饋**：加強了公司與外部持份者的溝通與外部監察問責。\n本題屬於 **2025 年及以後新考綱必修部分「1(a) 營商環境：商業道德與社會責任」**。",exEn:"1. **B is correct**: Corporate governance focuses on accountability, fairness, and transparency:\n   - **(1) Introducing a code of ethics**: Directs employees' ethical behaviors and directly enhances governance.\n   - **(2) Publishing product catalogues**: Is a marketing activity, not related to internal governance.\n   - **(3) Inviting feedback from customers**: Promotes open communication and strengthens external accountability.\nThis topic falls under the **2025+ New Syllabus Paper 1 Compulsory Part '1(a) Business Environment: Business Ethics & Social Responsibility'**."},
{q:8,year:2013,y:2013,top:"基礎管理 —— 按權力建立組織架構（職權與授權之原則）",topEn:"Basics of Management —— Organising (Principles of authority and delegation)",cn:"8. 下列哪些是正確的陳述？\n(1) 職權可授予下屬。\n(2) 職權是指揮及決策的權力。\n(3) 前綫員工毋需職權來執行職務。\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"8. Which of the following statements are correct?\n(1) Authority can be delegated to subordinates.\n(2) Authority is the power to command and make decisions.\n(3) Front-line staff do not need authority to perform their duties.\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"81%",exCn:"1. **A 正確**：\n   - **(1) 正確**：管理者可將部分的「職權」透過「授權」程序委派給下屬。\n   - **(2) 正確**：職權的定義即是職位所賦予的指揮下屬和做出決策的合法權力。\n   - **(3) 錯誤**：前線員工同樣需要一定程度的授權才能順利執行其日常職務。\n本題屬於 **2025 年及以後新考綱必修部分「1(b) 基礎管理：組織結構及管理原則」**。",exEn:"1. **A is correct**:\n   - **(1) is correct**: Managers can allocate authority to subordinates through delegation.\n   - **(2) is correct**: Authority is the legitimate power inherent in a managerial position.\n   - **(3) is incorrect**: Front-line employees also require a certain degree of basic authority to execute their duties.\nThis topic falls under the **2025+ New Syllabus Paper 1 Compulsory Part '1(b) Basics of Management: Organising (delegation of authority)'**."},
{q:9,year:2013,y:2013,top:"複式記帳法 —— 應收帳款分類帳與現金折扣影響",topEn:"Double-entry Bookkeeping —— Ledger balancing and Cash Discount",outc:true,reason:"自 2025 年起，會計等式之運算及複式記帳分類帳過帳，已全數歸入選修部分（會計單元）Paper 2A 考核。",reasonEn:"Since 2025, double-entry bookkeeping principles, ledger entries, and accounts balancing are tested under Elective Module Paper 2A.",cn:"9. 2012年12月1日，景龍公司欠天天公司$56000。2012年12月10日，天天公司把成本為$80000的貨物按毛利率50%售予景龍公司。2012年12月15日，景龍公司償還月初的結欠，獲得現金折扣3%。2012年12月31日，在天天公司的帳簿內，景龍公司帳戶的結餘應為：\nA. $54320(貸方結餘)\nB. $104000(借方結餘)\nC. $120000(貸方結餘)\nD. $160000(借方結餘)",en:"9. On 1 December 2012, King Lung Company owed Daily Company $56 000. On 10 December 2012, Daily Company sold goods costing $80 000 at a gross profit margin of 50% to King Lung Company. On 15 December 2012, King Lung Company settled the outstanding amount of the beginning of the month, enjoying a 3% cash discount. On 31 December 2012, in the books of Daily Company, the balance of King Lung Company's account should be:\nA. $54 320 (credit balance)\nB. $104 000 (debit balance)\nC. $120 000 (credit balance)\nD. $160 000 (debit balance)",ans:"D",rate:"29%",exCn:"1. **D 正確**：\n   - **12月10日賒銷存貨**：銷售價格 = $80,000 / 0.50 = $160,000。分錄：借記應收帳款$160,000；貸記銷貨$160,000。\n   - **12月15日清還月初欠款**：現金折扣 = $56,000 × 3% = $1,680。貸記合計 $56,000 使月初欠款完全結平。\n   - **12月31日應收帳款餘額**：借方總額 $216,000 - 貸方總額 $56,000 = **$160,000（借方結餘）**。",exEn:"1. **D is correct**:\n   - **10 Dec Credit Sale**: Selling price = $80,000 / 0.50 = $160,000. Entry: Dr. Trade Receivables $160,000; Cr. Sales $160,000.\n   - **15 Dec Settlement**: Cash discount = $56,000 × 3% = $1,680. Total credit of $56,000 fully clears the opening balance.\n   - **31 Dec Balance**: Total Debits $216,000 - Total Credits $56,000 = **$160,000 (Debit balance)**."},
{q:10,year:2013,y:2013,top:"應計與預付項目 —— 租金費用的期末調整計算",topEn:"Period-end Adjustments —— Accruals and Prepayments (Rent adjustments)",outc:true,reason:"自 2025 年起，應計與預付項目、租金按期分攤等期末會計調整，已全數歸入選修部分（會計單元）Paper 2A 考核。",reasonEn:"Since 2025, period-end adjustments including accruals, prepayments, and rental deposit separations are tested under Elective Module Paper 2A.",cn:"10. 2012年1月1日，好運公司簽訂了一份為期兩年的辦公室租約，租期由2012年2月1日至2014年1月31日。同日，公司向業主支付了$208000，作為2012年2月至3月的租金和相等於兩個月租金的按金。在截至2012年12月31日止年度的損益表中，租金費用的金額是：\nA. $572 000\nB. $624 000\nC. $1 144 000\nD. $1 248 000",en:"10. On 1 January 2012, Good Luck Company signed a two-year lease for an office. The lease period was from 1 February 2012 to 31 January 2014. On the same day, the company paid $208 000 to the landlord as rent for February and March 2012 and a deposit equivalent to two months' rent. In the income statement for the year ended 31 December 2012, the amount of rental expenses is:\nA. $572 000\nB. $624 000\nC. $1 144 000\nD. $1 248 000",ans:"A",rate:"18%",exCn:"1. **A 正確**（正確率僅 18%）：\n   - **第一步**：$208,000 包含 2 個月租金 + 2 個月按金 = 4 個月租金。每月租金 = $208,000 / 4 = **$52,000**。\n   - **第二步**：2012 年內實際承租期間為 **11 個月**（2月1日至12月31日）。\n   - **第三步**：租金費用 = $52,000 × 11 = **$572,000**（選 A）。",exEn:"1. **A is correct** (only 18% passing rate):\n   - **Step 1**: $208,000 = 2 months' rent + 2 months' deposit = 4 months' equivalent. Monthly rent = $208,000 / 4 = **$52,000**.\n   - **Step 2**: Occupancy in 2012 = **11 months** (1 Feb to 31 Dec).\n   - **Step 3**: Rental expense = $52,000 × 11 = **$572,000** (Option A)."},
{q:11,year:2013,y:2013,top:"中小型企業 —— 香港中小型企業的特徵與上市途徑",topEn:"Small and Medium Enterprises —— Characteristics of SMEs and listing channels",cn:"11. 下列哪項關於本港中小型企業(中小企)的陳述是正確的？\nA. 中小企享有較低稅率。\nB. 中小企可在證券交易所上市。\nC. 中小企只從事初級及次級生產。\nD. 中小企不會僱用超過二十位的員工。",en:"11. Which of the following statements about small and medium enterprises (SMEs) in Hong Kong is correct?\nA. SMEs enjoy a lower tax rate.\nB. SMEs can list on the stock exchange.\nC. SMEs are only engaged in primary and secondary production.\nD. SMEs do not employ more than 20 staff.",ans:"B",rate:"37%",exCn:"1. **B 正確**：香港交易所設有專為中小型企業融資的「GEM（前稱創業板）」上市平台。\n2. **A 錯誤**：利得稅率由企業的法律組織形式決定，與企業規模大小無關。\n3. **C 錯誤**：本港 90% 以上中小企從事進出口、零售、餐飲等服務業。\n4. **D 錯誤**：服務業中小企界定為僱員少於 50 人，製造業少於 100 人。\n本題屬於 **2025 年及以後新考綱必修部分「1(b) 基礎管理：中小型企業」**。",exEn:"1. **B is correct**: The Stock Exchange of Hong Kong operates GEM, specifically designed as a listing platform for SMEs.\n2. **A is incorrect**: Profits tax rates depend on legal form of ownership, not business size.\n3. **C is incorrect**: Over 90% of Hong Kong's SMEs are engaged in the service sector.\n4. **D is incorrect**: Service-sector SMEs employ fewer than 50 people; manufacturing SMEs fewer than 100.\nThis topic falls under the **2025+ New Syllabus Paper 1 Compulsory Part '1(b) Basics of Management: SMEs'**."},
{q:12,year:2013,y:2013,top:"營商環境 —— 國際貿易合作組織（世界貿易組織 WTO 的功能）",topEn:"Business Environment —— International Trade Organisations (Functions of the WTO)",cn:"12. 下列哪項不是世界貿易組織的功能？\nA. 為減少國際貿易障礙提供討論平台\nB. 排解成員之間因詮釋貿易協議而引致的糾紛\nC. 監察及審視成員的貿易政策\nD. 向發展中國家提供貸款及津貼，以助發展貿易",en:"12. Which of the following is not a function of the World Trade Organisation?\nA. provide a platform for negotiations to reduce international trade barriers\nB. settle trade disputes arising from the interpretation of trade agreements among members\nC. monitor and review trade policies of members\nD. provide loans and grants to developing countries to help develop trade",ans:"D",rate:"67%",exCn:"1. **D 正確**：WTO 的核心功能是推動貿易壁壘減讓（A）、調解貿易爭端（B）及審查貿易政策（C）。向發展中國家提供貸款及津貼是**世界銀行**和 IMF 的職責。\n本題屬於 **2025 年及以後新考綱必修部分「1(a) 營商環境：國際貿易合作組織」**。",exEn:"1. **D is correct**: The primary roles of the WTO are trade negotiations (A), dispute resolution (B), and policy review (C). Providing development loans is the function of the World Bank or IMF.\nThis topic falls under the **2025+ New Syllabus Paper 1 Compulsory Part '1(a) Business Environment: International Trade Organisations (WTO)'**."},
{q:13,year:2013,y:2013,top:"基礎管理 —— 主要商業功能（市場營銷部門的職能）",topEn:"Basics of Management —— Major Business Functions (Functions of marketing department)",cn:"13. 下列哪項是公司市場營銷部門的工作？\n(1) 調查顧客需要\n(2) 訂定產品價格\n(3) 支付花紅予售貨員\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"13. Which of the following tasks are performed by the marketing department of a company?\n(1) conducting surveys on customer needs\n(2) deciding the price of the product\n(3) paying bonus to salespersons\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"92%",exCn:"1. **A 正確**：\n   - **(1) 正確**：調查顧客需要屬於市場調查，與產品研發與分析需求相關。\n   - **(2) 正確**：制定銷售定價屬於定價策略，直接屬於營銷部職責。\n   - **(3) 錯誤**：支付花紅予售貨員屬於人力資源部或會計/財務部的職能。\n本題屬於 **2025 年及以後新考綱必修部分「1(b) 基礎管理：主要商業功能（市場營銷）」**。",exEn:"1. **A is correct**: The marketing department oversees the Marketing Mix (4Ps):\n   - **(1) is correct**: Conducting customer surveys is part of market research.\n   - **(2) is correct**: Deciding product pricing belongs to Pricing strategies.\n   - **(3) is incorrect**: Paying salaries or bonuses is the responsibility of HR or Finance departments.\nThis topic falls under the **2025+ New Syllabus Paper 1 Compulsory Part '1(b) Basics of Management: Key Business Functions'**."},
{q:14,year:2013,y:2013,top:"不同企業擁有權類型的財務報告編製 —— 損益表項目與折扣分辨",topEn:"Forms of Ownership Financial Reporting —— Income Statement items and discount distinction",outc:true,reason:"自 2025 年起，損益表科目的確認、貿易折扣與現金折扣之分辨，已全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Since 2025, detailed components of financial statements and trade vs. cash discount treatments are tested under Elective Module Paper 2A.",cn:"14. 下列哪項是企業損益表提供的資料？\n(1) 會計年度內賺取的利潤\n(2) 高級經理出席海外會議的機票費用\n(3) 給予熟客的貿易折扣\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"14. Which of the following items are to be provided in the income statement of a business?\n(1) profits earned during the accounting period\n(2) air freight charges for senior managers attending overseas meetings\n(3) trade discounts allowed to regular customers\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"39%",exCn:"1. **A 正確**（正確率 39%）：\n   - **(1) 正確**：損益表的基本目的即是呈現該會計年度內賺取的淨利潤。\n   - **(2) 正確**：機票費用屬於日常營運的旅費/行政費用，應列示在損益表中。\n   - **(3) 錯誤**：**貿易折扣不會出現在帳冊內，亦不呈現在損益表中**。貿易折扣在交易發生時已直接在發票中扣減。",exEn:"1. **A is correct** (39% passing rate):\n   - **(1) is correct**: The income statement reports net profits earned during the period.\n   - **(2) is correct**: Air freight charges are operating expenses listed on the income statement.\n   - **(3) is incorrect**: **Trade discounts are never recorded in ledger books or shown on the income statement**. They are deducted from the list price immediately on the invoice."},
{q:15,year:2013,y:2013,top:"基礎個人理財 —— 金錢的時間值（名義與實際利率、複利頻率計算）",topEn:"Basics of Personal Financial Management —— Time Value of Money (Nominal vs. effective rates and compounding frequencies)",cn:"15. 某銀行推出下列儲蓄計劃：\n計劃 I：利率 每年5%，複利息計算頻率 每季一次\n計劃 II：利率 每年5.5%，複利息計算頻率 每半年一次\n計劃 III：利率 每年6%，複利息計算頻率 每年一次\n兩年後，哪項計劃提供的回報最高？\n\nA. 計劃 I\nB. 計劃 II\nC. 計劃 III\nD. 計劃 I和計劃 III",en:"15. A bank launches the following savings plans:\nPlan I: Interest rate 5% per annum, compounded quarterly\nPlan II: Interest rate 5.5% per annum, compounded half-yearly\nPlan III: Interest rate 6% per annum, compounded yearly\nWhich plan(s) offer(s) the highest return after two years?\n\nA. Plan I\nB. Plan II\nC. Plan III\nD. Plan I and Plan III",ans:"C",rate:"63%",exCn:"1. **C 正確**：比較實際年利率（EAR）：\n   - **計劃 I**：EAR = (1 + 5%/4)^4 - 1 ≈ 5.09%\n   - **計劃 II**：EAR = (1 + 5.5%/2)^2 - 1 ≈ 5.58%\n   - **計劃 III**：EAR = 6%\n   計劃 III 的實際年利率最高，在 2 年存期內累積回報最高。\n本題屬於 **2025 年及以後新考綱必修部分「1(d) 基礎個人理財：金錢的時間值」**。",exEn:"1. **C is correct**: Comparing Effective Annual Rates (EAR):\n   - **Plan I**: EAR ≈ 5.09%\n   - **Plan II**: EAR ≈ 5.58%\n   - **Plan III**: EAR = 6%\n   Plan III provides the highest effective annual return.\nThis topic falls under the **2025+ New Syllabus Paper 1 Compulsory Part '1(d) Basics of Personal Financial Management: Time Value of Money'**."},
{q:16,year:2013,y:2013,top:"營商環境 —— 香港的營商環境與特徵（吸引跨國公司的優勢）",topEn:"Business Environment —— Hong Kong's Business Environment (Factors attracting multinational headquarters)",cn:"16. 下列哪項可促使跨國貿易公司把總部遷移至香港？\n(1) 香港的跨國公司數目較中小型企業的為多\n(2) 香港與其他亞洲城市之間的運輸網絡良好\n(3) 香港的利得稅率較低\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"16. Which of the following would encourage a multi-national trading company to move its headquarters to Hong Kong?\n(1) larger number of multi-national companies than small and medium enterprises in Hong Kong\n(2) good transportation network between Hong Kong and other Asian cities\n(3) lower profits tax rate in Hong Kong\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"85%",exCn:"1. **C 正確**：\n   - **(1) 錯誤**：香港 98% 以上屬於中小型企業，跨國公司數量遠少於中小企。\n   - **(2) 正確**：香港作為國際航運與航空樞紐，交通網絡四通八達。\n   - **(3) 正確**：香港利得稅率在全球主要商業城市中處於極低水平。\n本題屬於 **2025 年及以後新考綱必修部分「1(a) 營商環境：香港的營商環境及特徵」**。",exEn:"1. **C is correct**:\n   - **(1) is incorrect**: Over 98% of businesses in Hong Kong are SMEs.\n   - **(2) is correct**: Hong Kong possesses an exceptional transport network connecting it to other major Asian cities.\n   - **(3) is correct**: Hong Kong provides highly competitive profits tax rates.\nThis topic falls under the **2025+ New Syllabus Paper 1 Compulsory Part '1(a) Business Environment: Hong Kong's Business Environment and Economy'**."},
{q:17,year:2013,y:2013,top:"基礎個人理財 —— 策劃個人理財及投資（香港主要金融監管機構分工）",topEn:"Basics of Personal Financial Management —— Personal Financial Planning & Investment (Roles of regulatory authorities)",cn:"17. _____ 促進銀行體系的穩定與健全，而 _____ 則執行本港上市、交易及結算的規則。\nA. 香港金融管理局 / 證券及期貨事務監察委員會\nB. 香港金融管理局 / 香港交易及結算所有限公司\nC. 證券及期貨事務監察委員會 / 香港金融管理局\nD. 證券及期貨事務監察委員會 / 香港交易及結算所有限公司",en:"17. _____ promotes the stability and integrity of the banking system while _____ administers listing, trading and clearing rules in Hong Kong.\nA. Hong Kong Monetary Authority / Securities and Futures Commission\nB. Hong Kong Monetary Authority / Hong Kong Exchanges and Clearing Limited\nC. Securities and Futures Commission / Hong Kong Monetary Authority\nD. Securities and Futures Commission / Hong Kong Exchanges and Clearing Limited",ans:"B",rate:"72%",exCn:"1. **B 正確**：\n   - **第一個空格**：負責維持貨幣體系健全與穩定、監管銀行業的是**香港金融管理局（金管局，HKMA）**。\n   - **第二個空格**：負責執行和管理證券上市、市場交易及清算結算規則的是**香港交易及結算所有限公司（港交所，HKEX）**。\n本題屬於 **2025 年及以後新考綱必修部分「1(a) 營商環境：香港的金融服務與監管」**。",exEn:"1. **B is correct**:\n   - **First blank**: The authority responsible for promoting banking system stability is the **Hong Kong Monetary Authority (HKMA)**.\n   - **Second blank**: The exchange operator that administers listing, trading, and clearing rules is **Hong Kong Exchanges and Clearing Limited (HKEX)**.\nThis topic falls under the **2025+ New Syllabus Paper 1 Compulsory Part '1(a) Business Environment: Financial institutions and services'**."},
{q:18,year:2013,y:2013,top:"試算表 —— 科目借貸餘額歸類與銀行透支推導",topEn:"Trial Balance —— Account balance classifications and overdraft calculations",outc:true,reason:"自 2025 年起，會計等式之運算及分類帳、試算表之算術編製與平衡，已全數歸入選修部分（會計單元）Paper 2A 考核。",reasonEn:"Since 2025, trial balance preparation, ledger account classifications, and balancing arithmetic are tested under Elective Module Paper 2A.",cn:"18. 景光公司2012年12月31日的帳戶餘額如下：\n資本 $199 800 | 現金 $25 000 | 應收貨款 $10 500\n應付貨款 $5 500 | 銷貨 $232 000 | 購貨 $108 000\n存貨(2012年1月1日) $15 000 | 銷貨折扣 $5 600\n辦公室設備 $280 000 | 行政費用 $32 000\n購貨退出 $6 800 | 佣金收入 $8 700 | 購貨運費 $4 500\n銀行存款 ?\n2012年12月31日，銀行存款帳戶的結餘是多少？\nA. $16 600\nB. $27 800 (透支)\nC. $30 200\nD. $41 400 (透支)",en:"18. The following account balances as at 31 December 2012 relate to King Light Company:\nCapital $199 800 | Cash $25 000 | Trade receivables $10 500\nTrade payables $5 500 | Sales $232 000 | Purchases $108 000\nInventory, 1 January 2012 $15 000 | Discounts allowed $5 600\nOffice equipment $280 000 | Administrative expenses $32 000\nReturns outwards $6 800 | Commission received $8 700 | Carriage inwards $4 500\nCash at bank ?\nWhat is the balance of the cash at bank account as at 31 December 2012?\nA. $16 600\nB. $27 800 (overdraft)\nC. $30 200\nD. $41 400 (overdraft)",ans:"B",rate:"49%",exCn:"1. **B 正確**：\n   - **借方項目**：$25,000 + $10,500 + $108,000 + $15,000 + $5,600 + $280,000 + $32,000 + $4,500 = **$480,600**。\n   - **貸方項目**：$199,800 + $5,500 + $232,000 + $6,800 + $8,700 = **$452,800**。\n   - **銀行存款餘額**：$480,600 - $452,800 = **$27,800（貸方結餘 = 銀行透支）**。",exEn:"1. **B is correct**:\n   - **Debit Balances**: $25,000 + $10,500 + $108,000 + $15,000 + $5,600 + $280,000 + $32,000 + $4,500 = **$480,600**.\n   - **Credit Balances**: $199,800 + $5,500 + $232,000 + $6,800 + $8,700 = **$452,800**.\n   - **Bank balance**: $480,600 - $452,800 = **$27,800 (credit balance = overdraft)**."},
{q:19,year:2013,y:2013,top:"不同企業擁有權類型的財務報告編製 —— 貿易損益與毛利運算",topEn:"SFP and Income Statement —— Profit and Loss Calculations (Gross profit)",outc:true,reason:"自 2025 年起，損益表之細部項目核算、毛利與折扣之會計報表調整，已全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Since 2025, trading account computations, inventory valuations, and carriage/discount treatments are tested under Elective Module Paper 2A.",cn:"19. 如果2012年12月31日的存貨為$13400，該年度的毛利是多少？\nA. $117 900\nB. $122 400\nC. $124 700\nD. $129 200",en:"19. If the inventory as at 31 December 2012 was $13 400, what is the gross profit of the company for that year?\nA. $117 900\nB. $122 400\nC. $124 700\nD. $129 200",ans:"C",rate:"69%",exCn:"1. **C 正確**：\n   - **淨銷貨額** = $232,000\n   - **銷貨成本** = $15,000 + $108,000 + $4,500 - $6,800 - $13,400 = **$107,300**\n   - **毛利** = $232,000 - $107,300 = **$124,700**（選 C）",exEn:"1. **C is correct**:\n   - **Net Sales** = $232,000\n   - **COGS** = $15,000 + $108,000 + $4,500 - $6,800 - $13,400 = **$107,300**\n   - **Gross Profit** = $232,000 - $107,300 = **$124,700** (Option C)"},
{q:20,year:2013,y:2013,top:"基礎個人理財 —— 策劃個人理財及投資（收支預算與儲蓄控制）",topEn:"Basics of Personal Financial Management —— Personal Financial Planning (Budgeted vs. actual savings)",cn:"20. 以下為白德2013年4月的個人預算和實際收支：\n預算收入：薪金 $6000 | 零用錢 $1000（預算總收入 = $7000）\n實際收入：薪金 $6000 | 零用錢 $1000（實際總收入 = $7000）\n預算支出：交通費 $500 | 書籍及文具 $1050 | 流動電話費 $150 | 膳食費 $900 | 娛樂消費 $850\n實際支出：交通費 $560 | 書籍及文具 $1480 | 流動電話費 $150 | 膳食費 $810 | 娛樂消費 $970\n白德2013年4月的預算儲蓄為 _____，較同月的實際儲蓄為 _____。\nA. $3030......少\nB. $3030......多\nC. $3550......少\nD. $3550......多",en:"20. Following are the personal budget and actual cash flows of Peter for April 2013:\nBudgeted Income: Salary $6000 | Pocket money $1000 (Total = $7000)\nActual Income: Salary $6000 | Pocket money $1000 (Total = $7000)\nBudgeted Expenses: Transport $500 | Books & Stationery $1050 | Mobile phone $150 | Meals $900 | Entertainment $850\nActual Expenses: Transport $560 | Books & Stationery $1480 | Mobile phone $150 | Meals $810 | Entertainment $970\nThe budgeted saving of Peter for April 2013 is _____, which is _____ than his actual saving for the month.\nA. $3030...... less\nB. $3030...... more\nC. $3550...... less\nD. $3550...... more",ans:"D",rate:"80%",exCn:"1. **D 正確**：\n   - **預算儲蓄** = $7,000 - $3,450 = **$3,550**\n   - **實際儲蓄** = $7,000 - $3,970 = **$3,030**\n   - 預算儲蓄（$3,550）比實際儲蓄（$3,030）**多了 $520**，即較實際儲蓄為「多」。\n本題屬於 **2025 年及以後新考綱必修部分「1(d) 基礎個人理財：個人理財計劃」**。",exEn:"1. **D is correct**:\n   - **Budgeted Savings** = $7,000 - $3,450 = **$3,550**\n   - **Actual Savings** = $7,000 - $3,970 = **$3,030**\n   - Budgeted saving ($3,550) is **more** than actual saving ($3,030).\nThis topic falls under the **2025+ New Syllabus Paper 1 Compulsory Part '1(d) Basics of Personal Financial Management: Personal Financial Planning'**."},
{q:21,year:2013,y:2013,top:"有效溝通的過程（訊息解碼）",topEn:"Basics of Management —— Effective Communication (The process of decoding)",outc:true,reason:"自 2025 年起，整個「有效溝通（Effective Communication）」章節已從文憑試最新必修考綱中完全刪除。",reasonEn:"Since 2025, the entire chapter of 'Effective Communication' has been completely removed from the BAFS Compulsory Part syllabus.",cn:"21. 區小姐發電郵邀請彭先生出席她企業的開幕禮。以下哪項是這溝通過程的正確描述？\nA. 反饋必會出現\nB. 信息未經編碼\nC. 信息需要解碼\nD. 電腦鍵盤是溝通渠道",en:"21. Alice sends an email to invite Benny to attend the opening ceremony of her business. Which of the following descriptions relating to the above communication process is correct?\nA. there must be a feedback\nB. the message was not encoded\nC. the message has to be decoded\nD. the computer keyboard is the channel",ans:"C",rate:"57%",exCn:"1. **C 正確**：\n   - **A 錯誤**：彭先生可能選擇不作任何回覆，反饋並非必然會出現。\n   - **B 錯誤**：發送電郵時必須將思維轉化成文字，這本身就是編碼過程。\n   - **C 正確**：收到電郵後必須閱讀並理解，這正是解碼過程。\n   - **D 錯誤**：電腦鍵盤只是輸入設備，溝通渠道是電子郵件系統或互聯網。",exEn:"1. **C is correct**:\n   - **A is incorrect**: Feedback is not guaranteed to occur.\n   - **B is incorrect**: Drafting an email requires converting thoughts into words, which is encoding.\n   - **C is correct**: Reading and interpreting the email is the process of decoding.\n   - **D is incorrect**: The keyboard is an input device; the channel is the email system."},
{q:22,year:2013,y:2013,top:"營商環境 —— 香港的營商環境及特徵（中港經濟關係與貿易合作）",topEn:"Business Environment —— Hong Kong's Business Environment (Sino-HK trade relations and economic pacts)",cn:"22. 下列哪項為正確的陳述？\n(1) 香港是中國內地的離岸人民幣業務中心。\n(2) 中國內地是香港商品轉口的主要來源地和目的地。\n(3) 更緊密經貿關係安排 (CEPA)目的是為內地企業在香港籌集資金。\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"22. Which of the following statements are correct?\n(1) Hong Kong is an offshore Renminbi Business Centre of Mainland China.\n(2) The main origin and destination of Hong Kong's re-exports of goods are Mainland China.\n(3) \"Closer Economic Partnership Arrangement\" (CEPA) aims at raising capital in Hong Kong for Mainland enterprises.\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"49%",exCn:"1. **A 正確**：\n   - **(1) 正確**：香港是全球最大的離岸人民幣業務樞紐。\n   - **(2) 正確**：中國內地是香港商品轉口貿易的最大來源地和目的地。\n   - **(3) 錯誤**：CEPA 的核心宗旨是促進兩地貨物貿易與服務貿易自由化，而非協助內地企業在香港籌集資金。\n本題屬於 **2025 年及以後新考綱必修部分「1(a) 營商環境：香港經濟特徵與中港商業關係（CEPA）」**。",exEn:"1. **A is correct**:\n   - **(1) is correct**: Hong Kong is the largest offshore Renminbi business and clearing hub.\n   - **(2) is correct**: Mainland China is the most significant origin and destination of Hong Kong's re-exports.\n   - **(3) is incorrect**: CEPA aims to liberalize trade, not to raise capital for Mainland enterprises.\nThis topic falls under the **2025+ New Syllabus Paper 1 Compulsory Part '1(a) Business Environment: Hong Kong's Business Environment (CEPA and trade)'**."},
{q:23,year:2013,y:2013,top:"中小型企業 —— 企業家與企業家精神的特徵",topEn:"Small and Medium Enterprises —— Entrepreneurship and Characteristics of Entrepreneurs",cn:"23. 所有企業家均：\nA. 要承擔風險以賺取利潤。\nB. 以自己的資本成立企業。\nC. 以新產品進入市場。\nD. 具備豐富的行業知識和經驗。",en:"23. All entrepreneurs:\nA. earn profits by taking business risks.\nB. start businesses with their own capital.\nC. enter the market with new products.\nD. possess rich industry knowledge and experience.",ans:"A",rate:"72%",exCn:"1. **A 正確**：企業家的最核心本質定義是勇於在不確定的市場環境中承擔商業風險，並藉此賺取利潤。\n2. **B 錯誤**：資金來源多元，可透過銀行貸款、風險投資等，不限於使用私人自己資本。\n3. **C 錯誤**：進入市場不必然要提供全新研發產品，也可透過改良服務模式。\n4. **D 錯誤**：許多初創企業家在起步時未必擁有極其豐富的行業知識及經驗。\n本題屬於 **2025 年及以後新考綱必修部分「1(b) 基礎管理：中小型企業與企業家精神」**。",exEn:"1. **A is correct**: The ultimate characteristic of all entrepreneurs is their willingness to take calculated business risks to make profits.\n2. **B is incorrect**: Entrepreneurs can utilize bank loans, venture capital, or government grants.\n3. **C is incorrect**: Entrepreneurs can succeed by introducing business model innovations.\n4. **D is incorrect**: Many successful startups are launched by founders who lack rich industry knowledge initially.\nThis topic falls under the **2025+ New Syllabus Paper 1 Compulsory Part '1(b) Basics of Management: Entrepreneurship'**."},
{q:24,year:2013,y:2013,top:"基礎個人理財 —— 消費者信貸（私人分期貸款平息率之計算）",topEn:"Basics of Personal Financial Management —— Consumer Credit (Calculating flat rate of personal loans)",cn:"24. 如果某銀行向你提供一個以平息安排的私人分期貸款計劃，貸款金額為$10000，為期四年，還款時間表如下：\n第1年年終還款：$2900\n第2年年終還款：$2900\n第3年年終還款：$2900\n第4年年終還款：$2900\n還款總額：$11600\n這分期貸款計劃的每年平息率是多少？\nA. 3.45%\nB. 4%\nC. 7.25%\nD. 16%",en:"24. If a bank offers you a personal installment loan under a flat rate arrangement, the loan amount is $10 000, for four years, and the repayment schedule is as follows:\nYear 1 end repayment: $2900\nYear 2 end repayment: $2900\nYear 3 end repayment: $2900\nYear 4 end repayment: $2900\nTotal Repayment: $11600\nWhat is the annual flat rate of this installment loan?\nA. 3.45%\nB. 4%\nC. 7.25%\nD. 16%",ans:"B",rate:"42%",exCn:"1. **B 正確**：\n   - **第一步**：總利息 = $11,600 - $10,000 = **$1,600**\n   - **第二步**：每年利息 = $1,600 / 4 = **$400**\n   - **第三步**：每年平息率 = ($400 / $10,000) × 100% = **4%**\n本題屬於 **2025 年及以後新考綱必修部分「1(d) 基礎個人理財：消費者信貸」**。",exEn:"1. **B is correct**:\n   - **Step 1**: Total interest = $11,600 - $10,000 = **$1,600**\n   - **Step 2**: Annual interest = $1,600 / 4 = **$400**\n   - **Step 3**: Annual flat rate = ($400 / $10,000) × 100% = **4%**\nThis topic falls under the **2025+ New Syllabus Paper 1 Compulsory Part '1(d) Basics of Personal Financial Management: Consumer Credit'**."},
{q:25,year:2013,y:2013,top:"基礎個人理財 —— 策劃個人理財及投資（保本投資工具之抉擇）",topEn:"Basics of Personal Financial Management —— Personal Financial Planning & Investment (Choosing capital preservation instruments)",cn:"25. 馬莉是一名中五學生，剛從暑期工賺得$8000，她打算用這筆錢支付一年後的大學學費。如果她希望保本，並同時賺取一些回報，下列哪項工具最適合她？\nA. 往來存款\nB. 定期存款\nC. 藍籌股\nD. 認股權證",en:"25. Mary is a Form 5 student who has just earned $8 000 from her summer job. She plans to use this money to pay her university tuition fees one year later. If she wants to preserve her capital and at the same time looks for some returns, which of the following instruments is most suitable to her?\nA. current account\nB. term deposit\nC. blue chips\nD. warrants",ans:"B",rate:"72%",exCn:"1. **B 正確**：\n   - **A 錯誤**：往來存款幾乎沒有任何利息回報，無法滿足「賺取回報」的需求。\n   - **B 正確**：定期存款具有 100% 本金安全，且存期一年可鎖定固定的利息回報。\n   - **C 及 D 錯誤**：藍籌股和認股權證均屬於價格波動劇烈的權益或衍生工具，存在嚴重的本金虧損風險。\n本題屬於 **2025 年及以後新考綱必修部分「1(d) 基礎個人理財：策劃個人理財及投資」**。",exEn:"1. **B is correct**:\n   - **A is incorrect**: A current account offers negligible or zero interest.\n   - **B is correct**: A term deposit provides 100% capital guarantee with a fixed interest return.\n   - **C and D are incorrect**: Blue chip stocks and warrants are subject to high market price volatility.\nThis topic falls under the **2025+ New Syllabus Paper 1 Compulsory Part '1(d) Basics of Personal Financial Management: Investment Instruments'**."},
{q:26,year:2013,y:2013,top:"財務報表分析 —— 企業盈利能力比率與營運費用交叉分析",topEn:"Financial Ratio Analysis —— Cross-comparison of profitability and operating expenses",outc:true,reason:"自 2025 年起，會計比率的核算、毛利率與淨利率之對比及企業財務表現分析，已全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Since 2025, the calculation and analysis of profitability ratios are tested under Elective Module Paper 2A.",cn:"26. 與發達行相比，下列哪項對隆興行財務表現的評論是正確的？\n隆興行：營業額 $45 000 000 | 毛利率 28% | 淨利率 19% | 流動比率 1.81:1 | 速動比率 0.75:1\n發達行：營業額 $52 000 000 | 毛利率 25% | 淨利率 22% | 流動比率 2.43:1 | 速動比率 1.65:1\n\nA. 毛利較高\nB. 淨利較高\nC. 銷貨成本較高\nD. 營運費用較高",en:"26. Which of the following comments on the financial performance of Lung Hing Company as compared with Fat Tat Company is correct?\nLung Hing Company: Turnover $45 000 000 | Gross profit ratio 28% | Net profit ratio 19% | Current ratio 1.81:1 | Liquid ratio 0.75:1\nFat Tat Company: Turnover $52 000 000 | Gross profit ratio 25% | Net profit ratio 22% | Current ratio 2.43:1 | Liquid ratio 1.65:1\n\nA. gross profit is higher\nB. net profit is higher\nC. cost of goods sold is higher\nD. operating expenses are higher",ans:"D",rate:"47%",exCn:"1. **D 正確**：\n   - **A 錯誤**：隆興行毛利 = $45M × 28% = $12.6M；發達行 = $52M × 25% = $13M。隆興行較低。\n   - **B 錯誤**：隆興行淨利 = $45M × 19% = $8.55M；發達行 = $52M × 22% = $11.44M。隆興行較低。\n   - **C 錯誤**：隆興行銷貨成本 = $45M × 72% = $32.4M；發達行 = $52M × 75% = $39M。隆興行較低。\n   - **D 正確**：隆興行營運費用 = $12.6M - $8.55M = **$4.05M**；發達行 = $13M - $11.44M = **$1.56M**。隆興行較高。",exEn:"1. **D is correct**:\n   - **A is incorrect**: Lung Hing's gross profit = $12.6M; Fat Tat's = $13.0M. Lung Hing's is lower.\n   - **B is incorrect**: Lung Hing's net profit = $8.55M; Fat Tat's = $11.44M. Lung Hing's is lower.\n   - **C is incorrect**: Lung Hing's COGS = $32.4M; Fat Tat's = $39.0M. Lung Hing's is lower.\n   - **D is correct**: Lung Hing's operating expenses = **$4.05M**; Fat Tat's = **$1.56M**. Lung Hing's is higher."},
{q:27,year:2013,y:2013,top:"財務報表分析 —— 變現能力與存貨積壓資金佔比分析",topEn:"Financial Ratio Analysis —— Liquidity and capital tied up in inventory",outc:true,reason:"自 2025 年起，流動比率與速動比率之核算及變現能力交叉比對分析，已全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Since 2025, liquidity ratios and comparative analysis of working capital are tested under Elective Module Paper 2A.",cn:"27. 與發達行相比，下列哪項對隆興行變現能力的評論是正確的？隆興行______。\nA. 積壓於存貨的資金比例較高\nB. 的變現能力較高\nC. 有較多流動資產，以應付短期債務\nD. 的流動負債較少",en:"27. Which of the following comments on the liquidity of Lung Hing Company as compared with Fat Tat Company is correct? Lung Hing Company:\nA. has a higher proportion of capital tied up in inventory.\nB. has a higher liquidity.\nC. has more current assets to meet short-term liabilities.\nD. has fewer current liabilities.",ans:"A",rate:"60%",exCn:"1. **A 正確**：\n   - 隆興行的流動比率（1.81:1）及速動比率（0.75:1）均低於發達行，排除 B。\n   - **關鍵差異在於存貨**：\n     - 隆興行：流動比率 - 速動比率 = 1.81 - 0.75 = **1.06**\n     - 發達行：流動比率 - 速動比率 = 2.43 - 1.65 = **0.78**\n   - 這證實隆興行有更大比例資金鎖定在存貨中。",exEn:"1. **A is correct**:\n   - Lung Hing's current and liquid ratios are both lower than Fat Tat's, eliminating B.\n   - **The differentiator is inventory**:\n     - Lung Hing: Current - Liquid = 1.81 - 0.75 = **1.06**\n     - Fat Tat: Current - Liquid = 2.43 - 1.65 = **0.78**\n   - This confirms Lung Hing has a significantly higher proportion of capital tied up in inventory."},
{q:28,year:2013,y:2013,top:"複式記帳法 —— 商業交易在分類帳帳戶中的借貸方向判定",topEn:"Double-entry Bookkeeping —— Verifying debit and credit entries in ledger accounts",outc:true,reason:"自 2025 年起，各類商業交易之複式記帳借貸分錄與帳戶確認，已全數歸入選修部分（會計單元）Paper 2A 考核。",reasonEn:"Since 2025, double-entry bookkeeping, ledger account debits and credits are tested under Elective Module Paper 2A.",cn:"28. 下列哪項複式記帳是正確的？\n(1) 從銀行戶口提取現金$20000，供企業使用 | 借記：提用 | 貸記：銀行存款\n(2) 以現金支付雜費$3000 | 借記：雜費 | 貸記：現金\n(3) 經銀行戶口收取銀行貸款$200000 | 借記：銀行存款 | 貸記：銀行貸款\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"28. Which of the following double entries are correct?\n(1) Withdrew cash of $20 000 from bank account for business use | Account to be debited: Drawings | Account to be credited: Bank\n(2) Paid sundry expenses of $3 000 in cash | Account to be debited: Sundry expenses | Account to be credited: Cash\n(3) Received a bank loan of $200 000 through bank account | Account to be debited: Bank | Account to be credited: Bank loan\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"58%",exCn:"1. **C 正確**：\n   - **(1) 錯誤**：從銀行提取現金「供企業使用」應借記「現金」；貸記「銀行存款」。只有東主私人用途才借記「提用」。\n   - **(2) 正確**：支付雜費，費用增加借記「雜費」；現金減少貸記「現金」。\n   - **(3) 正確**：經銀行收取貸款，銀行資產增加借記「銀行存款」；負債增加貸記「銀行貸款」。",exEn:"1. **C is correct**:\n   - **(1) is incorrect**: Withdrawing cash \"for business use\" should be: Dr. Cash; Cr. Bank. Drawings is only for personal use.\n   - **(2) is correct**: Dr. Sundry expenses; Cr. Cash.\n   - **(3) is correct**: Dr. Bank; Cr. Bank loan."},
{q:29,year:2013,y:2013,top:"基礎管理 —— 主要商業功能（資訊管理對營運與溝通之支援）",topEn:"Basics of Management —— Key Business Functions (Support of information management on sales and communication)",cn:"29. 一家貿易公司向銷售團隊每位員工提供備有流動網絡連線功能的筆記簿型電腦。這安排對公司有甚麼益處？\n(1) 有助更新銷售數據\n(2) 加強銷售團隊員工之間的信息交流\n(3) 促進與客戶的溝通\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"29. A trading company provides each of its sales representatives with a laptop computer equipped with mobile network connection. What are the benefits of this arrangement to the company?\n(1) facilitate the update of sales data\n(2) enhance the exchange of information among sales representatives\n(3) improve the communication with customers\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"65%",exCn:"1. **D 正確**：\n   - **(1) 正確**：銷售代表可即時連線公司系統，更新銷售數據與訂單庫存資訊。\n   - **(2) 正確**：透過電子郵件或內部網絡，加強銷售同仁之間的信息交流。\n   - **(3) 正確**：能即時向客戶展示產品目錄、解答疑問並立即下單。\n本題屬於 **2025 年及以後新考綱必修部分「1(b) 基礎管理：主要商業功能（資訊管理）」**。",exEn:"1. **D is correct**:\n   - **(1) is correct**: Representatives can log into the company's database in real-time.\n   - **(2) is correct**: High-speed internet enhances communication and information exchange.\n   - **(3) is correct**: Sales representatives can present catalogues and record orders immediately.\nThis topic falls under the **2025+ New Syllabus Paper 1 Compulsory Part '1(b) Basics of Management: Information Management'**."},
{q:30,year:2013,y:2013,top:"會計的目的及角色 —— 會計的基本定義與四大核心功能分類",topEn:"Purpose of Accounting —— Core tasks and classifications of accounting functions",outc:true,reason:"自 2025 年起，會計的定義、角色與記錄、分類、歸納、溝通四大功能之原理，已全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Since 2025, introductory accounting definitions, functions, and the accounting cycle are tested under Elective Module Paper 2A.",cn:"30. 下列哪項是會計的工作？\n(1) 為商業交易作分類和記錄\n(2) 採購系統裝備保安措施\n(3) 為公司的銷售表現作週期性總結和匯報\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"30. Which of the following are tasks of accounting?\n(1) classifying and recording business transactions\n(2) equipping the purchasing system with security measures\n(3) summarising and reporting the performance of the company's sales periodically\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"89%",exCn:"1. **B 正確**：\n   - **(1) 正確**：為商業交易作分類及記錄屬於會計最基礎的分類與記錄功能。\n   - **(2) 錯誤**：為採購系統裝備保安措施屬於資訊技術與資訊管理部門的技術職掌。\n   - **(3) 正確**：定期對銷售業績進行總結並編製報表，屬於會計的歸納與溝通功能。",exEn:"1. **B is correct**:\n   - **(1) is correct**: Classifying and recording transactions constitutes the core bookkeeping functions.\n   - **(2) is incorrect**: Installing cybersecurity measures is a task for the IT department.\n   - **(3) is correct**: Summarizing performances and preparing reports highlights accounting's summarising and communicating functions."},
{q:1,year:2014,y:2014,top:"營商環境 —— 企業擁有權類型（有限公司特徵）",topEn:"Business Environment —— Forms of Business Ownership (Characteristics of limited companies)",cn:"1. 下列哪項有關香港的有限公司的陳述是正確的？\n(1) 有限公司是一個獨立的法定個體。\n(2) 有限公司較獨資商號享有較低的利得稅稅率。\n(3) 有限公司必須在報章上發布其財務報表。\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. (1)、(2)及(3)",en:"1. Which of the following statements about limited companies in Hong Kong is/are correct?\n(1) A limited company is a separate legal entity.\n(2) Limited companies enjoy a lower profits tax rate than sole proprietorships.\n(3) Limited companies are required to publish their financial statements in a newspaper.\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"83%",exCn:"1. **(1) 正確**：有限公司具有「獨立法定個體」地位，在法律上獨立於其股東。\n2. **(2) 錯誤**：有限公司適用的利得稅率（兩級制下首200萬為8.25%，其後為16.5%）高於非法團企業（首200萬為7.5%，其後為15%）。\n3. **(3) 錯誤**：只有「公眾有限公司」才需要依法公開披露財務報表，大部分有限公司均為「私人有限公司」。\n故只有 (1) 正確，選 A。",exEn:"1. **(1) is correct**: A limited company is a separate legal entity distinct from its owners.\n2. **(2) is incorrect**: The profits tax rate for limited companies (8.25% / 16.5%) is higher than that for unincorporated businesses (7.5% / 15%).\n3. **(3) is incorrect**: Only public limited companies are required to publish their financial statements.\nTherefore, only (1) is correct, making A the correct answer."},
{q:2,year:2014,y:2014,top:"基礎個人理財 —— 金融服務消費者的權利與責任（監管機構職能）",topEn:"Basics of Personal Financial Management —— Rights and Responsibilities of Financial Consumers (Functions of regulators)",cn:"2. 如投資者欲就經紀在股票交易中的不當行為提出投訴，他應向下列哪個機構提出？\nA. 香港金融管理局\nB. 證券及期貨事務監察委員會\nC. 香港交易及結算所有限公司\nD. 投資者賠償有限公司",en:"2. If an investor wants to complain about the misconduct of his broker in a share transaction, which of the following organisations should he turn to?\nA. Hong Kong Monetary Authority\nB. Securities and Futures Commission\nC. Hong Kong Exchanges and Clearing Limited\nD. Investor Compensation Company Limited",ans:"B",rate:"56%",exCn:"1. **證券及期貨事務監察委員會（證監會，SFC）**是負責監管香港證券及期貨市場的法定獨立機構。調查及處理有關持牌中介人的不當行為屬於其核心監管職能。\n2. 金管局（A）監管銀行業；港交所（C）營運交易平台；投資者賠償公司（D）負責處理因中介人違責倒閉而引起的賠償申索。",exEn:"1. The **Securities and Futures Commission (SFC)** is the statutory regulatory body responsible for regulating Hong Kong's securities and futures markets.\n2. The HKMA (A) regulates banking; HKEX (C) operates the trading platform; the Investor Compensation Company (D) handles compensation claims in cases of intermediary default."},
{q:3,year:2014,y:2014,top:"營商環境 —— 商業道德及社會責任（企業履行社會責任的好處）",topEn:"Business Environment —— Business Ethics and Social Responsibility (Benefits of corporate social responsibility)",cn:"3. 承擔社會責任的企業會有下列哪些好處？\n(1) 降低生產成本\n(2) 提高企業聲譽\n(3) 吸引同樣關注社會責任的顧客\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"3. Which of the following are benefits of being a socially responsible business?\n(1) lower production costs\n(2) better business reputation\n(3) attraction of customers who are also concerned about social responsibility\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"91%",exCn:"1. **(1) 錯誤**：履行社會責任通常在短期內會「增加」而非降低企業的生產或營運成本。\n2. **(2)及(3) 正確**：實踐 CSR 能顯著提升企業的聲譽（(2)），並能吸引重視環保與社會正義的消費者（(3)）。\n故只有 (2) 及 (3) 正確，選 C。",exEn:"1. **(1) is incorrect**: Fulfilling CSR usually \"increases\" rather than lowers production costs in the short run.\n2. **(2) and (3) are correct**: CSR enhances a firm's public image and helps build a loyal customer base among socially conscious consumers.\nTherefore, (2) and (3) are benefits, making C the correct answer."},
