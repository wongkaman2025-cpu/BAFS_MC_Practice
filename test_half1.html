{q:4,year:2018,y:2018,top:"[out c] 複式記帳法 —— 商業交易之過帳與科目分錄",topEn:"[out c] Double-entry Bookkeeping —— Recording Transactions in Ledger Accounts",outc:true,reason:"自 2025 年起，複式記帳法在分類帳上的記錄，已全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, double-entry bookkeeping principles and ledger accounts recording are tested in the Accounting Elective Module Paper 2A.",cn:"4. 下列哪項複式記帳是正確的？\n交易 | 借記帳戶 | 貸記帳戶\n(1) 收到銀行存款利息 | 利息收益 | 銀行存款\n(2) 賒購辦公室用的文具 | 文具費用 | 應付帳款\n(3) 東主引入他的汽車供商號使用 | 汽車 | 提用\nA. 只有(1)\nB. 只有(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"4. Which of the following double entries is correct?\nTransaction | Account to be debited | Account to be credited\n(1) Received interest on bank deposit | Interest income | Bank\n(2) Purchased office stationery on credit | Stationery expenses | Accounts payable\n(3) Owner introduced his motor car for business use | Motor vans | Drawings\nA. (1) only\nB. (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"74%",exCn:"1. (2) 正確：賒購辦公室文具，費用增加「借記：文具費用」；負債增加「貸記：應付帳款」，分錄正確。\n2. (1) 錯誤：收到利息，應「借記：銀行存款（資產增加）」；「貸記：利息收益（收益增加）」。\n3. (3) 錯誤：東主引入個人汽車，資產增加「借記：汽車/客貨車」；東主投入資本應「貸記：資本（Capital）」，「提用」僅在東主將商號資產取用自用時使用。",exEn:"1. (2) is correct: Purchasing stationery on credit increases expenses (Debit: Stationery expenses) and increases liabilities (Credit: Accounts payable). This entry is correct.\n2. (1) is incorrect: Receiving deposit interest increases assets (Debit: Bank) and increases revenue (Credit: Interest income).\n3. (3) is incorrect: Introducing personal motor car increases assets (Debit: Motor vans) and increases owner's equity (Credit: Capital). Drawings is only used when the owner withdraws assets for personal use."},
{q:5,year:2018,y:2018,top:"基礎管理 —— 管理功能（控制過程：品質控制步驟）",topEn:"Basics of Management —— Management Functions (Control process: steps of quality control)",cn:"5. 下列為品質控制所需的工作：\n(1) 抽樣量度實際次貨率\n(2) 如實際次貨率高於可接受水平，找出原因，並採取跟進措施\n(3) 訂立可接受的次貨率\n(4) 比較實際與可接受的次貨率\n品質控制步驟的次序應為：\nA. (1) -> (3) -> (2) -> (4)\nB. (1) -> (4) -> (3) -> (2)\nC. (3) -> (1) -> (2) -> (4)\nD. (3) -> (1) -> (4) -> (2)",en:"5. The following are tasks required for quality control:\n(1) sample and measure the actual defect rate\n(2) if the actual defect rate is higher than the acceptable level, find out the reason and take follow-up action\n(3) establish an acceptable defect rate\n(4) compare the actual and acceptable defect rates\nThe sequence of the quality control steps should be:\nA. (1) -> (3) -> (2) -> (4)\nB. (1) -> (4) -> (3) -> (2)\nC. (3) -> (1) -> (2) -> (4)\nD. (3) -> (1) -> (4) -> (2)",ans:"D",rate:"89%",exCn:"1. D 正確：品質控制屬於管理四大功能中的「控制（Controlling）」範疇。控制過程的四大步驟為：\n第一步：制定表現標準 —— 訂立可接受的次貨率，即項目 (3)；\n第二步：量度實際表現 —— 抽樣量度實際次貨率，即項目 (1)；\n第三步：比較實際表現與標準 —— 比較實際與可接受的次貨率，即項目 (4)；\n第四步：採取改善措施 —— 若高於標準，找出原因並採取措施，即項目 (2)。\n故正確順序為 (3) -> (1) -> (4) -> (2)，選 D。本題屬於最新必修部分「1(b) 基礎管理：管理功能（控制過程）」考核範圍。",exEn:"1. D is correct: Quality control represents the 'Controlling' function of management. The four standard steps of the control process are:\nStep 1: Establishing performance standards — Establish an acceptable defect rate, which is task (3);\nStep 2: Measuring actual performance — Sample and measure the actual defect rate, which is task (1);\nStep 3: Comparing actual performance against standards — Compare the actual and acceptable defect rates, which is task (4);\nStep 4: Taking corrective actions — If the defect rate is higher than standard, find the reasons and take action, which is task (2).\nThe correct sequence is (3) -> (1) -> (4) -> (2). This topic belongs to the compulsory syllabus '1(b) Basics of Management: Management Functions (Control process)'."},
{q:6,year:2018,y:2018,top:"[out c] 基礎會計 —— 企業費用、提用與資本變動之會計處理",topEn:"[out c] Introduction to Accounting —— Identifying Expenses, Drawings and Capital",outc:true,reason:"自 2025 年起，基礎會計已移出必修部分，所有關於「費用、提用、資本」之判定與損益表編製，已全數歸入選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, introductory accounting topics including classification of expenses, drawings and capital are tested in the Accounting Elective Module Paper 2A.",cn:"6. 下列哪項應記作商號的費用？\n(1) 以現金支付商號兼職工人的工資\n(2) 以商號支票支付東主私人住宅的保險費\n(3) 以東主個人支票支付商號貨倉的租金\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1) 、(2)及(3)",en:"6. Which of the following should be recorded as an expense of a firm?\n(1) wages paid to the part-time workers of the firm in cash\n(2) insurance paid for owner's private apartment by the firm's cheque\n(3) rent paid for the firm's warehouse by owner's personal cheque\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"77%",exCn:"1. (1) 應記作費用：以現金支付兼職員工薪資屬於商號的「工資費用（Wages expense）」，計入費用。\n2. (2) 不能記作費用：支付東主「私人住宅」保險屬於東主的私人非商業開支，根據企業個體觀念，此筆以商號支票代付的款項應記作「提用（Drawings）」，不能記入商號費用。\n3. (3) 應記作費用：支付商號貨倉租金屬於商號的「租金費用（Rent expense）」。雖然是由東主以「個人支票」代付，但本質上這筆費用已由商號招致（會計分錄為：借記 租金費用，貸記 資本），因此在會計上仍須記作商號的費用。",exEn:"1. (1) should be recorded as an expense: Cash paid for part-time workers' wages is a business expense (Wages expense).\n2. (2) should NOT be recorded as an expense: Insurance paid for the owner's private apartment is personal expenditure. Under the business entity concept, this payment made by the firm's cheque must be debited to Drawings, not to business expenses.\n3. (3) should be recorded as an expense: Rent paid for the firm's warehouse is a business expense (Rent expense). Although paid by the owner's personal cheque, the expense is incurred by the business (the double entry is: Dr. Rent expenses; Cr. Capital), hence it must be recorded as an expense of the firm."},
{q:7,year:2018,y:2018,top:"營商環境 —— 商業道德與社會責任",topEn:"Business Environment —— Business Ethics and Social Responsibility",cn:"7. 符合商業道德的行為\n(1) 可提升企業的公眾形象。\n(2) 長遠來說會增加企業的營運成本。\n(3) 讓企業以較低利得稅率納稅。\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"7. Ethical behaviour in business will _____\n(1) enhance the public image of a business.\n(2) increase the operating costs of a business in the long run.\n(3) enable a business to be subject to a lower profits tax rate.\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"A",rate:"93%",exCn:"1. (1) 正確：遵守商業道德（如誠信經營、保護環境）能贏得公眾和消費者的信任，顯著提升企業的公眾形象和社會聲譽。\n2. (2) 錯誤：雖然實行道德行為在短期內可能需要一些合規或投入成本，但長遠而言能有效減少因訴訟、醜聞及員工流失引致的巨額開支，反而能「降低」長遠營運風險與潛在成本。\n3. (3) 錯誤：香港的利得稅率由法律（稅務條例）統一定義，企業不會因為道德行為良好而享有任何特殊的「減稅或較低稅率」待遇。本題屬於最新必修部分「1(a) 營商環境：商業道德及社會責任」考核範圍。",exEn:"1. (1) is correct: Adhering to business ethics (such as honest operations and environmental protection) wins trust from stakeholders, enhancing the business's public image and social reputation.\n2. (2) is incorrect: Although implementing ethical behaviour may incur short-term compliance or investment costs, in the long run, it reduces significant expenses from lawsuits, scandals, and staff turnover, thereby reducing potential operating costs.\n3. (3) is incorrect: Profits tax rates in HK are determined by legislation. A business will not be subject to a lower profits tax rate because of its ethical behaviour. This topic is within the compulsory syllabus '1(a) Business Environment: Business Ethics and Social Responsibility'."},
{q:8,year:2018,y:2018,top:"[out c] 原始分錄帳簿及分類帳 —— 購貨帳之沖減與貸記",topEn:"[out c] Books of Original Entry and Ledgers —— Crediting the Purchases Account",outc:true,reason:"自 2025 年起，關於「購貨退出、提用與捐贈商品」之會計分錄與分類帳登記，已全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, accounting journal entries for purchases returns, drawings, and merchandise donations are tested in the Accounting Elective Module Paper 2A.",cn:"8. 下列哪項應貸記商號的購貨帳？\n(1) 東主提取貨物自用\n(2) 退回貨物予供應商\n(3) 捐贈貨物予非牟利機構\nA. 只有(1)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1) 、(2)及(3)",en:"8. Which of the following should be credited to the purchases account of a firm?\n(1) withdrawal of goods by the owner for personal use\n(2) return of goods to the supplier\n(3) donation of goods to non-profit-making organisations\nA. (1) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"33%",exCn:"1. (1) 及 (3) 正確：\n(1) 東主提取存貨自用，分錄為「借記：提用（Drawings）」；「貸記：購貨（Purchases）」（按成本沖減購貨總額），分錄正確。\n(3) 將貨物捐贈給慈善機構（非日常銷售用途），分錄為「借記：捐贈費用」；「貸記：購貨」（按成本沖減購貨總額），分錄正確。\n2. (2) 錯誤：將貨物退回給供應商，分錄為「借記：應付貨款」；「貸記：購貨退出（Purchases returns）」而非貸記購貨帳本身，故 (2) 排除。",exEn:"1. (1) and (3) are correct:\n(1) When the owner withdraws goods for personal use, the entry is: Debit Drawings; Credit Purchases (reducing the total cost of purchases), which is correct.\n(3) When goods are donated to charity, the entry is: Debit Donation expenses; Credit Purchases (reducing the cost of purchases), which is correct.\n2. (2) is incorrect: Returning goods to the supplier is recorded as: Debit Trade payables; Credit Purchases returns (Returns outwards), not crediting the Purchases account directly. Hence, (2) is excluded."},
{q:9,year:2018,y:2018,top:"基礎管理 —— 主要商業功能（市場營銷管理職掌）",topEn:"Basics of Management —— Major Business Functions (Functions of the marketing department)",cn:"9. 下列哪項是公司市場營銷部門的主要功能？\n(1) 策劃市場研究\n(2) 制定貨物價格策略\n(3) 控制貨物品質\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1) 、(2)及(3)",en:"9. Which of the following is/are the main function(s) of the marketing department of a company?\n(1) conducting market research\n(2) formulating pricing strategies for goods\n(3) controlling the quality of goods\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"81%",exCn:"1. (1) 及 (2) 正確：市場營銷部門（Marketing）的核心職責為營銷組合「4P」（產品、價格、推廣、分銷）。策劃市場研究以了解顧客需要（1）與制定貨物價格策略（2）皆屬於市場營銷部門的職能。\n2. (3) 錯誤：控制貨物生產品質（Quality Control），屬於營運管理（Operations Management）部門的主要功能，而非市場營銷部的職責。本題屬於最新必修部分「1(b) 基礎管理：主要商業功能（市場營銷管理）」考核範圍。",exEn:"1. (1) and (2) are correct: The core functions of the marketing department revolve around the marketing mix '4Ps' (Product, Price, Promotion, Place). Conducting market research to understand customer needs (1) and formulating pricing strategies (2) both belong to marketing.\n2. (3) is incorrect: Controlling the quality of goods (Quality Control) is the responsibility of the Operations Management department, not the marketing department. This topic is within the compulsory syllabus '1(b) Basics of Management: Major Business Functions (Marketing)'."},
{q:10,year:2018,y:2018,top:"[out c] 基礎會計 —— 帳戶之性質與分類（實帳戶的特徵）",topEn:"[out c] Introduction to Accounting —— Classification of Accounts (Examples of permanent accounts)",outc:true,reason:"自 2025 年起，基礎會計與帳戶分類已移出必修部分，實帳戶與虛帳戶的性質判定、期末結平原理，已全數歸入選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, accounts classifications (permanent vs. temporary) and end-of-period closing entries are tested in the Accounting Elective Module Paper 2A.",cn:"10. 下列哪個是實帳戶的例子？\n(1) 銷貨帳\n(2) 銀行貸款帳\n(3) 設備帳\nA. 只有(1)\nB. 只有(2)\nC. 只有(3)\nD. 只有(2)及(3)",en:"10. Which of the following is/are example(s) of a permanent account?\n(1) Sales account\n(2) Bank loan account\n(3) Equipment account\nA. (1) only\nB. (2) only\nC. (3) only\nD. (2) and (3) only",ans:"D",rate:"58%",exCn:"1. (2) 及 (3) 正確（即 D 正確）：\n實帳戶（Real Accounts / Permanent Accounts）：是指期末結餘需結轉至下一會計期間、反映在「財務狀況表」中的資產、負債和資本類科目。因此，(2) 銀行貸款帳（負債）和 (3) 設備帳（資產）均為實帳戶，餘額會帶到下一年度。\n2. (1) 錯誤：\n虛帳戶（Nominal Accounts / Temporary Accounts）：指期末餘額需結轉至損益帳結平、反映在「損益表」中的收益與費用類科目。銷貨帳（1）屬於虛帳戶，餘額在期末會被結平轉至損益帳。",exEn:"1. (2) and (3) are correct (D is correct):\nPermanent (Real) Accounts: These are accounts that represent assets, liabilities, and capital. Their balances are carried forward to the next accounting period and appear in the Statement of Financial Position. Thus, (2) Bank loan account (liability) and (3) Equipment account (asset) are permanent accounts.\n2. (1) is incorrect:\nTemporary (Nominal) Accounts: These are revenue and expense accounts that are closed at the end of each period to the Profit and Loss Account. The Sales account (1) is a temporary account, so its balance is closed and not carried forward."},
{q:11,year:2018,y:2018,top:"基礎管理 —— 有效管理的原則（功能部門分工與目標管理之應用）",topEn:"Basics of Management —— Principles of Effective Management (Division of labour and MBO)",cn:"11. 一家貿易商號按功能劃分部門。每年年初，總經理會與其部門經理一起商討和制定各部門的目標，以達至商號的整體目標。他們會定時檢視各部門的目標是否能按計劃達成。\n根據以上資料，這商號應用了下列哪項有效管理原則？\n(1) 平衡職權和責任\n(2) 目標管理\n(3) 分工\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1) 、(2)及(3)",en:"11. A trading firm is departmentalised by function. At the beginning of each year, the general manager discusses and decides on the goals of each department with the department managers to achieve the overall goals of the firm. They review the goals of each department regularly to see if they can be achieved as planned.\nAccording to the above information, which of the following principles of effective management has been applied by the firm?\n(1) balancing authority and responsibility\n(2) management by objectives\n(3) division of work\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"49%",exCn:"1. (3) 正確：商號「按功能劃分部門」，將公司的整體經營職能（如財務、行銷等）拆分為不同專業部門，這直接體現了有效管理原則中的「分工（Division of work / labour）」。\n2. (2) 正確：「總經理會與其部門經理一起商討和制定各部門的目標……定時檢視進度」，這體現了「目標管理（Management by Objectives, MBO）」中上下級共同設定目標、雙向溝通及定期反饋的核心流程。\n3. (1) 錯誤：案例中並無提及各級經理的職權大小與其所需承擔責任是否對等，因此「平衡職權與責任」未在題幹中體現。故 (2) 及 (3) 正確，選 C。本題屬於最新必修部分「1(b) 基礎管理：管理功能及有效管理的原則」考核範圍。",exEn:"1. (3) is correct: The firm 'is departmentalised by function', dividing the overall operations into specialized functional departments (Finance, Marketing, etc.). This directly applies the principle of 'division of work (labour)'.\n2. (2) is correct: 'The general manager discusses and decides on the goals of each department with the department managers... review the goals regularly'. This is the core practice of 'management by objectives (MBO)' which involves joint goal-setting and regular feedback.\n3. (1) is incorrect: There is no mention of whether the level of authority matches the level of responsibility given to the managers, so 'balancing authority and responsibility' is not illustrated. Therefore, (2) and (3) are correct, making C the correct answer. This topic is within the compulsory syllabus '1(b) Basics of Management: Principles of Effective Management (MBO & Division of Work)'."},
{q:12,year:2018,y:2018,top:"[out c] 原始分錄帳簿及分類帳 —— 現金與銀行帳戶金額核算與餘額結平",topEn:"[out c] Books of Original Entry and Ledgers —— Reconstructing Bank Ledger Balances",outc:true,reason:"自 2025 年起，現金簿及各類日記簿的登帳、過帳與科目結平，已全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, recording cash and bank transactions in cash book and ledgers accounts balancing are tested in the Accounting Elective Module Paper 2A.",cn:"12. 2018年3月1日，一商號的銀行存款帳和現金帳分別有借方結餘$15000和$12000。商號該月現銷$13000，其中$5000保留於夾萬內。其餘現銷金額則在月底前存入銀行。該月以現金支付費用$9000和以支票購買設備$26000。\n2018年3月31日，銀行存款帳有\nA. 貸方結餘$3000\nB. 貸方結餘$6000\nC. 借方結餘$5000\nD. 借方結餘$8000",en:"12. On 1 March 2018, the bank account and cash account of a firm carried debit balances of $15 000 and $12 000 respectively. During the month, the firm had cash sales of $13 000, of which $5 000 was kept in the safe. The remaining cash sales were deposited into the bank before the end of the month. During the month, wages paid in cash amounted to $9 000 and equipment purchased by cheque amounted to $26 000.\nAs at 31 March 2018, the bank account has a:\nA. credit balance of $3 000\nB. credit balance of $6 000\nC. debit balance of $5 000\nD. debit balance of $8 000",ans:"A",rate:"74%",exCn:"1. A 正確：我們按期初餘額與當期交易，重構「銀行存款」分類帳：\n期初銀行借方結餘 = +$15,000；\n本月現銷共 $13,000，其中 $5,000 保留於現金箱自用（屬於現金帳增加），其餘部分存入銀行。存入銀行的金額 = $13,000 - $5,000 = +$8,000（銀行借方增加）；\n以支票（Cheque）支付購買設備 = -$26,000（銀行貸方減少，資產減少）；\n本月以「現金（Cash）」支付的費用 $9,000，只影響現金帳（現金減少 $9,000），與銀行存款帳完全無關，排除。\n期末銀行存款帳餘額 = 期初 $15,000 + 存入 $8,000 - 支票支出 $26,000 = -$3,000。由于餘額為負數 $3,000（銀行透支），在複式記帳中代表呈現為貸方結餘 $3,000，選 A。",exEn:"1. A is correct: Let's reconstruct the Cash at Bank ledger account based on the transactions:\nBeginning Debit balance of Bank = +$15,000;\nCash sales of $13,000, of which $5,000 is kept in safe (Cash Dr. increases). The remainder is deposited into bank = $13,000 - $5,000 = +$8,000 (Bank Dr. increases);\nEquipment purchased by cheque = -$26,000 (Bank Cr. decreases);\nWages paid in cash of $9,000 is paid in 'cash', which only affects the Cash account and has no relation with the Bank account, excluded.\nFinal Bank balance = Beginning $15,000 + Deposit $8,000 - Cheque payment $26,000 = -$3,000. A negative balance of $3,000 in bank represents an overdraft, which carries a credit balance of $3,000 at the year-end. Thus, A is correct."},
{q:13,year:2018,y:2018,top:"基礎個人理財 —— 消費者信貸（銀行透支之特徵）",topEn:"Basics of Personal Financial Management —— Consumer Credit (Characteristics of bank overdrafts)",cn:"13. 下列哪項有關銀行透支的陳述是正確的？\n(1) 沒有固定還款期。\n(2) 利息通常按月計算。\n(3) 通常毋須抵押。\nA. 只有(1)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1) 、(2)及(3)",en:"13. Which of the following statements about bank overdrafts is/are correct?\n(1) There is no fixed schedule for repayments.\n(2) Interest is usually calculated on a monthly basis.\n(3) Generally, collateral is not required.\nA. (1) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"30%",exCn:"1. (1) 正確：銀行透支（Bank Overdraft）是一種極具彈性的短期借貸安排，借款人可以隨時存入資金還款，並無法律或合約上「固定的每月還款期（還款時間表）」。\n2. (2) 錯誤：銀行透支的利息在金融實務上是按日計算（Calculated on a daily basis）的（即按每日實際透支的金額乘以透支利率，並按月結算扣除），而非按月計算。\n3. (3) 正確：透支通常是銀行基於客戶的信用或往來帳戶歷史而給予的短期的信用额度，通常是毋須資產抵押的。故 (1) 及 (3) 正確，選 B。本題屬於最新必修部分「1(d) 基礎個人理財：消費者信貸（銀行透支）」考核範圍。",exEn:"1. (1) is correct: Bank overdraft is a flexible short-term credit facility with no fixed repayment schedule or due dates. Borrowers can pay off the debt at any time when they have surplus funds.\n2. (2) is incorrect: In banking practice, interest on overdrafts is calculated on a daily basis based on the actual daily overdrawn amount, though it is usually charged/debited to the account monthly. It is not calculated on a monthly basis.\n3. (3) is correct: Overdrafts are unsecured short-term facilities granted based on the customer's creditworthiness or bank account history, hence collateral is generally not required. Therefore, (1) and (3) are correct, making B the correct answer. This topic is within the compulsory syllabus '1(d) Basics of Personal Financial Management: Consumer Credit (Bank Overdrafts)'."},
{q:14,year:2018,y:2018,top:"營商環境 —— 商業道德與社會責任的踐行",topEn:"Business Environment —— Business Ethics and Social Responsibility",cn:"14. 就一家玩具公司而言，下列哪項不是履行社會責任的例子？\nA. 使用回收材料製造玩具\nB. 捐贈玩具予孤兒院\nC. 聖誕期間給予顧客20%折扣\nD. 改善員工工作環境",en:"14. For a toy company, which of the following is NOT an example of fulfilling its social responsibility?\nA. using recycled materials to produce toys\nB. donating toys to orphanages\nC. offering 20% discount to customers during Christmas\nD. improving the working environment of its employees",ans:"C",rate:"79%",exCn:"1. C 不是履行社會責任（即正確答案）：聖誕期間打八折（折扣）屬於企業常見的市場推廣與價格促銷活動（Promotion），本質上是以提升短期銷售量和營業額利潤為核心的常規商業策略，不屬於社會責任（CSR）範疇。\n2. A、B、D 均為履行社會責任的例子：A（環境保護責任）、B（社區關懷與社會公益責任）、D（關懷員工福利與安全之責任），皆屬於履行企業社會責任。本題屬於最新必修部分「1(a) 營商環境：商業道德及社會責任（社會責任例子）」考核範圍。",exEn:"1. C is NOT an example of CSR (correct answer): Offering a 20% discount to customers during Christmas is a typical marketing and pricing promotion strategy (Promotion). It aims at boosting short-term sales volume and revenue, which falls under regular commercial marketing rather than Corporate Social Responsibility (CSR).\n2. A, B, and D are examples of CSR: A (environmental protection responsibility), B (community care and charity responsibility), and D (responsibility towards employee welfare and safety). This topic is within the compulsory syllabus '1(a) Business Environment: Business Ethics and Social Responsibility'."},
{q:15,year:2018,y:2018,top:"基礎個人理財 —— 金錢的時間值（複利未來值與現值雙重折現計算）",topEn:"Basics of Personal Financial Management —— Time Value of Money (PV and FV dual calculations)",cn:"15. 李先生欲於三年後購買一輛汽車，現時車價為$500000，每年升幅估計為3%。為了三年後支付車價，他欲投資一基金，每年複息回報率為5%。他現時需投資於基金的金額是多少？\nA. $471 969\nB. $490 476\nC. $509 709\nD. $529 695",en:"15. Mr Lee wants to buy a car 3 years later. Its price is $500 000 now and is expected to increase by 3% per annum, compounded annually. To pay for the car after 3 years, he is considering investing in a bank fund with a return of 5% per annum, compounded annually. How much should he invest in the fund now?\nA. $471 969\nB. $490 476\nC. $509 709\nD. $529 695",ans:"A",rate:"74%",exCn:"1. A 正確：本題考查複利終值（FV）與現值（PV）的雙重複合計算：\n第一步：計算三年後買車所需的總金額（即未來值 FV）：車價按每年 3% 複合增長，三年後車價 FV = $500,000 × (1 + 0.03)^3 = $500,000 × 1.092727 = $546,363.50。\n第二步：計算當前需要投入基金的金額（即現值 PV）：基金回報率為 5%，我們將上述未來值折現回現在：PV = $546,363.50 / (1 + 0.05)^3 = $546,363.50 / 1.157625 ≈ $471,969.46。\n四捨五入至整數元為 $471,969（選 A）。本題屬於最新必修部分「1(d) 基礎個人理財：金錢的時間值（計算現值和未來值）」考核範圍。",exEn:"1. A is correct: This question involves dual compound interest calculations of Future Value (FV) and Present Value (PV), within the syllabus limit of maximum 3 compounding periods:\nStep 1: Calculate the future car price in 3 years (FV): The price grows at 3% per annum. FV = $500,000 × (1 + 0.03)^3 = $500,000 × 1.092727 = $546,363.50.\nStep 2: Calculate the required investment amount now (PV): The fund offers a 5% return. We discount the FV back to present value: PV = $546,363.50 / (1 + 0.05)^3 = $546,363.50 / 1.157625 ≈ $471,969.46.\nRounding to the nearest dollar gives $471,969. This topic belongs to the compulsory syllabus '1(d) Basics of Personal Financial Management: Time Value of Money'."},
{q:16,year:2018,y:2018,top:"基礎管理 —— 管理功能（計劃：目標管理 MBO 的利弊）",topEn:"Basics of Management —— Management Functions (Planning: Pros and cons of MBO)",cn:"16. 下列哪項是企業採用「目標管理」的好處？\n(1) 增強下屬的工作滿足感\n(2) 降低行政成本\n(3) 減少工作延誤\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1) 、(2)及(3)",en:"16. Which of the following are the advantages of adopting 'management by objectives' by a business?\n(1) enhance the subordinates' job satisfaction\n(2) lower the administrative cost\n(3) reduce work delays\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"64%",exCn:"1. (1) 及 (3) 正確：\n(1) 正確：目標管理（MBO）強調主管與下屬共同商討並設定明確、可量度的目標，能賦予下屬較多自主權與責任感，從而能增強下屬的工作滿足感。\n(3) 正確：由於 MBO 目標設有清晰的時間限制和衡量標準，便於定時檢視，能有效激勵員工並減少工作延誤與拖延。\n2. (2) 錯誤：實施目標管理需要上下級進行反覆深入的會面、共同討論、文書記錄及定期審核，這通常會顯著增加（而非降低）企業整體的文書工作、行政開支與溝通時間成本。故選 B。本題屬於最新必修部分「1(b) 基礎管理：管理功能（計劃之目標）」考核範圍。",exEn:"1. (1) and (3) are correct:\n(1) is correct: MBO involves joint goal-setting and dual discussions, giving subordinates more autonomy, commitment and clarity, which enhances their job satisfaction.\n(3) is correct: Because MBO goals are explicit and time-bound, they facilitate continuous monitoring and help to reduce work delays.\n2. (2) is incorrect: Implementing MBO requires frequent meetings, documentation, reviews and feedback sessions between supervisors and subordinates, which significantly increases (not lowers) the administrative and paperwork costs of the firm. Therefore, only (1) and (3) are correct, making B the correct answer. This topic belongs to the compulsory syllabus '1(b) Basics of Management: Management Functions (Planning/MBO)'."},
{q:17,year:2018,y:2018,top:"[out c] 不完整會計紀錄 —— 資本變動等式與提用金額核算",topEn:"[out c] Incomplete Records —— Capital Account Equations and Drawings Calculations",outc:true,reason:"自 2025 年起，不完整會計紀錄下的期末資本與提用額倒推、損益核算，已全數歸入選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, incomplete accounting records calculations, capital equations and drawings derivations are tested in the Accounting Elective Module Paper 2A.",cn:"17. 下列是有關陳先生商號2017年度的資料：\n* 資本,2017年1月1日：$443 800\n* 資本,2017年12月31日：$425 000\n* 2017年度總收益：$97 000\n* 2017年度總費用：$108 500\n根據以上資料，陳先生於2017年度內\nA. 從商號提用$7300\nB. 從商號提用$30 300\nC. 注資商號$7300\nD. 注資商號$30300",en:"17. The following information relates to Mr Chan's firm in 2017:\n* Capital, as at 1 January 2017: $443 800\n* Capital, as at 31 December 2017: $425 000\n* Total revenue for the year 2017: $97 000\n* Total expenses for the year 2017: $108 500\nBased on the above information, Mr Chan _____\nA. withdrew $7 300 from the firm during the year 2017.\nB. withdrew $30 300 from the firm during the year 2017.\nC. introduced $7 300 into the firm during the year 2017.\nD. introduced $30 300 into the firm during the year 2017.",ans:"A",rate:"68%",exCn:"1. A 正確：本題可套用期末與期初的「資本變動公式」倒推計算：\n第一步：計算 2017 年度商號的淨利或淨虧損：淨利 / (淨損失) = 總收益 - 總費用 = $97,000 - $108,500 = -$11,500 (當期為淨損失 $11,500)。\n第二步：套用資本變動公式：期末資本 = 期初資本 + 淨利(或 - 淨損失) - 提用 + 新增注資\n$425,000 = $443,800 - $11,500 - 提用 + $0\n$425,000 = $432,300 - 提用\n提用 (Drawings) = $432,300 - $425,000 = $7,300。\n因此陳先生在該年度內「從商號提用了 $7,300」（即 Withdraw），選 A。",exEn:"1. A is correct: This question can be solved using the capital movement formula:\nStep 1: Calculate the net profit/loss for the year: Net Profit / (Loss) = Total Revenue - Total Expenses = $97,000 - $108,500 = -$11,500 (indicating a net loss of $11,500).\nStep 2: Apply the capital movement formula: Closing Capital = Opening Capital + Net Profit (or - Net Loss) - Drawings + Capital Injection\n$425,000 = $443,800 - $11,500 - Drawings + $0\n$425,000 = $432,300 - Drawings\nDrawings = $432,300 - $425,000 = $7,300.\nThus, Mr Chan withdrew $7,300 (made cash drawings) from the firm during the year. Hence, A is correct."},
{q:18,year:2018,y:2018,top:"[out c] 營商環境 —— 企業擁有權類型（公營公司的特徵與性質）",topEn:"[out c] Business Environment —— Forms of Business Ownership (Characteristics of public corporations)",outc:true,reason:"自 2025 年起，「公營公司」整個課題已從必修部分大綱中完全刪除，不予考核。",reasonEn:"Starting from the 2025 HKDSE, the topic of 'public corporations' has been completely removed from the compulsory syllabus.",cn:"18. 海洋公園公司是香港一家公營公司，下列哪項有關它的陳述是正確的？\n(1) 它在香港交易所上市。\n(2) 它的董事局成員是由政府委任。\n(3) 它財政上自給自足。\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1) 、(2)及(3)",en:"18. Which of the following statements about the Ocean Park Corporation, a public corporation in Hong Kong, are correct?\n(1) It is listed on the Hong Kong Stock Exchange.\n(2) Its board of directors is appointed by the government.\n(3) It is self-sufficient financially.\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"41%",exCn:"1. (2) 及 (3) 正確：\n(2) 正確：公營公司（Public Corporation）由政府全資設立與擁有，其最高決策層（董事局主席及成員）通常依法由政府首長直接指定和委任。\n(3) 正確：公營公司（如海洋公園、港鐵、機管局）在香港通常以自負盈虧、商業化的模式營運，要求在財政上做到自給自足。\n2. (1) 錯誤：公營公司是由政府獨資擁有的獨立個體，它並不在證券交易所上市。在港交所公開招股上市的屬於「公眾有限公司（Public limited company）」。",exEn:"1. (2) and (3) are correct:\n(2) is correct: A public corporation is wholly owned by the government, and its board of directors is appointed by the government (usually by the Chief Executive or relevant bureau secretary).\n(3) is correct: Public corporations in Hong Kong are established to run on a commercial basis and are expected to be self-sufficient financially (self-financing).\n2. (1) is incorrect: Public corporations are government-owned entities and are NOT listed on the stock exchange. It is public limited companies that raise capital by listing shares on the HKEX."},
{q:19,year:2018,y:2018,top:"基礎個人理財 —— 金錢的時間值（淨現值 NPV 運算所需變數）",topEn:"Basics of Personal Financial Management —— Time Value of Money (Required variables for NPV)",cn:"19. 計算投資一部機器的淨現值，需要下列哪項資料？\n(1) 機器的最初成本\n(2) 機器的殘值\n(3) 機器的使用年限\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1) 、(2)及(3)",en:"19. Which of the following information is/are required to calculate the net present value of investment in a machine?\n(1) initial cost of the machine\n(2) scrap value of the machine\n(3) useful life of the machine\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"66%",exCn:"1. D 正確：計算投資項目的淨現值（NPV）需要以下核心變數：\n(1) 機器的最初成本 —— 作為第 0 期期初的「現金流出（Initial cash outflow）」；\n(2) 機器的殘值 —— 在項目使用年限終結時，作為最後一期的「現金流入（Cash inflow）」，折現至期初；\n(3) 機器的使用年限 —— 作為折現期數（n 的值），決定需要折現多少個複息期。因此，(1)、(2)、(3) 皆是必需的資料，選 D。本題屬於最新必修部分「1(d) 基礎個人理財：金錢的時間值（以淨現值作投資決策）」考核範圍。",exEn:"1. D is correct: Calculating the Net Present Value (NPV) of a machinery investment project requires all of the following variables:\n(1) Initial cost of the machine — Acts as the initial cash outflow in Year 0;\n(2) Scrap (residual/salvage) value of the machine — Acts as a cash inflow in the final year of the project, which needs to be discounted back to present value;\n(3) Useful life of the machine — Represents the number of compounding/discounting periods (the value of n) to determine the time horizon.\nTherefore, (1), (2), and (3) are all required. This topic belongs to the compulsory syllabus '1(d) Basics of Personal Financial Management: Time Value of Money'."},
{q:20,year:2018,y:2018,top:"[out c] 不同企業擁有權類型的財務報告編製 —— 損益表（影響毛利金額之特徵）",topEn:"[out c] Financial Statements —— Income Statement (Factors affecting Gross Profit)",outc:true,reason:"自 2025 年起，會計科目在損益表中的細部劃分（銷貨成本與營業費用、貿易與現金折扣），已全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, operating expenses vs. cost of sales classifications, trade discounts and cash discounts treatments are tested in the Accounting Elective Module Paper 2A.",cn:"20. 下列哪項會增加一家貿易商號的毛利？\nA. 購貨退出減少\nB. 銷貨運費減少\nC. 供應商提高交易折扣\nD. 供應商提高現金折扣",en:"20. Which of the following will increase the gross profit of a trading firm?\nA. a decrease in purchases returns\nB. a decrease in carriage outwards\nC. an increase in trade discounts offered by the supplier\nD. an increase in cash discounts offered by the supplier",ans:"C",rate:"41%",exCn:"1. C 正確：\n交易折扣/貿易折扣（Trade discount）：在賒購商品時，供應商提高交易折扣會直接在發票中扣減，直接降低購貨成本（COGS）。根據公式「毛利 = 銷貨淨額 - 銷貨成本」，購貨成本下降會使毛利直接增加，故 C 正確。\n2. A、B、D 錯誤：\nA 錯誤：購貨退出減少會使「購貨淨額」上升，從而拉高銷貨成本，最終會「減少」毛利。\nB 錯誤：銷貨運費（Carriage outwards）屬於「營業費用」，列於毛利之後，其變動完全不影響毛利。\nD 錯誤：供應商提高現金折扣（購貨折扣），在會計上分類為「其他收益」，列在毛利之後，不影響貿易部分的毛利。",exEn:"1. C is correct:\nTrade discount: This is a discount deducted directly from the list price on the invoice. When the supplier increases the trade discount, it directly lowers the Cost of Goods Sold (COGS). Since 'Gross Profit = Net Sales - COGS', a lower COGS directly increases gross profit.\n2. A, B, and D are incorrect:\nA is incorrect: A decrease in purchases returns increases net purchases, which raises COGS and thus decreases gross profit.\nB is incorrect: Carriage outwards is classified as an operating expense, listed below the gross profit line. Any changes in it do not affect gross profit.\nD is incorrect: Cash discounts received (discounts received) are classified as 'Other income', listed below the gross profit line, and do not affect gross profit."},
{q:21,year:2018,y:2018,top:"[out c] 財務報表分析 —— 變現能力與存貨佔比之交叉比率分析",topEn:"[out c] Financial Ratio Analysis —— Liquidity and Inventory Proportions",outc:true,reason:"自 2025 年起，財務報表分析的各類會計比率計算、變現能力交叉比率解讀，已全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, comparative financial ratios analysis, liquidity calculations and inventory deductions are tested in the Accounting Elective Module Paper 2A.",cn:"21. 明記和陳記是同一行業的貿易商號。他們2017年度的財務資料如下：\n* 明記：流動資產 $900 000 | 流動比率 6:1 | 酸性測驗比率 2:1\n* 陳記：流動資產 $600 000 | 流動比率 2.5:1 | 酸性測驗比率 1.5:1\n根據以上資料，明記\n(1) 的流動負債較少\n(2) 應付短期負債的能力較高\n(3) 的存貨較少\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1) 、(2)及(3)",en:"21. Ming Kee and Chan Kee are trading firms in the same industry. Their financial information for the year 2017 is shown below:\n* Ming Kee: Current assets $900 000 | Current ratio 6:1 | Acid test ratio 2:1\n* Chan Kee: Current assets $600 000 | Current ratio 2.5:1 | Acid test ratio 1.5:1\nBased on the above information, Ming Kee has\n(1) less current liabilities\n(2) greater ability to meet short-term obligations\n(3) less inventory\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"78%",exCn:"1. (1) 及 (2) 正確（即 A 正確）：\n(1) 正確：\n明記的流動負債 = 流動資產 $900,000 / 流動比率 (6) = $150,000。\n陳記的流動負債 = 流動資產 $600,000 / 流動比率 (2.5) = $240,000。\n明記的流動負債（$15萬）顯著少於陳記（$24萬），故 (1) 正確。\n(2) 正確：明記的流動比率（6:1）及速動比率（2:1）皆遠高於陳記的對應比率（2.5:1 及 1.5:1），說明明記應付短期債務的變現安全邊際極高，應付短期負債的能力較高，故 (2) 正確。\n(3) 錯誤：\n根據公式，速動比率 = (流動資產 - 存貨) / 流動負債。\n明記的存貨：2 = ($900,000 - 存貨) / $150,000 → 存貨 = $900,000 - $300,000 = $600,000。\n陳記的存貨：1.5 = ($600,000 - 存貨) / $240,000 → 存貨 = $600,000 - $360,000 = $240,000。\n明記的存貨（$60萬）其實多於陳記的存貨（$24萬），因此 (3) 錯誤。\n綜上，只有 (1) 和 (2) 正確，選 A。",exEn:"1. (1) and (2) are correct (A is correct):\n(1) is correct:\nMing Kee's Current liabilities = Current assets $900,000 / Current ratio (6) = $150,000.\nChan Kee's Current liabilities = Current assets $600,000 / Current ratio (2.5) = $240,000.\nMing Kee's current liabilities ($150,000) are less than Chan Kee's ($240,000). Thus, (1) is correct.\n(2) is correct: Ming Kee's current ratio (6:1) and acid test ratio (2:1) are both significantly higher than Chan Kee's, indicating that Ming Kee has a greater ability to meet short-term obligations.\n(3) is incorrect:\nSince Acid test ratio = (Current assets - Inventory) / Current liabilities:\nMing Kee's inventory: 2 = ($900,000 - Inventory) / $150,000 → Inventory = $900,000 - $300,000 = $600,000.\nChan Kee's inventory: 1.5 = ($600,000 - Inventory) / $240,000 → Inventory = $600,000 - $360,000 = $240,000.\nMing Kee's inventory ($600,000) is more than Chan Kee's ($240,000). Thus, (3) is incorrect.\nOnly (1) and (2) are correct. Hence, A is correct."},
{q:22,year:2018,y:2018,top:"[out c] 基礎個人理財 —— 證券交易（主板與 GEM 上市條件對比）",topEn:"[out c] Basics of Personal Financial Management —— Stock Trading (GEM vs. Main Board Listing Requirements)",outc:true,reason:"自 2025 年起，必修部分考綱明確規定「以證券交易作投資：不包括主板及創業板新申請人的基本上市要求」，此項對比已被移出卷一必修考綱。",reasonEn:"Starting from 2025, the compulsory syllabus for stock trading explicitly states 'Stock trading as an investment: excluding the basic listing requirements for new applicants on the Main Board and GEM'.",cn:"22. 在創業板對新申請人的基本上市要求中，並沒有就 ______ 設有最低要求。\nA. 現金流\nB. 盈利\nC. 營業紀錄\nD. 市值",en:"22. In the basic listing requirements of GEM for new applicants, there is no minimum requirement on _____.\nA. cash flow\nB. profit\nC. history of operation\nD. market capitalisation",ans:"B",rate:"30%",exCn:"1. B 正確：香港聯交所的創業板（GEM）旨在為具有高增長潛力的中小型企業提供籌資和上市集資平台。相較於主板（Main Board）新申請人必須通過嚴格的最低「股東應佔盈利」測試，創業板（GEM）對新上市申請人並沒有設置硬性的最低「盈利（Profit）」財務要求（它更關注企業的營業記錄和營運現金流），故選 B。",exEn:"1. B is correct: GEM (Growth Enterprise Market) is designed to provide a listing platform for small and medium-sized enterprises with high growth potential. Unlike the Main Board which requires strict minimum 'profits attributable to shareholders' tests, there is no minimum 'profit' requirement for new listing applicants on the GEM (it focuses more on cash flows and history of operation). Thus, B is correct."},
{q:23,year:2018,y:2018,top:"[out c] 會計的目的及角色 —— 會計的角色與基本功能範圍",topEn:"[out c] Introduction to Accounting —— Functions and Role of Accounting",outc:true,reason:"自 2025 年起，會計的性質、目的、四大核心功能（記錄、分類、歸納、溝通）已被全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, the purpose and role of accounting, and its four core functions (recording, classifying, summarising, communicating) are tested in the Accounting Elective Module Paper 2A.",cn:"23. 下列哪項不是會計的功能？\nA. 歸納企業交易\nB. 監控會計人員的表現\nC. 向不同持份者傳遞企業表現資訊\nD. 把企業交易分類",en:"23. Which of the following is not a function of accounting?\nA. summarising business transactions\nB. monitoring the performance of accounting staff\nC. communicating information on business performance to different stakeholders\nD. classifying business transactions",ans:"B",rate:"88%",exCn:"1. B 不是會計的功能（即正確答案）：監控會計/財務人員的日常工作和業績表現，屬於企業內部人力資源管理（Human Resources Management）或行政管理主管的職責，並不屬於會計學/會計系統本身的功能。\n2. A、C、D 均為會計的核心功能：根據會計的定義，其主要功能包括：記錄交易（Recording）、將交易分類（Classifying，即 D）、將交易結算並歸納編製財務報表（Summarising，即 A）以及向內部和外部持份者傳遞/溝通財務資訊（Communicating，即 C）。故選 B。",exEn:"1. B is not a function of accounting (correct answer): Monitoring the performance of accounting or finance staff is a Human Resources Management or general administrative function, not a function of the accounting system itself.\n2. A, C, and D are core functions of accounting: By definition, the key functions of accounting are recording transactions, classifying transactions (D), summarising transactions into reports (A), and communicating financial performance to stakeholders (C). Thus, B is correct."},
{q:24,year:2018,y:2018,top:"營商環境 —— 企業擁有權類型（普通合夥與有限合夥之特徵）",topEn:"Business Environment —— Forms of Business Ownership (Partnerships: general vs. limited)",cn:"24. 下列哪項有關合夥的陳述是正確的？\n(1) 普通合夥沒有有限合夥人。\n(2) 有限合夥是獨立於東主的法定個體。\n(3) 有限合夥的所有合夥人均只負有限的債務責任。\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(2)及(3)\nD. (1) 、(2)及(3)",en:"24. Which of the following statements about partnerships is/are correct?\n(1) A general partnership has no limited partners.\n(2) A limited partnership is a legal entity separate from its owners.\n(3) All partners in a limited partnership enjoy limited liability.\nA. (1) only\nB. (1) and (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"48%",exCn:"1. 陳述 (1) 正確：在普通合夥（General Partnership）中，所有合夥人均為普通合夥人，共同承擔無限債務責任，因此不設有「有限合夥人」這類成員。\n2. 陳述 (2) 錯誤：合夥（不論是普通還是有限合夥）均屬於「非法團（Unincorporated association）」，它們在法律上並非獨立於其東主的法定個體，不享有獨立法人地位。\n3. 陳述 (3) 錯誤：根據合夥條例，有限合夥（Limited Partnership）中必須有至少一名「普通合夥人（General partner）」來對合夥債務承擔無限責任；如果「所有」合夥人均只承擔有限責任，則該企業必須註冊為有限公司。故只有 (1) 正確，選 A。本題屬於最新必修部分「1(a) 營商環境：企業擁有權類型（合夥）」考核範圍。",exEn:"1. Statement (1) is correct: In a general partnership, all partners are general partners who jointly bear unlimited liability. There are no limited partners in a general partnership.\n2. Statement (2) is incorrect: A partnership (whether general or limited) is an unincorporated business entity. It is NOT a legal entity separate from its owners.\n3. Statement (3) is incorrect: In a limited partnership, there must be at least one general partner who bears unlimited liability for the partnership's debts. If all partners enjoyed limited liability, the business would have to be registered as a limited company. Therefore, only (1) is correct, making A the correct answer. This topic is within the compulsory syllabus '1(a) Business Environment: Forms of Business Ownership (Partnership)'."},
{q:25,year:2018,y:2018,top:"基礎個人理財 —— 策劃個人理財及投資（金融工具風險與回報特徵）",topEn:"Basics of Personal Financial Management —— Personal Financial Planning & Investment (Bonds and Deposits)",cn:"25. 下列哪項有關風險和回報的陳述是正確的？\nA. 市場風險是可以分散的。\nB. 高風險金融產品必有高回報。\nC. 迴避風險的投資者通常喜歡投資債券多於作定期存款。\nD. 保守的退休人士通常喜歡投資債券多於股票。",en:"25. Which of the following statements about risk and return is correct?\nA. Market risk can be diversified.\nB. Financial products with high risk must bring high returns.\nC. Risk-averse investors usually prefer investing in bonds to making term deposits.\nD. Conservative retired persons usually prefer investing in bonds to stocks.",ans:"D",rate:"55%",exCn:"1. D 正確：退休人士通常具有較低的風險承受能力，重視本金安全和穩定的利息。相較於價格波動劇烈且可能損失大筆本金的「股票（Stocks）」，具有固定利息派發與到期收回本金特徵的「債券（Bonds）」風險遠低，因此更適合保守的退休人士。\n2. A、B、C 錯誤：\nA 錯誤：市場風險（系統性風險，如通脹、金融海嘯）是影響整個市場的風險，無法透過分散投資（Diversification）來消除。\nB 錯誤：高風險金融產品代表的是「有機會」獲得較高回報，但「必有高回報」說法過於絕對，亦伴隨巨大的虧損機率。\nC 錯誤：定期存款由商業銀行提供本金和利息保證，風險低於任何企業債券。迴避風險（Risk-averse）的投資者通常更偏好定期存款。本題屬於最新必修部分「1(d) 基礎個人理財：策劃個人理財及投資（金融產品特徵與風險回報取捨）」考核範圍。",exEn:"1. D is correct: Retired persons generally have a low risk tolerance and prefer capital preservation. Compared to volatile stocks, bonds carry lower risks and provide steady interest income with principal repayment at maturity, making them more suitable for conservative retired persons.\n2. A, B, and C are incorrect:\nA is incorrect: Market risk (systematic risk, such as inflation or recession) affects the whole financial market and cannot be diversified away.\nB is incorrect: High-risk financial products only offer the opportunity for higher returns, but they do not guarantee high returns and carry a high probability of loss.\nC is incorrect: Term deposits are backed by commercial banks with guaranteed principal, making them safer than bonds. Risk-averse investors would prefer term deposits over bonds. This topic is within the compulsory syllabus '1(d) Basics of Personal Financial Management: Personal Financial Planning & Investment (Bonds and Deposits)'."},
{q:26,year:2018,y:2018,top:"基礎管理 —— 管理功能（計劃：SMART 目標準則之應用）",topEn:"Basics of Management —— Management Functions (Planning: SMART goals criteria)",cn:"26. 一汽車零售商為其新款汽車訂立銷售目標如下：\n「在2019年，有50%香港駕駛人士會購買我們的新款汽車。」\n這銷售目標符合下列哪項訂定良好目標的準則？\n(1) 具體的\n(2) 可量度的\n(3) 可達到的\nA. 只有(2)\nB. 只有(3)\nC. 只有(1)及(2)\nD. 只有(1)及(3)",en:"26. A car retailer sets the following sales target for its new car model:\n'50% of Hong Kong drivers will buy our new car model in 2019.'\nWhich of the following criteria for setting good objectives is/are met in this sales target?\n(1) specific\n(2) measurable\n(3) attainable\nA. (2) only\nB. (3) only\nC. (1) and (2) only\nD. (1) and (3) only",ans:"C",rate:"74%",exCn:"1. (1) 及 (2) 正確（即 C 正確）：\n(1) 具體（Specific）符合：目標明確指出了時間「在 2019 年」、對象「香港駕駛人士」以及商品「購買我們的新款汽車」，足夠清晰具體。\n(2) 可量度（Measurable）符合：目標給出了明確的數值指標「50%」，這能透過香港運輸署的車輛登記和銷量數據進行統計和量度。\n(3) 可達到（Attainable）不符合：在高度競爭且品牌林立的汽車零售市場中，要求在短短一年內，全港高達一半（50%）的駕駛人士全部購買「同一款」特定新車，完全脫離現實，屬於不切實際且不可達成的目標。\n綜上，符合 (1) 和 (2)，選 C。本題屬於最新必修部分「1(b) 基礎管理：管理功能（計劃：SMART 目標準則）」考核範圍。",exEn:"1. (1) and (2) are correct (C is correct):\n(1) Specific is met: The target specifies the timeframe ('in 2019'), the target audience ('Hong Kong drivers'), and the product ('our new car model'). It is highly specific.\n(2) Measurable is met: The goal provides a quantitative metric ('50%'), which can be easily measured and calculated using vehicle registration data from the Transport Department.\n(3) Attainable is NOT met: In a highly competitive automobile market, expecting 50% of all drivers to purchase the same single car model within a year is unrealistic and practically impossible.\nTherefore, only (1) and (2) are met. Hence, C is correct. This topic is within the compulsory syllabus '1(b) Basics of Management: Management Functions (SMART goals)'."},
{q:27,year:2018,y:2018,top:"基礎管理 —— 有效管理的原則（按權力建立組織架構：直線與幕僚職權）",topEn:"Basics of Management —— Principles of Effective Management (Line and staff authority)",cn:"27. 以下哪項有關「職權」的陳述是正確的？\n(1) 營運經理對其下屬有幕僚職權。\n(2) 人力資源經理對廠房經理有直線職權。\n(3) 會計經理對其下屬有直線職權。\nA. 只有(2)\nB. 只有(3)\nC. 只有(1)及(2)\nD. (1) 、(2)及(3)",en:"27. Which of the following statements about 'authority' is/are correct?\n(1) An operations manager has staff authority over his subordinates.\n(2) A human resources manager has line authority over a plant manager.\n(3) An accounting manager has line authority over his subordinates.\nA. (2) only\nB. (3) only\nC. (1) and (2) only\nD. (1), (2) and (3)",ans:"B",rate:"60%",exCn:"1. (3) 正確（即 B 正確）：\n(3) 正確：會計經理（Accounting Manager）作為會計部門的主管，對其部門內部的直接下屬（如會計文員）擁有直接下達命令、指揮和督導工作的「直線職權（Line authority）」。\n(1) 錯誤：營運經理（Operations Manager）對其直接下屬擁有指揮和下達命令的直線職權，而非幕僚職權。\n(2) 錯誤：人力資源部屬於輔助/參謀性功能部門，人力資源經理對生產一線的廠房經理僅能提供專業人事意見，擁有的是「幕僚/職能職權（Staff/Functional authority）」，無權直接跨部門命令廠房經理，故沒有直線職權。\n綜上，只有 (3) 正確，選 B。本題屬於最新必修部分「1(b) 基礎管理：有效管理的原則（直線與幕僚職權）」考核範圍。",exEn:"1. (3) is correct (B is correct):\n(3) is correct: An accounting manager, as the head of the accounting department, possesses direct command and decision-making power (line authority) over his/her direct subordinates (e.g., accounting clerks).\n(1) is incorrect: An operations manager has line authority (the right to command and direct), not staff authority, over his/her subordinates.\n(2) is incorrect: The HR department is an advisory/staff department. The HR manager can only offer professional HR advice and support to the plant manager (possessing staff authority), and has no line authority to command the plant manager directly.\nTherefore, only (3) is correct. Hence, B is correct. This topic is within the compulsory syllabus '1(b) Basics of Management: Principles of Effective Management (Line and Staff Authority)'."},
{q:28,year:2018,y:2018,top:"營商環境 —— 企業擁有權類型（私人與公眾有限公司之比較）",topEn:"Business Environment —— Forms of Business Ownership (Private vs. Public Limited Companies)",cn:"28. 與公眾有限公司比較，下列哪項是私人有限公司的優點？\n(1) 政府監管較少\n(2) 毋須向股東派發股息\n(3) 融資較易\nA. 只有(1)\nB. 只有(2)\nC. 只有(3)\nD. 只有(1)及(2)",en:"28. Compared to a public limited company, which of the following is/are the advantage(s) of a private limited company?\n(1) It is subject to less government supervision.\n(2) It does not need to distribute dividends to shareholders.\n(3) It can obtain financing more easily.\nA. (1) only\nB. (2) only\nC. (3) only\nD. (1) and (2) only",ans:"A",rate:"61%",exCn:"1. (1) 正確（即 A 正確）：\n(1) 正確：私人有限公司（Private limited company）無須向公眾披露財務報表，亦無強制召開公眾聆訊與廣泛發布財報的義務，因此所面臨的政府監管與法律披露要求遠少於公眾有限公司。\n(2) 錯誤：不論私人還是公眾有限公司，是否派發股息（Dividend）皆由董事局視利潤和未來發展需求自行決定，皆不設有法律「強制派息」義務，故非特有優點。\n(3) 錯誤：公眾有限公司（尤其是上市公司）可以直接向社會大眾發行股票與債券募集資金，其融資能力和管道遠比私人有限公司容易且廣泛。故私人有限公司融資較難。\n綜上，只有 (1) 正確，選 A。本題屬於最新必修部分「1(a) 營商環境：企業擁有權類型（有限公司之比較）」考核範圍。",exEn:"1. (1) is correct (A is correct):\n(1) is correct: Private limited companies are not required to publish their financial statements to the general public, thus they are subject to less government supervision and disclosure regulations than public limited companies.\n(2) is incorrect: For both private and public limited companies, distributing dividends is at the discretion of the board of directors; there is no mandatory obligation to do so. This is not an advantage unique to private companies.\n(3) is incorrect: Public limited companies (especially listed ones) can raise huge capital by issuing shares and debentures to the general public. Thus, public companies can obtain financing much more easily than private companies.\nOnly (1) is correct. Hence, A is correct. This topic is within the compulsory syllabus '1(a) Business Environment: Forms of Business Ownership (Limited Companies Comparison)'."},
{q:29,year:2018,y:2018,top:"[out c] 不同企業擁有權類型的財務報告編製 —— 財務報表（損益表的特徵與編製基礎）",topEn:"[out c] Financial Statements —— Features and Limitations of Income Statement",outc:true,reason:"自 2025 年起，財務報表的用途與限制、現金基礎與應計基礎之辨析，已全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, purposes, limitations and preparation bases (accrual vs. cash basis) of financial statements are tested in the Accounting Elective Module Paper 2A.",cn:"29. 下列哪項有關損益表的陳述是不正確的？\nA. 資料大多是量化的\nB. 資料主要反映過去事項\nC. 其編製需要專業判斷\nD. 其編製只根據現金收入和現金支出",en:"29. Which of the following about an income statement is not correct?\nA. Information is mostly quantitative.\nB. Information mainly reflects past events.\nC. Its preparation involves professional judgements.\nD. Its preparation is based on cash receipts and cash payments only.",ans:"D",rate:"68%",exCn:"1. D 是不正確的（即正確答案）：損益表是基於「應計會計基礎（Accrual Basis of Accounting）」編製（即將當期已賺取收益與已招致費用進行配比，不論現金是否實際收付），而非單純根據現金實收實付的「現金收付基礎（Cash Basis）」編製。故 D 錯誤。\n2. A、B、C 均為正確描述：會計以貨幣為量度單位，故財務報表資訊大多是貨幣「量化（Quantitative）」的；資產負債表與損益表主要記錄已發生交易，反映的是「過去的事項（Past events）」；損益表在估算呆帳準備、折舊年限及折舊率時，需要會計人員的「專業判斷（Professional judgements）」。",exEn:"1. D is incorrect (correct answer): The income statement is prepared based on the 'accrual basis of accounting' (where revenues and expenses are recognized when earned or incurred, regardless of cash flow), rather than being based on cash receipts and cash payments ('cash basis of accounting'). Thus, D is incorrect.\n2. A, B, and C are correct statements: Accounting relies on money measurement, so information is mostly quantitative; financial statements record historical transactions, reflecting mainly past events; and preparation of P&L (such as estimating depreciation and allowance for doubtful debts) requires professional judgements."},
{q:30,year:2018,y:2018,top:"基礎個人理財 —— 強制性公積金（強積金）制度的供款與權益權責關係",topEn:"Basics of Personal Financial Management —— Mandatory Provident Fund (MPF) System",cn:"30. 下列哪項有關強制性公積金(強積金)制度的陳述是正確的？\nA. 年齡介乎16至65歲的自僱人士須參加強積金計劃。\nB. 建造業工人可豁免參加強積金計劃。\nC. 強積金計劃成員如已失業超過兩年，可申請提早從強積金計劃提取累算權益。\nD. 當轉職時，強積金計劃成員可轉移其累算權益往另一強積金受託人。",en:"30. Which of the following statements about the Mandatory Provident Fund (MPF) System is correct?\nA. Self-employed persons aged between 16 and 65 are required to join the MPF Scheme.\nB. Construction workers are exempted from the MPF Scheme.\nC. MPF scheme members can apply for early withdrawal of the accrued benefits from the MPF Scheme if they are unemployed for more than two years.\nD. When changing jobs, MPF scheme members can transfer their accrued benefits to another MPF trustee.",ans:"D",rate:"61%",exCn:"1. D 正確：強積金實行「僱員自選安排」（積金半自由行），當計劃成員轉換工作/轉職時，完全有權將其個人帳戶內的累算權益轉移至自選的新強積金受託人與計劃中，故 D 正確。\n2. A、B、C 錯誤：\nA 錯誤：強積金強制登記與供款的自僱人士年齡範圍應為 18 至 65 歲，而非 16 歲。\nB 錯誤：建造業、餐飲業等高流動性行業的臨時員工，必須依法參加專為其設立的「行業計劃（Industry Schemes）」，絕無豁免。\nC 錯誤：單純的「失業」（不論失業時間有多長）並非提早提取強積金累算權益的法定特殊豁免理由（法定理由為：年滿 60 歲提早退休、永久離開香港、完全喪失行為能力、罹患末期疾病、小額結餘或死亡）。本題屬於最新必修部分「1(d) 基礎個人理財：強積金計劃」考核範圍。",exEn:"1. D is correct: Under the MPF Employee Choice Arrangement, when a scheme member changes jobs, they have the right to transfer their accrued benefits to another trustee and MPF scheme of their own choice.\n2. A, B, and C are incorrect:\nA is incorrect: The mandatory enrollment age for self-employed persons is between 18 and 65, not 16.\nB is incorrect: Casual employees in high-mobility industries (such as construction and catering) must be enrolled in 'Industry Schemes' and are not exempted.\nC is incorrect: General 'unemployment' (no matter how long) is not a statutory ground for early withdrawal of MPF accrued benefits (the legal grounds are: early retirement at 60, permanent departure from HK, total incapacity, terminal illness, small balance, or death). This topic belongs to the compulsory syllabus '1(d) Basics of Personal Financial Management: MPF System'."}];o.innerHTML="OK: "+Q.length+" Qs";}catch(e){o.innerHTML="<span style='color:red'>ERR: "+e.message+"</span>";}</script></body></html>
