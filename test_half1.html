{q:13,year:2016,y:2016,top:"基礎會計 —— 資產分類（非流動資產特徵）",topEn:"Introduction to Accounting —— Assets Classification (Characteristics of non-current assets)",outc:true,reason:"自 2025 年起，基礎會計要素分類已全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, basic accounting elements and classifications are tested in the Accounting Elective Module Paper 2A.",cn:"13. 下列哪項有關非流動資產的陳述是正確的？\nA. 它們的購買成本超過 $100000。\nB. 它們是用於企業運作。\nC. 它們的結餘會在損益表顯示。\nD. 應收貨款是非流動資產。",en:"13. Which of the following statements about non-current assets is correct?\nA. Their purchase costs exceed $100,000.\nB. They are used for business operations.\nC. Their balances are shown in the income statement.\nD. Trade receivables are non-current assets.",ans:"B",rate:"88%",exCn:"1. 非流動資產（Non-current assets）的會計定義為：企業持有以**長期用於營運或生產、而非旨在轉售**的資產（預計可使用超過一個會計年度以上），故 B 正確。\n2. A 錯誤：非流動資產（如辦公桌椅、打卡機等）沒有法定的 $100,000 最低購置成本限制，是否資本化取決於其用途及重要性（Materiality）。\n3. C 錯誤：資產的餘額（實帳戶）必須呈現在「財務狀況表」而非「損益表」中。\n4. D 錯誤：應收貨款（Trade receivables）預計在 12 個月內變現清還，屬於「流動資產（Current assets）」。",exEn:"1. The accounting definition of a non-current asset is an asset acquired **for long-term use in business operations or production** rather than for resale (expected to be used for more than one accounting period), hence B is correct.\n2. A is incorrect: There is no minimum capital cost requirement of $100,000; classification depends on its nature and materiality.\n3. C is incorrect: Non-current asset balances (permanent real accounts) are presented in the Statement of Financial Position, not the Income Statement.\n4. D is incorrect: Trade receivables are expected to be converted into cash within 12 months, hence they are classified as current assets."},
{q:14,year:2016,y:2016,top:"基礎個人理財 —— 金錢的時間值（淨現值 NPV 計算）",topEn:"Basics of Personal Financial Management —— Time Value of Money (Calculating Net Present Value)",cn:"14. 一家銀行提供一個儲蓄計劃，需要初期存款 $100000。這計劃在其後數年年終會提供現金流如下：\n* 第一年：$20000\n* 第二年：$35000\n* 第三年：$55000\n假如貼現率為每年 5%，這儲蓄計劃的淨現值是多少？\nA. $10 000\nB. $9523.81\nC. $4761.90\nD. -$1695.28",en:"14. A bank offers a savings plan that requires an initial deposit of $100,000. The plan provides cash flows at the end of subsequent years as follows:\n* Year 1: $20,000\n* Year 2: $35,000\n* Year 3: $55,000\nIf the discount rate is 5% per annum, what is the net present value of this savings plan?\nA. $10,000\nB. $9,523.81\nC. $4,761.90\nD. -$1,695.28",ans:"D",rate:"58%",exCn:"本題考查淨現值（NPV）折現計算（不超過三個複息期且不使用年金表）：\n1. 初始投資現金流出（第0期） = -$100,000\n2. 每年年終現金流入折現：\n   * 第一年現值 = $20,000 / 1.05 = $19,047.62\n   * 第二年現值 = $35,000 / (1.05)^2 = $35,000 / 1.1025 = $31,746.03\n   * 第三年現值 = $55,000 / (1.05)^3 = $55,000 / 1.157625 = $47,511.07\n3. 總現值 = $19,047.62 + $31,746.03 + $47,511.07 = $98,304.72\n4. 淨現值（NPV） = 總現值 - 初始成本 = $98,304.72 - $100,000 = **-$1,695.28**，故選 D。",exEn:"This question tests the calculation of Net Present Value (NPV) for a maximum of three compounding periods:\n1. Initial cash outflow (Year 0) = -$100,000\n2. Discounting the subsequent cash inflows at the end of each year:\n   * PV of Year 1 inflow = $20,000 / 1.05 = $19,047.62\n   * PV of Year 2 inflow = $35,000 / (1.05)^2 = $31,746.03\n   * PV of Year 3 inflow = $55,000 / (1.05)^3 = $47,511.07\n3. Total Present Value of inflows = $19,047.62 + $31,746.03 + $47,511.07 = $98,304.72\n4. Net Present Value (NPV) = Total PV - Initial Cost = $98,304.72 - $100,000 = **-$1,695.28**. Thus, D is correct."},
{q:15,year:2016,y:2016,top:"營商環境 —— 商業道德及社會責任（企業履行社會責任之具體案例判定）",topEn:"Business Environment —— Business Ethics & Social Responsibility (Identifying socially responsible behaviors)",cn:"15. 下列哪些是履行社會責任的公司？\n(1) 一家發展新科技以助減少氣體排放的電力公司。\n(2) 一家接受很多社會福利機構訂單的印刷公司。\n(3) 一家鼓勵員工參與義務工作以服務社會的貿易公司。\nA. 只有 (1)\nB. 只有 (1) 及 (3)\nC. 只有 (2) 及 (3)\nD. (1)、(2) 及 (3)",en:"15. Which of the following companies is/are socially responsible?\n(1) A power company which develops new technology to help reduce gas emissions.\n(2) A printing company which accepts many orders from social welfare organisations.\n(3) A trading company which encourages employees to participate in voluntary work to serve the community.\nA. (1) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"51%",exCn:"社會責任（CSR）是指企業採取超越利潤最大化和法律義務、旨在提升社會與公眾福祉、保護環境的自主行為。\n1. (1) 是社會責任：主動研發科技減排保護環境，體現對環境保護與可持續發展的責任。\n2. (3) 是社會責任：鼓勵員工參與義工服務社會，屬於履行社區及社會責任的關懷行動。\n3. (2) 不是社會責任：印刷公司接受社福機構訂單並收費，本質上是**純商業利益的市場買賣交易行為**，並非義務或超越商業利益的社會責任措施。故只有 (1) 和 (3) 正確，選 B。",exEn:"Corporate Social Responsibility (CSR) refers to voluntary actions taken by businesses that go beyond profit maximization and legal requirements to benefit society, stakeholders, and the environment.\n1. (1) is CSR: Developing emission-reducing technology voluntarily supports environmental protection.\n2. (3) is CSR: Encouraging employees to participate in community voluntary work represents community responsibility.\n3. (2) is not CSR: Accepting printing orders from welfare organizations and charging for them is a **regular commercial transaction** and does not constitute a CSR measure. Therefore, only (1) and (3) are correct, making B the correct answer."},
{q:16,year:2016,y:2016,top:"企業擁有權類型（公營公司與有限公司特徵）",topEn:"Forms of Business Ownership —— Forms of Ownership (Public corporations & Limited companies)",outc:true,reason:"自 2025 年文憑試起，「公營公司（Public Corporation）」已被移出 Paper 1 必修考綱，不再納入卷一考核範圍。",reasonEn:"Since the 2025 HKDSE, public corporations are completely removed from the Compulsory Part (Paper 1) curriculum.",cn:"16. 下列哪項有關企業擁有權的陳述是正確的？\n(1) 公營公司是由政府全資擁有的。\n(2) 有限公司的最少股東人數是 2 人。\n(3) 名義合夥人不是合夥的擁有人。\nA. 只有 (1) 和 (2)\nB. 只有 (1) 和 (3)\nC. 只有 (2) 和 (3)\nD. (1)、(2) 和 (3)",en:"16. Which of the following statements about business ownership are correct?\n(1) Public corporations are wholly owned by the Government.\n(2) The minimum number of shareholders of a limited company is 2.\n(3) A nominal partner is not the owner of the partnership.\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"50%",exCn:"1. 公營公司（Public Corporation）由政府全資撥款設立並擁有，故陳述 (1) 正確。\n2. 名義合夥人（Nominal partner）只是向合夥企業出借姓名或聲譽以推廣業務，其不投入資本、不享有擁有權亦不參與經營，故陳述 (3) 正確。\n3. 在現行香港《公司條例》（Cap. 622）規定下，**私人有限公司的最少股東人數為 1 人**，而非 2 人，故陳述 (2) 錯誤。選 B。",exEn:"1. Public corporations are established and wholly owned by the Government, hence statement (1) is correct.\n2. A nominal partner merely lends his/her name or reputation to help promote the business; they do not contribute capital and have no ownership, hence statement (3) is correct.\n3. Under the current Hong Kong Companies Ordinance (Cap. 622), **the minimum number of shareholders of a private limited company is 1**, not 2, hence statement (2) is incorrect. Therefore, only (1) and (3) are correct, making B the correct answer."},
{q:17,year:2016,y:2016,top:"營商環境 —— 香港的營商環境與特徵（CEPA 對香港貨品進口內地之利益）",topEn:"Business Environment —— HK's Business Environment (Benefits of CEPA)",cn:"17. 下列哪項是《更緊密經貿關係安排》(CEPA)為香港企業所帶來的利益？\nA. 香港居民擁有的公司在內地不用繳稅。\nB. 香港與內地資金可自由流動。\nC. 原產香港的貨品出口內地不需繳付關稅。\nD. 香港可作為獨立經濟體加入世界貿易組織。",en:"17. Which of the following is a benefit brought about by the \"Closer Economic Partnership Arrangement\" (CEPA) for the businesses in Hong Kong?\nA. Companies owned by Hong Kong residents are not taxed on the Mainland.\nB. There is free flow of capital between Hong Kong and the Mainland.\nC. All goods of Hong Kong origin can enjoy zero tariff preference upon importation into the Mainland.\nD. Hong Kong can join the World Trade Organization as an independent economy.",ans:"C",rate:"41%",exCn:"1. 根據《內地與香港關於建立更緊密經貿關係安排》（CEPA）之「貨物貿易」協定，符合 CEPA 原產地規則的所有**「原產香港的貨品」在進口內地時均可享有「零關稅（Zero tariff）」優惠**，這極大地提升了香港本土製造業的競爭力，故 C 正確。\n2. A、B 錯誤：在內地營運的公司仍需按內地法律納稅，且 CEPA 並未實現內地與香港之間完全、無管制的「資金自由流動」。\n3. D 錯誤：香港早在 1995 年 WTO 成立時即以「中國香港」名義作為獨立關稅區創始成員加入，非 CEPA 之利益。",exEn:"1. Under the Trade in Goods of the Closer Economic Partnership Arrangement (CEPA), **all goods originating in Hong Kong can enjoy zero tariff preference upon importation into the Mainland**, significantly boosting HK manufacturing, hence C is correct.\n2. A and B are incorrect: Companies in the Mainland are still subject to Mainland tax regulations, and CEPA does not establish completely unregulated free flow of capital.\n3. D is incorrect: Hong Kong has been a founding member of the WTO (as an independent customs territory) since 1995, which has no relationship with CEPA."},
{q:18,year:2016,y:2016,top:"基礎會計 —— 複式記帳法（判定正確的會計分錄）",topEn:"Double-entry Bookkeeping —— Verifying Double Entries (Identifying correct journal entries)",outc:true,reason:"自 2025 年起，「複式記帳原則及會計分錄」已全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, double-entry bookkeeping and journal entry operations are tested in the Accounting Elective Module Paper 2A.",cn:"18. 下列哪項複式記帳是正確的？\n(1) 交易：退貨予供應商 | 借記帳戶：購貨 | 貸記帳戶：購貨退出\n(2) 交易：將現金存入銀行戶口 | 借記帳戶：銀行存款 | 貸記帳戶：現金\n(3) 交易：賒銷貨品予顧客 | 借記帳戶：應收貨款 | 貸記帳戶：銷貨\nA. 只有 (1) 和 (2)\nB. 只有 (1) 和 (3)\nC. 只有 (2) 和 (3)\nD. (1)、(2) 和 (3)",en:"18. Which of the following double entries are correct?\n(1) Transaction: Returned goods to a supplier | Debit: Purchases | Credit: Returns outwards\n(2) Transaction: Deposited cash into bank account | Debit: Bank | Credit: Cash\n(3) Transaction: Sold goods to a customer on credit | Debit: Trade receivables | Credit: Sales\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"75%",exCn:"(1) 錯誤：退回貨品給供應商，負債減少「借記：應付貨款」，購貨退出增加「貸記：購貨退出（Returns outwards）」，而非借記購貨。\n(2) 正確：將現金存入銀行，銀行資產增加「借記：銀行存款/銀行」，現金資產減少「貸記：現金」。\n(3) 正確：賒銷貨品予顧客，應收貨款（資產）增加「借記：應收貨款/應收帳款」，銷貨（收益）增加「貸記：銷貨」。\n因此 (2) 和 (3) 正確，選 C。",exEn:"(1) is incorrect: When returning goods to a supplier, liabilities decrease, so we debit Trade Payables; returns outwards increase, so we **credit Returns Outwards (Purchases Returns)**. Debiting purchases is wrong.\n(2) is correct: Depositing cash into the bank increases bank assets (debit Bank) and decreases cash assets (credit Cash).\n(3) is correct: Credit sales to a customer increase trade receivables assets (debit Trade Receivables) and increase sales revenue (credit Sales).\nTherefore, only (2) and (3) are correct, making C the correct answer."},
{q:19,year:2016,y:2016,top:"基礎個人理財 —— 金錢的時間值（計息頻率與複利回報率之算術對比）",topEn:"Basics of Personal Financial Management —— Time Value of Money (Comparing compounding frequencies)",cn:"19. 白德擬把現金 $500000 存入銀行，為期半年。銀行向他提供下列儲蓄計劃，哪個計劃的回報最高？\nA. 半年後總利息為 $6000。\nB. 每季計算複利息，年利率為 2.4%。\nC. 每半年計算複利息，年利率為 2.4%。\nD. 每年計算複利息，年利率為 2.4%。",en:"19. Peter plans to deposit $500,000 cash in a bank for half a year. The bank offers him the following savings plans. Which plan offers the highest return?\nA. The total interest after half a year is $6,000.\nB. Interest is compounded quarterly at an annual interest rate of 2.4%.\nC. Interest is compounded semi-annually at an annual interest rate of 2.4%.\nD. Interest is compounded annually at an annual interest rate of 2.4%.",ans:"B",rate:"74%",exCn:"我們折算為「半年」的實際回報率進行對比：\n* 計劃 A：利息 $6,000。半年回報率 = $6,000 / $500,000 x 100% = 1.2%。\n* 計劃 B：年利率 2.4%，每季計息。半年（2個季度）的複利回報率 = (1 + 2.4%/4)^2 - 1 = (1 + 0.6%)^2 - 1 = 1.012036 - 1 = 1.2036%。\n* 計劃 C：年利率 2.4%，每半年計息。半年的複利回報率 = (1 + 2.4%/2)^1 - 1 = 1.2%。\n* 計劃 D：年利率 2.4%，按年計息。在存滿半年時無法獲得複利優勢，其利息按簡單比例僅為 2.4% x 0.5 = 1.2%。\n比較可知，由於計息頻率最高（B 按季計息），產生的利滾利效益最大，實際半年回報率最高（1.2036% > 1.2%），故選 B。",exEn:"Let's calculate the effective return over the 6-month (half-year) period for each option:\n* Plan A: The 6-month rate of return is $6,000 / $500,000 x 100% = 1.2%.\n* Plan B: Annual rate 2.4% compounded quarterly. In half a year (2 quarters), the rate of return = (1 + 2.4%/4)^2 - 1 = (1 + 0.6%)^2 - 1 = 1.2036%.\n* Plan C: Annual rate 2.4% compounded semi-annually. For half a year (1 period), the rate of return = (1 + 2.4%/2)^1 - 1 = 1.2%.\n* Plan D: Annual rate 2.4% compounded annually. For a deposit withdrawn in 6 months, no compounding occurs, giving simple interest = 2.4% x 6/12 = 1.2%.\nComparing the rates, Plan B has the highest frequency of compounding, producing the highest effective return (1.2036% > 1.2%). Thus, B is correct."},
{q:20,year:2016,y:2016,top:"中小型企業 —— 香港中小型企業對本地經濟的貢獻與角色",topEn:"Small and Medium Enterprises —— Contributions to HK Economy (Role of SMEs in the economy)",cn:"20. 下列哪項說明中小型企業對本地經濟的重要？\n(1) 他們為大企業提供物料和服務。\n(2) 他們供應獨特的產品以滿足香港市場的需要。\n(3) 他們是香港稅收的主要來源。\nA. 只有 (1) 和 (2)\nB. 只有 (1) 和 (3)\nC. 只有 (2) 和 (3)\nD. (1)、(2) 和 (3)",en:"20. Which of the following explain the importance of small and medium enterprises (SMEs) to the local economy?\n(1) They provide materials and services to large businesses.\n(2) They provide unique products to satisfy the needs of the Hong Kong market.\n(3) They provide the major source of tax income for Hong Kong.\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"61%",exCn:"1. (1) 正確：中小型企業常作為分判商（Subcontractors）或特定供應商，向大型跨國企業供應零部件及提供專業後勤外判服務，在大企業的生產網絡中起到關鍵的補足作用。\n2. (2) 正確：中小企經營靈活，常能發掘並供應具有獨特創意及針對市場縫隙的商品，滿足港人多元化、利基市場的消費需要。\n3. (3) 錯誤：雖然中小企企業數目龐大，但其業務規模和盈利薄弱，**香港利得稅及稅收的最主要來源仍是少數大型跨國公司及上市公司**。故 (1) 和 (2) 正確，選 A。",exEn:"1. (1) is correct: SMEs often act as subcontractors or ancillary suppliers, providing essential parts and services that support large enterprises' global value chains.\n2. (2) is correct: SMEs are flexible and highly responsive to niche markets, allowing them to supply unique products to meet localized, diverse demands in Hong Kong.\n3. (3) is incorrect: Although SMEs account for 98% of business establishments, **large corporations and listed conglomerates remain the primary source of profits tax revenue** for the Hong Kong government. Therefore, only (1) and (2) are correct, making A the correct answer."},
{q:21,year:2016,y:2016,top:"基礎會計 —— 複式記帳法（帳戶借貸方向之增減判定）",topEn:"Bookkeeping —— Double Entry Rules (Identifying transactions recorded on the credit side)",outc:true,reason:"自 2025 年起，「複式記帳與科目借貸法則」已全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, bookkeeping accounting entry rules are tested in the Accounting Elective Module Paper 2A.",cn:"21. 下列哪項應在有關帳戶的貸方入帳？\n(1) 資本減少 | 帳戶：資本\n(2) 應付貨款增加 | 帳戶：應付貨款\n(3) 銀行存款減少 | 帳戶：銀行存款（「銀行」）\nA. 只有 (1) 和 (2)\nB. 只有 (1) 和 (3)\nC. 只有 (2) 和 (3)\nD. (1)、(2) 和 (3)",en:"21. Which of the following should be recorded on the credit side of the respective accounts?\n(1) Decrease in capital | Account: Capital\n(2) Increase in trade payables | Account: Trade payables\n(3) Decrease in cash at bank | Account: Bank\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"76%",exCn:"我們根據會計帳戶借貸法則（Rules of Debit and Credit）判定：\n1. (1) 錯誤：資本（Capital）屬於權益類。其正常餘額在貸方（Credit），因此**資本「減少」應記入「借方（Debit）」**，而非貸方。\n2. (2) 正確：應付貨款（Trade payables）屬於負債類。負債增加記入貸方（Credit）。\n3. (3) 正確：銀行存款（Cash at bank）屬於資產類。資產減少記入貸方（Credit）。\n因此，(2) 和 (3) 應在貸方入帳，選 C。",exEn:"We determine the entry direction based on the rules of debit and credit:\n1. (1) is incorrect: Capital has a normal credit balance, so a **decrease in capital is recorded on the debit side**, not the credit side.\n2. (2) is correct: Trade payables is a liability account. An increase in liabilities is recorded on the credit side.\n3. (3) is correct: Cash at bank is an asset account. A decrease in assets is recorded on the credit side.\nTherefore, (2) and (3) should be recorded on the credit side. Thus, C is the correct answer."},
{q:22,year:2016,y:2016,top:"基礎管理 —— 管理功能（計劃：定立專案目標之好處與限制）",topEn:"Basics of Management —— Management Functions (Benefits of defining goals)",cn:"22. 下列哪項是為計劃定下目標所帶來的好處？\n(1) 為員工提供清晰方向\n(2) 有助控制工作進度及監察員工表現\n(3) 減輕員工工作量\nA. 只有 (1) 和 (2)\nB. 只有 (1) 和 (3)\nC. 只有 (2) 和 (3)\nD. (1)、(2) 和 (3)",en:"22. Which of the following are the benefits of defining the goal of a project?\n(1) provide clear directions to employees\n(2) help control the progress of work and monitor the performance of employees\n(3) reduce employees' workload\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"80%",exCn:"定立專案目標（Defining goals）的好處包括：\n1. (1) 正確：目標能為組織員工指出明確的工作成果和核心目的，提供清晰的奮鬥方向。\n2. (2) 正確：在控制（Controlling）功能中，設定好的目標就是「表現標準（Performance standards）」，能讓經理以此標準來量度實際進度，從而進行有效的監控與反饋。\n3. (3) 錯誤：定立目標通常旨在提高工作效率和指引成果，**並不能（亦非為了）減輕員工的工作量**。故 (1) 和 (2) 正確，選 A。",exEn:"The benefits of defining clear project goals include:\n1. (1) is correct: Goals provide clear direction and a unified purpose for employees, ensuring everyone knows what needs to be achieved.\n2. (2) is correct: In the controlling function, goals serve as **performance standards**. Managers use them as benchmarks to measure actual performance and take corrective actions.\n3. (3) is incorrect: Setting goals does not necessarily reduce the workload; instead, it provides focus and measures efficiency. Therefore, (1) and (2) are correct, making A the correct answer."},
{q:23,year:2016,y:2016,top:"複式記帳法與會計等式 —— 會計等式推算與資本變動（計算年度淨利）",topEn:"Accounting Equation —— Capital Movements (Calculating Net Profit based on assets & liabilities)",outc:true,reason:"自 2025 年起，「會計等式之運算及資本變動核算」已全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, accounting equation calculations and capital movements are tested in the Accounting Elective Module Paper 2A.",cn:"23. 2015 年 1 月 1 日，李先生成立一家商號，投入現金 $100000。同日，商號向銀行貸款 $200000。該年年終，商號的總資產和總負債分別為 $980000 和 $560000。該年度內，李先生每月定期提用現金 $5000。該商號 2015 年度的淨利是多少？\nA. $180 000\nB. $260 000\nC. $325 000\nD. $380 000",en:"23. On 1 January 2015, Mr Lee set up a firm with cash $100 000. On the same day, the firm took out a loan of $200 000 from a bank. At the end of that year, total assets and total liabilities of the firm were $980 000 and $560 000 respectively. During the year, Mr Lee made regular cash drawings of $5 000 per month. What is the net profit of the firm for the year 2015?\nA. $180,000\nB. $260,000\nC. $325,000\nD. $380,000",ans:"D",rate:"33%",exCn:"本題利用會計等式及資本變動公式進行推導：\n1. **計算期初資本（1/1/2015）** = 東主個人投入之現金 = **$100,000**（銀行貸款 $200,000 屬於負債，不計入期初資本淨值）。\n2. **計算期末資本（31/12/2015）** = 期末資產總額 $980,000 - 期末負債總額 $560,000 = **$420,000**。\n3. **計算當期總提用（Drawings）** = 每月提用 $5,000 x 12個月 = **$60,000**。\n4. **套用資本變動等式**：期末資本 = 期初資本 + 當期淨利 - 當期提用\n   * $420,000 = $100,000 + 當期淨利 - $60,000\n   * $420,000 = $40,000 + 當期淨利\n   * 當期淨利 = $420,000 - $40,000 = **$380,000**，故選 D。",exEn:"This question can be solved using the accounting equation and capital movement formula:\n1. **Initial Capital (1 Jan 2015)** = Owner's cash injection = **$100,000** (the bank loan of $200,000 is a liability, not capital).\n2. **Closing Capital (31 Dec 2015)** = Closing Assets $980,000 - Closing Liabilities $560,000 = **$420,000**.\n3. **Total Drawings** = $5,000 x 12 months = **$60,000**.\n4. **Apply Capital Movement Formula**: Closing Capital = Opening Capital + Net Profit - Drawings\n   * $420,000 = $100,000 + Net Profit - $60,000\n   * $420,000 = $40,000 + Net Profit\n   * Net Profit = $420,000 - $40,000 = **$380,000**. Thus, D is correct."},
{q:24,year:2016,y:2016,top:"基礎管理 —— 有效管理的原則（統一命令原則之核心定義）",topEn:"Basics of Management —— Principles of Management (Definition of Unity of Command)",cn:"24. 下列哪項有關『統一命令』的陳述是正確的？\nA. 每名經理只負責一個項目。\nB. 每名下屬只直接向一名上司報告。\nC. 所有僱員都朝相同目標工作。\nD. 所有獲派同一任務的僱員都會收到相同的指令。",en:"24. Which of the following statements about \"unity of command\" is correct?\nA. Each manager takes up one project only.\nB. Each subordinate directly reports to one supervisor only.\nC. All employees are working towards the same goals.\nD. All employees receive the same instructions when assigned the same tasks.",ans:"B",rate:"71%",exCn:"1. **統一命令原則（Unity of Command）** 的核心學術與實務定義是：**組織內部的每一位下屬成員，應該「只」直接聽命於並向「唯一」一位主管進行工作匯報與報告**，以避免因為多頭領導而收到互相衝突、矛盾的指示，故 B 正確。\n2. C 屬於「統一的方向（Unity of direction）」原則；A、D 為無關的干擾選項。",exEn:"1. The fundamental definition of the **unity of command** principle is that **each subordinate should receive orders from, and report directly to, only one immediate supervisor** to avoid conflicting instructions and role ambiguity, hence B is correct.\n2. C represents \"unity of direction\"; A and D are irrelevant distractors."},
{q:25,year:2016,y:2016,top:"基礎個人理財 —— 強制性公積金（強積金自僱人士供款與提取規定）",topEn:"Basics of Personal Financial Management —— MPF Scheme (Rights and responsibilities of self-employed persons under MPF)",cn:"25. 卓文是一位自僱時裝設計師，他\n(1) 有權不登記參加強制性公積金（強積金）計劃。\n(2) 有權向強積金計劃作自願性供款。\n(3) 如果移民到另一個國家，有權在 65 歲前從強積金計劃提取他的累算權益。\nA. 只有 (1)\nB. 只有 (2)\nC. 只有 (3)\nD. 只有 (2) 及 (3)",en:"25. Simon is a self-employed fashion designer. He\n(1) has the right not to enrol into an Mandatory Provident Fund (MPF) scheme.\n(2) has the right to make voluntary contributions to the MPF scheme.\n(3) has the right to withdraw his accrued benefits from the MPF scheme before reaching the age 65 if he migrates to another country.\nA. (1) only\nB. (2) only\nC. (3) only\nD. (2) and (3) only",ans:"D",rate:"60%",exCn:"根據強積金（MPF）條例，卓文作為 18 至 65 歲的「自僱人士」：\n1. (1) 錯誤：除非屬於法定豁免人士，否則所有自僱人士**皆必須強制性登記**加入強積金計劃，其「沒有權利」不參加。\n2. (2) 正確：除了法定的 5% 強制性供款外，任何成員皆享有權利做出額外的「自願性供款（Voluntary contributions）」來累積退休金。\n3. (3) 正確：成員若因為「永久性離開香港 / 移民外地」，屬於法定允許的特殊豁免理由，有權**在 65 歲前申請提早提取**強積金累算權益。故 (2) 及 (3) 正確，選 D。",exEn:"According to the MPF Ordinance in Hong Kong, Simon, as a self-employed person aged between 18 and 65:\n1. (1) is incorrect: Self-employed persons are **mandatorily required to enroll** in an MPF scheme (unless legally exempted); they do not have the right not to enroll.\n2. (2) is correct: All MPF members have the right to make additional voluntary contributions on top of the mandatory 5% contribution.\n3. (3) is correct: Permanent departure from Hong Kong (e.g., migrating to another country) is a legally valid ground for early withdrawal of accrued benefits before age 65. Therefore, only (2) and (3) are correct, making D the correct answer."},
{q:26,year:2016,y:2016,top:"基礎會計 —— 財務報表的使用者（政府使用報表的正確用途）",topEn:"Trading Account —— Users of Financial Information (Main use of statements for Government)",outc:true,reason:"自 2025 年起，「財務報表使用者的資訊需要」已全數被移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, financial statement users and their information needs are tested in the Accounting Elective Module Paper 2A.",cn:"26. 下列哪項不是公司財務報表對相關用家的主要用途？\n用家 | 主要用途\nA. 管理人員 | 制定公司發展策略\nB. 僱員 | 評估薪金水平和職業保障\nC. 政府 | 評估公司償還稅款的能力\nD. 購貨債權人 | 決定是否賒銷貨物予公司",en:"26. Which of the following is not the main use of a company's financial statements for the respective users?\nUser | Main use\nA. managers | to formulate company's development strategies\nB. employees | to assess their remuneration level and job security\nC. government | to assess company's ability to repay tax\nD. trade creditors | to decide whether to sell goods to the company on credit",ans:"C",rate:"28%",exCn:"本題是一道極具迷惑性的名詞及功能判定題，正確率僅為 28%。\n1. A、B、D 正確：管理層、員工及供應商（債權人）使用財報的用途描述皆完全符合其資訊需要。\n2. C 錯誤：政府（尤其是稅務局）使用企業財務報表的主要目的是**「計算與核定企業應繳納的利得稅稅額（Assess and calculate profits tax payable）」**，而**並非**去評估企業「償還稅款的能力（Assess company's ability to repay tax）」，故 C 不是正確用途，當選 C。",exEn:"This is a tricky question regarding the specific needs of financial statement users, with a passing rate of only 28%:\n1. A, B, and D are correct: Managers, employees, and trade creditors' uses are accurately described.\n2. C is incorrect: The government (specifically the Inland Revenue Department) uses financial statements to **assess and calculate the correct amount of profits tax payable**, rather than to \"assess the company's ability to repay tax\". Hence, C is not the main use, making C the correct option."},
{q:27,year:2016,y:2016,top:"基礎個人理財 —— 證券交易（主板與 GEM 上市條件對比）",topEn:"Stock Trading —— Listing Platforms (Comparing requirements of Main Board and GEM)",outc:true,reason:"自 2025 年起，必修部分考綱明確規定「以證券交易作投資：不包括主板及創業板新申請人的基本上市要求」，此主題已被移出 Paper 1 必修考綱。",reasonEn:"Starting from the 2025 HKDSE, basic listing requirements for Main Board and GEM are explicitly excluded from the Compulsory Part (Paper 1) syllabus.",cn:"27. 與主板的基本上市要求比較，\n* 創業板的申請者的營運記錄要求______(1)______。\n* 創業板的申請者的市值要求______(2)______。\nA. (1) 較寬鬆 (2) 較嚴謹\nB. (1) 較嚴謹 (2) 較寬鬆\nC. (1) 較嚴謹 (2) 較嚴謹\nD. (1) 較寬鬆 (2) 較寬鬆",en:"27. Compared with the Main Board's basic listing requirements,\n* the operating history requirement for Growth Enterprise Market (GEM) applicants is ______(1)______.\n* the market capitalisation requirement for Growth Enterprise Market applicants is ______(2)______.\nA. (1) looser (2) stricter\nB. (1) stricter (2) looser\nC. (1) stricter (2) stricter\nD. (1) looser (2) looser",ans:"D",rate:"66%",exCn:"1. 香港交易所的創業板（GEM）旨在為具有增長潛力的中小型及中生代企業提供融資渠道。\n2. 因此，相比起定位於大型、根基穩健企業的「主板（Main Board）」：創業板（GEM）不論在「最低營運歷史紀錄年期」還是「最低上市市值要求」等硬性財務指標上，其核批標準**均「較為寬鬆（Looser）」**。故 (1) 較寬鬆、(2) 較寬鬆，選 D。",exEn:"1. The Growth Enterprise Market (GEM) is designed to provide a fundraising platform for smaller, growing companies with expansion potential.\n2. Therefore, compared to the Main Board which is targeted at established conglomerates: GEM's quantitative requirements for both the minimum **operating history (1)** and **market capitalisation (2)** are **looser** (less demanding). Thus, D is the correct answer."},
{q:28,year:2016,y:2016,top:"營商環境 —— 企業擁有權類型（香港合夥企業之法律及債務特徵）",topEn:"Business Environment —— Forms of Business Ownership (Characteristics of partnerships in HK)",cn:"28. 在香港，______(1)______較易成立並享有較低稅率。______(2)______，所有東主須對其餘東主的企業決策負責。\nA. 合夥，在合夥營運下\nB. 獨資，在獨資營運下\nC. 私人有限公司，在私人有限公司營運下\nD. 公眾有限公司，在公眾有限公司營運下",en:"28. A ______ is easier to set up and enjoys a relatively low tax rate in Hong Kong. In this entity, all owners are liable for the business decisions of one another.\nA. partnership\nB. sole proprietorship\nC. private limited company\nD. public limited company",ans:"A",rate:"76%",exCn:"在香港：\n1. **合夥（Partnership）（A）**與獨資均屬於非法團企業（Unincorporated business），其設立程序極為精簡（僅需辦理商業登記），行政成本低，且利得稅率（15%）低於有限公司法團（16.5%）。\n2. 根據《合夥條例》，普通合夥的成員之間存在**「互為代理人（Mutual agency）」**關係：普通合夥人在日常業務中代表合夥企業做出的任何合規商業決定和債務契約，**全體其他合夥人均須承擔共同及連帶的無限債務責任**。因此符合題幹中所有描述，選 A。",exEn:"In Hong Kong:\n1. A **partnership (A)** is unincorporated, meaning its setup is simple (only business registration required) and it enjoys a lower tax rate (15%) than incorporated companies (16.5%).\n2. Under the Partnership Ordinance, partners act as **mutual agents**. Any business decision or contract made by one partner binds **all other partners**, who share joint and several unlimited liability for the debts incurred. This matches the description perfectly, making A the correct answer."},
{q:29,year:2016,y:2016,top:"不同企業擁有權類型的財務報告編製 —— 損益表（賒購/賒銷退出對銷貨成本的核算）",topEn:"Trading Account —— Cost of Goods Sold Calculations (Extracting COGS from ledger balances)",outc:true,reason:"自 2025 年起，銷貨成本與損益表項目之編製核算已全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, COGS and detailed trading account computations are tested in the Accounting Elective Module Paper 2A.",cn:"29. 下列 2015 年 12 月 31 日的會計帳戶結餘是從一家商號的帳冊內摘取：\n* 購貨：$75 000 | 銷貨退回和購貨退出：借方 $5 000 / 貸方 $3 000\n* 銷貨折扣和購貨折扣：借方 $3 500 / 貸方 $2 000 | 存貨, 2015 年 1 月 1 日：$15 000\n* 電費：$10 000 | 工資與薪金：$36 500\n如果 2015 年 12 月 31 日的存貨是 $27000，截至 2015 年 12 月 31 日止年度的銷貨成本是多少？\nA. $54 500\nB. $58 000\nC. $60 000\nD. $63 000",en:"29. The following account balances as at 31 December 2015 were extracted from the books of a firm:\n* Purchases: $75,000 | Returns inwards and returns outwards: Debit $5,000 / Credit $3,000\n* Discounts allowed and discounts received: Debit $3,500 / Credit $2,000 | Inventory, 1 January 2015: $15,000\n* Electricity: $10,000 | Wages and salaries: $36,500\nIf the inventory as at 31 December 2015 was $27,000, what is the cost of goods sold for the year ended 31 December 2015?\nA. $54,500\nB. $58,000\nC. $60,000\nD. $63,000",ans:"C",rate:"76%",exCn:"我們需要精確提取與「銷貨成本（COGS）」計算相關的科目進行算術求值：\n1. **判定購貨退出（Returns outwards）**：\n   * 銷貨退回（資產/收益沖減）餘額在借方，故 借方 $5,000 為銷貨退回。\n   * 購貨退出（費用沖減）餘額在貸方，故 **貸方 $3,000 為購貨退出**。\n2. **計算銷貨成本（COGS）** = 期初存貨 ($15,000) + 購貨 ($75,000) - 購貨退出 ($3,000) - 期末存貨 ($27,000) = **$60,000**。\n3. 其他科目（電費、工資薪金、折扣、銷貨退回）均列於毛利之後或不計入 COGS 中，不影響計算。故選 C。",exEn:"We extract the balances related to the Cost of Goods Sold (COGS) calculation:\n1. **Identify Returns Outwards**: \n   * Returns inwards has a debit balance (Dr. $5,000 is returns inwards).\n   * Returns outwards (purchases returns) has a credit balance, so **Cr. $3,000 is returns outwards**.\n2. **Calculate COGS** = Opening Inventory ($15,000) + Purchases ($75,000) - Returns Outwards ($3,000) - Closing Inventory ($27,000) = **$60,000**.\n3. Other balances (electricity, wages, discounts, returns inwards) are operating expenses or listed elsewhere, and do not affect COGS. Thus, C is correct."},
{q:30,year:2016,y:2016,top:"不同企業擁有權類型的財務報告編製 —— 損益表（營業費用與毛利之逆向核算）",topEn:"Trading Account —— Profit and Loss Calculations (Deducing Gross Profit from Net Profit)",outc:true,reason:"自 2025 年起，損益表細項毛利/淨利核算已全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, operating profit calculations and P&L statements are tested in the Accounting Elective Module Paper 2A.",cn:"30. 承上題，如果截至 2015 年 12 月 31 日止年度的淨利是 $9000，該年度的毛利是多少？\nA. $59 000\nB. $57 000\nC. $54 000\nD. $53 500",en:"30. Based on the above question, if the net profit for the year ended 31 December 2015 was $9,000, what is the gross profit of the firm for that year?\nA. $59,000\nB. $57,000\nC. $54,000\nD. $53,500",ans:"B",rate:"63%",exCn:"我們進行逆向損益結算推導：\n1. **計算營業費用總額（Total Expenses）**：\n   * 電費 = $10,000\n   * 工資與薪金 = $36,500\n   * 銷貨折扣（即給予的折扣，餘額在借方）= $3,500\n   * 費用總額 = $10,000 + $36,500 + $3,500 = **$50,000**。\n2. **計算其他收益（Other Income）**：\n   * 購貨折扣（即獲得的折扣，餘額在貸方）= **$2,000**。\n3. **利用淨利公式倒推毛利（Gross Profit）**：\n   * 淨利 = 毛利 + 其他收益 - 費用\n   * $9,000 = 毛利 + $2,000 - $50,000\n   * $9,000 = 毛利 - $48,000\n   * 毛利 = $9,000 + $48,000 = **$57,000**，故選 B。",exEn:"We perform a reverse deduction of the Profit and Loss Account:\n1. **Calculate Total Operating Expenses**:\n   * Electricity = $10,000\n   * Wages and salaries = $36,500\n   * Discounts allowed (debit balance) = $3,500\n   * *Total Expenses* = $10,000 + $36,500 + $3,500 = **$50,000**.\n2. **Identify Other Income**:\n   * Discounts received (credit balance) = **$2,000**.\n3. **Apply Net Profit Formula to find Gross Profit**:\n   * Net Profit = Gross Profit + Other Income - Expenses\n   * $9,000 = Gross Profit + $2,000 - $50,000\n   * $9,000 = Gross Profit - $48,000\n   * Gross Profit = $9,000 + $48,000 = **$57,000**. Thus, B is correct."},
{q:1,year:2017,y:2017,top:"營商環境 —— 國際貿易合作組織（亞太區經濟合作組織 APEC）",topEn:"Business Environment —— International Trade Organisations (Asia-Pacific Economic Cooperation APEC)",cn:"1. 下列哪項有關亞太區經濟合作組織的陳述是正確的？\n(1) 它排解亞太地區的貿易糾紛。\n(2) 它促進亞太地區的可持續經濟增長。\n(3) 它透過政府與政府之間的高層對話，鼓勵亞太地區在貿易和投資方面的合作。\n\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"1. Which of the following statements about Asia-Pacific Economic Cooperation is/are correct?\n(1) It settles trade disputes in the Asia-Pacific region.\n(2) It promotes sustainable economic growth in the Asia-Pacific region.\n(3) It encourages cooperation on trade and investment in the Asia-Pacific region through high-level government-to-government dialogues.\n\nA. (1) only\nB. (1) and (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"42%",exCn:"1. 陳述 (1) 錯誤：排解成員國之間的國際貿易糾紛與摩擦，屬於世界貿易組織（WTO）的爭端解決機制職能，並非 APEC 的職責。\n2. 陳述 (2) 及 (3) 正確：APEC 旨在促進亞太地區的貿易和投資自由化，支持可持續的經濟增長，並透過非約束性的高層對話加強區域內之經貿合作。",exEn:"1. Statement (1) is incorrect: Settling international trade disputes among member states is the function of the dispute settlement mechanism of the World Trade Organization (WTO), not APEC.\n2. Statements (2) and (3) are correct: APEC aims to promote trade and investment liberalisation, support sustainable economic growth in the Asia-Pacific region, and encourage economic cooperation through non-binding high-level government-to-government dialogues."},
{q:2,year:2017,y:2017,top:"[out c] 試算表 —— 試算表借貸平衡之概念與限制",topEn:"[out c] Trial Balance —— Concepts and Limitations of Arithmetical Balance",outc:true,reason:"自 2025 年起，試算表編製、餘額判定、試算表的局限及不平衡更正已全數歸入選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, the trial balance and related accounting adjustments are tested in the Accounting Elective Module Paper 2A.",cn:"2. 假設一個試算表沒有遺漏帳戶結餘，而試算表的借方結餘總和與貸方結餘總和不相等，這表示\n(1) 試算表內有一項或多項帳戶結餘出錯\n(2) 財務狀況表將不會平衡\n(3) 損益表內的淨利將會是錯誤的\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"2. Assume that no account balance is missing from a trial balance. If the total of the debit balances and the total of the credit balances of the trial balance are not equal, it means that\n(1) one or more ledger balance(s) in the trial balance is/are wrong\n(2) the statement of financial position will not balance\n(3) the net profit in the income statement will be wrong\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"38%",exCn:"1. 陳述 (1) 正確：試算表借貸方總額不平衡，直接說明複式記帳在算術上出現了錯誤。\n2. 陳述 (2) 正確：財務狀況表（資產負債表）是分類帳實帳戶的彙總。如果試算表算術不平衡，隨後編製的財務狀況表也必然無法平衡。\n3. 陳述 (3) 錯誤：試算表不平衡並不必然說明當期利潤計算一定出錯。例如，可能僅是某個資產/負債帳戶在結平或過帳時出現算術錯誤，而所有虛帳戶的紀錄依然完全正確，此時當期淨利仍是正確的。",exEn:"1. Statement (1) is correct: If the trial balance totals do not agree, it indicates that arithmetic errors have been made in the bookkeeping entries.\n2. Statement (2) is correct: Since the Statement of Financial Position is drafted using balances from real accounts, an unbalanced trial balance guarantees that the Statement of Financial Position will not balance.\n3. Statement (3) is incorrect: An unbalanced trial balance does not necessarily mean the net profit is incorrect. For example, if the error only occurred in a real account, while all nominal accounts were recorded correctly, the net profit would still be correct."},
{q:3,year:2017,y:2017,top:"基礎個人理財 —— 策劃個人理財及投資（恆生指數特徵）",topEn:"Basics of Personal Financial Management —— Stock Trading (Characteristics of Hang Seng Index)",cn:"3. 下列哪項有關恆生指數的陳述是不正確的？\nA. 它的分類指數有：金融、公用事業、地產和工商業。\nB. 它量度香港市值最大和成交最活躍的上市公司的表現。\nC. 它包括50隻在創業板上市的股票。\nD. 它是香港股票市場整體表現的指標。",en:"3. Which of the following statements about the Hang Seng Index is not correct?\nA. Its sub-indexes are: Finance, Utilities, Properties, and Commerce and Industry.\nB. It measures the performance of the largest and most liquid companies listed in Hong Kong.\nC. It includes 50 stocks listed on the Growth Enterprise Market.\nD. It serves as a benchmark of the general performance of the Hong Kong stock market.",ans:"C",rate:"62%",exCn:"1. A、B、D 陳述正確：恆生指數量度香港聯合交易所上市中市值最大、成交最活躍的「藍籌股」表現，下設金融、公用事業、地產、工商業四大分類指數，是港股市場整體走勢的晴雨表。\n2. C 陳述不正確：恆生指數成分股皆是在主板（Main Board）上市的股票，並不包含在創業板/GEM上市的股票。",exEn:"1. A, B, and D are correct: The Hang Seng Index (HSI) measures the performance of the largest and most liquid (blue-chip) companies listed on the HKEX, divided into four sub-indexes: Finance, Utilities, Properties, and Commerce & Industry.\n2. C is incorrect: HSI constituent stocks are listed exclusively on the Main Board of the Stock Exchange of Hong Kong; they do not include any stocks listed on the GEM."},
{q:4,year:2017,y:2017,top:"[out c] 基礎管理 —— 目標管理與原則",topEn:"[out c] Basics of Management —— Management by Objectives",outc:true,reason:"自 2025 年起，「目標管理（MBO）」整個課題已全數從企會財必修部分大綱中完全刪除，不再納入考核範疇。",reasonEn:"Starting from the 2025 HKDSE, Management by Objectives (MBO) is completely removed from the Compulsory Part syllabus.",cn:"4. 下列哪項有關企業管理的陳述是正確的？\n(1) 在統一命令原則下，每名下屬只聽命於一名上司。\n(2) 高架式架構的階層較扁平式架構的為多。\n(3) 目標管理可改善上司與下屬之間的溝通\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"4. Which of the following statements about business management is/are correct?\n(1) Under the principle of unity of command, each subordinate reports to one supervisor only.\n(2) A tall organisation has more levels of management than a flat organisation.\n(3) Management by objectives can improve communication between superiors and subordinates.\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"71%",exCn:"1. 陳述 (1) 正確：統一命令（Unity of Command）規定下屬只直接向一位主管報告及聽命。\n2. 陳述 (2) 正確：高架式架構（Tall structure）相比扁平式架構（Flat structure）擁有更多的管理階層、更窄的控制幅度。\n3. 陳述 (3) 正確：目標管理（MBO）強調上下級共同磋商、設定雙向目標與反饋，能顯著改善管理者與員工之溝通。",exEn:"1. Statement (1) is correct: The principle of unity of command states that an employee should receive orders from and report to only one supervisor.\n2. Statement (2) is correct: A tall organisational structure features more layers of hierarchical management and a narrower span of control than a flat structure.\n3. Statement (3) is correct: Management by objectives (MBO) involves participative goal-setting and bi-directional feedback, which improves communication between superiors and subordinates."},
{q:5,year:2017,y:2017,top:"[out c] 基礎會計 —— 會計循環流程",topEn:"[out c] Introduction to Accounting —— Steps of the Accounting Cycle",outc:true,reason:"自 2025 年起，整個「會計循環（Accounting Cycle）」的運作與實務，已被歸入選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, the accounting cycle and related bookkeeping processes are tested in the Accounting Elective Module Paper 2A.",cn:"5. 在會計循環中，下列哪個步驟緊隨編製試算表之後？\nA. 編製財務報表\nB. 作出期末調整\nC. 過帳至分類帳\nD. 於原始分錄簿記錄交易",en:"5. In the accounting cycle, which of the following steps comes immediately after the preparation of a trial balance?\nA. preparing financial statements\nB. making period-end adjustments\nC. posting entries to the ledgers\nD. recording transactions in the books of original entry",ans:"B",rate:"47%",exCn:"完整的會計循環流程為：確認交易 → 記錄原始日記簿 → 過帳至分類帳 → 編製試算表 → 作出期末調整 → 編製經調整試算表與財務報表。因此，編製試算表後的下一步即為「作出期末調整」。",exEn:"The complete steps in an accounting cycle are: Identifying transactions → Recording in books of original entry → Posting to ledger accounts → Preparing a trial balance → Making period-end adjustments → Preparing adjusted trial balance and financial statements. Therefore, making period-end adjustments immediately follows the preparation of the trial balance."},
{q:6,year:2017,y:2017,top:"營商環境 —— 香港的營商環境（中港經濟貿易關係）",topEn:"Business Environment —— Hong Kong's Business Environment (Economic relationship with the Mainland)",cn:"6. 下列哪項有關香港與內地貿易關係的陳述是正確的？\n(1) 香港是內地最大的貿易夥伴。\n(2) 以貨物價值計，內地是香港最大的轉口目的地。\n(3) 很多以香港為原產地的貨物出口到內地不需繳付關稅。\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"6. Which of the following statements about the trade relationship between Hong Kong and the Mainland are correct?\n(1) Hong Kong is the largest trading partner of the Mainland.\n(2) In terms of the value of goods, the Mainland is the largest re-export destination of Hong Kong.\n(3) Many goods originating in Hong Kong exported to the Mainland are tariff-free.\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"54%",exCn:"1. 陳述 (1) 錯誤：以貿易總額計，內地最大的貿易夥伴為美國、歐盟、東盟等國家和地區，香港並非內地最大貿易夥伴。\n2. 陳述 (2) 正確：內地是香港商品對外貿易及轉口的第一大來源地與主要目的地。\n3. 陳述 (3) 正確：在 CEPA 下，所有符合原產地規則的「原產香港商品」進口內地可享有零關稅優惠。",exEn:"1. Statement (1) is incorrect: In terms of trade volume, the Mainland's largest trading partners are regions like the US, EU, and ASEAN. Hong Kong is not the Mainland's largest trading partner.\n2. Statement (2) is correct: Mainland China is Hong Kong's largest source and destination of re-exported goods.\n3. Statement (3) is correct: Under CEPA, all goods of Hong Kong origin enjoy zero tariffs upon importation into the Mainland."},
{q:7,year:2017,y:2017,top:"基礎個人理財 —— 策劃個人理財及投資（強積金供款計算上限）",topEn:"Basics of Personal Financial Management —— Personal Financial Planning (MPF contributions limit)",cn:"7. 江娜現年62歲，是一家企業的兼職顧問，月薪$40000。在強制性公積金制度下，江娜每月供款多少？\nA. $4000\nB. $2000\nC. $1500\nD. $0",en:"7. Anna is 62 years old and works as a part-time consultant in a firm, with a monthly salary of $40 000. Under the Mandatory Provident Fund System, what will be the amount Anna contributes each month?\nA. $4000\nB. $2000\nC. $1500\nD. $0",ans:"C",rate:"35%",exCn:"1. 強積金（MPF）規定強制供款年齡範圍為 18 歲至 65 歲，江娜現年 62 歲，必須進行強制供款。\n2. 雖然標準的強制僱員供款比例為月薪的 5%（即 $40,000 × 5% = $2,000），但每月強制供款設有法定的「最高有關入息上限」。\n3. 目前法定最高入息上限為每月 $30,000，其最高供款上限即為 $30,000 × 5% = $1,500。江娜月薪 $40,000 已超過上限，因此其每月強制供款額仍為最高供款上限 $1,500。",exEn:"1. MPF mandatory contributions apply to employees and self-employed persons aged between 18 and 65. Anna is 62 years old and is required to make mandatory contributions.\n2. Although the standard mandatory contribution rate for employees is 5% of monthly income (which would be $40,000 × 5% = $2,000), there is a statutory maximum relevant income level.\n3. Currently, the maximum relevant income level is $30,000 per month, which caps the maximum mandatory contribution at $30,000 × 5% = $1,500 per month. Since Anna's salary exceeds $30,000, her contribution is capped at $1,500."},
{q:8,year:2017,y:2017,top:"基礎管理 —— 主要商業功能之角色（資訊管理部門）",topEn:"Basics of Management —— Major Business Functions (Role of Information Management department)",cn:"8. 下列哪項是公司資訊管理部門的工作？\n(1) 為人力資源部門的培訓記錄，設計檔案儲存系統\n(2) 協助市場營銷部門處理市場研究數據\n(3) 為財務部門編製預算\n\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"8. Which of the following tasks is/are performed by the information management department of a company?\n(1) designing a file storage system for the training records of the human resources department\n(2) assisting the marketing department to process market research data\n(3) preparing the budget for the finance department\n\nA. (1) only\nB. (1) and (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"79%",exCn:"1. 陳述 (1) 正確：設計檔案儲存系統儲存 HR 培訓紀錄，屬於為特定部門建置資訊系統。\n2. 陳述 (2) 正確：協助市場行銷部處理市調數據，屬於數據處理與系統支援。\n3. 陳述 (3) 錯誤：編製財務預算，是財務部門（Finance Department）的核心職掌，並非資訊管理部門的工作。",exEn:"1. Statement (1) is correct: Designing a file storage system to store human resource training records is a typical task of building information support systems.\n2. Statement (2) is correct: Processing and managing market research data for the marketing department is a key database support function.\n3. Statement (3) is incorrect: Preparing corporate budgets is the core responsibility of the finance department, not the information management department."},
{q:9,year:2017,y:2017,top:"[out c] 基礎會計 —— 分類帳記帳原理與餘額判定",topEn:"[out c] Introduction to Accounting —— Ledger Accounts and Balances",outc:true,reason:"自 2025 年起，分類帳記帳原理、借貸過帳及學術會計定義已被全數歸入選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, ledger accounts, double entries, and bookkeeping concepts are tested in the Accounting Elective Module Paper 2A.",cn:"9. 如一帳戶有借方結餘，下列哪項有關這帳戶的陳述是正確的？\nA. 帳戶借方入帳的總額，較貸方入帳的總額高。\nB. 結餘轉下在帳戶的借方出現。\nC. 承上結餘在帳戶的右方出現。\nD. 這帳戶是資產帳戶。",en:"9. If an account has a debit balance, which of the following statements about this account is correct?\nA. The total debits entered in the account are higher than the total credits.\nB. The balance carried down appears on the debit side of the account.\nC. The balance brought down appears on the right-hand side of the account.\nD. The account is an asset account.",ans:"A",rate:"51%",exCn:"1. A 正確：一個會計科目帳戶呈現「借方結餘（Debit balance）」，定義上即代表該帳戶左側（借方）累計的金額總額高於其右側（貸方）的金額總額。\n2. B 錯誤：借方結餘帳戶在期末結帳時，其「結餘轉下（Balance c/d）」必須寫在貸方（右側）以結平該期帳目。\n3. C 錯誤：此借方帳戶在新期初的「承上結餘（Balance b/f）」會寫在借方（即左側，而非右側）。\n4. D 錯誤：除了資產帳戶外，費用/開支帳戶也必定在試算表呈現借方結餘。因此不能斷定該帳戶必定是資產帳戶。",exEn:"1. A is correct: If an account has a debit balance, it means that the cumulative total on the left side (debit side) is greater than the total on the right side (credit side).\n2. B is incorrect: For an account with a debit balance, the balance carried down (Balance c/d) at the end of the period is recorded on the credit side (right side) to balance off the account.\n3. C is incorrect: At the start of the next period, the balance brought down (Balance b/f) will appear on the debit side (left-hand side), not the right-hand side.\n4. D is incorrect: Besides asset accounts, expense accounts also carry a debit balance. Thus, we cannot conclude that the account is definitely an asset account."},
{q:10,year:2017,y:2017,top:"基礎個人理財 —— 金錢的時間值（現值折現計算）",topEn:"Basics of Personal Financial Management —— Time Value of Money (Calculating present value)",cn:"10. 李先生打算開立一儲蓄帳戶，利率為每年複式7%。他希望三年後可以從這帳戶收回總金額$150000，他現在應存入儲蓄帳戶的金額是多少？\nA. $120 654\nB. $122 445\nC. $131 016\nD. $183 756",en:"10. Mr Lee plans to open a savings account with an annual interest rate of 7% compounded annually. If he wants to withdraw a total amount of $150 000 from the account three years later, how much should he deposit into the savings account now?\nA. $120 654\nB. $122 445\nC. $131 016\nD. $183 756",ans:"B",rate:"90%",exCn:"PV = FV / (1 + r)^n = $150,000 / (1.07)^3 = $150,000 / 1.225043 ≈ $122,444.64\n四捨五入至最接近的整數元為 $122,445，答案選 B。",exEn:"PV = FV / (1 + r)^n = $150,000 / (1.07)^3 = $150,000 / 1.225043 ≈ $122,444.64\nRounded to the nearest dollar, the answer is $122,445 (Option B is correct)."},
{q:11,year:2017,y:2017,top:"營商環境 —— 企業擁有權類型（有限公司之優缺點）",topEn:"Business Environment —— Forms of Business Ownership (Advantages and disadvantages of limited companies)",cn:"11. 與獨資比較，下列哪項是有限公司的優點？\n(1) 企業不會因東主的退出或死亡而結束\n(2) 成立成本較低\n(3) 利得稅稅率較低\n\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"11. Compared to a sole proprietorship, which of the following is/are the advantage(s) of a limited company?\n(1) the business will not be closed upon withdrawal or death of the owner(s)\n(2) the setup cost is lower\n(3) the profits tax rate is lower\n\nA. (1) only\nB. (1) and (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"A",rate:"82%",exCn:"1. 陳述 (1) 正確：有限公司具有獨立的法定個體地位（Separate legal entity），享有「永久延續性（Perpetual succession）」，不會因為股東退出或死亡而終止營運。\n2. 陳述 (2) 錯誤：有限公司需要辦理複雜的法律註冊、年審並委託會計師進行年度審計，成立與日常維持成本遠高於獨資企業。\n3. 陳述 (3) 錯誤：在香港，有限公司適用較高之利得稅率（目前法團兩級制下首200萬為8.25%，其餘為16.5%），高於非法團業務的 7.5% 和 15%。",exEn:"1. Statement (1) is correct: A limited company has a separate legal entity and enjoys perpetual succession, meaning it continues to exist regardless of the withdrawal, bankruptcy, or death of its shareholders.\n2. Statement (2) is incorrect: Setting up a limited company involves complex legal registration, secretarial compliance, and mandatory annual audits. Thus, its setup and maintenance costs are higher.\n3. Statement (3) is incorrect: In Hong Kong, the corporate profits tax rate is higher (currently 8.25%/16.5% under the two-tiered profits tax rates) than the unincorporated rate (7.5%/15%)."},
{q:12,year:2017,y:2017,top:"[out c] 財務報表分析 —— 盈利能力與費用比率分析（營運費用控制）",topEn:"[out c] Financial Ratio Analysis —— Profitability and Expense Ratios",outc:true,reason:"自 2025 年起，財務比率的深入分析、公式核算與橫向企業對比，已被全數歸入選修部分（會計單元）Paper 2A 的第二十一章考核，不包含在卷一必修部分內。",reasonEn:"Starting from 2025, accounting ratio computations and comparative business evaluations are tested in the Accounting Elective Module Paper 2A.",cn:"12. 陳記和葉記是經營同一行業的貿易商號，他們2016年的毛利率和淨利率如下：\n陳記：毛利率 39%，淨利率 24%\n葉記：毛利率 45%，淨利率 20%\n根據以上比率，可以得出下列哪項結論？\n\nA. 葉記的銷售額較高。\nB. 葉記的銷貨成本較高。\nC. 陳記的淨利較高。\nD. 陳記控制營運費用的表現較佳。",en:"12. Chan Kee and Yip Kee are trading firms in the same industry. Their gross profit ratios and net profit ratios for the year 2016 are shown below:\nChan Kee: Gross profit ratio 39%, Net profit ratio 24%\nYip Kee: Gross profit ratio 45%, Net profit ratio 20%\nAccording to the above ratios, which of the following conclusions can be drawn?\n\nA. Yip Kee has a higher sales revenue.\nB. Yip Kee has a higher cost of goods sold.\nC. Chan Kee has a higher net profit.\nD. Chan Kee has a better control over operating expenses.",ans:"D",rate:"75%",exCn:"1. 營運費用佔銷售額的比例可以通過「毛利率 - 淨利率」得出：\n陳記的營運費用率 = 39% - 24% = 15%。\n葉記的營運費用率 = 45% - 20% = 25%。\n2. 由於陳記的營運費用率（15%）顯著低於葉記（25%），代表陳記將更多毛利轉化為了淨利，說明其在控制營運費用方面表現較佳。在沒有具體銷售金額數據的情況下，我們無法判斷 A、B、C 等關於絕對金額的大小。",exEn:"1. The ratio of operating expenses to sales can be calculated as Gross Profit Ratio minus Net Profit Ratio:\nChan Kee's operating expense ratio = 39% - 24% = 15%.\nYip Kee's operating expense ratio = 45% - 20% = 25%.\n2. Since Chan Kee has a lower operating expense ratio (15%) than Yip Kee (25%), it indicates that Chan Kee converts its gross profit to net profit more efficiently and has a better control over operating expenses. Without absolute turnover figures, options A, B, and C regarding absolute dollar values cannot be determined."},
{q:13,year:2017,y:2017,top:"基礎個人理財 —— 金錢的時間值（名義與實際利率、複利計息頻率）",topEn:"Basics of Personal Financial Management —— Time Value of Money (Nominal vs. effective rates)",cn:"13. 如果名義回報率不變，下列哪項有關實際回報率的陳述是正確的？\n(1) 實際回報率反映投資的真實回報。\n(2) 如本金增加，實際回報率便會上升。\n(3) 如計算複息的頻率增加，實際回報率便會上升。\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"13. If the nominal rate of return remains unchanged, which of the following statements about the effective rate of return is/are correct?\n(1) The effective rate of return reflects the true return of the investment.\n(2) If the principal increases, the effective rate of return will rise.\n(3) If the frequency of compounding increases, the effective rate of return will rise.\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"55%",exCn:"1. 陳述 (1) 正確：實際回報率（考慮了複利或通貨膨脹的實質影響）更準確且真實地反映了投資者最終獲得的實質資產回報。\n2. 陳述 (2) 錯誤：實際回報率是一個相對的百分比比率（利率），其數值僅由名義利率和複利頻率決定，與投資本金的絕對金額大小無關。\n3. 陳述 (3) 正確：計算複利的頻率越高（例如由年複利改為半年或季度複利），利息「利滾利」的次數增加，因而最終的實際年回報率也會上升。",exEn:"1. Statement (1) is correct: The effective rate of return takes into account compounding effects (or inflation), reflecting the true and actual wealth generation from an investment.\n2. Statement (2) is incorrect: The effective rate of return is an interest percentage and is mathematically independent of the absolute size of the principal invested.\n3. Statement (3) is correct: As the frequency of compounding increases (e.g. from annual to quarterly compounding), the reinvested interest generates more interest, raising the effective rate of return."},
{q:14,year:2017,y:2017,top:"中小型企業與企業家精神 —— 企業家精神之貢獻與特徵",topEn:"SMEs and Entrepreneurship —— Importance and contributions of entrepreneurship",cn:"14. 下列哪項展示企業家精神對商業發展的重要？\n(1) 減少企業風險\n(2) 促進經濟增長\n(3) 鼓勵創新\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"14. Which of the following shows the importance of entrepreneurship to business development?\n(1) reducing business risks\n(2) promoting economic growth\n(3) encouraging innovation\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"77%",exCn:"1. 企業家精神的核心本質是發現商機並勇於承擔、管理商業風險。\n2. 陳述 (1) 錯誤：企業家開發新產品、進入新市場或引進新技術均面臨極高的不確定性，因此它非但不能「減少」企業風險，反而是承擔了更多風險。\n3. 陳述 (2) 及 (3) 正確：企業家精神透過推出新產品及服務鼓勵創新，推動市場競爭並激發經濟活力，對商業發展和經濟增長有著關鍵貢獻。",exEn:"1. The fundamental nature of entrepreneurship is to identify market niches and willingly assume business risks.\n2. Statement (1) is incorrect: Entrepreneurship introduces new products, processes, or businesses, which increases uncertainty and risk rather than reducing business risks.\n3. Statements (2) and (3) are correct: Entrepreneurs drive innovation, create market competition, and stimulate economic activity, contributing significantly to commercial development and GDP growth."},
{q:15,year:2017,y:2017,top:"[out c] 基礎會計 —— 財務報表用途與限制（質性資訊）",topEn:"[out c] Introduction to Accounting —— Limitations and Uses of Financial Statements",outc:true,reason:"自 2025 年起，財務報表的用途與局限、資訊使用者的需要，已被全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, financial statement users, uses, and limitations are tested in the Accounting Elective Module Paper 2A.",cn:"15. 下列哪項不是財務報表的用途？\nA. 協助不同用家作決策\nB. 提供有關企業財政狀況的資訊\nC. 為員工提供資訊，以評估其工作保障\nD. 提供有關企業表現的質性資訊",en:"15. Which of the following is not a use of financial statements?\nA. assist different users in making decisions\nB. provide information about the financial position of a business\nC. provide information to employees for assessing their job security\nD. provide qualitative information regarding the performance of a business",ans:"D",rate:"40%",exCn:"1. A、B、C 屬於用途：財務報表能為管理層、投資者、政府及員工提供客觀量化的財務資訊，評估企業財務表現、財政狀況（B）與進行決策（A），員工亦可藉此評估公司的生存前景與個人工作保障（C）。\n2. D 不屬於用途：財務報表的編製基於「貨幣量度（Money measurement）」概念，只能記錄能夠用金錢量度的財務數字（量化信息），而無法直接提供「質性（Qualitative / Non-financial）」的資訊。",exEn:"1. A, B, and C are uses: Financial statements provide structured monetary figures of an entity to help external and internal users assess financial performance/position (B) and make decisions (A). Employees can evaluate the company's financial health to assess their job security (C).\n2. D is not a use: Under the money measurement concept, financial statements only record transactions and information that can be expressed in monetary terms (quantitative data). They cannot provide non-monetary qualitative information regarding business performance."},
{q:16,year:2017,y:2017,top:"營商環境 —— 影響商業決策的因素（自然地理因素）",topEn:"Business Environment —— Macro-environmental factors (Physical factors)",cn:"16. 下列哪些是影響香港企業的自然地理因素？\n(1) 氣候條件\n(2) 空氣質素\n(3) 人口結構\n\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"16. Which of the following is/are physical factor(s) that might affect businesses in Hong Kong?\n(1) climatic condition\n(2) air quality\n(3) population structure\n\nA. (1) only\nB. (1) and (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"61%",exCn:"1. 陳述 (1) 及 (2) 正確：當地的降雨量、氣溫等「氣候條件」以及當地的環境污染程度和「空氣質素」，直接屬於外在 PEEST 因素中的自然地理因素（Physical / Natural factors）。\n2. 陳述 (3) 錯誤：年齡、性別比例、受教育程度、勞動力年齡層等「人口結構」特徵，在分類上屬於社會與人口統計因素（Social & Demographic factors）。",exEn:"1. Statements (1) and (2) are correct: Climatic conditions (like temperature or rainfall) and environmental air quality are categorized as physical/natural factors in the PEEST macro-environment.\n2. Statement (3) is incorrect: Population structure (age, gender, ethnicity) belongs to social/demographic factors, not physical factors."},
{q:17,year:2017,y:2017,top:"[out c] 基礎個人理財 —— 證券交易（主板上市要求之豁免）",topEn:"[out c] Stock Trading as an Investment —— Basic Listing Requirements",outc:true,reason:"自 2025 年起，必修部分考綱明確修訂規定「以證券交易作投資：不包括主板及創業板新申請人的基本上市要求」，此項對比已被移出必修部分大綱。",reasonEn:"Starting from 2025, the BAFS Compulsory Part syllabus explicitly states: Stock trading as an investment: EXCLUDES basic listing requirements of the Main Board and GEM.",cn:"17. 除 ______ 外，下列各項都是對申請在香港聯合交易所主板上市的新申請人的基本上市要求。\nA. 員工規模\nB. 現金流量\nC. 營業記錄\nD. 股東應佔盈利",en:"17. The following are the basic listing requirements for new applicants to list their stocks on the Main Board of the Stock Exchange of Hong Kong except\nA. size of workforce\nB. amount of cash flow\nC. history of operation\nD. profit attributable to shareholders",ans:"A",rate:"56%",exCn:"1. 香港交易所（HKEX）對主板上市申請人有著明確、定量的財務與法律測試要求，包括最低市值、必須符合特定的股東應佔盈利測試、營業記錄年期（通常為3年）或營運現金流測試（B、C、D 均是法定上市基本要求項目）。\n2. 而「員工規模（即僱用員工人數的多少）」並非聯交所硬性審批上市的法訂財務或經營測試標準。",exEn:"1. The HKEX has clear quantitative financial and operating standards for Main Board listing applicants, including profit tests (D), operating history duration (C), or cash flow tests (B) combined with minimum market capitalisation.\n2. The size of the workforce (number of employees) is not a statutory regulatory financial metric used by the HKEX to approve a company's listing application."},
{q:18,year:2017,y:2017,top:"[out c] 營商環境 —— 企業擁有權類型（特許經營之缺點）",topEn:"[out c] Business Environment —— Shortcomings of Franchising",outc:true,reason:"自 2025 年起，「特許經營（Franchising）」整個課題已全數從企會財必修部分考綱中完全刪除，不再納入考核範疇。",reasonEn:"Starting from the 2025 exam, Franchising has been completely removed from the BAFS Compulsory Part syllabus.",cn:"18. 對特許權擁有人而言，下列哪項是以特許權方式經營企業的缺點？\n(1) 特許權使用人可能會自立門戶，成為競爭者。\n(2) 難以完全控制特許權使用人的經營方式。\n(3) 如一特許權使用人經營不善，會影響特許權企業整體的商譽。\n\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"18. From the point of view of a franchisor, which of the following is/are the shortcoming(s) of running a business in the form of franchising?\n(1) The franchisee may set up his own business and become a competitor.\n(2) It is difficult to fully control the way of operation of the franchisee.\n(3) If a franchisee runs his business poorly, the overall reputation of the franchise business will be affected.\n\nA. (1) only\nB. (1) and (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"61%",exCn:"1. 特許經營對特許人（Franchisor）而言存在數項主要限制與風險：\n(1) 正確：使用人在掌握品牌的核心技術與營運訣竅後，可能解除合約或合約期滿後自立門戶，成為強大競爭者。\n(2) 正確：店鋪日常營運由獨立的特許權使用人管理，特許人難以做到 100% 絕對、即時地控制其日常的服務品質與運作。\n(3) 正確：任何一家加盟分店發生經營不善或衛生醜聞，在消費者認知中都會直接損害整個品牌的連鎖商譽。",exEn:"1. Franchising poses several operational risks and limitations for the franchisor:\nStatement (1) is correct: Franchisees gain access to proprietary skills, recipes, and systems, and may eventually end the contract to set up competing businesses.\nStatement (2) is correct: Daily operations are managed by independent operators, making it difficult for the franchisor to strictly and continuously monitor and control quality.\nStatement (3) is correct: Negative publicity or poor management at a single franchised outlet directly damages the brand's collective reputation."},
{q:19,year:2017,y:2017,top:"[out c] 基礎會計 —— 會計等式計算（推導初始資產負債與資本）",topEn:"[out c] Introduction to Accounting —— Calculations of the Accounting Equation",outc:true,reason:"自 2025 年起，會計等式的運算及資產/負債/資本的歸類倒推，已全數被移至選修部分（會計單元）Paper 2A 的第二章進行考核。",reasonEn:"Starting from 2025, accounting equation calculations and asset/liability classifications are tested in the Accounting Elective Module Paper 2A.",cn:"19. 黃先生於2017年1月1日成立其商號。他將自己擁有、價值$40000的汽車注入商號。商號向黃先生的親戚借入$200000,用作購買辦公室設備，並向銀行借入$100000供營運之用。商號於2017年1月1日的資產、負債及資本額是多少？\n\nA. 資產 $240,000； 負債 $200,000； 資本 $40,000\nB. 資產 $40,000； 負債 $300,000； 資本 $340,000\nC. 資產 $340,000； 負債 $100,000； 資本 $240,000\nD. 資產 $340,000； 負債 $300,000； 資本 $40,000",en:"19. Mr Wong set up his firm on 1 January 2017. He introduced his own motorcar valued at $40 000 into the firm. The firm borrowed $200 000 from Mr Wong's relative to purchase office equipment and borrowed $100 000 from a bank for operation. What are the amounts of the firm's assets, liabilities and capital on 1 January 2017?\n\nA. Assets $240 000; Liabilities $200 000; Capital $40 000\nB. Assets $40 000; Liabilities $300 000; Capital $340 000\nC. Assets $340 000; Liabilities $100 000; Capital $240 000\nD. Assets $340 000; Liabilities $300 000; Capital $40 000",ans:"D",rate:"60%",exCn:"1. 計算負債（Liabilities）：親戚借款 $200,000 + 銀行貸款 $100,000 = $300,000（借入資金屬於負債，不計入資本）。\n2. 計算資本（Capital）：東主黃先生將個人私家車注入企業作為出資，這直接構成初始資本 = $40,000。\n3. 根據會計等式計算總資產（Assets）：資產 = 負債 + 資本 = $300,000 + $40,000 = $340,000。",exEn:"1. Calculate Liabilities: Loan from relative $200,000 + bank loan $100,000 = $300,000 (loans are liabilities, not capital).\n2. Calculate Capital: The owner, Mr Wong, introduced his personal motorcar to the firm as an equity injection, which forms the starting capital = $40,000.\n3. Apply Accounting Equation to find Assets: Assets = Liabilities + Capital = $300,000 + $40,000 = $340,000."},
{q:20,year:2017,y:2017,top:"中小型企業 —— 香港中小型企業的特徵",topEn:"SMEs and Entrepreneurship —— Characteristics of SMEs in Hong Kong",cn:"20. 下列哪項有關香港中小型企業(中小企)的陳述是正確的？\n(1) 香港大多數企業都是中小企。\n(2) 中小企的企業擁有權類型若不是獨資，便是合夥。\n(3) 中小企通常由東主管理。\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"20. Which of the following statements about small and medium enterprises (SMEs) in Hong Kong are correct?\n(1) The majority of businesses in Hong Kong are SMEs.\n(2) The forms of business ownership of SMEs are either sole proprietorship or partnership.\n(3) SMEs are usually managed by their owners.\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"68%",exCn:"1. 陳述 (1) 正確：香港的企業中有超過 98% 以上均被界定為中小型企業。\n2. 陳述 (2) 錯誤：中小型企業在法律實體上，完全可以註冊成為「私人有限公司（Private Limited Company）」以享受有限債務責任保護，而非只能以非法團的獨資或合夥運作。\n3. 陳述 (3) 正確：中小型企業因為規模精簡、人員與層級較少，通常由其創辦人或東主親自直接參與日常的管理與決策。",exEn:"1. Statement (1) is correct: Over 98% of all business establishments in Hong Kong are classified as SMEs.\n2. Statement (2) is incorrect: SMEs are not restricted to unincorporated forms. Many register as Private Limited Companies to enjoy limited liability protection.\n3. Statement (3) is correct: Due to their compact size and flat structures, SMEs are typically managed directly by their owners/proprietors."},
{q:21,year:2017,y:2017,top:"[out c] 財務報表分析 —— 變現能力與比率分析（速動比率計算）",topEn:"[out c] Financial Ratio Analysis —— Liquidity Ratios (Quick Ratio calculation)",outc:true,reason:"自 2025 年起，財務報表分析的各類財務比率（包括變現能力、獲利能力、償債能力的公式計算與運用），已被全數移至選修部分（會計單元）Paper 2A 的第二十一章考核。",reasonEn:"Starting from 2025, the computation of accounting ratios and corporate financial statements analysis are tested in the Accounting Elective Module Paper 2A.",cn:"21. 王氏商號2016年的速動比率是多少？\n（已知數據：非流動資產 $280,000； 銀行存款 $18,000； 現金 $58,000； 存貨 $71,000； 應付貨款 $86,000； 應收貨款 $162,000； 長期銀行貸款 $120,000）\n\nA. 1.16:1\nB. 2.77:1\nC. 3.59:1\nD. 6.02:1",en:"21. What is the quick ratio of Wong's firm for 2016?\n(Given: Non-current assets $280 000, Bank $18 000, Cash $58 000, Inventory $71 000, Trade payables $86 000, Trade receivables $162 000, Long term bank loan $120 000)\n\nA. 1.16:1\nB. 2.77:1\nC. 3.59:1\nD. 6.02:1",ans:"B",rate:"74%",exCn:"1. 計算流動負債（Current Liabilities）= 應付貨款 = $86,000（長期銀行貸款屬於非流動負債，不計入流動負債）。\n2. 計算速動資產（Quick Assets）= 流動資產 - 存貨 = (銀行存款 $18,000 + 現金 $58,000 + 應收貨款 $162,000) = $238,000。\n3. 計算速動比率（Quick Ratio / Acid Test Ratio）= 速動資產 / 流動負債 = $238,000 / $86,000 ≈ 2.77:1。",exEn:"1. Identify Current Liabilities: Trade payables = $86,000 (the long-term bank loan of $120,000 is a non-current liability and is excluded).\n2. Calculate Quick Assets: Current Assets (excluding Inventory) = Bank $18,000 + Cash $58,000 + Trade receivables $162,000 = $238,000.\n3. Calculate Quick Ratio: Quick Assets / Current Liabilities = $238,000 / $86,000 ≈ 2.77:1."},
{q:22,year:2017,y:2017,top:"[out c] 財務報表分析 —— 營運資金之計算",topEn:"[out c] Financial Statements Analysis —— Calculation of Working Capital",outc:true,reason:"自 2025 年起，營運資金（Working Capital）的定義、公式核算與財務狀況分析，已被全數移至選修部分（會計單元）Paper 2A 進行考核，不包含在卷一必修部分內。",reasonEn:"Starting from 2025, working capital equations and fluid liquidity analysis are tested in the Accounting Elective Module Paper 2A.",cn:"22. 承上題，王氏商號於2016年12月31日的營運資金是多少？\n\nA. $103,000\nB. $152,000\nC. $223,000\nD. $503,000",en:"22. Refer to the previous question. What is the amount of working capital in Wong's firm as at 31 December 2016?\n\nA. $103,000\nB. $152,000\nC. $223,000\nD. $503,000",ans:"C",rate:"70%",exCn:"1. 計算流動資產（Current Assets）= 銀行存款 $18,000 + 現金 $58,000 + 應收貨款 $162,000 + 存貨 $71,000 = $309,000。\n2. 計算流動負債（Current Liabilities）= 應付貨款 = $86,000。\n3. 計算營運資金（Working Capital）= 流動資產 - 流動負債 = $309,000 - $86,000 = $223,000。",exEn:"1. Calculate Current Assets: Bank $18,000 + Cash $58,000 + Trade receivables $162,000 + Inventory $71,000 = $309,000.\n2. Calculate Current Liabilities: Trade payables = $86,000.\n3. Calculate Working Capital: Current Assets - Current Liabilities = $309,000 - $86,000 = $223,000."},
{q:23,year:2017,y:2017,top:"基礎個人理財 —— 消費者信貸（良好信貸紀錄之好處與信貸評級）",topEn:"Basics of Personal Financial Management —— Consumer Credit (Benefits of a good credit record)",cn:"23. 下列哪項是借貸人維持良好個人信貸紀錄的好處？\n(1) 個人貸款利率較低。\n(2) 信貸額較高。\n(3) 開立定期存款帳戶時，可獲取較佳條款。\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"23. Which of the following are the benefits for a borrower of maintaining a good personal credit record?\n(1) lower interest rate on personal loan\n(2) higher credit limit\n(3) better terms when opening a term deposit account\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"60%",exCn:"1. 陳述 (1) 及 (2) 正確：借貸人維持良好的個人信貸評級（Credit score），代表其違約拖欠風險低。銀行在審核其借貸申請時，願意為其批出更低的貸款年利率以及核批更高的信用額度。\n2. 陳述 (3) 錯誤：開立定期存款帳戶（這等同於個人借款給銀行）的年利率與相關條款，屬於銀行根據宏觀金融市場及自身資金需求制定的標準市場利率，不會因為客戶個人作為借款人的信貸紀錄好壞而有所不同。",exEn:"1. Statements (1) and (2) are correct: A borrower with a higher personal credit score poses a lower default risk. Financial institutions are therefore more likely to approve loans with a lower borrowing interest rate and grant a higher credit limit.\n2. Statement (3) is incorrect: When opening a term deposit account (which is essentially the individual lending money to the bank), the terms and interest rates are determined by macroeconomic market rates and the bank's liquidity needs, not by the client's credit score as a borrower."},
{q:24,year:2017,y:2017,top:"基礎管理 —— 有效管理的原則（統一的方向原則）",topEn:"Basics of Management —— Principles of Effective Management (Unity of direction)",cn:"24. 下列哪項有關「統一的方向」的陳述是正確的？\nA. 每名主管每次只負責一個項目。\nB. 每名員工於每一時段只朝一個目標工作。\nC. 為同一項目工作的員工都有相同目標。\nD. 企業的目標應在合理的時段內完成。",en:"24. Which of the following statements about unity of direction is correct?\nA. Each manager takes up one project only.\nB. Each employee works towards one goal only in a certain period of time.\nC. Employees working for the same project have the same objective.\nD. Business objectives should be achieved within a reasonable period of time.",ans:"C",rate:"64%",exCn:"1. 統一的方向原則（Unity of Direction）的定義是：擁有相同目標的各項企業活動，應該被納入同一個計劃之中，並由同一位管理人員統領和指揮。\n2. 這確保了參與同一個合作項目（相同計劃）的全體員工都圍繞著相同的戰略目標共同協作。\n3. 統一的方向並不要求經理一次只能做一個項目（排除 A），也不限制員工同一時段只能做一項工作（排除 B）。",exEn:"1. Unity of direction is defined as: organizational activities having the same objective should be directed by one manager using one plan.\n2. This principle ensures that employees working on the same project have a shared and cohesive objective to work towards.\n3. It does not restrict a manager to only one project (eliminates A), nor does it prevent an employee from working on multiple tasks at once (eliminates B)."},
{q:25,year:2017,y:2017,top:"[out c] 基礎會計 —— 會計假設與概念之定義與辨析（繼續經營假設）",topEn:"[out c] Generally Accepted Accounting Principles (GAAP) —— Accounting Assumptions and Concepts",outc:true,reason:"自 2025 年起，所有會計假設、會計概念的理解與實務應用，已被全數歸入選修部分（會計單元）Paper 2A 的第九章進行考核。",reasonEn:"Starting from 2025, accounting assumptions, principles, and conventions are tested in the Accounting Elective Module Paper 2A.",cn:"25. 下列哪項有關會計假設、原則及慣例的描述是正確的？\nA. 歷史成本：所有企業交易都應記錄於帳冊內\nB. 企業個體：獨資東主可將其個人開支記錄於企業帳冊內\nC. 一貫性：會計政策和方法一經採用，便不能更改\nD. 繼續經營：企業會在可見的未來持續營運",en:"25. Which of the following descriptions about accounting assumptions, principles and conventions is correct?\nA. Historical cost: all business transactions must be recorded in the books\nB. Business entity: a sole proprietor can record his personal expenses in the books of the firm\nC. Consistency: once accounting policies and methods are adopted, they cannot be changed\nD. Going concern: a business will continue in operation for the foreseeable future",ans:"D",rate:"80%",exCn:"1. A 描述錯誤：歷史成本原則（Historical Cost Principle）要求資產應按其購置時的原始成本記錄，而非指記錄所有交易。\n2. B 描述錯誤：企業個體觀念（Business Entity Concept）強調東主與企業在會計上是分離的獨立個體，東主的個人開支絕不能記入企業帳冊。\n3. C 描述錯誤：一貫原則（Consistency Principle）允許企業在「有更真確和合理的理由能更公允反映財務實況」的前提下變更會計方法，而非絕對不能更改。\n4. D 描述正確：繼續經營假設（Going Concern Assumption）假定企業會在可以預見的未來無限期地持續營運下去，無意圖或需要縮減或結業。",exEn:"1. A is incorrect: The historical cost principle states that assets should be recorded at their original purchase cost, not that all transactions must be recorded.\n2. B is incorrect: The business entity concept states that a business is a separate legal and financial entity from its owner, so the owner's personal expenses cannot be recorded as business expenses.\n3. C is incorrect: The consistency principle allows changes in accounting policies if the change is required or provides a fairer presentation of the company's financial state.\n4. D is correct: The going concern assumption assumes that a business will continue its operations for the foreseeable future without the intention or necessity of liquidation."},
{q:26,year:2017,y:2017,top:"基礎個人理財 —— 策劃個人理財及投資（影響上市公司股價的因素）",topEn:"Basics of Personal Financial Management —— Personal Financial Planning & Investment (Factors affecting stock prices)",cn:"26. 下列哪項會影響銷售汽車的上市公司的股價？\n(1) 燃油價格\n(2) 利率\n(3) 公司的派息政策\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"26. Which of the following will affect the share price of a listed company selling motorcars?\n(1) fuel price\n(2) interest rate\n(3) dividend policy of the company\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"57%",exCn:"1. 影響股票價格的因素包括宏觀經濟環境及上市公司自身表現與決策：\n(1) 影響：燃油與汽車是互補商品（Complementary goods）。高油價會直接壓抑消費者購買汽油車的慾望，降低汽車銷量進而影響汽車公司的盈利與股價。\n(2) 影響：利率上升會推高消費者買車分期按揭的利息成本，壓低購車需求；同時亦會推高汽車公司的融資資金成本，利空股價。\n(3) 影響：公司的分紅與派息政策會吸引追求穩定股息收益的投資者，提振其股價。\n2. 因此，(1)、(2) 和 (3) 皆是影響股價的因素。",exEn:"1. Listed companies' share prices are affected by both macroeconomic factors and internal financial decisions:\nStatement (1) is correct: Fuel and motorcars are complementary goods. A rise in fuel prices increases car running costs, depressing demand and impacting the car manufacturer's profits and stock price.\nStatement (2) is correct: High interest rates increase consumers' cost of borrowing auto loans and raise the company's financial costs, lowering profitability and share price.\nStatement (3) is correct: A generous dividend policy attracts investors who seek yield, driving up buying demand and the share price.\n2. Therefore, (1), (2), and (3) are all correct."},
{q:27,year:2017,y:2017,top:"基礎管理 —— 管理功能（領導風格：民主式領導）",topEn:"Basics of Management —— Management Functions (Democratic leadership)",cn:"27. 下列哪項不是企業採用民主式領導的優點？\nA. 提高營運效率\nB. 擴闊管理人員的視野\nC. 加強員工對企業政策的支持\nD. 促進管理層和員工的相互了解",en:"27. Which of the following is not an advantage of adopting democratic leadership for a business?\nA. enhance operational efficiency\nB. broaden managers' horizons\nC. strengthen employees' support for corporate policies\nD. promote mutual understanding between management and staff",ans:"A",rate:"57%",exCn:"1. 民主式領導（Democratic leadership）強調讓下屬參與討論並收集意見。其最大缺點是在諮詢與反覆開會溝通的決策過程中極其耗費時間（Time-consuming），面臨緊急狀況時會降低營運與決策的效率（故 A「提高營運效率」並非其優點）。\n2. B、C、D 均是民主式領導的顯著優點：能激發員工創意拓寬視野（B）、提升政策參與感與支持度（C）、加強勞資相互了解（D）。",exEn:"1. Democratic leadership involves participative decision-making. Its major drawback is that consultation and gathering feedback can be extremely time-consuming, which reduces operational and decision-making efficiency in urgent situations (hence A, enhance operational efficiency, is NOT an advantage).\n2. B, C, and D are verified benefits: it gathers diverse ideas to broaden horizons (B), builds employee consensus to support policies (C), and enhances trust and understanding (D)."},
{q:28,year:2017,y:2017,top:"[out c] 基礎會計 —— 複式記帳記帳科目與方向判定",topEn:"[out c] Introduction to Accounting —— Verifying Double Entries and Ledger Accounts",outc:true,reason:"自 2025 年起，各類商業交易的具體複式記帳會計科目借貸分錄判定，已被全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, bookkeeping entries and double-entry ledger determinations are tested in the Accounting Elective Module Paper 2A.",cn:"28. 下列哪項複式記帳是正確的？\n(1) 交易：以支票結清貨欠 | 借記：應付貨款 | 貸記：銀行存款\n(2) 交易：賒銷商號的辦公室傢具 | 借記：應收貨款 | 貸記：銷貨\n(3) 交易：以現金支付送貨予客戶的運費 | 借記：銷貨運費 | 貸記：現金\n\nA. 只有(1)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"28. Which of the following double entries are correct?\n(1) Settled trade debt by cheque | Account to be debited: Trade payables | Account to be credited: Bank\n(2) Sold the firm's office furniture on credit | Account to be debited: Trade receivables | Account to be credited: Sales\n(3) Paid freight charges for delivering goods to customers in cash | Account to be debited: Carriage outwards | Account to be credited: Cash\n\nA. (1) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"65%",exCn:"1. 陳述 (1) 正確：以支票清還欠供應商之貨欠，負債減少「借記：應付貨款」；銀行存款資產減少「貸記：銀行存款」。\n2. 陳述 (2) 錯誤：出售自用的「辦公室傢具」（屬於非流動資產，而非日常用於轉售的存貨），其貸記科目應為「辦公室傢具」以沖減資產，而不能貸記專用於常規商品賒銷的「銷貨（Sales）」帳戶。\n3. 陳述 (3) 正確：送貨給客戶的運費為銷貨運費（Carriage outwards），費用增加「借記：銷貨運費」；現金資產減少「貸記：現金」。",exEn:"1. Statement (1) is correct: Settling trade payables by cheque decreases liabilities (Dr. Trade Payables) and decreases bank assets (Cr. Bank).\n2. Statement (2) is incorrect: Selling office furniture (a non-current asset, not trade inventory) on credit requires decreasing the non-current asset account. The credited account should be Office Furniture, not Sales (which is strictly used for the sale of trading goods).\n3. Statement (3) is correct: Paying carriage outwards in cash increases expenses (Dr. Carriage Outwards) and decreases cash assets (Cr. Cash)."},
{q:29,year:2017,y:2017,top:"[out c] 財務報表分析 —— 會計比率之用途與限制",topEn:"[out c] Financial Ratio Analysis —— Significance and Limits of Accounting Ratios",outc:true,reason:"自 2025 年起，會計比率分析的功能、局限與各比率定義，已被全數歸入選修部分（會計單元）Paper 2A 第二十一章進行考核。",reasonEn:"Starting from 2025, accounting ratios and financial analysis are tested in the Accounting Elective Module Paper 2A.",cn:"29. 下列哪項有關會計比率的陳述是正確的？\n(1) 它們是用來評估企業的財務業績。\n(2) 「銷貨」是計算所有盈利能力比率的分母。\n(3) 一家企業的酸性測驗比率較其流動比率為高。\n\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"29. Which of the following statements about accounting ratios is correct?\n(1) They are used to evaluate the financial performance of a business.\n(2) Sales is the denominator of all profitability ratios.\n(3) The acid test ratio of a firm is higher than its current ratio.\n\nA. (1) only\nB. (1) and (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"A",rate:"69%",exCn:"1. 陳述 (1) 正確：會計比率是將財報科目進行數值除法運算，以協助持份者評估企業的財務業績與經營實力。\n2. 陳述 (2) 錯誤：並非所有盈利能力比率都以「銷貨」作分母，例如「運用資金報酬率（ROCE）」的分母即是平均運用資金，而非銷貨。\n3. 陳述 (3) 錯誤：速動比率（酸性測驗比率）在分子中排除了變現最慢的「存貨」，因此其分子一定小於或等於流動資產，所以酸性測驗比率一定低於或等於流動比率，不可能更高。",exEn:"1. Statement (1) is correct: Financial ratios are mathematical tools used to interpret financial statements to evaluate business performance.\n2. Statement (2) is incorrect: Not all profitability ratios use Sales as the denominator; for example, the Return on Capital Employed (ROCE) uses Capital Employed as its denominator.\n3. Statement (3) is incorrect: The acid test ratio excludes inventory (the least liquid current asset) from its numerator. Therefore, the acid test ratio is always less than or equal to the current ratio."},
{q:30,year:2017,y:2017,top:"營商環境 —— 企業擁有權類型（合夥企業之名義合夥人）",topEn:"Business Environment —— Forms of Business Ownership (Nominal partner in a partnership)",cn:"30. 下列哪項有關名義合夥人的陳述是正確的？\n(1) 他須承擔合夥的債務。\n(2) 他參與合夥的運作。\n(3) 他的聲譽有助推廣合夥的業務。\n\nA. 只有(1)\nB. 只有(2)\nC. 只有(3)\nD. 只有(2)及(3)",en:"30. Which of the following statements about a nominal partner is correct?\n(1) He is liable for the debts of the partnership.\n(2) He takes part in the operation of the partnership.\n(3) His reputation helps promote the partnership's businesses.\n\nA. (1) only\nB. (2) only\nC. (3) only\nD. (2) and (3) only",ans:"C",rate:"82%",exCn:"1. 名義合夥人（Nominal partner）是指借出個人姓名、名望或商譽給合夥企業使用的成員。他們並非合夥的擁有人、未實質注資，亦不參與合夥的日常營運（故 (2) 錯誤）。\n2. 陳述 (3) 正確：名義合夥人多為社會名流或行業專家，其個人名聲與信譽能極大提振該合夥企業的品牌聲望並推廣業務。\n3. 陳述 (1) 錯誤：名義合夥人未投資亦不分利，通常不承擔無限債務責任。",exEn:"1. A nominal partner is a person who lends his name, reputation, or goodwill to a partnership. He has no equity ownership, does not invest capital, and does not participate in the daily operations of the firm (thus (2) is incorrect).\n2. Statement (3) is correct: Nominal partners are often prominent social figures, and their reputational value significantly boosts the firm's brand image and promotes business.\n3. Statement (1) is incorrect: As defined in the DSE syllabus, a nominal partner is not an owner and does not share in profits/losses, hence is not liable for the partnership's debts."},
{q:1,year:2018,y:2018,top:"營商環境 —— 香港經濟特徵（跨國公司與中小企比例）",topEn:"Business Environment —— Characteristics of Hong Kong Economy (MNCs vs. SMEs)",cn:"1. 下列哪項有關香港經濟的陳述是不正確的？\nA. 香港政府不會操控資本進出。\nB. 香港是世界貿易組織的創始成員。\nC. 香港的企業大多是跨國公司。\nD. 在《更緊密經貿關係的安排》(CEPA)下，香港的服務提供者可在大多數服務領域以優惠待遇在內地開展業務。",en:"1. Which of the following statements about the Hong Kong economy is not correct?\nA. The Hong Kong Government does not control the inflows and outflows of capital.\nB. Hong Kong is a founding member of the World Trade Organization.\nC. Most businesses in Hong Kong are multinational corporations.\nD. Under the Closer Economic Partnership Arrangement (CEPA), service suppliers in Hong Kong enjoy preferential treatment when setting up business in most service sectors on the Mainland.",ans:"C",rate:"47%",exCn:"1. C 是不正確的（即正確答案）：香港的企業有 98% 以上屬於中小型企業（SMEs），而非跨國公司。\n2. A、B、D 均為正確描述：香港不實施外匯管制，資金自由進出；香港是 WTO 創始成員；在 CEPA 框架下，本港服務提供者在內地多個領域享有市場准入等優惠待遇。本題屬於最新必修部分「1(a) 營商環境：香港經濟的特徵及 CEPA 關係」考核範圍。",exEn:"1. C is incorrect (correct answer): Over 98% of businesses in Hong Kong are small and medium enterprises (SMEs), not multinational corporations.\n2. A, B, and D are correct statements: The HK government does not enforce foreign exchange controls, allowing free capital flows; Hong Kong is a founding member of the WTO; under CEPA, local service providers enjoy market access preferences on the Mainland. This topic belongs to the compulsory syllabus '1(a) Business Environment: Characteristics of HK economy and CEPA relationship'."},
{q:2,year:2018,y:2018,top:"[out c] 試算表 —— 試算表帳戶借貸餘額判定",topEn:"[out c] Trial Balance —— Determining Debit and Credit Balances of Accounts",outc:true,reason:"自 2025 年起，試算表的編製與科目借貸餘額的判定，已全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, trial balance preparation and account balance classification are tested in the Accounting Elective Module Paper 2A.",cn:"2. 下列哪個帳戶必定在試算表出現借方結餘？\nA. 租金收益\nB. 購貨退出\nC. 購貨折扣\nD. 貸款予員工",en:"2. Which of the following accounts must carry a debit balance in a trial balance?\nA. Rental income\nB. Purchases returns\nC. Discounts received\nD. Loans to employees",ans:"D",rate:"54%",exCn:"1. D 正確：貸款予員工（Loans to employees）屬於企業的「資產（流動/非流動資產）」，未來會收回資金，資產帳戶必定在試算表呈現借方結餘。\n2. A、B、C 錯誤：租金收益（收入）、購貨退出（沖減購貨費用）和購貨折扣（即獲得的折扣，屬於其他收益）皆具有貸方結餘。",exEn:"1. D is correct: Loans to employees is classified as an asset (current/non-current asset) because the money will be recovered in the future. Asset accounts must carry a debit balance in a trial balance.\n2. A, B, and C are incorrect: Rental income (revenue), Purchases returns (reduction in purchases expense), and Discounts received (other income) all carry credit balances."},
{q:3,year:2018,y:2018,top:"基礎個人理財 —— 恆生指數的重要性",topEn:"Basics of Personal Financial Management —— Importance of the Hang Seng Index",cn:"3. 如果在過去一個月，恆生指數上升了10%，這表示過去一個月\n(1)「恆生工商業分類指數」上升了10%\n(2) 恆生指數成份股的成交金額上升了10%\n(3) 恆生指數成份股的市價普遍上升了\nA. 只有(1)\nB. 只有(2)\nC. 只有(3)\nD. 只有(2)及(3)",en:"3. If the Hang Seng Index (HSI) rose by 10% during the past month, it means that _____ during the past month.\n(1) the 'HSI-Commerce & Industry' rose by 10%\n(2) the turnover of the HSI constituent stocks increased by 10%\n(3) the market prices of the HSI constituent stocks generally increased\nA. (1) only\nB. (2) only\nC. (3) only\nD. (2) and (3) only",ans:"C",rate:"64%",exCn:"1. 陳述 (3) 正確：恆生指數是反映大市價格變動的指標。指數上升 10% 代表其成份股的市價在整體上普遍上升。\n2. 陳述 (1) 錯誤：恆生指數下設四大分類指數（金融、公用事業、地產、工商業），整體恆指上升 10% 是四大分類的加權平均，不代表工商業指數恰好上升 10%。\n3. 陳述 (2) 錯誤：恆生指數量度的是成份股的「市價（市值）水平」，其升降與成份股的成交金額（成交量）無關。本題屬於最新必修部分「1(d) 基礎個人理財：以證券交易作投資（恆指）」考核範圍。",exEn:"1. Statement (3) is correct: The HSI reflects the overall price movements of the stock market. An increase of 10% in the index indicates that the market prices of its constituent stocks have generally increased.\n2. Statement (1) is incorrect: The HSI comprises four sub-indexes (Finance, Utilities, Properties, Commerce & Industry). The 10% increase is a weighted average of all constituent stocks, not meaning that the Commerce & Industry sub-index rose by exactly 10%.\n3. Statement (2) is incorrect: HSI measures the 'market capitalization and price levels' of constituent stocks. Its movements have no direct correlation with trading turnover (volume). This topic is within the compulsory syllabus '1(d) Basics of Personal Financial Management: Stock Trading (HSI)'."},
