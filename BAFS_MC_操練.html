幣業務中心。\n(2) 中國內地是香港商品轉口的主要來源地和目的地。\n(3) 更緊密經貿關係安排 (CEPA)目的是為內地企業在香港籌集資金。\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"22. Which of the following statements are correct?\n(1) Hong Kong is an offshore Renminbi Business Centre of Mainland China.\n(2) The main origin and destination of Hong Kong's re-exports of goods are Mainland China.\n(3) \"Closer Economic Partnership Arrangement\" (CEPA) aims at raising capital in Hong Kong for Mainland enterprises.\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"49%",exCn:"1. **A 正確**：\n   - **(1) 正確**：香港是全球最大的離岸人民幣業務樞紐。\n   - **(2) 正確**：中國內地是香港商品轉口貿易的最大來源地和目的地。\n   - **(3) 錯誤**：CEPA 的核心宗旨是促進兩地貨物貿易與服務貿易自由化，而非協助內地企業在香港籌集資金。\n本題屬於 **2025 年及以後新考綱必修部分「1(a) 營商環境：香港經濟特徵與中港商業關係（CEPA）」**。",exEn:"1. **A is correct**:\n   - **(1) is correct**: Hong Kong is the largest offshore Renminbi business and clearing hub.\n   - **(2) is correct**: Mainland China is the most significant origin and destination of Hong Kong's re-exports.\n   - **(3) is incorrect**: CEPA aims to liberalize trade, not to raise capital for Mainland enterprises.\nThis topic falls under the **2025+ New Syllabus Paper 1 Compulsory Part '1(a) Business Environment: Hong Kong's Business Environment (CEPA and trade)'**."},{q:23,year:2013,y:2013,top:"中小型企業 —— 企業家與企業家精神的特徵",topEn:"Small and Medium Enterprises —— Entrepreneurship and Characteristics of Entrepreneurs",cn:"23. 所有企業家均：\nA. 要承擔風險以賺取利潤。\nB. 以自己的資本成立企業。\nC. 以新產品進入市場。\nD. 具備豐富的行業知識和經驗。",en:"23. All entrepreneurs:\nA. earn profits by taking business risks.\nB. start businesses with their own capital.\nC. enter the market with new products.\nD. possess rich industry knowledge and experience.",ans:"A",rate:"72%",exCn:"1. **A 正確**：企業家的最核心本質定義是勇於在不確定的市場環境中承擔商業風險，並藉此賺取利潤。\n2. **B 錯誤**：資金來源多元，可透過銀行貸款、風險投資等，不限於使用私人自己資本。\n3. **C 錯誤**：進入市場不必然要提供全新研發產品，也可透過改良服務模式。\n4. **D 錯誤**：許多初創企業家在起步時未必擁有極其豐富的行業知識及經驗。\n本題屬於 **2025 年及以後新考綱必修部分「1(b) 基礎管理：中小型企業與企業家精神」**。",exEn:"1. **A is correct**: The ultimate characteristic of all entrepreneurs is their willingness to take calculated business risks to make profits.\n2. **B is incorrect**: Entrepreneurs can utilize bank loans, venture capital, or government grants.\n3. **C is incorrect**: Entrepreneurs can succeed by introducing business model innovations.\n4. **D is incorrect**: Many successful startups are launched by founders who lack rich industry knowledge initially.\nThis topic falls under the **2025+ New Syllabus Paper 1 Compulsory Part '1(b) Basics of Management: Entrepreneurship'**."},{q:24,year:2013,y:2013,top:"基礎個人理財 —— 消費者信貸（私人分期貸款平息率之計算）",topEn:"Basics of Personal Financial Management —— Consumer Credit (Calculating flat rate of personal loans)",cn:"24. 如果某銀行向你提供一個以平息安排的私人分期貸款計劃，貸款金額為$10000，為期四年，還款時間表如下：\n第1年年終還款：$2900\n第2年年終還款：$2900\n第3年年終還款：$2900\n第4年年終還款：$2900\n還款總額：$11600\n這分期貸款計劃的每年平息率是多少？\nA. 3.45%\nB. 4%\nC. 7.25%\nD. 16%",en:"24. If a bank offers you a personal installment loan under a flat rate arrangement, the loan amount is $10 000, for four years, and the repayment schedule is as follows:\nYear 1 end repayment: $2900\nYear 2 end repayment: $2900\nYear 3 end repayment: $2900\nYear 4 end repayment: $2900\nTotal Repayment: $11600\nWhat is the annual flat rate of this installment loan?\nA. 3.45%\nB. 4%\nC. 7.25%\nD. 16%",ans:"B",rate:"42%",exCn:"1. **B 正確**：\n   - **第一步**：總利息 = $11,600 - $10,000 = **$1,600**\n   - **第二步**：每年利息 = $1,600 / 4 = **$400**\n   - **第三步**：每年平息率 = ($400 / $10,000) × 100% = **4%**\n本題屬於 **2025 年及以後新考綱必修部分「1(d) 基礎個人理財：消費者信貸」**。",exEn:"1. **B is correct**:\n   - **Step 1**: Total interest = $11,600 - $10,000 = **$1,600**\n   - **Step 2**: Annual interest = $1,600 / 4 = **$400**\n   - **Step 3**: Annual flat rate = ($400 / $10,000) × 100% = **4%**\nThis topic falls under the **2025+ New Syllabus Paper 1 Compulsory Part '1(d) Basics of Personal Financial Management: Consumer Credit'**."},{q:25,year:2013,y:2013,top:"基礎個人理財 —— 策劃個人理財及投資（保本投資工具之抉擇）",topEn:"Basics of Personal Financial Management —— Personal Financial Planning & Investment (Choosing capital preservation instruments)",cn:"25. 馬莉是一名中五學生，剛從暑期工賺得$8000，她打算用這筆錢支付一年後的大學學費。如果她希望保本，並同時賺取一些回報，下列哪項工具最適合她？\nA. 往來存款\nB. 定期存款\nC. 藍籌股\nD. 認股權證",en:"25. Mary is a Form 5 student who has just earned $8 000 from her summer job. She plans to use this money to pay her university tuition fees one year later. If she wants to preserve her capital and at the same time looks for some returns, which of the following instruments is most suitable to her?\nA. current account\nB. term deposit\nC. blue chips\nD. warrants",ans:"B",rate:"72%",exCn:"1. **B 正確**：\n   - **A 錯誤**：往來存款幾乎沒有任何利息回報，無法滿足「賺取回報」的需求。\n   - **B 正確**：定期存款具有 100% 本金安全，且存期一年可鎖定固定的利息回報。\n   - **C 及 D 錯誤**：藍籌股和認股權證均屬於價格波動劇烈的權益或衍生工具，存在嚴重的本金虧損風險。\n本題屬於 **2025 年及以後新考綱必修部分「1(d) 基礎個人理財：策劃個人理財及投資」**。",exEn:"1. **B is correct**:\n   - **A is incorrect**: A current account offers negligible or zero interest.\n   - **B is correct**: A term deposit provides 100% capital guarantee with a fixed interest return.\n   - **C and D are incorrect**: Blue chip stocks and warrants are subject to high market price volatility.\nThis topic falls under the **2025+ New Syllabus Paper 1 Compulsory Part '1(d) Basics of Personal Financial Management: Investment Instruments'**."},{q:26,year:2013,y:2013,top:"財務報表分析 —— 企業盈利能力比率與營運費用交叉分析",topEn:"Financial Ratio Analysis —— Cross-comparison of profitability and operating expenses",outc:true,reason:"自 2025 年起，會計比率的核算、毛利率與淨利率之對比及企業財務表現分析，已全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Since 2025, the calculation and analysis of profitability ratios are tested under Elective Module Paper 2A.",cn:"26. 與發達行相比，下列哪項對隆興行財務表現的評論是正確的？\n隆興行：營業額 $45 000 000 | 毛利率 28% | 淨利率 19% | 流動比率 1.81:1 | 速動比率 0.75:1\n發達行：營業額 $52 000 000 | 毛利率 25% | 淨利率 22% | 流動比率 2.43:1 | 速動比率 1.65:1\n\nA. 毛利較高\nB. 淨利較高\nC. 銷貨成本較高\nD. 營運費用較高",en:"26. Which of the following comments on the financial performance of Lung Hing Company as compared with Fat Tat Company is correct?\nLung Hing Company: Turnover $45 000 000 | Gross profit ratio 28% | Net profit ratio 19% | Current ratio 1.81:1 | Liquid ratio 0.75:1\nFat Tat Company: Turnover $52 000 000 | Gross profit ratio 25% | Net profit ratio 22% | Current ratio 2.43:1 | Liquid ratio 1.65:1\n\nA. gross profit is higher\nB. net profit is higher\nC. cost of goods sold is higher\nD. operating expenses are higher",ans:"D",rate:"47%",exCn:"1. **D 正確**：\n   - **A 錯誤**：隆興行毛利 = $45M × 28% = $12.6M；發達行 = $52M × 25% = $13M。隆興行較低。\n   - **B 錯誤**：隆興行淨利 = $45M × 19% = $8.55M；發達行 = $52M × 22% = $11.44M。隆興行較低。\n   - **C 錯誤**：隆興行銷貨成本 = $45M × 72% = $32.4M；發達行 = $52M × 75% = $39M。隆興行較低。\n   - **D 正確**：隆興行營運費用 = $12.6M - $8.55M = **$4.05M**；發達行 = $13M - $11.44M = **$1.56M**。隆興行較高。",exEn:"1. **D is correct**:\n   - **A is incorrect**: Lung Hing's gross profit = $12.6M; Fat Tat's = $13.0M. Lung Hing's is lower.\n   - **B is incorrect**: Lung Hing's net profit = $8.55M; Fat Tat's = $11.44M. Lung Hing's is lower.\n   - **C is incorrect**: Lung Hing's COGS = $32.4M; Fat Tat's = $39.0M. Lung Hing's is lower.\n   - **D is correct**: Lung Hing's operating expenses = **$4.05M**; Fat Tat's = **$1.56M**. Lung Hing's is higher."},{q:27,year:2013,y:2013,top:"財務報表分析 —— 變現能力與存貨積壓資金佔比分析",topEn:"Financial Ratio Analysis —— Liquidity and capital tied up in inventory",outc:true,reason:"自 2025 年起，流動比率與速動比率之核算及變現能力交叉比對分析，已全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Since 2025, liquidity ratios and comparative analysis of working capital are tested under Elective Module Paper 2A.",cn:"27. 與發達行相比，下列哪項對隆興行變現能力的評論是正確的？隆興行______。\nA. 積壓於存貨的資金比例較高\nB. 的變現能力較高\nC. 有較多流動資產，以應付短期債務\nD. 的流動負債較少",en:"27. Which of the following comments on the liquidity of Lung Hing Company as compared with Fat Tat Company is correct? Lung Hing Company:\nA. has a higher proportion of capital tied up in inventory.\nB. has a higher liquidity.\nC. has more current assets to meet short-term liabilities.\nD. has fewer current liabilities.",ans:"A",rate:"60%",exCn:"1. **A 正確**：\n   - 隆興行的流動比率（1.81:1）及速動比率（0.75:1）均低於發達行，排除 B。\n   - **關鍵差異在於存貨**：\n     - 隆興行：流動比率 - 速動比率 = 1.81 - 0.75 = **1.06**\n     - 發達行：流動比率 - 速動比率 = 2.43 - 1.65 = **0.78**\n   - 這證實隆興行有更大比例資金鎖定在存貨中。",exEn:"1. **A is correct**:\n   - Lung Hing's current and liquid ratios are both lower than Fat Tat's, eliminating B.\n   - **The differentiator is inventory**:\n     - Lung Hing: Current - Liquid = 1.81 - 0.75 = **1.06**\n     - Fat Tat: Current - Liquid = 2.43 - 1.65 = **0.78**\n   - This confirms Lung Hing has a significantly higher proportion of capital tied up in inventory."},{q:28,year:2013,y:2013,top:"複式記帳法 —— 商業交易在分類帳帳戶中的借貸方向判定",topEn:"Double-entry Bookkeeping —— Verifying debit and credit entries in ledger accounts",outc:true,reason:"自 2025 年起，各類商業交易之複式記帳借貸分錄與帳戶確認，已全數歸入選修部分（會計單元）Paper 2A 考核。",reasonEn:"Since 2025, double-entry bookkeeping, ledger account debits and credits are tested under Elective Module Paper 2A.",cn:"28. 下列哪項複式記帳是正確的？\n(1) 從銀行戶口提取現金$20000，供企業使用 | 借記：提用 | 貸記：銀行存款\n(2) 以現金支付雜費$3000 | 借記：雜費 | 貸記：現金\n(3) 經銀行戶口收取銀行貸款$200000 | 借記：銀行存款 | 貸記：銀行貸款\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"28. Which of the following double entries are correct?\n(1) Withdrew cash of $20 000 from bank account for business use | Account to be debited: Drawings | Account to be credited: Bank\n(2) Paid sundry expenses of $3 000 in cash | Account to be debited: Sundry expenses | Account to be credited: Cash\n(3) Received a bank loan of $200 000 through bank account | Account to be debited: Bank | Account to be credited: Bank loan\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"58%",exCn:"1. **C 正確**：\n   - **(1) 錯誤**：從銀行提取現金「供企業使用」應借記「現金」；貸記「銀行存款」。只有東主私人用途才借記「提用」。\n   - **(2) 正確**：支付雜費，費用增加借記「雜費」；現金減少貸記「現金」。\n   - **(3) 正確**：經銀行收取貸款，銀行資產增加借記「銀行存款」；負債增加貸記「銀行貸款」。",exEn:"1. **C is correct**:\n   - **(1) is incorrect**: Withdrawing cash \"for business use\" should be: Dr. Cash; Cr. Bank. Drawings is only for personal use.\n   - **(2) is correct**: Dr. Sundry expenses; Cr. Cash.\n   - **(3) is correct**: Dr. Bank; Cr. Bank loan."},{q:29,year:2013,y:2013,top:"基礎管理 —— 主要商業功能（資訊管理對營運與溝通之支援）",topEn:"Basics of Management —— Key Business Functions (Support of information management on sales and communication)",cn:"29. 一家貿易公司向銷售團隊每位員工提供備有流動網絡連線功能的筆記簿型電腦。這安排對公司有甚麼益處？\n(1) 有助更新銷售數據\n(2) 加強銷售團隊員工之間的信息交流\n(3) 促進與客戶的溝通\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"29. A trading company provides each of its sales representatives with a laptop computer equipped with mobile network connection. What are the benefits of this arrangement to the company?\n(1) facilitate the update of sales data\n(2) enhance the exchange of information among sales representatives\n(3) improve the communication with customers\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"65%",exCn:"1. **D 正確**：\n   - **(1) 正確**：銷售代表可即時連線公司系統，更新銷售數據與訂單庫存資訊。\n   - **(2) 正確**：透過電子郵件或內部網絡，加強銷售同仁之間的信息交流。\n   - **(3) 正確**：能即時向客戶展示產品目錄、解答疑問並立即下單。\n本題屬於 **2025 年及以後新考綱必修部分「1(b) 基礎管理：主要商業功能（資訊管理）」**。",exEn:"1. **D is correct**:\n   - **(1) is correct**: Representatives can log into the company's database in real-time.\n   - **(2) is correct**: High-speed internet enhances communication and information exchange.\n   - **(3) is correct**: Sales representatives can present catalogues and record orders immediately.\nThis topic falls under the **2025+ New Syllabus Paper 1 Compulsory Part '1(b) Basics of Management: Information Management'**."},{q:30,year:2013,y:2013,top:"會計的目的及角色 —— 會計的基本定義與四大核心功能分類",topEn:"Purpose of Accounting —— Core tasks and classifications of accounting functions",outc:true,reason:"自 2025 年起，會計的定義、角色與記錄、分類、歸納、溝通四大功能之原理，已全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Since 2025, introductory accounting definitions, functions, and the accounting cycle are tested under Elective Module Paper 2A.",cn:"30. 下列哪項是會計的工作？\n(1) 為商業交易作分類和記錄\n(2) 採購系統裝備保安措施\n(3) 為公司的銷售表現作週期性總結和匯報\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"30. Which of the following are tasks of accounting?\n(1) classifying and recording business transactions\n(2) equipping the purchasing system with security measures\n(3) summarising and reporting the performance of the company's sales periodically\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"89%",exCn:"1. **B 正確**：\n   - **(1) 正確**：為商業交易作分類及記錄屬於會計最基礎的分類與記錄功能。\n   - **(2) 錯誤**：為採購系統裝備保安措施屬於資訊技術與資訊管理部門的技術職掌。\n   - **(3) 正確**：定期對銷售業績進行總結並編製報表，屬於會計的歸納與溝通功能。",exEn:"1. **B is correct**:\n   - **(1) is correct**: Classifying and recording transactions constitutes the core bookkeeping functions.\n   - **(2) is incorrect**: Installing cybersecurity measures is a task for the IT department.\n   - **(3) is correct**: Summarizing performances and preparing reports highlights accounting's summarising and communicating functions."},{q:1,year:2014,y:2014,top:"營商環境 —— 企業擁有權類型（有限公司特徵）",topEn:"Business Environment —— Forms of Business Ownership (Characteristics of limited companies)",cn:"1. 下列哪項有關香港的有限公司的陳述是正確的？\n(1) 有限公司是一個獨立的法定個體。\n(2) 有限公司較獨資商號享有較低的利得稅稅率。\n(3) 有限公司必須在報章上發布其財務報表。\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. (1)、(2)及(3)",en:"1. Which of the following statements about limited companies in Hong Kong is/are correct?\n(1) A limited company is a separate legal entity.\n(2) Limited companies enjoy a lower profits tax rate than sole proprietorships.\n(3) Limited companies are required to publish their financial statements in a newspaper.\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"83%",exCn:"1. **(1) 正確**：有限公司具有「獨立法定個體」地位，在法律上獨立於其股東。\n2. **(2) 錯誤**：有限公司適用的利得稅率（兩級制下首200萬為8.25%，其後為16.5%）高於非法團企業（首200萬為7.5%，其後為15%）。\n3. **(3) 錯誤**：只有「公眾有限公司」才需要依法公開披露財務報表，大部分有限公司均為「私人有限公司」。\n故只有 (1) 正確，選 A。",exEn:"1. **(1) is correct**: A limited company is a separate legal entity distinct from its owners.\n2. **(2) is incorrect**: The profits tax rate for limited companies (8.25% / 16.5%) is higher than that for unincorporated businesses (7.5% / 15%).\n3. **(3) is incorrect**: Only public limited companies are required to publish their financial statements.\nTherefore, only (1) is correct, making A the correct answer."},{q:2,year:2014,y:2014,top:"基礎個人理財 —— 金融服務消費者的權利與責任（監管機構職能）",topEn:"Basics of Personal Financial Management —— Rights and Responsibilities of Financial Consumers (Functions of regulators)",cn:"2. 如投資者欲就經紀在股票交易中的不當行為提出投訴，他應向下列哪個機構提出？\nA. 香港金融管理局\nB. 證券及期貨事務監察委員會\nC. 香港交易及結算所有限公司\nD. 投資者賠償有限公司",en:"2. If an investor wants to complain about the misconduct of his broker in a share transaction, which of the following organisations should he turn to?\nA. Hong Kong Monetary Authority\nB. Securities and Futures Commission\nC. Hong Kong Exchanges and Clearing Limited\nD. Investor Compensation Company Limited",ans:"B",rate:"56%",exCn:"1. **證券及期貨事務監察委員會（證監會，SFC）**是負責監管香港證券及期貨市場的法定獨立機構。調查及處理有關持牌中介人的不當行為屬於其核心監管職能。\n2. 金管局（A）監管銀行業；港交所（C）營運交易平台；投資者賠償公司（D）負責處理因中介人違責倒閉而引起的賠償申索。",exEn:"1. The **Securities and Futures Commission (SFC)** is the statutory regulatory body responsible for regulating Hong Kong's securities and futures markets.\n2. The HKMA (A) regulates banking; HKEX (C) operates the trading platform; the Investor Compensation Company (D) handles compensation claims in cases of intermediary default."},{q:3,year:2014,y:2014,top:"營商環境 —— 商業道德及社會責任（企業履行社會責任的好處）",topEn:"Business Environment —— Business Ethics and Social Responsibility (Benefits of corporate social responsibility)",cn:"3. 承擔社會責任的企業會有下列哪些好處？\n(1) 降低生產成本\n(2) 提高企業聲譽\n(3) 吸引同樣關注社會責任的顧客\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"3. Which of the following are benefits of being a socially responsible business?\n(1) lower production costs\n(2) better business reputation\n(3) attraction of customers who are also concerned about social responsibility\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"91%",exCn:"1. **(1) 錯誤**：履行社會責任通常在短期內會「增加」而非降低企業的生產或營運成本。\n2. **(2)及(3) 正確**：實踐 CSR 能顯著提升企業的聲譽（(2)），並能吸引重視環保與社會正義的消費者（(3)）。\n故只有 (2) 及 (3) 正確，選 C。",exEn:"1. **(1) is incorrect**: Fulfilling CSR usually \"increases\" rather than lowers production costs in the short run.\n2. **(2) and (3) are correct**: CSR enhances a firm's public image and helps build a loyal customer base among socially conscious consumers.\nTherefore, (2) and (3) are benefits, making C the correct answer."},{q:4,year:2014,y:2014,top:"基礎個人理財 —— 策劃個人理財及投資（強積金制度供款特徵）",topEn:"Basics of Personal Financial Management —— Personal Financial Planning & Investment (MPF contribution characteristics)",cn:"4. 下列哪項有關強制性公積金(強積金)制度的陳述是正確的？\nA. 自僱人士毋須參加強積金計劃。\nB. 受強積金制度涵蓋的僱員須按其入息的5%作出供款。\nC. 除了定期強制性供款外，僱員還可選擇額外自願性供款。\nD. 強積金計劃成員年屆60歲，便可提取其累算權益。",en:"4. Which of the following statements about the Mandatory Provident Fund (MPF) system is correct?\nA. Self-employed persons are not required to enrol in an MPF scheme.\nB. Employees covered by the MPF system are required to contribute 5% of their income.\nC. Employees can choose to make extra voluntary contributions in addition to the regular mandatory contributions.\nD. MPF scheme members can withdraw their accrued benefits when they reach the age of 60.",ans:"C",rate:"41%",exCn:"1. **A 錯誤**：自僱人士（18至65歲）必須依法強制加入強積金計劃並供款。\n2. **B 錯誤**：供款比例為5%只限於「介乎最低與最高有關入息水平」之間的僱員，並非無條件按「全部入息」的5%供款。\n3. **C 正確**：強積金計劃允許成員在法定強制性供款之外，自願做出額外之「自願性供款」。\n4. **D 錯誤**：強積金提取累算權益的法定年齡為65歲。",exEn:"1. **A is incorrect**: Self-employed persons aged 18-65 must enrol in an MPF scheme.\n2. **B is incorrect**: The 5% contribution rate is subject to statutory minimum and maximum income levels.\n3. **C is correct**: Employees can choose to make additional voluntary contributions on top of mandatory contributions.\n4. **D is incorrect**: The statutory retirement age for withdrawing MPF benefits is 65."},{q:5,year:2014,y:2014,top:"基礎會計 —— 會計假設與概念（企業個體假設與提用科目）",topEn:"Introduction to Accounting —— Accounting Assumptions & Principles (Business entity concept and drawings)",outc:true,reason:"自 2025 年起，基礎會計（包括會計基本假設、提用與日記帳分錄）已被完全移至選修部分會計單元（Paper 2A）。",reasonEn:"Starting from 2025, introductory accounting topics are removed from Paper 1 and are now tested in Elective Module Paper 2A.",cn:"5. 某商號一直把給予顧客的免費樣本開支記作促銷費用。東主在年底取了一些免費樣本自用，根據______觀念，這些免費樣本應作______處理。\nA. 企業個體…… 促銷費用\nB. 企業個體…… 提用\nC. 一貫性…… 促銷費用\nD. 一貫性…… 提用",en:"5. It is a firm's practice to record free samples given to customers as promotion expenses. At the year end, the owner of the firm took some free samples for his personal use. According to the _______ concept, these free samples should be treated as _______.\nA. business entity... promotion expenses\nB. business entity... drawings\nC. consistency... promotion expenses\nD. consistency... drawings",ans:"B",rate:"82%",exCn:"1. **企業個體觀念**規定企業與其東主在會計上是完全分離的兩個個體。\n2. 當東主提取企業的免費樣本供「私人用途」時，必須記入**「提用（Drawings）」**帳戶。故選 B。",exEn:"1. The **business entity concept** states that a business is treated as a separate accounting entity distinct from its owner(s).\n2. When the owner takes free samples for personal use, this must be recorded as **drawings**. Thus, B is correct."},{q:6,year:2014,y:2014,top:"基礎管理 —— 中小型企業的特徵",topEn:"Basics of Management —— Small and Medium Enterprises (SMEs characteristics)",cn:"6. 下列哪些有關香港中小型企業(中小企)的陳述是正確的？\n(1) 中小企是指僱用少於50人的企業。\n(2) 中小企為香港提供大多數就業機會。\n(3) 中小企通常補足大型公司未有提供的產品和服務。\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"6. Which of the following statements about small and medium enterprises (SMEs) in Hong Kong are correct?\n(1) An SME employs fewer than 50 persons.\n(2) SMEs contribute a majority of employment opportunities in Hong Kong.\n(3) SMEs often provide products and services that complement large companies.\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"44%",exCn:"1. **(1) 錯誤**：製造業企業為僱用少於100人，而非製造業企業才是少於50人。\n2. **(2) 正確**：本港98%以上的公司為中小企，提供了絕大多數的就業崗位。\n3. **(3) 正確**：中小企靈活度高，通常能提供大型企業未有覆蓋的互補產品和服務。\n故只有 (2) 及 (3) 正確，選 C。",exEn:"1. **(1) is incorrect**: A manufacturing enterprise employs fewer than 100 persons; a non-manufacturing enterprise employs fewer than 50.\n2. **(2) is correct**: SMEs constitute over 98% of businesses in Hong Kong and contribute the majority of employment.\n3. **(3) is correct**: SMEs can customize niche products or services that complement large corporations.\nTherefore, (2) and (3) are correct, making C the correct answer."},{q:7,year:2014,y:2014,top:"營商環境 —— 香港的營商環境（金融市場的參與者）",topEn:"Business Environment —— Hong Kong's Business Environment (Participants in financial markets)",cn:"7. 下列哪些是金融市場的參與者？\n(1) 上市公司\n(2) 商業銀行\n(3) 證券經紀\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"7. Which of the following are participants in the financial market?\n(1) listed companies\n(2) commercial banks\n(3) securities brokers\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"78%",exCn:"1. 金融市場的參與者包含資金的供給方、需求方、以及各類中介機構：\n   - **(1) 上市公司**：作為資金的需求方直接參與金融市場。\n   - **(2) 商業銀行**：作為金融中介機構，是金融市場的主要參與者。\n   - **(3) 證券經紀**：協助投資者在二級市場上執行交易。\n因此 (1)、(2)、(3) 均為金融市場參與者，選 D。",exEn:"1. Financial market participants include capital providers, demanders, and intermediaries:\n   - **(1) Listed companies** act as capital demanders.\n   - **(2) Commercial banks** are major financial intermediaries.\n   - **(3) Securities brokers** execute trades in secondary markets.\nTherefore, (1), (2), and (3) are all participants, making D the correct answer."},{q:8,year:2014,y:2014,top:"基礎個人理財 —— 消費者信貸（信用卡的機制與利率）",topEn:"Basics of Personal Financial Management —— Consumer Credit (Mechanisms and interest of credit cards)",cn:"8. 下列哪些有關信用卡的陳述是正確的？\n(1) 設有信用限額\n(2) 結欠設有最低還款額\n(3) 如在到期日前繳付最低還款額，餘額不會徵收利息\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"8. Which of the following statements about credit cards are correct?\n(1) It has credit limit.\n(2) The outstanding balance has minimum payment.\n(3) If the minimum payment is made by the due date, no interest will be charged on the remaining balance.\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"57%",exCn:"1. **(1)及(2) 正確**：信用卡設有最高累計消費上限（信用限額）；每月結單設有法定的「最低還款額」。\n2. **(3) 錯誤**：如果僅支付最低還款額而未全數清還，發卡銀行會對剩餘結欠徵收極高年息（通常超過30%）。\n故只有 (1) 及 (2) 正確，選 A。",exEn:"1. **(1) and (2) are correct**: Credit cards have a credit limit and a minimum payment requirement.\n2. **(3) is incorrect**: If only the minimum payment is made, the card issuer will charge high interest on the remaining unpaid balance.\nTherefore, only (1) and (2) are correct, making A the correct answer."},{q:9,year:2014,y:2014,top:"財務報表分析 —— 變現能力比率（速動比率倒推存貨）",topEn:"Financial Ratio Analysis —— Liquidity Ratios (Quick ratio and inventory calculation)",outc:true,reason:"自 2025 年起，財務比率的深入分析、指標公式計算及會計比率解讀已全數歸入選修部分會計單元（Paper 2A）。",reasonEn:"Starting from 2025, in-depth financial ratio analysis and interpretation of accounting ratios are moved to Elective Module Paper 2A.",cn:"9. 2013年12月31日，昆頓公司的流動負債為$60000，流動比率為3:1，速動比率則為2:1，該日其存貨額是多少？\nA. $60 000\nB. $120 000\nC. $180 000\nD. $240 000",en:"9. On 31 December 2013, Quinton Company had current liabilities of $60 000, a current ratio of 3:1 and a liquid ratio of 2:1. What was the amount of its inventory on that day?\nA. $60 000\nB. $120 000\nC. $180 000\nD. $240 000",ans:"A",rate:"76%",exCn:"1. **流動資產** = $60,000 × 3 = $180,000\n2. **速動資產** = $60,000 × 2 = $120,000\n3. **存貨** = 流動資產 - 速動資產 = $180,000 - $120,000 = **$60,000**。故選 A。",exEn:"1. **Current Assets** = $60,000 × 3 = $180,000\n2. **Quick Assets** = $60,000 × 2 = $120,000\n3. **Inventory** = Current Assets - Quick Assets = $180,000 - $120,000 = **$60,000**. Therefore, A is correct."},{q:10,year:2014,y:2014,top:"試算表 —— 試算表借貸不平衡之原因及簿記錯誤",topEn:"Trial Balance —— Arithmetical Imbalance and Double-entry Errors",outc:true,reason:"自 2025 年起，試算表編製、試算表不平衡、暫記帳及錯誤更正等課題，已被全數移至選修部分會計單元（Paper 2A）。",reasonEn:"Starting from 2025, trial balance preparation, imbalances, suspense accounts, and correction of errors are moved to Elective Module Paper 2A.",cn:"10. 如果試算表的借方結餘總和比貸方結餘總和大，這表示\nA. 本年度有虧損\nB. 複式記帳有錯誤\nC. 沒有足夠資本以營運業務\nD. 資產總額比負債總額大",en:"10. If the total of the debit column of a trial balance is larger than the total of the credit column, this indicates that\nA. there is a net loss for the year\nB. there is an error in the double entry bookkeeping\nC. there is insufficient capital to run the business\nD. the amount of total assets is larger than the total liabilities",ans:"B",rate:"80%",exCn:"1. 試算表的核心功能是藉由「借方總和 = 貸方總和」來檢視分類帳過帳的算術準確度。\n2. 任何導致借貸不相等的狀況，唯一代表在複式記帳過程中發生了**錯誤**，故選 B。",exEn:"1. The fundamental purpose of a trial balance is to verify the arithmetical accuracy of ledger postings.\n2. If the debit and credit columns do not balance, it uniquely indicates a **bookkeeping error**. Thus, B is correct."},{q:11,year:2014,y:2014,top:"損益表與財務比率 —— 根據毛利率及銷貨成本倒推銷貨額",topEn:"Profit & Loss and Accounting Ratios —— Calculating Sales via COGS and Gross Profit Ratio",outc:true,reason:"自 2025 年起，銷貨成本核算、損益表科目細項調整與毛利等相關計算，已全數被歸入選修部分會計單元（Paper 2A）。",reasonEn:"Starting from 2025, COGS calculations, income statement adjustments, and gross profit ratio calculations are moved to Elective Module Paper 2A.",cn:"11. 某企業的毛利率為25%。試根據以下數據計算其銷貨額：\n期初存貨: $10 000 | 期末存貨: $4 000 | 購貨: $51 000 | 銷售費用: $1 500\nA. $69 375\nB. $71 250\nC. $74 000\nD. $76 000",en:"11. A firm's gross profit ratio is 25%. Based on the following data, calculate its sales:\nOpening inventory: $10 000 | Closing inventory: $4 000 | Purchases: $51 000 | Selling expenses: $1 500\nA. $69 375\nB. $71 250\nC. $74 000\nD. $76 000",ans:"D",rate:"62%",exCn:"1. **銷貨成本** = $10,000 + $51,000 - $4,000 = $57,000\n2. **銷貨額** = $57,000 / (1 - 25%) = $57,000 / 0.75 = **$76,000**。故選 D。",exEn:"1. **COGS** = $10,000 + $51,000 - $4,000 = $57,000\n2. **Sales** = $57,000 / 0.75 = **$76,000**. Therefore, D is correct."},{q:12,year:2014,y:2014,top:"基礎個人理財 —— 以證券交易作投資（證券市場與發行特徵）",topEn:"Basics of Personal Financial Management —— Stock Trading as Investment (Securities market features)",cn:"12. 以下哪項有關證券市場的陳述是正確的？\n(1) 投資者可在一手市場買入和賣出證券。\n(2) 二手市場包括交易所市場和場外交易市場。\n(3) 上市公司可透過證券市場發行新股籌集資金。\nA. 只有(1)\nB. 只有(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"12. Which of the following statements about the securities market is/are correct?\n(1) Investors can buy and sell securities in the primary market.\n(2) The secondary market comprises the listed exchanges and the over-the-counter market.\n(3) A listed company may issue new shares to raise funds through the securities market.\nA. (1) only\nB. (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"57%",exCn:"1. **(1) 錯誤**：一手市場僅供發行機構向認購者首度發行全新證券，投資者不能在此進行賣出。\n2. **(2) 正確**：二手市場包含交易所市場及場外交易市場（OTC）。\n3. **(3) 正確**：上市公司可透過證券市場發行新股籌集資金。\n故只有 (2) 及 (3) 正確，選 C。",exEn:"1. **(1) is incorrect**: The primary market is solely for the initial sale of new securities; investors cannot sell here.\n2. **(2) is correct**: The secondary market consists of organized exchanges and the OTC market.\n3. **(3) is correct**: Listed companies can issue new shares to raise funds.\nTherefore, (2) and (3) are correct, making C the correct answer."},{q:13,year:2014,y:2014,top:"基礎個人理財 —— 金錢的時間值（淨現值評估所需數據）",topEn:"Basics of Personal Financial Management —— Time Value of Money (Required variables for Net Present Value)",cn:"13. 愛莎擬以淨現值來決定是否購買一件辦公室設備。她需要下列哪些資料來作決定？\n(1) 資金成本\n(2) 購置和使用該辦公室設備所引致的現金流\n(3) 該辦公室設備在使用年限完結時的殘值\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"13. Elsa plans to use the net present value to decide whether to buy a piece of office equipment. Which of the following pieces of information does she need to make the decision?\n(1) cost of capital\n(2) cash flows arising from acquisition and use of the office equipment\n(3) residual value of the office equipment at the end of its useful life\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"58%",exCn:"在進行 NPV 資本預算評估時：\n* **(1) 需要**：資金成本作為折現率。\n* **(2) 需要**：購置與使用期間的各期現金流。\n* **(3) 需要**：期末殘值是最後一期重要的額外現金流入。\n因此 (1)、(2)、(3) 皆是不可或缺的決策數據，選 D。",exEn:"To calculate NPV for capital budgeting:\n* **(1) is required**: Cost of capital serves as the discount rate.\n* **(2) is required**: The initial cash outflow and subsequent cash flows are essential.\n* **(3) is required**: Residual value is an important cash inflow in the final year.\nTherefore, (1), (2), and (3) are all required, making D the correct answer."},{q:14,year:2014,y:2014,top:"複式記帳與會計循環 —— 會計循環各步驟的先後順序",topEn:"Double-entry and Accounting Cycle —— Chronological Sequence of Accounting Cycle Steps",outc:true,reason:"自 2025 年起，整個會計循環已全數歸入選修部分會計單元（Paper 2A）考核。",reasonEn:"Starting from 2025, the accounting cycle steps are moved to Elective Module Paper 2A.",cn:"14. 在會計循環中，繼原始分錄簿後的流程是什麼？\n(1) 期末調整 (2) 財務報表 (3) 分類帳 (4) 試算表\nA. (2) -> (1) -> (3) -> (4)\nB. (1) -> (2) -> (4) -> (3)\nC. (3) -> (4) -> (1) -> (2)\nD. (4) -> (3) -> (1) -> (2)",en:"14. In the accounting cycle, what is the process after the books of original entry?\n(1) Period-end adjustments (2) Financial statements (3) Ledgers (4) Trial balance\nA. (2) -> (1) -> (3) -> (4)\nB. (1) -> (2) -> (4) -> (3)\nC. (3) -> (4) -> (1) -> (2)\nD. (4) -> (3) -> (1) -> (2)",ans:"C",rate:"85%",exCn:"在會計循環中，繼原始分錄簿後的順序為：\n1. 過帳至**分類帳 (3)**\n2. 編製**試算表 (4)**\n3. **期末調整 (1)**\n4. 編製**財務報表 (2)**\n正確順序為 **(3) -> (4) -> (1) -> (2)**，選 C。",exEn:"After the books of original entry, the sequence is:\n1. Post to **ledgers (3)**\n2. Prepare **trial balance (4)**\n3. Make **period-end adjustments (1)**\n4. Prepare **financial statements (2)**\nThe correct sequence is **(3) -> (4) -> (1) -> (2)**, making C the correct answer."},{q:15,year:2014,y:2014,top:"營商環境 —— 影響商業決策的因素（宏觀經濟因素之分辨）",topEn:"Business Environment —— Factors Affecting Business Decisions (Identifying macroeconomic factors)",cn:"15. 下列哪項例子是影響一家香港珠寶店業務的經濟因素？\n(1) 內地旅客的收入及消費力上升。\n(2) 內地政府讓更多內地城市的居民到香港個人遊。\n(3) 跨境交通配套改善。\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"15. Which of the following is/are the example(s) of economic factors that might affect the business of a jewellery shop in Hong Kong?\n(1) There is an increase in the income and consumption power of mainland tourists.\n(2) The mainland government allows residents of more cities to come to Hong Kong for individual visits.\n(3) The cross-border transport facilities are improved.\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"A",rate:"71%",exCn:"嚴格區分 PEEST 外在環境因素：\n* **(1) 屬於經濟因素**：收入及消費力的升降是經典的宏觀經濟指標。\n* **(2) 屬於政治及法律因素**：內地政府對個人遊政策的審批是政府政策變動。\n* **(3) 屬於自然地理因素**：跨境交通配套屬於基礎建設改善。\n故只有 (1) 正確，選 A。",exEn:"Under PEEST analysis:\n* **(1) is an economic factor**: Income and consumption power are macroeconomic indicators.\n* **(2) is a political/legal factor**: The government's visa policy is a regulatory change.\n* **(3) is a physical factor**: Transport infrastructure improvements are physical environment changes.\nTherefore, only (1) is an economic factor, making A the correct answer."},{q:16,year:2014,y:2014,top:"基礎會計 —— 購置非流動資產之估值（歷史成本與營業折扣）",topEn:"Introduction to Accounting —— Capitalizing Non-current Assets (Historical cost and trade discounts)",outc:true,reason:"自 2025 年起，非流動資產的購置成本資本化核算、折舊計算等已全數歸入選修部分會計單元（Paper 2A）。",reasonEn:"Starting from 2025, capitalization of non-current assets and depreciation calculations are moved to Elective Module Paper 2A.",cn:"16. 2013年12月30日，某商號購買一輛貨車，以支票支付$150 000。貨車的定價是$243 000，營業折扣則為$15 000。2013年12月31日，其市值跌至$200 000。該貨車在2013年12月31日的財務狀況表中應記錄為\nA. $150 000\nB. $200 000\nC. $228 000\nD. $243 000",en:"16. On 30 December 2013, a firm bought a motor van and made a payment of $150 000 by cheque. The van's list price was $243 000 and a trade discount of $15 000 was given. As at 31 December 2013, its market value had fallen to $200 000. The van should be recorded at _______ in the statement of financial position as at 31 December 2013.\nA. $150 000\nB. $200 000\nC. $228 000\nD. $243 000",ans:"C",rate:"52%",exCn:"1. 根據**歷史成本原則**，資產必須以其「實際購置成本」入帳。\n2. **實際購置成本** = 定價 $243,000 - 營業折扣 $15,000 = **$228,000**。\n3. 支付金額 $150,000 與市值波動均不影響歷史成本的判定。故選 C。",exEn:"1. According to the **historical cost principle**, assets must be recorded at actual acquisition cost.\n2. **Actual cost** = List price $243,000 - Trade discount $15,000 = **$228,000**.\n3. Amount paid and market value fluctuations do not affect the historical cost. Thus, C is correct."},{q:17,year:2014,y:2014,top:"基礎管理 —— 管理功能（計劃：SMART目標準則的應用）",topEn:"Basics of Management —— Management Functions (Planning: Applying SMART objectives)",cn:"17. 陳先生是某大型連鎖超級市場的總經理，他為連鎖店訂下目標:「我們要盡快把九龍區的營業額增加10%。」這目標未能符合下列哪項訂定良好目標的準則？\n(1) 具體的 (2) 具時限的 (3) 可量度的\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"17. Mr Chan is the general manager of a large supermarket chain. He sets a target: \"We will increase the sales volume of the Kowloon area by 10% as soon as possible.\" Which of the following criteria for setting good objectives is/are NOT met?\n(1) specific (2) time-bound (3) measurable\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"B",rate:"74%",exCn:"使用 SMART 原則審視：\n* **(1) 符合「具體」**：指出了具體區域「九龍區」及指標「營業額」。\n* **(2) 不符合「具時限」**：「盡快」是模糊字眼，無明確截止時限。\n* **(3) 符合「可量度」**：給予了確切的量化百分比「10%」。\n因此僅未能符合「具時限」準則，選 B。",exEn:"Under SMART criteria:\n* **(1) is met (Specific)**: The goal targets a specific region and indicator.\n* **(2) is NOT met (Time-bound)**: \"As soon as possible\" is vague with no clear deadline.\n* **(3) is met (Measurable)**: The goal specifies a quantified target of 10%.\nTherefore, only (2) is not met, making B the correct answer."},{q:18,year:2014,y:2014,top:"損益表與會計科目 —— 購貨折扣增加對毛利與淨利的影響",topEn:"P&L and Accounting Terminology —— Impact of discounts received on gross and net profit",outc:true,reason:"自 2025 年起，現金折扣與貿易折扣的會計學科歸類及損益表內部的細項核算已全數移至選修部分會計單元（Paper 2A）。",reasonEn:"Starting from 2025, classification of cash and trade discounts and P&L calculations are moved to Elective Module Paper 2A.",cn:"18. 購貨折扣增加對毛利和淨利有什麼影響？\n毛利 / 淨利\nA. 不變 / 不變\nB. 不變 / 上升\nC. 上升 / 不變\nD. 上升 / 上升",en:"18. How will an increase in discounts received affect the gross profit and net profit?\nGross profit / Net profit\nA. unchanged / unchanged\nB. unchanged / increases\nC. increases / unchanged\nD. increases / increases",ans:"B",rate:"74%",exCn:"1. **購貨折扣**被歸類為「其他收益」，列在毛利之後。\n2. **對毛利的影響**：毛利 = 銷貨淨額 - 銷貨成本，購貨折扣不影響貿易利潤，**毛利不變**。\n3. **對淨利的影響**：淨利 = 毛利 + 其他收益 - 營運費用，其他收益增加令**淨利上升**。\n故選 B。",exEn:"1. **Discounts received** are classified as \"Other income\", listed below gross profit.\n2. **Impact on Gross Profit**: Gross profit = Net Sales - COGS; discounts received do not affect it, so **gross profit remains unchanged**.\n3. **Impact on Net Profit**: Net profit = Gross Profit + Other Income - Expenses; an increase in other income **increases net profit**.\nThus, B is correct."},{q:19,year:2014,y:2014,top:"財務報表分析 —— 會計比率核算（僅有損益表可計算之比率）",topEn:"Financial Ratio Analysis —— Accounting Ratios (Ratios calculable solely from the Income Statement)",outc:true,reason:"自 2025 年起，所有關於會計比率的核算已全數被移至選修部分會計單元（Paper 2A）考核。",reasonEn:"Starting from 2025, the calculation and composition of accounting ratios are moved to Elective Module Paper 2A.",cn:"19. 若只有損益表，可計算下列哪項會計比率？\n(1) 淨利率 (2) 速動比率 (3) 運用資金報酬率\nA. 只有(1)\nB. 只有(2)\nC. 只有(3)\nD. 只有(1)及(3)",en:"19. If only the income statement is available, which of the following accounting ratios can be calculated?\n(1) net profit margin (2) quick ratio (3) return on capital employed\nA. (1) only\nB. (2) only\nC. (3) only\nD. (1) and (3) only",ans:"A",rate:"75%",exCn:"1. **(1) 可計算**：淨利率 = 淨利 / 銷貨額，兩者皆從損益表獲取。\n2. **(2) 不可計算**：速動比率需要流動資產與流動負債，來自財務狀況表。\n3. **(3) 不可計算**：運用資金報酬率需要「運用資金」，來自財務狀況表。\n故只有 (1) 符合，選 A。",exEn:"1. **(1) can be calculated**: Net profit margin = Net Profit / Sales, both from the income statement.\n2. **(2) cannot be calculated**: Quick ratio requires current assets/liabilities from the statement of financial position.\n3. **(3) cannot be calculated**: ROCE requires capital employed from the statement of financial position.\nTherefore, only (1) can be calculated, making A the correct answer."},{q:20,year:2014,y:2014,top:"不同企業擁有權類型的財務報告編製 —— 財務報表的使用者與資訊需要",topEn:"SFP and Income Statement —— Users of Financial Statements and Their Information Needs",outc:true,reason:"自 2025 年起，財務報表的用途、使用者類型及各自的資訊需要已歸入選修部分會計單元（Paper 2A）。",reasonEn:"Starting from 2025, the purposes of financial statements and types of users are moved to Elective Module Paper 2A.",cn:"20. ______是財務報表的外部使用者，關注公司的變現能力和償債能力。\nA. 管理人員\nB. 顧客\nC. 競爭對手\nD. 貸款人",en:"20. ______ is/are external user(s) of financial statements who are concerned about the liquidity and solvency of a company.\nA. managers\nB. customers\nC. competitors\nD. lenders",ans:"D",rate:"80%",exCn:"1. **外部使用者**是指非公司日常經營決策核心人員（排除 A）。\n2. **貸款人（Lenders）**是典型的外部使用者，最為關注公司的「變現能力」和「償債能力」，以保障其資金安全。\n故選 D。",exEn:"1. **External users** are individuals outside the daily operations (eliminates A).\n2. **Lenders** are key external users highly concerned about liquidity and solvency to protect their funds.\nThus, D is correct."},{q:21,year:2014,y:2014,top:"基礎管理 —— 管理功能（目標管理 MBO 的評估）",topEn:"Basics of Management —— Management Functions (Evaluation of Management by Objectives)",outc:true,reason:"自 2025 年起，目標管理（MBO）已從必修部分考綱中完全刪除。",reasonEn:"Starting from 2025, Management by Objectives (MBO) is completely removed from the Compulsory Part.",cn:"21. 目標管理(MBO)有下列哪些優點？\n(1) 減少文書工作\n(2) 能更有效監控下屬的工作進度\n(3) 有助加強不同職級之間的協調\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"21. Which of the following are the advantages of Management by Objectives (MBO)?\n(1) reduce paperwork\n(2) more effectively monitor the progress of subordinates\n(3) help enhance coordination between different levels\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"90%",exCn:"1. **(1) 錯誤**：實行 MBO 需要頻繁開會、撰寫目標報告，會**增加**文書工作。\n2. **(2) 正確**：MBO 強調制定明確量化目標，便於監控工作進度。\n3. **(3) 正確**：主管與員工共同協調設定目標，有助加強團隊協調配合。\n故只有 (2) 及 (3) 正確，選 C。",exEn:"1. **(1) is incorrect**: Implementing MBO requires frequent meetings and reports, increasing paperwork.\n2. **(2) is correct**: MBO emphasizes clear, measurable objectives for monitoring progress.\n3. **(3) is correct**: Joint goal-setting enhances collaboration across different levels.\nTherefore, only (2) and (3) are advantages, making C the correct answer."},{q:22,year:2014,y:2014,top:"中小型企業 —— 企業家與中小型企業的特徵",topEn:"Small and Medium Enterprises —— Entrepreneurship and Characteristics of Entrepreneurs",cn:"【背景資料】何力在一家資訊科技公司任職多年。他在去年辭職，轉而建立自己的商號，提供電腦維修服務。他的服務受到客戶高度讚賞，可是也有一些客戶批評何力經常使用專門術語，令他們難以理解。\n\n22. 何力展示了下列哪些企業家的特點？\n(1) 尋找新機會 (2) 渴望獨立自主 (3) 接受創新意念\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"【Background】Ho Lik has been working in an IT company for years. He resigned and set up his own firm providing computer repair services. His services were highly praised, but some clients criticized him for using technical jargons.\n\n22. Which of the following characteristics of entrepreneurs did Ho Lik demonstrate?\n(1) searching for new opportunities (2) desire for independence (3) accepting innovative ideas\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"75%",exCn:"* **(1) 符合**：何力建立自己的商號，代表他主動尋找市場新機會。\n* **(2) 符合**：辭去公司工作自行創業，體現了渴望獨立自主。\n* **(3) 未能體現**：電腦維修服務屬於傳統技能，題幹無指出何力引入了創新意念。\n故符合 (1) 和 (2)，選 A。",exEn:"* **(1) is demonstrated**: Setting up his own firm shows he searched for new market opportunities.\n* **(2) is demonstrated**: Resigning to start his own business shows desire for independence.\n* **(3) is NOT demonstrated**: Conventional computer repair services do not demonstrate innovative ideas.\nTherefore, only (1) and (2) are demonstrated, making A the correct answer."},{q:23,year:2014,y:2014,top:"基礎管理 —— 有效溝通的原則",topEn:"Basics of Management —— Principles of Effective Communication",outc:true,reason:"自 2025 年起，整個「有效溝通」相關課題已被完全移出必修部分大綱。",reasonEn:"Starting from 2025, topics related to 'Effective Communication' are completely removed from the Compulsory Part.",cn:"23. 根據客戶對何力的批評（經常使用專門術語，令他們難以理解），何力違反了有效溝通的_______原則。\nA. 清晰\nB. 完整\nC. 具體\nD. 簡潔",en:"23. Based on the customers' criticism of Ho Lik (using technical jargons frequently which made it difficult for them to understand), Ho Lik violated the _______ principle of effective communication.\nA. clarity\nB. completeness\nC. specificity\nD. conciseness",ans:"A",rate:"75%",exCn:"1. 有效溝通的「清晰」原則要求發送者必須使用容易被接收者理解的語言。\n2. 何力使用深奧的專門術語，導致客戶難以理解，違反了**「清晰」**原則。\n故選 A。",exEn:"1. The principle of **clarity** requires the sender to use language that can be easily understood by the receiver.\n2. Ho Lik's use of technical jargons made it difficult for clients to comprehend, violating the principle of **clarity**.\nThus, A is correct."},{q:24,year:2014,y:2014,top:"主要商業功能 —— 資訊管理功能（優質商業資訊的特徵與應用）",topEn:"Basics of Management —— Major Business Functions (Characteristics and use of quality business information)",cn:"24. 下列哪項是使用優質商業資訊來作決策的例子？\nA. 按某銀行出納員的意見購買股票\nB. 按某財經報章在上星期刊登的建議購買外幣\nC. 在互聯網上閱讀用家評論後購買手提電話\nD. 在航空公司的網頁閱讀相關的條款及細則後訂購機票",en:"24. Which of the following is an example of using high-quality business information to make decisions?\nA. buy shares based on the advice of a bank teller\nB. buy foreign currency based on the recommendation published in a financial newspaper last week\nC. buy a mobile phone after reading user reviews on the Internet\nD. book air tickets after reading the relevant terms and conditions on the airline's website",ans:"D",rate:"72%",exCn:"優質商業資訊須具備適時、準確、相關、完整及可靠來源。\n* **A 錯誤**：銀行櫃員並非專業投資顧問，可靠性不足。\n* **B 錯誤**：上週的報紙建議已喪失適時性。\n* **C 錯誤**：網上匿名評論可靠性不足。\n* **D 正確**：航空公司官方網站的條款是最準確、完整且可靠的資訊。\n故選 D。",exEn:"High-quality business information must be timely, accurate, relevant, complete, and from a reliable source.\n* **A is incorrect**: A bank teller is not a licensed financial advisor.\n* **B is incorrect**: A recommendation published last week lacks timeliness.\n* **C is incorrect**: Anonymous user reviews may be unreliable.\n* **D is correct**: Official airline website terms are accurate, complete, and highly reliable.\nThus, D is correct."},{q:25,year:2014,y:2014,top:"主要商業功能 —— 市場營銷部之職掌與市場研究",topEn:"Basics of Management —— Major Business Functions (Functions of marketing department)",cn:"25. 進行問卷調查以了解客戶需要屬於_______的範疇。\nA. 營運管理\nB. 市場營銷管理\nC. 資訊管理\nD. 風險管理",en:"25. Conducting questionnaire surveys to understand customers' needs is a part of _______.\nA. operations management\nB. marketing management\nC. information management\nD. risk management",ans:"B",rate:"73%",exCn:"1. 市場營銷管理的核心職能是識別、預測並採取營銷策略來有效滿足顧客需求。\n2. 「發放並回收問卷調查」是進行**市場研究**的最經典方法，直接屬於市場營銷管理範疇。\n故選 B。",exEn:"1. The core mandate of marketing management is to identify, anticipate, and satisfy customer requirements.\n2. Conducting questionnaire surveys is a standard method in **market research**, directly falling under marketing management.\nThus, B is correct."},{q:26,year:2014,y:2014,top:"不同企業擁有權類型的財務報告編製 —— 財務狀況表（流動資產的分類定義）",topEn:"SFP and Income Statement —— Statement of Financial Position (Definition and classification of current assets)",outc:true,reason:"自 2025 年起，財務狀況表中資產與負債科目的性質歸類已全數歸入選修部分會計單元（Paper 2A）。",reasonEn:"Starting from 2025, classification of assets and liabilities on the Statement of Financial Position are moved to Elective Module Paper 2A.",cn:"26. 如果某資產_______，這會在財務狀況表上歸類為流動資產。\nA. 在12個月前已經賒帳購買\nB. 在過去12個月內以現金購買\nC. 將會在12個月內出售\nD. 將會使用超過12個月",en:"26. If an asset _______, it will be classified as a current asset in the statement of financial position.\nA. was purchased on credit 12 months ago\nB. was purchased in cash in the past 12 months\nC. will be sold within 12 months\nD. will be used for more than 12 months",ans:"C",rate:"60%",exCn:"1. **流動資產**是指預期在12個月內被變賣、變現、消耗或耗用的資產，故選 C。\n2. 賒購或現購的時間不決定分類；使用超過12個月應分類為非流動資產。",exEn:"1. **Current assets** are expected to be converted to cash, sold, or consumed within 12 months. Thus, C is correct.\n2. The timing of purchase does not determine classification; assets used for more than 12 months are non-current."},{q:27,year:2014,y:2014,top:"基礎個人理財 —— 策劃個人理財及投資（金融產品的風險與回報關係）",topEn:"Basics of Personal Financial Management —— Personal Financial Planning & Investment (Risk-return profiles of financial products)",cn:"27. 下列哪項金融產品的投資風險是最高？\nA. 儲蓄存款\nB. 定期存款\nC. 優先股\nD. 普通股",en:"27. Which of the following financial products carries the highest investment risk?\nA. savings deposits\nB. term deposits\nC. preferred shares\nD. ordinary shares",ans:"D",rate:"78%",exCn:"根據風險與回報成正比的特質：\n* **A 及 B**：儲蓄存款及定期存款由銀行提供本金保證，風險最低。\n* **C. 優先股**：享有優先獲發固定股息的權利，風險中等。\n* **D. 普通股**：股息不固定，股價波動大，清盤時索償順序排最後，風險最高。\n故選 D。",exEn:"Based on risk-return profiles:\n* **A and B**: Savings/term deposits have the lowest risk with guaranteed principal.\n* **C (Preferred shares)**: Carry moderate risk with priority in dividends.\n* **D (Ordinary shares)**: Carry the highest risk with non-guaranteed dividends and high price volatility.\nThus, D is correct."},{q:28,year:2014,y:2014,top:"基礎個人理財 —— 消費者信貸（個人信貸記錄的重要性）",topEn:"Basics of Personal Financial Management —— Consumer Credit (Importance of maintaining a good personal credit record)",cn:"28. 維持良好個人信貸記錄是重要的，因為這會______\n(1) 減低貸款成本\n(2) 增加獲批貸款的機會\n(3) 提高銀行七成按揭貸款的上限\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"28. Maintaining a good personal credit record is important because it will ______\n(1) lower the cost of loans\n(2) increase the chance of getting loans\n(3) increase the upper limit of 70% on mortgage loans from banks\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"52%",exCn:"1. **(1)及(2) 正確**：良好信貸評級能降低壞帳風險，銀行願意提供更低利息（(1)）並增加批核機會（(2)）。\n2. **(3) 錯誤**：香港住宅物業的「七成按揭成數上限」是金管局制定的法定宏觀審慎監管指引，不會因個人信貸評級優異而提高。\n故只有 (1) 及 (2) 正確，選 A。",exEn:"1. **(1) and (2) are correct**: A good credit record indicates low default risk, leading to lower interest rates and higher approval chances.\n2. **(3) is incorrect**: The 70% maximum LTV ratio is a statutory macroeconomic prudential measure imposed by the HKMA and cannot be increased.\nTherefore, only (1) and (2) are correct, making A the correct answer."},{q:29,year:2014,y:2014,top:"複式記帳法 —— 東主代付電費交易之會計分錄",topEn:"Double-entry Bookkeeping —— Bookkeeping Entries for Personal Expenses paid on behalf of Business",outc:true,reason:"自 2025 年起，複式記帳原則、會計等式及各類商業交易的借貸分錄已全數被移往選修部分會計單元（Paper 2A）。",reasonEn:"Starting from 2025, double-entry bookkeeping rules and debit/credit ledger entries are moved to Elective Module Paper 2A.",cn:"29. 李小姐以個人支票支付企業的電費。以下哪項是企業正確的複式記帳？\n借記 / 貸記\nA. 提用 / 銀行存款\nB. 提用 / 資本\nC. 電費 / 銀行存款\nD. 電費 / 資本",en:"29. Miss Lee drew a personal cheque to pay an electricity bill for her business. Which of the following double entries for the business is correct?\nDebit / Credit\nA. drawings / cash at bank\nB. drawings / capital\nC. electricity expenses / cash at bank\nD. electricity expenses / capital",ans:"D",rate:"68%",exCn:"1. **借記**：款項用於支付企業「電費」，費用增加記入借方 → **借記：電費**。\n2. **貸記**：電費由東主以「個人支票」代付，等同東主注入資本，資本增加記入貸方 → **貸記：資本**。\n正確分錄為：借記電費；貸記資本，選 D。",exEn:"1. **Debit**: Payment was for electricity, an increase in expenses → **Debit: Electricity expenses**.\n2. **Credit**: Payment made by owner's personal cheque is equivalent to introducing capital → **Credit: Capital**.\nThe correct double entry is: Debit: Electricity expenses; Credit: Capital. Thus, D is correct."},{q:30,year:2014,y:2014,top:"營商環境 —— 國際貿易合作組織（亞太區經濟合作組織 APEC 的特徵）",topEn:"Business Environment —— Major International Trade Organisations (Characteristics of APEC)",cn:"30. 下列哪項有關亞太區經濟合作組織的陳述是正確的？\nA. 它為亞太地區的發展中國家提供貸款。\nB. 它支持亞太地區的可持續經濟增長。\nC. 它調解亞太地區國家之間的貿易紛爭。\nD. 它為亞太地區生產的貨品簽發產地來源證。",en:"30. Which of the following statements about Asia-Pacific Economic Cooperation is correct?\nA. It provides loans to developing countries in the Asia-Pacific region.\nB. It supports sustainable economic growth in the Asia-Pacific region.\nC. It settles trade disputes among Asia-Pacific countries.\nD. It issues certificates of origin for goods produced in the Asia-Pacific region.",ans:"B",rate:"54%",exCn:"APEC 是一個推動亞太地區貿易和投資自由化、支持區域內可持續經濟增長的非約束性官方經濟論壇，故 B 正確。\n* **A 錯誤**：提供貸款是世界銀行或亞洲開發銀行的職掌。\n* **C 錯誤**：調解貿易紛爭是 WTO 的功能。\n* **D 錯誤**：簽發產地來源證由各國當地的貿易署或海關負責。",exEn:"APEC is a regional economic forum established to promote trade and investment liberalization and support sustainable economic growth. Thus, B is correct.\n* **A is incorrect**: Providing loans is the responsibility of the World Bank or ADB.\n* **C is incorrect**: Settling trade disputes is a function of the WTO.\n* **D is incorrect**: Certificates of origin are issued by local trade authorities, not APEC."},{q:1,year:2015,y:2015,top:"合夥 —— 有限合夥人的特徵",topEn:"Partnership —— Characteristics of Limited Partners",cn:"1. 有限合夥人______________。\nA. 是名義合夥人\nB. 不需要為合夥的債務承擔責任\nC. 不需要為合夥投資金錢\nD. 不會參與合夥的管理",en:"1. 有限合夥人______________。\nA. 是名義合夥人\nB. 不需要為合夥的債務承擔責任\nC. 不需要為合夥投資金錢\nD. 不會參與合夥的管理",ans:"D",rate:"37%",exCn:"根據補充資料，有限合夥人不得參與合夥管理，否則會失去有限責任地位。名義合夥人僅借出名字，並無出資或所有權。有限合夥人須承擔以其出資額為限的有限責任。",exEn:"According to Supplementary Notes, a limited partner must not take part in the management of the partnership, otherwise they lose their limited liability status and are treated as a general partner. A limited partner has limited liability up to the amount of their capital contribution and must contribute capital to the partnership."},{q:2,year:2015,y:2015,top:"企業的持份者 —— 持份者的定義與特徵",topEn:"Stakeholders —— Definition and Characteristics of Stakeholders",cn:"2. 下列哪項關於公司持分者的陳述是正確的？\nA. 競爭者不是公司的持分者。\nB. 公司的持分者會受公司決策所影響。\nC. 公司清盤時，所有持分者都可以獲分配公司的資產。\nD. 公司客戶只在清償其結欠後才會成為公司的持分者。",en:"2. 下列哪項關於公司持分者的陳述是正確的？\nA. 競爭者不是公司的持分者。\nB. 公司的持分者會受公司決策所影響。\nC. 公司清盤時，所有持分者都可以獲分配公司的資產。\nD. 公司客戶只在清償其結欠後才會成為公司的持分者。",ans:"B",rate:"80%",exCn:"持份者是任何能影響或受企業決策、營運及目標影響的個人或群體。競爭者是外部持份者，因受公司定價及市場份額決策影響。清盤時資產按法律順序分配予債權人及股東，並非所有持份者均可獲分配。客戶因購買產品/服務而成為持份者，與結欠無關。",exEn:"A stakeholder is any individual or group that can affect or be affected by the decisions, operations, and objectives of the business. Competitors are external stakeholders because they are affected by the company's pricing, marketing, and market share decisions. Upon liquidation, assets are distributed to creditors and shareholders in a strict legal order. Customers are stakeholders because they buy the company's products/services, regardless of outstanding credit balances."},{q:3,year:2015,y:2015,top:"領導 —— 領導風格（自由放任）",topEn:"Leading —— Leadership Styles (Laissez-faire)",cn:"3. 蘇珊是一家成衣商號的時裝設計組組長。她只提出概括的方向，讓計設師按自\n己的方法來完成指派的工作。\n蘇珊採用______________式的領導風格。\nA. 獨裁\nB. 中央集權\nC. 自由放任\nD. 參與",en:"3. 蘇珊是一家成衣商號的時裝設計組組長。她只提出概括的方向，讓設計師按自\n己的方法來完成指派的工作。\n蘇珊採用______________式的領導風格。\nA. 獨裁\nB. 中央集權\nC. 自由放任\nD. 參與",ans:"C",rate:"78%",exCn:"自由放任式領導風格下，領導者僅提供概括方向或極少指導，讓下屬完全自由地以自己的方法完成工作。這適用於創意部門的專業人員。獨裁式及中央集權式涉及高管理控制。參與式則涉及經理與下屬共同決策。",exEn:"Under a laissez-faire leadership style, the leader provides minimal direction or only broad guidelines, allowing subordinates complete freedom to make decisions and complete their work using their own methods. This is highly suitable for professional staff in creative departments. Autocratic and centralized styles involve high manager control with little employee input. Participative style involves joint decision-making rather than letting subordinates work completely on their own."},{q:4,year:2015,y:2015,top:"[out c] 購貨簿及相關的分類帳",topEn:"[out c] Purchases Journal",outc:true,reason:"購貨簿及分類帳屬於基本簿記，已從卷一必修部分移至選修會計單元（Paper 2A）。",reasonEn:"The Purchases Journal and related ledgers are basic bookkeeping topics that have been moved from Paper 1 Compulsory Part to the Elective Part (Accounting Module Topic 2a).",cn:"4. 2014 年 10 月，某商號有以下購貨及退貨：\n10 月 2 日 從余先生賒購貨品 $2500\n9 日 現購貨品 $2000\n17 日 退回貨品 $300 予余先生\n26 日 從呂小姐賒購貨品 $3200，如在 30 天內付款可享 10%現金折扣\n根據上述資料，2014 年 10 月在購貨簿內記錄的購貨總額應是多少？\nA. $5380\nB. $5700\nC. $7400\nD. $7700",en:"4. 2014 年 10 月，某商號有以下購貨及退貨：\n10 月 2 日 從余先生賒購貨品 $2500\n9 日 現購貨品 $2000\n17 日 退回貨品 $300 予余先生\n26 日 從呂小姐賒購貨品 $3200，如在 30 天內付款可享 10%現金折扣\n根據上述資料，2014 年 10 月在購貨簿內記錄的購貨總額應是多少？\nA. $5380\nB. $5700\nC. $7400\nD. $7700",ans:"B",rate:"28%",exCn:"購貨簿僅記錄賒購貨品。10月2日賒購$2500及10月26日賒購$3200應記入購貨簿。現購$2000記入現金簿，退回$300記入退貨簿。購貨總額=$2500+$3200=$5700。現金折扣不影響初始發票記錄。",exEn:"The Purchases Journal is used only to record credit purchases of goods for resale. 10 Oct 2: Credit purchase $2,500 recorded in Purchases Journal. 10 Oct 9: Cash purchase $2,000 recorded in Cash Book, not Purchases Journal. 10 Oct 17: Returns $300 recorded in Returns Outwards Journal, not Purchases Journal. 10 Oct 26: Credit purchase $3,200 recorded in Purchases Journal. Total = $2,500 + $3,200 = $5,700."},{q:5,year:2015,y:2015,top:"金錢的時間值的概念 / 常見金融產品 —— 債券與資本市場",topEn:"Time Value of Money / Financial Products —— Bonds and Capital Markets",cn:"5. 2011 年，香港特區政府發行一項三年期通脹掛鉤債劵(iBond)，這是一種  (I)  \n市場工具，在    (II)    市場發行。\n(I) (II)\nA. 貨幣 一手\nB. 貨幣 二手\nC. 資本 一手\nD. 資本 二手",en:"5. 2011 年，香港特區政府發行一項三年期通脹掛鉤債劵(iBond)，這是一種  (I)  \n市場工具，在    (II)    市場發行。\n(I) (II)\nA. 貨幣 一手\nB. 貨幣 二手\nC. 資本 一手\nD. 資本 二手",ans:"C",rate:"46%",exCn:"期限超過一年的金融工具（如三年期iBond）屬於資本市場工具，貨幣市場工具期限為一年或以下。新發行的證券（如政府首次向投資者發行iBond）在一手市場發行。投資者之間的後續買賣在二手市場進行。",exEn:"Financial instruments with a maturity period of more than one year (here, a 3-year iBond) are classified as Capital Market instruments. Money market instruments have a maturity of 1 year or less. Newly issued securities are sold in the Primary Market. Subsequent trading among investors takes place in the Secondary Market."},{q:6,year:2015,y:2015,top:"管理的重要性 —— 管理的重要顯示",topEn:"Importance of Management —— Signs of Management Importance",cn:"6. 下列哪些顯示管理的重要？\n(1) 促使企業有效率地運用資源\n(2) 協助員工有效達到企業目標\n(3) 避免企業受外在因素影響\nA. 只有(1) 及 (2)\nB. 只有(1) 及 (3)\nC. 只有(2) 及 (3)\nD. (1)、(2) 及 (3)",en:"6. 下列哪些顯示管理的重要？\n(1) 促使企業有效率地運用資源\n(2) 協助員工有效達到企業目標\n(3) 避免企業受外在因素影響\nA. 只有(1) 及 (2)\nB. 只有(1) 及 (3)\nC. 只有(2) 及 (3)\nD. (1)、(2) 及 (3)",ans:"A",rate:"62%",exCn:"(1)正確：良好管理確保資源被有效利用，減少浪費。(2)正確：管理人員指導及激勵員工朝組織目標努力。(3)錯誤：企業無法避免受外在環境因素（如經濟衰退、科技變革）影響，管理只能預見、適應及回應。",exEn:"(1) is correct: Good management ensures resources are utilized efficiently, minimizing waste. (2) is correct: Managers guide and motivate employees to direct their efforts towards achieving organizational goals. (3) is incorrect: A business cannot avoid being affected by external environmental factors. Management can only anticipate, adapt, and respond to these factors."},{q:7,year:2015,y:2015,top:"[out c] 試算表的功能",topEn:"[out c] Trial Balance Functions",outc:true,reason:"試算表的功能、限制及編製已從卷一移至選修會計單元（Paper 2A）。",reasonEn:"Trial balance functions, limitations, and preparation have been moved from Paper 1 to the Elective Part (Accounting Module Topic 2a).",cn:"7. 編製試算表的主要目的是什麼？\n(1) 記錄企業的日常交易\n(2) 反映企業的財務表現\n(3) 檢視簿記記帳的算術準確度\nA. 只有(1)\nB. 只有(3)\nC. 只有(1) 及 (2)\nD. 只有(2) 及 (3)",en:"7. 編製試算表的主要目的是什麼？\n(1) 記錄企業的日常交易\n(2) 反映企業的財務表現\n(3) 檢視簿記記帳的算術準確度\nA. 只有(1)\nB. 只有(3)\nC. 只有(1) 及 (2)\nD. 只有(2) 及 (3)",ans:"B",rate:"63%",exCn:"(3)正確：試算表的主要目的是檢查複式記帳系統的算術準確性，確保借方總額等於貸方總額。(1)錯誤：日常交易記錄在原始分錄帳簿及分類帳中。(2)錯誤：財務表現反映在損益表中，而非試算表。",exEn:"(3) is correct: The fundamental purpose of preparing a trial balance is to check the arithmetical accuracy of the double-entry bookkeeping system by ensuring that total debits equal total credits. (1) is incorrect: Daily transactions are recorded in the Books of Original Entry and Ledgers. (2) is incorrect: Financial performance is reflected in the Income Statement."},{q:8,year:2015,y:2015,top:"消費者信貸 —— 信貸安排的選擇",topEn:"Consumer Credit —— Choosing Credit Arrangements",cn:"8. 張先生計劃購買一項住宅物業。下列哪項信貸安排對他最適合？\nA. 信用卡\nB. 私人貸款\nC. 按揭貸款\nD. 銀行透支",en:"8. 張先生計劃購買一項住宅物業。下列哪項信貸安排對他最適合？\nA. 信用卡\nB. 私人貸款\nC. 按揭貸款\nD. 銀行透支",ans:"C",rate:"85%",exCn:"購買住宅物業所需金額龐大，還款期長達數十年。按揭貸款是專為購買物業而設計的擔保長期信貸工具，以物業作抵押，利率較低。信用卡、私人貸款及銀行透支為無擔保短期/中期信貸，額度小且利率高，不適合購買房產。",exEn:"To purchase a residential property, the amount required is very large and the repayment period spans decades. A mortgage loan is a secured long-term credit facility specifically designed for property purchases, backed by the property as collateral, with a much lower interest rate. Credit cards, personal loans, and bank overdrafts are unsecured, short-to-medium term credit instruments with much smaller limits and significantly higher interest rates."},{q:9,year:2015,y:2015,top:"資訊管理 —— 資訊的質素",topEn:"Information Management —— Quality of Information",cn:"9. 傳送即時股票數據的流動電話應用程式，可以在哪方面提升資訊的質素？\n(1) 準確\n(2) 適時\n(3) 易於理解\nA. 只有(1) 及 (2)\nB. 只有(2)\nC. 只有(1) 及 (3)\nD. (1)、(2) 及 (3)",en:"9. 傳送即時股票數據的流動電話應用程式，可以在哪方面提升資訊的質素？\n(1) 準確\n(2) 適時\n(3) 易於理解\nA. 只有(1) 及 (2)\nB. 只有(2)\nC. 只有(1) 及 (3)\nD. (1)、(2) 及 (3)",ans:"B",rate:"49%",exCn:"(2)正確：「即時」股票數據意味資訊在市場交易發生時立即傳送，直接提升資訊的適時性。(1)錯誤：透過手機應用程式提供數據並不能改善其核心數學準確性。(3)錯誤：即時原始股票數據往往密集複雜，並不會使底層財務數字更易理解。",exEn:"(2) is correct: Real-time stock data means information is delivered immediately as market transactions occur, directly enhancing the timeliness of the information. (1) is incorrect: Providing data real-time via a mobile app does not inherently improve its mathematical accuracy. (3) is incorrect: Real-time raw stock data feeds are often dense and complex, not making the underlying financial figures easier to understand."},{q:10,year:2015,y:2015,top:"[out c] 帳戶餘額的分類 —— 實帳戶與虛帳戶",topEn:"[out c] Account Classification —— Real vs. Nominal Accounts",outc:true,reason:"分類帳帳戶（實帳戶、虛帳戶、個人帳戶）的分類已從卷一移至選修會計單元（Paper 2A）。",reasonEn:"Classification of ledger accounts (Real vs. Nominal vs. Personal accounts) has been moved from Paper 1 to the Elective Part (Accounting Module Topic 2a).",cn:"10. 下列哪項不是虛帳戶？\nA. 薪金帳\nB. 購貨帳\nC. 銷貨退回帳\nD. 銀行存款帳",en:"10. 下列哪項不是虛帳戶？\nA. 薪金帳\nB. 購貨帳\nC. 銷貨退回帳\nD. 銀行存款帳",ans:"D",rate:"64%",exCn:"實帳戶代表資產、資本及負債，結餘帶入下一期。銀行存款帳是資產，屬於實帳戶。虛帳戶代表收益、費用、購貨及銷貨，期末結餘轉入損益表。薪金、購貨及銷貨退回帳均為虛帳戶。",exEn:"Real accounts represent assets, capital, and liabilities that carry their balances forward to the next accounting period. Bank account is an asset, hence it is a real account. Nominal accounts represent revenues, expenses, purchases, and sales, whose balances are closed off to the Profit and Loss account at the end of each period. Salaries, Purchases, and Returns Inwards are all nominal accounts."},{q:11,year:2015,y:2015,top:"中小企業 —— 香港中小企的特徵",topEn:"SMEs —— Characteristics of Hong Kong SMEs",cn:"11. 下列哪項是香港中小型企業(中小企)的特徵？\n(1) 它們迅速回應市場轉變。\n(2) 它們擁有高架式組織結構。\n(3) 它們的稅率有別於大企業。\nA. 只有(1)\nB. 只有(2)\nC. 只有(1) 及 (2)\nD. 只有(2) 及 (3)",en:"11. 下列哪項是香港中小型企業(中小企)的特徵？\n(1) 它們迅速回應市場轉變。\n(2) 它們擁有高架式組織結構。\n(3) 它們的稅率有別於大企業。\nA. 只有(1)\nB. 只有(2)\nC. 只有(1) 及 (2)\nD. 只有(2) 及 (3)",ans:"A",rate:"84%",exCn:"(1)正確：中小企通常擁有扁平簡單的組織結構，管理層次少，決策迅速，能快速回應市場變化。(2)錯誤：中小企並無高架式組織結構，那是大型企業的特徵。(3)錯誤：根據香港稅法，利得稅率對中小企和大型企業均相同。",exEn:"(1) is correct: SMEs typically have a flat, simple organizational structure with fewer administrative layers, allowing for very rapid decision-making and high responsiveness to market changes. (2) is incorrect: SMEs do not have a tall-type structure, which is characteristic of large corporations. (3) is incorrect: Under Hong Kong's tax laws, the profits tax rate was flat and identical for both SMEs and large companies."},{q:12,year:2015,y:2015,top:"證券交易 / 香港金融機構 —— 外匯基金管理",topEn:"Stock Trading / Financial Institutions in HK —— Exchange Fund Management",cn:"12. 下列哪個組織負責管理香港外匯基金？\nA. 強制性公積金計劃管理局\nB. 香港交易及結算所有限公司\nC. 證劵及期貨事務監察委員會\nD. 香港金融管理局",en:"12. 下列哪個組織負責管理香港外匯基金？\nA. 強制性公積金計劃管理局\nB. 香港交易及結算所有限公司\nC. 證劵及期貨事務監察委員會\nD. 香港金融管理局",ans:"D",rate:"61%",exCn:"香港金融管理局（HKMA）是香港的事實中央銀行，負責管理及投資香港外匯基金以維持貨幣及銀行穩定。強積金計劃管理局監管強積金退休計劃。港交所營運股票及衍生工具市場。證監會監管證券及期貨市場。",exEn:"The Hong Kong Monetary Authority (HKMA) is Hong Kong's de facto central bank and is legally responsible for managing and investing the Exchange Fund of Hong Kong to maintain monetary and banking stability. MPFA regulates the MPF retirement schemes. HKEX operates the stock and derivatives marketplace. SFC regulates the securities and futures markets."},{q:13,year:2015,y:2015,top:"財務管理 —— 公司財務部門的工作",topEn:"Financial Management —— Functions of Finance Department",cn:"13. 下列哪些是公司財務部門的工作？\n(1) 為公司作投資決定\n(2) 制定公司收帳政策\n(3) 設立員工報酬制度\nA. 只有(1) 及 (2)\nB. 只有(1) 及 (3)\nC. 只有(2) 及 (3)\nD. (1)、(2) 及 (3)",en:"13. 下列哪些是公司財務部門的工作？\n(1) 為公司作投資決定\n(2) 制定公司收帳政策\n(3) 設立員工報酬制度\nA. 只有(1) 及 (2)\nB. 只有(1) 及 (3)\nC. 只有(2) 及 (3)\nD. (1)、(2) 及 (3)",ans:"A",rate:"59%",exCn:"(1)正確：財務部門負責資本預算及重大投資決策。(2)正確：財務部門管理營運資金，包括制定信用標準及應收帳款收帳政策。(3)錯誤：設計及設立員工薪酬制度是人力資源部門的核心職責。",exEn:"(1) is correct: The finance department is responsible for capital budgeting and making major investment decisions. (2) is correct: It manages working capital, which includes setting credit standards and formulating debt collection policies. (3) is incorrect: Designing and setting up the employee compensation system is a core responsibility of the Human Resources Department."},{q:14,year:2015,y:2015,top:"[out c] 商業交易對會計等式的影響",topEn:"[out c] Impact of Transactions on Accounting Equation",outc:true,reason:"會計等式及交易分析已從卷一移至選修會計單元（Paper 2A）。",reasonEn:"Accounting equation and transaction analysis have been moved from Paper 1 to the Elective Part (Accounting Module Topic 2a).",cn:"14. 某商號賒銷貨品予一客戶。下列哪項是這交易對其財務狀況表的影響？\n      總流動資產       總流動負債\nA. 減少                 增加\nB. 減少                 減少\nC. 增加                 不變\nD. 不變                 不變",en:"14. 某商號賒銷貨品予一客戶。下列哪項是這交易對其財務狀況表的影響？\n      總流動資產       總流動負債\nA. 減少                 增加\nB. 減少                 減少\nC. 增加                 不變\nD. 不變                 不變",ans:"C",rate:"54%",exCn:"賒銷貨品時：應收帳款（流動資產）按售價增加，存貨（流動資產）按銷貨成本減少。由於售價通常高於成本（產生利潤），應收帳款增加額大於存貨減少額，導致總流動資產淨增加。流動負債不受影響。",exEn:"When goods are sold on credit: Trade Receivables (Current Asset) increases by the selling price. Inventory (Current Asset) decreases by the cost of goods sold. In a standard trading transaction, the selling price exceeds the cost, so the increase in Trade Receivables is larger than the decrease in Inventory, leading to a net increase in Total Current Assets. Current Liabilities are unaffected."},{q:15,year:2015,y:2015,top:"[out c] 財務報表的用途、使用者和限制",topEn:"[out c] Users of Financial Statements",outc:true,reason:"財務報表的使用者及資訊需要已從卷一移至選修會計單元（Paper 2A）。",reasonEn:"Users of financial statements and their information needs have been moved from Paper 1 to the Elective Part (Accounting Module Topic 2a).",cn:"15. 投資者會用財務報表提供的會計資訊來評估___________。\n(1) 企業是否值得投資\n(2) 企業的組織結構是否恰當\n(3) 企業是否具足夠資本推行其計劃\nA. 只有(1) 及 (2)\nB. 只有(1) 及 (3)\nC. 只有(2) 及 (3)\nD. (1)、(2) 及 (3)",en:"15. 投資者會用財務報表提供的會計資訊來評估___________。\n(1) 企業是否值得投資\n(2) 企業的組織結構是否恰當\n(3) 企業是否具足夠資本推行其計劃\nA. 只有(1) 及 (2)\nB. 只有(1) 及 (3)\nC. 只有(2) 及 (3)\nD. (1)、(2) 及 (3)",ans:"B",rate:"85%",exCn:"(1)正確：股東及潛在投資者查閱盈利比率以決定是否值得投資。(3)正確：投資者查看償債能力及流動資產以評估企業是否有足夠資本推行擴展計劃。(2)錯誤：財務報表包含財務量化數據，不提供有關組織架構是否恰當的質性資訊。",exEn:"(1) is correct: Shareholders and potential investors check profitability and return ratios to decide if the firm offers a good investment. (3) is correct: Investors look at solvency, gearing, and liquid assets to assess if the firm has enough capital to fund expansion projects. (2) is incorrect: Financial statements contain financial, quantitative values and do not provide qualitative info regarding organizational structure."}];</script>
<script>Q=Q.concat([{q:16,year:2015,y:2015,top:"香港經濟的特徵 —— 香港經濟特色",topEn:"Hong Kong Economy Characteristics —— HK Economic Features",cn:"16. 下列哪些是香港經濟的特徵？\n(1) 簡單稅制\n(2) 倚賴對外貿易\n(3) 集中於第二級產業\nA. 只有(1) 及 (2)\nB. 只有(1) 及 (3)\nC. 只有(2) 及 (3)\nD. (1)、(2) 及 (3)",en:"16. 下列哪些是香港經濟的特徵？\n(1) 簡單稅制\n(2) 倚賴對外貿易\n(3) 集中於第二級產業\nA. 只有(1) 及 (2)\nB. 只有(1) 及 (3)\nC. 只有(2) 及 (3)\nD. (1)、(2) 及 (3)",ans:"A",rate:"92%",exCn:"(1)正確：香港以簡單低稅制著稱（無增值資本利得稅）。(2)正確：作為自由港及國際金融中心，香港高度倚賴對外貿易。(3)錯誤：香港經濟嚴重缺乏初級及第二級產業，高度集中於第三級服務業（佔GDP超過90%）。",exEn:"(1) is correct: Hong Kong is famous for its simple and low tax system (no VAT, no capital gains tax). (2) is correct: As a free port and international financial hub, Hong Kong has a very high dependence on external trade. (3) is incorrect: Hong Kong's economy has a severe lack of primary and secondary industries, heavily concentrated on tertiary service industries (over 90% of GDP)."},{q:17,year:2015,y:2015,top:"計算金錢的時間值 —— 複利未來值計算",topEn:"Time Value of Money —— Future Value Compounding Calculation",cn:"17. 2014 年 1 月 1 日，王先生為一儲蓄計劃存入$500 000，計劃的回報率為每年複\n式 5%。三年後，王先生從這計劃得到的總金額將會是_______(計算至整數元)。\nA. $431 919\nB. $525 000\nC. $551 250\nD. $578 813",en:"17. 2014 年 1 月 1 日，王先生為一儲蓄計劃存入$500 000，計劃的回報率為每年複\n式 5%。三年後，王先生從這計劃得到的總金額將會是_______(計算至整數元)。\nA. $431 919\nB. $525 000\nC. $551 250\nD. $578 813",ans:"D",rate:"95%",exCn:"FV = PV × (1+r)^n\nFV = $500,000 × (1.05)^3 = $500,000 × 1.157625 = $578,812.5\n四捨五入為 $578,813，選 D。",exEn:"FV = PV × (1+r)^n\nFV = $500,000 × (1.05)^3 = $500,000 × 1.157625 = $578,812.5\nRounded to $578,813, which corresponds to Option D."},{q:18,year:2015,y:2015,top:"[out c] 貿易公司的損益表 —— 現金折扣",topEn:"[out c] Income Statement —— Cash Discounts",outc:true,reason:"現金折扣的會計處理已從卷一移至選修會計單元（Paper 2A）。",reasonEn:"Accounting treatment of cash discounts has been moved from Paper 1 to the Elective Part (Accounting Module Topic 2a).",cn:"18. 下列哪些有關給予客戶現金折扣的描述是正確的？\n(1) 它們是費用。\n(2) 它們必須記錄在帳冊內。\n(3) 它們用來吸引客戶以現金購貨。\nA. 只有(1) 及 (2)\nB. 只有(1) 及 (3)\nC. 只有(2) 及 (3)\nD. (1)、(2) 及 (3)",en:"18. 下列哪些有關給予客戶現金折扣的描述是正確的？\n(1) 它們是費用。\n(2) 它們必須記錄在帳冊內。\n(3) 它們用來吸引客戶以現金購貨。\nA. 只有(1) 及 (2)\nB. 只有(1) 及 (3)\nC. 只有(2) 及 (3)\nD. (1)、(2) 及 (3)",ans:"A",rate:"54%",exCn:"(1)正確：現金折扣是為鼓勵賒帳客戶提前還款而產生的財務費用。(2)正確：現金折扣須記錄在帳冊內（借：折扣ALLOWED，貸：應收帳款）。(3)錯誤：現金折扣用於吸引賒帳客戶提前償還應收帳款，而非吸引客戶以現金購貨。貿易折扣才用於鼓勵現金購貨。",exEn:"(1) is correct: Cash discounts allowed are financial expenses incurred to encourage credit customers to settle their debts early. (2) is correct: Cash discounts are recorded as journal entries: Dr Discount Allowed / Cr Trade Receivables. (3) is incorrect: Cash discounts are used to attract credit customers to pay their outstanding debts early, not to attract immediate cash purchases. Trade discounts are used for that purpose."},{q:19,year:2015,y:2015,top:"資訊管理 / 商業通訊 —— 電子郵件的好處",topEn:"Information Management / Business Communication —— Email Benefits",cn:"19. 下列哪些是公司以電子郵件作內部通訊的好處？\n(1) 可以即時收到任何回應\n(2) 可以傳送文字和視聽信息\n(3) 可以同時傳送信息予多個收件人\nA. 只有(1) 及 (2)\nB. 只有(1) 及 (3)\nC. 只有(2) 及 (3)\nD. (1)、(2) 及 (3)",en:"19. 下列哪些是公司以電子郵件作內部通訊的好處？\n(1) 可以即時收到任何回應\n(2) 可以傳送文字和視聽信息\n(3) 可以同時傳送信息予多個收件人\nA. 只有(1) 及 (2)\nB. 只有(1) 及 (3)\nC. 只有(2) 及 (3)\nD. (1)、(2) 及 (3)",ans:"C",rate:"39%",exCn:"(2)正確：電郵允許附加各種媒體類型，包括文字文件、音頻及視頻。(3)正確：電郵有副本（Cc）及密件副本（Bcc）功能，可同時向多個收件人傳送。(1)錯誤：電郵是異步通訊渠道，不能保證即時收到回應，即時回應是電話或面對面會議的特徵。",exEn:"(2) is correct: Emails allow attachments of various media types, including text documents, audio clips, and video presentations. (3) is correct: Emails have carbon copy (Cc) and blind carbon copy (Bcc) functions, enabling a sender to broadcast a message to multiple recipients. (1) is incorrect: Email is an asynchronous communication channel with no guarantee of instant response."},{q:20,year:2015,y:2015,top:"強積金制度 —— 成員提取累算權益的條件",topEn:"MPF Scheme —— Conditions for Withdrawal of Accrued Benefits",cn:"20. 於下列哪些情況下，參加強制性公積金計劃的成員可從計劃提取累算權益？\n(1) 年屆 60 歲並提早退休\n(2) 失業超過 6 個月\n(3) 永久離開香港\nA. 只有(1) 及 (2)\nB. 只有(1) 及 (3)\nC. 只有(2) 及 (3)\nD. (1)、(2) 及 (3)",en:"20. 於下列哪些情況下，參加強制性公積金計劃的成員可從計劃提取累算權益？\n(1) 年屆 60 歲並提早退休\n(2) 失業超過 6 個月\n(3) 永久離開香港\nA. 只有(1) 及 (2)\nB. 只有(1) 及 (3)\nC. 只有(2) 及 (3)\nD. (1)、(2) 及 (3)",ans:"B",rate:"67%",exCn:"(1)正確：年屆60歲並宣告提早退休的成員可提取累算權益。(3)正確：永久離開香港的成員可作法定聲明提早提取權益（一生一次）。(2)錯誤：一般失業（即使超過6個月）不是提早提取MPF的有效理由。",exEn:"(1) is correct: A member who has reached 60 years of age and declared early retirement can withdraw their benefits. (3) is correct: A member who is permanently departing Hong Kong can make a statutory declaration to withdraw their benefits early. (2) is incorrect: General unemployment is not a valid ground for early withdrawal of MPF accrued benefits."},{q:21,year:2015,y:2015,top:"營運管理 —— 營運經理的工作職責",topEn:"Operations Management —— Responsibilities of Operations Manager",cn:"21. 公司的營運經理負責______________。\n(1) 指派工廠工人的工作。\n(2) 預測產品的需求。\n(3) 建立廠房的生產線。\nA. 只有(1)\nB. 只有(2)\nC. 只有(1) 及 (3)\nD. (1)、(2) 及 (3)",en:"21. 公司的營運經理負責______________。\n(1) 指派工廠工人的工作。\n(2) 預測產品的需求。\n(3) 建立廠房的生產線。\nA. 只有(1)\nB. 只有(2)\nC. 只有(1) 及 (3)\nD. (1)、(2) 及 (3)",ans:"C",rate:"39%",exCn:"(1)正確：監督及指派工廠工人的工作是核心營運職責。(3)正確：設計、規劃佈局及建立廠房生產線屬於營運範疇。(2)錯誤：預測未來消費者對產品的需求是市場營銷部門的核心工作。",exEn:"(1) is correct: Supervising and assigning tasks to factory floor workers is a core operational duty. (3) is correct: Designing, layout planning, and setting up the physical production line in a factory falls under operations. (2) is incorrect: Forecasting future consumer demand for products is a core task of the Marketing Department."},{q:22,year:2015,y:2015,top:"香港經濟的發展近況 —— 世界貿易組織的特徵",topEn:"HK Economic Development —— WTO Characteristics",cn:"22. 下列哪些有關世界貿易組織的陳述是正確的？\n(1) 世界貿易組織調解會員之間的貿易糾紛。\n(2) 世界貿易組織的決定對所有會員均具有約束性。\n(3) 世界貿易組織協助發展中國家建設基建以拓展貿易。\nA. 只有(1) 及 (2)\nB. 只有(1) 及 (3)\nC. 只有(2) 及 (3)\nD. (1)、(2) 及 (3)",en:"22. 下列哪些有關世界貿易組織的陳述是正確的？\n(1) 世界貿易組織調解會員之間的貿易糾紛。\n(2) 世界貿易組織的決定對所有會員均具有約束性。\n(3) 世界貿易組織協助發展中國家建設基建以拓展貿易。\nA. 只有(1) 及 (2)\nB. 只有(1) 及 (3)\nC. 只有(2) 及 (3)\nD. (1)、(2) 及 (3)",ans:"A",rate:"25%",exCn:"(1)正確：WTO的核心功能之一是作為爭端解決機構，解決會員國之間的貿易糾紛。(2)正確：WTO爭端解決機構作出裁決後，其決定對涉事會員國具有法律約束力。(3)錯誤：協助發展中國家建設基建是世界銀行的工作，而非WTO。",exEn:"(1) is correct: One of the core functions of the WTO is to serve as a dispute settlement body to resolve trade conflicts between member countries. (2) is correct: Once the WTO Dispute Settlement Body makes a ruling, its decisions are legally binding on the involved member nations. (3) is incorrect: Providing financial loans and helping developing nations build physical infrastructure is the job of the World Bank, not the WTO."},{q:23,year:2015,y:2015,top:"[out c] 擴展的會計等式 —— 資本計算",topEn:"[out c] Expanded Accounting Equation —— Capital Calculation",outc:true,reason:"資本帳戶計算及擴展會計等式已從卷一移至選修會計單元（Paper 2A）。",reasonEn:"Capital account calculations and the expanded accounting equation have been moved from Paper 1 to the Elective Part (Accounting Module Topic 2a).",cn:"23. 2014 年 1 月 1 日，馬莉成立一商號。她以自己的現金$300 000 存入商號的銀行\n戶口，並為商號注入她的貨車，成本為$80 000。此外，商號又從馬莉的朋友借\n入$40 000，用以購買貨物。截至 2014 年 12 月 31 日止年度，商號總收入和總\n支出分別為$120 000 和$45 000。\n2014 年 12 月 31 日馬莉的資本是多少？\nA. $305 000\nB. $335 000\nC. $455 000\nD. $485 000",en:"23. 2014 年 1 月 1 日，馬莉成立一商號。她以自己的現金$300 000 存入商號的銀行\n戶口，並為商號注入她的貨車，成本為$80 000。此外，商號又從馬莉的朋友借\n入$40 000，用以購買貨物。截至 2014 年 12 月 31 日止年度，商號總收入和總\n支出分別為$120 000 和$45 000。\n2014 年 12 月 31 日馬莉的資本是多少？\nA. $305 000\nB. $335 000\nC. $455 000\nD. $485 000",ans:"C",rate:"63%",exCn:"期初資本 = $300,000 + $80,000 = $380,000（借款$40,000為負債，非資本）。淨利潤 = $120,000 - $45,000 = $75,000。期末資本 = $380,000 + $75,000 = $455,000。",exEn:"Opening Capital = $300,000 + $80,000 = $380,000 (the loan of $40,000 is a liability, not capital). Net Profit = $120,000 - $45,000 = $75,000. Ending Capital = $380,000 + $75,000 = $455,000."},{q:24,year:2015,y:2015,top:"管理是甚麼 / 管理技能 —— 概念能力與專門技能",topEn:"Basics of Management / Management Skills —— Conceptual vs. Technical Skills",cn:"24. 大偉數年前加入一家製造公司出任工程司。稍後，他將晉升為總經理。在他升\n職後，    (I)    會對他的工作最為重要，而    (II)    則最不重要。\n(I) (II)\nA. 專門技能 人際技巧\nB. 人際技巧 概念能力\nC. 概念能力 人際技巧\nD. 概念能力 專門技能",en:"24. 大偉數年前加入一家製造公司出任工程司。稍後，他將晉升為總經理。在他升\n職後，    (I)    會對他的工作最為重要，而    (II)    則最不重要。\n(I) (II)\nA. 專門技能 人際技巧\nB. 人際技巧 概念能力\nC. 概念能力 人際技巧\nD. 概念能力 專門技能",ans:"D",rate:"77%",exCn:"作為總經理（高層管理人員），大偉負責策略規劃及從全局角度審視企業，因此概念能力最為重要。專門技能在他擔任前線工程師時最為重要，但晉升高層後變得最不重要。人際技巧在各管理層級均同樣重要。",exEn:"As General Manager (top-level manager), David is responsible for strategic planning and seeing the business as a whole, so Conceptual skills become the most important. Technical skills were highly important when he was a front-line engineer but become the least important as a top executive. Interpersonal skills remain equally important across all levels of management."},{q:25,year:2015,y:2015,top:"[out c] 複式記帳法 —— 借記與貸記",topEn:"[out c] Double Entry System —— Debits and Credits",outc:true,reason:"複式記帳法原則（借記/貸記）已從卷一移至選修會計單元（Paper 2A）。",reasonEn:"Principles of double-entry ledger bookkeeping (debits/credits) have been moved from Paper 1 to the Elective Part (Accounting Module Topic 2a).",cn:"25. 以下哪些複式記帳是正確的？\n       交易                                                借記帳戶            貸記帳戶\n(1) 以現金購置辦公室的文件櫃              購貨                 現金\n(2) 東主為商號注入現金                         現金                 資本\n(3) 債務人以支票償還債務                      銀行存款          應收帳款\nA. 只有(1) 及 (2)\nB. 只有(1) 及 (3)\nC. 只有(2) 及 (3)\nD. (1)、(2) 及 (3)",en:"25. 以下哪些複式記帳是正確的？\n       交易                                                借記帳戶            貸記帳戶\n(1) 以現金購置辦公室的文件櫃              購貨                 現金\n(2) 東主為商號注入現金                         現金                 資本\n(3) 債務人以支票償還債務                      銀行存款          應收帳款\nA. 只有(1) 及 (2)\nB. 只有(1) 及 (3)\nC. 只有(2) 及 (3)\nD. (1)、(2) 及 (3)",ans:"C",rate:"68%",exCn:"(1)錯誤：購置辦公室文件櫃是非流動資產（辦公設備）的取得，不是購貨。正確借記應為辦公設備。(2)正確：東主注入現金增加資產（現金）及資本，借記現金/貸記資本。(3)正確：收到債務人支票增加銀行存款（資產）及減少應收帳款（資產），借記銀行存款/貸記應收帳款。",exEn:"(1) is incorrect: Purchasing an office file cabinet is an acquisition of a non-current asset (Office Equipment), not purchases of trading stock. The correct debit is Office Equipment. (2) is correct: Cash injection by the owner increases assets and capital. Entry: Dr Cash / Cr Capital. (3) is correct: Receiving a cheque from a debtor increases bank balance and reduces the debtor's balance. Entry: Dr Bank / Cr Trade Receivables."},{q:26,year:2015,y:2015,top:"香港經濟的發展近況 —— 全球一體化對企業的影響",topEn:"HK Economic Development —— Impacts of Globalisation on Businesses",cn:"26. 下列哪些是全球一體化對企業的影響？\n(1) 降低資訊成本\n(2) 減少企業之間的競爭\n(3) 促進國與國之間的科技轉移\nA. 只有(1) 及 (2)\nB. 只有(1) 及 (3)\nC. 只有(2) 及 (3)\nD. (1)、(2) 及 (3)",en:"26. 下列哪些是全球一體化對企業的影響？\n(1) 降低資訊成本\n(2) 減少企業之間的競爭\n(3) 促進國與國之間的科技轉移\nA. 只有(1) 及 (2)\nB. 只有(1) 及 (3)\nC. 只有(2) 及 (3)\nD. (1)、(2) 及 (3)",ans:"B",rate:"89%",exCn:"(1)正確：先進的全球電訊及互聯網技術大幅降低了獲取及傳遞資訊的成本。(2)錯誤：全球一體化消除貿易壁壘，允許外國競爭者進入本地市場，顯著增加而非減少企業間競爭。(3)正確：跨國公司在海外設立分支機構，將先進管理技術及製造技術轉移至當地國家。",exEn:"(1) is correct: Advanced global telecommunications and internet technologies have dramatically lowered the cost of acquiring and transmitting information globally. (2) is incorrect: Globalization removes trade barriers, allowing foreign competitors to enter local markets, significantly increasing competition. (3) is correct: Multinational corporations setting up overseas branches transfer advanced management techniques and manufacturing technologies to local countries."},{q:27,year:2015,y:2015,top:"有限公司 / 企業擁有權 —— 公營公司的特點",topEn:"Limited Companies / Forms of Ownership —— Characteristics of Public Corporations",cn:"27. 下列哪項是公營公司的特點？\n(1) 其損失由納稅人承擔。\n(2) 它以商業模式運作。\n(3) 政府參與其日常運作。\nA. 只有(1)\nB. 只有(2)\nC. 只有(1) 及 (3)\nD. 只有(2) 及 (3)",en:"27. 下列哪項是公營公司的特點？\n(1) 其損失由納稅人承擔。\n(2) 它以商業模式運作。\n(3) 政府參與其日常運作。\nA. 只有(1)\nB. 只有(2)\nC. 只有(1) 及 (3)\nD. 只有(2) 及 (3)",ans:"B",rate:"39%",exCn:"(2)正確：公營公司（如港鐵、機管局）由政府擁有，但以商業模式運作，自行覆蓋成本及盈利。(1)錯誤：由於它們是獨立法律實體並商業運作，財務損失由自身儲備吸收，非由納稅人直接承擔。(3)錯誤：政府僅作為主要股東並委任董事，不參與日常運作。",exEn:"(2) is correct: A public corporation is owned by the government but operates on a commercial basis to cover its own costs and generate profits. (1) is incorrect: As independent legal entities operating commercially, their financial losses are absorbed by their own reserves, not directly funded by taxpayers. (3) is incorrect: The government only acts as the primary shareholder and appoints board members; it does not involve itself in daily operations."},{q:28,year:2015,y:2015,top:"個人投資者的責任 —— 投資者的義務",topEn:"Responsibilities of Individual Investors —— Investor Duties",cn:"28. 下列哪些是個人投資者的責任？\n(1) 簽訂合約前了解合約條款\n(2) 不時查閱帳戶報表\n(3) 出席所有投資公司的周年大會\nA. 只有(1) 及 (2)\nB. 只有(1) 及 (3)\nC. 只有(2) 及 (3)\nD. (1)、(2) 及 (3)",en:"28. 下列哪些是個人投資者的責任？\n(1) 簽訂合約前了解合約條款\n(2) 不時查閱帳戶報表\n(3) 出席所有投資公司的周年大會\nA. 只有(1) 及 (2)\nB. 只有(1) 及 (3)\nC. 只有(2) 及 (3)\nD. (1)、(2) 及 (3)",ans:"A",rate:"59%",exCn:"(1)正確：投資者的基本責任是在簽約前了解所有條款及細則。(2)正確：投資者必須主動查閱交易文件及月結單以監控帳戶活動。(3)錯誤：股東有權出席及在周年大會投票，但並無責任出席所有大會。",exEn:"(1) is correct: It is an investor's fundamental duty to understand all terms and conditions of a contract before signing. (2) is correct: Investors must actively monitor their account activities by regular verification of transaction documents and monthly statements. (3) is incorrect: Shareholders have the right to attend and vote at AGMs, but they have no duty or responsibility to attend all of them."},{q:29,year:2015,y:2015,top:"[out c] 存貨的計價 —— 存貨計算",topEn:"[out c] Inventory Valuation —— Inventory Calculation",outc:true,reason:"銷貨成本及存貨計價已從卷一移至選修會計單元（Paper 2A）。",reasonEn:"Cost of goods sold and inventory valuation have been moved from Paper 1 to the Elective Part (Accounting Module Topic 2a).",cn:"29. 商號 2014 年 12 月 31 日的存貨是多少？\nA. $10 000\nB. $12 000\nC. $14 000\nD. $18 000",en:"29. 商號 2014 年 12 月 31 日的存貨是多少？\nA. $10 000\nB. $12 000\nC. $14 000\nD. $18 000",ans:"C",rate:"81%",exCn:"銷貨=$540,000，毛利率60%，銷貨成本率=40%。銷貨成本=$540,000×40%=$216,000。由於商號於1月1日成立，期初存貨=0。銷貨成本=期初存貨+購貨-期末存貨，$216,000=0+$230,000-期末存貨，期末存貨=$14,000。",exEn:"Sales = $540,000, Gross Profit Ratio = 60%, so Cost of Goods Sold Ratio = 40%. COGS = $540,000 × 40% = $216,000. Since the business started on 1 Jan, Opening Inventory = 0. COGS = Opening Inventory + Purchases - Closing Inventory. $216,000 = 0 + $230,000 - Closing Inventory. Closing Inventory = $14,000."},{q:30,year:2015,y:2015,top:"[out c] 貿易公司的損益表 —— 費用計算",topEn:"[out c] Income Statement —— Expenses Calculation",outc:true,reason:"淨利潤及費用計算已從卷一移至選修會計單元（Paper 2A）。",reasonEn:"Net profits and expenses calculation have been moved from Paper 1 to the Elective Part (Accounting Module Topic 2a).",cn:"30. 商號 2014 年度的費用是多少？\nA. $135 000\nB. $189 000\nC. $216 000\nD. $324 000",en:"30. 商號 2014 年度的費用是多少？\nA. $135 000\nB. $189 000\nC. $216 000\nD. $324 000",ans:"A",rate:"71%",exCn:"毛利=$540,000×60%=$324,000。淨利潤=$540,000×35%=$189,000。淨利潤=毛利-費用，$189,000=$324,000-費用，費用=$135,000。",exEn:"Gross Profit = $540,000 × 60% = $324,000. Net Profit = $540,000 × 35% = $189,000. Net Profit = Gross Profit - Expenses. $189,000 = $324,000 - Expenses. Expenses = $135,000."},{q:1,year:2016,y:2016,top:"營商環境 —— 企業擁有權類型（跨國公司的特徵）",topEn:"Business Environment —— Forms of Business Ownership (Characteristics of MNCs)",cn:"1. 下列哪項是位於香港的跨國公司的特徵？\n(1) 它們也會在香港以外地方營運。\n(2) 它們都在香港的證券交易所上市。\n(3) 它們的僱員人數多於 100。\nA. 只有 (1)\nB. 只有 (1) 及 (2)\nC. 只有 (2) 及 (3)\nD. (1)、(2) 及 (3)",en:"1. Which of the following is/are the characteristic(s) of multinational corporations located in Hong Kong?\n(1) Their operations also take place outside Hong Kong.\n(2) They are listed on the stock exchange of Hong Kong.\n(3) They have more than 100 employees.\nA. (1) only\nB. (1) and (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"42%",exCn:"1. 跨國公司（MNCs）的核心定義在於其**跨越國界/多於一個國家或地區營運及設有資產**，故陳述 (1) 正確。\n2. 跨國公司可以是私人有限公司，或者在海外（如紐約、倫敦）證券交易所上市，**並不必須（亦非全都）在香港交易所上市**，故陳述 (2) 錯誤。\n3. 跨國公司不以僱員人數是否大於 100 來作界定標準，部分高科技或精簡架構之跨國公司僱員人數可能少於 100（在香港 100 人以下通常為中小企，但兩者概念不互斥），故陳述 (3) 錯誤。選 A。",exEn:"1. The core definition of a multinational corporation (MNC) is that its **business operations and assets take place in more than one country or region**, hence statement (1) is correct.\n2. MNCs can be privately held or listed on
