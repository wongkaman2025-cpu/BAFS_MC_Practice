it limit\n(3) better terms when opening a term deposit account\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"60%",exCn:"1. 陳述 (1) 及 (2) 正確：借貸人維持良好的個人信貸評級（Credit score），代表其違約拖欠風險低。銀行在審核其借貸申請時，願意為其批出更低的貸款年利率以及核批更高的信用額度。\n2. 陳述 (3) 錯誤：開立定期存款帳戶（這等同於個人借款給銀行）的年利率與相關條款，屬於銀行根據宏觀金融市場及自身資金需求制定的標準市場利率，不會因為客戶個人作為借款人的信貸紀錄好壞而有所不同。",exEn:"1. Statements (1) and (2) are correct: A borrower with a higher personal credit score poses a lower default risk. Financial institutions are therefore more likely to approve loans with a lower borrowing interest rate and grant a higher credit limit.\n2. Statement (3) is incorrect: When opening a term deposit account (which is essentially the individual lending money to the bank), the terms and interest rates are determined by macroeconomic market rates and the bank's liquidity needs, not by the client's credit score as a borrower."},{q:24,year:2017,y:2017,top:"基礎管理 —— 有效管理的原則（統一的方向原則）",topEn:"Basics of Management —— Principles of Effective Management (Unity of direction)",cn:"24. 下列哪項有關「統一的方向」的陳述是正確的？\nA. 每名主管每次只負責一個項目。\nB. 每名員工於每一時段只朝一個目標工作。\nC. 為同一項目工作的員工都有相同目標。\nD. 企業的目標應在合理的時段內完成。",en:"24. Which of the following statements about unity of direction is correct?\nA. Each manager takes up one project only.\nB. Each employee works towards one goal only in a certain period of time.\nC. Employees working for the same project have the same objective.\nD. Business objectives should be achieved within a reasonable period of time.",ans:"C",rate:"64%",exCn:"1. 統一的方向原則（Unity of Direction）的定義是：擁有相同目標的各項企業活動，應該被納入同一個計劃之中，並由同一位管理人員統領和指揮。\n2. 這確保了參與同一個合作項目（相同計劃）的全體員工都圍繞著相同的戰略目標共同協作。\n3. 統一的方向並不要求經理一次只能做一個項目（排除 A），也不限制員工同一時段只能做一項工作（排除 B）。",exEn:"1. Unity of direction is defined as: organizational activities having the same objective should be directed by one manager using one plan.\n2. This principle ensures that employees working on the same project have a shared and cohesive objective to work towards.\n3. It does not restrict a manager to only one project (eliminates A), nor does it prevent an employee from working on multiple tasks at once (eliminates B)."},{q:25,year:2017,y:2017,top:"[out c] 基礎會計 —— 會計假設與概念之定義與辨析（繼續經營假設）",topEn:"[out c] Generally Accepted Accounting Principles (GAAP) —— Accounting Assumptions and Concepts",outc:true,reason:"自 2025 年起，所有會計假設、會計概念的理解與實務應用，已被全數歸入選修部分（會計單元）Paper 2A 的第九章進行考核。",reasonEn:"Starting from 2025, accounting assumptions, principles, and conventions are tested in the Accounting Elective Module Paper 2A.",cn:"25. 下列哪項有關會計假設、原則及慣例的描述是正確的？\nA. 歷史成本：所有企業交易都應記錄於帳冊內\nB. 企業個體：獨資東主可將其個人開支記錄於企業帳冊內\nC. 一貫性：會計政策和方法一經採用，便不能更改\nD. 繼續經營：企業會在可見的未來持續營運",en:"25. Which of the following descriptions about accounting assumptions, principles and conventions is correct?\nA. Historical cost: all business transactions must be recorded in the books\nB. Business entity: a sole proprietor can record his personal expenses in the books of the firm\nC. Consistency: once accounting policies and methods are adopted, they cannot be changed\nD. Going concern: a business will continue in operation for the foreseeable future",ans:"D",rate:"80%",exCn:"1. A 描述錯誤：歷史成本原則（Historical Cost Principle）要求資產應按其購置時的原始成本記錄，而非指記錄所有交易。\n2. B 描述錯誤：企業個體觀念（Business Entity Concept）強調東主與企業在會計上是分離的獨立個體，東主的個人開支絕不能記入企業帳冊。\n3. C 描述錯誤：一貫原則（Consistency Principle）允許企業在「有更真確和合理的理由能更公允反映財務實況」的前提下變更會計方法，而非絕對不能更改。\n4. D 描述正確：繼續經營假設（Going Concern Assumption）假定企業會在可以預見的未來無限期地持續營運下去，無意圖或需要縮減或結業。",exEn:"1. A is incorrect: The historical cost principle states that assets should be recorded at their original purchase cost, not that all transactions must be recorded.\n2. B is incorrect: The business entity concept states that a business is a separate legal and financial entity from its owner, so the owner's personal expenses cannot be recorded as business expenses.\n3. C is incorrect: The consistency principle allows changes in accounting policies if the change is required or provides a fairer presentation of the company's financial state.\n4. D is correct: The going concern assumption assumes that a business will continue its operations for the foreseeable future without the intention or necessity of liquidation."},{q:26,year:2017,y:2017,top:"基礎個人理財 —— 策劃個人理財及投資（影響上市公司股價的因素）",topEn:"Basics of Personal Financial Management —— Personal Financial Planning & Investment (Factors affecting stock prices)",cn:"26. 下列哪項會影響銷售汽車的上市公司的股價？\n(1) 燃油價格\n(2) 利率\n(3) 公司的派息政策\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"26. Which of the following will affect the share price of a listed company selling motorcars?\n(1) fuel price\n(2) interest rate\n(3) dividend policy of the company\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"57%",exCn:"1. 影響股票價格的因素包括宏觀經濟環境及上市公司自身表現與決策：\n(1) 影響：燃油與汽車是互補商品（Complementary goods）。高油價會直接壓抑消費者購買汽油車的慾望，降低汽車銷量進而影響汽車公司的盈利與股價。\n(2) 影響：利率上升會推高消費者買車分期按揭的利息成本，壓低購車需求；同時亦會推高汽車公司的融資資金成本，利空股價。\n(3) 影響：公司的分紅與派息政策會吸引追求穩定股息收益的投資者，提振其股價。\n2. 因此，(1)、(2) 和 (3) 皆是影響股價的因素。",exEn:"1. Listed companies' share prices are affected by both macroeconomic factors and internal financial decisions:\nStatement (1) is correct: Fuel and motorcars are complementary goods. A rise in fuel prices increases car running costs, depressing demand and impacting the car manufacturer's profits and stock price.\nStatement (2) is correct: High interest rates increase consumers' cost of borrowing auto loans and raise the company's financial costs, lowering profitability and share price.\nStatement (3) is correct: A generous dividend policy attracts investors who seek yield, driving up buying demand and the share price.\n2. Therefore, (1), (2), and (3) are all correct."},{q:27,year:2017,y:2017,top:"基礎管理 —— 管理功能（領導風格：民主式領導）",topEn:"Basics of Management —— Management Functions (Democratic leadership)",cn:"27. 下列哪項不是企業採用民主式領導的優點？\nA. 提高營運效率\nB. 擴闊管理人員的視野\nC. 加強員工對企業政策的支持\nD. 促進管理層和員工的相互了解",en:"27. Which of the following is not an advantage of adopting democratic leadership for a business?\nA. enhance operational efficiency\nB. broaden managers' horizons\nC. strengthen employees' support for corporate policies\nD. promote mutual understanding between management and staff",ans:"A",rate:"57%",exCn:"1. 民主式領導（Democratic leadership）強調讓下屬參與討論並收集意見。其最大缺點是在諮詢與反覆開會溝通的決策過程中極其耗費時間（Time-consuming），面臨緊急狀況時會降低營運與決策的效率（故 A「提高營運效率」並非其優點）。\n2. B、C、D 均是民主式領導的顯著優點：能激發員工創意拓寬視野（B）、提升政策參與感與支持度（C）、加強勞資相互了解（D）。",exEn:"1. Democratic leadership involves participative decision-making. Its major drawback is that consultation and gathering feedback can be extremely time-consuming, which reduces operational and decision-making efficiency in urgent situations (hence A, enhance operational efficiency, is NOT an advantage).\n2. B, C, and D are verified benefits: it gathers diverse ideas to broaden horizons (B), builds employee consensus to support policies (C), and enhances trust and understanding (D)."},{q:28,year:2017,y:2017,top:"[out c] 基礎會計 —— 複式記帳記帳科目與方向判定",topEn:"[out c] Introduction to Accounting —— Verifying Double Entries and Ledger Accounts",outc:true,reason:"自 2025 年起，各類商業交易的具體複式記帳會計科目借貸分錄判定，已被全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, bookkeeping entries and double-entry ledger determinations are tested in the Accounting Elective Module Paper 2A.",cn:"28. 下列哪項複式記帳是正確的？\n(1) 交易：以支票結清貨欠 | 借記：應付貨款 | 貸記：銀行存款\n(2) 交易：賒銷商號的辦公室傢具 | 借記：應收貨款 | 貸記：銷貨\n(3) 交易：以現金支付送貨予客戶的運費 | 借記：銷貨運費 | 貸記：現金\n\nA. 只有(1)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"28. Which of the following double entries are correct?\n(1) Settled trade debt by cheque | Account to be debited: Trade payables | Account to be credited: Bank\n(2) Sold the firm's office furniture on credit | Account to be debited: Trade receivables | Account to be credited: Sales\n(3) Paid freight charges for delivering goods to customers in cash | Account to be debited: Carriage outwards | Account to be credited: Cash\n\nA. (1) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"65%",exCn:"1. 陳述 (1) 正確：以支票清還欠供應商之貨欠，負債減少「借記：應付貨款」；銀行存款資產減少「貸記：銀行存款」。\n2. 陳述 (2) 錯誤：出售自用的「辦公室傢具」（屬於非流動資產，而非日常用於轉售的存貨），其貸記科目應為「辦公室傢具」以沖減資產，而不能貸記專用於常規商品賒銷的「銷貨（Sales）」帳戶。\n3. 陳述 (3) 正確：送貨給客戶的運費為銷貨運費（Carriage outwards），費用增加「借記：銷貨運費」；現金資產減少「貸記：現金」。",exEn:"1. Statement (1) is correct: Settling trade payables by cheque decreases liabilities (Dr. Trade Payables) and decreases bank assets (Cr. Bank).\n2. Statement (2) is incorrect: Selling office furniture (a non-current asset, not trade inventory) on credit requires decreasing the non-current asset account. The credited account should be Office Furniture, not Sales (which is strictly used for the sale of trading goods).\n3. Statement (3) is correct: Paying carriage outwards in cash increases expenses (Dr. Carriage Outwards) and decreases cash assets (Cr. Cash)."},{q:29,year:2017,y:2017,top:"[out c] 財務報表分析 —— 會計比率之用途與限制",topEn:"[out c] Financial Ratio Analysis —— Significance and Limits of Accounting Ratios",outc:true,reason:"自 2025 年起，會計比率分析的功能、局限與各比率定義，已被全數歸入選修部分（會計單元）Paper 2A 第二十一章進行考核。",reasonEn:"Starting from 2025, accounting ratios and financial analysis are tested in the Accounting Elective Module Paper 2A.",cn:"29. 下列哪項有關會計比率的陳述是正確的？\n(1) 它們是用來評估企業的財務業績。\n(2) 「銷貨」是計算所有盈利能力比率的分母。\n(3) 一家企業的酸性測驗比率較其流動比率為高。\n\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"29. Which of the following statements about accounting ratios is correct?\n(1) They are used to evaluate the financial performance of a business.\n(2) Sales is the denominator of all profitability ratios.\n(3) The acid test ratio of a firm is higher than its current ratio.\n\nA. (1) only\nB. (1) and (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"A",rate:"69%",exCn:"1. 陳述 (1) 正確：會計比率是將財報科目進行數值除法運算，以協助持份者評估企業的財務業績與經營實力。\n2. 陳述 (2) 錯誤：並非所有盈利能力比率都以「銷貨」作分母，例如「運用資金報酬率（ROCE）」的分母即是平均運用資金，而非銷貨。\n3. 陳述 (3) 錯誤：速動比率（酸性測驗比率）在分子中排除了變現最慢的「存貨」，因此其分子一定小於或等於流動資產，所以酸性測驗比率一定低於或等於流動比率，不可能更高。",exEn:"1. Statement (1) is correct: Financial ratios are mathematical tools used to interpret financial statements to evaluate business performance.\n2. Statement (2) is incorrect: Not all profitability ratios use Sales as the denominator; for example, the Return on Capital Employed (ROCE) uses Capital Employed as its denominator.\n3. Statement (3) is incorrect: The acid test ratio excludes inventory (the least liquid current asset) from its numerator. Therefore, the acid test ratio is always less than or equal to the current ratio."},{q:30,year:2017,y:2017,top:"營商環境 —— 企業擁有權類型（合夥企業之名義合夥人）",topEn:"Business Environment —— Forms of Business Ownership (Nominal partner in a partnership)",cn:"30. 下列哪項有關名義合夥人的陳述是正確的？\n(1) 他須承擔合夥的債務。\n(2) 他參與合夥的運作。\n(3) 他的聲譽有助推廣合夥的業務。\n\nA. 只有(1)\nB. 只有(2)\nC. 只有(3)\nD. 只有(2)及(3)",en:"30. Which of the following statements about a nominal partner is correct?\n(1) He is liable for the debts of the partnership.\n(2) He takes part in the operation of the partnership.\n(3) His reputation helps promote the partnership's businesses.\n\nA. (1) only\nB. (2) only\nC. (3) only\nD. (2) and (3) only",ans:"C",rate:"82%",exCn:"1. 名義合夥人（Nominal partner）是指借出個人姓名、名望或商譽給合夥企業使用的成員。他們並非合夥的擁有人、未實質注資，亦不參與合夥的日常營運（故 (2) 錯誤）。\n2. 陳述 (3) 正確：名義合夥人多為社會名流或行業專家，其個人名聲與信譽能極大提振該合夥企業的品牌聲望並推廣業務。\n3. 陳述 (1) 錯誤：名義合夥人未投資亦不分利，通常不承擔無限債務責任。",exEn:"1. A nominal partner is a person who lends his name, reputation, or goodwill to a partnership. He has no equity ownership, does not invest capital, and does not participate in the daily operations of the firm (thus (2) is incorrect).\n2. Statement (3) is correct: Nominal partners are often prominent social figures, and their reputational value significantly boosts the firm's brand image and promotes business.\n3. Statement (1) is incorrect: As defined in the DSE syllabus, a nominal partner is not an owner and does not share in profits/losses, hence is not liable for the partnership's debts."},{q:1,year:2018,y:2018,top:"營商環境 —— 香港經濟特徵（跨國公司與中小企比例）",topEn:"Business Environment —— Characteristics of Hong Kong Economy (MNCs vs. SMEs)",cn:"1. 下列哪項有關香港經濟的陳述是不正確的？\nA. 香港政府不會操控資本進出。\nB. 香港是世界貿易組織的創始成員。\nC. 香港的企業大多是跨國公司。\nD. 在《更緊密經貿關係的安排》(CEPA)下，香港的服務提供者可在大多數服務領域以優惠待遇在內地開展業務。",en:"1. Which of the following statements about the Hong Kong economy is not correct?\nA. The Hong Kong Government does not control the inflows and outflows of capital.\nB. Hong Kong is a founding member of the World Trade Organization.\nC. Most businesses in Hong Kong are multinational corporations.\nD. Under the Closer Economic Partnership Arrangement (CEPA), service suppliers in Hong Kong enjoy preferential treatment when setting up business in most service sectors on the Mainland.",ans:"C",rate:"47%",exCn:"1. C 是不正確的（即正確答案）：香港的企業有 98% 以上屬於中小型企業（SMEs），而非跨國公司。\n2. A、B、D 均為正確描述：香港不實施外匯管制，資金自由進出；香港是 WTO 創始成員；在 CEPA 框架下，本港服務提供者在內地多個領域享有市場准入等優惠待遇。本題屬於最新必修部分「1(a) 營商環境：香港經濟的特徵及 CEPA 關係」考核範圍。",exEn:"1. C is incorrect (correct answer): Over 98% of businesses in Hong Kong are small and medium enterprises (SMEs), not multinational corporations.\n2. A, B, and D are correct statements: The HK government does not enforce foreign exchange controls, allowing free capital flows; Hong Kong is a founding member of the WTO; under CEPA, local service providers enjoy market access preferences on the Mainland. This topic belongs to the compulsory syllabus '1(a) Business Environment: Characteristics of HK economy and CEPA relationship'."},{q:2,year:2018,y:2018,top:"[out c] 試算表 —— 試算表帳戶借貸餘額判定",topEn:"[out c] Trial Balance —— Determining Debit and Credit Balances of Accounts",outc:true,reason:"自 2025 年起，試算表的編製與科目借貸餘額的判定，已全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, trial balance preparation and account balance classification are tested in the Accounting Elective Module Paper 2A.",cn:"2. 下列哪個帳戶必定在試算表出現借方結餘？\nA. 租金收益\nB. 購貨退出\nC. 購貨折扣\nD. 貸款予員工",en:"2. Which of the following accounts must carry a debit balance in a trial balance?\nA. Rental income\nB. Purchases returns\nC. Discounts received\nD. Loans to employees",ans:"D",rate:"54%",exCn:"1. D 正確：貸款予員工（Loans to employees）屬於企業的「資產（流動/非流動資產）」，未來會收回資金，資產帳戶必定在試算表呈現借方結餘。\n2. A、B、C 錯誤：租金收益（收入）、購貨退出（沖減購貨費用）和購貨折扣（即獲得的折扣，屬於其他收益）皆具有貸方結餘。",exEn:"1. D is correct: Loans to employees is classified as an asset (current/non-current asset) because the money will be recovered in the future. Asset accounts must carry a debit balance in a trial balance.\n2. A, B, and C are incorrect: Rental income (revenue), Purchases returns (reduction in purchases expense), and Discounts received (other income) all carry credit balances."},{q:3,year:2018,y:2018,top:"基礎個人理財 —— 恆生指數的重要性",topEn:"Basics of Personal Financial Management —— Importance of the Hang Seng Index",cn:"3. 如果在過去一個月，恆生指數上升了10%，這表示過去一個月\n(1)「恆生工商業分類指數」上升了10%\n(2) 恆生指數成份股的成交金額上升了10%\n(3) 恆生指數成份股的市價普遍上升了\nA. 只有(1)\nB. 只有(2)\nC. 只有(3)\nD. 只有(2)及(3)",en:"3. If the Hang Seng Index (HSI) rose by 10% during the past month, it means that _____ during the past month.\n(1) the 'HSI-Commerce & Industry' rose by 10%\n(2) the turnover of the HSI constituent stocks increased by 10%\n(3) the market prices of the HSI constituent stocks generally increased\nA. (1) only\nB. (2) only\nC. (3) only\nD. (2) and (3) only",ans:"C",rate:"64%",exCn:"1. 陳述 (3) 正確：恆生指數是反映大市價格變動的指標。指數上升 10% 代表其成份股的市價在整體上普遍上升。\n2. 陳述 (1) 錯誤：恆生指數下設四大分類指數（金融、公用事業、地產、工商業），整體恆指上升 10% 是四大分類的加權平均，不代表工商業指數恰好上升 10%。\n3. 陳述 (2) 錯誤：恆生指數量度的是成份股的「市價（市值）水平」，其升降與成份股的成交金額（成交量）無關。本題屬於最新必修部分「1(d) 基礎個人理財：以證券交易作投資（恆指）」考核範圍。",exEn:"1. Statement (3) is correct: The HSI reflects the overall price movements of the stock market. An increase of 10% in the index indicates that the market prices of its constituent stocks have generally increased.\n2. Statement (1) is incorrect: The HSI comprises four sub-indexes (Finance, Utilities, Properties, Commerce & Industry). The 10% increase is a weighted average of all constituent stocks, not meaning that the Commerce & Industry sub-index rose by exactly 10%.\n3. Statement (2) is incorrect: HSI measures the 'market capitalization and price levels' of constituent stocks. Its movements have no direct correlation with trading turnover (volume). This topic is within the compulsory syllabus '1(d) Basics of Personal Financial Management: Stock Trading (HSI)'."},{q:4,year:2018,y:2018,top:"[out c] 複式記帳法 —— 商業交易之過帳與科目分錄",topEn:"[out c] Double-entry Bookkeeping —— Recording Transactions in Ledger Accounts",outc:true,reason:"自 2025 年起，複式記帳法在分類帳上的記錄，已全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, double-entry bookkeeping principles and ledger accounts recording are tested in the Accounting Elective Module Paper 2A.",cn:"4. 下列哪項複式記帳是正確的？\n交易 | 借記帳戶 | 貸記帳戶\n(1) 收到銀行存款利息 | 利息收益 | 銀行存款\n(2) 賒購辦公室用的文具 | 文具費用 | 應付帳款\n(3) 東主引入他的汽車供商號使用 | 汽車 | 提用\nA. 只有(1)\nB. 只有(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"4. Which of the following double entries is correct?\nTransaction | Account to be debited | Account to be credited\n(1) Received interest on bank deposit | Interest income | Bank\n(2) Purchased office stationery on credit | Stationery expenses | Accounts payable\n(3) Owner introduced his motor car for business use | Motor vans | Drawings\nA. (1) only\nB. (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"74%",exCn:"1. (2) 正確：賒購辦公室文具，費用增加「借記：文具費用」；負債增加「貸記：應付帳款」，分錄正確。\n2. (1) 錯誤：收到利息，應「借記：銀行存款（資產增加）」；「貸記：利息收益（收益增加）」。\n3. (3) 錯誤：東主引入個人汽車，資產增加「借記：汽車/客貨車」；東主投入資本應「貸記：資本（Capital）」，「提用」僅在東主將商號資產取用自用時使用。",exEn:"1. (2) is correct: Purchasing stationery on credit increases expenses (Debit: Stationery expenses) and increases liabilities (Credit: Accounts payable). This entry is correct.\n2. (1) is incorrect: Receiving deposit interest increases assets (Debit: Bank) and increases revenue (Credit: Interest income).\n3. (3) is incorrect: Introducing personal motor car increases assets (Debit: Motor vans) and increases owner's equity (Credit: Capital). Drawings is only used when the owner withdraws assets for personal use."},{q:5,year:2018,y:2018,top:"基礎管理 —— 管理功能（控制過程：品質控制步驟）",topEn:"Basics of Management —— Management Functions (Control process: steps of quality control)",cn:"5. 下列為品質控制所需的工作：\n(1) 抽樣量度實際次貨率\n(2) 如實際次貨率高於可接受水平，找出原因，並採取跟進措施\n(3) 訂立可接受的次貨率\n(4) 比較實際與可接受的次貨率\n品質控制步驟的次序應為：\nA. (1) -> (3) -> (2) -> (4)\nB. (1) -> (4) -> (3) -> (2)\nC. (3) -> (1) -> (2) -> (4)\nD. (3) -> (1) -> (4) -> (2)",en:"5. The following are tasks required for quality control:\n(1) sample and measure the actual defect rate\n(2) if the actual defect rate is higher than the acceptable level, find out the reason and take follow-up action\n(3) establish an acceptable defect rate\n(4) compare the actual and acceptable defect rates\nThe sequence of the quality control steps should be:\nA. (1) -> (3) -> (2) -> (4)\nB. (1) -> (4) -> (3) -> (2)\nC. (3) -> (1) -> (2) -> (4)\nD. (3) -> (1) -> (4) -> (2)",ans:"D",rate:"89%",exCn:"1. D 正確：品質控制屬於管理四大功能中的「控制（Controlling）」範疇。控制過程的四大步驟為：\n第一步：制定表現標準 —— 訂立可接受的次貨率，即項目 (3)；\n第二步：量度實際表現 —— 抽樣量度實際次貨率，即項目 (1)；\n第三步：比較實際表現與標準 —— 比較實際與可接受的次貨率，即項目 (4)；\n第四步：採取改善措施 —— 若高於標準，找出原因並採取措施，即項目 (2)。\n故正確順序為 (3) -> (1) -> (4) -> (2)，選 D。本題屬於最新必修部分「1(b) 基礎管理：管理功能（控制過程）」考核範圍。",exEn:"1. D is correct: Quality control represents the 'Controlling' function of management. The four standard steps of the control process are:\nStep 1: Establishing performance standards — Establish an acceptable defect rate, which is task (3);\nStep 2: Measuring actual performance — Sample and measure the actual defect rate, which is task (1);\nStep 3: Comparing actual performance against standards — Compare the actual and acceptable defect rates, which is task (4);\nStep 4: Taking corrective actions — If the defect rate is higher than standard, find the reasons and take action, which is task (2).\nThe correct sequence is (3) -> (1) -> (4) -> (2). This topic belongs to the compulsory syllabus '1(b) Basics of Management: Management Functions (Control process)'."},{q:6,year:2018,y:2018,top:"[out c] 基礎會計 —— 企業費用、提用與資本變動之會計處理",topEn:"[out c] Introduction to Accounting —— Identifying Expenses, Drawings and Capital",outc:true,reason:"自 2025 年起，基礎會計已移出必修部分，所有關於「費用、提用、資本」之判定與損益表編製，已全數歸入選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, introductory accounting topics including classification of expenses, drawings and capital are tested in the Accounting Elective Module Paper 2A.",cn:"6. 下列哪項應記作商號的費用？\n(1) 以現金支付商號兼職工人的工資\n(2) 以商號支票支付東主私人住宅的保險費\n(3) 以東主個人支票支付商號貨倉的租金\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1) 、(2)及(3)",en:"6. Which of the following should be recorded as an expense of a firm?\n(1) wages paid to the part-time workers of the firm in cash\n(2) insurance paid for owner's private apartment by the firm's cheque\n(3) rent paid for the firm's warehouse by owner's personal cheque\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"77%",exCn:"1. (1) 應記作費用：以現金支付兼職員工薪資屬於商號的「工資費用（Wages expense）」，計入費用。\n2. (2) 不能記作費用：支付東主「私人住宅」保險屬於東主的私人非商業開支，根據企業個體觀念，此筆以商號支票代付的款項應記作「提用（Drawings）」，不能記入商號費用。\n3. (3) 應記作費用：支付商號貨倉租金屬於商號的「租金費用（Rent expense）」。雖然是由東主以「個人支票」代付，但本質上這筆費用已由商號招致（會計分錄為：借記 租金費用，貸記 資本），因此在會計上仍須記作商號的費用。",exEn:"1. (1) should be recorded as an expense: Cash paid for part-time workers' wages is a business expense (Wages expense).\n2. (2) should NOT be recorded as an expense: Insurance paid for the owner's private apartment is personal expenditure. Under the business entity concept, this payment made by the firm's cheque must be debited to Drawings, not to business expenses.\n3. (3) should be recorded as an expense: Rent paid for the firm's warehouse is a business expense (Rent expense). Although paid by the owner's personal cheque, the expense is incurred by the business (the double entry is: Dr. Rent expenses; Cr. Capital), hence it must be recorded as an expense of the firm."},{q:7,year:2018,y:2018,top:"營商環境 —— 商業道德與社會責任",topEn:"Business Environment —— Business Ethics and Social Responsibility",cn:"7. 符合商業道德的行為\n(1) 可提升企業的公眾形象。\n(2) 長遠來說會增加企業的營運成本。\n(3) 讓企業以較低利得稅率納稅。\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"7. Ethical behaviour in business will _____\n(1) enhance the public image of a business.\n(2) increase the operating costs of a business in the long run.\n(3) enable a business to be subject to a lower profits tax rate.\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"A",rate:"93%",exCn:"1. (1) 正確：遵守商業道德（如誠信經營、保護環境）能贏得公眾和消費者的信任，顯著提升企業的公眾形象和社會聲譽。\n2. (2) 錯誤：雖然實行道德行為在短期內可能需要一些合規或投入成本，但長遠而言能有效減少因訴訟、醜聞及員工流失引致的巨額開支，反而能「降低」長遠營運風險與潛在成本。\n3. (3) 錯誤：香港的利得稅率由法律（稅務條例）統一定義，企業不會因為道德行為良好而享有任何特殊的「減稅或較低稅率」待遇。本題屬於最新必修部分「1(a) 營商環境：商業道德及社會責任」考核範圍。",exEn:"1. (1) is correct: Adhering to business ethics (such as honest operations and environmental protection) wins trust from stakeholders, enhancing the business's public image and social reputation.\n2. (2) is incorrect: Although implementing ethical behaviour may incur short-term compliance or investment costs, in the long run, it reduces significant expenses from lawsuits, scandals, and staff turnover, thereby reducing potential operating costs.\n3. (3) is incorrect: Profits tax rates in HK are determined by legislation. A business will not be subject to a lower profits tax rate because of its ethical behaviour. This topic is within the compulsory syllabus '1(a) Business Environment: Business Ethics and Social Responsibility'."},{q:8,year:2018,y:2018,top:"[out c] 原始分錄帳簿及分類帳 —— 購貨帳之沖減與貸記",topEn:"[out c] Books of Original Entry and Ledgers —— Crediting the Purchases Account",outc:true,reason:"自 2025 年起，關於「購貨退出、提用與捐贈商品」之會計分錄與分類帳登記，已全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, accounting journal entries for purchases returns, drawings, and merchandise donations are tested in the Accounting Elective Module Paper 2A.",cn:"8. 下列哪項應貸記商號的購貨帳？\n(1) 東主提取貨物自用\n(2) 退回貨物予供應商\n(3) 捐贈貨物予非牟利機構\nA. 只有(1)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1) 、(2)及(3)",en:"8. Which of the following should be credited to the purchases account of a firm?\n(1) withdrawal of goods by the owner for personal use\n(2) return of goods to the supplier\n(3) donation of goods to non-profit-making organisations\nA. (1) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"33%",exCn:"1. (1) 及 (3) 正確：\n(1) 東主提取存貨自用，分錄為「借記：提用（Drawings）」；「貸記：購貨（Purchases）」（按成本沖減購貨總額），分錄正確。\n(3) 將貨物捐贈給慈善機構（非日常銷售用途），分錄為「借記：捐贈費用」；「貸記：購貨」（按成本沖減購貨總額），分錄正確。\n2. (2) 錯誤：將貨物退回給供應商，分錄為「借記：應付貨款」；「貸記：購貨退出（Purchases returns）」而非貸記購貨帳本身，故 (2) 排除。",exEn:"1. (1) and (3) are correct:\n(1) When the owner withdraws goods for personal use, the entry is: Debit Drawings; Credit Purchases (reducing the total cost of purchases), which is correct.\n(3) When goods are donated to charity, the entry is: Debit Donation expenses; Credit Purchases (reducing the cost of purchases), which is correct.\n2. (2) is incorrect: Returning goods to the supplier is recorded as: Debit Trade payables; Credit Purchases returns (Returns outwards), not crediting the Purchases account directly. Hence, (2) is excluded."},{q:9,year:2018,y:2018,top:"基礎管理 —— 主要商業功能（市場營銷管理職掌）",topEn:"Basics of Management —— Major Business Functions (Functions of the marketing department)",cn:"9. 下列哪項是公司市場營銷部門的主要功能？\n(1) 策劃市場研究\n(2) 制定貨物價格策略\n(3) 控制貨物品質\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1) 、(2)及(3)",en:"9. Which of the following is/are the main function(s) of the marketing department of a company?\n(1) conducting market research\n(2) formulating pricing strategies for goods\n(3) controlling the quality of goods\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"81%",exCn:"1. (1) 及 (2) 正確：市場營銷部門（Marketing）的核心職責為營銷組合「4P」（產品、價格、推廣、分銷）。策劃市場研究以了解顧客需要（1）與制定貨物價格策略（2）皆屬於市場營銷部門的職能。\n2. (3) 錯誤：控制貨物生產品質（Quality Control），屬於營運管理（Operations Management）部門的主要功能，而非市場營銷部的職責。本題屬於最新必修部分「1(b) 基礎管理：主要商業功能（市場營銷管理）」考核範圍。",exEn:"1. (1) and (2) are correct: The core functions of the marketing department revolve around the marketing mix '4Ps' (Product, Price, Promotion, Place). Conducting market research to understand customer needs (1) and formulating pricing strategies (2) both belong to marketing.\n2. (3) is incorrect: Controlling the quality of goods (Quality Control) is the responsibility of the Operations Management department, not the marketing department. This topic is within the compulsory syllabus '1(b) Basics of Management: Major Business Functions (Marketing)'."},{q:10,year:2018,y:2018,top:"[out c] 基礎會計 —— 帳戶之性質與分類（實帳戶的特徵）",topEn:"[out c] Introduction to Accounting —— Classification of Accounts (Examples of permanent accounts)",outc:true,reason:"自 2025 年起，基礎會計與帳戶分類已移出必修部分，實帳戶與虛帳戶的性質判定、期末結平原理，已全數歸入選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, accounts classifications (permanent vs. temporary) and end-of-period closing entries are tested in the Accounting Elective Module Paper 2A.",cn:"10. 下列哪個是實帳戶的例子？\n(1) 銷貨帳\n(2) 銀行貸款帳\n(3) 設備帳\nA. 只有(1)\nB. 只有(2)\nC. 只有(3)\nD. 只有(2)及(3)",en:"10. Which of the following is/are example(s) of a permanent account?\n(1) Sales account\n(2) Bank loan account\n(3) Equipment account\nA. (1) only\nB. (2) only\nC. (3) only\nD. (2) and (3) only",ans:"D",rate:"58%",exCn:"1. (2) 及 (3) 正確（即 D 正確）：\n實帳戶（Real Accounts / Permanent Accounts）：是指期末結餘需結轉至下一會計期間、反映在「財務狀況表」中的資產、負債和資本類科目。因此，(2) 銀行貸款帳（負債）和 (3) 設備帳（資產）均為實帳戶，餘額會帶到下一年度。\n2. (1) 錯誤：\n虛帳戶（Nominal Accounts / Temporary Accounts）：指期末餘額需結轉至損益帳結平、反映在「損益表」中的收益與費用類科目。銷貨帳（1）屬於虛帳戶，餘額在期末會被結平轉至損益帳。",exEn:"1. (2) and (3) are correct (D is correct):\nPermanent (Real) Accounts: These are accounts that represent assets, liabilities, and capital. Their balances are carried forward to the next accounting period and appear in the Statement of Financial Position. Thus, (2) Bank loan account (liability) and (3) Equipment account (asset) are permanent accounts.\n2. (1) is incorrect:\nTemporary (Nominal) Accounts: These are revenue and expense accounts that are closed at the end of each period to the Profit and Loss Account. The Sales account (1) is a temporary account, so its balance is closed and not carried forward."},{q:11,year:2018,y:2018,top:"基礎管理 —— 有效管理的原則（功能部門分工與目標管理之應用）",topEn:"Basics of Management —— Principles of Effective Management (Division of labour and MBO)",cn:"11. 一家貿易商號按功能劃分部門。每年年初，總經理會與其部門經理一起商討和制定各部門的目標，以達至商號的整體目標。他們會定時檢視各部門的目標是否能按計劃達成。\n根據以上資料，這商號應用了下列哪項有效管理原則？\n(1) 平衡職權和責任\n(2) 目標管理\n(3) 分工\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1) 、(2)及(3)",en:"11. A trading firm is departmentalised by function. At the beginning of each year, the general manager discusses and decides on the goals of each department with the department managers to achieve the overall goals of the firm. They review the goals of each department regularly to see if they can be achieved as planned.\nAccording to the above information, which of the following principles of effective management has been applied by the firm?\n(1) balancing authority and responsibility\n(2) management by objectives\n(3) division of work\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"49%",exCn:"1. (3) 正確：商號「按功能劃分部門」，將公司的整體經營職能（如財務、行銷等）拆分為不同專業部門，這直接體現了有效管理原則中的「分工（Division of work / labour）」。\n2. (2) 正確：「總經理會與其部門經理一起商討和制定各部門的目標……定時檢視進度」，這體現了「目標管理（Management by Objectives, MBO）」中上下級共同設定目標、雙向溝通及定期反饋的核心流程。\n3. (1) 錯誤：案例中並無提及各級經理的職權大小與其所需承擔責任是否對等，因此「平衡職權與責任」未在題幹中體現。故 (2) 及 (3) 正確，選 C。本題屬於最新必修部分「1(b) 基礎管理：管理功能及有效管理的原則」考核範圍。",exEn:"1. (3) is correct: The firm 'is departmentalised by function', dividing the overall operations into specialized functional departments (Finance, Marketing, etc.). This directly applies the principle of 'division of work (labour)'.\n2. (2) is correct: 'The general manager discusses and decides on the goals of each department with the department managers... review the goals regularly'. This is the core practice of 'management by objectives (MBO)' which involves joint goal-setting and regular feedback.\n3. (1) is incorrect: There is no mention of whether the level of authority matches the level of responsibility given to the managers, so 'balancing authority and responsibility' is not illustrated. Therefore, (2) and (3) are correct, making C the correct answer. This topic is within the compulsory syllabus '1(b) Basics of Management: Principles of Effective Management (MBO & Division of Work)'."},{q:12,year:2018,y:2018,top:"[out c] 原始分錄帳簿及分類帳 —— 現金與銀行帳戶金額核算與餘額結平",topEn:"[out c] Books of Original Entry and Ledgers —— Reconstructing Bank Ledger Balances",outc:true,reason:"自 2025 年起，現金簿及各類日記簿的登帳、過帳與科目結平，已全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, recording cash and bank transactions in cash book and ledgers accounts balancing are tested in the Accounting Elective Module Paper 2A.",cn:"12. 2018年3月1日，一商號的銀行存款帳和現金帳分別有借方結餘$15000和$12000。商號該月現銷$13000，其中$5000保留於夾萬內。其餘現銷金額則在月底前存入銀行。該月以現金支付費用$9000和以支票購買設備$26000。\n2018年3月31日，銀行存款帳有\nA. 貸方結餘$3000\nB. 貸方結餘$6000\nC. 借方結餘$5000\nD. 借方結餘$8000",en:"12. On 1 March 2018, the bank account and cash account of a firm carried debit balances of $15 000 and $12 000 respectively. During the month, the firm had cash sales of $13 000, of which $5 000 was kept in the safe. The remaining cash sales were deposited into the bank before the end of the month. During the month, wages paid in cash amounted to $9 000 and equipment purchased by cheque amounted to $26 000.\nAs at 31 March 2018, the bank account has a:\nA. credit balance of $3 000\nB. credit balance of $6 000\nC. debit balance of $5 000\nD. debit balance of $8 000",ans:"A",rate:"74%",exCn:"1. A 正確：我們按期初餘額與當期交易，重構「銀行存款」分類帳：\n期初銀行借方結餘 = +$15,000；\n本月現銷共 $13,000，其中 $5,000 保留於現金箱自用（屬於現金帳增加），其餘部分存入銀行。存入銀行的金額 = $13,000 - $5,000 = +$8,000（銀行借方增加）；\n以支票（Cheque）支付購買設備 = -$26,000（銀行貸方減少，資產減少）；\n本月以「現金（Cash）」支付的費用 $9,000，只影響現金帳（現金減少 $9,000），與銀行存款帳完全無關，排除。\n期末銀行存款帳餘額 = 期初 $15,000 + 存入 $8,000 - 支票支出 $26,000 = -$3,000。由于餘額為負數 $3,000（銀行透支），在複式記帳中代表呈現為貸方結餘 $3,000，選 A。",exEn:"1. A is correct: Let's reconstruct the Cash at Bank ledger account based on the transactions:\nBeginning Debit balance of Bank = +$15,000;\nCash sales of $13,000, of which $5,000 is kept in safe (Cash Dr. increases). The remainder is deposited into bank = $13,000 - $5,000 = +$8,000 (Bank Dr. increases);\nEquipment purchased by cheque = -$26,000 (Bank Cr. decreases);\nWages paid in cash of $9,000 is paid in 'cash', which only affects the Cash account and has no relation with the Bank account, excluded.\nFinal Bank balance = Beginning $15,000 + Deposit $8,000 - Cheque payment $26,000 = -$3,000. A negative balance of $3,000 in bank represents an overdraft, which carries a credit balance of $3,000 at the year-end. Thus, A is correct."},{q:13,year:2018,y:2018,top:"基礎個人理財 —— 消費者信貸（銀行透支之特徵）",topEn:"Basics of Personal Financial Management —— Consumer Credit (Characteristics of bank overdrafts)",cn:"13. 下列哪項有關銀行透支的陳述是正確的？\n(1) 沒有固定還款期。\n(2) 利息通常按月計算。\n(3) 通常毋須抵押。\nA. 只有(1)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1) 、(2)及(3)",en:"13. Which of the following statements about bank overdrafts is/are correct?\n(1) There is no fixed schedule for repayments.\n(2) Interest is usually calculated on a monthly basis.\n(3) Generally, collateral is not required.\nA. (1) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"30%",exCn:"1. (1) 正確：銀行透支（Bank Overdraft）是一種極具彈性的短期借貸安排，借款人可以隨時存入資金還款，並無法律或合約上「固定的每月還款期（還款時間表）」。\n2. (2) 錯誤：銀行透支的利息在金融實務上是按日計算（Calculated on a daily basis）的（即按每日實際透支的金額乘以透支利率，並按月結算扣除），而非按月計算。\n3. (3) 正確：透支通常是銀行基於客戶的信用或往來帳戶歷史而給予的短期的信用额度，通常是毋須資產抵押的。故 (1) 及 (3) 正確，選 B。本題屬於最新必修部分「1(d) 基礎個人理財：消費者信貸（銀行透支）」考核範圍。",exEn:"1. (1) is correct: Bank overdraft is a flexible short-term credit facility with no fixed repayment schedule or due dates. Borrowers can pay off the debt at any time when they have surplus funds.\n2. (2) is incorrect: In banking practice, interest on overdrafts is calculated on a daily basis based on the actual daily overdrawn amount, though it is usually charged/debited to the account monthly. It is not calculated on a monthly basis.\n3. (3) is correct: Overdrafts are unsecured short-term facilities granted based on the customer's creditworthiness or bank account history, hence collateral is generally not required. Therefore, (1) and (3) are correct, making B the correct answer. This topic is within the compulsory syllabus '1(d) Basics of Personal Financial Management: Consumer Credit (Bank Overdrafts)'."},{q:14,year:2018,y:2018,top:"營商環境 —— 商業道德與社會責任的踐行",topEn:"Business Environment —— Business Ethics and Social Responsibility",cn:"14. 就一家玩具公司而言，下列哪項不是履行社會責任的例子？\nA. 使用回收材料製造玩具\nB. 捐贈玩具予孤兒院\nC. 聖誕期間給予顧客20%折扣\nD. 改善員工工作環境",en:"14. For a toy company, which of the following is NOT an example of fulfilling its social responsibility?\nA. using recycled materials to produce toys\nB. donating toys to orphanages\nC. offering 20% discount to customers during Christmas\nD. improving the working environment of its employees",ans:"C",rate:"79%",exCn:"1. C 不是履行社會責任（即正確答案）：聖誕期間打八折（折扣）屬於企業常見的市場推廣與價格促銷活動（Promotion），本質上是以提升短期銷售量和營業額利潤為核心的常規商業策略，不屬於社會責任（CSR）範疇。\n2. A、B、D 均為履行社會責任的例子：A（環境保護責任）、B（社區關懷與社會公益責任）、D（關懷員工福利與安全之責任），皆屬於履行企業社會責任。本題屬於最新必修部分「1(a) 營商環境：商業道德及社會責任（社會責任例子）」考核範圍。",exEn:"1. C is NOT an example of CSR (correct answer): Offering a 20% discount to customers during Christmas is a typical marketing and pricing promotion strategy (Promotion). It aims at boosting short-term sales volume and revenue, which falls under regular commercial marketing rather than Corporate Social Responsibility (CSR).\n2. A, B, and D are examples of CSR: A (environmental protection responsibility), B (community care and charity responsibility), and D (responsibility towards employee welfare and safety). This topic is within the compulsory syllabus '1(a) Business Environment: Business Ethics and Social Responsibility'."},{q:15,year:2018,y:2018,top:"基礎個人理財 —— 金錢的時間值（複利未來值與現值雙重折現計算）",topEn:"Basics of Personal Financial Management —— Time Value of Money (PV and FV dual calculations)",cn:"15. 李先生欲於三年後購買一輛汽車，現時車價為$500000，每年升幅估計為3%。為了三年後支付車價，他欲投資一基金，每年複息回報率為5%。他現時需投資於基金的金額是多少？\nA. $471 969\nB. $490 476\nC. $509 709\nD. $529 695",en:"15. Mr Lee wants to buy a car 3 years later. Its price is $500 000 now and is expected to increase by 3% per annum, compounded annually. To pay for the car after 3 years, he is considering investing in a bank fund with a return of 5% per annum, compounded annually. How much should he invest in the fund now?\nA. $471 969\nB. $490 476\nC. $509 709\nD. $529 695",ans:"A",rate:"74%",exCn:"1. A 正確：本題考查複利終值（FV）與現值（PV）的雙重複合計算：\n第一步：計算三年後買車所需的總金額（即未來值 FV）：車價按每年 3% 複合增長，三年後車價 FV = $500,000 × (1 + 0.03)^3 = $500,000 × 1.092727 = $546,363.50。\n第二步：計算當前需要投入基金的金額（即現值 PV）：基金回報率為 5%，我們將上述未來值折現回現在：PV = $546,363.50 / (1 + 0.05)^3 = $546,363.50 / 1.157625 ≈ $471,969.46。\n四捨五入至整數元為 $471,969（選 A）。本題屬於最新必修部分「1(d) 基礎個人理財：金錢的時間值（計算現值和未來值）」考核範圍。",exEn:"1. A is correct: This question involves dual compound interest calculations of Future Value (FV) and Present Value (PV), within the syllabus limit of maximum 3 compounding periods:\nStep 1: Calculate the future car price in 3 years (FV): The price grows at 3% per annum. FV = $500,000 × (1 + 0.03)^3 = $500,000 × 1.092727 = $546,363.50.\nStep 2: Calculate the required investment amount now (PV): The fund offers a 5% return. We discount the FV back to present value: PV = $546,363.50 / (1 + 0.05)^3 = $546,363.50 / 1.157625 ≈ $471,969.46.\nRounding to the nearest dollar gives $471,969. This topic belongs to the compulsory syllabus '1(d) Basics of Personal Financial Management: Time Value of Money'."},{q:16,year:2018,y:2018,top:"基礎管理 —— 管理功能（計劃：目標管理 MBO 的利弊）",topEn:"Basics of Management —— Management Functions (Planning: Pros and cons of MBO)",cn:"16. 下列哪項是企業採用「目標管理」的好處？\n(1) 增強下屬的工作滿足感\n(2) 降低行政成本\n(3) 減少工作延誤\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1) 、(2)及(3)",en:"16. Which of the following are the advantages of adopting 'management by objectives' by a business?\n(1) enhance the subordinates' job satisfaction\n(2) lower the administrative cost\n(3) reduce work delays\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"B",rate:"64%",exCn:"1. (1) 及 (3) 正確：\n(1) 正確：目標管理（MBO）強調主管與下屬共同商討並設定明確、可量度的目標，能賦予下屬較多自主權與責任感，從而能增強下屬的工作滿足感。\n(3) 正確：由於 MBO 目標設有清晰的時間限制和衡量標準，便於定時檢視，能有效激勵員工並減少工作延誤與拖延。\n2. (2) 錯誤：實施目標管理需要上下級進行反覆深入的會面、共同討論、文書記錄及定期審核，這通常會顯著增加（而非降低）企業整體的文書工作、行政開支與溝通時間成本。故選 B。本題屬於最新必修部分「1(b) 基礎管理：管理功能（計劃之目標）」考核範圍。",exEn:"1. (1) and (3) are correct:\n(1) is correct: MBO involves joint goal-setting and dual discussions, giving subordinates more autonomy, commitment and clarity, which enhances their job satisfaction.\n(3) is correct: Because MBO goals are explicit and time-bound, they facilitate continuous monitoring and help to reduce work delays.\n2. (2) is incorrect: Implementing MBO requires frequent meetings, documentation, reviews and feedback sessions between supervisors and subordinates, which significantly increases (not lowers) the administrative and paperwork costs of the firm. Therefore, only (1) and (3) are correct, making B the correct answer. This topic belongs to the compulsory syllabus '1(b) Basics of Management: Management Functions (Planning/MBO)'."},{q:17,year:2018,y:2018,top:"[out c] 不完整會計紀錄 —— 資本變動等式與提用金額核算",topEn:"[out c] Incomplete Records —— Capital Account Equations and Drawings Calculations",outc:true,reason:"自 2025 年起，不完整會計紀錄下的期末資本與提用額倒推、損益核算，已全數歸入選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, incomplete accounting records calculations, capital equations and drawings derivations are tested in the Accounting Elective Module Paper 2A.",cn:"17. 下列是有關陳先生商號2017年度的資料：\n* 資本,2017年1月1日：$443 800\n* 資本,2017年12月31日：$425 000\n* 2017年度總收益：$97 000\n* 2017年度總費用：$108 500\n根據以上資料，陳先生於2017年度內\nA. 從商號提用$7300\nB. 從商號提用$30 300\nC. 注資商號$7300\nD. 注資商號$30300",en:"17. The following information relates to Mr Chan's firm in 2017:\n* Capital, as at 1 January 2017: $443 800\n* Capital, as at 31 December 2017: $425 000\n* Total revenue for the year 2017: $97 000\n* Total expenses for the year 2017: $108 500\nBased on the above information, Mr Chan _____\nA. withdrew $7 300 from the firm during the year 2017.\nB. withdrew $30 300 from the firm during the year 2017.\nC. introduced $7 300 into the firm during the year 2017.\nD. introduced $30 300 into the firm during the year 2017.",ans:"A",rate:"68%",exCn:"1. A 正確：本題可套用期末與期初的「資本變動公式」倒推計算：\n第一步：計算 2017 年度商號的淨利或淨虧損：淨利 / (淨損失) = 總收益 - 總費用 = $97,000 - $108,500 = -$11,500 (當期為淨損失 $11,500)。\n第二步：套用資本變動公式：期末資本 = 期初資本 + 淨利(或 - 淨損失) - 提用 + 新增注資\n$425,000 = $443,800 - $11,500 - 提用 + $0\n$425,000 = $432,300 - 提用\n提用 (Drawings) = $432,300 - $425,000 = $7,300。\n因此陳先生在該年度內「從商號提用了 $7,300」（即 Withdraw），選 A。",exEn:"1. A is correct: This question can be solved using the capital movement formula:\nStep 1: Calculate the net profit/loss for the year: Net Profit / (Loss) = Total Revenue - Total Expenses = $97,000 - $108,500 = -$11,500 (indicating a net loss of $11,500).\nStep 2: Apply the capital movement formula: Closing Capital = Opening Capital + Net Profit (or - Net Loss) - Drawings + Capital Injection\n$425,000 = $443,800 - $11,500 - Drawings + $0\n$425,000 = $432,300 - Drawings\nDrawings = $432,300 - $425,000 = $7,300.\nThus, Mr Chan withdrew $7,300 (made cash drawings) from the firm during the year. Hence, A is correct."},{q:18,year:2018,y:2018,top:"[out c] 營商環境 —— 企業擁有權類型（公營公司的特徵與性質）",topEn:"[out c] Business Environment —— Forms of Business Ownership (Characteristics of public corporations)",outc:true,reason:"自 2025 年起，「公營公司」整個課題已從必修部分大綱中完全刪除，不予考核。",reasonEn:"Starting from the 2025 HKDSE, the topic of 'public corporations' has been completely removed from the compulsory syllabus.",cn:"18. 海洋公園公司是香港一家公營公司，下列哪項有關它的陳述是正確的？\n(1) 它在香港交易所上市。\n(2) 它的董事局成員是由政府委任。\n(3) 它財政上自給自足。\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1) 、(2)及(3)",en:"18. Which of the following statements about the Ocean Park Corporation, a public corporation in Hong Kong, are correct?\n(1) It is listed on the Hong Kong Stock Exchange.\n(2) Its board of directors is appointed by the government.\n(3) It is self-sufficient financially.\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"41%",exCn:"1. (2) 及 (3) 正確：\n(2) 正確：公營公司（Public Corporation）由政府全資設立與擁有，其最高決策層（董事局主席及成員）通常依法由政府首長直接指定和委任。\n(3) 正確：公營公司（如海洋公園、港鐵、機管局）在香港通常以自負盈虧、商業化的模式營運，要求在財政上做到自給自足。\n2. (1) 錯誤：公營公司是由政府獨資擁有的獨立個體，它並不在證券交易所上市。在港交所公開招股上市的屬於「公眾有限公司（Public limited company）」。",exEn:"1. (2) and (3) are correct:\n(2) is correct: A public corporation is wholly owned by the government, and its board of directors is appointed by the government (usually by the Chief Executive or relevant bureau secretary).\n(3) is correct: Public corporations in Hong Kong are established to run on a commercial basis and are expected to be self-sufficient financially (self-financing).\n2. (1) is incorrect: Public corporations are government-owned entities and are NOT listed on the stock exchange. It is public limited companies that raise capital by listing shares on the HKEX."},{q:19,year:2018,y:2018,top:"基礎個人理財 —— 金錢的時間值（淨現值 NPV 運算所需變數）",topEn:"Basics of Personal Financial Management —— Time Value of Money (Required variables for NPV)",cn:"19. 計算投資一部機器的淨現值，需要下列哪項資料？\n(1) 機器的最初成本\n(2) 機器的殘值\n(3) 機器的使用年限\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1) 、(2)及(3)",en:"19. Which of the following information is/are required to calculate the net present value of investment in a machine?\n(1) initial cost of the machine\n(2) scrap value of the machine\n(3) useful life of the machine\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"66%",exCn:"1. D 正確：計算投資項目的淨現值（NPV）需要以下核心變數：\n(1) 機器的最初成本 —— 作為第 0 期期初的「現金流出（Initial cash outflow）」；\n(2) 機器的殘值 —— 在項目使用年限終結時，作為最後一期的「現金流入（Cash inflow）」，折現至期初；\n(3) 機器的使用年限 —— 作為折現期數（n 的值），決定需要折現多少個複息期。因此，(1)、(2)、(3) 皆是必需的資料，選 D。本題屬於最新必修部分「1(d) 基礎個人理財：金錢的時間值（以淨現值作投資決策）」考核範圍。",exEn:"1. D is correct: Calculating the Net Present Value (NPV) of a machinery investment project requires all of the following variables:\n(1) Initial cost of the machine — Acts as the initial cash outflow in Year 0;\n(2) Scrap (residual/salvage) value of the machine — Acts as a cash inflow in the final year of the project, which needs to be discounted back to present value;\n(3) Useful life of the machine — Represents the number of compounding/discounting periods (the value of n) to determine the time horizon.\nTherefore, (1), (2), and (3) are all required. This topic belongs to the compulsory syllabus '1(d) Basics of Personal Financial Management: Time Value of Money'."},{q:20,year:2018,y:2018,top:"[out c] 不同企業擁有權類型的財務報告編製 —— 損益表（影響毛利金額之特徵）",topEn:"[out c] Financial Statements —— Income Statement (Factors affecting Gross Profit)",outc:true,reason:"自 2025 年起，會計科目在損益表中的細部劃分（銷貨成本與營業費用、貿易與現金折扣），已全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, operating expenses vs. cost of sales classifications, trade discounts and cash discounts treatments are tested in the Accounting Elective Module Paper 2A.",cn:"20. 下列哪項會增加一家貿易商號的毛利？\nA. 購貨退出減少\nB. 銷貨運費減少\nC. 供應商提高交易折扣\nD. 供應商提高現金折扣",en:"20. Which of the following will increase the gross profit of a trading firm?\nA. a decrease in purchases returns\nB. a decrease in carriage outwards\nC. an increase in trade discounts offered by the supplier\nD. an increase in cash discounts offered by the supplier",ans:"C",rate:"41%",exCn:"1. C 正確：\n交易折扣/貿易折扣（Trade discount）：在賒購商品時，供應商提高交易折扣會直接在發票中扣減，直接降低購貨成本（COGS）。根據公式「毛利 = 銷貨淨額 - 銷貨成本」，購貨成本下降會使毛利直接增加，故 C 正確。\n2. A、B、D 錯誤：\nA 錯誤：購貨退出減少會使「購貨淨額」上升，從而拉高銷貨成本，最終會「減少」毛利。\nB 錯誤：銷貨運費（Carriage outwards）屬於「營業費用」，列於毛利之後，其變動完全不影響毛利。\nD 錯誤：供應商提高現金折扣（購貨折扣），在會計上分類為「其他收益」，列在毛利之後，不影響貿易部分的毛利。",exEn:"1. C is correct:\nTrade discount: This is a discount deducted directly from the list price on the invoice. When the supplier increases the trade discount, it directly lowers the Cost of Goods Sold (COGS). Since 'Gross Profit = Net Sales - COGS', a lower COGS directly increases gross profit.\n2. A, B, and D are incorrect:\nA is incorrect: A decrease in purchases returns increases net purchases, which raises COGS and thus decreases gross profit.\nB is incorrect: Carriage outwards is classified as an operating expense, listed below the gross profit line. Any changes in it do not affect gross profit.\nD is incorrect: Cash discounts received (discounts received) are classified as 'Other income', listed below the gross profit line, and do not affect gross profit."},{q:21,year:2018,y:2018,top:"[out c] 財務報表分析 —— 變現能力與存貨佔比之交叉比率分析",topEn:"[out c] Financial Ratio Analysis —— Liquidity and Inventory Proportions",outc:true,reason:"自 2025 年起，財務報表分析的各類會計比率計算、變現能力交叉比率解讀，已全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, comparative financial ratios analysis, liquidity calculations and inventory deductions are tested in the Accounting Elective Module Paper 2A.",cn:"21. 明記和陳記是同一行業的貿易商號。他們2017年度的財務資料如下：\n* 明記：流動資產 $900 000 | 流動比率 6:1 | 酸性測驗比率 2:1\n* 陳記：流動資產 $600 000 | 流動比率 2.5:1 | 酸性測驗比率 1.5:1\n根據以上資料，明記\n(1) 的流動負債較少\n(2) 應付短期負債的能力較高\n(3) 的存貨較少\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1) 、(2)及(3)",en:"21. Ming Kee and Chan Kee are trading firms in the same industry. Their financial information for the year 2017 is shown below:\n* Ming Kee: Current assets $900 000 | Current ratio 6:1 | Acid test ratio 2:1\n* Chan Kee: Current assets $600 000 | Current ratio 2.5:1 | Acid test ratio 1.5:1\nBased on the above information, Ming Kee has\n(1) less current liabilities\n(2) greater ability to meet short-term obligations\n(3) less inventory\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"78%",exCn:"1. (1) 及 (2) 正確（即 A 正確）：\n(1) 正確：\n明記的流動負債 = 流動資產 $900,000 / 流動比率 (6) = $150,000。\n陳記的流動負債 = 流動資產 $600,000 / 流動比率 (2.5) = $240,000。\n明記的流動負債（$15萬）顯著少於陳記（$24萬），故 (1) 正確。\n(2) 正確：明記的流動比率（6:1）及速動比率（2:1）皆遠高於陳記的對應比率（2.5:1 及 1.5:1），說明明記應付短期債務的變現安全邊際極高，應付短期負債的能力較高，故 (2) 正確。\n(3) 錯誤：\n根據公式，速動比率 = (流動資產 - 存貨) / 流動負債。\n明記的存貨：2 = ($900,000 - 存貨) / $150,000 → 存貨 = $900,000 - $300,000 = $600,000。\n陳記的存貨：1.5 = ($600,000 - 存貨) / $240,000 → 存貨 = $600,000 - $360,000 = $240,000。\n明記的存貨（$60萬）其實多於陳記的存貨（$24萬），因此 (3) 錯誤。\n綜上，只有 (1) 和 (2) 正確，選 A。",exEn:"1. (1) and (2) are correct (A is correct):\n(1) is correct:\nMing Kee's Current liabilities = Current assets $900,000 / Current ratio (6) = $150,000.\nChan Kee's Current liabilities = Current assets $600,000 / Current ratio (2.5) = $240,000.\nMing Kee's current liabilities ($150,000) are less than Chan Kee's ($240,000). Thus, (1) is correct.\n(2) is correct: Ming Kee's current ratio (6:1) and acid test ratio (2:1) are both significantly higher than Chan Kee's, indicating that Ming Kee has a greater ability to meet short-term obligations.\n(3) is incorrect:\nSince Acid test ratio = (Current assets - Inventory) / Current liabilities:\nMing Kee's inventory: 2 = ($900,000 - Inventory) / $150,000 → Inventory = $900,000 - $300,000 = $600,000.\nChan Kee's inventory: 1.5 = ($600,000 - Inventory) / $240,000 → Inventory = $600,000 - $360,000 = $240,000.\nMing Kee's inventory ($600,000) is more than Chan Kee's ($240,000). Thus, (3) is incorrect.\nOnly (1) and (2) are correct. Hence, A is correct."},{q:22,year:2018,y:2018,top:"[out c] 基礎個人理財 —— 證券交易（主板與 GEM 上市條件對比）",topEn:"[out c] Basics of Personal Financial Management —— Stock Trading (GEM vs. Main Board Listing Requirements)",outc:true,reason:"自 2025 年起，必修部分考綱明確規定「以證券交易作投資：不包括主板及創業板新申請人的基本上市要求」，此項對比已被移出卷一必修考綱。",reasonEn:"Starting from 2025, the compulsory syllabus for stock trading explicitly states 'Stock trading as an investment: excluding the basic listing requirements for new applicants on the Main Board and GEM'.",cn:"22. 在創業板對新申請人的基本上市要求中，並沒有就 ______ 設有最低要求。\nA. 現金流\nB. 盈利\nC. 營業紀錄\nD. 市值",en:"22. In the basic listing requirements of GEM for new applicants, there is no minimum requirement on _____.\nA. cash flow\nB. profit\nC. history of operation\nD. market capitalisation",ans:"B",rate:"30%",exCn:"1. B 正確：香港聯交所的創業板（GEM）旨在為具有高增長潛力的中小型企業提供籌資和上市集資平台。相較於主板（Main Board）新申請人必須通過嚴格的最低「股東應佔盈利」測試，創業板（GEM）對新上市申請人並沒有設置硬性的最低「盈利（Profit）」財務要求（它更關注企業的營業記錄和營運現金流），故選 B。",exEn:"1. B is correct: GEM (Growth Enterprise Market) is designed to provide a listing platform for small and medium-sized enterprises with high growth potential. Unlike the Main Board which requires strict minimum 'profits attributable to shareholders' tests, there is no minimum 'profit' requirement for new listing applicants on the GEM (it focuses more on cash flows and history of operation). Thus, B is correct."},{q:23,year:2018,y:2018,top:"[out c] 會計的目的及角色 —— 會計的角色與基本功能範圍",topEn:"[out c] Introduction to Accounting —— Functions and Role of Accounting",outc:true,reason:"自 2025 年起，會計的性質、目的、四大核心功能（記錄、分類、歸納、溝通）已被全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, the purpose and role of accounting, and its four core functions (recording, classifying, summarising, communicating) are tested in the Accounting Elective Module Paper 2A.",cn:"23. 下列哪項不是會計的功能？\nA. 歸納企業交易\nB. 監控會計人員的表現\nC. 向不同持份者傳遞企業表現資訊\nD. 把企業交易分類",en:"23. Which of the following is not a function of accounting?\nA. summarising business transactions\nB. monitoring the performance of accounting staff\nC. communicating information on business performance to different stakeholders\nD. classifying business transactions",ans:"B",rate:"88%",exCn:"1. B 不是會計的功能（即正確答案）：監控會計/財務人員的日常工作和業績表現，屬於企業內部人力資源管理（Human Resources Management）或行政管理主管的職責，並不屬於會計學/會計系統本身的功能。\n2. A、C、D 均為會計的核心功能：根據會計的定義，其主要功能包括：記錄交易（Recording）、將交易分類（Classifying，即 D）、將交易結算並歸納編製財務報表（Summarising，即 A）以及向內部和外部持份者傳遞/溝通財務資訊（Communicating，即 C）。故選 B。",exEn:"1. B is not a function of accounting (correct answer): Monitoring the performance of accounting or finance staff is a Human Resources Management or general administrative function, not a function of the accounting system itself.\n2. A, C, and D are core functions of accounting: By definition, the key functions of accounting are recording transactions, classifying transactions (D), summarising transactions into reports (A), and communicating financial performance to stakeholders (C). Thus, B is correct."},{q:24,year:2018,y:2018,top:"營商環境 —— 企業擁有權類型（普通合夥與有限合夥之特徵）",topEn:"Business Environment —— Forms of Business Ownership (Partnerships: general vs. limited)",cn:"24. 下列哪項有關合夥的陳述是正確的？\n(1) 普通合夥沒有有限合夥人。\n(2) 有限合夥是獨立於東主的法定個體。\n(3) 有限合夥的所有合夥人均只負有限的債務責任。\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(2)及(3)\nD. (1) 、(2)及(3)",en:"24. Which of the following statements about partnerships is/are correct?\n(1) A general partnership has no limited partners.\n(2) A limited partnership is a legal entity separate from its owners.\n(3) All partners in a limited partnership enjoy limited liability.\nA. (1) only\nB. (1) and (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"48%",exCn:"1. 陳述 (1) 正確：在普通合夥（General Partnership）中，所有合夥人均為普通合夥人，共同承擔無限債務責任，因此不設有「有限合夥人」這類成員。\n2. 陳述 (2) 錯誤：合夥（不論是普通還是有限合夥）均屬於「非法團（Unincorporated association）」，它們在法律上並非獨立於其東主的法定個體，不享有獨立法人地位。\n3. 陳述 (3) 錯誤：根據合夥條例，有限合夥（Limited Partnership）中必須有至少一名「普通合夥人（General partner）」來對合夥債務承擔無限責任；如果「所有」合夥人均只承擔有限責任，則該企業必須註冊為有限公司。故只有 (1) 正確，選 A。本題屬於最新必修部分「1(a) 營商環境：企業擁有權類型（合夥）」考核範圍。",exEn:"1. Statement (1) is correct: In a general partnership, all partners are general partners who jointly bear unlimited liability. There are no limited partners in a general partnership.\n2. Statement (2) is incorrect: A partnership (whether general or limited) is an unincorporated business entity. It is NOT a legal entity separate from its owners.\n3. Statement (3) is incorrect: In a limited partnership, there must be at least one general partner who bears unlimited liability for the partnership's debts. If all partners enjoyed limited liability, the business would have to be registered as a limited company. Therefore, only (1) is correct, making A the correct answer. This topic is within the compulsory syllabus '1(a) Business Environment: Forms of Business Ownership (Partnership)'."},{q:25,year:2018,y:2018,top:"基礎個人理財 —— 策劃個人理財及投資（金融工具風險與回報特徵）",topEn:"Basics of Personal Financial Management —— Personal Financial Planning & Investment (Bonds and Deposits)",cn:"25. 下列哪項有關風險和回報的陳述是正確的？\nA. 市場風險是可以分散的。\nB. 高風險金融產品必有高回報。\nC. 迴避風險的投資者通常喜歡投資債券多於作定期存款。\nD. 保守的退休人士通常喜歡投資債券多於股票。",en:"25. Which of the following statements about risk and return is correct?\nA. Market risk can be diversified.\nB. Financial products with high risk must bring high returns.\nC. Risk-averse investors usually prefer investing in bonds to making term deposits.\nD. Conservative retired persons usually prefer investing in bonds to stocks.",ans:"D",rate:"55%",exCn:"1. D 正確：退休人士通常具有較低的風險承受能力，重視本金安全和穩定的利息。相較於價格波動劇烈且可能損失大筆本金的「股票（Stocks）」，具有固定利息派發與到期收回本金特徵的「債券（Bonds）」風險遠低，因此更適合保守的退休人士。\n2. A、B、C 錯誤：\nA 錯誤：市場風險（系統性風險，如通脹、金融海嘯）是影響整個市場的風險，無法透過分散投資（Diversification）來消除。\nB 錯誤：高風險金融產品代表的是「有機會」獲得較高回報，但「必有高回報」說法過於絕對，亦伴隨巨大的虧損機率。\nC 錯誤：定期存款由商業銀行提供本金和利息保證，風險低於任何企業債券。迴避風險（Risk-averse）的投資者通常更偏好定期存款。本題屬於最新必修部分「1(d) 基礎個人理財：策劃個人理財及投資（金融產品特徵與風險回報取捨）」考核範圍。",exEn:"1. D is correct: Retired persons generally have a low risk tolerance and prefer capital preservation. Compared to volatile stocks, bonds carry lower risks and provide steady interest income with principal repayment at maturity, making them more suitable for conservative retired persons.\n2. A, B, and C are incorrect:\nA is incorrect: Market risk (systematic risk, such as inflation or recession) affects the whole financial market and cannot be diversified away.\nB is incorrect: High-risk financial products only offer the opportunity for higher returns, but they do not guarantee high returns and carry a high probability of loss.\nC is incorrect: Term deposits are backed by commercial banks with guaranteed principal, making them safer than bonds. Risk-averse investors would prefer term deposits over bonds. This topic is within the compulsory syllabus '1(d) Basics of Personal Financial Management: Personal Financial Planning & Investment (Bonds and Deposits)'."},{q:26,year:2018,y:2018,top:"基礎管理 —— 管理功能（計劃：SMART 目標準則之應用）",topEn:"Basics of Management —— Management Functions (Planning: SMART goals criteria)",cn:"26. 一汽車零售商為其新款汽車訂立銷售目標如下：\n「在2019年，有50%香港駕駛人士會購買我們的新款汽車。」\n這銷售目標符合下列哪項訂定良好目標的準則？\n(1) 具體的\n(2) 可量度的\n(3) 可達到的\nA. 只有(2)\nB. 只有(3)\nC. 只有(1)及(2)\nD. 只有(1)及(3)",en:"26. A car retailer sets the following sales target for its new car model:\n'50% of Hong Kong drivers will buy our new car model in 2019.'\nWhich of the following criteria for setting good objectives is/are met in this sales target?\n(1) specific\n(2) measurable\n(3) attainable\nA. (2) only\nB. (3) only\nC. (1) and (2) only\nD. (1) and (3) only",ans:"C",rate:"74%",exCn:"1. (1) 及 (2) 正確（即 C 正確）：\n(1) 具體（Specific）符合：目標明確指出了時間「在 2019 年」、對象「香港駕駛人士」以及商品「購買我們的新款汽車」，足夠清晰具體。\n(2) 可量度（Measurable）符合：目標給出了明確的數值指標「50%」，這能透過香港運輸署的車輛登記和銷量數據進行統計和量度。\n(3) 可達到（Attainable）不符合：在高度競爭且品牌林立的汽車零售市場中，要求在短短一年內，全港高達一半（50%）的駕駛人士全部購買「同一款」特定新車，完全脫離現實，屬於不切實際且不可達成的目標。\n綜上，符合 (1) 和 (2)，選 C。本題屬於最新必修部分「1(b) 基礎管理：管理功能（計劃：SMART 目標準則）」考核範圍。",exEn:"1. (1) and (2) are correct (C is correct):\n(1) Specific is met: The target specifies the timeframe ('in 2019'), the target audience ('Hong Kong drivers'), and the product ('our new car model'). It is highly specific.\n(2) Measurable is met: The goal provides a quantitative metric ('50%'), which can be easily measured and calculated using vehicle registration data from the Transport Department.\n(3) Attainable is NOT met: In a highly competitive automobile market, expecting 50% of all drivers to purchase the same single car model within a year is unrealistic and practically impossible.\nTherefore, only (1) and (2) are met. Hence, C is correct. This topic is within the compulsory syllabus '1(b) Basics of Management: Management Functions (SMART goals)'."},{q:27,year:2018,y:2018,top:"基礎管理 —— 有效管理的原則（按權力建立組織架構：直線與幕僚職權）",topEn:"Basics of Management —— Principles of Effective Management (Line and staff authority)",cn:"27. 以下哪項有關「職權」的陳述是正確的？\n(1) 營運經理對其下屬有幕僚職權。\n(2) 人力資源經理對廠房經理有直線職權。\n(3) 會計經理對其下屬有直線職權。\nA. 只有(2)\nB. 只有(3)\nC. 只有(1)及(2)\nD. (1) 、(2)及(3)",en:"27. Which of the following statements about 'authority' is/are correct?\n(1) An operations manager has staff authority over his subordinates.\n(2) A human resources manager has line authority over a plant manager.\n(3) An accounting manager has line authority over his subordinates.\nA. (2) only\nB. (3) only\nC. (1) and (2) only\nD. (1), (2) and (3)",ans:"B",rate:"60%",exCn:"1. (3) 正確（即 B 正確）：\n(3) 正確：會計經理（Accounting Manager）作為會計部門的主管，對其部門內部的直接下屬（如會計文員）擁有直接下達命令、指揮和督導工作的「直線職權（Line authority）」。\n(1) 錯誤：營運經理（Operations Manager）對其直接下屬擁有指揮和下達命令的直線職權，而非幕僚職權。\n(2) 錯誤：人力資源部屬於輔助/參謀性功能部門，人力資源經理對生產一線的廠房經理僅能提供專業人事意見，擁有的是「幕僚/職能職權（Staff/Functional authority）」，無權直接跨部門命令廠房經理，故沒有直線職權。\n綜上，只有 (3) 正確，選 B。本題屬於最新必修部分「1(b) 基礎管理：有效管理的原則（直線與幕僚職權）」考核範圍。",exEn:"1. (3) is correct (B is correct):\n(3) is correct: An accounting manager, as the head of the accounting department, possesses direct command and decision-making power (line authority) over his/her direct subordinates (e.g., accounting clerks).\n(1) is incorrect: An operations manager has line authority (the right to command and direct), not staff authority, over his/her subordinates.\n(2) is incorrect: The HR department is an advisory/staff department. The HR manager can only offer professional HR advice and support to the plant manager (possessing staff authority), and has no line authority to command the plant manager directly.\nTherefore, only (3) is correct. Hence, B is correct. This topic is within the compulsory syllabus '1(b) Basics of Management: Principles of Effective Management (Line and Staff Authority)'."},{q:28,year:2018,y:2018,top:"營商環境 —— 企業擁有權類型（私人與公眾有限公司之比較）",topEn:"Business Environment —— Forms of Business Ownership (Private vs. Public Limited Companies)",cn:"28. 與公眾有限公司比較，下列哪項是私人有限公司的優點？\n(1) 政府監管較少\n(2) 毋須向股東派發股息\n(3) 融資較易\nA. 只有(1)\nB. 只有(2)\nC. 只有(3)\nD. 只有(1)及(2)",en:"28. Compared to a public limited company, which of the following is/are the advantage(s) of a private limited company?\n(1) It is subject to less government supervision.\n(2) It does not need to distribute dividends to shareholders.\n(3) It can obtain financing more easily.\nA. (1) only\nB. (2) only\nC. (3) only\nD. (1) and (2) only",ans:"A",rate:"61%",exCn:"1. (1) 正確（即 A 正確）：\n(1) 正確：私人有限公司（Private limited company）無須向公眾披露財務報表，亦無強制召開公眾聆訊與廣泛發布財報的義務，因此所面臨的政府監管與法律披露要求遠少於公眾有限公司。\n(2) 錯誤：不論私人還是公眾有限公司，是否派發股息（Dividend）皆由董事局視利潤和未來發展需求自行決定，皆不設有法律「強制派息」義務，故非特有優點。\n(3) 錯誤：公眾有限公司（尤其是上市公司）可以直接向社會大眾發行股票與債券募集資金，其融資能力和管道遠比私人有限公司容易且廣泛。故私人有限公司融資較難。\n綜上，只有 (1) 正確，選 A。本題屬於最新必修部分「1(a) 營商環境：企業擁有權類型（有限公司之比較）」考核範圍。",exEn:"1. (1) is correct (A is correct):\n(1) is correct: Private limited companies are not required to publish their financial statements to the general public, thus they are subject to less government supervision and disclosure regulations than public limited companies.\n(2) is incorrect: For both private and public limited companies, distributing dividends is at the discretion of the board of directors; there is no mandatory obligation to do so. This is not an advantage unique to private companies.\n(3) is incorrect: Public limited companies (especially listed ones) can raise huge capital by issuing shares and debentures to the general public. Thus, public companies can obtain financing much more easily than private companies.\nOnly (1) is correct. Hence, A is correct. This topic is within the compulsory syllabus '1(a) Business Environment: Forms of Business Ownership (Limited Companies Comparison)'."},{q:29,year:2018,y:2018,top:"[out c] 不同企業擁有權類型的財務報告編製 —— 財務報表（損益表的特徵與編製基礎）",topEn:"[out c] Financial Statements —— Features and Limitations of Income Statement",outc:true,reason:"自 2025 年起，財務報表的用途與限制、現金基礎與應計基礎之辨析，已全數移至選修部分（會計單元）Paper 2A 考核。",reasonEn:"Starting from 2025, purposes, limitations and preparation bases (accrual vs. cash basis) of financial statements are tested in the Accounting Elective Module Paper 2A.",cn:"29. 下列哪項有關損益表的陳述是不正確的？\nA. 資料大多是量化的\nB. 資料主要反映過去事項\nC. 其編製需要專業判斷\nD. 其編製只根據現金收入和現金支出",en:"29. Which of the following about an income statement is not correct?\nA. Information is mostly quantitative.\nB. Information mainly reflects past events.\nC. Its preparation involves professional judgements.\nD. Its preparation is based on cash receipts and cash payments only.",ans:"D",rate:"68%",exCn:"1. D 是不正確的（即正確答案）：損益表是基於「應計會計基礎（Accrual Basis of Accounting）」編製（即將當期已賺取收益與已招致費用進行配比，不論現金是否實際收付），而非單純根據現金實收實付的「現金收付基礎（Cash Basis）」編製。故 D 錯誤。\n2. A、B、C 均為正確描述：會計以貨幣為量度單位，故財務報表資訊大多是貨幣「量化（Quantitative）」的；資產負債表與損益表主要記錄已發生交易，反映的是「過去的事項（Past events）」；損益表在估算呆帳準備、折舊年限及折舊率時，需要會計人員的「專業判斷（Professional judgements）」。",exEn:"1. D is incorrect (correct answer): The income statement is prepared based on the 'accrual basis of accounting' (where revenues and expenses are recognized when earned or incurred, regardless of cash flow), rather than being based on cash receipts and cash payments ('cash basis of accounting'). Thus, D is incorrect.\n2. A, B, and C are correct statements: Accounting relies on money measurement, so information is mostly quantitative; financial statements record historical transactions, reflecting mainly past events; and preparation of P&L (such as estimating depreciation and allowance for doubtful debts) requires professional judgements."},{q:30,year:2018,y:2018,top:"基礎個人理財 —— 強制性公積金（強積金）制度的供款與權益權責關係",topEn:"Basics of Personal Financial Management —— Mandatory Provident Fund (MPF) System",cn:"30. 下列哪項有關強制性公積金(強積金)制度的陳述是正確的？\nA. 年齡介乎16至65歲的自僱人士須參加強積金計劃。\nB. 建造業工人可豁免參加強積金計劃。\nC. 強積金計劃成員如已失業超過兩年，可申請提早從強積金計劃提取累算權益。\nD. 當轉職時，強積金計劃成員可轉移其累算權益往另一強積金受託人。",en:"30. Which of the following statements about the Mandatory Provident Fund (MPF) System is correct?\nA. Self-employed persons aged between 16 and 65 are required to join the MPF Scheme.\nB. Construction workers are exempted from the MPF Scheme.\nC. MPF scheme members can apply for early withdrawal of the accrued benefits from the MPF Scheme if they are unemployed for more than two years.\nD. When changing jobs, MPF scheme members can transfer their accrued benefits to another MPF trustee.",ans:"D",rate:"61%",exCn:"1. D 正確：強積金實行「僱員自選安排」（積金半自由行），當計劃成員轉換工作/轉職時，完全有權將其個人帳戶內的累算權益轉移至自選的新強積金受託人與計劃中，故 D 正確。\n2. A、B、C 錯誤：\nA 錯誤：強積金強制登記與供款的自僱人士年齡範圍應為 18 至 65 歲，而非 16 歲。\nB 錯誤：建造業、餐飲業等高流動性行業的臨時員工，必須依法參加專為其設立的「行業計劃（Industry Schemes）」，絕無豁免。\nC 錯誤：單純的「失業」（不論失業時間有多長）並非提早提取強積金累算權益的法定特殊豁免理由（法定理由為：年滿 60 歲提早退休、永久離開香港、完全喪失行為能力、罹患末期疾病、小額結餘或死亡）。本題屬於最新必修部分「1(d) 基礎個人理財：強積金計劃」考核範圍。",exEn:"1. D is correct: Under the MPF Employee Choice Arrangement, when a scheme member changes jobs, they have the right to transfer their accrued benefits to another trustee and MPF scheme of their own choice.\n2. A, B, and C are incorrect:\nA is incorrect: The mandatory enrollment age for self-employed persons is between 18 and 65, not 16.\nB is incorrect: Casual employees in high-mobility industries (such as construction and catering) must be enrolled in 'Industry Schemes' and are not exempted.\nC is incorrect: General 'unemployment' (no matter how long) is not a statutory ground for early withdrawal of MPF accrued benefits (the legal grounds are: early retirement at 60, permanent departure from HK, total incapacity, terminal illness, small balance, or death). This topic belongs to the compulsory syllabus '1(d) Basics of Personal Financial Management: MPF System'."}]);</script>
<script>Q=Q.concat([{q:1,year:2019,y:2019,top:"營商環境 —— 企業擁有權類型（獨資與普通合夥之對比）",topEn:"Business Environment —— Forms of Business Ownership (Sole Proprietorship vs. General Partnership)",cn:"1. 下列哪項是獨資與普通合夥的分別？\n\n| | | 獨資 | 普通合夥 |\n| :--- | :--- | :--- | :--- |\n| (1) | 決策過程 | 較短 | 較長 |\n| (2) | 利得稅率 | 較低 | 較高 |\n| (3) | 債務責任 | 無限 | 有限 |\n\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"1. Which of the following is/are difference(s) between a sole proprietorship and a general partnership?\n\n| | | Sole proprietorship | General partnership |\n| :--- | :--- | :--- | :--- |\n| (1) | Decision-making process | shorter | longer |\n| (2) | Profits tax rate | lower | higher |\n| (3) | Liability borne | unlimited | limited |\n\nA. (1) only\nB. (1) and (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"76%",exCn:"(1) 正確：獨資企業只有一位東主，決策無須協商，決策過程較短；普通合夥有多位合夥人共同經營，決策需要共同磋商，決策過程較長。\n(2) 錯誤：在香港，獨資與合夥企業（非法團）適用相同的標準利得稅率（標準稅率為15%），並無高低之分。\n(3) 錯誤：獨資東主與普通合夥人皆須承擔無限債務責任。\n因此僅有 (1) 正確，選 A。",exEn:"(1) Correct: A sole proprietorship has only one owner, so the decision-making process is shorter; a general partnership has multiple partners, requiring joint consultation, so the decision-making process is longer.\n(2) Incorrect: In Hong Kong, sole proprietorships and partnerships (unincorporated businesses) are subject to the same standard profits tax rate (standard rate of 15%), so there is no difference.\n(3) Incorrect: Both sole proprietors and general partners bear unlimited liability.\nTherefore, only (1) is correct, making A the correct answer."},{q:2,year:2019,y:2019,top:"基礎會計 —— 會計假設、原則及慣例",topEn:"Introductory Accounting —— Accounting Assumptions, Principles and Conventions",outc:true,reason:"自 2025 年起，會計假設、原則及慣例的具體分錄及應用，已全數歸入選修部分（會計單元）Paper 2A。",reasonEn:"Starting from 2025, the application of accounting principles and assumptions is tested in Elective Module Paper 2A.",cn:"2. 根據會計假設、原則及慣例，下列哪項會計處理是正確的？\n\nA. 某獨資東主將其個人的租金費用記錄在商號的帳冊內。\nB. 陳先生擁有三家商號，他為每家商號保存個別的會計記錄。\nC. 如果預期企業將於下月停止營運，所有資產均按現時市場價格計值。\nD. 除非新方法可以帶來更高利潤，否則已採用的會計方法就不應改變。",en:"2. According to accounting assumptions, principles and conventions, which of the following accounting treatments is correct?\n\nA. A sole proprietor records his own rental expenses in the books of the firm.\nB. Mr Chan owns three businesses and maintains separate accounting records for each of them.\nC. If a business is expected to close down next month, all assets are valued at their current market price.\nD. Once adopted, an accounting method should not be changed unless the new method can bring more profit.",ans:"B",rate:"73%",exCn:"A 錯誤：根據企業個體觀念（Business Entity Concept），東主私人費用不得記入企業帳冊，應列作提用。\nB 正確：企業個體觀念指出，每個企業在會計上均為獨立的個體。即使屬同一東主，不同商號亦必須分開開設個別的會計記錄。\nC 錯誤：若企業預期停止營運，違背了繼續經營假設，此時資產應以可變現淨值（Net Realizable Value / Liquidation Value）而非簡單的「市場價格」計值。\nD 錯誤：會計方法一經採用不應隨意更改，但若改變能「更真確及公允反映財務狀況」則允許更改，而非為了「帶來更高利潤」。",exEn:"A Incorrect: According to the business entity concept, the owner's personal expenses should not be recorded in the firm's books and should be treated as drawings.\nB Correct: The business entity concept states that a business is a separate entity from its owner and other businesses. Even if they have the same owner, separate accounting records must be maintained for each business.\nC Incorrect: If a business is expected to close down, the going concern assumption is violated, and assets should be valued at their net realisable value / liquidation value instead of the current market price.\nD Incorrect: Under the consistency principle, once adopted, an accounting method should not be changed unless the change can provide a true and fair view of the financial positions, not just to bring more profit."},{q:3,year:2019,y:2019,top:"基礎管理 —— 管理功能（目標管理）",topEn:"Basics of Management —— Management Functions (Management by Objectives)",outc:true,reason:"根據 2025 最新考綱要求，目標管理（MBO）的特點及應用已被完全移出文憑試必修考核範圍。",reasonEn:"Starting from 2025, the characteristics and application of Management by Objectives (MBO) are completely removed from the Compulsory Part (Paper 1) syllabus.",cn:"3. 下列哪項有關「目標管理」的陳述是正確的？\n\n(1) 它可提升員工士氣。\n(2) 它可促進上司與下屬的溝通。\n(3) 它讓上司專注較重要的工作。\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"3. Which of the following statements about 'management by objectives' is/are correct?\n\n(1) It can enhance employees' morale.\n(2) It can facilitate communication between superior and subordinates.\n(3) It allows superiors to focus on more important work.\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"A",rate:"68%",exCn:"(1) 正確：目標管理（MBO）鼓勵員工共同參與目標設定，能激勵下屬，提升其工作滿足感和士氣。\n(2) 正確：上司與下屬需共同商討與定時檢視進度，顯著促進了上下級之間的溝通。\n(3) 錯誤：目標管理在實際執行時，需耗費大量時間與人力進行會議、文書溝通和進度控管，會增加上級與下屬的工作負擔，並非直接「讓上司專注較重要工作」。",exEn:"(1) Correct: Management by objectives (MBO) encourages employee participation in goal setting, which motivates subordinates and enhances their morale and job satisfaction.\n(2) Correct: Superiors and subordinates jointly discuss and regularly review progress, which significantly improves communication.\n(3) Incorrect: MBO requires substantial time and effort for meetings, documentation, and progress monitoring, which increases the workload of both managers and subordinates rather than allowing managers to easily 'focus on more important work'."},{q:4,year:2019,y:2019,top:"原始分錄帳簿及分類帳 —— 分類帳帳戶之過帳",topEn:"Books of Original Entry & Ledgers —— Posting to Ledger Accounts",outc:true,reason:"自 2025 年起，「複式記帳在分類帳上的記錄與結平（Double-entry Bookkeeping）」已全數移至選修部分（會計單元）第三章（Paper 2A）。",reasonEn:"Starting from 2025, ledger account postings, balancing off accounts, and double-entry bookkeeping are tested in Elective Module Paper 2A.",cn:"4. 以下帳戶摘錄自李氏商號的帳冊：\n\n區先生\n\n| 2018年 | 詳情 | $ | 2018年 | 詳情 | $ |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 10月14日 | 現金 | 22 000 | 10月1日 | 承上結餘 | 10 000 |\n| 10月31日 | 結餘轉下 | 44 000 | 10月5日 | 購貨 | 56 000 |\n| | | 66 000 | | | 66 000 |\n\n根據以上帳戶的資料，下列哪項陳述是不正確的？\n\nA. 2018年10月1日李氏商號欠區先生$10000。\nB. 2018年10月5日區先生向李氏商號賒銷貨品$56000。\nC. 2018年10月14日李氏商號從區先生收到現金$22000。\nD. 2018年10月31日這帳戶有貸方結餘。",en:"4. The following account is extracted from the books of Lee's firm:\n\nMr Au\n\n| 2018 | Particulars | $ | 2018 | Particulars | $ |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| Oct 14 | Cash | 22 000 | Oct 1 | Balance b/d | 10 000 |\n| Oct 31 | Balance c/d | 44 000 | Oct 5 | Purchases | 56 000 |\n| | | 66 000 | | | 66 000 |\n\nWhich of the following statements is/are incorrect?\n\nA. Lee's firm owed Mr Au $10 000 on 1 October 2018.\nB. Mr Au sold goods for $56 000 on credit to Lee's firm on 5 October 2018.\nC. Lee's firm received $22 000 in cash from Mr Au on 14 October 2018.\nD. This account has a credit balance on 31 October 2018.",ans:"C",rate:"52%",exCn:"A 正確：區先生在李氏商號帳冊內屬於「應付貨款」（債權人，負債類科目），期初有貸方餘額 $10,000，表示李氏商號期初欠其 $10,000。\nB 正確：10月5日貸記購貨 $56,000，代表李氏商號向其賒購了貨品。\nC 錯誤：10月14日「區先生」帳戶記入借方 $22,000，對應分錄為「借記：區先生（應付帳款減少）；貸記：現金（資產減少）」，這表示李氏商號以現金支付了 $22,000 予區先生（清還欠款），而非「收到現金」。故 C 陳述錯誤。\nD 正確：10月31日「結餘轉下」在借方，代表期末結餘承上在下一期初會回到貸方，屬於貸方結餘。",exEn:"A Correct: Mr Au is a trade payable (liability) in the books of Lee's firm. The opening balance of $10,000 on the credit side indicates that Lee's firm owed Mr Au $10,000.\nB Correct: On Oct 5, the account was credited with Purchases $56,000, meaning Lee's firm purchased goods on credit from Mr Au.\nC Incorrect: On Oct 14, the account was debited with Cash $22,000. This debit entry represents a decrease in the liability owed to Mr Au. The journal entry is 'Dr. Mr Au; Cr. Cash', which means Lee's firm paid $22,000 in cash to Mr Au, not received cash.\nD Correct: The balance c/d is on the debit side, meaning the balance b/d on the next period will start on the credit side, representing a credit balance."},{q:5,year:2019,y:2019,top:"營商環境 —— 香港的經濟特徵",topEn:"Business Environment —— Economic Characteristics of Hong Kong",cn:"5. 下列哪項有關香港經濟的描述是正確的？\n\n(1) 對貨品零售徵收銷售稅。\n(2) 大多數勞動人口都是從事第三級產業。\n(3) 貨品出口的主要目的地是內地。\n\nA. 只有(1)\nB. 只有(2)\nC. 只有(1)及(3)\nD. 只有(2)及(3)",en:"5. Which of the following descriptions about the Hong Kong economy is/are correct?\n\n(1) A sales tax is imposed on the retailing of goods.\n(2) Most of the working population are in the tertiary sector.\n(3) The main destination of exported goods is the Mainland.\n\nA. (1) only\nB. (2) only\nC. (1) and (3) only\nD. (2) and (3) only",ans:"D",rate:"67%",exCn:"(1) 錯誤：香港實行簡單稅制，目前沒有徵收任何商品零售增值稅或銷售稅（GST/VAT）。\n(2) 正確：香港是典型的服務型經濟體，超過 90% 的本地生產總值（GDP）和勞動人口均集中在第三級產業（服務業）。\n(3) 正確：中國內地是香港商品出口（特別是轉口貿易）的最主要來源地和第一大目的地。\n因此只有 (2) 和 (3) 正確，選 D。",exEn:"(1) Incorrect: Hong Kong is known for its simple and low tax system and does not impose any sales tax or value-added tax (GST/VAT) on retail goods.\n(2) Correct: Hong Kong is a service-oriented economy, with over 90% of its GDP and employment concentrated in the tertiary sector (service industry).\n(3) Correct: Mainland China is the largest trading partner and primary destination for Hong Kong's exported and re-exported goods.\nTherefore, (2) and (3) are correct, making D the correct answer."},{q:6,year:2019,y:2019,top:"基礎會計 —— 商業交易對會計等式的影響",topEn:"Introductory Accounting —— Effects of Business Transactions on Accounting Equation",outc:true,reason:"自 2025 年起，會計等式的運算及交易事項對等式的影響，已全數移至選修部分（會計單元）第二章（Paper 2A）。",reasonEn:"Starting from 2025, the accounting equation and transaction effects are tested in the Accounting Elective Module Paper 2A.",cn:"6. 某商號購置一套定價$200000的設備。東主以私人支票支付了$50000，餘額將於稍後清還。下列哪項是這交易對會計等式的影響？\n\n| | 資產 | 資本 | 負債 |\n| :--- | :--- | :--- | :--- |\n| A. | 增加 | 增加 | 減少 |\n| B. | 增加 | 增加 | 增加 |\n| C. | 增加 | 減少 | 增加 |\n| D. | 減少 | 不變 | 增加 |",en:"6. A firm acquired a set of equipment with a list price of $200 000. The owner paid $50 000 by personal cheque and the remaining amount was to be settled later on. Which of the following are the effects of this transaction on the accounting equation?\n\n| | Assets | Capital | Liabilities |\n| :--- | :--- | :--- | :--- |\n| A. | Increase | Increase | Decrease |\n| B. | Increase | Increase | Increase |\n| C. | Increase | Decrease | Increase |\n| D. | Decrease | Unchanged | Increase |",ans:"B",rate:"64%",exCn:"我們套用會計等式：資產 = 資本 + 負債。\n1. 購置設備：設備（資產）增加 $200,000。\n2. 東主以「私人支票」支付 $50,000：這屬於東主對企業的額外注資，因此企業的資本（Capital）增加 $50,000。\n3. 餘額 $150,000 稍後清還：這屬於企業產生的「應付帳款 / 其他應付款」，因此負債（Liabilities）增加 $150,000。\n4. 最終淨影響：資產增加、資本增加、負債增加。會計等式兩邊完全平衡：+$200,000 資產 = +$50,000 資本 + +$150,000 負債。選 B。",exEn:"We apply the fundamental accounting equation: Assets = Capital + Liabilities.\n1. Acquisition of Equipment: Equipment (Asset) increases by $200,000.\n2. Paid $50,000 by owner's personal cheque: This represents a capital injection by the owner, increasing Capital by $50,000.\n3. The remaining balance of $150,000 is to be settled later: This creates a liability (Other Payables / Accounts Payable), increasing Liabilities by $150,000.\n4. Net Effect: Assets increase, Capital increases, and Liabilities increase. The accounting equation remains in perfect balance: +$200,000 (Assets) = +$50,000 (Capital) + +$150,000 (Liabilities). Thus, B is correct."},{q:7,year:2019,y:2019,top:"基礎管理 —— 主要商業功能（財務管理之角色）",topEn:"Basics of Management —— Major Business Functions (Role of Finance Department)",cn:"7. 一家公司將在市場推出新產品，公司的財務經理負責：\n\n(1) 為新產品制定售價\n(2) 為推出新產品尋求資金\n(3) 為新產品編製預算\n\nA. 只有(1)及(2)\nB. 只有(1)及(3)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"7. A company will launch a new product in the market. The finance manager of the company is responsible for:\n\n(1) formulating the price of the new product\n(2) raising funds for launching the new product\n(3) preparing budgets for the new product\n\nA. (1) and (2) only\nB. (1) and (3) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"C",rate:"67%",exCn:"(1) 錯誤：制定與微調新產品的市場零售價格（Price），屬於市場營銷（Marketing）部門的核心職掌，非財務經理之職責。\n(2) 正確：尋求與融資新產品開發及推廣所需的資金管道（籌資），屬於財務管理的核心工作。\n(3) 正確：編製資金收支預算、進行投資預算評估，是財務經理控制與規劃資金運用的重要職掌。\n因此 (2) 和 (3) 正確，選 C。",exEn:"(1) Incorrect: Formulating the price of a new product belongs to the marketing department (Price of the 4Ps), not the finance manager's responsibility.\n(2) Correct: Sourcing and acquiring the capital needed (financing/fundraising) to launch and develop a new product is a core function of the finance department.\n(3) Correct: Preparing budgets (budgetary control and planning) to coordinate cash flows is a key responsibility of financial managers.\nTherefore, (2) and (3) are correct, making C the correct answer."},{q:8,year:2019,y:2019,top:"基礎個人理財 —— 消費者信貸（借貸利率的名義與實際利率對比）",topEn:"Basics of Personal Financial Management —— Consumer Credit (Nominal vs. Effective Interest Rates of Loans)",cn:"8. 保羅借入一筆$100000為期三年的私人貸款，年利率為12%，每月複息計算。下列哪項陳述是正確的？\n\n(1) 這貸款的名義年利率為12%。\n(2) 這貸款的實際年利率高於12%。\n(3) 一般來說，私人貸款的利率較信用卡的利率為低。\n\nA. 只有(1)\nB. 只有(1)及(2)\nC. 只有(2)及(3)\nD. (1)、(2)及(3)",en:"8. Paul borrowed a 3-year personal loan of $100 000 at an annual interest rate of 12% compounded monthly. Which of the following statements are correct?\n\n(1) The nominal interest rate of this loan is 12% per annum.\n(2) The effective interest rate of this loan is higher than 12% per annum.\n(3) Generally, the interest rate of personal loans is lower than that of credit cards.\n\nA. (1) only\nB. (1) and (2) only\nC. (2) and (3) only\nD. (1), (2) and (3)",ans:"D",rate:"38%",exCn:"(1) 正確：保羅所借私人貸款的合同名義利率（Nominal rate）為每年 12%。\n(2) 正確：由於計息頻率為「每月複息（Compounded monthly）」，利息會在一年內滾存計息，其折算後的實際年利率（Effective rate）為 EAR = (1 + 12%/12)^12 - 1 = (1.01)^12 - 1 約等於 12.68%，高於名義利率 12%。\n(3) 正確：信用卡的未償還欠款利率在實務中極高（年息通常高達 30% 以上），而私人貸款（Personal loan）利率則通常遠低於此。\n因此 (1)、(2) 和 (3) 正確，選 D。",exEn:"(1) Correct: The stated contract rate of 12% per annum is the nominal interest rate.\n(2) Correct: Since interest is compounded monthly, compounding occurs 12 times a year, yielding an Effective Annual Rate (EAR) of EAR = (1 + 12%/12)^12 - 1 = (1.01)^12 - 1 approximately equals 12.68%, which is higher than the nominal rate of 12%.\n(3) Correct: In personal finance, the interest rate of credit cards is very high (often exceeding
